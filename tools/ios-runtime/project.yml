name: JournalRuntimeDev
options:
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    GENERATE_INFOPLIST_FILE: true
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_ENTITLEMENTS: Shared/Serving.entitlements
    DEVELOPMENT_TEAM: 7QCG8V4M6H
    JOURNAL_BUNDLE_IDENTIFIER: app.solstone.journal.runtime.dev
    JOURNAL_APP_GROUP: group.app.solstone.journal.runtime.dev
    SWIFT_OBJC_BRIDGING_HEADER: Shared/Bridge.h
    OTHER_LDFLAGS: $(RUST_LIB) $(BACKUP_LIB) -lc++ -lz -liconv -framework CoreFoundation -framework Foundation -framework
      Security -framework SystemConfiguration -framework Metal -framework MetalKit -framework Accelerate
    ENABLE_DEBUG_DYLIB: false
    OTHER_CODE_SIGN_FLAGS: --keychain /Users/jer/Library/Keychains/sol-signing.keychain-db
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.0.1
    TARGETED_DEVICE_FAMILY: 1,2
targets:
  JournalRuntimeDev:
    type: application
    platform: iOS
    sources:
    - Host
    - Shared
    - path: Resources/JournalPayload
      type: folder
      buildPhase: resources
    - path: Resources/AudioModels
      type: folder
      buildPhase: resources
    - path: Resources/BackupRuntime
      type: folder
      buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JOURNAL_BUNDLE_IDENTIFIER)
        EX_ENABLE_EXTENSION_POINT_GENERATION: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
    dependencies:
    - sdk: ExtensionFoundation.framework
    - target: JournalWorker
      embed: true
    - target: Appraisal
      embed: true
  JournalWorker:
    type: extensionkit-extension
    platform: iOS
    sources:
    - Helper
    - Shared
    - path: Resources/JournalPayload
      type: folder
      buildPhase: resources
    - path: Resources/BackupRuntime
      type: folder
      buildPhase: resources
    dependencies:
    - sdk: ExtensionFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JOURNAL_BUNDLE_IDENTIFIER).worker
        EX_ENABLE_EXTENSION_POINT_GENERATION: true
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
  Appraisal:
    type: extensionkit-extension
    platform: iOS
    sources:
    - Appraisal
    - Shared/Identity.swift
    dependencies:
    - sdk: ExtensionFoundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JOURNAL_BUNDLE_IDENTIFIER).gpu-appraisal
        EX_ENABLE_EXTENSION_POINT_GENERATION: true
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        LD_RUNPATH_SEARCH_PATHS: ''
        OTHER_LDFLAGS: $(APPRAISAL_LIB) $(NVAT_LIB) -lc++ -lz -liconv -framework Foundation -framework Security -framework SystemConfiguration -framework CoreFoundation
schemes:
  JournalRuntimeDev:
    build:
      targets:
        JournalRuntimeDev: all
