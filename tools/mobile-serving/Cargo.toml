[package]
name = "journal-mobile-serving"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace]

[features]
full-tests = ["solstone-core-backup-web/full-tests"]
audio-native = ["audio", "journal-mobile-audio/native"]
audio = ["dep:journal-mobile-audio", "dep:sha2", "dep:solstone-core-transcribe"]
processing = [
    "dep:sha2",
    "dep:solstone-core-sense",
    "dep:solstone-core-think-cli",
    "dep:solstone-core-depict",
    "dep:solstone-core-system",
    "dep:solstone-core-transcribe",
    "dep:solstone-core-journal-config",
    "dep:solstone-core-cortex-client",
    "dep:solstone-core-generate",
    "dep:chrono",
    "dep:chrono-tz",
    "dep:solstone-core-facets",
    "dep:solstone-core-speaker-resolve",
    "dep:solstone-core-speakers",
]

[dependencies]
axum = { version = "0.8.9", default-features = false }
serde_json = "1"
log = "0.4"
solstone-core-backup-web = { path = "../../core/crates/solstone-core-backup-web" }
solstone-core-backup-runtime = { path = "../../core/crates/solstone-core-backup-runtime" }
solstone-core-backup = { path = "../../core/crates/solstone-core-backup" }
solstone-core-maintenance = { path = "../../core/crates/solstone-core-maintenance" }
solstone-core-spl = { path = "../../core/crates/solstone-core-spl" }
solstone-core-mcp-endpoint = { path = "../../core/crates/solstone-core-mcp-endpoint" }
solstone-core-convey-shell = { path = "../../core/crates/solstone-core-convey-shell" }
solstone-core-indexer-store = { path = "../../core/crates/solstone-core-indexer-store" }
solstone-core-journal-io = { path = "../../core/crates/solstone-core-journal-io" }
solstone-core-journal-config-write = { path = "../../core/crates/solstone-core-journal-config-write" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
journal-mobile-audio = { path = "../mobile-audio", optional = true, default-features = false }
solstone-core-transcribe = { path = "../../core/crates/solstone-core-transcribe", features = ["embedded"], optional = true }
solstone-core-callosum = { path = "../../core/crates/solstone-core-callosum" }
solstone-core-brain-owner = { path = "../../core/crates/solstone-core-brain-owner" }
solstone-core-cortex = { path = "../../core/crates/solstone-core-cortex" }
solstone-core-generate-wire = { path = "../../core/crates/solstone-core-generate-wire" }
sha2 = { version = "0.10", optional = true }
solstone-core-sense = { path = "../../core/crates/solstone-core-sense", optional = true }
solstone-core-think-cli = { path = "../../core/crates/solstone-core-think-cli", optional = true }
solstone-core-depict = { path = "../../core/crates/solstone-core-depict", optional = true }
solstone-core-system = { path = "../../core/crates/solstone-core-system", optional = true }
solstone-core-journal-config = { path = "../../core/crates/solstone-core-journal-config", optional = true }
solstone-core-cortex-client = { path = "../../core/crates/solstone-core-cortex-client", optional = true }
solstone-core-generate = { path = "../../core/crates/solstone-core-generate", optional = true }
chrono = { version = "0.4", optional = true }
chrono-tz = { version = "0.10", optional = true }
solstone-core-facets = { path = "../../core/crates/solstone-core-facets", optional = true }
solstone-core-speaker-resolve = { path = "../../core/crates/solstone-core-speaker-resolve", optional = true }
solstone-core-speakers = { path = "../../core/crates/solstone-core-speakers", optional = true }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["api-24", "std"] }

# iOS links the pinned static runtime into its app executable.
[target.'cfg(not(target_os = "ios"))'.dependencies]
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic"] }

[dev-dependencies]
tempfile = "3"
solstone-core-system = { path = "../../core/crates/solstone-core-system" }
solstone-core-installed-payload = { path = "../../core/crates/solstone-core-installed-payload" }

[patch.crates-io]
ffmpeg-sys-next = { path = "../../core/vendor/ffmpeg-sys-next" }
