[package]
name = "android-journal-runtime"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace]

[lib]
crate-type = ["cdylib"]

[features]
full-tests = []

[dependencies]
journal-mobile-serving = { path = "../../mobile-serving", features = ["audio-native", "processing", "rfdetr-native", "in-process-pdf"] }
solstone-core-journal-io = { path = "../../../core/crates/solstone-core-journal-io", features = ["test-hooks"] }
solstone-core-indexer-store = { path = "../../../core/crates/solstone-core-indexer-store" }
solstone-core-indexer-query = { path = "../../../core/crates/solstone-core-indexer-query" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
solstone-core-generate = { path = "../../../core/crates/solstone-core-generate" }
solstone-core-generate-wire = { path = "../../../core/crates/solstone-core-generate-wire" }
solstone-core-talent-runtime = { path = "../../../core/crates/solstone-core-talent-runtime" }
solstone-core-spp-ratls = { path = "../../../core/crates/solstone-core-spp-ratls" }
solstone-core-spp-attest = { path = "../../../core/crates/solstone-core-spp-attest" }
solstone-core-backup-runtime = { path = "../../../core/crates/solstone-core-backup-runtime" }
chrono = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
libc = "0.2"

ort = { version = "=2.0.0-rc.12", default-features = false, features = ["load-dynamic", "std"] }

[patch.crates-io]
ffmpeg-sys-next = { path = "../../../core/vendor/ffmpeg-sys-next" }
