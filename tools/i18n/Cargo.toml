[package]
name = "i18n-catalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
publish = false

[workspace]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
fluent-syntax = "=0.12.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
