schema_version = 1
dependency_files = [
  "pyproject.toml",
  "packages/*/pyproject.toml",
]
content_roots = [
  "Makefile",
  "packages",
  "scripts",
  "solstone",
]
content_exclusions = [
  "scripts/check_conversion_retirements.py",
  "scripts/check_convey_bind_imports_clean.py",
  "scripts/check_wheel_contents.py",
  "scripts/check_cogitate_cutover.py",
]

[[waves]]
id = "W1b-discovery-kernel"
status = "done"
distribution = "scikit-learn"
python_roots = []
import_roots = ["sklearn"]
# The frozen differential oracle remains a developer test dependency. It is
# outside every built or shipped package and may not be widened to an extra.
test_only_dependency_locations = [
  "pyproject.toml:dependency-groups.dev",
]

[[waves]]
id = "spl-home-service"
status = "done"
distribution = "pyhpke"
python_roots = ["solstone/think/spl"]
import_roots = ["pyhpke"]
test_only_dependency_locations = []

[[waves]]
id = "R6b-2-cogitate-openhands-sdk"
status = "done"
distribution = "openhands-sdk"
python_roots = [
  "solstone/think/providers/openhands.py",
  "solstone/think/providers/emit_final_tool.py",
  "solstone/think/providers/read_tools.py",
  "solstone/think/cogitate_read_tools.py",
]
import_roots = ["openhands"]
test_only_dependency_locations = []

[[waves]]
id = "R6b-2-cogitate-litellm"
status = "done"
distribution = "litellm"
python_roots = []
import_roots = ["litellm"]
test_only_dependency_locations = []

[[waves]]
id = "AJ-C-config-cli"
status = "in_progress"
# First-party Python-process retirement only: this wave retires no PyPI
# distribution. `content_roots` intentionally excludes `core/`, so this
# manifest proves removal from shipped Python content, not the Rust
# replacement. Flip to status = "done" once config_cli.py is deleted.
distribution = "first-party-only"
python_roots = ["solstone/think/config_cli.py"]
import_roots = ["solstone.think.config_cli"]
test_only_dependency_locations = []
