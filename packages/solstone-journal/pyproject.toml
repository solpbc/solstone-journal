# Hand-maintained leaf package. Only `version`, the `solstone[journal-host]==`
# pin, and the native helper pins are rewritten by
# scripts/render_packaging.py (`make render-packaging`); everything else is
# edited here directly.
[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solstone-journal"
description = "the journal — the memory sol keeps for you, on a computer you choose. Installs the journal service and includes sol."
readme = {text = "the journal — the memory sol keeps for you, on a computer you choose. Installs the journal service and includes sol.\n\n    pip install solstone-journal\n\nSee https://github.com/solpbc/solstone-journal.", content-type = "text/markdown"}
version = "1.0.22"
requires-python = ">=3.12"
dependencies = [
    "solstone[journal-host]==1.0.22",
    # Native speaker analysis helper: same host coverage as the packaged helper
    # wheels, while dev sync prunes the workspace build through [tool.uv].
    "solstone-core-speakers-analyze==1.0.22; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "solstone-core-speakers-analyze==1.0.22; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "solstone-core-speakers-analyze==1.0.22; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Describe currently ships only Linux wheels; macOS FFmpeg notarization is
    # separately scoped native release work.
    "solstone-core-describe==1.0.22; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "solstone-core-describe==1.0.22; sys_platform == 'linux' and platform_machine == 'aarch64'",
    # CPU ONNX runtime: covers VAD, diarization, and the WeSpeaker embedder;
    # !=1.24.1 across the board (known-bad wheel).
    "onnxruntime>=1.20.0,!=1.24.1",
    # Linux/x86_64 keeps the higher floor for current VAD/diarization/WeSpeaker
    # wheel behavior; scripts/check_extras_consistency.py pins this floor.
    "onnxruntime>=1.25.0,!=1.24.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
journal = "solstone.think.sol_cli:journal_main"
mlx-vlm-server = "solstone.think.providers.mlx_server:main"
solstone-generate-wire = "solstone.think.generate_wire:main"

[tool.setuptools]
packages = []
py-modules = []

[tool.uv.sources]
solstone = {workspace = true}
