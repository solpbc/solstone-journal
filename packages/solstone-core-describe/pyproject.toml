[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "solstone-core-describe"
version = "1.0.22"
description = "Native video frame description helper for solstone"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-only"}

[tool.maturin]
bindings = "bin"
manifest-path = "../../core/crates/solstone-core-describe/Cargo.toml"
profile = "release"
strip = true

[tool.uv]
cache-keys = [
  {file = "pyproject.toml"},
  {file = "../../core/Cargo.toml"},
  {file = "../../core/Cargo.lock"},
  {file = "../../core/crates/**/Cargo.toml"},
  {file = "../../core/crates/**/*.rs"},
  {file = "../../core/fixtures/**"},
  {file = "../../solstone/observe/describe.md"},
  {file = "../../solstone/observe/describe.schema.json"},
  {file = "../../solstone/observe/extract.md"},
  {file = "../../solstone/observe/extract.schema.json"},
  {file = "../../solstone/observe/categories/*.md"},
  {file = "../../solstone/observe/categories/*.schema.json"},
]
