[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "solstone-core"
version = "1.0.22"
description = "solstone helper binary. Linux wheels are tagged manylinux2014 / glibc 2.17+, while the binary is fully static and has no libc runtime dependency; Alpine installs fall back to the sdist and cargo."
requires-python = ">=3.12"
license = {text = "AGPL-3.0-only"}

[tool.maturin]
bindings = "bin"
manifest-path = "../../core/crates/solstone-core/Cargo.toml"
profile = "release"
strip = true

[tool.solstone-release]
target-family = "core"
sdist = true

# This package's build inputs live outside its directory (see manifest-path).
# uv's default cache key for a path dependency is this pyproject.toml alone, so
# a Rust-only change left `uv sync` reporting "no changes" and the environment
# kept serving the previously built binary — anything that then invoked
# .venv/bin/solstone-core was exercising stale native code. Declaring the real
# inputs makes uv rebuild when they move. `[tool.uv]` is never published, so
# wheel metadata is unaffected. Keep core/target/ out of the list: the build
# writes it, and keying on it would leave every sync permanently dirty. The
# `.rust-core-hash` stamp in the Makefile is the other half — it is what makes
# `make install` run a `uv sync` at all after a Rust-only change.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "../../core/Cargo.toml" },
    { file = "../../core/Cargo.lock" },
    { file = "../../core/crates/**/Cargo.toml" },
    { file = "../../core/crates/**/*.rs" },
    { file = "../../core/fixtures/**" },
]
