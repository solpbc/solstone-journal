# Hand-maintained leaf package. Only `version`, the `solstone[journal-host]==`
# pin, native helper pins, and the solstone-core-speakers-analyze pins are rewritten by
# scripts/render_packaging.py (`make render-packaging`); everything else is
# edited here directly.
[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solstone-journal-cuda"
description = "the journal with the NVIDIA CUDA transcription runtime — the memory sol keeps for you, on a computer you choose. Installs the journal service and includes sol."
readme = {text = "the journal with the NVIDIA CUDA transcription runtime — the memory sol keeps for you, on a computer you choose. Installs the journal service and includes sol.\n\n    pip install solstone-journal-cuda\n\nSee https://github.com/solpbc/solstone-journal.", content-type = "text/markdown"}
version = "1.0.22"
requires-python = ">=3.12"
dependencies = [
    "solstone[journal-host]==1.0.22",
    "solstone-core==1.0.22; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "solstone-core==1.0.22; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "solstone-core==1.0.22; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "solstone-core-journal==1.0.22; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "solstone-core-journal==1.0.22; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "solstone-core-journal==1.0.22; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # `journal depict` replaces the process directly with this native helper.
    "solstone-core-depict==1.0.22; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "solstone-core-depict==1.0.22; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "solstone-core-depict==1.0.22; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Native describe helper: every journal install must provide the sibling
    # dispatched by `journal describe`.
    "solstone-core-describe==1.0.22; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "solstone-core-describe==1.0.22; sys_platform == 'linux' and platform_machine == 'aarch64'",
    # Native retention executor: every owner-data removal routes through this
    # binary, so the journal leaf owns making it available on PATH.
    "solstone-core-retention==1.0.22; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "solstone-core-retention==1.0.22; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "solstone-core-retention==1.0.22; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Native speaker analysis helper: same host coverage as the packaged helper
    # wheels, while dev sync prunes the workspace build through [tool.uv].
    "solstone-core-speakers-analyze==1.0.22; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "solstone-core-speakers-analyze==1.0.22; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "solstone-core-speakers-analyze==1.0.22; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "solstone-core-vulkan-probe==1.0.22; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "solstone-core-vulkan-probe==1.0.22; sys_platform == 'linux' and platform_machine == 'aarch64'",
    # GPU ONNX runtime (NVIDIA / Linux x86_64): the GPU wheel supplies the
    # `onnxruntime` namespace (incl. CPU providers) for VAD, diarization, and
    # WeSpeaker. Never co-install with the CPU `solstone-journal` leaf — both own
    # the same `onnxruntime/` import dir and clobber each other.
    "onnxruntime-gpu>=1.25.0",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cublas-cu12",
    "nvidia-cufft-cu12",
    "nvidia-curand-cu12",
    "nvidia-cuda-nvrtc-cu12",
    "nvidia-nvjitlink-cu12",
]

[project.scripts]
mlx-vlm-server = "solstone.think.providers.mlx_server:main"

[tool.setuptools]
packages = []
py-modules = []
script-files = ["scripts/journal"]

[tool.uv.sources]
solstone = {workspace = true}
solstone-core = {workspace = true}
solstone-core-journal = {workspace = true}
solstone-core-depict = {workspace = true}
solstone-core-describe = {workspace = true}
solstone-core-retention = {workspace = true}
solstone-core-vulkan-probe = {workspace = true}
