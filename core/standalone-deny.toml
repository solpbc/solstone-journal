# Advisory policy for the independently locked tools listed in the Makefile.
# The workspace keeps its own stricter policy in deny.toml.
[advisories]
yanked = "deny"
ignore = [
    # 2026-10-26: mobile-serving and the android and ios native runtimes reach the
    # same bounded hostname precheck as the workspace. See deny.toml for the call-site rationale and revisit rule.
    { id = "RUSTSEC-2026-0119", reason = "hickory-proto 0.24.4 only encodes bounded single-question stub lookups in the shared hostname precheck; revisit on resolver or query-surface changes" },
    # 2026-11-12: the same three graphs reach hickory-proto 0.24.4's zone-file
    # parser advisories (not compiled: no text-parsing feature) and its
    # header-count decode reservation (bounded precheck). See deny.toml.
    { id = "RUSTSEC-2026-0487", reason = "zone-file text parser panic; hickory-proto 0.24.4 built without text-parsing, code not compiled; revisit with RUSTSEC-2026-0119" },
    { id = "RUSTSEC-2026-0489", reason = "zone-file text parser panic; hickory-proto 0.24.4 built without text-parsing, code not compiled; revisit with RUSTSEC-2026-0119" },
    { id = "RUSTSEC-2026-0490", reason = "zone-file lexer panic; hickory-proto 0.24.4 built without text-parsing, code not compiled; revisit with RUSTSEC-2026-0119" },
    { id = "RUSTSEC-2026-0491", reason = "header-count decode reservation is a bounded, non-cumulative transient allocation in the shared hostname check (owner-requested, and every 60 s while a BYO hostname is configured); revisit with RUSTSEC-2026-0119" },
    # 2026-11-12: the same three graphs reach DNSSEC validation advisories in
    # hickory-proto/resolver 0.24.4. All standalone audit graphs leave DNSSEC
    # features disabled, including with all features enabled. Re-check at
    # release-cut and weekly advisory audits; rationale and revisit rule in deny.toml.
    { id = "RUSTSEC-2026-0505", reason = "hickory-proto 0.24.4 NSEC3 zone validation defect; DNSSEC features disabled, affected code not compiled; revisit on DNSSEC enablement, resolver changes or a compatible patch" },
    { id = "RUSTSEC-2026-0511", reason = "hickory-proto 0.24.4 empty-non-terminal DNSSEC validation defect; DNSSEC features disabled, affected code not compiled; revisit on DNSSEC enablement, resolver changes or a compatible patch" },
    { id = "RUSTSEC-2026-0512", reason = "hickory-proto 0.24.4 unrelated-RRset DNSSEC validation defect; DNSSEC features disabled, affected code not compiled; revisit on DNSSEC enablement, resolver changes or a compatible patch" },
    { id = "RUSTSEC-2026-0514", reason = "hickory-resolver 0.24.4 bogus-answer acceptance with DNSSEC validation enabled; DNSSEC features disabled; revisit on DNSSEC enablement, resolver changes or a compatible patch" },
    # 2026-11-14: RUSTSEC-2026-0530 and -0531, the same class (see deny.toml).
    { id = "RUSTSEC-2026-0530", reason = "hickory-proto 0.24.4 parent-side NSEC at a zone cut accepted as nonexistence proof; DNSSEC features disabled, affected code not compiled; revisit on DNSSEC enablement, resolver changes or a compatible patch" },
    { id = "RUSTSEC-2026-0531", reason = "hickory-proto 0.24.4 child-side NSEC/NSEC3 accepted as no-DS proof; DNSSEC features disabled, affected code not compiled; revisit on DNSSEC enablement, resolver changes or a compatible patch" },
    # 2026-10-26: paste 1.0.15 is a build-time macro dependency of pulp/gemm
    # in OCR and native inference. No patched release exists. Replacing that
    # transitive dependency requires an upstream change or a reviewed fork.
    # Revisit when those dependencies migrate or a vulnerability is reported.
    # https://rustsec.org/advisories/RUSTSEC-2024-0436
    { id = "RUSTSEC-2024-0436", reason = "unmaintained build-time paste macro in OCR/native inference dependencies; no patched release; revisit on upstream migration or a vulnerability advisory" },
    # 2026-10-26: ttf-parser 0.25.1 is reached by ab_glyph/imageproc in the
    # independent OCR helper. The helper does not use text drawing or load
    # fonts. No patched release exists; changing the transitive parser requires
    # an upstream migration. Revisit on imageproc/ab_glyph changes, font input,
    # or a vulnerability advisory.
    # https://rustsec.org/advisories/RUSTSEC-2026-0192
    { id = "RUSTSEC-2026-0192", reason = "unmaintained ttf-parser via imageproc/ab_glyph in the OCR helper; no font loading or drawing call sites and no patched release; revisit on dependency, input or vulnerability changes" },
]

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "x86_64-apple-ios",
    "aarch64-linux-android",
    "x86_64-linux-android",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
