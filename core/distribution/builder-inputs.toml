# bindgen loads libclang while Rust compiles the FFmpeg-bearing PEs. The
# official LLVM archive is necessary because the controlled host intentionally
# has no ambient libclang installation; the driver uses only its recorded
# libclang directory and never substitutes clang for MSVC.
[ffmpeg_windows_llvm]
