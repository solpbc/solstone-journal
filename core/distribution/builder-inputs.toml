# This offline-only subset is the controlled Windows FFmpeg build substrate.
# The native host has MSVC, but deliberately does not carry MSYS2/GNU make,
# NASM, or libclang as ambient build state. The driver verifies and transfers
# these archives into one fresh network-denied slot instead of installing them
# on the host or falling back to whatever happens to be on PATH.
[ffmpeg_windows_msys2_base]
version = "2026-06-11"
filename = "msys2-base-x86_64-20260611.tar.xz"
url = "https://github.com/msys2/msys2-installer/releases/download/2026-06-11/msys2-base-x86_64-20260611.tar.xz"
