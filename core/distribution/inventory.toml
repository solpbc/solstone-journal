kind = "launcher"
source = "scripts/root-launchers/solstone"
dest = "bin/solstone"
mode = 0o755
targets = ["linux-x86_64", "linux-aarch64", "macos-arm64"]

[[entry]]
kind = "launcher"
source = "scripts/root-launchers/journal"
