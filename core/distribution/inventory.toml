version = 1
product = "solstone-journal"
payload = "payload.txt"
payload_dest_prefix = "share"
# Where payload.txt's paths are rooted in the repository. The payload is the
# product data the shipped binary reads at runtime, so it is not part of the
# Python package tree even though its installed layout keeps the `solstone/`
# name; `core/payload` is the checkout's stand-in for the installed `share/`
# prefix, which is what lets one set of paths describe both.
#
# Note the two `source` conventions in this file: `[[entry]].source` is
# repository-root-relative and payload.txt's lines are `payload_src_root`-
# relative. Nothing in the syntax distinguishes them.
payload_src_root = "core/payload"

[artifact]
basename = "solstone-journal-{version}-{os}-{arch}"

# The macOS signing contract. Relocated out of scripts/release_tool_pins.py,
# which the wheel rail took with it: the producer and the machinery that signs
# its output are on the same side of this plate's Python boundary, so the pins
# belong to the inventory rather than to an importable module.
[apple]
team_id = "7QCG8V4M6H"
app_identity = "Developer ID Application: sol pbc (7QCG8V4M6H)"
installer_identity = "Developer ID Installer: sol pbc (7QCG8V4M6H)"
notary_profile = "sol-pbc-notary"
keychain = "~/Library/Keychains/sol-signing.keychain-db"
pkg_identifier = "app.solstone.journal"
# /usr is SIP-protected on macOS; /usr/local is the writable system prefix and
# /usr/local/bin is on the default PATH through /etc/paths, which is what puts
# `journal` where the sense dispatcher can spawn it by name.
install_location = "/usr/local"
codesign_path = "/usr/bin/codesign"
xcode = "Xcode 26.6"
notarytool = "1.1.2 (41)"

[[target]]
id = "linux-x86_64"
os = "linux"
arch = "x86_64"
deb_arch = "amd64"
rpm_arch = "x86_64"
triple_musl = "x86_64-unknown-linux-musl"
triple_gnu = "x86_64-unknown-linux-gnu"
zig_gnu = "x86_64-linux-gnu.2.27"

[[target]]
id = "linux-aarch64"
os = "linux"
arch = "aarch64"
deb_arch = "arm64"
rpm_arch = "aarch64"
triple_musl = "aarch64-unknown-linux-musl"
triple_gnu = "aarch64-unknown-linux-gnu"
zig_gnu = "aarch64-linux-gnu.2.27"

# macOS builds natively on Apple hardware with Apple's own toolchain, so it has
# exactly one lane and the lane is a property of the target rather than of each
# binary. The per-entry `lane` below distinguishes the two Linux cross
# toolchains and has no macOS analogue; `Target::lane_for` reads this field
# instead for a macos target, so one place owns the answer.
[[target]]
id = "macos-arm64"
os = "macos"
arch = "arm64"
lane = "apple-native"
triple_apple = "aarch64-apple-darwin"
# The macOS analogue of the Linux GLIBC 2.27 ceiling: every shipped Mach-O must
# declare a deployment target at or below this or it refuses to launch on the
# oldest macOS we claim.
min_macos = "14.0"

# Windows target is declared so inventory validation owns the field set. No
# production entry is admitted for it yet; Windows dests live in
# synthetic test inventories only.
[[target]]
id = "windows-x86_64"
os = "windows"
arch = "x86_64"
lane = "msvc-native"
triple_windows = "x86_64-pc-windows-msvc"

[[entry]]
kind = "bin"
package = "solstone-core"
bin = "solstone-core"
dest = "bin/solstone-core"
mode = 0o755
lane = "musl-static"
targets = ["linux-x86_64", "linux-aarch64", "macos-arm64"]

[[entry]]
kind = "bin"
package = "solstone-core-journal-bin"
bin = "solstone-core-journal"
dest = "bin/solstone-core-journal"
