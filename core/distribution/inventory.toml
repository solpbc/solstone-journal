[[cleanroom.subject]]
id = "debian-bookworm-no-python"
image = "debian:bookworm-slim"
digest = "sha256:362e64223cc0da95422b3b13c045186fc0a81250e765d31c025fbddf257f6143"
network = "none"
python = false
control = false
roles = ["tar", "deb", "talent", "speakers", "pdf"]
required_tools = ["sh", "tar", "sha256sum", "dpkg", "dd", "od"]
forbidden_tools = ["python", "python3", "pip", "maturin"]
mounts = ["artifacts:ro", "cleanroom.sh:ro", "scan-python.sh:ro", "producer:ro", "fixture.pdf:ro"]
entry_command = "sh /cleanroom.sh --inside <role>"
expected = ["fresh-journal-loop", "daily_schedule-output", "speaker-response", "pdf-import-output", "python-scan-zero"]

