[advisories]
# cargo-deny here is `make audit`, not `make ci` / `ci-full`. The weekly fleet
# audit is the only place this section is evaluated. RUSTSEC-2023-0071 is
# decided, not open: rsa is one-time RSA-4096 keygen in
# solstone-core-support-portal; every attacker-observable RS256 signature uses
# ring. The workspace `rsa` pin in Cargo.toml carries the same rationale.
# RUSTSEC-2026-0192 is the same shape: ttf-parser is unmaintained, there is no
# safe upgrade, and the only reach is pdf-extract as a facets-web
# dev-dependency that extracts text from PDFs this crate generated. No
# production path loads it.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa is used only for one-time key generation; ring signs every attacker-observable RS256 path" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is reached only through pdf-extract, a facets-web dev-dependency that extracts text from PDFs this crate generated; no production reach and no safe upgrade" },
]

[licenses]
# Protects Rust crates from unreviewed license drift while allowing approved licenses.
allow = [
    "MIT",
    # via borrow-or-share (transitive dependency of jsonschema).
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "AGPL-3.0-only",
    # via ffmpeg-next / ffmpeg-sys-next (the safe FFmpeg decode wrapper and bindings).
    "WTFPL",
    # via webpki-roots (the Mozilla CA bundle; permissive data license). Mirrors
    # spl-rust's dependency-policy rationale for the same crate.
    "CDLA-Permissive-2.0",
    # via doctest-file and recvmsg (transitive dependencies of interprocess, the
    # Windows Callosum named-pipe transport). OSI-approved public-domain-equivalent.
    "0BSD",
]

[bans]
# Protects against third-party wildcard requirements while allowing unpublished internal path crates, and bans Python runtime bindings.
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "pyo3" },
    { name = "pyo3-ffi" },
    { name = "cpython" },
    { name = "aws-lc-rs" },
    { name = "aws-lc-sys" },
{ name = "solstone-core-journal-io", wrappers = ["solstone-core-journal-archive", "solstone-core-distribution", "solstone-core-segment", "solstone-core-sol-link", "solstone-core-entity", "solstone-core-ingest-resolve", "solstone-core-depict", "solstone-core-describe", "solstone-core-sense", "solstone-core-callosum", "solstone-core-cortex", "solstone-core-cortex-client", "solstone-core-convey-shell", "solstone-core-records-web", "solstone-core-facets", "solstone-core-retention", "solstone-core-retention-cli", "solstone-core-transcribe", "solstone-core-brain", "solstone-core-identity", "solstone-core-grab", "solstone-core-journal-cli", "solstone-core-journal-config-write", "solstone-core-journal-config", "solstone-core-speaker-id", "solstone-core-speaker-resolve", "solstone-core-system", "solstone-core-system-health", "solstone-core-body-ingest", "solstone-core-body-rebuild", "solstone-core-transfer", "solstone-core-clients-web", "solstone-core-import", "solstone-core-import-host", "solstone-core-import-sources", "solstone-core", "solstone-core-backfill-cli", "solstone-core-journal-stats-cli", "solstone-core-backup-runtime", "solstone-core-offload", "solstone-core-transcripts", "solstone-core-transcripts-web", "solstone-core-think-cli", "solstone-core-talents", "solstone-core-talent-cli", "solstone-core-talent-runtime", "solstone-core-spl", "solstone-core-setup", "solstone-core-settings-web", "solstone-core-operational-logs", "solstone-core-maintenance", "solstone-core-import-web", "solstone-core-facets-web", "solstone-core-convey-config", "solstone-core-convey-body", "solstone-core-backup", "solstone-core-support-portal", "solstone-core-support-drafts", "solstone-core-stats-web", "solstone-core-push", "solstone-core-mcp-endpoint", "solstone-core-mcp-audit", "solstone-core-health-web", "solstone-core-home", "solstone-core-timeline"], reason = "journal I/O primitives are restricted to named authorities: archive's capability-rooted traversal and publication; distributio