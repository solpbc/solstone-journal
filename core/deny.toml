[licenses]
# Protects Rust crates from unreviewed license drift while allowing approved licenses.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "AGPL-3.0-only",
    # via ffmpeg-next / ffmpeg-sys-next (the safe FFmpeg decode wrapper and bindings).
    "WTFPL",
    # via webpki-roots (the Mozilla CA bundle; permissive data license). Mirrors
    # spl-rust's dependency-policy rationale for the same crate.
    "CDLA-Permissive-2.0",
]

[bans]
# Protects against third-party wildcard requirements while allowing unpublished internal path crates, and bans Python runtime bindings.
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "pyo3" },
    { name = "pyo3-ffi" },
    { name = "cpython" },
    { name = "aws-lc-rs" },
    { name = "aws-lc-sys" },
    { name = "solstone-core-journal-io", wrappers = ["solstone-core-segment", "solstone-core-sol-client", "solstone-core-sol-link", "solstone-core-entity", "solstone-core-ingest-resolve", "solstone-core-depict", "solstone-core-callosum", "solstone-core-facets", "solstone-core-retention", "solstone-core-brain", "solstone-core-journal-config-write"], reason = "durable journal I/O primitives are owned by the native segment write door, sol-client and local-link security authorities, the entity-store and facet-store authorities, the ingest-manifest and quarantine writer authority, the still-image depiction writer, the durable event-append authority, the brain read/write authority, the configuration-write CAS authority, and the retention executor -- the sole remover of owner media -- in this wave" },
]

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "aarch64-apple-ios",
]

[sources]
# Protects Rust dependencies from unapproved registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/solpbc/spl-rust"]
