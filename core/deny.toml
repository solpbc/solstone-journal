[advisories]
yanked = "deny"
# cargo-deny here is `make audit`, not `make ci` / `ci-full`. Each release cut
# and the weekly fleet audit evaluate this section.
ignore = [
    # Product engineering compatibility exception, 2026-09-28: hickory-proto
    # 0.24.4 via hickory-resolver 0.24.4. RUSTSEC-2026-0119 affects versions
    # >=0.3.1 and <0.26.1: encoding a DNS message with many records can take
    # quadratic CPU time. This product uses the resolver only to send bounded,
    # single-question A/AAAA/CNAME/CAA lookups for a hostname precheck; it does
    # not encode untrusted multi-record messages, and lookup errors refuse the
    # precheck. The patched 0.26.1 line requires a DNSSEC rewrite that did not
    # pass product review. Revisit if a compatible patched resolver is available
    # or this use grows beyond the bounded stub-client queries.
    # Upstream: https://rustsec.org/advisories/RUSTSEC-2026-0119
    { id = "RUSTSEC-2026-0119", reason = "sol pbc product engineering: hickory-proto 0.24.4 only encodes bounded single-question stub lookups, not attacker-supplied multi-record messages; patched 0.26.1 requires an unaccepted DNSSEC rewrite" },
    # Product engineering compatibility exception, 2026-11-12: three more
    # hickory-proto 0.24.4 advisories, patched only in 0.26.2 (the same DNSSEC
    # rewrite as RUSTSEC-2026-0119). RUSTSEC-2026-0487, -0489 and -0490 are
    # panics in the zone-file text parser (SVCB/HTTPS `alpn` values, a lone
    # quote, a 4096-character token). That parser is the `text-parsing`
    # feature, which this graph does not enable: hickory-resolver is built with
    # default features off and `tokio-runtime` only, so the code is not
    # compiled. RUSTSEC-2026-0491 is wire decoding: a response whose header
    # claims 65,535 records makes the decoder reserve that capacity (about
    # 18 MB) before it fails. The hostname check sends a few bounded
    # single-question UDP queries to the system resolver under a 5 s timeout:
    # when the owner asks, and every 60 s in the background while a BYO
    # hostname is configured (byo_door.rs). Within a window the client keeps
    # reading after a failed decode, so spoofed replies can repeat the
    # reservation, but each failed decode frees its buffer and the peak is
    # bounded by the concurrent requests (about 2 x 18 MB), never cumulative.
    # Anyone able to inject those replies can already fail the check and
    # unbind ingress. Revisit with RUSTSEC-2026-0119: a compatible patched
    # resolver, the 0.26 migration, any growth beyond the bounded stub-client
    # queries, or anything that enables hickory's text-parsing feature.
    # Upstream: https://rustsec.org/advisories/RUSTSEC-2026-0487 (-0489, -0490, -0491)
    { id = "RUSTSEC-2026-0487", reason = "sol pbc product engineering: zone-file text parser panic; hickory-proto 0.24.4 is built without the text-parsing feature, so the code is not compiled; patched 0.26.2 requires an unaccepted DNSSEC rewrite" },
    { id = "RUSTSEC-2026-0489", reason = "sol pbc product engineering: zone-file text parser panic; hickory-proto 0.24.4 is built without the text-parsing feature, so the code is not compiled; patched 0.26.2 requires an unaccepted DNSSEC rewrite" },
    { id = "RUSTSEC-2026-0490", reason = "sol pbc product engineering: zone-file lexer panic; hickory-proto 0.24.4 is built without the text-parsing feature, so the code is not compiled; patched 0.26.2 requires an unaccepted DNSSEC rewrite" },
    { id = "RUSTSEC-2026-0491", reason = "sol pbc product engineering: header-count capacity reservation on decode is a bounded, non-cumulative transient allocation in the 5 s single-question hostname check (owner-requested, and every 60 s while a BYO hostname is configured); patched 0.26.2 requires an unaccepted DNSSEC rewrite" },
    # Product engineering compatibility exceptions, 2026-11-12: DNSSEC
    # validation defects in hickory-proto/resolver 0.24.4. Neither crate enables
    # dnssec, dnssec-ring or dnssec-openssl in the workspace or any standalone
    # audit graph, including with all features enabled. The affected DNSSEC
    # validation code is not compiled. The 0.26.2 migration requires the same
    # unaccepted DNSSEC rewrite as RUSTSEC-2026-0119. Re-check the feature
    # boundary at release-cut and weekly advisory audits; revisit if DNSSEC
    # is enabled, resolver usage changes, or a compatible patched release exists.
    # Upstream: https://rustsec.org/advisories/RUSTSEC-2026-0505
    # https://rustsec.org/advisories/RUSTSEC-2026-0511
    # https://rustsec.org/advisories/RUSTSEC-2026-0512
    # https://rustsec.org/advisories/RUSTSEC-2026-0514
    { id = "RUSTSEC-2026-0505", reason = "hickory-proto 0.24.4 NSEC3 zone validation defect; DNSSEC features are disabled, affected code not compiled; revisit on DNSSEC enablement, resolver changes or a compatible patch" },
    { id = "RUSTSEC-2026-0511", reason = "hickory-proto 0.24.4 empty-non-terminal DNSSEC validation defect; DNSSEC features are disabled, affected code not compiled; revisit on DNSSEC enablement, resolver changes or a compatible patch" },
    { id = "RUSTSEC-2026-0512", reason = "hickory-proto 0.24.4 unrelated-RRset DNSSEC validation defect; DNSSEC features are disabled, affected code not compiled; revisit on DNSSEC enablement, resolver changes or a compatible patch" },
    { id = "RUSTSEC-2026-0514", reason = "hickory-resolver 0.24.4 bogus-answer acceptance with DNSSEC validation enabled; DNSSEC features are disabled; revisit on DNSSEC enablement, resolver changes or a compatible patch" },
    # VPE exception, 2026-09-14: RUSTSEC-2024-0388 applies to derivative 2.2.0,
    # reached only through the pinned Velopack =1.2.0 Windows-installer callback
    # dependency. RustSec lists no patched derivative release; Velopack's own current
    # policy records derivative as deeply embedded with no drop-in replacement. Review
    # on every Velopack version change, or when Velopack removes its corresponding
    # exception/migrates off derivative. Upstream: rustsec.org/advisories/RUSTSEC-2024-0388
    # and github.com/velopack/velopack/blob/develop/deny.toml.
    { id = "RUSTSEC-2024-0388", reason = "VPE-approved dependency-compatibility exception for derivative 2.2.0 via pinned Velopack =1.2.0; no patched release or drop-in replacement exists" },
    # VPE exception, 2026-10-19: RUSTSEC-2024-0449 marks unsafe-libyaml 0.2.11
    # unmaintained (upstream archived; informational, no vulnerability, no
    # patched release). It is reached only through serde_yaml_ng 0.10.0 in
    # solstone-core-user-skill, whose one call site parses the frontmatter
    # `name` of the owner's own installed agent-skill SKILL.md to recognise the
    # solstone skill; no network, import or journal content reaches it. A
    # safe-Rust replacement (the advisory names saphyr) is a new dependency
    # inside the Windows notice closure and would have to reproduce the tested
    # duplicate-key and malformed-document refusals, so it is not a drop-in.
    # Revisit if a vulnerability advisory names unsafe-libyaml or serde_yaml_ng,
    # if YAML parsing gains another call site or untrusted input, or when
    # serde_yaml_ng leaves unsafe-libyaml.
    # Upstream: https://rustsec.org/advisories/RUSTSEC-2024-0449
    { id = "RUSTSEC-2024-0449", reason = "VPE exception: unsafe-libyaml 0.2.11 is unmaintained, not vulnerable; reached only via serde_yaml_ng in solstone-core-user-skill to read the name field of the owner's local SKILL.md frontmatter" },
]

[licenses]
# Protects Rust crates from unreviewed license drift while allowing approved licenses.
allow = [
    "MIT",
    # via borrow-or-share (transitive dependency of jsonschema).
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "AGPL-3.0-only",
    # via ffmpeg-next / ffmpeg-sys-next (the safe FFmpeg decode wrapper and bindings).
    "WTFPL",
    # via webpki-roots (the Mozilla CA bundle; permissive data license). Mirrors
    # spl-rust's dependency-policy rationale for the same crate.
    "CDLA-Permissive-2.0",
    # via doctest-file and recvmsg (transitive dependencies of interprocess, the
    # Windows Callosum named-pipe transport). OSI-approved public-domain-equivalent.
    "0BSD",
]

[bans]
# Protects against third-party wildcard requirements while allowing unpublished internal path crates, and bans Python runtime bindings.
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    # The 0.26.11 compatibility shim re-exports its resolved 1.x roots. RustSec
    # now classifies the shim as unaffected; constrain the actual trust store.
    { crate = "webpki-roots:>=1.0.0,<1.0.10", reason = "prevent a regression to vulnerable 1.x roots behind the 0.26.11 compatibility shim" },
    { name = "pyo3" },
    { name = "pyo3-ffi" },
    { name = "cpython" },
    { name = "aws-lc-rs" },
    { name = "aws-lc-sys" },
{ name = "solstone-core-journal-io", wrappers = ["solstone-core-journal-link", "solstone-core-local", "solstone-core-format", "solstone-core-trash", "solstone-core-removals", "solstone-core-artifact-download", "solstone-core-journal-archive", "solstone-core-distribution", "solstone-core-segment", "solstone-core-sol-link", "solstone-core-entity", "solstone-core-ingest-resolve", "solstone-core-depict", "solstone-core-describe", "solstone-core-sense", "solstone-core-callosum", "solstone-core-cortex", "solstone-core-cortex-client", "solstone-core-convey-shell", "solstone-core-records-web", "solstone-core-facets", "solstone-core-retention", "solstone-core-retention-cli", "solstone-core-transcribe", "solstone-core-brain", "solstone-core-grab", "solstone-core-journal-cli", "solstone-core-journal-app", "solstone-core-journal-config-write", "solstone-core-journal-config", "solstone-core-speaker-id", "solstone-core-speaker-resolve", "solstone-core-system", "solstone-core-system-health", "solstone-core-import", "solstone-core-import-host", "solstone-core-import-sources", "solstone-core", "solstone-core-backfill-cli", "solstone-core-journal-stats-cli", "solstone-core-backup-runtime", "solstone-core-offload", "solstone-core-transcripts", "solstone-core-transcripts-web", "solstone-core-think-cli", "solstone-core-talents", "solstone-core-talent-cli", "solstone-core-talent-runtime", "solstone-core-spl", "solstone-core-setup", "solstone-core-settings-web", "solstone-core-operational-logs", "solstone-core-maintenance", "solstone-core-import-web", "solstone-core-facets-web", "solstone-core-convey-config", "solstone-core-convey-body", "solstone-core-backup", "solstone-core-stats-web", "solstone-core-push", "solstone-core-mcp-endpoint", "solstone-core-mcp-audit", "solstone-core-memory-original", "solstone-core-health-web", "solstone-core-home", "solstone-core-home-web", "solstone-core-indexer", "solstone-core-indexer-store", "solstone-core-indexer-todo", "solstone-core-doctor", "solston