[sources]
# Protects Rust dependencies from unapproved registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/solpbc/spl-rust"]
