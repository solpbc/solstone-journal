# Workspace members that are legitimately unreachable. A blank reason is
# refused. An allowlisted crate that becomes reachable is a finding — remove
# the row rather than leave it as the rule.
#
# Reachable = declares a bin, or a reachable member depends on it through a
# normal or build edge. dev-dependencies never confer reachability.

[allow]
solstone-core-convey-config = "retains pre-existing seed_default_app_navigation/pin_curation_navigation/drop_services_navigation navigation-list APIs that were already uncalled by any product path before the global facet contract removal; the crate lost its only real caller when the facet-reference maintenance functions (rename/clear/prepare_remove/publish/restore) were deleted as part of that removal"
solstone-core-mcp-endpoint = "owner-agent endpoint compiled into produced linux, macOS and Windows journals through a distribution-only package-qualified feature; default-feature metadata intentionally omits that runtime edge"
solstone-core-mcp-audit = "MCP interaction writer reached through the endpoint in produced journals; default-feature metadata intentionally omits the distribution-only feature edge"
solstone-core-origin = "repository origin-artifact verify/mirror tooling; no shipped product path depends on it"
solstone-core-talents = "talent-layout and run-log migration library; no shipped path calls it (talent-runtime and talent-cli are separate crates)"
solstone-core-social-memory = "social memory: shares an activity into an atproto space on the owner's own host and keeps received ones apart; its sign-in and share command reaches solstone-core only through the development-only social-memory-dev feature, which no shipped feature list names, until the beta run passes"
solstone-core-dns = "system-resolver DNS lookups shared by the owner-agent endpoint and social memory; reached only through those two allowlisted crates"
solstone-core-doc-extract = "pure-Rust Microsoft Office document text extraction library; tested standalone before ingest and import callers depend on it"
