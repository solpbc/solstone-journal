version = 1
target = "x86_64-pc-windows-msvc"

[baseline]
# Re-derived on 2026-10-14 with:
# cargo metadata --manifest-path core/Cargo.toml --locked --no-deps --format-version 1
# Count workspace_members joined to packages, then packages with any target
# whose kind includes `lib`. solstone-core-linked-share and
# solstone-core-brain-owner add two members and two libraries to the previous
# 136/129 baseline. Re-derived on 2026-10-17: solstone-core-update adds
# one member and one library (138/131 -> 139/132).
# Re-derived on 2026-10-20 with the same metadata join: indexer-todo adds
# one member and one library (139/132 -> 140/133).
# Re-derived on 2026-10-24 with the same metadata join: solstone-core-tokens
# adds one member and one library (140/133 -> 141/134).
# Re-derived on 2026-10-24 with the same metadata join: possible-names adds
# one member and one library (141/134 -> 142/135).
# Re-derived on 2026-11-03 with the same metadata join: local-endpoint adds
# one member and one library (142/135 -> 143/136). It is desktop Unix only:
# its crate root is cfg(linux, macos), every dependent gates it the same way,
# and on Windows it builds as an empty library.
# Re-derived on 2026-11-08 with the same metadata join: solstone-core-removals
# adds one member and one library (143/136 -> 144/137).
# Re-derived on 2026-11-08 with the same metadata join: solstone-core-trash
# adds one member and one library (144/137 -> 145/138).
# Re-derived on 2026-11-09 with the same metadata join: removing the old body
# bundle writers drops solstone-core-body-source, -body-store, -body-rebuild
# and -body-ingest, four members and four libraries (145/138 -> 141/134).
# Re-derived on 2026-11-13 with the same metadata join: solstone-core-journal-link
# adds one member and one library (141/134 -> 142/135). It is plain
# cross-platform Rust with no cfg(target_os) gate; it depends on ring, so the
# Linux cross-check leaves it to native Windows CI with ring's other dependents.
# Re-derived on 2026-11-17 with the same metadata join: solstone-core-time
# adds one member and one library (142/135 -> 143/136). It is plain
# cross-platform Rust over jiff with no cfg(target_os) gate.
# Re-derived on 2026-11-19 with the same metadata join:
# solstone-core-window-catalog adds one member and one library
# (143/136 -> 144/137). It is plain cross-platform Rust over fluent-bundle
# with no cfg(target_os) gate.
# The CLI copy reader adds one cross-platform Rust library over the shared
# process-locale selector and Fluent.
# Re-derived on 2026-11-21 with the same metadata join: solstone-core-oauth
# adds one member and one library (145/138 -> 146/139). It is cross-platform
# Rust over ring/rustls/journal-io (only a test-only unix permission check is
# cfg(unix)-gated); because it depends on ring, the Linux cross-check leaves it
# to native Windows CI with ring's other dependents.
# Re-derived on 2026-11-22 with the same metadata join:
# solstone-core-social-memory adds one member and one library
# (146/139 -> 147/140). It is plain cross-platform Rust over ring, jiff and
# journal-io with no cfg(target_os) gate; because it depends on ring, the
# Linux cross-check leaves it to native Windows CI with ring's other dependents.
# Re-derived on 2026-11-22 with the same metadata join: solstone-core-dns
# adds one member and one library (147/140 -> 148/141). It is cross-platform
# Rust over hickory-resolver, with a cfg(windows) adapter read through
# ipconfig; it does not depend on ring.
# Re-derived on 2026-11-25 with the same metadata join:
# solstone-core-photos-library and solstone-core-email add two members and two
# libraries (148/141 -> 150/143). solstone-core-email is cross-platform Rust
# over rustls/ring, rusqlite, mail-parser, html2text, html5ever, similar,
# jiff, and journal-io with no cfg(target_os) gate; because it depends on ring
# and rusqlite, the Linux cross-check leaves it to native Windows CI.
workspace_packages = 150
library_packages = 143

[[exclusions]]
package = "ring"
version = "0.17.14"
class = "native-msvc-build-oracle"
reason = "A Linux cross-check host has no Visual Studio lib.exe; native Windows CI must compile this assembly/C root."
expected_stderr = ["failed to run custom build command for `ring v0.17.14`", "failed to find tool \"lib.exe\""]

[[exclusions]]
package = "libsqlite3-sys"
version = "0.39.1"
class = "native-msvc-build-oracle"
reason = "Bundled SQLite requires the MSVC compiler and librarian; native Windows CI must compile this C root."
expected_stderr = ["failed to run custom build command for `libsqlite3-sys v0.39.1`", "failed to find tool \"lib.exe\""]

[[exclusions]]
package = "ffmpeg-sys-next"
version = "9.0.0"
class = "native-msvc-build-oracle"
reason = "The vendored FFmpeg build requires a Windows-native toolchain and sysroot; the Linux cross-check cannot act as that oracle."
expected_stderr = ["failed to run custom build command for `ffmpeg-sys-next v9.0.0", "Detected cross compilation but sysroot not provided"]
