version = 1
target = "x86_64-pc-windows-msvc"

[baseline]
# Re-derived from Cargo metadata after `solstone-core-profile-web` joined the
# workspace. The census counts a package once when any target is `lib`, so this
# mixed lib+bin rail increases both baselines by exactly one.
workspace_packages = 134
library_packages = 128

[[exclusions]]
package = "solstone-core-backfill-cli"
class = "sibling-owned-platform-backend"
reason = "Lane 2 owns the Unix-only durability-write backend used here for AtomicWriteOptions, atomic_replace, and bump_stream_marker."
expected_stderr = ["unresolved imports `solstone_core_journal_io::AtomicWriteOptions`, `solstone_core_journal_io::atomic_replace`, `solstone_core_journal_io::bump_stream_marker`"]

[[exclusions]]
package = "solstone-core-brain"
class = "sibling-owned-platform-backend"
reason = "Lane 2 owns the Unix-only durability-write backend used here for JsonWriteOptions and write_json."
expected_stderr = ["unresolved imports `solstone_core_journal_io::JsonWriteOptions`, `solstone_core_journal_io::write_json`"]

[[exclusions]]
package = "solstone-core-convey-config"
class = "sibling-owned-platform-backend"
reason = "Lane 2 owns the Unix-only durability-write backend used here for JsonWriteOptions and write_json."
expected_stderr = ["unresolved imports `solstone_core_journal_io::JsonWriteOptions`, `solstone_core_journal_io::write_json`"]

[[exclusions]]
package = "solstone-core-identity"
class = "sibling-owned-platform-backend"
reason = "Lane 2 owns the Unix-only durability-write backend used here for AtomicWriteOptions, append_text, and atomic_replace."
expected_stderr = ["unresolved imports `solstone_core_journal_io::AtomicWriteOptions`, `solstone_core_journal_io::append_text`, `solstone_core_journal_io::atomic_replace`"]

[[exclusions]]
package = "solstone-core-journal-config-write"
class = "sibling-owned-platform-backend"
reason = "Lane 2 owns the Unix-only durability-write backend used here for JsonWriteOptions and write_json."
expected_stderr = ["unresolved imports `solstone_core_journal_io::JsonWriteOptions`, `solstone_core_journal_io::write_json`"]

[[exclusions]]
package = "solstone-core-retention"
class = "sibling-owned-platform-backend"
reason = "Lane 2 owns the Unix-only durability-write backend used here for atomic_replace, health markers, and locking."
expected_stderr = ["unresolved import `solstone_core_journal_io::atomic::atomic_replace`"]

[[exclusions]]
package = "solstone-core-segment"
class = "sibling-owned-platform-backend"
reason = "Lane 2 owns the Unix-only durability-write backend used here for AtomicWriteOptions and write_bytes_exclusive."
expected_stderr = ["unresolved imports `solstone_core_journal_io::AtomicWriteOptions`, `solstone_core_journal_io::write_bytes_exclusive`"]

[[exclusions]]
package = "solstone-core-speaker-id"
class = "sibling-owned-platform-backend"
reason = "Lane 2 owns the Unix-only durability-write backend used here for AtomicWriteOptions and atomic_replace."
expected_stderr = ["unresolved imports `solstone_core_journal_io::AtomicWriteOptions`, `solstone_core_journal_io::atomic_replace`"]

[[exclusions]]
package = "solstone-core-system"
class = "sibling-owned-platform-backend"
reason = "The provider-runtime/brain/local/journal-config/assets/ring closure has been removed from this crate's Windows graph. Separate pre-existing, out-of-scope gaps remain: catchup.rs, direct_door.rs, and schedule/{completion,config}.rs use Lane 2's Unix-only journal-io atomic/JSON backend; lifecycle/mod.rs and process/{restart,spawn,terminate}.rs use nix::errno/nix::sys::signal and retain a ProcessInstance/ProcessInstanceSource typing gap."
expected_stderr = ["unresolved imports `solstone_core_journal_io::JsonWriteOptions`, `solstone_core_journal_io::write_json`", "unresolved imports `solstone_core_journal_io::AtomicWriteOptions`, `solstone_core_journal_io::atomic_replace`", "cannot find `sys` in `nix`"]

[[exclusions]]
package = "solstone-core-top"
class = "sibling-owned-platform-backend"
reason = "Lane 4 owns terminal transport behavior; its Windows probe is currently blocked transitively by solstone-core-system's documented pre-existing journal-io/nix/ProcessInstance compile gaps."
expected_stderr = ["unresolved imports `solstone_core_journal_io::JsonWriteOptions`, `solstone_core_journal_io::write_json`", "unresolved imports `solstone_core_journal_io::AtomicWriteOptions`, `solstone_core_journal_io::atomic_replace`", "cannot find `sys` in `nix`"]

[[exclusions]]
package = "solstone-core-cogitate-tools"
class = "preserved-production-guarantee"
reason = "The current implementation rejects Unix special files and kills whole process groups; its Windows probe is currently blocked transitively by solstone-core-system's documented pre-existing journal-io/nix/ProcessInstance compile gaps."
expected_stderr = ["unresolved imports `solstone_core_journal_io::JsonWriteOptions`, `solstone_core_journal_io::write_json`", "unresolved imports `solstone_core_journal_io::AtomicWriteOptions`, `solstone_core_journal_io::atomic_replace`", "cannot find `sys` in `nix`"]

[[exclusions]]
package = "solstone-core-pdf"
class = "preserved-production-guarantee"
reason = "The worker enforces Unix address-space and CPU resource limits; a Windows Job Object equivalent belongs to the later backend lane."
expected_stderr = ["could not compile `solstone-core-pdf`", "RLIMIT_AS"]

[[exclusions]]
package = "solstone-core-push"
class = "sibling-owned-platform-backend"
reason = "Lane 2 owns the Unix-only durability-write backend used here for JsonWriteOptions and write_json."
expected_stderr = ["unresolved imports `solstone_core_journal_io::JsonWriteOptions`, `solstone_core_journal_io::write_json`"]

[[exclusions]]
package = "ring"
version = "0.17.14"
class = "native-msvc-build-oracle"
reason = "A Linux cross-check host has no Visual Studio lib.exe; native Windows CI must compile this assembly/C root."
expected_stderr = ["failed to run custom build command for `ring v0.17.14`", "failed to find tool \"lib.exe\""]

[[exclusions]]
package = "libsqlite3-sys"
version = "0.38.2"
class = "native-msvc-build-oracle"
reason = "Bundled SQLite requires the MSVC compiler and librarian; native Windows CI must compile this C root."
expected_stderr = ["failed to run custom build command for `libsqlite3-sys v0.38.2`", "failed to find tool \"lib.exe\""]

[[exclusions]]
package = "ffmpeg-sys-next"
version = "9.0.0"
class = "native-msvc-build-oracle"
reason = "The vendored FFmpeg build requires a Windows-native toolchain and sysroot; the Linux cross-check cannot act as that oracle."
expected_stderr = ["failed to run custom build command for `ffmpeg-sys-next v9.0.0", "Detected cross compilation but sysroot not provided"]

[[exclusions]]
package = "solstone-core-speakers-analyze"
class = "unsupported-runtime-bundle"
reason = "The pinned ONNX Runtime bundle currently ships only for Linux and macOS; Windows packaging is outside prework."
expected_stderr = ["failed to run custom build command for `solstone-core-speakers-analyze", "unsupported solstone-core-speakers-analyze target OS \"windows\""]

[[exclusions]]
package = "solstone-core-vad-analyze"
class = "unsupported-runtime-bundle"
reason = "The pinned ONNX Runtime bundle currently ships only for Linux and macOS; Windows packaging is outside prework."
expected_stderr = ["failed to run custom build command for `solstone-core-vad-analyze", "unsupported solstone-core-vad-analyze target OS \"windows\""]
