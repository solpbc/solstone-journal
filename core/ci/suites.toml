version = 1
sets = ["component", "native", "differential", "race", "policy", "package", "platform"]
areas = ["audio", "backup", "body", "cognition", "commands", "core", "health", "home", "import", "indexing", "ingest", "journal", "media", "observation", "platform", "repository", "retention", "services", "stats", "system", "transfer", "trust", "workspace"]
