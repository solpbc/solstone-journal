schema_version = 1
protocol_version = 1

[source]
oar_git = "https://github.com/GreatV/oar-ocr"
oar_revision = "84817f58d7a0932d5368a9fa18105ba5d842af29"
oar_default_features = false
oar_features = ["simd"]
ort_version = "2.0.0-rc.13"
ort_features = ["std", "load-dynamic"]

[settings]
cpu_only = true
telemetry = false
ort_intra_threads = 1
ort_inter_threads = 1
rayon_threads = 1
image_batch_size = 1
region_batch_size = 1
detector_score_threshold = 0.2
detector_box_threshold = 0.4
detector_unclip_ratio = 1.4
detector_max_candidates = 3000
detector_limit_side_len = 1920
detector_limit_type = "max"
detector_max_side_len = 4096
recognizer_score_threshold = 0.0

[limits]
max_header_bytes = 4096
max_png_bytes = 33554432
max_decoded_pixels = 40000000
max_dictionary_bytes = 1048576
max_regions = 3000
max_response_bytes = 33554432
max_text_bytes = 4096
max_geometry_points = 16
max_request_id_bytes = 128
max_diagnostic_bytes = 512

