[workspace]
members = ["."]
resolver = "2"

[package]
name = "solstone-screen-ocr-helper"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
publish = false

[dependencies]
image = { version = "0.25.6", default-features = false, features = ["png"] }
oar-ocr = { git = "https://github.com/GreatV/oar-ocr", rev = "84817f58d7a0932d5368a9fa18105ba5d842af29", default-features = false, features = ["simd"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"] }
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
