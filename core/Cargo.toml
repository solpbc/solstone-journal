hyper-util = { version = "0.1.20", default-features = false, features = ["tokio", "service"] }
solstone-core-speakers = { path = "crates/solstone-core-speakers" }
solstone-core-speakers-analyze = { path = "crates/solstone-core-speakers-analyze" }
solstone-core-speaker-id = { path = "crates/solstone-core-speaker-id" }
solstone-core-speaker-resolve = { path = "crates/solstone-core-speaker-resolve" }
solstone-core-npy = { path = "crates/solstone-core-npy" }
solstone-core-depict = { path = "crates/solstone-core-depict" }
solstone-core-generate = { path = "crates/solstone-core-generate" }
solstone-core-generate-wire = { path = "crates/solstone-core-generate-wire" }
solstone-core-speakers-onnx = { path = "crates/solstone-core-speakers-onnx" }
solstone-core-local = { path = "crates/solstone-core-local" }
solstone-core-spp-attest = { path = "crates/solstone-core-spp-attest" }
solstone-core-spp-ratls = { path = "crates/solstone-core-spp-ratls" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
chrono-tz = "0.10.4"
glob = "0.3.3"
hdbscan = { version = "0.12.0", default-features = false, features = ["serial"] }
image = { version = "0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
imageproc = { version = "0.27.0", default-features = false }
log = "0.4.29"
md5 = "0.8.1"
nix = { version = "0.30.1", default-features = false, features = ["fs"] }
ort = { version = "=2.0.0-rc.12", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false }
rapidfuzz = "0.5.0"
regex = "1.13.1"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
rustix = { version = "1.1.4", features = ["fs"] }
rusqlite = { version = "0.40.1", features = ["bundled", "trace"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = { version = "1.0.150", features = ["preserve_order", "float_roundtrip"] }
# Draft 2020-12 response schema validation. Release-rail lenses: pure-Rust
# dependency graph, no build.rs/cc/cmake native step (musl x86_64/aarch64
# unaffected); package MSRV 1.85 holds under the pinned 1.97.1 toolchain
# (make check-rust-msrv passes); iOS/macOS cross-target eligibility holds
# (the crate is pure Rust and adds no native step). NOTE: make check-rust-ios
# does NOT pass on the linux build host and did not before this dependency -
# libsqlite3-sys needs clang to cross-compile sqlite for aarch64-apple-ios and
# clang is absent there. Unrelated to this crate; verified identical on main.
# cargo-deny bans/licenses/sources all pass
# except a pre-existing, unrelated bans failure on solstone-core-journal-io's
# wrapper list (present at 883a67394, before this dependency existed).
jsonschema = { version = "0.49.8", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
hmac = "0.12.1"
getrandom = "0.3.4"
ryu = "1.0.23"
spl-core = { git = "https://github.com/solpbc/spl-rust", tag = "v0.5.0" }
spl-transport = { git = "https://github.com/solpbc/spl-rust", tag = "v0.5.0" }
tokio = { version = "1", default-features = false }
thiserror = "2.0.19"
toml_edit = { version = "0.22.27", default-features = false, features = ["parse"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.6.11", default-features = false, features = ["limit"] }
unicode-normalization = "0.1.25"
unidecode = "0.3.0"
ureq = { version = "3.3.0", default-features = false }
tar = "0.4"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
