# RSA-4096 key generation for the support-portal identity. Release-rail lenses:
# `rsa` adds pkcs1, num-bigint-dig, and pem-rfc7468; num-bigint-dig 0.8.6's build.rs only
# emits the Rust `has_i128` cfg, so it has no cc/cmake/native build step and
# leaves musl x86_64/aarch64 eligible. Package MSRV 1.65 is below the
# check-rust-msrv 1.95.0 toolchain; its pure-Rust graph is eligible for iOS and
# macOS cross targets. cargo-deny bans/licenses/sources are reviewed by the
# gate. RUSTSEC-2023-0071 (Marvin timing sidechannel) is an accepted input:
# this crate uses rsa only for one-time key generation; every attacker-observable
# signature uses ring. cargo-deny here does not check advisories, so that gate
# result is not the justification for the containment.
rsa = "0.9.10"
# Detached minisign signatures for solstone-distribution `sign`. Release-rail lenses:
# `minisign` 0.9.1 is MIT; its graph adds ct-codecs, scrypt, pbkdf2, salsa20,
# rpassword, rtoolbox, and (Windows-only) windows-sys 0.59.0. No crate in that
# set has a C/C++ build.rs, so musl x86_64/aarch64 stay eligible and the
# PORTING.md native-dependency proof does not apply. Package MSRVs are at or
# below 1.85, under the workspace rust-version 1.95 / check-rust-msrv 1.95.0
# toolchain. The graph is pure Rust and eligible for iOS and macOS cross
# targets. cargo-deny bans/licenses/sources passed on the proposed lock.
# Transitive `rpassword` is a unix/windows tty prompt crate; product code
# always passes Some(password) into rust-minisign, so that prompt path is
# unreachable.
minisign = "0.9.1"
# Native `journal top` terminal adapter. Exact pin so the lock cannot drift onto a
# newer command/event surface. `events` is poll/read; `windows` is cfg(windows)
# graph resolution only — solstone-core-top adds no Windows backend. Default
# features (bracketed-paste, derive-more) stay off. Crossterm 0.29.0 has
# `build = false`; its events+windows graph is pure Rust (no cc/cmake), so the
# PORTING.md native-dependency proof does not apply. Package MSRV 1.63 is below
# the workspace rust-version 1.95. MIT.
crossterm = { version = "=0.29.0", default-features = false, features = ["events", "windows"] }
# Portable OS identity for journal-config default materialization. Release-rail lenses:
# `whoami` 2.1.2 is Apache-2.0 OR BSL-1.0 OR MIT. default-features are disabled
# because they pull `wasi-wasite` + `wasm-web`, whose deps are wasm32-target-gated
# and never resolve for any deny.toml graph target, but they do widen the unfiltered
# `cargo metadata` closure. `std` is the only enabled feature; `realname()` and
# `username()` exist under it. Package MSRV 1.75 is below workspace rust-version
# 1.95 / check-rust-msrv 1.95.0. `build = false`; no cc/cmake/native build.rs, so
# musl x86_64/aarch64 stay eligible and the PORTING.md native-dependency proof
# does not apply. Linux/macOS pull workspace `libc` (already in graph); macOS
# additionally pulls objc2-system-configuration 0.3.2 and objc2-core-foundation
# 0.3.2 (MSRV 1.71, build = false, SystemConfiguration.framework via rustc).
# Windows adds no extra crates; rustc `#[link]`s secur32/advapi32/kernel32.
# cargo-deny bans/licenses/sources are reviewed by the gate. MIT and Apache-2.0
# already sit on the license allow list, so the BSL-1.0 alternative does not
# require a deny.toml edit.
whoami = { version = "=2.1.2", default-features = false, features = ["std"] }
# Direct Windows journal-root substrate. `windows-sys` 0.61.2 is already locked
# transitively; this exact pin makes the root-admission Win32 surface reviewed
# and reproducible. The selected bindings cover handle identity, no-reparse
# directory opens, fixed-volume classification, Cloud Files status, and the
# existing CompareStringOrdinal portability contract. It is Windows-target
# gated by journal-io, has no build script or C/C++ step, and adds only system
# DLL links on that target. Package MSRV 1.82 is below workspace Rust 1.95;
# MIT license and the resolved graph are already covered by cargo-deny.
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Globalization", "Win32_Security", "Win32_Storage_CloudFilters", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
# IANA timezone for journal-config default materialization. Release-rail lenses:
# `iana-time-zone` 0.1.65 is MIT OR Apache-2.0 and is already in the lock via
# health-web and reprocess-cli. `build = false`; package MSRV 1.62.0 is below
# workspace rust-version 1.95 / check-rust-msrv 1.95.0. No cc/cmake/native
# build.rs, so musl x86_64/aarch64 stay eligible and the PORTING.md
# native-dependency proof does not apply. Linux reads /etc/localtime in-process.
# macOS uses already-locked core-foundation-sys. Windows uses already-locked
# windows-core (resolved 0.62.2, MSRV 1.82, build = false). cargo-deny
# bans/licenses/sources are reviewed by the gate.
iana-time-zone = "=0.1.65"
widestring = "1"
unicode-general-category = "1.1.0"
unicode-xid = "0.2.6"
unicode_names2 = "1.3.0"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
rustix = { version = "1.1.4", features = ["fs", "termios"] }
rusqlite = { version = "0.40.1", features = ["bundled", "trace"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = { version = "1.0.150", features = ["preserve_order", "float_roundtrip"] }
# Draft 2020-12 response schema validation. Release-rail lenses: pure-Rust
# dependency graph, no build.rs/cc/cmake native step (musl x86_64/aarch64
# unaffected); package MSRV 1.85 holds under the pinned 1.97.1 toolchain
# (make check-rust-msrv passes); iOS/macOS cross-target eligibility holds
# (the crate is pure Rust and adds no native step). NOTE: make check-rust-ios
# does NOT pass on the linux build host and did not before this dependency -
# libsqlite3-sys needs clang to cross-compile sqlite for aarch64-apple-ios and
# clang is absent there. Unrelated to this crate; verified identical on main.
# cargo-deny bans/licenses/sources all pass
# except a pre-existing, unrelated bans failure on solstone-core-journal-io's
# wrapper list (present at 883a67394, before this dependency existed).
jsonschema = { version = "0.49.8", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
