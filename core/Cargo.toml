[workspace]
members = [
    "crates/solstone-core",
    "crates/solstone-core-cli",
    "crates/solstone-core-indexer",
    "crates/solstone-core-format",
    "crates/solstone-core-indexer-store",
    "crates/solstone-core-indexer-query",
    "crates/solstone-core-entity",
    "crates/solstone-core-entity-matching",
    "crates/solstone-core-facets",
    "crates/solstone-core-journal",
    "crates/solstone-core-journal-cli",
    "crates/solstone-core-journal-config",
    "crates/solstone-core-journal-config-write",
    "crates/solstone-core-journal-io",
    "crates/solstone-core-brain",
    "crates/solstone-core-brain-cli",
    "crates/solstone-core-callosum",
    "crates/solstone-core-processing-record",
    "crates/solstone-core-retention",
    "crates/solstone-core-retention-cli",
    "crates/solstone-core-segment",
    "crates/solstone-core-sol",
    "crates/solstone-core-sol-client",
    "crates/solstone-core-sol-client-cli",
    "crates/solstone-core-sol-link",
    "crates/solstone-core-convey-http",
    "crates/solstone-core-serving",
    "crates/solstone-core-ingest",
    "crates/solstone-core-entities",
    "crates/solstone-core-ingest-resolve",
    "crates/solstone-core-spl",
    "crates/solstone-core-speakers",
    "crates/solstone-core-speakers-analyze",
    "crates/solstone-core-describe",
    "crates/solstone-core-depict",
    "crates/solstone-core-generate",
    "crates/solstone-core-speakers-onnx",
    "crates/solstone-core-local",
    "crates/solstone-core-body-source",
]
resolver = "3"

[workspace.package]
version = "1.0.22"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
solstone-core-cli = { path = "crates/solstone-core-cli" }
solstone-core-entity = { path = "crates/solstone-core-entity" }
solstone-core-entity-matching = { path = "crates/solstone-core-entity-matching" }
solstone-core-facets = { path = "crates/solstone-core-facets" }
solstone-core-indexer = { path = "crates/solstone-core-indexer" }
solstone-core-format = { path = "crates/solstone-core-format" }
solstone-core-indexer-store = { path = "crates/solstone-core-indexer-store" }
solstone-core-indexer-query = { path = "crates/solstone-core-indexer-query" }
solstone-core-ingest-resolve = { path = "crates/solstone-core-ingest-resolve" }
solstone-core-journal = { path = "crates/solstone-core-journal" }
solstone-core-journal-cli = { path = "crates/solstone-core-journal-cli" }
solstone-core-journal-config = { path = "crates/solstone-core-journal-config" }
solstone-core-journal-config-write = { path = "crates/solstone-core-journal-config-write" }
solstone-core-journal-io = { path = "crates/solstone-core-journal-io" }
solstone-core-brain = { path = "crates/solstone-core-brain" }
solstone-core-callosum = { path = "crates/solstone-core-callosum" }
solstone-core-processing-record = { path = "crates/solstone-core-processing-record" }
solstone-core-retention = { path = "crates/solstone-core-retention" }
solstone-core-retention-cli = { path = "crates/solstone-core-retention-cli" }
solstone-core-segment = { path = "crates/solstone-core-segment" }
solstone-core-sol = { path = "crates/solstone-core-sol" }
solstone-core-sol-client = { path = "crates/solstone-core-sol-client" }
solstone-core-sol-client-cli = { path = "crates/solstone-core-sol-client-cli" }
solstone-core-sol-link = { path = "crates/solstone-core-sol-link" }
solstone-core-convey-http = { path = "crates/solstone-core-convey-http" }
solstone-core-entities = { path = "crates/solstone-core-entities" }
solstone-core-spl = { path = "crates/solstone-core-spl" }
axum = { version = "0.8.9", default-features = false, features = ["json", "multipart", "query"] }
bytes = "1.12.1"
hyper = { version = "1.11.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio", "service"] }
solstone-core-speakers = { path = "crates/solstone-core-speakers" }
solstone-core-speakers-analyze = { path = "crates/solstone-core-speakers-analyze" }
solstone-core-depict = { path = "crates/solstone-core-depict" }
solstone-core-generate = { path = "crates/solstone-core-generate" }
solstone-core-speakers-onnx = { path = "crates/solstone-core-speakers-onnx" }
solstone-core-local = { path = "crates/solstone-core-local" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
chrono-tz = "0.10.4"
glob = "0.3.3"
hdbscan = { version = "0.12.0", default-features = false, features = ["serial"] }
image = { version = "0.25.9", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
imageproc = { version = "0.27.0", default-features = false }
log = "0.4.29"
md5 = "0.8.1"
nix = { version = "0.30.1", default-features = false, features = ["fs"] }
ort = { version = "=2.0.0-rc.12", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false }
rapidfuzz = "0.5.0"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
rusqlite = { version = "0.40.1", features = ["bundled", "trace"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = { version = "1.0.150", features = ["preserve_order", "float_roundtrip"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
hmac = "0.12.1"
getrandom = "0.3.4"
ryu = "1.0.23"
spl-core = { git = "https://github.com/solpbc/spl-rust", tag = "v0.5.0" }
spl-transport = { git = "https://github.com/solpbc/spl-rust", tag = "v0.5.0" }
tokio = { version = "1", default-features = false }
thiserror = "2.0.19"
toml_edit = { version = "0.22.27", default-features = false, features = ["parse"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.6.11", default-features = false, features = ["limit"] }
unicode-normalization = "0.1.25"
unidecode = "0.3.0"
ureq = { version = "3.3.0", default-features = false }
tar = "0.4"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
