# Dev-profile debug info. The cargo default (`debug = 2` for the workspace and
# all 410 dependencies) put ~59G in target/debug against ~2.5G in
# target/release. Every isolated checkout carries its own copy, which reached
# ~320G on the build host and filled the filesystem to 100%, surfacing as a
# linker SIGBUS in an unrelated build.
#
# Two levels on purpose: workspace crates keep line tables, so RUST_BACKTRACE
# and test failures still report file:line where triage happens; dependencies
# carry none, and their frames still show function names from the symbol table.
#
# Codegen is unaffected — `debug` is orthogonal to opt-level — and
# [profile.release] is unchanged, so nothing that reaches an owner differs.
# `incremental` is intentionally left on: it is what makes an isolated checkout's
# edit/rebuild/test loop fast, and trading it for disk would cost the
# throughput this change exists to protect.
[profile.dev]
debug = "line-tables-only"

# "*" matches dependencies only, never workspace members.
[profile.dev.package."*"]
debug = false

[patch.crates-io]
ffmpeg-sys-next = { path = "vendor/ffmpeg-sys-next" }
