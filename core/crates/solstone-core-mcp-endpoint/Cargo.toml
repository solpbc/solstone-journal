[package]
name = "solstone-core-mcp-endpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
full-tests = ["solstone-core-callosum/full-tests", "solstone-core-dns/full-tests"]
test-hooks = [
    "solstone-core-journal-io/test-hooks",
    "solstone-core-sol-link/test-hooks",
]

[dependencies]
solstone-core-grab.workspace = true
solstone-core-observe-audio.workspace = true
solstone-core-processing-record.workspace = true
solstone-core-entities.workspace = true
image.workspace = true
solstone-core-journal-config.workspace = true
arc-swap = "1.9.1"
axum.workspace = true
async-trait = "0.1.89"
base64 = "0.22.1"
bytes.workspace = true
caseless = "0.2.2"
thiserror.workspace = true
unicode-normalization = "0.1.25"
unicode-general-category.workspace = true
futures = "0.3.31"
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime"] }
hmac.workspace = true
log.workspace = true
pem = "3.0.6"
rcgen.workspace = true
ring.workspace = true
sha2.workspace = true
subtle.workspace = true
instant-acme = { version = "0.8.5", default-features = false, features = ["ring", "time"] }
hyper.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1"] }
jiff.workspace = true
tower.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
solstone-core-callosum.workspace = true
solstone-core-dns.workspace = true
solstone-core-convey-http.workspace = true
solstone-core-window-catalog.workspace = true
solstone-core-indexer-query.workspace = true
rusqlite.workspace = true
russh.workspace = true
solstone-core-indexer-store.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-journal-link.workspace = true
solstone-core-format.workspace = true
solstone-core-home.workspace = true
solstone-core-memory-original.workspace = true
solstone-core-possible-names.workspace = true
solstone-core-journal-config-write.workspace = true
solstone-core-mcp-audit.workspace = true
solstone-core-entity.workspace = true
solstone-core-entity-matching.workspace = true
solstone-core-speaker-resolve.workspace = true
solstone-core-retention.workspace = true
solstone-core-segment.workspace = true
solstone-core-sol-link = { workspace = true, features = ["host"] }
solstone-core-system.workspace = true
solstone-core-time.workspace = true
solstone-core-facets.workspace = true
solstone-core-location.workspace = true
solstone-core-talent-runtime.workspace = true
solstone-core-transcripts.workspace = true
solstone-core-transcripts-web.workspace = true
spl-core.workspace = true
spl-home.workspace = true
time = "0.3.55"
tokio = { workspace = true, features = ["io-util", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
webpki-roots = "1.0.9"
x509-parser = { version = "0.16.0", features = ["verify"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["dir", "fs", "user", "resource"] }


[dev-dependencies]
solstone-core-removals.workspace = true
solstone-core-segment = { workspace = true, features = ["test-fixtures"] }
pulldown-cmark.workspace = true
proc-macro2 = "1.0.107"
rusqlite.workspace = true
serde.workspace = true
solstone-core-indexer-store = { workspace = true, features = ["test-fixtures"] }
syn = { version = "2.0.119", features = ["full", "visit"] }
tempfile = "3.24.0"
solstone-core-npy.workspace = true
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }
tokio = { workspace = true, features = ["macros", "test-util"] }

# This opt-in target exercises the public bootstrap boundary through its real
# cross-crate, process-shaped call path with thread-local read hooks.
[[test]]
name = "mcp_endpoint_bound_leaf_process"
path = "tests/mcp_endpoint_bound_leaf_process.rs"
required-features = ["test-hooks"]

[[test]]
name = "mcp_endpoint_memory_publication"
path = "tests/mcp_endpoint_memory_publication.rs"
required-features = ["full-tests", "test-hooks"]

[lints]
workspace = true
