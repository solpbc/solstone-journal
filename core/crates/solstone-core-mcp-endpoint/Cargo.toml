[package]
name = "solstone-core-mcp-endpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
test-hooks = [
    "solstone-core-journal-io/test-hooks",
    "solstone-core-sol-link/test-hooks",
]

[dependencies]
solstone-core-journal-config.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["dir", "fs", "user"] }
ring.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-sol-link = { workspace = true, features = ["host"] }

[dev-dependencies]
serde.workspace = true
tempfile = "3.24.0"

[lints]
workspace = true
