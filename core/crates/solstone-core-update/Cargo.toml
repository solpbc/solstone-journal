[package]
name = "solstone-core-update"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints.rust]
unsafe_code = "deny"

[features]
full-tests = []
# Qualification rigs only: read the update origin and platform key from the
# environment. It refuses to build optimized, so no release can carry it.
update-test-origin = []

[dependencies]
solstone-core-cli-copy.workspace = true
solstone-core-window-catalog.workspace = true
minisign.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
ureq = { workspace = true, features = ["rustls"] }
solstone-core-installed-payload.workspace = true
solstone-core-journal.workspace = true

tempfile = "3.24.0"
