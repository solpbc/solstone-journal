<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>local support report smoke</title>
<style>
  body { font: 14px/1.4 sans-serif; padding: 16px; }
  .pass { color: #166534; }
  .fail { color: #b91c1c; }
</style>
<h1>local support report smoke</h1>
<button id="report">report this</button>
<div id="results"></div>
<script src="../convey_copy.js"></script>
<script>
  const originalFetch = window.fetch;
  window.fetch = async (url) => {
    if (url !== '/app/support/api/context') throw new Error(`unexpected request: ${url}`);
    return {
      ok: true,
      json: async () => ({ version: '2.0.0', os: 'Fedora Linux', os_version: '43' })
    };
  };
  window.solPathContext = () => ({ appName: 'transcripts' });
</script>
<script src="../report-error.js"></script>
<script>
  const results = document.getElementById('results');
  let failures = 0;

  function assert(name, condition, detail = '') {
    const row = document.createElement('div');
    row.className = condition ? 'pass' : 'fail';
    row.textContent = `${condition ? 'PASS' : 'FAIL'} ${name}${detail ? ` — ${detail}` : ''}`;
    results.appendChild(row);
    if (!condition) failures += 1;
  }

  function flush() {
    return new Promise(resolve => setTimeout(resolve, 0));
  }

  document.getElementById('report').addEventListener('click', async () => {
    window.convey.reportError({
      apiError: { reasonCode: 'transcript_unavailable', message: 'must not be included' },
      consoleEntries: [
        { summary: 'first local error', detail: 'must not be included' },
        { summary: 'second local error', stack: 'must not be included' }
      ],
      customDetail: 'must not be included'
    });
    await flush();

    const labels = [...document.querySelectorAll('.report-error-review dt')]
      .map(item => item.textContent);
    const values = [...document.querySelectorAll('.report-error-review dd')]
      .map(item => item.textContent);
    const recent = document.getElementById('report-error-recent');
    const send = document.querySelector('.report-error-actions a');
    const fragment = new URL(send.href).hash.slice(1);
    const params = new URLSearchParams(fragment);

    assert('review card has the exact fixed labels',
      JSON.stringify(labels) === JSON.stringify([
        'journal version', 'operating system', 'app', 'route', 'error code'
      ]), JSON.stringify(labels));
    assert('review card has the fixed values',
      values[0] === '2.0.0' && values[1] === 'Fedora Linux 43' &&
      values[2] === 'transcripts' && values[3] === window.location.pathname &&
      values[4] === 'transcript_unavailable');
    assert('recent error lines are editable and contain summaries only',
      recent.value === 'first local error\nsecond local error' &&
      !document.querySelector('.report-error-modal').textContent.includes('must not be included'));
    assert('send is a fragment-only handoff',
      send.origin === 'https://support.solstone.app' && send.pathname === '/' &&
      send.search === '' && params.get('report') === 'v1');
    assert('fragment uses the exact journal keys',
      JSON.stringify([...params.keys()]) === JSON.stringify([
        'report', 'app', 'version', 'os', 'os_version', 'route', 'error_code', 'recent'
      ]));
    assert('fragment carries editable recent text',
      params.get('recent') === 'first local error\nsecond local error');
    assert('fragment encoding uses plus for spaces and percent-encoded linefeeds',
      send.hash.includes('recent=first+local+error%0Asecond+local+error'));

    recent.value = 'owner edited this';
    recent.dispatchEvent(new Event('input'));
    assert('editing recent lines updates the handoff',
      new URLSearchParams(new URL(send.href).hash.slice(1)).get('recent') === 'owner edited this');

    document.querySelector('.report-error-actions button').click();
    window.convey.reportError({ consoleEntries: [] });
    await flush();
    const noCodeLabels = [...document.querySelectorAll('.report-error-review dt')]
      .map(item => item.textContent);
    assert('error code row is omitted when there is no code',
      !noCodeLabels.includes('error code'));

    window.fetch = originalFetch;
    assert('summary', failures === 0, failures ? `${failures} failure(s)` : 'all checks passed');
  });
  document.getElementById('report').click();
</script>
</html>
