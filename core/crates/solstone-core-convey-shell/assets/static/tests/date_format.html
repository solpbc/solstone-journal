<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>date_format.js smoke</title>
<style>
  body { font: 14px/1.4 sans-serif; padding: 16px; }
  .pass { color: #166534; }
  .fail { color: #b91c1c; }
</style>
<h1>date_format.js smoke</h1>
<div id="results"></div>
<script src="../date_format.js"></script>
<script>
  const results = document.getElementById('results');
  let failures = 0;

  function assert(name, condition, detail) {
    const row = document.createElement('div');
    row.className = condition ? 'pass' : 'fail';
    row.textContent = `${condition ? 'PASS' : 'FAIL'} ${name}${detail ? ` — ${detail}` : ''}`;
    results.appendChild(row);
    if (!condition) failures += 1;
  }

  // Fixed reference "today" so this page never depends on the wall clock.
  const NOW = new Date(2026, 8, 6); // Sunday, Sep 6 2026

  function check(dateString, expected) {
    const actual = window.formatDateShort(dateString, NOW);
    assert(`formatDateShort(${dateString})`, actual === expected, `expected "${expected}", got "${actual}"`);
  }

  function run() {
    // Relative labels near "today" are untouched by the year rule.
    check('20260906', 'Today');
    check('20260905', 'Yesterday');
    check('20260907', 'Tomorrow');

    // The last 6 past days collapse to a bare weekday, still no year.
    check('20260831', 'Monday');
    // One day further back falls through to the short form.
    check('20260830', 'Sun Aug 30');
    check('20260829', 'Sat Aug 29');

    // Far in the past, same year as "today": no year suffix.
    check('20260107', 'Wed Jan 7');

    // Far in the past, a different year: formatDateFull's rule already
    // covered this case even before the fix — pin it so it stays covered.
    check('20250315', 'Sat Mar 15 \'25');

    // Future day, same year: no year suffix either way.
    check('20261225', 'Fri Dec 25');

    // G2-52: a future day in a different year used to render with no year
    // at all, because `monthsAgo` (today minus the parsed day) is negative
    // for every future day and the old guard only fired when it was > 6.
    // These are exactly the shape of the live defect (a 2027 search result
    // reading as this year).
    check('20270301', 'Mon Mar 1 \'27');
    check('20271220', 'Mon Dec 20 \'27');

    // JournalFormat.time / formatTimeOfDay: the time half of the absolute
    // ladder, added for the home today card. The rendered string is locale
    // dependent, so the assertions pin the contract, not one locale's output.
    assert('JournalFormat.time is exported', typeof window.JournalFormat.time === 'function');
    for (const empty of [null, undefined, '']) {
      const actual = window.JournalFormat.time(empty);
      assert(`JournalFormat.time(${JSON.stringify(empty)}) is unavailable, not blank`,
        actual === 'time unavailable', `got "${actual}"`);
    }
    const notATime = window.JournalFormat.time('not a timestamp');
    assert('JournalFormat.time(garbage) is unavailable', notATime === 'time unavailable', `got "${notATime}"`);
    // Zero is a real instant (the epoch), not a missing value.
    assert('JournalFormat.time(0) formats the epoch', window.JournalFormat.time(0) !== 'time unavailable');

    const afternoon = new Date(2026, 8, 6, 13, 5).getTime();
    const shown = window.JournalFormat.time(afternoon);
    assert('a real timestamp formats', shown !== 'time unavailable', `got "${shown}"`);
    assert('the formatted time is hour and minute only',
      shown === new Date(afternoon).toLocaleString(undefined, { hour: 'numeric', minute: '2-digit' }),
      `got "${shown}"`);
    assert('the time carries its two-digit minute', /(^|\D)05(\D|$)/.test(shown), `got "${shown}"`);
    // Same rendering as the full stamp, without the date, so it is shorter.
    assert('the time is the stamp without its date',
      shown.length < window.JournalFormat.timestamp(afternoon).length,
      `time "${shown}" vs stamp "${window.JournalFormat.timestamp(afternoon)}"`);

    // JournalFormat.segmentTimeOfDay: the same segment prefix `segmentTime`
    // reads, on the clock the rest of the page uses. G1-202.
    assert('JournalFormat.segmentTimeOfDay is exported',
      typeof window.JournalFormat.segmentTimeOfDay === 'function');
    for (const bad of [null, undefined, '', 'not a segment', '246099_60', '2026-1000']) {
      const actual = window.JournalFormat.segmentTimeOfDay(bad);
      assert(`JournalFormat.segmentTimeOfDay(${JSON.stringify(bad)}) is unavailable`,
        actual === 'time unavailable', `got "${actual}"`);
      assert(`JournalFormat.segmentTime(${JSON.stringify(bad)}) agrees`,
        window.JournalFormat.segmentTime(bad) === 'time unavailable');
    }
    const segment = window.JournalFormat.segmentTimeOfDay('200155_300');
    assert('a segment prefix formats', segment !== 'time unavailable', `got "${segment}"`);
    assert('the segment reads on the same clock as JournalFormat.time',
      segment === window.JournalFormat.time(new Date(2000, 0, 1, 20, 1, 55).getTime()),
      `got "${segment}"`);
    assert('the segment time carries no seconds',
      !/55/.test(segment) && window.JournalFormat.segmentTime('200155_300') === '20:01:55',
      `got "${segment}"`);

    assert('summary', failures === 0, failures ? `${failures} failure(s)` : 'all checks passed');
  }

  run();
</script>
</html>
