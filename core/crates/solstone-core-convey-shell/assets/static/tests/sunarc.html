<html lang="en">
<head>
<meta charset="utf-8">
<title>sunarc.js smoke</title>
<link rel="stylesheet" href="../tokens.css">
<style>
  body { font: 14px/1.4 sans-serif; padding: 16px; background: #fff; color: #1a1a1a; }
  .pass { color: #166534; }
  .fail { color: #b91c1c; font-weight: bold; }
  #results { margin-top: 12px; }
  .test-row { padding: 3px 0; border-bottom: 1px solid #eee; }
</style>
</head>
<body>
<h1>sunarc.js smoke</h1>
<div id="results"></div>

<script src="../sunarc.js"></script>
<script>
  const results = document.getElementById('results');
  let failures = 0;
  let testCount = 0;

  function assert(name, condition, detail) {
    testCount += 1;
    const row = document.createElement('div');
    row.className = 'test-row ' + (condition ? 'pass' : 'fail');
    row.textContent = `${condition ? 'PASS' : 'FAIL'} [${name}]${detail ? ` — ${detail}` : ''}`;
    results.appendChild(row);
    if (!condition) failures += 1;
  }

  function approx(a, b, epsilon = 0.01) {
    if (typeof a === 'number' && typeof b === 'number') {
      return Math.abs(a - b) <= Math.max(Math.abs(a), Math.abs(b)) * epsilon || Math.abs(a - b) <= epsilon;
    }
    return a === b;
  }

  function getTokens() {
    return window.SunArc.parseTokens(document.documentElement);
  }

  function run() {
    const tokens = getTokens();
    assert('tokens_valid', window.SunArc.tokensValid(tokens), 'CSS tokens loaded and parsed valid');

    // 1. Fallback 06:30/19:30: opacity at m=dawn (360) and m=dusk (1200) is exactly 0.
    {
      const rise = 390; // 06:30
      const set = 1170; // 19:30
      const tw = tokens.twilightMinutes; // 30
      const dawn = rise - tw; // 360
      const dusk = set + tw; // 1200

      const tDawn = window.SunArc.dayProgress(dawn, rise, set, tw);
      const envDawn = window.SunArc.env(tDawn, tokens.envelopeEdge);
      const nightDawn = window.SunArc.nightAmount(dawn, rise, set, tw);
      const opDawn = window.SunArc.sunOpacity({ t: tDawn, env: envDawn, nightAmount: nightDawn, peakOpacity: tokens.peakOpacity });

      const tDusk = window.SunArc.dayProgress(dusk, rise, set, tw);
      const envDusk = window.SunArc.env(tDusk, tokens.envelopeEdge);
      const nightDusk = window.SunArc.nightAmount(dusk, rise, set, tw);
      const opDusk = window.SunArc.sunOpacity({ t: tDusk, env: envDusk, nightAmount: nightDusk, peakOpacity: tokens.peakOpacity });

      assert('1_fallback_dawn_dusk_opacity_zero', opDawn === 0 && opDusk === 0, `opDawn=${opDawn}, opDusk=${opDusk}`);
    }

    // 2. t=0.5 centers match both table rows within 1%
    {
      const g1 = window.SunArc.geometry(1280, 820, 0.5, tokens);
      const c1Match = approx(g1.center.x, 779.2, 0.01) && approx(g1.center.y, 234.3, 0.01);

      const g2 = window.SunArc.geometry(393, 852, 0.5, tokens);
      const c2Match = approx(g2.center.x, 299.6, 0.01) && approx(g2.center.y, 359.3, 0.01);

      assert('2_t05_center_matches_reference_table', c1Match && c2Match,
        `1280x820 center=(${g1.center.x.toFixed(1)}, ${g1.center.y.toFixed(1)}) expected (779.2, 234.3); ` +
        `393x852 center=(${g2.center.x.toFixed(1)}, ${g2.center.y.toFixed(1)}) expected (299.6, 359.3)`);
    }

    // 3. t=0->A, t=1->B, both sizes, within 1%
    {
      const g1 = window.SunArc.geometry(1280, 820, 0.0, tokens);
      const g1_end = window.SunArc.geometry(1280, 820, 1.0, tokens);
      const g1_AMatch = approx(g1.pos.x, -469.1, 0.01) && approx(g1.pos.y, -469.1, 0.01);
      const g1_BMatch = approx(g1_end.pos.x, 1749.1, 0.01) && approx(g1_end.pos.y, 1289.1, 0.01);

      const g2 = window.SunArc.geometry(393, 852, 0.0, tokens);
      const g2_end = window.SunArc.geometry(393, 852, 1.0, tokens);
      const g2_AMatch = approx(g2.pos.x, -224.8, 0.01) && approx(g2.pos.y, -224.8, 0.01);
      const g2_BMatch = approx(g2_end.pos.x, 617.8, 0.01) && approx(g2_end.pos.y, 1076.8, 0.01);

      assert('3_endpoints_A_and_B_match_reference', g1_AMatch && g1_BMatch && g2_AMatch && g2_BMatch,
        `1280x820 A=(${g1.pos.x.toFixed(1)},${g1.pos.y.toFixed(1)}) B=(${g1_end.pos.x.toFixed(1)},${g1_end.pos.y.toFixed(1)}); ` +
        `393x852 A=(${g2.pos.x.toFixed(1)},${g2.pos.y.toFixed(1)}) B=(${g2_end.pos.x.toFixed(1)},${g2_end.pos.y.toFixed(1)})`);
    }

    // 4. Subtended angle 36.0°±0.1° for >= 3 sizes
    {
      const sizes = [[1280, 820], [393, 852], [1920, 1080], [2560, 1440]];
      let allMatch = true;
      const angles = [];
      for (const [w, h] of sizes) {
        const g = window.SunArc.geometry(w, h, 0.5, tokens);
        angles.push(`${w}x${h}:${g.angleDeg.toFixed(2)}°`);
        if (Math.abs(g.angleDeg - 36.0) > 0.1) {
          allMatch = false;
        }
      }
      assert('4_subtended_angle_36_deg', allMatch, angles.join(', '));
    }

    // 5. Midday (env=1, not night): opacity equals the peak for the ground's appearance
    // (0.55 light, 0.20 dark, spec § 8a); t outside the draw range -> opacity 0.
    {
      const opMidday = window.SunArc.sunOpacity({ t: 0.5, env: 1.0, nightAmount: 0.0, peakOpacity: tokens.peakOpacity });
      const opOutLow = window.SunArc.sunOpacity({ t: -0.05, env: 0.0, nightAmount: 1.0, peakOpacity: tokens.peakOpacity });
      const opOutHigh = window.SunArc.sunOpacity({ t: 1.05, env: 0.0, nightAmount: 1.0, peakOpacity: tokens.peakOpacity });
      const light = window.SunArc.frame(1280, 820, 780, 408.26, 1135.65, 'light', tokens).opacity;
      const dark = window.SunArc.frame(1280, 820, 780, 408.26, 1135.65, 'dark', tokens).opacity;

      assert('5_midday_peak_per_appearance_and_outside_draw_range_zero',
        approx(opMidday, 0.55, 0.001) && opOutLow === 0 && opOutHigh === 0 &&
        approx(light, 0.55, 0.001) && approx(dark, 0.20, 0.001),
        `opMidday=${opMidday}, frame light=${light}, frame dark=${dark}, outLow=${opOutLow}, outHigh=${opOutHigh}`);
    }

    // 6. Strictly inside a twilight window: opacity = peak * env(t) * (1 - nightAmount). Must fail if factor dropped.
    {
      const rise = 390;
      const set = 1170;
      const tw = tokens.twilightMinutes;
      const mSample = rise - tw / 2; // m=375, half way between dawn(360) and rise(390)
      const t = window.SunArc.dayProgress(mSample, rise, set, tw); // t = 15/840 ≈ 0.017857
      const e = tokens.envelopeEdge;
      const envVal = window.SunArc.env(t, e);
      const nightAmt = window.SunArc.nightAmount(mSample, rise, set, tw); // 0.5

      const correctOp = window.SunArc.sunOpacity({ t, env: envVal, nightAmount: nightAmt, peakOpacity: tokens.peakOpacity });
      const droppedFactorOp = tokens.peakOpacity * envVal; // without (1 - nightAmount)

      const expectedOp = tokens.peakOpacity * envVal * (1 - nightAmt);
      const includesFactor = approx(correctOp, expectedOp, 0.0001) && (correctOp !== droppedFactorOp) && Math.abs(correctOp - droppedFactorOp) > 0.001;

      assert('6_twilight_opacity_includes_night_amount_factor', includesFactor,
        `correct=${correctOp.toFixed(4)}, without_factor=${droppedFactorOp.toFixed(4)}, diff=${Math.abs(correctOp - droppedFactorOp).toFixed(4)}`);
    }

    // 7. The § 4a worked numbers: SUNARC.both() (cmo/brand/sbis/patterns/sun-arc/sunarc.js),
    // Denver 2026-09-23 (sunrise 408.26, sunset 1135.65 local minutes), both appearances, at
    // the spec's 393x852 table size and convey's 1280x820. Grounds and colours within 1 per
    // channel (§ 12), alphas within 0.001, positions within 0.5 px.
    // [label, minutes, W, H, appearance, ground, sun opacity, w, halo alpha,
    //  twilight glow [x, y, r, alpha, colour, corner alpha] or null]
    {
      const RISE = 408.25991130150896;
      const SET = 1135.6484964224096;
      const VECTORS = [
        ['13:00',780,393,852,'light','#FEFCF8',0.55,0,0.22,null],
        ['13:00',780,393,852,'dark','#392E26',0.2,0,0.22,null],
        ['13:00',780,1280,820,'light','#FEFCF8',0.55,0,0.22,null],
        ['13:00',780,1280,820,'dark','#392E26',0.2,0,0.22,null],
        ['sunset',1136,393,852,'light','#FEFCF7',0.1444,0.7344,0.0578,[601.86,1019.65,832.39,0.6977,'#FFE296',0.3728]],
        ['sunset',1136,393,852,'dark','#392E26',0.0525,0.7344,0.0578,[601.86,1019.65,832.39,0.4553,'#F9BA36',0.2433]],
        ['sunset',1136,1280,820,'light','#FEFCF7',0.1444,0.7344,0.0578,[1688.07,1199.56,1736.79,0.6977,'#FFE296',0.3736]],
        ['sunset',1136,1280,820,'dark','#392E26',0.0525,0.7344,0.0578,[1688.07,1199.56,1736.79,0.4553,'#F9BA36',0.2439]],
        ['19:41',1181,393,852,'light','#E9DECC',0,0.9937,null,[620.44,1086.72,832.39,0.944,'#FFE294',0.4161]],
        ['19:41',1181,393,852,'dark','#2E241C',0,0.9937,null,[620.44,1086.72,832.39,0.6161,'#F8B836',0.2716]],
        ['19:41',1181,1280,820,'light','#E9DECC',0,0.9937,null,[1759.4,1304.68,1736.79,0.944,'#FFE294',0.4162]],
        ['19:41',1181,1280,820,'dark','#2E241C',0,0.9937,null,[1759.4,1304.68,1736.79,0.6161,'#F8B836',0.2716]],
        ['22:00',1320,393,852,'light','#DFD2BC',0,0.4341,null,[642.28,1176.83,832.39,0.4124,'#FFDC7F',0.1521]],
        ['22:00',1320,393,852,'dark','#2B2119',0,0.4341,null,[642.28,1176.83,832.39,0.2692,'#F1A739',0.0993]],
        ['22:00',1320,1280,820,'light','#DFD2BC',0,0.4341,null,[1849.86,1447.74,1736.79,0.4124,'#FFDC7F',0.1532]],
        ['22:00',1320,1280,820,'dark','#2B2119',0,0.4341,null,[1849.86,1447.74,1736.79,0.2692,'#F1A739',0.1]],
        ['01:00',60,393,852,'light','#D7C9B0',0,0,null,null],
        ['01:00',60,393,852,'dark','#281E17',0,0,null,null],
        ['01:00',60,1280,820,'light','#D7C9B0',0,0,null,null],
        ['01:00',60,1280,820,'dark','#281E17',0,0,null,null],
        ['05:30',330,393,852,'light','#E8DDCA',0,0.9381,null,[-249.94,-244.96,832.39,0.8912,'#FFE08F',0.3749]],
        ['05:30',330,393,852,'dark','#2E241C',0,0.9381,null,[-249.94,-244.96,832.39,0.5816,'#F6B437',0.2447]],
        ['05:30',330,1280,820,'light','#E8DDCA',0,0.9381,null,[-524.3,-489.22,1736.79,0.8912,'#FFE08F',0.3798]],
        ['05:30',330,1280,820,'dark','#2E241C',0,0.9381,null,[-524.3,-489.22,1736.79,0.5816,'#F6B437',0.2478]],
      ];
      const hexDiff = (a, b) => Math.max(...[1, 3, 5].map((k) => Math.abs(parseInt(a.substr(k, 2), 16) - parseInt(b.substr(k, 2), 16))));
      const misses = [];
      for (const [label, m, W, H, ap, ground, op, w, haloA, tw] of VECTORS) {
        const f = window.SunArc.frame(W, H, m, RISE, SET, ap, tokens);
        const why = [];
        if (hexDiff(f.ground, ground) > 1) why.push(`ground ${f.ground} != ${ground}`);
        if (Math.abs(f.opacity - op) > 0.001) why.push(`sun ${f.opacity.toFixed(4)} != ${op}`);
        if (Math.abs(f.twilight.w - w) > 0.001) why.push(`w ${f.twilight.w.toFixed(4)} != ${w}`);
        if ((f.halo ? f.halo.a : null) === null ? haloA !== null : Math.abs(f.halo.a - haloA) > 0.001) why.push(`halo ${f.halo ? f.halo.a : null} != ${haloA}`);
        if (!f.glow !== !tw) why.push(`twilight glow ${f.glow ? 'drawn' : 'absent'}, expected ${tw ? 'drawn' : 'absent'}`);
        if (f.glow && tw) {
          const [x, y, r, a, colour, corner] = tw;
          if (Math.abs(f.glow.x - x) > 0.5 || Math.abs(f.glow.y - y) > 0.5) why.push(`centre (${f.glow.x.toFixed(1)}, ${f.glow.y.toFixed(1)}) != (${x}, ${y})`);
          if (Math.abs(f.glow.r - r) > 0.5) why.push(`radius ${f.glow.r.toFixed(1)} != ${r}`);
          if (Math.abs(f.glow.a - a) > 0.001) why.push(`alpha ${f.glow.a.toFixed(4)} != ${a}`);
          if (hexDiff(f.glow.color, colour) > 1) why.push(`colour ${f.glow.color} != ${colour}`);
          const c = Math.max(window.SunArc.glowAt(f.glow, W, H, tokens), window.SunArc.glowAt(f.glow, 0, 0, tokens));
          if (Math.abs(c - corner) > 0.002) why.push(`corner ${c.toFixed(4)} != ${corner}`);
        }
        if (why.length) misses.push(`${label} ${W}x${H} ${ap}: ${why.join(', ')}`);
      }
      // § 12: at dusk + 15 the dusk-side corner reads >= 0.25 on dark and >= 0.40 on light.
      const dusk15 = (ap) => {
        const f = window.SunArc.frame(1280, 820, 1181, RISE, SET, ap, tokens);
        return window.SunArc.glowAt(f.glow, 1280, 820, tokens);
      };
      const cornerOk = dusk15('dark') >= 0.25 && dusk15('light') >= 0.40;
      assert('7_section_4a_worked_numbers_both_appearances', misses.length === 0 && cornerOk,
        misses.length ? misses.join(' | ') : `${VECTORS.length} vectors match; dusk+15 corner dark=${dusk15('dark').toFixed(3)}, light=${dusk15('light').toFixed(3)}`);
    }

    // 8. True dark: the window is 180 min centred on solar midnight (23:21-02:21 on the worked
    // day); inside it no glow of any kind is drawn and the ground is the true-dark ground; the
    // twilight glow's radius is phi^2 x R wherever it is drawn.
    {
      const RISE = 408.25991130150896;
      const SET = 1135.6484964224096;
      const win = window.SunArc.trueDarkWindow(RISE, SET, tokens.twilightMinutes, tokens.trueDarkMinutes);
      const span = ((win.to - win.from) % 1440 + 1440) % 1440;
      const hexDiff = (a, b) => Math.max(...[1, 3, 5].map((k) => Math.abs(parseInt(a.substr(k, 2), 16) - parseInt(b.substr(k, 2), 16))));
      let insideBad = 0;
      let radiusBad = 0;
      for (let m = 0; m < 1440; m += 1) {
        for (const ap of ['light', 'dark']) {
          const f = window.SunArc.frame(1280, 820, m, RISE, SET, ap, tokens);
          const inside = ((m - win.from) % 1440 + 1440) % 1440 < span;
          const deep = ap === 'dark' ? tokens.groundDarkDeep : tokens.groundLightDeep;
          if (inside && (f.glow || f.halo || f.opacity !== 0 || hexDiff(f.ground, deep) > 1)) insideBad += 1;
          if (f.glow && Math.abs(f.glow.r - 2.6180339887 * f.geom.R) > 0.01) radiusBad += 1;
        }
      }
      assert('8_true_dark_window_has_no_glow_and_the_deep_ground',
        Math.abs(span - 180) < 0.01 && Math.abs(win.from - (23 * 60 + 21.95)) < 0.1 && insideBad === 0 && radiusBad === 0,
        `window ${win.from.toFixed(1)}-${win.to.toFixed(1)} (${span.toFixed(1)} min), inside violations=${insideBad}, radius violations=${radiusBad}`);
    }

    // 9. The dark row's night ground is still the 09-19 night ground: the two-step OKLab mix of
    // --cream-bright toward ink, then toward the warm dark, lands on --sunarc-ground-dark-night.
    {
      const mixedNight = window.SunArc.nightGroundColor(tokens.creamBright, tokens.ink, tokens.warmDark, tokens.mixInk, tokens.mixWarm);
      const hex = (h) => [1, 3, 5].map((k) => parseInt(h.substr(k, 2), 16));
      const diffTo = (a, b) => Math.max(...hex(a).map((v, k) => Math.abs(v - hex(b)[k])));
      const diff = diffTo(mixedNight, tokens.groundDarkNight);
      assert('9_dark_night_ground_is_the_09_19_mix', diff <= 1 && diffTo(tokens.nightGround, tokens.groundDarkNight) === 0,
        `mixed=${mixedNight}, ground-dark-night=${tokens.groundDarkNight}, night-ground=${tokens.nightGround}, maxChannelDiff=${diff}`);
    }

    // 10. A different day-ground (#FFFFFF or #3366CC) at nightAmount=1 is NOT that token; nightAmount=0.5 is between day and full-night in OKLab L
    {
      const customDay = '#3366CC';
      const customNight = window.SunArc.nightGroundColor(customDay, tokens.ink, tokens.warmDark, tokens.mixInk, tokens.mixWarm);
      const isNotOracle = customNight.toUpperCase() !== tokens.nightGround.toUpperCase();

      const midColor = window.SunArc.mixedGround(customDay, customNight, 0.5);
      const lDay = window.SunArc.oklabLightness(customDay);
      const lNight = window.SunArc.oklabLightness(customNight);
      const lMid = window.SunArc.oklabLightness(midColor);

      const minL = Math.min(lDay, lNight);
      const maxL = Math.max(lDay, lNight);
      const isBetween = lMid > minL && lMid < maxL;

      assert('10_custom_day_ground_and_oklab_lightness_midpoint', isNotOracle && isBetween,
        `customNight=${customNight} !== oracle ${tokens.nightGround}; L(day)=${lDay.toFixed(3)}, L(mid)=${lMid.toFixed(3)}, L(night)=${lNight.toFixed(3)}`);
    }

    // 11. NOAA: 39.74, -104.99, 2026-09-19, offset -360: sunrise/sunset within 1 minute of 06:44 and 19:02 local
    {
      const date = new Date('2026-09-19T12:00:00Z');
      const res = window.SunArc.noaaSunriseSunset(39.74, -104.99, date, -360);
      const expRiseMin = 6 * 60 + 44; // 404
      const expSetMin = 19 * 60 + 2;  // 1142

      const riseOk = res && Math.abs(res.rise - expRiseMin) <= 1.0;
      const setOk = res && Math.abs(res.set - expSetMin) <= 1.0;

      assert('11_noaa_denver_sunrise_sunset_within_1min', Boolean(riseOk && setOk),
        `rise=${res ? res.rise.toFixed(1) : 'null'} (exp ${expRiseMin}), set=${res ? res.set.toFixed(1) : 'null'} (exp ${expSetMin})`);
    }

    // 12. The appearance is the owner's system setting, never the clock (spec §§ 2, 6, 10, 12).
    // A fake prefers-color-scheme query on a page that declares `color-scheme: light dark`:
    // flipping it at noon and at 01:00 repaints to the other row at once through the change
    // event; a 24 h sweep at a fixed setting never changes the appearance; nothing is written
    // on <html>. On a light-only page (convey's own declaration) the system's dark setting
    // keeps the light row at every hour. Teardown removes the listener.
    {
      // matchMedia answers only the exact query the spec names; any other string gets a query
      // that never matches, so a typo in the engine's query fails this test.
      function strictMatchMedia(q) {
        return (s) => (s === '(prefers-color-scheme: dark)' ? q : { matches: false, addEventListener() {}, removeEventListener() {} });
      }
      function fakeQuery(matches) {
        const q = { matches, media: '(prefers-color-scheme: dark)', listeners: [] };
        q.addEventListener = (type, fn) => { if (type === 'change') q.listeners.push(fn); };
        q.removeEventListener = (type, fn) => { q.listeners = q.listeners.filter((g) => g !== fn); };
        q.set = (v) => { q.matches = v; q.listeners.slice().forEach((fn) => fn({ matches: v })); };
        return q;
      }
      const lightGrounds = [tokens.groundLightDay, tokens.groundLightNight, tokens.groundLightDeep];
      const isLightRow = (hex) => window.SunArc.oklabLightness(hex) > 0.5;
      const attrsOf = (el) => Array.from(el.attributes).filter((a) => a.name !== 'style').map((a) => a.name + '=' + a.value).join(' ');
      const htmlAttrsBefore = attrsOf(document.documentElement) + ' | ' + attrsOf(document.body);

      const host = document.createElement('div');
      host.style.colorScheme = 'light dark';
      const box = document.createElement('div');
      host.appendChild(box);
      document.body.appendChild(host);
      const query = fakeQuery(false);
      let fakeTime = new Date('2026-09-23T12:00:00').getTime();
      const instance = window.SunArc.mount(box, {
        getNow: () => new Date(fakeTime), getZoneId: () => 'America/Denver', utcOffsetMinutes: -360,
        matchMedia: strictMatchMedia(query), setInterval: () => 1, clearInterval: () => {},
      });
      const rootAttrsBefore = attrsOf(box);
      const noonLight = instance.getFrame().appearance;
      query.set(true);
      // The change event repaints at once, with no interval tick in between.
      const noonDark = instance.getFrame().appearance;
      const noonDarkGround = box.style.backgroundColor;
      fakeTime = new Date('2026-09-24T01:00:00').getTime();
      instance.recompute();
      const nightDark = instance.getFrame().appearance;
      query.set(false);
      const nightLight = instance.getFrame().appearance;
      const nightLightGround = box.style.backgroundColor;

      // A full day at each fixed setting: the appearance never moves with the clock.
      const seen = { light: new Set(), dark: new Set() };
      for (const setting of [false, true]) {
        query.set(setting);
        for (let k = 0; k < 96; k += 1) {
          fakeTime += 15 * 60 * 1000;
          instance.recompute();
          seen[setting ? 'dark' : 'light'].add(instance.getFrame().appearance);
          if (!setting && !isLightRow(instance.getFrame().ground)) seen.light.add('dark-ground');
          if (setting && isLightRow(instance.getFrame().ground)) seen.dark.add('light-ground');
        }
      }
      const rootAttrsAfter = attrsOf(box);
      const listenersWhileMounted = query.listeners.length;
      instance.teardown();
      const listenersAfter = query.listeners.length;

      // Convey's own case: the page is light only, the owner's system is dark.
      host.style.colorScheme = 'light';
      const darkSystem = fakeQuery(true);
      const lightOnly = window.SunArc.mount(box, {
        getNow: () => new Date(fakeTime), getZoneId: () => 'America/Denver', utcOffsetMinutes: -360,
        matchMedia: strictMatchMedia(darkSystem), setInterval: () => 1, clearInterval: () => {},
      });
      let lightOnlyBad = 0;
      for (let k = 0; k < 96; k += 1) {
        fakeTime += 15 * 60 * 1000;
        lightOnly.recompute();
        if (lightOnly.getFrame().appearance !== 'light' || !isLightRow(lightOnly.getFrame().ground)) lightOnlyBad += 1;
      }
      lightOnly.teardown();
      host.remove();

      const htmlAttrsAfter = attrsOf(document.documentElement) + ' | ' + attrsOf(document.body);
      const pass = noonLight === 'light' && noonDark === 'dark' && nightDark === 'dark' && nightLight === 'light' &&
        noonDarkGround === 'rgb(57, 46, 38)' && nightLightGround === 'rgb(215, 201, 176)' &&
        !isLightRow(tokens.groundDarkDay) && lightGrounds.every(isLightRow) &&
        rootAttrsAfter === rootAttrsBefore &&
        seen.light.size === 1 && seen.light.has('light') && seen.dark.size === 1 && seen.dark.has('dark') &&
        listenersWhileMounted === 1 && listenersAfter === 0 && lightOnlyBad === 0 &&
        htmlAttrsAfter === htmlAttrsBefore && !('sunarcAppearance' in document.documentElement.dataset);
      assert('12_appearance_follows_the_system_never_the_clock', pass,
        `noon ${noonLight}->${noonDark} (${noonDarkGround}), 01:00 ${nightDark}->${nightLight} (${nightLightGround}), sweep light=${[...seen.light]}, dark=${[...seen.dark]}, ` +
        `listeners ${listenersWhileMounted}->${listenersAfter}, light-only page off-row frames=${lightOnlyBad}, html/body attrs unchanged=${htmlAttrsAfter === htmlAttrsBefore}, root attrs unchanged=${rootAttrsAfter === rootAttrsBefore}`);
    }

    // 13. Full-day sweep: no fetch, no XMLHttpRequest, and the location APIs are never
    // reached at all. Spec § 12 accepts no location request attributable to this pattern, and
    // a granted permission is still a request.
    {
      let fetchCalled = 0;
      let xhrCalled = 0;
      let permissionQueries = 0;
      let geoCalls = 0;

      const origFetch = window.fetch;
      const origXHR = window.XMLHttpRequest;
      const origPerms = navigator.permissions;
      const origGeo = navigator.geolocation;

      window.fetch = function () { fetchCalled += 1; return origFetch ? origFetch.apply(this, arguments) : Promise.reject(); };
      window.XMLHttpRequest = function () { xhrCalled += 1; if (origXHR) return new origXHR(); };
      Object.defineProperty(navigator, 'permissions', {
        configurable: true,
        get: () => { permissionQueries += 1; return { query: () => { permissionQueries += 1; return Promise.resolve({ state: 'granted' }); } }; }
      });
      Object.defineProperty(navigator, 'geolocation', {
        configurable: true,
        get: () => { geoCalls += 1; return { getCurrentPosition: () => { geoCalls += 1; } }; }
      });

      const testContainer = document.createElement('div');
      document.body.appendChild(testContainer);

      let fakeTime = new Date('2026-09-19T06:00:00').getTime();
      const instance = window.SunArc.mount(testContainer, {
        getNow: () => new Date(fakeTime),
        getZoneId: () => 'America/Denver',
        utcOffsetMinutes: -360,
      });

      for (let min = 0; min < 1440; min += 30) {
        fakeTime += 30 * 60 * 1000;
        instance.recompute();
      }

      // The sweep runs a full 24 hours, so it crosses midnight and the daily recompute fires;
      // the pair is the next day's Denver pair, minutes away from the worked day's, never the
      // fixed default.
      const sunTimes = instance.getSunTimes();
      const usedTheZone = sunTimes && sunTimes.rise !== 390 && sunTimes.set !== 1170 &&
        Math.abs(sunTimes.rise - (6 * 60 + 44)) <= 5.0 && Math.abs(sunTimes.set - (19 * 60 + 2)) <= 5.0;

      instance.teardown();
      testContainer.remove();

      window.fetch = origFetch;
      window.XMLHttpRequest = origXHR;
      Object.defineProperty(navigator, 'permissions', { configurable: true, value: origPerms });
      Object.defineProperty(navigator, 'geolocation', { configurable: true, value: origGeo });

      assert('13_no_network_and_no_location_api_touched',
        fetchCalled === 0 && xhrCalled === 0 && permissionQueries === 0 && geoCalls === 0 && usedTheZone,
        `fetch=${fetchCalled}, xhr=${xhrCalled}, permissions=${permissionQueries}, geolocation=${geoCalls}, ` +
        `sunTimes=(${sunTimes ? sunTimes.rise.toFixed(1) + ', ' + sunTimes.set.toFixed(1) : 'null'})`);
    }

    // 14. Rapid resize burst -> recompute once, not per event (inject fake setTimeout/setInterval; flush debounce once)
    {
      let timeouts = [];
      let timeoutId = 100;
      let recomputeCount = 0;

      const fakeSetTimeout = (fn, ms) => {
        const id = ++timeoutId;
        timeouts.push({ id, fn, ms });
        return id;
      };
      const fakeClearTimeout = (id) => {
        timeouts = timeouts.filter(t => t.id !== id);
      };
      const fakeSetInterval = () => 999;
      const fakeClearInterval = () => {};

      const testContainer = document.createElement('div');
      document.body.appendChild(testContainer);

      const instance = window.SunArc.mount(testContainer, {
        setTimeout: fakeSetTimeout,
        clearTimeout: fakeClearTimeout,
        setInterval: fakeSetInterval,
        clearInterval: fakeClearInterval,
        resizeDebounceMs: 250,
      });

      // Dispatch 10 resize events rapidly
      for (let i = 0; i < 10; i++) {
        window.dispatchEvent(new Event('resize'));
      }

      const pendingTimerCount = timeouts.length;
      // Flush remaining timer
      while (timeouts.length > 0) {
        const timer = timeouts.shift();
        timer.fn();
      }

      instance.teardown();
      testContainer.remove();

      assert('14_rapid_resize_burst_debounces_to_single_recompute', pendingTimerCount === 1,
        `pendingTimerCount=${pendingTimerCount} (expected exactly 1 timer held after 10 rapid events)`);
    }

    // 15. Stub one numeric --sunarc-* non-numeric, and separately one color invalid -> no sun/glow paint
    {
      const invalidNumericTokens = { ...tokens, angle: NaN };
      const invalidNumericValid = window.SunArc.tokensValid(invalidNumericTokens);

      const invalidColorTokens = { ...tokens, groundLightNight: 'invalid-not-a-color-12345' };
      const invalidColorValid = window.SunArc.tokensValid(invalidColorTokens);

      const testContainer = document.createElement('div');
      document.body.appendChild(testContainer);

      const instance = window.SunArc.mount(testContainer);
      const glowEl = testContainer.querySelector('.sunarc-glow');
      const sunEl = testContainer.querySelector('.sunarc-sun');

      // Case A: invalid numeric token
      testContainer.style.setProperty('--sunarc-angle', 'not-a-number');
      instance.recompute();
      const numNoPaint = (testContainer.style.backgroundColor === 'transparent' || testContainer.style.backgroundColor === '') &&
                         (glowEl.style.display === 'none') &&
                         (sunEl.style.display === 'none');

      // Case B: restore numeric, set invalid color token
      testContainer.style.removeProperty('--sunarc-angle');
      testContainer.style.setProperty('--sunarc-glow-color', 'invalid-color-string-xyz');
      instance.recompute();
      const colorNoPaint = (testContainer.style.backgroundColor === 'transparent' || testContainer.style.backgroundColor === '') &&
                           (glowEl.style.display === 'none') &&
                           (sunEl.style.display === 'none');

      // Case D: restore the colour, drop one of the 09-23 ground tokens
      testContainer.style.removeProperty('--sunarc-glow-color');
      testContainer.style.setProperty('--sunarc-ground-dark-deep', 'not-a-colour');
      instance.recompute();
      const groundNoPaint = (glowEl.style.display === 'none') && (sunEl.style.display === 'none') &&
                            (testContainer.querySelector('.sunarc-twilight').style.display === 'none');

      // Case C: parseTokens on mock with invalid prop
      const fakeComputedStyle = {
        getPropertyValue: (prop) => {
          if (prop === '--sunarc-angle') return 'invalid-deg';
          return '1';
        }
      };
      const parsedInvalid = window.SunArc.parseTokens(fakeComputedStyle);
      const isParsedInvalid = !window.SunArc.tokensValid(parsedInvalid);

      instance.teardown();
      testContainer.remove();

      assert('15_invalid_numeric_and_color_tokens_fail_closed',
        !invalidNumericValid && !invalidColorValid && isParsedInvalid && numNoPaint && colorNoPaint && groundNoPaint,
        `numericValid=${invalidNumericValid}, colorValid=${invalidColorValid}, numNoPaint=${numNoPaint}, colorNoPaint=${colorNoPaint}, groundNoPaint=${groundNoPaint}`);
    }

    // 16. The bundled tzdb table carries the spec's worked zone point (§ 5 rung 2:
    // "America/Denver -> 39.74 N, 104.98 W").
    {
      const denver = window.SunArc.zonePoint('America/Denver');
      const ok = denver && Math.abs(denver.lat - 39.74) < 0.005 && Math.abs(denver.lon - (-104.98)) < 0.005;
      assert('16_zone_table_carries_the_spec_point',
        Boolean(ok) && window.SunArc.zoneCount === 418 &&
        Boolean(window.SunArc.zonePoint('Europe/Oslo')) &&
        Boolean(window.SunArc.zonePoint('America/Indiana/Indianapolis')) &&
        window.SunArc.zonePoint('US/Mountain') === null,
        `Denver=${denver ? denver.lat + ',' + denver.lon : 'null'}, count=${window.SunArc.zoneCount}`);
    }

    // 17. Rung order: a held location outranks the zone point, and an identifier the table
    // does not know falls to 06:30/19:30.
    {
      const testContainer = document.createElement('div');
      document.body.appendChild(testContainer);
      const now = new Date('2026-09-19T12:00:00');

      const held = window.SunArc.mount(testContainer, {
        getNow: () => now, getZoneId: () => 'America/Denver', utcOffsetMinutes: -360,
        heldCoords: { lat: -33.87, lon: 151.22 },
      });
      const heldTimes = held.getSunTimes();
      held.teardown();

      const unknown = window.SunArc.mount(testContainer, {
        getNow: () => now, getZoneId: () => 'US/Mountain', utcOffsetMinutes: -360,
      });
      const unknownTimes = unknown.getSunTimes();
      unknown.teardown();
      testContainer.remove();

      assert('17_rung_order_held_then_zone_then_default',
        Math.abs(heldTimes.rise - (6 * 60 + 44)) > 1.0 &&
        unknownTimes.rise === 390 && unknownTimes.set === 1170,
        `held=(${heldTimes.rise.toFixed(1)}, ${heldTimes.set.toFixed(1)}), unknown=(${unknownTimes.rise}, ${unknownTimes.set})`);
    }

    // 18. A timezone change recomputes on the next tick (§ 5: "Recompute once a day and on a
    // timezone or location change").
    {
      const testContainer = document.createElement('div');
      document.body.appendChild(testContainer);
      let zone = 'America/Denver';
      const instance = window.SunArc.mount(testContainer, {
        getNow: () => new Date('2026-09-19T12:00:00'),
        getZoneId: () => zone,
        utcOffsetMinutes: -360,
      });
      const denver = Object.assign({}, instance.getSunTimes());
      zone = 'Asia/Tokyo';
      instance.recompute();
      const tokyo = instance.getSunTimes();
      instance.teardown();
      testContainer.remove();

      assert('18_timezone_change_recomputes',
        instance.getZoneId() === 'Asia/Tokyo' && Math.abs(tokyo.rise - denver.rise) > 1.0,
        `denver=(${denver.rise.toFixed(1)}, ${denver.set.toFixed(1)}), tokyo=(${tokyo.rise.toFixed(1)}, ${tokyo.set.toFixed(1)})`);
    }

    // 19. Polar day: the equation has no answer, and the chain still returns the last valid
    // pair rather than 06:30/19:30 (§ 5: "hold the last valid pair").
    {
      const midsummer = new Date('2026-06-21T12:00:00Z');
      const point = window.SunArc.zonePoint('Arctic/Longyearbyen');
      const direct = window.SunArc.noaaSunriseSunset(point.lat, point.lon, midsummer, 120);
      const held = window.SunArc.solarPair(point, midsummer, 120);
      assert('19_polar_day_holds_the_last_valid_pair',
        direct === null && held !== null && held.rise !== 390 && held.set !== 1170,
        `direct=${direct === null ? 'null' : JSON.stringify(direct)}, held=${held ? held.rise.toFixed(1) + ',' + held.set.toFixed(1) : 'null'}`);
    }

    // 20. A sunset after local midnight is carried into the next day, so dawn precedes dusk
    // and the small hours read as the end of the day that is ending.
    {
      const midsummer = new Date('2026-06-21T12:00:00Z');
      const pair = window.SunArc.solarPair(window.SunArc.zonePoint('Atlantic/Reykjavik'), midsummer, 0);
      const tw = 30;
      const dusk = pair.set + tw;
      const shift = (clock) => (dusk > 1440 && clock < dusk - 1440 ? clock + 1440 : clock);
      const tSmallHours = window.SunArc.dayProgress(shift(10), pair.rise, pair.set, tw);
      const nightSmallHours = window.SunArc.nightAmount(shift(10), pair.rise, pair.set, tw);
      const nightLater = window.SunArc.nightAmount(shift(60), pair.rise, pair.set, tw);
      assert('20_wrapped_sunset_carried_into_the_next_day',
        pair.set > 1440 && pair.set > pair.rise &&
        tSmallHours > 0.9 && nightSmallHours > 0 && nightSmallHours < 1 && nightLater === 1,
        `rise=${pair.rise.toFixed(1)}, set=${pair.set.toFixed(1)}, t(00:10)=${tSmallHours.toFixed(3)}, night(00:10)=${nightSmallHours.toFixed(2)}, night(01:00)=${nightLater}`);
    }

    // 21. The glows are painted with `circle closest-side`, so each gradient reaches 0 at the
    // element's own edge. The bare `circle` default (farthest-corner) left a hard edge at the
    // border-radius clip. Checked on the painted elements, not the model.
    {
      const testContainer = document.createElement('div');
      document.body.appendChild(testContainer);
      const instance = window.SunArc.mount(testContainer, {
        getNow: () => new Date('2026-09-23T18:56:00'), getZoneId: () => 'America/Denver', utcOffsetMinutes: -360,
        setInterval: () => 1, clearInterval: () => {},
      });
      const twilightBg = testContainer.querySelector('.sunarc-twilight').style.backgroundImage;
      const haloBg = testContainer.querySelector('.sunarc-glow').style.backgroundImage;
      const order = Array.from(testContainer.children).map((el) => el.className).join(',');
      instance.teardown();
      testContainer.remove();
      assert('21_glows_painted_closest_side_under_the_sun',
        /closest-side/.test(twilightBg) && /closest-side/.test(haloBg) && order === 'sunarc-twilight,sunarc-glow,sunarc-sun',
        `twilight=${twilightBg.slice(0, 48)}..., halo=${haloBg.slice(0, 48)}..., order=${order}`);
    }

    // 22. A sunset that carries past midnight, through frame() directly with the raw clock:
    // the small hours are the end of the ending day, x and w stay in [0, 1], and every glow
    // colour stays between its ramp's two ends (OKLab L), never extrapolated.
    {
      const rise = 150;
      const set = 1450;
      const lOf = (hex) => window.SunArc.oklabLightness(hex);
      const within = (hex, a, b) => lOf(hex) >= Math.min(lOf(a), lOf(b)) - 0.005 && lOf(hex) <= Math.max(lOf(a), lOf(b)) + 0.005;
      let bad = [];
      for (let m = 0; m < 1440; m += 1) {
        for (const ap of ['light', 'dark']) {
          const f = window.SunArc.frame(393, 852, m, rise, set, ap, tokens);
          const tw = f.twilight;
          if (!(tw.x >= 0 && tw.x <= 1 && tw.w >= 0 && tw.w <= 1)) bad.push(`${m} ${ap} x=${tw.x} w=${tw.w}`);
          if (f.glow) {
            const ok = ap === 'dark' ? within(f.glow.color, tokens.glowColor, tokens.twilightDarkTo)
              : within(f.glow.color, tokens.twilightLightFrom, tokens.glowColor);
            if (!ok) bad.push(`${m} ${ap} colour ${f.glow.color}`);
          }
        }
      }
      const smallHours = window.SunArc.frame(393, 852, 20, rise, set, 'dark', tokens);
      const nearB = smallHours.glow && Math.hypot(smallHours.glow.x - smallHours.geom.B.x, smallHours.glow.y - smallHours.geom.B.y) < smallHours.geom.R;
      assert('22_wrapped_sunset_through_frame_stays_in_range',
        bad.length === 0 && smallHours.twilight.phase === 'day' && Boolean(nearB),
        `violations=${bad.length}${bad.length ? ' e.g. ' + bad.slice(0, 3).join('; ') : ''}, 00:20 phase=${smallHours.twilight.phase}, glow near B=${Boolean(nearB)}`);
    }

    // 23. One extended minute axis and short nights (spec § 4a, 2026-09-23 canon update): a
    // Reykjavik-like midsummer pair with the sunset wrapped below sunrise (rise 175, set 3) gives
    // day at 00:10 (w 0.877), evening at 01:00 (w 0.672) and before dawn at 02:00 (w 0.716),
    // against SUNARC.both(); a night shorter than 180 + 120 min gets a true dark of span - 120,
    // and a white night (span <= 120) none, so the glow never snaps.
    {
      const f = (m) => window.SunArc.frame(393, 852, m, 175, 3, 'dark', tokens).twilight;
      const a = f(10);
      const b = f(60);
      const c = f(120);
      const vectorsOk = a.phase === 'day' && Math.abs(a.w - 0.877) < 0.001 &&
        b.phase === 'evening' && Math.abs(b.w - 0.672) < 0.001 &&
        c.phase === 'before dawn' && Math.abs(c.w - 0.716) < 0.001;
      const halves = [[400, 90], [240, 60], [150, 15], [120, 0], [60, 0]]
        .map(([span, half]) => Math.abs(window.SunArc.trueDarkHalf(span, tokens.trueDarkMinutes) - half) < 1e-9);
      // On a short night the weight moves by small steps minute to minute; no jump from 1 to 0.
      let maxStep = 0;
      let prev = null;
      for (let m = 0; m < 1440; m += 1) {
        const w = window.SunArc.frame(393, 852, m, 175, 3, 'dark', tokens).twilight.w;
        if (prev !== null) maxStep = Math.max(maxStep, Math.abs(w - prev));
        prev = w;
      }
      assert('23_extended_minute_axis_and_short_nights_ease',
        vectorsOk && halves.every(Boolean) && maxStep < 0.2,
        `00:10 ${a.phase} ${a.w.toFixed(3)}, 01:00 ${b.phase} ${b.w.toFixed(3)}, 02:00 ${c.phase} ${c.w.toFixed(3)}, halves ok=${halves.every(Boolean)}, max minute step=${maxStep.toFixed(3)}`);
    }

    assert('SUMMARY', failures === 0, failures ? `${failures} failure(s)` : `all ${testCount} assertions passed`);
  }

  run();
</script>
</body>
</html>
