<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>chat bar copy test</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    .pass { color: #0a7a2f; }
    .fail { color: #b00020; }
  </style>
  <script src="../chat_copy.js"></script>
</head>
<body>
  <div id="chatBarQueue" hidden></div>
  <div id="test-results">RUNNING chat bar copy</div>
  <ol id="results"></ol>

  <script>
    const queueStatus = document.getElementById('chatBarQueue');
    const summary = document.getElementById('test-results');
    const results = document.getElementById('results');
    let failures = 0;

    function report(name, ok, detail) {
      const item = document.createElement('li');
      item.className = ok ? 'pass' : 'fail';
      item.textContent = `${ok ? 'PASS' : 'FAIL'} ${name}${detail ? ` — ${detail}` : ''}`;
      results.appendChild(item);
      if (!ok) failures += 1;
    }

    function assert(name, condition) {
      report(name, !!condition);
    }

    function setJobsIndicator(count) {
      const countValue = Number(count || 0);
      if (!Number.isFinite(countValue) || countValue < 1) {
        queueStatus.textContent = '';
        queueStatus.hidden = true;
        return;
      }
      const jobCount = Math.floor(countValue);
      queueStatus.textContent = jobCount === 1
        ? window.solChatCopy.CHAT_JOBS_INDICATOR_SINGULAR
        : window.solChatCopy.CHAT_JOBS_INDICATOR_PLURAL_FORMAT.replace('{count}', String(jobCount));
      queueStatus.hidden = false;
    }

    function showQueueCapMessage() {
      queueStatus.textContent = window.solChatCopy.CHAT_QUEUE_DEPTH_CAP_MESSAGE;
      queueStatus.hidden = false;
    }

    function runTests() {
      assert('exec running label', window.solChatCopy.talentLabel('exec', 'running') === 'making that change…');
      assert('support errored label', window.solChatCopy.talentLabel('support', 'errored') === "couldn't reach solstone support");
      assert('liveness thinking copy', window.solChatCopy.CHAT_LIVENESS_THINKING === 'sol is thinking…');
      assert('offer yes label', window.solChatCopy.CHAT_OFFER_SUPPORT_YES === 'yes, get support');
      assert('offer no label', window.solChatCopy.CHAT_OFFER_SUPPORT_NO === 'not now');
      assert('offer fallback copy', window.solChatCopy.CHAT_OFFER_SUPPORT_FALLBACK === 'want me to bring in solstone support?');
      assert('draft submit label', window.solChatCopy.CHAT_DRAFT_SUBMIT === 'send to solstone support');
      assert('draft cancel label', window.solChatCopy.CHAT_DRAFT_CANCEL === 'cancel');
      assert('draft header', window.solChatCopy.CHAT_DRAFT_HEADER === 'review before this goes to solstone support');
      assert('draft create kind', window.solChatCopy.CHAT_DRAFT_KIND_CREATE === 'new support request');
      assert('draft feedback kind', window.solChatCopy.CHAT_DRAFT_KIND_FEEDBACK === 'send feedback');
      assert('draft reply kind', window.solChatCopy.CHAT_DRAFT_KIND_REPLY === 'reply');
      assert('draft attach kind', window.solChatCopy.CHAT_DRAFT_KIND_ATTACH === 'attach a file');
      assert('draft diagnostics title', window.solChatCopy.CHAT_DRAFT_DIAGNOSTICS_TITLE === "what's included with this request");
      assert('draft diagnostics note', window.solChatCopy.CHAT_DRAFT_DIAGNOSTICS_NOTE === 'these exact values go to solstone support with your request. nothing else leaves this machine.');
      assert('draft attach note', window.solChatCopy.CHAT_DRAFT_ATTACH_NOTE === 'the contents of this file go to solstone support. nothing else leaves this machine.');
      assert('draft floor', window.solChatCopy.CHAT_DRAFT_FLOOR === 'nothing is sent until you choose');
      assert('draft name attached yes', window.solChatCopy.CHAT_DRAFT_NAME_ATTACHED_YES === 'name attached: yes');
      assert('draft name attached no', window.solChatCopy.CHAT_DRAFT_NAME_ATTACHED_NO === 'name attached: no');
      assert('result view support', window.solChatCopy.CHAT_RESULT_VIEW_IN_SUPPORT === 'view in support →');
      const removedResultTryAgain = 'CHAT_RESULT_' + 'TRY_AGAIN';
      const removedResultTryAgainMessage = 'CHAT_RESULT_' + 'TRY_AGAIN_MESSAGE';
      assert('result try again removed', !(removedResultTryAgain in window.solChatCopy));
      assert('result try again message removed', !(removedResultTryAgainMessage in window.solChatCopy));
      const removedDiagnosticsLabel = 'CHAT_DRAFT_' + 'DIAGNOSTICS_LABEL';
      assert('old diagnostics label removed', !(removedDiagnosticsLabel in window.solChatCopy));
      assert('error detail expander copy', window.solChatCopy.CHAT_ERROR_DETAIL_EXPANDER_LABEL === 'show details');
      assert('error detail collapser copy', window.solChatCopy.CHAT_ERROR_DETAIL_COLLAPSER_LABEL === 'hide details');
      assert('liveness task format copy', window.solChatCopy.CHAT_LIVENESS_TASK_FORMAT === '{label} {task}');
      const phaseTwo = window.solChatCopy.CHAT_LIVENESS_TASK_FORMAT
        .replace('{label}', window.solChatCopy.talentLabel('exec', 'running'))
        .replace('{task}', 'Retrieve the history for Adrian Kunzle and Bill Putsis from this week');
      assert('liveness phase two composition', phaseTwo === 'making that change… Retrieve the history for Adrian Kunzle and Bill Putsis from this week');

      setJobsIndicator(0);
      assert('zero jobs hides queue', queueStatus.hidden && queueStatus.textContent === '');
      setJobsIndicator(1);
      assert('singular jobs text', !queueStatus.hidden && queueStatus.textContent === 'sol is running 1 job');
      setJobsIndicator(4);
      assert('plural jobs text', !queueStatus.hidden && queueStatus.textContent === 'sol is running 4 jobs');
      showQueueCapMessage();
      assert('cap message text', queueStatus.textContent === 'Give sol a moment to catch up — you have 10 messages waiting.');
      setJobsIndicator(9);
      assert('jobs indicator clears cap message', queueStatus.textContent === 'sol is running 9 jobs');

      summary.className = failures ? 'fail' : 'pass';
      summary.textContent = failures
        ? `FAIL chat bar copy: ${failures} failure(s)`
        : 'PASS chat bar copy: 0 failure(s)';
    }

    try {
      runTests();
    } catch (error) {
      failures += 1;
      report('uncaught exception', false, error && error.message ? error.message : String(error));
      summary.className = 'fail';
      summary.textContent = `FAIL chat bar copy: ${failures} failure(s)`;
    }
  </script>
</body>
</html>
