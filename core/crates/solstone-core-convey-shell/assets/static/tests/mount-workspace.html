<html lang="en">
<head>
  <meta charset="utf-8">
  <title>mount workspace test</title>
  <link rel="stylesheet" href="../app.css">
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; }
    .assertions { display: grid; gap: 6px; margin-top: 16px; }
    .pass { color: #166534; }
    .fail { color: #991b1b; }
  </style>
</head>
<body>
  <h1>mount workspace test</h1>
  <main id="main-content"></main>
  <div class="assertions" id="assertions"></div>

  <script src="../shell_gate.js"></script>
  <script>window.resolveSolShellReady({source: 'mount-workspace-test'});</script>
  <script src="../convey_copy.js"></script>
  <script src="../app.js"></script>
  <script src="../mount-workspace.js"></script>
  <script>
    const rows = document.getElementById('assertions');
    function assertRow(label, ok, detail) {
      const row = document.createElement('div');
      row.className = ok ? 'pass' : 'fail';
      row.textContent = `${ok ? 'PASS' : 'FAIL'} ${label}${detail ? ': ' + detail : ''}`;
      rows.appendChild(row);
    }

    async function run() {
      const order = [];
      window.__mountTestOrder = order;
      let mountedDetail = null;
      document.addEventListener('workspace:mounted', (event) => {
        mountedDetail = event.detail;
      }, { once: true });

      const srcBlob = new Blob([
        "window.__mountTestOrder.push('src');"
      ], { type: 'text/javascript' });
      const srcUrl = URL.createObjectURL(srcBlob);
      let fetchCount = 0;
      window.fetch = async (url) => {
        fetchCount += 1;
        if (url === '/ok') {
          return new Response(`
            <style>.mount-style-target { color: rgb(1, 2, 3); }</style>
            <div class="mount-style-target">mounted</div>
            <script>window.__mountTestOrder.push('inline-1');</` + `script>
            <script src="${srcUrl}"></` + `script>
            <script>window.__mountTestOrder.push('inline-2');</` + `script>
          `, { status: 200 });
        }
        if (url === '/fail' && fetchCount === 2) {
          return new Response('nope', { status: 500 });
        }
        return new Response('<div>retry mounted</div>', { status: 200 });
      };

      await window.mountWorkspaceFragment('/ok', { appName: 'test' });
      assertRow('script order', order.join(',') === 'inline-1,src,inline-2', order.join(','));
      const color = getComputedStyle(document.querySelector('.mount-style-target')).color;
      assertRow('style applied', color === 'rgb(1, 2, 3)', color);
      assertRow('mounted event', mountedDetail?.appName === 'test' && mountedDetail?.url === '/ok');

      try {
        await window.mountWorkspaceFragment('/fail', { appName: 'test' });
      } catch (_) {}
      const retry = document.querySelector('.surface-state-retry');
      assertRow('failure state', !!retry);
      const remounted = new Promise((resolve) => {
        document.addEventListener('workspace:mounted', resolve, { once: true });
        setTimeout(resolve, 2000);
      });
      retry.click();
      await remounted;
      assertRow('retry recovered', document.getElementById('main-content').textContent.includes('retry mounted'));
    }

    run().catch((error) => {
      assertRow('unexpected error', false, error.message || String(error));
    });
  </script>
</body>
</html>
