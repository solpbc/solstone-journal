</style>


<div class="workspace-content body-shell">
  <div data-date-nav></div>
  <h1 class="body-title" data-date-nav-heading></h1>
  <div id="body-state-gate"></div>
  <div id="body-view-root" hidden></div>
</div>

<script>
(() => {
  "use strict";

  const DAY_RE = /^\d{8}$/;
  const escapeHtml = (value) => window.AppServices.escapeHtml(value);
  const root = document.getElementById("body-view-root");
  const gate = document.getElementById("body-state-gate");

  function html(parts) {
    return parts.filter(Boolean).join("");
  }

  function asArray(value) {
    return Array.isArray(value) ? value : [];
  }

  function asObject(value) {
    return value && typeof value === "object" && !Array.isArray(value) ? value : {};
  }

  function safeNumber(value, fallback = 0) {
    const parsed = Number(value);
    return Number.isFinite(parsed) ? String(parsed) : String(fallback);
  }

  function safeClass(value) {
    return String(value ?? "").replace(/[^a-zA-Z0-9_-]/g, "");
  }

  function safeDay(value) {
    const text = String(value ?? "");
    return DAY_RE.test(text) ? text : "";
  }

  function bodyDayHref(value) {
    const day = safeDay(value);
    return day ? `/app/body/${escapeHtml(day)}` : "/app/body/";
  }

  function setLoading(text) {
    if (!root || !gate) return;
    root.hidden = true;
    gate.hidden = false;
    gate.innerHTML = window.SurfaceState.loading({ text });
  }

  function reveal(markup) {
    if (!root || !gate) return;
    gate.hidden = true;
    gate.innerHTML = "";
    root.innerHTML = markup;
    root.hidden = false;
  }

  function showError(heading, err, retryFn) {
    if (window.logError) {
      window.logError(err, { context: heading });
    }
    if (!root || !gate) return;
    root.hidden = true;
    gate.hidden = false;
    gate.innerHTML = window.SurfaceState.error({
      heading,
      desc: window.CONVEY_COPY.RELOAD_HINT,
      serverMessage: err?.serverMessage,
      detail: err,
      retry: true,
    });
    gate.querySelector(".surface-state-retry")?.addEventListener("click", retryFn, { once: true });
  }

  function renderHeader(title, subtitle, backLink, options = {}) {
    const showTitle = options.showTitle !== false;
    return html([
      '<header class="body-header">',
      showTitle ? `<h1 class="body-title">${escapeHtml(title)}</h1>` : "",
      subtitle ? `<p class="body-subtitle">${escapeHtml(subtitle)}</p>` : "",
      backLink ? '<nav class="body-nav" aria-label="Body views"><a class="body-link" href="/app/body/">&larr; body overview</a></nav>' : "",
      '</header>',
    ]);
  }

  function renderDayCard(item) {
    const recent = asObject(item);
    const day = safeDay(recent.day);
    const label = String(recent.label ?? "");
    const labelParts = label.split(" ");
    const monthLabel = labelParts[0] || "";
    const dayLabel = labelParts[1] || "";
    return html([
      `<article class="body-card body-day-card" data-day="${escapeHtml(day)}">`,
      '<div class="body-date-badge" aria-hidden="true"><div>',
      `<div class="body-date-badge-month">${escapeHtml(monthLabel)}</div>`,
      `<div class="body-date-badge-day">${escapeHtml(dayLabel)}</div>`,
      '</div></div>',
      '<div>',
      `<h3 class="body-day-card-date">${escapeHtml(label)}</h3>`,
      '<ul class="body-facts">',
      recent.sleep_duration ? `<li><span>Sleep</span><strong class="body-num">${escapeHtml(recent.sleep_duration)}${recent.sleep_in_bed ? ` <span class="body-fact-kind">in bed ${escapeHtml(recent.sleep_in_bed)}</span>` : ""}</strong></li>` : "",
      recent.glucose_label ? `<li><span>Glucose</span><strong class="body-num">${escapeHtml(recent.glucose_label)}</strong></li>` : "",
      recent.workout_count ? `<li><span>Workouts</span><strong class="body-num">${escapeHtml(recent.workout_count)}</strong></li>` : "",
      `<li><span>Sources</span><strong class="body-num">${escapeHtml(recent.source_count ?? 0)}</strong></li>`,
      '</ul>',
      `<p class="body-card-footer"><a class="body-link" href="${bodyDayHref(day)}">open day</a></p>`,
      '</div>',
      '</article>',
    ]);
  }

  function renderFreshnessStrip(freshness) {
    const lines = asArray(freshness?.quiet_lines);
    if (!lines.length) return "";
    return `<section class="body-card body-freshness" aria-label="Source freshness"><p class="body-muted body-num">${escapeHtml(lines.join(" · "))}</p></section>`;
  }

  function renderArchiveHero(archive) {
    const coverage = archive?.coverage;
    return html([
      '<section class="body-card body-archive-hero" aria-labelledby="body-archive-title">',
      '<div class="body-hero-icon" aria-hidden="true">♡</div>',
      '<div>',
      '<h2 id="body-archive-title" class="body-section-title">body archive</h2>',
      '<p class="body-hero-kicker">what your journal holds about your body over time.</p>',
      coverage ? html([
        '<p class="body-hero-coverage body-num">',
        `${escapeHtml(coverage.range_label)} &middot; ${escapeHtml(archive.months_observed)} months held`,
        '</p>',
        '<p class="body-hero-stats">',
        `<span class="body-num">${escapeHtml(archive.entry_total_label)}</span> entries kept`,
        ` &middot; <span class="body-num">${escapeHtml(archive.import_count)}</span> health `,
        Number(archive.import_count) === 1 ? "import" : "imports",
        '</p>',
      ]) : '<p class="body-subtitle">no body data yet. body imports will appear here.</p>',
      '</div>',
      '</section>',
    ]);
  }

  function renderQuickActions(archive) {
    if (!archive?.latest_day) return "";
    const latestDay = safeDay(archive.latest_day);
    return html([
      '<div class="body-quick-row">',
      `<a class="body-btn body-btn--solid" href="${bodyDayHref(latestDay)}">open latest day</a>`,
      '<a class="body-btn body-btn--outline" href="/app/body/trends">trends</a>',
      '</div>',
    ]);
  }

  function renderRecentDaysSection(archive) {
    const days = asArray(archive?.recent_days);
    if (!days.length) return "";
    return html([
      '<section class="body-section" aria-labelledby="body-recent-title">',
      '<div class="body-section-head">',
      '<h2 id="body-recent-title" class="body-section-title">recent body days</h2>',
      '<div class="body-recent-controls" id="body-recent-controls" hidden>',
      '<button type="button" class="body-recent-nav" id="body-recent-back" aria-label="Newer days">&lsaquo;</button>',
      '<button type="button" class="body-recent-nav" id="body-recent-fwd" aria-label="Earlier days">&rsaquo;</button>',
      '</div></div>',
      `<div class="body-recent-carousel" id="body-recent-carousel" data-has-more="${archive.recent_days_has_more ? "true" : "false"}">`,
      days.map(renderDayCard).join(""),
      '</div>',
      '</section>',
    ]);
  }

  function initRecentCarousel() {
    const carousel = document.getElementById("body-recent-carousel");
    const controls = document.getElementById("body-recent-controls");
    if (!carousel || !controls) return;
    const backBtn = document.getElementById("body-recent-back");
    const fwdBtn = document.getElementById("body-recent-fwd");
    let hasMore = carousel.dataset.hasMore === "true";
    let fetching = false;

    function cardStep() {
      const card = carousel.querySelector(".body-card");
      if (!card) return 0;
      const gap = parseFloat(getComputedStyle(carousel).columnGap) || 0;
      return card.getBoundingClientRect().width + gap;
    }

    function syncControls() {
      if (carousel.scrollWidth <= carousel.clientWidth + 1 && !hasMore) {
        controls.hidden = true;
        return;
      }
      controls.hidden = false;
      const maxScroll = carousel.scrollWidth - carousel.clientWidth;
      backBtn.disabled = carousel.scrollLeft <= 1;
      fwdBtn.disabled = !hasMore && carousel.scrollLeft >= maxScroll - 1;
    }

    function oldestDay() {
      const cards = carousel.querySelectorAll(".body-day-card[data-day]");
      return cards.length ? cards[cards.length - 1].dataset.day : "";
    }

    function appendBatchDays(days) {
      const present = {};
      carousel.querySelectorAll(".body-day-card[data-day]").forEach((card) => {
        present[card.dataset.day] = true;
      });
      asArray(days).forEach((item) => {
        const day = safeDay(item?.day);
        if (!day || present[day]) return;
        present[day] = true;
        carousel.insertAdjacentHTML("beforeend", renderDayCard(item));
      });
    }

    function maybeFetchEarlier() {
      if (!hasMore || fetching) return;
      const remaining = carousel.scrollWidth - carousel.clientWidth - carousel.scrollLeft;
      if (remaining > 2 * cardStep()) return;
      const cursor = oldestDay();
      if (!cursor) return;
      fetching = true;
      const placeholder = document.createElement("article");
      placeholder.className = "body-card body-recent-loading";
      placeholder.textContent = "Loading earlier days…";
      carousel.appendChild(placeholder);
      window.apiJson(`/app/body/api/recent?before=${encodeURIComponent(cursor)}`)
        .then((batch) => {
          hasMore = !!batch.has_more;
          placeholder.remove();
          appendBatchDays(batch.days);
          fetching = false;
          syncControls();
          maybeFetchEarlier();
        })
        .catch(() => {
          placeholder.remove();
          fetching = false;
          syncControls();
        });
    }

    backBtn.addEventListener("click", () => {
      carousel.scrollBy({ left: -cardStep(), behavior: "smooth" });
    });
    fwdBtn.addEventListener("click", () => {
      carousel.scrollBy({ left: cardStep(), behavior: "smooth" });
      maybeFetchEarlier();
    });
    carousel.addEventListener("scroll", () => {
      syncControls();
      maybeFetchEarlier();
    }, { passive: true });
    window.addEventListener("resize", syncControls);
    syncControls();
  }

  function renderDayGrid(dayGrid) {
    const blocks = asArray(dayGrid);
    if (!blocks.length) return "";
    return html([
      '<section class="body-card body-section" aria-labelledby="body-history-title">',
      '<h2 id="body-history-title" class="body-section-title">explore all history</h2>',
      '<div class="body-days" role="group" aria-label="Entries per day across the archive">',
      blocks.map((block) => html([
        '<div class="body-days-year">',
        `<span class="body-days-year-label body-num" aria-hidden="true">${escapeHtml(block.year)}</span>`,
        '<div>',
        '<div class="body-days-months" aria-hidden="true">',
        asArray(block.month_labels).map((month) => `<span style="grid-column-start: ${safeNumber(Number(month.index) + 1, 1)};">${escapeHtml(month.label)}</span>`).join(""),
        '</div>',
        '<div class="body-days-grid">',
        asArray(block.weeks).map((week) => asArray(week).map((cell) => {
          if (cell === null) {
            return '<span class="body-day-cell body-day-cell--pad" aria-hidden="true"></span>';
          }
          const title = String(cell.title ?? "");
          if (cell.count) {
            return `<a class="body-day-cell" href="${bodyDayHref(cell.day)}" style="--heat: ${safeNumber(cell.intensity)}" title="${escapeHtml(title)}" aria-label="${escapeHtml(title)}"></a>`;
          }
          return `<span class="body-day-cell body-day-cell--empty" title="${escapeHtml(title)}" aria-hidden="true"></span>`;
        }).join("")).join(""),
        '</div>',
        '</div>',
        '</div>',
      ])).join(""),
      '</div>',
      '<div class="body-days-legend" aria-hidden="true"><span>less</span><span class="body-day-cell body-day-cell--empty"></span><span class="body-day-cell" style="--heat: 0.33"></span><span class="body-day-cell" style="--heat: 0.66"></span><span class="body-day-cell" style="--heat: 1"></span><span>more body data</span></div>',
      '</section>',
    ]);
  }

  function renderCoverageAreas(archive) {
    const families = asArray(archive?.families);
    if (!families.length) return "";
    return html([
      '<section class="body-card" aria-labelledby="body-families-title">',
      '<h2 id="body-families-title" class="body-section-title">coverage areas</h2>',
      '<div class="body-chips">',
      families.map((family) => `<span class="body-chip" title="${escapeHtml(family.types_label)}"><span>${escapeHtml(family.name)}</span><span class="body-chip-range body-num">${escapeHtml(family.range_label)}</span></span>`).join(""),
      '</div></section>',
    ]);
  }

  function renderSourcesRepresented(status, archive) {
    const sources = asArray(archive?.sources);
    if (!sources.length) return "";
    return html([
      '<section class="body-card" aria-labelledby="body-sources-rep-title">',
      `<h2 id="body-sources-rep-title" class="body-section-title">sources represented${status.sources_month_label ? ` &middot; ${escapeHtml(status.sources_month_label)}` : ""}</h2>`,
      '<div class="body-chips">',
      sources.map((source) => `<span class="body-chip"><span>${escapeHtml(source.name)}</span>${source.stale ? `<span class="body-chip-range">last seen ${escapeHtml(source.last_seen_label)}</span>` : ""}</span>`).join(""),
      '</div></section>',
    ]);
  }

  function renderFreshnessSources(freshness) {
    const sources = asArray(freshness?.sources);
    if (!sources.length) return "";
    return html([
      '<section class="body-card" aria-labelledby="body-sources-fresh-title">',
      '<h2 id="body-sources-fresh-title" class="body-section-title">sources</h2>',
      '<ul class="body-list">',
      sources.map((source) => `<li><span>${escapeHtml(source.name)}</span><strong class="body-num">${escapeHtml(source.detail)}</strong></li>`).join(""),
      '</ul>',
      '<p class="body-card-footer">Expected sources &middot; last delivered day.</p>',
      '</section>',
    ]);
  }

  function renderCountList(entries, emptyText, codeName = false) {
    const rows = Array.isArray(entries) ? entries : Object.entries(asObject(entries));
    if (!rows.length) return `<li class="body-muted">${escapeHtml(emptyText)}</li>`;
    return rows.map(([name, count]) => `<li><span${codeName ? ' class="body-code"' : ""}>${escapeHtml(name)}</span><strong class="body-num">${escapeHtml(count)}</strong></li>`).join("");
  }

  function formatSourceTime(value) {
    const text = String(value ?? "").trim();
    if (!text) return "";
    const months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
    const match = text.match(/^\d{4}-(\d{2})-(\d{2})[T\s](\d{2}):(\d{2})/);
    if (!match) return text;
    const month = months[Number(match[1]) - 1] || match[1];
    const day = String(Number(match[2]));
    const hour24 = Number(match[3]);
    const minute = match[4];
    const suffix = hour24 >= 12 ? "pm" : "am";
    const hour = String(hour24 % 12 || 12);
    return `${month} ${day}, ${hour}:${minute} ${suffix}`;
  }

  function sourceTimeSortKey(value) {
    const text = String(value ?? "").trim();
    const match = text.match(/^(\d{4})-(\d{2})-(\d{2})[T\s](\d{2}):(\d{2})(?::(\d{2})(?:\.(\d{1,3})\d*)?)?(Z|[+-]\d{2}:\d{2})?$/);
    if (!match) return Number.NEGATIVE_INFINITY;

    const year = Number(match[1]);
    const month = Number(match[2]);
    const day = Number(match[3]);
    const hour = Number(match[4]);
    const minute = Number(match[5]);
    const second = Number(match[6] || 0);
    const millisecond = Number((match[7] || "").padEnd(3, "0"));
    if (!(month >= 1 && month <= 12 && day >= 1 && day <= 31 && hour <= 23 && minute <= 59 && second <= 59)) {
      return Number.NEGATIVE_INFINITY;
    }

    const leap = year % 4 === 0 && (year % 100 !== 0 || year % 400 === 0);
    const monthDays = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
    const y = year - 1;
    const daysBeforeYear = (y * 365) + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400);
    const daysBeforeMonth = monthDays[month - 1] + (leap && month > 2 ? 1 : 0);
    const offsetText = match[8] || "+00:00";
    const offsetMinutes = offsetText === "Z" ? 0 : (() => {
      const sign = offsetText[0] === "-" ? -1 : 1;
      return sign * ((Number(offsetText.slice(1, 3)) * 60) + Number(offsetText.slice(4, 6)));
    })();
    return (((((daysBeforeYear + daysBeforeMonth + day - 1) * 24) + hour) * 60 + minute - offsetMinutes) * 60 + second) * 1000 + millisecond;
  }

  function auditDrawerLine(status) {
    const imports = asArray(status.imports);
    const dedupe = asObject(status.dedupe);
    const total = Number(dedupe.total || 0);
    const latest = Object.values(asObject(status.latest_by_source))
      .map((value) => String(value ?? "").trim())
      .filter(Boolean)
      .reduce((max, value) => (sourceTimeSortKey(value) > sourceTimeSortKey(max) ? value : max), "");
    const parts = [
      `${imports.length} ${imports.length === 1 ? "import" : "imports"}`,
      `${total} ${total === 1 ? "row" : "rows"} deduped`,
    ];
    if (latest) parts.push(`latest ${formatSourceTime(latest)}`);
    return parts.join(" · ");
  }

  function dayAuditDrawerLine(audit) {
    const types = asObject(audit.types);
    const kinds = Object.keys(types).length;
    const total = Object.values(types).reduce((sum, count) => sum + Number(count || 0), 0);
    return `${kinds} ${kinds === 1 ? "kind" : "kinds"} · ${total} ${total === 1 ? "row" : "rows"}`;
  }

  function anatomyDrawerLine(contributors) {
    const items = asArray(contributors);
    let strongest = null;
    for (const item of items) {
      const value = Number(asObject(item).value);
      if (!Number.isFinite(value)) continue;
      if (!strongest || value > strongest.value) {
        strongest = { label: String(item.label ?? ""), value };
      }
    }
    return strongest ? `${items.length} ${items.length === 1 ? "contributor" : "contributors"} · strongest: ${strongest.label}` : "";
  }

  function dayAuditHasNothingToDisclose(bodyDay) {
    const audit = asObject(bodyDay.audit);
    return Object.entries(asObject(audit.types)).length === 0
      && asArray(audit.import_ids).length === 0
      && asArray(audit.oura_appendix).length === 0
      && !bodyDay.summary_markdown;
  }

  function renderDrawerKv(rows) {
    const kept = rows.filter((row) => row && row[1] !== undefined && row[1] !== null && row[1] !== "");
    if (!kept.length) return "";
    return `<dl class="drawer-kv">${kept.map(([name, value]) => `<dt>${escapeHtml(name)}</dt><dd>${escapeHtml(value)}</dd>`).join("")}</dl>`;
  }

  function importEvidenceMeta(item) {
    const entries = Number(item.entry_count || 0);
    const days = asArray(item.days_affected).length;
    const months = String(item.normalized_months_label || "—");
    const source = String(item.source_type || "—");
    const imported = String(item.imported_at || "—");
    return `${escapeHtml(source)} · ${escapeHtml(imported)} · ${entries} ${entries === 1 ? "entry" : "entries"} · ${days} ${days === 1 ? "day" : "days"} · ${escapeHtml(months)}`;
  }

  function renderImportEvidence(imports) {
    return `<ul class="drawer-evidence">${imports.map((item) => {
      const importId = String(item.import_id ?? "");
      const dayLinks = asArray(item.days_affected).length
        ? asArray(item.days_affected).map((day) => `<a class="body-link" href="${bodyDayHref(day)}">${escapeHtml(day)}</a>`).join(", ")
        : '<span class="body-muted">&mdash;</span>';
      return `<li class="drawer-evidence-row"><a class="drawer-evidence-title body-code" href="/app/import/${escapeHtml(importId)}">${escapeHtml(importId)}</a><span class="ev-meta">${importEvidenceMeta(item)}</span><span class="ev-meta">${dayLinks}</span></li>`;
    }).join("")}</ul>`;
  }

  function renderOverviewAudit(status) {
    const imports = asArray(status.imports);
    if (!imports.length) return '';
    const latestRows = Object.entries(asObject(status.latest_by_source)).map(([name, latest]) => [`latest ${name}`, formatSourceTime(latest) || latest]);
    const bodyHtml = html([
      renderImportEvidence(imports),
      renderDrawerKv([
        ["imports", imports.length],
        ["entries", status.normalized?.total ?? 0],
        ["dedupe rows", status.dedupe?.total ?? 0],
        ["coverage start", status.coverage_window?.start || "—"],
        ["coverage end", status.coverage_window?.end || "—"],
        ...latestRows,
      ]),
      '<section class="body-section body-lists" aria-label="Entry totals">',
      `<article class="body-card"><h3 class="body-card-label">By type</h3><ul class="body-list">${renderCountList(status.normalized?.by_type, "No entries.", true)}</ul></article>`,
      `<article class="body-card"><h3 class="body-card-label">By source${status.sources_month_label ? ` &middot; ${escapeHtml(status.sources_month_label)}` : ""}</h3><ul class="body-list">${renderCountList(status.normalized?.by_source, "No entries.")}</ul></article>`,
      `<article class="body-card"><h3 class="body-card-label">By month</h3><ul class="body-list">${renderCountList(status.normalized?.by_month, "No entries.")}</ul></article>`,
      '</section>',
      '<section class="body-section body-lists" aria-label="Dedupe totals">',
      `<article class="body-card"><h3 class="body-card-label">Dedupe by type</h3><ul class="body-list">${renderCountList(status.dedupe?.by_type, "No entries.", true)}</ul></article>`,
      `<article class="body-card"><h3 class="body-card-label">Dedupe by source</h3><ul class="body-list">${renderCountList(status.dedupe?.by_source, "No entries.")}</ul></article>`,
      `<article class="body-card"><h3 class="body-card-label">Dedupe by month</h3><ul class="body-list">${renderCountList(status.dedupe?.by_month, "No entries.")}</ul></article>`,
      '</section>',
    ]);
    return window.Drawer.render({
      id: "body-overview-audit",
      label: "audit",
      line: auditDrawerLine(status),
      bodyHtml,
    });
  }

  function renderOverview(status) {
    const archive = asObject(status.archive);
    return html([
      renderHeader("body", "your health, brought into your journal.", false),
      renderFreshnessStrip(status.freshness),
      renderArchiveHero(archive),
      renderQuickActions(archive),
      renderRecentDaysSection(archive),
      renderDayGrid(archive.day_grid),
      '<div class="body-lists body-section">',
      renderCoverageAreas(archive),
      renderSourcesRepresented(status, archive),
      renderFreshnessSources(status.freshness),
      '</div>',
      renderOverviewAudit(status),
    ]);
  }

  async function loadBodyStatus() {
    setLoading("loading body archive...");
    try {
      const status = await window.apiJson("/app/body/api/status");
      reveal(renderOverview(status));
      initRecentCarousel();
    } catch (err) {
      showError("Couldn't load body archive", err, initBodyOverview);
    }
  }

  function initBodyOverview() {
    const { segment } = window.solPathContext();
    if (segment !== null) return;
    loadBodyStatus();
  }

  function typicalSpan(label, extraClass = "") {
    return label ? ` <span class="body-fact-typical${extraClass ? ` ${extraClass}` : ""}">&middot; ${escapeHtml(label)}</span>` : "";
  }

  function renderScoreAnatomy(panelId, contributors) {
    const items = asArray(contributors);
    if (!items.length) return "";
    const id = safeClass(panelId);
    const bodyHtml = html([
      '<dl class="drawer-kv">',
      items.map((item) => `<dt>${escapeHtml(item.label)}</dt><dd class="body-num">${escapeHtml(item.value)}</dd>`).join(""),
      '</dl><p class="drawer-provenance">Oura\'s contributors</p>',
    ]);
    return window.Drawer.render({
      id,
      label: "why this score?",
      line: anatomyDrawerLine(items),
      bodyHtml,
    });
  }

  function renderEmptyDay(bodyDay) {
    const nearest = asObject(bodyDay.nearest);
    return html([
      '<section class="body-card" aria-label="Empty day">',
      '<p class="body-empty">no body data for this day.</p>',

  function startTrendsController() {
    const statusCard = document.getElementById("body-trends-status");
    const statusLine = document.getElementById("body-trends-status-line");
    const stack = document.getElementById("body-trends-stack");
    if (!statusCard || !statusLine || !stack) return;

    const SVG_W = 1440;
    const CANVAS_H = 260;
    const SPARK_H = 44;
    const MS_DAY = 86400000;
    const MS_WEEK = 7 * MS_DAY;
    const WEEK_EPOCH = Date.UTC(2001, 0, 1);
    const POLL_MS = 5000;
    const RANGE_WEEKS = { "1y": 52, "3y": 156 };

    let signals = [];
    let annotations = [];
    let weekly = {};
    let domain = { w0: 0, w1: 1 };
    const state = { open: null, range: "all", flags: true };

    function dayToUtc(day) {
      return Date.UTC(parseInt(day.slice(0, 4), 10), parseInt(day.slice(4, 6), 10) - 1, parseInt(day.slice(6, 8), 10));
    }

    function weekOf(day) {
      return Math.floor((dayToUtc(day) - WEEK_EPOCH) / MS_WEEK);
    }

    function weekDate(week) {
      return new Date(WEEK_EPOCH + week * MS_WEEK);
    }

    function monthYearLabel(week) {
      return weekDate(week).toLocaleDateString("en-US", { month: "short", year: "numeric", timeZone: "UTC" });
    }

    function dayLabel(day) {
      return new Date(dayToUtc(day)).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
    }

    function median(values) {
      const sorted = values.slice().sort((a, b) => a - b);
      const mid = Math.floor(sorted.length / 2);
      return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
    }

    function weeklyMedians(daily) {
      const byWeek = {};
      daily.forEach((point) => {
        const week = weekOf(point[0]);
        (byWeek[week] = byWeek[week] || []).push(point[1]);
      });
      return Object.keys(byWeek).map((week) => parseInt(week, 10)).sort((a, b) => a - b).map((week) => ({ week, value: median(byWeek[week]) }));
    }

    function gapSegments(points) {
      const segments = [];
      let current = [];
      points.forEach((point) => {
        if (current.length && point.week - current[current.length - 1].week > 1) {
          segments.push(current);
          current = [];
        }
        current.push(point);
      });
      if (current.length) segments.push(current);
      return segments;
    }

    function fineScale(signal) {
      return signal.key === "temp_deviation";
    }

    function paddedDomain(points, fine) {
      let vMin = Infinity;
      let vMax = -Infinity;
      points.forEach((point) => {
        if (point.value < vMin) vMin = point.value;
        if (point.value > vMax) vMax = point.value;
      });
      let pad = Math.max((vMax - vMin) * 0.08, 2.0);
      let lo = Math.floor(vMin - pad);
      let hi = Math.ceil(vMax + pad);
      if (fine) {
        pad = Math.max((vMax - vMin) * 0.08, 0.1);
        lo = Math.floor((vMin - pad) * 10) / 10;
        hi = Math.ceil((vMax + pad) * 10) / 10;
      }
      if (vMin >= 0 && lo < 0) lo = 0;
      return { lo, hi };
    }

    function formatHours(minutes) {
      const hours = Math.round((minutes / 60) * 10) / 10;
      return `${hours.toFixed(1).replace(/\.0$/, "")}h`;
    }

    function formatMinutes(minutes) {
      const total = Math.max(Math.round(minutes), 0);
      const hours = Math.floor(total / 60);
      const mins = total % 60;
      if (hours) return `${hours}h ${String(mins).padStart(2, "0")}m`;
      return `${mins}m`;
    }

    function formatValue(signal, value) {
      if (signal.key === "stress_high_minutes") return formatMinutes(value);
      if (signal.unit_label === "h") return formatHours(value);
      if (signal.key === "steps") return `${Math.round(value).toLocaleString("en-US")}${signal.unit_label ? ` ${signal.unit_label}` : ""}`;
      if (signal.key === "body_mass") return `${Math.round(value * 10) / 10}${signal.unit_label ? ` ${signal.unit_label}` : ""}`;
      if (signal.key === "temp_deviation") {
        let deg = value.toFixed(2);
        if (deg.charAt(0) !== "-") deg = `+${deg}`;
        return `${deg} ${signal.unit_label || "°C"}`;
      }
      return `${Math.round(value)}${signal.unit_label ? ` ${signal.unit_label}` : ""}`;
    }

    function xAt(week, w0, w1) {
      return ((week - w0) / Math.max(1, w1 - w0) * SVG_W).toFixed(1);
    }

    function yAt(value, dom, height) {
      return (height - (value - dom.lo) / (dom.hi - dom.lo) * height).toFixed(1);
    }

    function curveMarkup(points, w0, w1, dom, height, lineClass, dotClass, dotR) {
      const parts = [];
      gapSegments(points).forEach((segment) => {
        if (segment.length === 1) {
          parts.push(`<circle class="${escapeHtml(dotClass)}" cx="${xAt(segment[0].week, w0, w1)}" cy="${yAt(segment[0].value, dom, height)}" r="${safeNumber(dotR)}"></circle>`);
          return;
        }
        const path = segment.map((point, index) => `${index ? "L" : "M"}${xAt(point.week, w0, w1)} ${yAt(point.value, dom, height)}`).join(" ");
        parts.push(`<path class="${escapeHtml(lineClass)}" d="${escapeHtml(path)}" vector-effect="non-scaling-stroke"></path>`);
      });
      return parts.join("");
    }

    function tickMarkup(w0, w1) {
      return annotations.map((note) => {
        const week = weekOf(note.day);
        if (week < w0 || week > w1) return "";
        const x = xAt(week, w0, w1);
        return `<line class="body-trends-tick" x1="${x}" y1="0" x2="${x}" y2="${SPARK_H}" vector-effect="non-scaling-stroke"></line>`;
      }).join("");
    }

    function ribbonMarkup(signal) {
      const points = weekly[signal.key];
      const canvasId = `body-trends-canvas-${safeClass(signal.key)}`;
      const hasData = points.length > 0;
      const latest = hasData ? `${formatValue(signal, signal.daily[signal.daily.length - 1][1])} · latest` : "not present yet";
      const spark = hasData ? tickMarkup(domain.w0, domain.w1) + curveMarkup(points, domain.w0, domain.w1, paddedDomain(points, fineScale(signal)), SPARK_H, "body-trends-spark-line", "body-trends-spark-dot", 3) : "";
      return html([
        `<section class="body-trends-ribbon" data-signal="${escapeHtml(signal.key)}">`,
        `<button type="button" class="body-trends-ribbon-btn" data-signal="${escapeHtml(signal.key)}" aria-expanded="false" aria-controls="${escapeHtml(canvasId)}"${hasData ? "" : " disabled"}>`,
        '<span class="body-trends-ribbon-meta">',
        `<span class="body-trends-ribbon-name">${escapeHtml(signal.label)}</span>`,
        `<span class="body-trends-ribbon-latest body-num">${escapeHtml(latest)}</span>`,
        '</span>',
        `<span class="body-trends-spark"><svg viewBox="0 0 ${SVG_W} ${SPARK_H}" preserveAspectRatio="none" aria-hidden="true">${spark}</svg></span>`,
        '</button>',
        `<div class="body-trends-canvas" id="${escapeHtml(canvasId)}" hidden></div>`,
        '</section>',
      ]);
    }

    function windowBounds() {
      if (state.range === "all") return { w0: domain.w0, w1: domain.w1 };
      const span = RANGE_WEEKS[state.range];
      return { w0: Math.max(domain.w0, domain.w1 - span), w1: domain.w1 };
    }

    function axisMarkup(w0, w1) {
      const spans = [`<span class="body-trends-axis-edge" style="left: 0;">${escapeHtml(monthYearLabel(w0))}</span>`];
      let lastYear = weekDate(w0).getUTCFullYear();
      for (let week = w0 + 1; week <= w1; week += 1) {
        const year = weekDate(week).getUTCFullYear();
        if (year !== lastYear) {
          lastYear = year;
          const pct = (week - w0) / Math.max(1, w1 - w0) * 100;
          if (pct > 7 && pct < 96) spans.push(`<span style="left: ${pct.toFixed(2)}%;">${escapeHtml(year)}</span>`);
        }
      }
      return spans.join("");
    }

    function flagMarkup(w0, w1) {
      let markup = "";
      let level = 0;
      annotations.forEach((note) => {
        const week = weekOf(note.day);
        if (week < w0 || week > w1) return;
        const pct = (week - w0) / Math.max(1, w1 - w0) * 100;
        markup += `<div class="body-trends-flag-line" style="left: ${pct.toFixed(2)}%;"></div>`;
        let style = `left: ${pct.toFixed(2)}%; top: ${8 + level * 26}px;`;
        if (pct < 9) style += " transform: none;";
        if (pct > 91) style += " transform: translateX(-100%);";
        markup += `<div class="body-trends-flag" style="${escapeHtml(style)}">${escapeHtml(note.label)}</div>`;
        level = (level + 1) % 3;
      });
      return markup;
    }

    function chipsMarkup(signal) {
      return html([
        `<div class="body-trends-chips" role="group" aria-label="${escapeHtml(signal.label)} range and annotations">`,
        ["1y", "3y", "all"].map((range) => {
          const on = state.range === range;
          return `<button type="button" class="body-trends-chip${on ? " body-trends-chip--on" : ""}" data-range="${escapeHtml(range)}" aria-pressed="${on ? "true" : "false"}">${range === "all" ? "All" : escapeHtml(range)}</button>`;
        }).join(""),
        '<span class="body-trends-chip-gap"></span>',
        `<button type="button" class="body-trends-chip${state.flags ? " body-trends-chip--on" : ""}" data-flags-toggle aria-pressed="${state.flags ? "true" : "false"}">Annotations · ${state.flags ? "on" : "off"}</button>`,
        '<button type="button" class="body-trends-chip" data-collapse>Close</button>',
        '</div>',
      ]);
    }

    function renderCanvas(signal) {
      const canvas = document.getElementById(`body-trends-canvas-${safeClass(signal.key)}`);
      if (!canvas) return;
      const bounds = windowBounds();
      const inWindow = weekly[signal.key].filter((point) => point.week >= bounds.w0 && point.week <= bounds.w1);
      if (!inWindow.length) {
        canvas.innerHTML = `${chipsMarkup(signal)}<p class="body-muted">Not present in this range.</p>`;
        return;
      }
      let vMin = Infinity;
      let vMax = -Infinity;
      inWindow.forEach((point) => {
        if (point.value < vMin) vMin = point.value;
        if (point.value > vMax) vMax = point.value;
      });
      const dom = paddedDomain(inWindow, fineScale(signal));
      const line = `${signal.label} · ${formatValue(signal, vMin)} – ${formatValue(signal, vMax)} · ${inWindow.length} weeks present · weekly median`;
      canvas.innerHTML = html([
        chipsMarkup(signal),
        `<p class="body-primary-line body-num">${escapeHtml(line)}</p>`,
        '<div class="body-curve-wrap">',
        `<div class="body-curve-y body-num" aria-hidden="true"><span>${escapeHtml(formatValue(signal, dom.hi))}</span><span>${escapeHtml(formatValue(signal, dom.lo))}</span></div>`,
        '<div class="body-trends-plot">',
        `<svg class="body-curve" viewBox="0 0 ${SVG_W} ${CANVAS_H}" preserveAspectRatio="none" role="img" aria-label="${escapeHtml(signal.label)} weekly medians across the archive">`,
        curveMarkup(inWindow, bounds.w0, bounds.w1, dom, CANVAS_H, "", "", 4),
        '</svg>',
        state.flags ? flagMarkup(bounds.w0, bounds.w1) : "",
        '</div></div>',
        `<div class="body-trends-axis body-num" aria-hidden="true">${axisMarkup(bounds.w0, bounds.w1)}</div>`,
      ]);
    }

    function findSignal(key) {
      for (let i = 0; i < signals.length; i += 1) {
        if (signals[i].key === key) return signals[i];
      }
      return null;
    }

    function setExpanded(key, expanded) {
      const section = stack.querySelector(`.body-trends-ribbon[data-signal="${CSS.escape(key)}"]`);
      if (!section) return;
      section.classList.toggle("body-trends-ribbon--open", expanded);
      const btn = section.querySelector(".body-trends-ribbon-btn");
      btn.setAttribute("aria-expanded", expanded ? "true" : "false");
      section.querySelector(".body-trends-canvas").hidden = !expanded;
    }

    function collapseOpen(refocus) {
      if (!state.open) return;
      const key = state.open;
      state.open = null;
      setExpanded(key, false);
      if (refocus) {
        const btn = stack.querySelector(`.body-trends-ribbon[data-signal="${CSS.escape(key)}"] .body-trends-ribbon-btn`);
        if (btn) btn.focus();
      }
    }

    function expandSignal(key) {
      collapseOpen(false);
      state.open = key;
      state.range = "all";
      state.flags = true;
      setExpanded(key, true);
      renderOpenCanvas();
    }

    function toggleSignal(key) {
      if (state.open === key) collapseOpen(false);
      else expandSignal(key);
    }

    function renderOpenCanvas() {
      if (!state.open) return;
      const signal = findSignal(state.open);
      if (signal) renderCanvas(signal);
    }

    stack.addEventListener("click", (event) => {
      if (event.target.closest("[data-collapse]")) {
        collapseOpen(true);
        return;
      }
      if (event.target.closest("[data-flags-toggle]")) {
        state.flags = !state.flags;
        renderOpenCanvas();
        return;
      }
      const chip = event.target.closest(".body-trends-chip[data-range]");
      if (chip) {
        state.range = chip.dataset.range;
        renderOpenCanvas();
        return;
      }
      const btn = event.target.closest(".body-trends-ribbon-btn");
      if (btn && !btn.disabled) toggleSignal(btn.dataset.signal);
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") collapseOpen(true);
      if (event.key !== "Enter" && event.key !== " ") return;
      const btn = event.target.closest(".body-trends-ribbon-btn");
      if (!btn || btn.disabled || !stack.contains(btn)) return;
      event.preventDefault();
      toggleSignal(btn.dataset.signal);
    });

    function showStatus(text) {
      statusCard.hidden = false;
      statusCard.innerHTML = `<p class="body-muted" id="body-trends-status-line">${escapeHtml(text)}</p>`;
    }

    function showTrendsError(err) {
      statusCard.hidden = false;
      stack.hidden = true;
      statusCard.innerHTML = window.SurfaceState.error({
        heading: "Couldn't load body trends",
        desc: window.CONVEY_COPY.RELOAD_HINT,
        serverMessage: err?.serverMessage,
        detail: err,
        retry: true,
      });
      statusCard.querySelector(".surface-state-retry")?.addEventListener("click", renderTrendsShell, { once: true });
    }

    function renderTrends(payload) {
      signals = asArray(payload.signals);
      annotations = asArray(payload.annotations);
      weekly = {};
      let wMin = Infinity;
      let wMax = -Infinity;
      signals.forEach((signal) => {
        signal.daily = asArray(signal.daily).slice().sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
        const points = weeklyMedians(signal.daily);
        weekly[signal.key] = points;
        if (points.length) {
          if (points[0].week < wMin) wMin = points[0].week;
          if (points[points.length - 1].week > wMax) wMax = points[points.length - 1].week;
        }
      });
      if (wMin > wMax) {
        statusCard.innerHTML = window.SurfaceState.empty({ heading: "No trend data present yet." });
        statusCard.hidden = false;
        stack.hidden = true;
        return;
      }
      annotations.forEach((note) => {
        const week = weekOf(note.day);
        if (week < wMin) wMin = week;
        if (week > wMax) wMax = week;
      });
      domain = { w0: wMin, w1: wMax };
      const foot = payload.generated_at_day ? `<p class="body-trends-foot">Weekly medians of daily points · through ${escapeHtml(dayLabel(payload.generated_at_day))}</p>` : "";
      stack.innerHTML = signals.map(ribbonMarkup).join("") + foot;
      statusCard.hidden = true;
      stack.hidden = false;
      if (weekly.resting_hr && weekly.resting_hr.length) expandSignal("resting_hr");
    }

    function loadTrends() {
      window.apiJson("/app/body/api/trends")
        .then((payload) => {
          if (payload.warming) {
            showStatus("Preparing trends — the first build over five years takes a minute.");
            window.setTimeout(loadTrends, POLL_MS);
            return;
          }
          renderTrends(payload);
        })
        .catch(showTrendsError);
    }

    loadTrends();
  }

  function initBodyTrends() {
    const { segment } = window.solPathContext();
    if (segment !== "trends") return;
    renderTrendsShell();
  }

  initBodyOverview();
  initBodyTrends();
  initBodyDay();
})();
</script>
