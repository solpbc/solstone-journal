<link rel="stylesheet" href="/static/date-nav.css">
<script src="/static/date-nav.js"></script>
<style>
.body-header {
  margin-bottom: var(--space-5);
}

.body-shell {
  max-width: 1180px;
  background: var(--panel);
}

/* No import yet: the day picker has nothing to navigate to, so it stays
   out of the way until renderOverview finds coverage to show. */
.body-shell[data-body-empty] [data-date-nav] {
  display: none;
}

.body-title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: var(--weight-display);
  font-size: clamp(1.8rem, 3vw, 2.35rem);
  line-height: 1.2;
  color: var(--ink);
}

.body-subtitle {
  margin: var(--space-2) 0 0;
  font-size: var(--text-body);
  line-height: 1.45;
  color: var(--ink-soft);
}

.body-nav {
  margin-top: var(--space-3);
}

.body-link {
  /* X-09: the visible text runs ~19px tall inline in a sentence; grow the
     tap target to 44px with padding offset by an equal negative margin so
     the inline text flow doesn't shift. */
  display: inline-block;
  padding: 13px 4px;
  margin: -13px -4px;
  color: var(--orange-text-aa);
  font-weight: var(--weight-medium);
}

.body-link:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

.body-num {
  font-variant-numeric: tabular-nums;
}

.body-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: var(--space-3);
}

.body-archive-hero {
  display: grid;
  grid-template-columns: auto minmax(220px, 1fr);
  gap: var(--space-5);
  align-items: center;
  margin-bottom: var(--space-4);
  background:
    linear-gradient(135deg, var(--paper) 0%, var(--cream-bright) 100%);
}

.body-hero-icon {
  display: grid;
  place-items: center;
  width: 88px;
  height: 88px;
  border-radius: 50%;
  background: var(--orange-wash);
  color: var(--orange-ink);
  font-size: 2rem;
}

.body-hero-kicker {
  margin: 0;
  color: var(--ink-soft);
  font-size: 14px;
}

.body-lists {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: var(--space-3);
}

.body-main-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-3);
}

.body-card {
  background: var(--paper);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  padding: var(--space-4);
}

.body-card--soft {
  background: linear-gradient(180deg, var(--paper), var(--cream-bright));
}

.body-card--accent {
  border-color: color-mix(in srgb, var(--orange) 36%, var(--hairline));
}

.body-card + .body-card {
  margin-top: var(--space-3);
}

/* Specificity 2 and late: also zeros .body-section's 22px on matching children; none carry both today. */
.body-main-grid > .body-card,
.body-highlights > .body-card,
.body-lists > .body-card {
  margin-top: 0;
}

.body-card-label {
  margin: 0 0 var(--space-2);
  font-size: 13px;
  font-weight: var(--weight-medium);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-faint-paper);
}

.body-card-footer {
  margin: var(--space-3) 0 0;
  font-size: 13px;
  color: var(--ink-faint-paper);
}

.body-metric {
  font-size: 1.6rem;
  font-weight: var(--weight-display);
  line-height: 1.1;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.body-muted {
  color: var(--ink-faint-paper);
}

.body-code {
  font-family: var(--font-mono);
  font-size: 13px;
  overflow-wrap: anywhere;
}

.body-section {
  margin-top: var(--space-5);
}

.body-section-title {
  margin: 0 0 var(--space-3);
  font-size: 1.1rem;
  font-weight: var(--weight-medium);
  color: var(--ink);
}

.body-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
}

.body-section-head .body-section-title {
  margin-bottom: 0;
}

.body-section-action {
  font-size: 14px;
}

.body-question-title {
  margin: 0 0 var(--space-3);
  font-size: 1.1rem;
  font-weight: var(--weight-medium);
  color: var(--ink);
}

.body-primary-line {
  margin: 0 0 var(--space-2);
  font-size: 1.25rem;
  font-weight: var(--weight-medium);
  color: var(--ink);
}

.body-hero-coverage {
  margin: var(--space-2) 0 0;
  font-size: var(--text-body);
  color: var(--ink-soft);
}

.body-hero-stats {
  margin: var(--space-1) 0 0;
  font-size: 14px;
  color: var(--ink-faint);
}

.body-quick-row {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-bottom: var(--space-4);
}

.body-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: var(--touch-min);
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: var(--weight-medium);
  text-decoration: none;
  cursor: pointer;
}

.body-btn:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.body-btn--solid {
  background: var(--orange);
  border: 1px solid var(--orange);
  color: var(--ink-on-brand);
}

.body-btn--solid:hover {
  background: color-mix(in srgb, var(--orange) 80%, var(--surface-dark));
  border-color: color-mix(in srgb, var(--orange) 80%, var(--surface-dark));
}

.body-btn--outline {
  background: var(--paper);
  border: 1px solid var(--orange-ink);
  color: var(--orange-text-aa);
}

.body-btn--outline:hover {
  background: var(--orange-wash);
  color: var(--ink);
}

.body-days {
  display: grid;
  gap: var(--space-2);
  margin-top: var(--space-3);
  overflow-x: auto;
}

.body-days-year {
  display: grid;
  grid-template-columns: 38px auto;
  gap: var(--space-2);
  align-items: start;
  width: max-content;
}

.body-days-year-label {
  font-size: 12px;
  line-height: 11px;
  color: var(--ink-faint-paper);
  /* Align with the first weekday row, below the month-label row. */
  margin-top: 14px;
}

/* The month labels sit on the day grid's own column ladder: each span takes a
   week column by `grid-column-start`, so the label pitch has to equal the cell
   pitch or every label drifts left of its month (D-13). */
.body-days-months {
  display: grid;
  grid-auto-columns: var(--daygrid-cell);
  grid-template-rows: 12px;
  gap: var(--daygrid-gap);
  margin-bottom: 2px;
  font-size: 10px;
  line-height: 12px;
  color: var(--ink-faint-paper);
  font-variant-numeric: tabular-nums;
}

.body-days-months span {
  grid-row: 1;
  white-space: nowrap;
}

.body-days-legend {
  display: flex;
  align-items: center;
  gap: 3px;
  margin-top: var(--space-2);
  font-size: 12px;
  color: var(--ink-faint-paper);
}

.body-days-legend span:first-child {
  margin-right: var(--space-1);
}

.body-days-legend span:last-child {
  margin-left: var(--space-1);
}

/* One day-cell ladder for the whole app: 13px on desktop, 24px from 768 down,
   with the 3px gap at every width. These are the values in
   /static/day-grid.css; this page draws its own grid, so it carries the same
   ladder rather than a fourth size of its own (F-12). The legend swatches take
   the same size because they sit in the same row of cells, and the month-label
   row takes it because its columns are the grid's columns. */
.body-days-grid,
.body-days-months,
.body-days-legend {
  --daygrid-cell: 13px;
  --daygrid-gap: 3px;
  --daygrid-radius: 3px;
}

/* The grid and its month labels take the phone rung together, because the
   labels are the grid's own columns and a legend swatch is not. The swatches
   are read, never tapped, so they keep the base size the same way
   /static/day-grid.css keeps its own (X-09, fresh-eyes 2 #7). */
@media (max-width: 768px) {
  .body-days-grid,
  .body-days-months {
    --daygrid-cell: 24px;
  }
}

.body-days-grid {
  display: grid;
  grid-auto-flow: column;
  grid-template-rows: repeat(7, var(--daygrid-cell));
  grid-auto-columns: var(--daygrid-cell);
  gap: var(--daygrid-gap);
}

.body-day-cell {
  width: var(--daygrid-cell);
  height: var(--daygrid-cell);
  border-radius: var(--daygrid-radius);
  background: color-mix(
    in srgb,
    var(--orange) calc(var(--heat, 0) * 100%),
    var(--orange-wash)
  );
}

.body-day-cell--empty {
  background: var(--cream-bright);
  border: 1px solid var(--hairline);
}

.body-day-cell--pad {
  background: transparent;
}

a.body-day-cell:hover {
  outline: 1px solid var(--orange-ink);
}

a.body-day-cell:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}

.body-recent-carousel {
  display: flex;
  gap: var(--space-3);
  max-width: 100%;
  overflow-x: auto;
  overflow-y: hidden;
  scroll-snap-type: x mandatory;
  padding-bottom: var(--space-2);
  scrollbar-width: thin;
  scrollbar-color: var(--hairline-2) transparent;
}

.body-recent-carousel .body-card {
  flex: 0 0 300px;
  scroll-snap-align: start;
}

.body-recent-carousel .body-card + .body-card {
  margin-top: 0;
}

.body-recent-controls {
  display: flex;
  gap: var(--space-2);
}

.body-recent-controls[hidden] {
  display: none;
}

.body-recent-nav {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border: 1px solid var(--hairline-2);
  border-radius: var(--radius-sm);
  background: var(--cream-bright);
  color: var(--ink);
  font-size: 15px;
  cursor: pointer;
}

.body-recent-nav:hover:not(:disabled) {
  background: var(--orange-wash);
}

.body-recent-nav:disabled {
  opacity: 0.35;
  cursor: default;
}

.body-recent-nav:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}

.body-recent-loading {
  display: grid;
  place-items: center;
  min-height: 140px;
  color: var(--ink-faint-paper);
  font-size: 14px;
}

.body-day-card {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: var(--space-3);
  align-items: start;
}

.body-date-badge {
  display: grid;
  place-items: center;
  width: 54px;
  min-height: 68px;
  border: 1px solid var(--hairline-2);
  border-radius: var(--radius-sm);
  background: var(--cream-bright);
  text-align: center;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.body-date-badge-month {
  font-size: 11px;
  font-weight: var(--weight-medium);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--orange-text-aa);
}

.body-date-badge-day {
  font-size: 1.45rem;
  font-weight: var(--weight-display);
  line-height: 1;
}

.body-day-card-date {
  margin: 0 0 var(--space-2);
  font-size: 1rem;
  font-weight: var(--weight-medium);
  color: var(--ink);
}

.body-facts {
  list-style: none;
  margin: 0;
  padding: 0;
}

.body-facts li {
  display: flex;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-1) 0;
  font-size: 14px;
  color: var(--ink);
}

.body-facts li span:first-child {
  color: var(--ink-soft-paper);
}

.body-fact-kind {
  color: var(--ink-faint-paper);
  font-size: 13px;
}

/* Device juxtaposition lines: two devices' figures side by side, verbatim. */
.body-device-compare {
  margin: var(--space-2) 0 0;
}

/* Source-freshness strip: a slim informational band in the archive's own
   muted inks — factual copy only, never alarm colors. */
.body-freshness {
  margin-bottom: var(--space-4);
  padding: var(--space-2) var(--space-4);
}

.body-freshness p {
  margin: 0;
  font-size: 14px;
}

.body-chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.body-chip {
  display: inline-flex;
  align-items: baseline;
  gap: var(--space-2);
  padding: var(--space-1) var(--space-3);
  background: var(--cream-bright);
  border: 1px solid var(--hairline-2);
  border-radius: 999px;
  font-size: 14px;
  color: var(--ink);
}

.body-chip-range {
  font-size: 12px;
  color: var(--ink-faint-paper);
}

.body-day-brief {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: var(--space-4);
  align-items: center;
  margin-bottom: var(--space-4);
  background:
    linear-gradient(135deg, var(--paper) 0%, var(--cream-bright) 100%);
}

.body-day-brief-title {
  margin: 0 0 var(--space-2);
  font-size: 1.15rem;
  font-weight: var(--weight-medium);
  color: var(--ink);
}

.body-day-brief-copy {
  margin: 0;
  max-width: 760px;
  font-size: 1rem;
  line-height: 1.5;
  color: var(--ink-soft);
}

.body-highlights {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

.body-highlight {
  min-height: 142px;
}

.body-highlight-title {
  margin: 0 0 var(--space-2);
  font-size: 1rem;
  font-weight: var(--weight-medium);
  color: var(--ink);
}

.body-highlight-value {
  margin: 0;
  font-size: 1.45rem;
  font-weight: var(--weight-display);
  line-height: 1.1;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.body-highlight-detail {
  margin: var(--space-2) 0 0;
  font-size: 14px;
  line-height: 1.35;
  color: var(--ink-soft);
}

.body-sleep-bar {
  display: block;
  width: 100%;
  height: 34px;
  margin-top: var(--space-2);
}

.body-sleep-axis {
  fill: var(--hairline-2);
}

.body-sleep-mark {
  fill: var(--hairline-2);
}

.body-sleep-seg--main {
  fill: var(--orange);
}

.body-sleep-seg--nap {
  fill: var(--orange-wash);
  stroke: var(--hairline-2);
}

.body-sleep-hours {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--ink-faint-paper);
}

.body-curve-wrap {
  display: flex;
  gap: var(--space-2);
  align-items: stretch;
  margin-top: var(--space-2);
}

.body-curve-y {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  font-size: 12px;
  color: var(--ink-faint-paper);
  text-align: right;
}

.body-curve {
  flex: 1 1 auto;
  width: 100%;
  height: 130px;
  background: var(--cream-bright);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-sm);
}

.body-curve path {
  fill: none;
  stroke: var(--orange-ink);
  stroke-width: 2px;
}

.body-curve circle {
  fill: var(--orange-ink);
}

/* Bucket lowest–highest band under the day curve: same hue, low opacity. */
.body-curve path.body-curve-band {
  fill: var(--orange);
  fill-opacity: 0.18;
  stroke: none;
}

.body-curve-hours {
  display: flex;
  justify-content: space-between;
  margin-top: var(--space-1);
  font-size: 12px;
  color: var(--ink-faint-paper);
}

.body-workouts {
  list-style: none;
  margin: 0 0 var(--space-3);
  padding: 0;
}

.body-workouts li {
  display: flex;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-2) 0;
  border-bottom: 1px solid var(--hairline);
  font-size: 14px;
  color: var(--ink);
}

.body-workouts li:last-child {
  border-bottom: 0;
}

.body-workout-name {
  font-weight: var(--weight-medium);
}

.body-workouts li.body-workout-strava {
  flex-wrap: wrap;
}

.body-workout-details {
  flex-basis: 100%;
  color: var(--ink-soft, var(--ink));
  font-size: 13px;
}

.body-workout-more {
  flex-basis: 100%;
  font-size: 13px;
  color: var(--ink-soft, var(--ink));
}

.body-workout-more summary {
  cursor: pointer;
  padding: var(--space-3) 0;
}

.body-workout-more dl {
  display: grid;
  grid-template-columns: minmax(8rem, max-content) 1fr;
  gap: var(--space-1) var(--space-3);
  margin: 0 0 var(--space-2);
}

.body-workout-more dt {
  color: var(--ink-faint-paper);
}

.body-workout-more dd {
  margin: 0;
  overflow-wrap: anywhere;
  white-space: pre-line;
}

.body-workout-delete {
  min-height: 44px;
  min-width: 44px;
  padding: 0 var(--space-2);
  border: 1px solid var(--hairline);
  border-radius: var(--radius-sm, 6px);
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}

/* The workout's delete is stage 2's dialog: the same rules as the transcripts page's. */
.body-trash-dialog {
  width: min(520px, calc(100vw - 48px));
  max-height: calc(100vh - 48px);
  padding: 0;
  border: 0;
  border-radius: 16px;
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 24px 48px rgba(0, 0, 0, 0.22);
  overflow: hidden;
}

.body-trash-dialog[open] {
  display: flex;
  flex-direction: column;
}

.body-trash-dialog::backdrop {
  background: color-mix(in srgb, var(--surface-dark) 55%, transparent);
}

.body-trash-head {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--hairline);
}

.body-trash-head h3 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  color: var(--ink);
}

.body-trash-erase .body-trash-head h3 {
  color: var(--danger);
}

.body-trash-close {
  min-width: 44px;
  min-height: 44px;
  border: 0;
  background: transparent;
  color: var(--ink-faint);
  font-size: 28px;
  line-height: 1;
  cursor: pointer;
}

.body-trash-close:hover {
  color: var(--ink-soft);
}

.body-trash-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  padding: 20px 24px;
}

.body-trash-note {
  padding: 16px 18px;
  border-radius: 12px;
  background: var(--cream);
  border-left: 4px solid var(--hairline-2);
  color: var(--ink);
}

.body-trash-erase .body-trash-note {
  background: var(--danger-wash);
  color: var(--danger);
}

.body-trash-note p {
  margin: 0 0 12px;
}

.body-trash-note p:last-child {
  margin-bottom: 0;
}

.body-trash-meta {
  font-size: 14px;
}

.body-trash-meta strong {
  white-space: nowrap;
}

.body-trash-foot {
  flex: none;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5em;
  padding: 0 24px 24px;
}

.body-trash-right {
  margin-left: auto;
  display: flex;
  gap: 0.5em;
}

.body-trash-btn {
  border-radius: 10px;
  padding: 10px 18px;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.body-trash-secondary {
  border: 0;
  background: var(--cream-bright);
  color: var(--ink-soft);
}

.body-trash-secondary:hover {
  background: var(--hairline);
}

.body-trash-danger {
  border: 1px solid var(--danger);
  background: var(--paper);
  color: var(--danger);
}

.body-trash-danger-fill {
  border: 0;
  background: var(--danger);
  color: var(--ink-on-danger);
}

.body-trash-primary {
  border: 0;
  background: var(--orange);
  color: var(--ink-on-brand);
}

@media (max-width: 480px) {
  .body-trash-foot button {
    min-height: 44px;
    padding-left: 12px;
    padding-right: 12px;
    white-space: nowrap;
  }
}

.body-table-wrap {
  background: var(--paper);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  overflow-x: auto;
}

.body-table {
  width: 100%;
  border-collapse: collapse;
}

.body-table th,
.body-table td {
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--hairline);
  text-align: left;
  vertical-align: top;
  font-size: 14px;
  color: var(--ink);
}

.body-table th {
  font-size: 12px;
  font-weight: var(--weight-medium);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--ink-faint-paper);
  background: var(--cream-bright);
}

.body-table tr:last-child td {
  border-bottom: 0;
}

.body-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

.body-list li {
  display: flex;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-2) 0;
  border-bottom: 1px solid var(--hairline);
  font-size: 14px;
  color: var(--ink);
}

.body-list li:last-child {
  border-bottom: 0;
}

.body-summary {
  white-space: pre-wrap;
  margin: 0;
  padding: var(--space-4);
  background: var(--paper);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.5;
  overflow-x: auto;
}

.body-empty {
  color: var(--ink-faint);
}

.body-earlier {
  margin: var(--space-3) 0 0;
  color: var(--ink-faint-paper);
}

.body-earlier + .body-earlier {
  margin-top: var(--space-1);
}

.body-import-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: var(--space-2);
}

}

}

}

@media (max-width: 768px) {
  .body-grid,
  .body-lists,
  .body-main-grid,
  .body-highlights,
  .body-archive-hero,
  .body-day-brief {
    grid-template-columns: 1fr;
  }
}
</style>


<div class="workspace-content body-shell">
  <div data-date-nav></div>
  <h1 class="body-title" data-date-nav-heading></h1>
  <div id="body-state-gate"></div>
  <div id="body-view-root" hidden></div>
</div>


<script>
(() => {
  "use strict";
  // Registers the view. Nothing here runs until the view is mounted, and a
  // day change is taken in place.

  const DAY_RE = /^\d{8}$/;
  const escapeHtml = (value) => window.AppServices.escapeHtml(value);

  function html(parts) {
    return parts.filter(Boolean).join("");
  }

  function asArray(value) {
    return Array.isArray(value) ? value : [];
  }

  function asObject(value) {
    return value && typeof value === "object" && !Array.isArray(value) ? value : {};
  }

  function safeNumber(value, fallback = 0) {
    const parsed = Number(value);
    return Number.isFinite(parsed) ? String(parsed) : String(fallback);
  }

  function safeDay(value) {
    const text = String(value ?? "");
    return DAY_RE.test(text) ? text : "";
  }

  function bodyDayHref(value) {
    const day = safeDay(value);
    return day ? `/app/body/${escapeHtml(day)}` : "/app/body/";
  }

  function renderHeader(title, subtitle, backLink, options = {}) {
    const showTitle = options.showTitle !== false;
    return html([
      '<header class="body-header">',
      showTitle ? `<h1 class="body-title">${escapeHtml(title)}</h1>` : "",
      subtitle ? `<p class="body-subtitle">${escapeHtml(subtitle)}</p>` : "",
      backLink ? '<nav class="body-nav" aria-label="body views"><a class="body-link" href="/app/body/">&larr; body overview</a></nav>' : "",
      '</header>',
    ]);
  }

  function renderDayGrid(dayGrid) {
    const blocks = asArray(dayGrid);
    if (!blocks.length) return "";
    return html([
      '<section class="body-card body-section" aria-labelledby="body-history-title">',
      '<h2 id="body-history-title" class="body-section-title">every day held</h2>',
      '<div class="body-days" role="group" aria-label="days your journal holds body data">',
      blocks.map((block) => html([
        '<div class="body-days-year">',
        `<span class="body-days-year-label body-num" aria-hidden="true">${escapeHtml(block.year)}</span>`,
        '<div>',
        '<div class="body-days-months" aria-hidden="true">',
        asArray(block.month_labels).map((month) => `<span style="grid-column-start: ${safeNumber(Number(month.index) + 1, 1)};">${escapeHtml(month.label)}</span>`).join(""),
        '</div>',
        '<div class="body-days-grid">',
        asArray(block.weeks).map((week) => asArray(week).map((cell) => {
          if (cell === null) {
            return '<span class="body-day-cell body-day-cell--pad" aria-hidden="true"></span>';
          }
          const title = String(cell.title ?? "");
          if (cell.count) {
            return `<a class="body-day-cell" href="${bodyDayHref(cell.day)}" style="--heat: ${safeNumber(cell.intensity)}" title="${escapeHtml(title)}" aria-label="${escapeHtml(title)}"></a>`;
          }
          if (cell.earlier) {
            return `<a class="body-day-cell body-day-cell--empty" href="${bodyDayHref(cell.day)}" title="${escapeHtml(title)}" aria-label="${escapeHtml(title)}"></a>`;
          }
          return `<span class="body-day-cell body-day-cell--empty" title="${escapeHtml(title)}" aria-hidden="true"></span>`;
        }).join("")).join(""),
        '</div>',
        '</div>',
        '</div>',
      ])).join(""),
      '</div>',
      '</section>',
    ]);
  }

  function renderSources(sources) {
    const list = asArray(sources);
    if (!list.length) return "";
    return html([
      '<section class="body-card body-section" aria-labelledby="body-sources-title">',
      '<h2 id="body-sources-title" class="body-section-title">sources held</h2>',
      '<ul class="body-list">',
      list.map((item) => `<li><span>${escapeHtml(item.name)}</span><strong class="body-num">${escapeHtml(item.first_label)} &ndash; ${escapeHtml(item.last_label)} &middot; ${escapeHtml(item.days_label)}</strong></li>`).join(""),
      '</ul></section>',
    ]);
  }

  function renderNewImport(item) {
    const lines = [];
    if (item.state === "finished") {
      if (item.summary) lines.push(`<pre class="body-summary body-import-summary">${escapeHtml(item.summary)}</pre>`);
    } else if (item.progress) {
      lines.push(`<p class="body-muted body-import-summary">${escapeHtml(item.progress)}</p>`);
    }
    return html([
      `<li data-state="${escapeHtml(item.state)}"><span class="body-import-line">${escapeHtml(item.source)}</span>`,
      item.when ? ` <span class="body-muted body-num">${escapeHtml(item.when)}</span>` : "",
      lines.join(""),
      '</li>',
    ]);
  }

  function renderImports(imports) {
    const fresh = asArray(imports?.new);
    const old = asArray(imports?.old);
    if (!fresh.length && !old.length) return "";
    return html([
      '<section class="body-card body-section" aria-labelledby="body-imports-title">',
      '<h2 id="body-imports-title" class="body-section-title">imports</h2>',
      fresh.length ? `<ul class="body-import-list">${fresh.map(renderNewImport).join("")}</ul>` : "",
      old.length ? html([
        '<h3 class="body-card-label">earlier imports, kept but not read here</h3>',
        `<ul class="body-import-list">${old.map((item) => `<li data-source="${escapeHtml(item.source)}">${escapeHtml(item.line)}</li>`).join("")}</ul>`,
      ]) : "",
      '</section>',
    ]);
  }

  function renderOverview(status) {
    const hasDays = Boolean(status.coverage);
    const imports = status.imports;
    if (!hasDays && !asArray(imports?.new).length && !asArray(imports?.old).length) {
      return html([
        renderHeader("body", "your body, brought into your journal.", false),
        '<p class="body-subtitle">nothing here yet. bring in your workouts from a Strava download on the <a href="/app/import/">import page</a>. if your journal runs on a computer, you can also bring in an Apple Health export on the import page or Oura data from that computer\'s command line. <a href="https://github.com/solpbc/solstone-journal/blob/main/docs/health_imports.md" target="_blank" rel="noopener noreferrer">read about body imports</a>.</p>',
      ]);
    }
    return html([
      renderHeader("body", "your body, brought into your journal.", false),
      renderSources(status.sources),
      renderDayGrid(status.day_grid),
      renderImports(imports),
    ]);
  }

  function renderEmptyDay(bodyDay, heldEarlier) {
    const nearest = asObject(bodyDay.nearest);
    return html([
      '<section class="body-card" aria-label="empty day">',
      heldEarlier ? "" : '<p class="body-empty">nothing for this day.</p>',
      (nearest.prev || nearest.next) ? html([
        '<p>nearby days with data: ',
        nearest.prev ? `<a class="body-link" href="${bodyDayHref(nearest.prev)}">&larr; ${escapeHtml(nearest.prev_label)}</a> ` : "",
        nearest.next ? `<a class="body-link" href="${bodyDayHref(nearest.next)}">${escapeHtml(nearest.next_label)} &rarr;</a>` : "",
        '</p>',
      ]) : '<p class="body-muted"><a class="body-link" href="/app/body/">body overview &rarr;</a></p>',
      '</section>',
    ]);
  }

  function renderEarlierImports(lines) {
    const list = asArray(lines);
    if (!list.length) return "";
    return list.map((item) => `<p class="body-muted body-earlier">${escapeHtml(item.line)}</p>`).join("");
  }

  function renderStravaWorkout(workout) {
    const id = escapeHtml(workout.strava_activity_id);
    const details = asArray(workout.details);
    const more = asArray(workout.more_from_strava);
    return `<li class="body-workout-strava" data-strava-row="${id}"><span class="body-workout-name">${escapeHtml(workout.name)}</span><span class="body-num">${workout.start ? escapeHtml(workout.start) : ""}${workout.duration ? ` &middot; ${escapeHtml(workout.duration)}` : ""}${workout.metrics_label ? ` &middot; ${escapeHtml(workout.metrics_label)}` : ""} &middot; Strava</span><button type="button" class="body-workout-delete" data-strava-delete="${id}" data-strava-start="${workout.start ? escapeHtml(workout.start) : ""}" aria-label="delete ${escapeHtml(workout.name)}">delete</button>${details.length ? `<span class="body-workout-details">Strava's figures: ${details.map(escapeHtml).join(" &middot; ")}</span>` : ""}${more.length ? `<details class="body-workout-more"><summary>more from Strava &middot; <span class="body-num">${escapeHtml(more.length)}</span></summary><dl>${more.map((field) => `<dt>${escapeHtml(String(field.label ?? "").toLowerCase())}</dt><dd>${escapeHtml(field.value)}</dd>`).join("")}</dl></details>` : ""}</li>`;
  }

  // Deleting a Strava workout moves every piece of it, on every day it covers, to
  // the trash as one thing. The dialog asks once, with erase now as its own step;
  // the receipt can recover it.
  const STRAVA_API = "/app/transcripts/api/strava";
  const TRASH_PAGE = "/app/settings#trash";
  const WORKOUT_COPY = {
    move: {
      title: "delete this workout?",
      reach: "it leaves your journal now and waits in the trash, then it's erased. you can recover it until then.",
      stays: "activities, summaries and entities made from it elsewhere in your journal stay where they are and may still mention it.",
    },
    erase: {
      title: "erase this workout now?",
      reach: "it leaves your journal now and can't be recovered.",
      stays: "activities, summaries and entities made from it elsewhere in your journal aren't erased and may still mention it.",
    },
    again: "importing a Strava download again brings this workout back.",
    buttons: { eraseNow: "erase now", cancel: "cancel", moveToTrash: "move to trash", back: "back", recover: "recover", openTrash: "open trash" },
    receipt: {
      moved: { title: "moved to the trash", message: "erases {date} unless you recover it." },
      recovered: { title: "workout recovered", message: "it's back in your journal." },
      erased: { title: "workout erased from your journal" },
      recoverFailed: { title: "couldn't recover that workout", message: "it's still in the trash. you can try again from there." },
      moveRefused: { title: "couldn't move that to the trash", message: "it's still in your journal." },
      eraseRefused: { title: "couldn't erase that workout", message: "it's still in your journal." },
      eraseFailed: { title: "couldn't erase that workout", message: "it's in the trash. you can try again from there." },
      noAnswerMove: { title: "your journal didn't answer", message: "it may already be in the trash. reload to check." },
      noAnswerErase: { title: "your journal didn't answer", message: "it may already be erased. reload to check." },
      noAnswerRecover: { title: "your journal didn't answer", message: "it may already be back in your journal. reload to check." },
    },
  };
  function bodyToast(options) {
    const notifications = window.AppServices && window.AppServices.notifications;
    return notifications ? notifications.show({ app: "body", ...options }) : null;
  }
  function workoutDayLabel(day) {
    return day && window.JournalFormat && window.JournalFormat.day ? window.JournalFormat.day(day).toLowerCase() : String(day || "");
  }
  function trashEraseDate(eraseAt) {
    const instant = new Date(eraseAt);
    if (!eraseAt || Number.isNaN(instant.getTime())) return "";
    const key = window.JournalClock && window.JournalClock.dayKey
      ? window.JournalClock.dayKey(instant)
      : `${instant.getFullYear()}${String(instant.getMonth() + 1).padStart(2, "0")}${String(instant.getDate()).padStart(2, "0")}`;
    return workoutDayLabel(key);
  }
  function workoutReceipt(kind, fill = {}, buttons = []) {
    const copy = WORKOUT_COPY.receipt[kind];
    const put = (value) => value.replace("{date}", fill.date || "");
    const settled = kind === "moved" || kind === "recovered" || kind === "erased";
    const notice = { icon: settled ? (kind === "recovered" ? "undo-2" : "trash-2") : "triangle-alert", title: put(copy.title), dismissible: true, buttons };
    if (copy.message && (kind !== "moved" || fill.date)) notice.message = put(copy.message);
    // A refused or failed card stays until the owner dismisses it.
    if (settled) notice.autoDismiss = 10000;
    bodyToast(notice);
  }
  function openTrashButton() {
    return { label: WORKOUT_COPY.buttons.openTrash, onClick: () => { window.location.href = TRASH_PAGE; } };
  }

  // A workout delete keeps going if the owner leaves, and its receipt does
  // not hold the page they left. The row leaves only while that day is showing.
  let hooks = null;

  function showing(day) {
    const current = window.SolViews && window.SolViews.current && window.SolViews.current();
    if (!current || current.name !== "body" || !current.ctx || current.ctx.disposed) return false;
    const routeDay = (current.ctx.route && current.ctx.route.day) || null;
    return routeDay === (day || null);
  }

  function removeWorkoutRows(id) {
    const rows = Array.from(document.querySelectorAll(`[data-strava-row="${CSS.escape(id)}"]`));
    rows.forEach((row) => {
      const list = row.parentElement;
      row.remove();
      if (list && !list.querySelector("[data-strava-row]")) list.closest(".body-card, section")?.remove();
    });
  }

  async function deleteWorkout(id, day, erase) {
    let response;
    try {
      response = await window.fetch(`${STRAVA_API}/workout/${encodeURIComponent(id)}`, {
        method: "DELETE",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(erase ? { erase: true } : {}),
      });
    } catch (_) {
      workoutReceipt(erase ? "noAnswerErase" : "noAnswerMove");
      return;
    }
    const answer = await response.json().catch(() => null);
    if (!answer) {
      workoutReceipt(erase ? "noAnswerErase" : "noAnswerMove");
      return;
    }
    if (!response.ok) {
      workoutReceipt(erase ? "eraseRefused" : "moveRefused");
      return;
    }
    if (showing(day)) removeWorkoutRows(id);
    if (answer.erased === true) { workoutReceipt("erased"); return; }
    if (answer.erase_failed === true) { workoutReceipt("eraseFailed", {}, [openTrashButton()]); return; }
    const trashId = answer.trash && answer.trash.id;
    workoutReceipt("moved", { date: trashEraseDate(answer.trash && answer.trash.erase_at) }, [
      { label: WORKOUT_COPY.buttons.recover, onClick: () => recoverWorkout(trashId, day) },
      openTrashButton(),
    ]);
  }

  async function recoverWorkout(trashId, day) {
    let answer = null;
    try {
      const response = await window.fetch("/app/settings/api/trash/recover", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ids: [trashId], page: "body" }),
      });
      answer = await response.json().catch(() => null);
      if (!response.ok) answer = { done: [] };
    } catch (_) {
      workoutReceipt("noAnswerRecover");
      return;
    }
    if (!(answer && Array.isArray(answer.done) && answer.done.includes(trashId))) {
      workoutReceipt("recoverFailed", {}, [openTrashButton()]);
      return;
    }
    if (showing(day) && hooks) hooks.reloadDay();
    workoutReceipt("recovered");
  }

  function mountBody(ctx) {
    const root = document.getElementById("body-view-root");
    const gate = document.getElementById("body-state-gate");
    let epoch = 0;
    let scope = window.SolStore.createAbort();
    let shown = ctx.route.day || null;
    let closeOpenDialog = null;

    ctx.on(document, "click", (event) => {
      const button = event.target && event.target.closest && event.target.closest("[data-strava-delete]");
      if (!button || ctx.disposed) return;
      openWorkoutDialog(button, shown);
    });
    if (!root || !gate) throw new Error("body has no root");

    function cut() {
      // The epoch moves first. A read that the abort rejects in the same
      // turn is already stale, and must not draw or show an error.
      epoch += 1;
      scope.abort();
      scope = window.SolStore.createAbort();
    }

    function focusNode(node) {
      if (!node || typeof node.focus !== "function") return;
      if (!node.hasAttribute("tabindex")) node.setAttribute("tabindex", "-1");
      try { node.focus({ preventScroll: true }); }
      catch (_) { node.focus(); }
    }

    // Leaving the overview replaces the link that had focus. Focus goes to
    // the day's own heading once it is drawn, or to the workspace until then.
    function focusArrived() {
      const heading = root.querySelector("h1, h2");
      const visible = heading && !heading.closest("[hidden]") ? heading : null;
      focusNode(visible || document.getElementById("main-content"));
    }

    function read(url) {
      const asked = epoch;
      const signal = window.SolStore.eitherSignal(ctx.signal, scope.signal);
      return ctx.read(url, { signal }).then(
        (value) => (asked === epoch && !ctx.disposed ? value : window.SolStore.never()),
        (error) => (asked === epoch && !ctx.disposed ? Promise.reject(error) : window.SolStore.never())
      );
    }

    function setLoading(text) {
      root.hidden = true;
      gate.hidden = false;
      gate.innerHTML = window.SurfaceState.loading({ text, busy: false });
    }

    function reveal(markup) {
      if (ctx.disposed) return;
      gate.hidden = true;
      gate.innerHTML = "";
      root.innerHTML = markup;
      root.hidden = false;
    }

    function showError(heading, err, retryFn) {
      if (ctx.disposed) return;
      if (window.logError) window.logError(err, { context: heading });
      root.hidden = true;
      gate.hidden = false;
      gate.innerHTML = window.SurfaceState.error({
        heading,
        desc: window.CONVEY_COPY.RELOAD_HINT,
        serverMessage: err?.serverMessage,
        detail: err,
        retry: true,
      });
      gate.querySelector(".surface-state-retry")?.addEventListener("click", retryFn, { once: true });
    }

    function closeDialog() {
      const close = closeOpenDialog;
      closeOpenDialog = null;
      if (close) close(false);
    }

    function openWorkoutDialog(button, day) {
      closeDialog();
      const id = button.getAttribute("data-strava-delete");
      const start = button.getAttribute("data-strava-start") || "";
      const meta = [workoutDayLabel(day), start, "Strava"].filter(Boolean).join(" · ");
      const dialog = document.createElement("dialog");
      dialog.className = "body-trash-dialog";
      dialog.setAttribute("aria-modal", "true");
      let step = "move";
      const paint = () => {
        const copy = WORKOUT_COPY[step];
        const erasing = step === "erase";
        dialog.classList.toggle("body-trash-erase", erasing);
        dialog.setAttribute("aria-label", copy.title);
        dialog.innerHTML = html([
          `<div class="body-trash-head"><h3>${escapeHtml(copy.title)}</h3><button type="button" class="body-trash-close" data-workout-cancel aria-label="close">&times;</button></div>`,
          `<div class="body-trash-body"><div class="body-trash-note" data-workout-step="${step}"><p class="body-trash-meta"><strong>${escapeHtml(meta)}</strong></p><p>${escapeHtml(copy.reach)}</p><p>${escapeHtml(copy.stays)}</p><p>${escapeHtml(WORKOUT_COPY.again)}</p></div></div>`,
          erasing
            ? `<div class="body-trash-foot"><span class="body-trash-right"><button type="button" class="body-trash-btn body-trash-secondary" data-workout-back>${escapeHtml(WORKOUT_COPY.buttons.back)}</button><button type="button" class="body-trash-btn body-trash-danger-fill" data-workout-erase>${escapeHtml(WORKOUT_COPY.buttons.eraseNow)}</button></span></div>`
            : `<div class="body-trash-foot"><button type="button" class="body-trash-btn body-trash-danger" data-workout-erase-step>${escapeHtml(WORKOUT_COPY.buttons.eraseNow)}</button><span class="body-trash-right"><button type="button" class="body-trash-btn body-trash-secondary" data-workout-cancel>${escapeHtml(WORKOUT_COPY.buttons.cancel)}</button><button type="button" class="body-trash-btn body-trash-primary" data-workout-move>${escapeHtml(WORKOUT_COPY.buttons.moveToTrash)}</button></span></div>`,
        ]);
        dialog.querySelector(erasing ? "[data-workout-back]" : "[data-workout-move]")?.focus();
      };
      const close = (focus) => {
        if (closeOpenDialog === close) closeOpenDialog = null;
        dialog.close();
        dialog.remove();
        if (focus !== false && button.isConnected) button.focus();
      };
      closeOpenDialog = close;
      dialog.addEventListener("click", (event) => {
        if (event.target === dialog || event.target.closest("[data-workout-cancel]")) { close(); return; }
        if (event.target.closest("[data-workout-erase-step]")) { step = "erase"; paint(); return; }
        if (event.target.closest("[data-workout-back]")) { step = "move"; paint(); return; }
        if (event.target.closest("[data-workout-move]")) { close(); deleteWorkout(id, day, false); return; }
        if (event.target.closest("[data-workout-erase]")) { close(); deleteWorkout(id, day, true); }
      });
      dialog.addEventListener("cancel", (event) => { event.preventDefault(); close(); });
      document.body.appendChild(dialog);
      paint();
      dialog.showModal();
      dialog.querySelector("[data-workout-move]")?.focus();
    }

    async function loadOverview() {
      const asked = epoch;
      setLoading("loading body data…");
      try {
        const status = await read("/app/body/api/status");
        if (asked !== epoch || ctx.disposed) return;
        const hasData = Boolean(status.coverage);
        document.querySelector(".body-shell")?.toggleAttribute("data-body-empty", !hasData);
        reveal(renderOverview(status));
        ctx.ready(hasData ? "content" : "empty");
      } catch (err) {
        if (asked !== epoch || ctx.disposed) return;
        showError("couldn't load your body data", err, () => loadOverview());
        ctx.ready("error");
      }
    }

    async function loadBodyDay(day, arrive) {
      const asked = epoch;
      setLoading("loading body day…");
      try {
        const bodyDay = await read(`/app/body/api/day/${day}`);
        if (asked !== epoch || ctx.disposed) return;
        reveal(renderDayView(bodyDay));
        if (arrive) focusArrived();
        ctx.ready(bodyDay.has_data ? "content" : "empty");
      } catch (err) {
        if (asked !== epoch || ctx.disposed) return;
        showError("couldn't load body day", err, () => loadBodyDay(day, arrive));
        if (arrive) focusArrived();
        ctx.ready("error");
      }
    }

    function changeTo(day) {
      if (!day || day === shown) return;
      const arrive = !shown;
      closeDialog();
      cut();
      shown = day;
      if (window.DateNav && window.DateNav.setDay) window.DateNav.setDay(day);
      document.querySelector(".body-shell")?.removeAttribute("data-body-empty");
      if (arrive) focusNode(document.getElementById("main-content"));
      loadBodyDay(day, arrive);
    }

    const mine = {
      reloadDay() {
        if (shown) loadBodyDay(shown);
      },
    };
    hooks = mine;
    ctx.onDispose(() => {
      closeDialog();
      if (hooks === mine) hooks = null;
      scope.abort();
    });

    if (shown) loadBodyDay(shown);
    else loadOverview();
    return {
      update(params) { changeTo(params && params.day); },
    };
  }

  function renderExperience(item) {
    const times = [item.start, item.end].filter(Boolean).map(escapeHtml).join(" &ndash; ");
    const bits = [times, item.distance ? escapeHtml(item.distance) : "", item.by ? escapeHtml(item.by) : ""].filter(Boolean);
    const kind = item.continuing ? `${escapeHtml(item.kind)} continuing` : escapeHtml(item.kind);
    return `<li><span class="body-workout-name">${escapeHtml(item.name)}</span><span class="body-num">${kind}${bits.length ? ` &middot; ${bits.join(" &middot; ")}` : ""}</span></li>`;
  }

  function renderFact(name, detail) {
    return `<li><span>${escapeHtml(name)}</span><strong class="body-num">${detail}</strong></li>`;
  }

  function timeSpan(item) {
    if (!item.first) return "";
    return ` &middot; ${escapeHtml(item.first)}${item.last && item.last !== item.first ? ` &ndash; ${escapeHtml(item.last)}` : ""}`;
  }

  function renderReadings(readings) {
    return asArray(readings).map((item) => renderFact(item.name, html([
      escapeHtml(item.count_label),
      timeSpan(item),
      item.by ? ` &middot; ${escapeHtml(item.by)}` : "",
    ]))).join("");
  }

  function renderCounts(counts) {
    return asArray(counts).map((item) => renderFact(item.name, html([
      item.total !== null && item.total !== undefined ? escapeHtml(item.total) : escapeHtml(item.count_label),
      item.by ? ` &middot; ${escapeHtml(item.by)}` : "",
    ]))).join("");
  }

  function renderLogged(logged) {
    return asArray(logged).map((item) => renderFact(item.name, html([
      escapeHtml(item.count_label),
      timeSpan(item),
      item.who ? ` &middot; ${escapeHtml(item.who)}` : "",
    ]))).join("");
  }

  function renderSourceSection(source) {
    const documents = asArray(source.documents);
    return html([
      `<section class="body-card body-section body-source-section" aria-labelledby="body-source-${escapeHtml(source.source)}">`,
      `<h2 id="body-source-${escapeHtml(source.source)}" class="body-question-title">${escapeHtml(source.name)}</h2>`,
      asArray(source.experiences).length ? `<ul class="body-workouts">${source.experiences.map(renderExperience).join("")}</ul>` : "",
      renderReadings(source.readings) ? `<h3 class="body-card-label">readings</h3><ul class="body-facts">${renderReadings(source.readings)}</ul>` : "",
      renderCounts(source.counts) ? `<h3 class="body-card-label">counts</h3><ul class="body-facts">${renderCounts(source.counts)}</ul>` : "",
      renderLogged(source.logged) ? `<h3 class="body-card-label">logged</h3><ul class="body-facts">${renderLogged(source.logged)}</ul>` : "",
      documents.length ? `<h3 class="body-card-label">for this date</h3><ul class="body-facts">${documents.map((doc) => renderFact(doc.name, doc.value ? escapeHtml(doc.value) : "")).join("")}</ul>` : "",
      '</section>',
    ]);
  }

  function renderStravaCard(workouts) {
    const list = asArray(workouts);
    if (!list.length) return "";
    return html([
      '<section class="body-card" aria-labelledby="body-strava-title">',
      '<h2 id="body-strava-title" class="body-question-title">Strava</h2>',
      `<ul class="body-workouts">${list.map(renderStravaWorkout).join("")}</ul>`,
      '</section>',
    ]);
  }

  function renderDayView(bodyDay) {
    const header = renderHeader("", "", true, { showTitle: false });
    const earlier = renderEarlierImports(bodyDay.earlier_imports);
    const unreadable = Number(bodyDay.unreadable_windows) > 0
      ? '<p class="body-muted body-earlier">part of this day couldn\'t be read.</p>'
      : "";
    if (!bodyDay.has_data) {
      return html([header, earlier, renderEmptyDay(bodyDay, Boolean(earlier)), unreadable]);
    }
    return html([
      header,
      asArray(bodyDay.sources).map(renderSourceSection).join(""),
      renderStravaCard(bodyDay.strava),
      earlier,
      unreadable,
    ]);
  }

  window.SolViews.register("body", { mount: mountBody });
})();
</script>
