    const unmatchedCount = unmatched ? unmatched.length : 0;

    if (!hasMatched && !hasUnmatched) {
      container.innerHTML = window.SurfaceState.empty({
        icon: window.ConveyIcons.svg('users'),
        heading: 'no speakers found',
        desc: 'no speaker voices were detected in this segment'
      });
      return;
    }

    let titleParts = [];
    if (matchedCount > 0) titleParts.push(`${matchedCount} matched`);
    if (unmatchedCount > 0) titleParts.push(`${unmatchedCount} unmatched`);
    const title = `Speakers (${titleParts.join(', ')})`;

    let html = `<h2 class="spk-speakers-title">${title}</h2><ul class="spk-speaker-cards">`;
    if (hasMatched) {
      matched.forEach(m => {
        html += `
          <li class="spk-speaker-card spk-speaker-matched">
            <h3 class="spk-speaker-entity">${escapeHtml(m.entity_name)}</h3>
            ${m.detected_name !== m.entity_name ? `<span class="spk-speaker-detected">(${escapeHtml(m.detected_name)})</span>` : ''}
          </li>
        `;
      });
    }

    if (hasUnmatched) {
      unmatched.forEach(name => {
        html += `<li class="spk-speaker-card spk-speaker-unmatched"><h3 class="spk-speaker-entity">${escapeHtml(name)}</h3></li>`;
      });
    }

    html += '</ul>';
    container.innerHTML = html;
  }

  function loadReview(seg, source, options) {
    const throwOnError = Boolean(options?.throwOnError);
    const requestSeq = reviewRequestSeq + 1;
    reviewRequestSeq = requestSeq;
    const container = document.getElementById('spkSentences');
    const isFirstPaint = Boolean(
      container
      && container.querySelector('.spk-sentence') === null
      && container.textContent.trim() === 'Loading...'
    );
    if (container && isFirstPaint) {
      container.innerHTML = '<div class="spk-empty">Loading...</div>';
    }

    setReviewStatus();
    return window.apiJson(segmentRequestUrl('/app/speakers/api/review', seg, source))
      .then(data => {
        if (requestSeq !== reviewRequestSeq) return false;
        if (
          selectedSegment
          && (
            !sameSegment(selectedSegment, seg)
            || selectedSource !== source
          )
        ) {
          return false;
        }
        if (data.error) {
          const err = new Error(data.error);
          err.serverMessage = data.error;
          throw err;
        }

        currentSentences = data.sentences || [];
        reviewEntities = data.all_entities || [];
        hasLabels = Boolean(data.has_labels);
        reviewSummary = data.summary || null;
        playingSentenceId = null;
        renderReview(data);
        return true;
      })
      .catch((err) => {
        if (requestSeq !== reviewRequestSeq) return false;
        window.logError(err, { context: 'speakers: loadReview failed' });
        if (container) {
          if (isFirstPaint) {
            container.innerHTML = window.SurfaceState.error({
              heading: "Couldn't load review",
              desc: window.CONVEY_COPY.RELOAD_HINT,
              serverMessage: err.serverMessage,
              detail: err,
            });
          } else {
            setReviewStatus("Couldn't reload review — showing last known state.", err.serverMessage);
          }
        }
        if (throwOnError) throw err;
        return false;
      });
  }

  function renderReview(data) {
    const { audio_file, audio_mimetype } = data;
    const audioContainer = document.getElementById('spkAudioContainer');
    if (audio_file) {
      audioContainer.innerHTML = `
        <div class="spk-player-controls">
          <button class="spk-skip-back" id="spkSkipBack" title="back 5s">&#8634; 5s</button>
          <audio id="spkAudio" controls preload="metadata">
            <source src="${audio_file}" type="${audio_mimetype}">
          </audio>
          <button class="spk-speed-toggle" id="spkSpeedToggle" title="playback speed">1x</button>
        </div>
      `;
      audioPlayer = document.getElementById('spkAudio');
      setupAudioListeners();
    } else {
      audioContainer.innerHTML = '<div class="spk-empty">no audio file available</div>';
      audioPlayer = null;
    }

    renderReviewList();
  }

  function renderReviewList() {
    const container = document.getElementById('spkSentences');
    if (!container) return;

    const sentences = filteredSentences();
    const total = currentSentences.length;
    const countLabel = countLabelForFilter(sentences.length, total);

    if (total === 0) {
      container.innerHTML = window.SurfaceState.empty({
        icon: window.ConveyIcons.svg('file-text'),
        heading: 'no sentences to review',
        desc: 'this segment doesn\'t have any sentences to work with yet'
      });
      return;
    }

    container.innerHTML = `
      <h2 class="spk-sentences-title">
        <span id="spkSentenceCount">${escapeHtml(countLabel)}</span>
      </h2>
      <div class="spk-filter-bar">
        <button class="spk-filter-btn${currentFilter === 'all' ? ' active' : ''}" data-filter="all">all</button>
        <button class="spk-filter-btn${currentFilter === 'needs_review' ? ' active' : ''}" data-filter="needs_review">needs review</button>
        <button class="spk-filter-btn${currentFilter === 'corrections' ? ' active' : ''}" data-filter="corrections">corrections</button>
      </div>
      ${(() => {
        const seg = selectedSegment;
        const nonOwnerTotal = seg?.attribution_non_owner_total || 0;
        const nullCount = seg?.attribution_null || 0;
        const showPrompt = seg?.speaker_count > 0 && nonOwnerTotal > 0 && (nullCount / nonOwnerTotal) > 0.5;
        return showPrompt ? `<div class="spk-seeding-prompt">this meeting has ${seg.speaker_count} named speakers, but their voices can't be matched yet. assigning even a few sentences will improve voice matching for future meetings.</div>` : '';
      })()}
      ${!hasLabels ? '<div class="spk-status spk-status-info">speakers haven\'t been identified yet. assign a few sentences to improve voice matching.</div>' : ''}
      ${sentences.length === 0 ? '<div class="spk-empty">no sentences match this filter</div>' : sentences.map(renderSentence).join('')}
    `;

    container.querySelectorAll('.spk-filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;
        renderReviewList();
        renderSegmentList();
      });
    });

    setupSentenceHandlers();
  }

  function filteredSentences() {
    if (currentFilter === 'needs_review') {
      return currentSentences.filter(s => s.needs_review);
    }
    if (currentFilter === 'corrections') {
      return currentSentences.filter(s => s.is_correction);
    }
    return currentSentences;
  }

  function countLabelForFilter(visible, total) {
    if (currentFilter === 'all') {
      return `sentences (${total})`;
    }
    return `sentences (${visible} of ${total})`;
  }

  function renderSentence(sentence) {
    const timeStr = formatOffset(sentence.offset);
    const speakerHtml = renderSpeakerDisplay(sentence);
    const actionsHtml = renderActions(sentence);

    return `
      <div class="spk-sentence" data-id="${sentence.id}" data-offset="${sentence.offset}">
        <div class="spk-sentence-time">${timeStr}</div>
        <div class="spk-sentence-content">
          <div class="spk-sentence-text">${escapeHtml(sentence.text)}</div>
          <div class="spk-sentence-speaker">${speakerHtml}</div>
          <div class="spk-status-container" id="status-${sentence.id}" role="status" aria-live="polite"></div>
        </div>
        <div class="spk-sentence-actions">
          <button class="spk-btn spk-btn-icon spk-play-btn" aria-label="${escapeHtml(SPK_COPY.SPK_PLAY_FROM_HERE_LABEL || '')}" title="${escapeHtml(SPK_COPY.SPK_PLAY_FROM_HERE_LABEL || '')}">&#9654;</button>
          ${actionsHtml}
        </div>
      </div>
    `;
  }

  function renderSpeakerDisplay(sentence) {
    if (!sentence.speaker_name) {
      return '<span class="spk-review-state">unassigned</span>';
    }

    let dotClass = '';
    if (sentence.confidence === 'high') {
      dotClass = ' spk-confidence-high';
    } else if (sentence.confidence === 'medium') {
      dotClass = ' spk-confidence-medium';
    }

    let html = '';
    if (dotClass) {
      html += `<span class="spk-confidence-dot${dotClass}" aria-label="${sentence.confidence} confidence"></span>`;
      html += `<span class="spk-confidence-label">${escapeHtml(sentence.confidence)}</span>`;
    }

    if (sentence.is_correction && sentence.original_speaker_name) {
      html += `<span class="spk-correction-original">${escapeHtml(sentence.original_speaker_name)}</span>`;
    }

    html += `<span>${escapeHtml(sentence.speaker_name)}</span>`;

    if (sentence.needs_review) {
      html += '<span class="spk-review-state">needs review</span>';
    } else if (sentence.method) {
      html += `<span class="spk-review-state">${escapeHtml(METHOD_DISPLAY[sentence.method] || sentence.method)}</span>`;
    }

    return html;
  }

  function renderActions(sentence) {
    if (!hasLabels) {
      return '<span class="spk-review-state">not yet identified</span>';
    }

    const options = reviewEntities.map(entity => (
      `<option value="${escapeHtml(entity.entity_id)}">${escapeHtml(entity.name)}</option>`
    )).join('');

    if (sentence.speaker_entity_id) {
      const correctSelect = `
        <select class="spk-select-small spk-correct-select" aria-label="correct attribution" data-sentence-id="${sentence.id}">
          <option value="">correct...</option>
          ${options}
        </select>
        <button class="spk-btn spk-btn-primary spk-apply-btn" data-sentence-id="${sentence.id}" data-action="correct" style="display:none" aria-label="apply correction">&#10003;</button>
      `;

      if (sentence.confidence === 'medium') {
        return `
          <button class="spk-btn spk-btn-primary spk-confirm-btn" data-sentence-id="${sentence.id}">confirm &#10003;</button>
          ${correctSelect}
        `;
      }

      return correctSelect;
    }

    return `
      <select class="spk-select-small spk-assign-select" aria-label="assign speaker" data-sentence-id="${sentence.id}">
        <option value="">assign...</option>
        ${options}
      </select>
      <button class="spk-btn spk-btn-primary spk-apply-btn" data-sentence-id="${sentence.id}" data-action="assign" style="display:none" aria-label="apply assignment">&#10003;</button>
    `;
  }

  function setupSentenceHandlers() {
    detailPanel.querySelectorAll('.spk-play-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const row = btn.closest('.spk-sentence');
        const sentenceId = parseInt(row.dataset.id, 10);
        const offset = parseFloat(row.dataset.offset);

        if (!audioPlayer) return;

        if (sentenceId === playingSentenceId && !audioPlayer.paused) {
          audioPlayer.pause();
        } else {
          audioPlayer.currentTime = offset;
          audioPlayer.play();
        }
      });
    });

    detailPanel.querySelectorAll('.spk-confirm-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const sentenceId = parseInt(btn.dataset.sentenceId, 10);
        confirmAttribution(sentenceId);
      });
    });

    detailPanel.querySelectorAll('.spk-correct-select').forEach(select => {
      select.addEventListener('change', () => {
        const applyBtn = select.nextElementSibling;
        if (select.value) {
          applyBtn.dataset.value = select.value;
          applyBtn.style.display = '';
        } else {
          applyBtn.style.display = 'none';
        }
      });
    });

    detailPanel.querySelectorAll('.spk-assign-select').forEach(select => {
      select.addEventListener('change', () => {
        const applyBtn = select.nextElementSibling;
        if (select.value) {
          applyBtn.dataset.value = select.value;
          applyBtn.style.display = '';
        } else {
          applyBtn.style.display = 'none';
        }
      });
    });

    detailPanel.querySelectorAll('.spk-apply-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const sentenceId = parseInt(btn.dataset.sentenceId, 10);
        const value = btn.dataset.value;
        if (btn.dataset.action === 'correct') {
          correctAttribution(sentenceId, value);
        } else if (btn.dataset.action === 'assign') {
          assignAttribution(sentenceId, value);
        }
      });
    });
  }

  async function confirmAttribution(sentenceId) {
    try {
      const sentence = currentSentences.find(s => s.id === sentenceId);
      const isPrincipalAttestation = Boolean(sentence?.is_owner);
      await window.apiJson('/app/speakers/api/confirm-attribution', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          day,
          stream_layout: segmentLayout(selectedSegment),
          stream: selectedSegment.stream,
          segment_key: selectedSegment.key,
          source: selectedSource,
          sentence_id: sentenceId,
        }),
      });
      if (sentence) {
        sentence.confidence = 'high';
        sentence.method = 'user_confirmed';
        sentence.needs_review = false;
        sentence.is_correction = true;
      }
      renderReviewList();
      showStatusBySentence(sentenceId, 'Attribution confirmed', 'success');
      loadSegments();
      if (isPrincipalAttestation) {
        checkOwnerStatus();
      }
    } catch (err) {
      showStatusBySentence(
        sentenceId,
        err.serverMessage || 'something went wrong — try again',
        'error'
      );
    }
  }

  async function correctAttribution(sentenceId, newSpeaker) {
    try {
      const result = await window.apiJson('/app/speakers/api/correct-attribution', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          day,
          stream_layout: segmentLayout(selectedSegment),
          stream: selectedSegment.stream,
          segment_key: selectedSegment.key,
          source: selectedSource,
          sentence_id: sentenceId,
          new_speaker: newSpeaker,
        }),
      });
      await loadReview(selectedSegment, selectedSource);
      loadSegments();
      showPropagationOffer(sentenceId, result.propagation_offer);
      triggerOwnerStatusIfPrincipal(newSpeaker);
    } catch (err) {
      showStatusBySentence(
        sentenceId,
        err.serverMessage || 'something went wrong — try again',
        'error'
      );
    }
  }

  async function propagateCorrection(request, sentenceId) {
    try {
      const body = {...request, commit: true};
      const result = await window.apiJson('/app/speakers/api/propagate-correction', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      await loadReview(selectedSegment, selectedSource);
      loadSegments();
      const count = result.statement_count || 0;
      showStatusBySentence(sentenceId, `${count} statement${count === 1 ? '' : 's'} updated`, 'success');
    } catch (err) {
      showStatusBySentence(
        sentenceId,
        err.serverMessage || 'something went wrong — try again',
        'error'
      );
    }
  }

  async function assignAttribution(sentenceId, speaker) {
    try {
      await window.apiJson('/app/speakers/api/assign-attribution', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          day,
          stream_layout: segmentLayout(selectedSegment),
          stream: selectedSegment.stream,
          segment_key: selectedSegment.key,
          source: selectedSource,
          sentence_id: sentenceId,
          speaker,
        }),
      });
      loadReview(selectedSegment, selectedSource);
      loadSegments();
      triggerOwnerStatusIfPrincipal(speaker);
    } catch (err) {
      showStatusBySentence(
        sentenceId,
        err.serverMessage || 'something went wrong — try again',
        'error'
      );
    }
  }

  function triggerOwnerStatusIfPrincipal(speakerId) {
    if (!speakerId) return;
    if (speakerId === principalEntityId()) {
      checkOwnerStatus();
    }
  }

  function showStatusBySentence(sentenceId, message, type) {
    const container = document.getElementById(`status-${sentenceId}`);
    if (!container) return;
    if (statusTimers[sentenceId]) {
      clearTimeout(statusTimers[sentenceId]);
      delete statusTimers[sentenceId];
    }
    if (type === 'error') {
      container.setAttribute('aria-live', 'assertive');
      container.innerHTML = `<div class="spk-status spk-status-${type}">${escapeHtml(message)}<button class="spk-status-dismiss" aria-label="dismiss" onclick="this.closest('.spk-status-container').innerHTML='';this.closest('.spk-status-container').setAttribute('aria-live','polite')">&times;</button></div>`;
    } else {
      container.setAttribute('aria-live', 'polite');
      container.innerHTML = `<div class="spk-status spk-status-${type}">${escapeHtml(message)}</div>`;
      statusTimers[sentenceId] = setTimeout(() => {
        const current = document.getElementById(`status-${sentenceId}`);
        if (current) {
          const msg = current.querySelector('.spk-status');
          if (msg) msg.style.opacity = '0';
          setTimeout(() => { current.innerHTML = ''; }, 300);
        }
        delete statusTimers[sentenceId];
      }, 3000);
    }
  }

  function showPropagationOffer(sentenceId, offer) {
    const container = document.getElementById(`status-${sentenceId}`);
    if (!container) return;
    if (statusTimers[sentenceId]) {
      clearTimeout(statusTimers[sentenceId]);
      delete statusTimers[sentenceId];
    }

    container.setAttribute('aria-live', 'polite');
    if (!offer || offer.available !== true) {
      container.innerHTML = `<div class="spk-status spk-status-success">${escapeHtml(SPK_COPY.SPK_CORRECT_SCOPE || '')} ${escapeHtml(SPK_COPY.SPK_CORRECT_PROPAGATE_NONE || '')}</div>`;
      statusTimers[sentenceId] = setTimeout(() => {
        const current = document.getElementById(`status-${sentenceId}`);
        if (current) current.innerHTML = '';
        delete statusTimers[sentenceId];
      }, 3000);
      return;
    }

    container.innerHTML = `
      <div class="spk-status spk-status-success">
        <span>${escapeHtml(SPK_COPY.SPK_CORRECT_SCOPE || '')}</span>
        <span>${escapeHtml(SPK_COPY.SPK_CORRECT_PROPAGATE_OFFER || '')}</span>
        <button class="spk-status-action" type="button">${escapeHtml(SPK_COPY.SPK_CORRECT_PROPAGATE_APPLY || '')}</button>
      </div>
    `;
    container.querySelector('.spk-status-action')?.addEventListener('click', () => {
      propagateCorrection(offer.request || {}, sentenceId);
    });
  }

  function setupAudioListeners() {
    if (!audioPlayer) return;

    audioPlayer.addEventListener('timeupdate', () => {
      updateActiveSentence(audioPlayer.currentTime);
    });

    audioPlayer.addEventListener('play', () => {
      if (playingSentenceId !== null) {
        const btn = detailPanel.querySelector(`.spk-sentence[data-id="${playingSentenceId}"] .spk-play-btn`);
        if (btn) btn.innerHTML = '&#9208;';
      }
    });

    audioPlayer.addEventListener('pause', () => {
      if (playingSentenceId !== null) {
        const btn = detailPanel.querySelector(`.spk-sentence[data-id="${playingSentenceId}"] .spk-play-btn`);
        if (btn) btn.innerHTML = '&#9654;';
      }
    });

    audioPlayer.addEventListener('ended', () => {
      if (playingSentenceId !== null) {
        const row = detailPanel.querySelector(`.spk-sentence[data-id="${playingSentenceId}"]`);
        if (row) {
          row.classList.remove('spk-playing');
          row.querySelector('.spk-play-btn').innerHTML = '&#9654;';
        }
        playingSentenceId = null;
      }
    });

    audioPlayer.addEventListener('error', () => {
      const container = document.getElementById('spkAudioContainer');
      if (container) {
        container.innerHTML = '<div class="spk-status spk-status-error" role="alert">couldn\'t load audio — the file may be missing or in an unsupported format<button class="spk-status-dismiss" aria-label="dismiss">&times;</button></div>';
        container.querySelector('.spk-status-dismiss')?.addEventListener('click', (e) => {
          e.target.closest('.spk-status-error').remove();
        });
      }
    });

    const skipBackBtn = document.getElementById('spkSkipBack');
    if (skipBackBtn) {
      skipBackBtn.addEventListener('click', () => {
        audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 5);
      });
    }

    const speedToggleBtn = document.getElementById('spkSpeedToggle');
    if (speedToggleBtn) {
      const speeds = [1, 1.5, 2];
      speedToggleBtn.addEventListener('click', () => {
        const currentIndex = speeds.indexOf(audioPlayer.playbackRate);
        const nextIndex = (currentIndex + 1) % speeds.length;
        audioPlayer.playbackRate = speeds[nextIndex];
        speedToggleBtn.textContent = speeds[nextIndex] + 'x';
      });
    }
  }

  function updateActiveSentence(currentTime) {
    let activeSentence = null;
    for (let i = 0; i < currentSentences.length; i++) {
      const sentence = currentSentences[i];
      const nextOffset = currentSentences[i + 1]?.offset ?? Infinity;
      if (currentTime >= sentence.offset && currentTime < nextOffset) {
        activeSentence = sentence;
        break;
      }
    }

    const newId = activeSentence?.id ?? null;
    if (newId === playingSentenceId) return;

    if (playingSentenceId !== null) {
      const prevRow = detailPanel.querySelector(`.spk-sentence[data-id="${playingSentenceId}"]`);
      if (prevRow) {
        prevRow.classList.remove('spk-playing');
        prevRow.querySelector('.spk-play-btn').innerHTML = '&#9654;';
      }
    }

    playingSentenceId = newId;
    if (playingSentenceId !== null) {
      const newRow = detailPanel.querySelector(`.spk-sentence[data-id="${playingSentenceId}"]`);
      if (newRow) {
        newRow.classList.add('spk-playing');
        if (!audioPlayer.paused) {
          newRow.querySelector('.spk-play-btn').innerHTML = '&#9208;';
        }
        newRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }
  }

  function formatDuration(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    if (mins === 0) return `${secs}s`;
    return secs > 0 ? `${mins}m ${secs}s` : `${mins}m`;
  }

  function formatOffset(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins}:${secs.toString().padStart(2, '0')}`;
  }

  function formatSource(source) {
    return source
      .replace(/_audio$/, '')
      .replace(/^sys$/, 'system')
      .replace(/^mic$/, 'microphone')
      .replace(/_/g, ' ');
  }

})();
</script>

  <section class="spk-overview-section" data-section="quality">

  <section class="spk-overview-section" data-section="known-voices">
    <div class="spk-overview-header">
      <h2 class="spk-overview-title" data-copy="SPK_OVERVIEW_KNOWN_VOICES_HEADER"></h2>
      <select id="spkKnownSort" class="spk-overview-select" aria-label="sort voices"></select>
    </div>
    <div id="spkKnownVoices"></div>
  </section>

  <section class="spk-overview-section" data-section="new-voices" id="spkNewVoicesSection">
    <div class="spk-overview-header">
      <h2 class="spk-overview-title" data-copy="SPK_OVERVIEW_NEW_VOICES_HEADER"></h2>
    </div>
    <div id="spkStatementHandoffNotice" class="spk-overview-muted" hidden></div>
    <div id="spkOverviewDiscoveryNotice" class="spk-overview-discovery-notice" hidden></div>
    <div id="spkDiscoveryClusters" class="spk-discovery-clusters"></div>
  </section>

  <section class="spk-overview-section" data-section="today">
    <a id="spkTodayReview" class="spk-overview-link" href=""></a>
  </section>
</div>
</div>

<script>
(() => {
  let COPY = {};
  let OWNER_STATUS_ROUTING = {};
  let NOT_IN_NEW_VOICES_COPY = '';
  let TODAY = '';
  let OWNER_MIN = 0;
  const ownerPanel = document.getElementById('spkOverviewOwner');
  const qualityPanel = document.getElementById('spkOverviewQuality');
  const knownContainer = document.getElementById('spkKnownVoices');
  const sortSelect = document.getElementById('spkKnownSort');
  const discoverySection = document.getElementById('spkNewVoicesSection');
  const statementHandoffNotice = document.getElementById('spkStatementHandoffNotice');
  const overviewDiscoveryNoticeNode = document.getElementById('spkOverviewDiscoveryNotice');
  const discoveryContainer = document.getElementById('spkDiscoveryClusters');
  const todayLink = document.getElementById('spkTodayReview');
  const dayGridCard = document.getElementById('spkDayGridCard');
  const dayGridCopy = document.getElementById('spkDayGridCopy');
  const dayGridHost = document.getElementById('spkDayGridHost');
  const dayGridLegend = document.getElementById('spkDayGridLegend');
  const escapeHtml = (value) => window.AppServices.escapeHtml(value);
  let mountedDayGridKey = null;
  let whoIsThisSheet = null;
  let discoveryClustersById = new Map();
  let qualityRequestSeq = 0;
  let knownRequestSeq = 0;
  let overviewDiscoveryRequestSeq = 0;
  let overviewDiscoveryNotice = null;
  let overviewHandoffSheetOpen = false;
  const overviewYourVoiceSection = document.getElementById('spkOverviewYourVoiceSection');

  function focusOverviewYourVoiceSection() {
    overviewYourVoiceSection.focus();
    overviewYourVoiceSection.scrollIntoView({ block: 'nearest' });
  }

  function applyOverviewState(payload) {
    COPY = payload.speaker_copy || {};
    OWNER_STATUS_ROUTING = payload.owner_status_routing_tokens || {};
    NOT_IN_NEW_VOICES_COPY = payload.not_in_new_voices_copy || '';
    TODAY = payload.today || '';
    OWNER_MIN = payload.owner_min_statements || 0;
    document.querySelectorAll('[data-copy]').forEach((node) => {
      node.textContent = COPY[node.dataset.copy] || '';
    });
    dayGridCopy.textContent = COPY.SPK_GRID_BODY || '';
    todayLink.textContent = COPY.SPK_OVERVIEW_TODAY_LINK_LABEL || '';
    todayLink.href = `/app/speakers/${TODAY}`;
  }

  function dayGridUnit() {
    return {
      one: COPY.SPK_GRID_UNIT_ONE,
      other: COPY.SPK_GRID_UNIT_OTHER,
      none: COPY.SPK_GRID_UNIT_NONE,
    };
  }

  function dayGridActivityUnit() {
    return {
      one: COPY.SPK_GRID_ACTIVITY_ONE,
      other: COPY.SPK_GRID_ACTIVITY_OTHER,
    };
  }

  function relativeTime(value) {
    if (!value) return '&mdash;';
    const ms = typeof value === 'number' ? value : Date.parse(value);
    if (!Number.isFinite(ms)) return '&mdash;';
    if (window.RelativeTime?.formatTimestamp) return window.RelativeTime.formatTimestamp(ms);
    const delta = Math.max(0, Date.now() - ms);
    const hours = Math.floor(delta / 3600000);
    if (hours < 1) return 'just now';
    if (hours < 48) return `${hours}h ago`;
    return `${Math.floor(hours / 24)}d ago`;
  }

  function cohesionBin(value) {
    if (value === null || value === undefined || Number.isNaN(Number(value))) return 0;
    const n = Number(value);
    if (n >= 0.50) return 5;
    if (n >= 0.40) return 4;
    if (n >= 0.30) return 3;
    if (n >= 0.20) return 2;
    if (n >= 0.10) return 1;
    return 0;
  }

  function cohesion(value) {
    const bin = cohesionBin(value);
    const dots = Array.from({length: 5}, (_, index) => (
      `<span class="spk-dot${index < bin ? ' spk-dot-filled' : ''}"></span>`
    )).join('');
    const label = COPY.SPK_OVERVIEW_COHESION_LABELS[bin] || '';
    return `<span class="spk-cohesion"><span class="spk-dots">${dots}</span><span>${escapeHtml(label)}</span></span>`;
  }

  function ownerNotReady(data) {
    const countValue = Number(data.manual_tags_count || 0);
    const streamValue = Number(data.streams_represented || 0);
    const count = Number.isFinite(countValue) ? Math.max(0, countValue) : 0;
    const streams = Number.isFinite(streamValue) ? Math.max(0, streamValue) : 0;
    const threshold = Number(OWNER_MIN);
    const hasProgress = Number.isFinite(threshold) && threshold > 0;
    const progress = hasProgress
      ? Math.min(100, Math.max(0, Math.round((count / threshold) * 100)))
      : null;
    const progressHtml = hasProgress
      ? `<div class="spk-progress" aria-hidden="true"><div class="spk-progress-fill" style="width:${progress}%"></div></div>`
      : '';
    let diagnostic = '';
    if (data.low_quality_reason) {
      diagnostic = `<p class="spk-overview-muted">gate: ${escapeHtml(data.low_quality_reason)}; observed ${escapeHtml(String(data.observed_value ?? ''))}; threshold ${escapeHtml(String(data.threshold_value ?? ''))}</p>`;
    } else if (!hasProgress) {
      diagnostic = `<p class="spk-overview-muted">${escapeHtml(COPY.SPK_OVERVIEW_OWNER_PROGRESS_UNKNOWN)}</p>`;
    } else {
      diagnostic = `<p class="spk-overview-muted">${count} ${escapeHtml(COPY.SPK_OVERVIEW_OWNER_PROGRESS_SUFFIX)} · ${streams} ${escapeHtml(COPY.SPK_OVERVIEW_OWNER_STREAMS_LABEL)}</p>`;
    }
    ownerPanel.innerHTML = `
      <strong>${escapeHtml(COPY.SPK_OVERVIEW_YOUR_VOICE_LEARNING)}</strong>
      ${progressHtml}
      ${diagnostic}
      <div class="spk-overview-actions">
        <a class="spk-overview-btn spk-overview-btn-primary" href="/app/speakers/${TODAY}">${escapeHtml(COPY.SPK_OVERVIEW_OWNER_HELP_LABEL)}</a>
        ${data.can_build_from_tags === true ? `<button id="spkBuildOwner" class="spk-overview-btn">${escapeHtml(COPY.SPK_OVERVIEW_OWNER_BUILD_FROM_TAGS_LABEL)}</button>` : ''}
      </div>
    `;
    document.getElementById('spkBuildOwner')?.addEventListener('click', () => {
      fetch('/app/speakers/api/owner/build-from-tags', {method: 'POST'}).then(loadOwner);
    });
  }

  function ownerStatusError() {
    ownerPanel.innerHTML = `
      <strong>${escapeHtml(COPY.SPK_OVERVIEW_OWNER_STATUS_ERROR)}</strong>
      <div class="spk-overview-actions">
        <a class="spk-overview-btn spk-overview-btn-primary" href="/app/speakers/${TODAY}">${escapeHtml(COPY.SPK_OVERVIEW_OWNER_HELP_LABEL)}</a>
      </div>
    `;
  }

  function ownerCandidate(data) {
    const samples = data.samples || [];
    ownerPanel.innerHTML = `
      <strong>Is this you?</strong>
      <p class="spk-overview-muted">${escapeHtml(String(data.cluster_size || 0))} ${escapeHtml(COPY.SPK_OVERVIEW_OWNER_SAMPLES_LABEL)}</p>
      <div class="spk-owner-samples">
        ${samples.map((sample, index) => `
          <div class="spk-owner-sample">
            <div class="spk-card-title">sample ${index + 1}</div>
            <div class="spk-card-line">${escapeHtml(sample.day)} · ${escapeHtml(sample.stream)} · ${escapeHtml(sample.segment_key)}</div>
            ${sample.audio_url ? `<audio controls preload="metadata" src="${escapeHtml(sample.audio_url)}"></audio>` : ''}
          </div>
        `).join('')}
      </div>
      <div class="spk-overview-actions">
        <button id="spkOwnerConfirm" class="spk-overview-btn spk-overview-btn-primary">yes, that's me</button>
        <button id="spkOwnerReject" class="spk-overview-btn">no, try again</button>
      </div>
    `;
    document.getElementById('spkOwnerConfirm')?.addEventListener('click', () => {
      fetch('/app/speakers/api/owner/confirm', {method: 'POST'}).then(loadOwner);
    });
    document.getElementById('spkOwnerReject')?.addEventListener('click', () => {
      fetch('/app/speakers/api/owner/reject', {method: 'POST'}).then(loadOwner);
    });
  }

  function ownerConfirmed(data) {
    const meta = data.centroid_metadata || {};
    const streams = meta.streams || [];
    const builtAt = meta.created_at ? relativeTime(meta.created_at) : escapeHtml(COPY.SPK_OVERVIEW_OWNER_BUILT_UNKNOWN);
    ownerPanel.innerHTML = `
      <strong>${escapeHtml(COPY.SPK_OVERVIEW_YOUR_VOICE_CONFIRMED)}</strong>
      <p class="spk-card-line">${escapeHtml(COPY.SPK_OVERVIEW_OWNER_SAMPLES_LABEL)}: ${escapeHtml(String(meta.cluster_size || 0))}</p>
      <p class="spk-card-line">${escapeHtml(COPY.SPK_OVERVIEW_OWNER_STREAMS_LABEL)}: ${escapeHtml(streams.length ? streams.join(' · ') : '—')}</p>
      <p class="spk-card-line">${escapeHtml(COPY.SPK_OVERVIEW_OWNER_COHESION_LABEL)}: ${cohesion(meta.intra_cosine_p25)}</p>
      <p class="spk-card-line">${escapeHtml(COPY.SPK_OVERVIEW_OWNER_BUILT_PREFIX)}: ${builtAt}</p>
      <p class="spk-card-line">${escapeHtml(COPY.SPK_OVERVIEW_OWNER_REFRESHED_PREFIX)}: ${relativeTime(meta.last_refreshed_at)}</p>
    `;
  }

  function qualityCount(value) {
    const count = Number(value || 0);
    return Number.isFinite(count) ? count : 0;
  }

  function qualityLine(label, value) {
    return `<p class="spk-card-line">${escapeHtml(label)}: ${escapeHtml(String(qualityCount(value)))}</p>`;
  }

  function qualityRows(data) {
    const buckets = data.tier_histogram || {};
    return [
      qualityLine(COPY.SPK_OVERVIEW_QUALITY_HIGH_LABEL, buckets.high_statements),
      qualityLine(COPY.SPK_OVERVIEW_QUALITY_MEDIUM_LABEL, buckets.medium_statements),
      qualityLine(COPY.SPK_OVERVIEW_QUALITY_MARGIN_LABEL, buckets.margin_declined_statements),
      qualityLine(COPY.SPK_OVERVIEW_QUALITY_UNLABELED_LABEL, buckets.unlabeled_sentence_statements),
      qualityLine(COPY.SPK_OVERVIEW_QUALITY_MISSING_LABEL, buckets.no_labels_file_segments),
      qualityLine(COPY.SPK_OVERVIEW_QUALITY_SKIPPED_LABEL, buckets.skipped_stub_segments),
    ].join('');
  }

  function qualityTeachingLine(data) {
    const count = qualityCount(data.corrections_window_count);
    if (count === 0) {
      return `<p class="spk-card-line">${escapeHtml(COPY.SPK_OVERVIEW_QUALITY_TEACHING_ZERO)}</p>`;
    }
    return `<p class="spk-card-line">${escapeHtml(String(count))} ${escapeHtml(COPY.SPK_OVERVIEW_QUALITY_TEACHING_LABEL)}</p>`;
  }

  function qualityWarning(data) {
    const unreadable = data.unreadable_files || {};
    const count = qualityCount(unreadable.total_window_count);
    if (count === 0) return '';
    return `<div class="spk-status spk-status-info">${escapeHtml(COPY.SPK_OVERVIEW_QUALITY_UNREADABLE_WARNING)} (${escapeHtml(String(count))})</div>`;
  }

  function renderQualityPreBootstrap(data) {
    const ownerVoice = data.owner_voice || {};
    qualityPanel.innerHTML = `
      <strong>${escapeHtml(COPY.SPK_OVERVIEW_QUALITY_PREBOOTSTRAP)}</strong>
      <p class="spk-overview-muted">${escapeHtml(String(qualityCount(ownerVoice.evidence_count)))} ${escapeHtml(COPY.SPK_OVERVIEW_OWNER_PROGRESS_SUFFIX)}</p>
      <div class="spk-overview-actions">
        <a class="spk-overview-btn spk-overview-btn-primary" href="/app/speakers/${TODAY}">${escapeHtml(COPY.SPK_OVERVIEW_OWNER_HELP_LABEL)}</a>
      </div>
    `;
  }

  function renderQualityReady(data) {
    qualityPanel.innerHTML = `
      <strong>${escapeHtml(COPY.SPK_OVERVIEW_QUALITY_READY)}</strong>
      ${qualityWarning(data)}
      ${qualityRows(data)}
      ${qualityTeachingLine(data)}
    `;
  }

  function renderQuality(data) {
    const ownerVoice = data.owner_voice || {};
    if (ownerVoice.bootstrap_state === 'pre_bootstrap') {
      renderQualityPreBootstrap(data);
      return;
    }
    renderQualityReady(data);
  }

  function loadQuality(options) {
    const throwOnError = Boolean(options?.throwOnError);
    const requestSeq = qualityRequestSeq + 1;
    qualityRequestSeq = requestSeq;
    return fetch('/app/speakers/api/quality')
      .then((response) => response.json())
      .then((data) => {
        if (requestSeq !== qualityRequestSeq) return false;
        renderQuality(data);
        return true;
      })
      .catch((err) => {
        if (requestSeq !== qualityRequestSeq) return false;
        window.logError?.(err, { context: 'speakers-quality' });
        qualityPanel.innerHTML = window.SurfaceState.error({
          heading: COPY.SPK_OVERVIEW_QUALITY_ERROR_HEADING,
          desc: window.CONVEY_COPY.RELOAD_HINT,
          serverMessage: err?.serverMessage || err?.message || '',
          detail: err,
        });
        if (throwOnError) throw err;
        return false;
      });
  }

  function loadOwner() {
    fetch('/app/speakers/api/owner/status')
      .then((response) => response.json())
      .then((data) => {
        if (data.status === OWNER_STATUS_ROUTING.candidate) ownerCandidate(data);
        else if (data.status === OWNER_STATUS_ROUTING.confirmed) ownerConfirmed(data);
        else ownerNotReady(data);
      })
      .catch(ownerStatusError);
  }

  function renderKnown(data) {
    const speakers = data.speakers || [];
    if (speakers.length === 0) {
      knownContainer.innerHTML = `<div class="spk-overview-muted">${escapeHtml(COPY.SPK_OVERVIEW_KNOWN_VOICES_EMPTY)}</div>`;
      sortSelect.hidden = true;
      return;
    }
    sortSelect.hidden = false;
    const renderCard = (speaker) => {
      const href = `/app/speakers/${TODAY}?speaker=${encodeURIComponent(speaker.entity_id)}`;
      return `
        <a class="spk-known-card" href="${href}">
          <h3 class="spk-card-title">${escapeHtml(speaker.name || 'unlabeled voice')}</h3>
          <p class="spk-card-line">${escapeHtml(String(speaker.embedding_count || 0))} ${escapeHtml(pluralize(speaker.embedding_count || 0, 'sample'))} · ${escapeHtml(String(speaker.segment_count || 0))} ${escapeHtml(pluralize(speaker.segment_count || 0, 'segment'))}</p>
          <p class="spk-card-line">${escapeHtml(COPY.SPK_OVERVIEW_CARD_LAST_HEARD_PREFIX)}: ${relativeTime(speaker.last_seen_ts)}</p>
          ${cohesion(speaker.intra_cosine_p25)}
        </a>
      `;
    };
    // Placeholder identities ("Speaker 1", "Speaker 2", ...) are the voices
    // not yet named — they don't belong under "known voices". Keep them
    // reachable but out of the way, same pattern as the unlabeled discovery
    // clusters below.
    const named = speakers.filter((speaker) => !isPlaceholderSpeakerName(speaker.name));
    const unnamed = speakers.filter((speaker) => isPlaceholderSpeakerName(speaker.name));
    const wasOpen = knownContainer.querySelector('details')?.open || false;
    const emptyNotice = named.length === 0
      ? `<div class="spk-overview-muted">${escapeHtml(COPY.SPK_OVERVIEW_KNOWN_VOICES_EMPTY)}</div>`
      : '';
    const unnamedBlock = unnamed.length
      ? `<details ${wasOpen ? 'open' : ''}><summary>unlabeled voices (${unnamed.length})</summary>${unnamed.map(renderCard).join('')}</details>`
      : '';
    knownContainer.innerHTML = `${emptyNotice}<div class="spk-known-grid">${named.map(renderCard).join('')}${unnamedBlock}</div>`;
  }

  function loadKnown(options) {
    const throwOnError = Boolean(options?.throwOnError);
    const requestSeq = knownRequestSeq + 1;
    knownRequestSeq = requestSeq;
    const sort = sortSelect.value || COPY.SPK_OVERVIEW_KNOWN_VOICES_SORTS[0];
    return fetch(`/app/speakers/api/speakers/known?sort=${encodeURIComponent(sort)}`)
      .then((response) => response.json())
      .then((data) => {
        if (requestSeq !== knownRequestSeq) return false;
        renderKnown(data);
        return true;
      })
      .catch((err) => {
        if (requestSeq !== knownRequestSeq) return false;
        renderKnown({speakers: []});
        if (throwOnError) throw err;
        return false;
      });
  }

  function setupSort() {
    sortSelect.innerHTML = COPY.SPK_OVERVIEW_KNOWN_VOICES_SORTS.map((sort) => (
      `<option value="${escapeHtml(sort)}">${escapeHtml(sort)}</option>`
    )).join('');
    sortSelect.addEventListener('change', loadKnown);
  }

  function renderOverviewThisIsMeGuidance() {
    ownerPanel.replaceChildren();
    const line = document.createElement('p');
    line.className = 'spk-overview-muted';
    line.textContent = COPY.SPK_THIS_IS_ME_GUIDANCE || '';
    ownerPanel.appendChild(line);
  }

  function removeOverviewDiscoveryCluster(clusterId) {
    const card = discoveryContainer.querySelector(`[data-cluster-id="${clusterId}"]`);
    if (card) card.remove();
    if (!discoveryContainer.querySelector('.spk-discovery-card')) {
      discoverySection.hidden = !overviewDiscoveryNotice;
    }
  }

  async function refreshOverviewWhoIsThisContext() {
    await Promise.all([
      loadDiscovery({ throwOnError: true }),
      loadKnown({ throwOnError: true }),
      loadQuality({ throwOnError: true }),
    ]);
  }

  function ensureOverviewWhoIsThisSheet() {
    if (whoIsThisSheet) {
      whoIsThisSheet.setCopy(COPY);
      return whoIsThisSheet;
    }
    whoIsThisSheet = window.SpeakersWhoIsThis.init({
      mount: document.body,
      copy: COPY,
      context: window.SPEAKERS_CONTEXT || {},
      apiJson: window.apiJson,
      logError: window.logError,
      formatDateShort: window.formatDateShort,
      onThisIsMe: () => {
        renderOverviewThisIsMeGuidance();
        focusOverviewYourVoiceSection();
      },
      onIdentified: ({ clusterId }) => {
        removeOverviewDiscoveryCluster(clusterId);
        loadKnown();
        loadQuality();
      },
      onDismissed: ({ clusterId }) => {
        removeOverviewDiscoveryCluster(clusterId);
      },
      onFullyRestoredUndo: async () => {
        await refreshOverviewWhoIsThisContext();
      },
    });
    return whoIsThisSheet;
  }

  function openOverviewWhoIsThis(cluster, trigger, options) {
    if (options?.handoff) overviewHandoffSheetOpen = true;
    ensureOverviewWhoIsThisSheet().open({
      cluster,
      clusterId: cluster.cluster_id,
      trigger,
    });
  }

  function openOverviewDiscoveryCluster(clusterId, trigger, options) {
    const key = String(clusterId || '');
    const cluster = discoveryClustersById.get(key);
    if (!cluster) return false;
    openOverviewWhoIsThis(cluster, trigger || null, options);
    return true;
  }

  function hideStatementHandoffNotice() {
    statementHandoffNotice.hidden = true;
    statementHandoffNotice.textContent = '';
  }

  function showStatementHandoffNotice() {
    statementHandoffNotice.textContent = NOT_IN_NEW_VOICES_COPY;
    statementHandoffNotice.hidden = false;
    discoverySection.hidden = false;
  }

  function discoveryClusters(data) {
    return Array.isArray(data?.clusters) ? data.clusters : [];
  }

  function discoveryRefreshClusters(data, currentClusters) {
    const clusters = discoveryClusters(data);
    if (data?.status === 'degraded' && !clusters.length && currentClusters.length) {
      return currentClusters;
    }
    return clusters;
  }

  function discoveryIssueCount(issue) {
    const count = Number(issue?.count || 0);
    return Number.isFinite(count) ? count : 0;
  }

  function discoveryIssueMessage(issue) {
    const count = discoveryIssueCount(issue);
    if (count > 0 && COPY.SPK_DISCOVERY_DEGRADED_TEMPLATE) {
      return COPY.SPK_DISCOVERY_DEGRADED_TEMPLATE.replace('{count}', String(count));
    }
    return issue?.message || (COPY.SPK_DISCOVERY_DEGRADED_TEMPLATE || '').replace('{count}', String(count));
  }

  function discoveryNoticeFromScan(data) {
    const issues = Array.isArray(data?.issues) ? data.issues : [];
    if (data?.status !== 'degraded' || !issues.length) return null;
    return {
      type: 'degraded',
      messages: issues.map((issue) => discoveryIssueMessage(issue)).filter(Boolean),
      retry: false,
    };
  }

  function overviewDiscoveryErrorNotice() {
    return {
      type: 'error',
      messages: [COPY.SPK_DISCOVERY_ERROR || ''],
      retry: true,
    };
  }

  function renderOverviewDiscoveryNotice() {
    if (!overviewDiscoveryNotice) {
      overviewDiscoveryNoticeNode.hidden = true;
      overviewDiscoveryNoticeNode.innerHTML = '';
      return;
    }
    const statusClass = overviewDiscoveryNotice.type === 'error' ? 'spk-status-error' : 'spk-status-info';
    const retry = overviewDiscoveryNotice.retry
      ? `<button id="spkOverviewDiscoveryRetry" class="spk-discovery-retry" type="button">${escapeHtml(COPY.SPK_ACTION_RETRY || '')}</button>`
      : '';
    overviewDiscoveryNoticeNode.hidden = false;
    overviewDiscoveryNoticeNode.innerHTML = `
      <div class="spk-status ${statusClass} spk-discovery-notice" role="alert">
        <div class="spk-discovery-notice-text">
          ${(overviewDiscoveryNotice.messages || []).map((message) => `<div>${escapeHtml(message)}</div>`).join('')}
        </div>
        <div class="spk-discovery-notice-actions">
          ${retry}
          <button id="spkOverviewDiscoveryDismiss" class="spk-status-dismiss" type="button" aria-label="dismiss">&times;</button>
        </div>
      </div>
    `;
    document.getElementById('spkOverviewDiscoveryRetry')?.addEventListener('click', () => {
      refreshDiscoveryScan({ requestSeq: overviewDiscoveryRequestSeq + 1, throwOnError: false });
    });
    document.getElementById('spkOverviewDiscoveryDismiss')?.addEventListener('click', () => {
      overviewDiscoveryNotice = null;
      renderOverviewDiscoveryNotice();
      if (!discoveryContainer.querySelector('.spk-discovery-card') && statementHandoffNotice.hidden) {
        discoverySection.hidden = true;
      }
    });
  }

  function renderDiscovery(data) {
    const clusters = discoveryClusters(data);
    hideStatementHandoffNotice();
    renderOverviewDiscoveryNotice();
    discoveryClustersById = new Map(clusters.map((cluster) => [String(cluster.cluster_id), cluster]));
    if (!clusters.length) {
      discoveryContainer.innerHTML = '';
      discoverySection.hidden = !overviewDiscoveryNotice;
      return;
    }
    discoverySection.hidden = false;
    const renderCluster = (cluster) => `
      <div class="spk-discovery-card" data-cluster-id="${escapeHtml(cluster.cluster_id)}">
        <h3 class="spk-card-title">${escapeHtml(cluster.suggested_name || 'unlabeled voice')}</h3>
        <p class="spk-card-line">${escapeHtml(String(cluster.size || cluster.count || 0))} ${escapeHtml(pluralize(cluster.size || cluster.count || 0, 'sample'))}</p>
        <div class="spk-discovery-actions">
          <button type="button" class="spk-overview-btn spk-who-trigger" aria-haspopup="dialog" aria-expanded="false">${escapeHtml(COPY.SPK_ACTION_WHO_IS_THIS || '')}</button>
        </div>
      </div>
    `;
    const named = clusters.filter(cluster => String(cluster.suggested_name || '').trim());
    const unnamed = clusters.filter(cluster => !String(cluster.suggested_name || '').trim());
    const wasOpen = discoveryContainer.querySelector('details')?.open || false;
    discoveryContainer.innerHTML = named.map(renderCluster).join('') + (unnamed.length
      ? `<details ${wasOpen ? 'open' : ''}><summary>unlabeled voices (${unnamed.length})</summary>${unnamed.map(renderCluster).join('')}</details>` : '');
    discoveryContainer.querySelectorAll('.spk-discovery-card').forEach((card) => {
      const trigger = card.querySelector('.spk-who-trigger');
      const cluster = discoveryClustersById.get(card.dataset.clusterId);
      if (trigger && cluster) {
        trigger.addEventListener('click', () => openOverviewWhoIsThis(cluster, trigger));
      }
    });
  }

  function loadDiscovery(options) {
    const throwOnError = Boolean(options?.throwOnError);
    const requestSeq = overviewDiscoveryRequestSeq + 1;
    overviewDiscoveryRequestSeq = requestSeq;
    return window.apiJson('/app/speakers/api/discovery/cache', { cache: 'no-store' })
      .then((data) => {
        if (requestSeq !== overviewDiscoveryRequestSeq) return false;
        renderDiscovery(data);
        return true;
      })
      .catch((err) => {
        if (requestSeq !== overviewDiscoveryRequestSeq) return false;
        overviewDiscoveryNotice = overviewDiscoveryErrorNotice();
        renderOverviewDiscoveryNotice();
        discoverySection.hidden = false;
        if (throwOnError) throw err;
        return false;
      });
  }

  function refreshDiscoveryScan(options) {
    if (overviewHandoffSheetOpen || hasOverviewHandoff()) {
      return Promise.resolve(false);
    }
    const throwOnError = Boolean(options?.throwOnError);
    const requestSeq = options?.requestSeq || overviewDiscoveryRequestSeq + 1;
    overviewDiscoveryRequestSeq = requestSeq;
    return window.apiJson('/app/speakers/api/discovery/scan', { method: 'POST' })
      .then((data) => {
        if (requestSeq !== overviewDiscoveryRequestSeq) return false;
        if (overviewHandoffSheetOpen) return false;
        overviewDiscoveryNotice = discoveryNoticeFromScan(data);
        renderDiscovery({
          ...data,
          clusters: discoveryRefreshClusters(
            data,
            Array.from(discoveryClustersById.values()),
          ),
        });
        return true;
      })
      .catch((err) => {
        if (requestSeq !== overviewDiscoveryRequestSeq) return false;
        if (overviewHandoffSheetOpen) return false;
        overviewDiscoveryNotice = overviewDiscoveryErrorNotice();
        renderOverviewDiscoveryNotice();
        discoverySection.hidden = false;
        if (throwOnError) throw err;
        return false;
      });
  }

  function statementHandoffComplete(handoff) {
    return Boolean(
      handoff
      && handoff.day
      && handoff.stream
      && handoff.segmentKey
      && handoff.source
      && handoff.sentenceId
    );
  }

  function resolveStatementHandoff(handoff) {
    const params = new URLSearchParams({
      voice_day: handoff.day,
      voice_stream_layout: decodeSegmentLayout(handoff.streamLayout, true),
      voice_stream: handoff.stream,
      voice_segment_key: handoff.segmentKey,
      voice_source: handoff.source,
      voice_sentence_id: handoff.sentenceId,
    });
    return window.apiJson(`/app/speakers/api/discovery/resolve-statement?${params}`);
  }

  function hasOverviewHandoff() {
    const context = window.SPEAKERS_CONTEXT || {};
    return Boolean(
      context.voiceClusterId
      || statementHandoffComplete(context.statementHandoff || {})
    );
  }

  function openOverviewHandoffCluster(clusterId) {
    if (!openOverviewDiscoveryCluster(clusterId, null, {handoff: true})) {
      showStatementHandoffNotice();
      return false;
    }
    return true;
  }

  async function handleOverviewHandoff() {
    const context = window.SPEAKERS_CONTEXT || {};
    hideStatementHandoffNotice();
    if (context.voiceClusterId) {
      return openOverviewHandoffCluster(context.voiceClusterId);
    }
    const handoff = context.statementHandoff || {};
    if (!statementHandoffComplete(handoff)) return false;
    try {
      const result = await resolveStatementHandoff(handoff);
      if (result.status === 'hit') {
        return openOverviewHandoffCluster(result.cluster_id);
      }
      if (result.status === 'miss' || result.status === 'cache_unavailable') {
        showStatementHandoffNotice();
      }
    } catch (err) {
      window.logError?.(err, { context: 'speakers-statement-handoff' });
      showStatementHandoffNotice();
    }
    return false;
  }

  function hideDayGrid() {
    dayGridCard.hidden = true;
    mountedDayGridKey = null;
    if (window.DayGrid) {
      window.DayGrid.mount(dayGridHost, {
        data: null,
        mode: 'navigate',
        appPath: '/app/speakers',
        unit: dayGridUnit(),
      });
    } else {
      dayGridHost.replaceChildren();
    }
    dayGridLegend.replaceChildren();
  }

  function renderDayGrid(data) {
    if (!data || !window.DayGrid) {
      hideDayGrid();
      return;
    }

    const key = JSON.stringify(data);
    if (key === mountedDayGridKey) return;

    // Gate on activity, not the worklist. A caught-up journal has quiet real
    // days but still has enough speaker activity to make the grid useful.
    const gate = window.DayGrid.gate({
      coverage: data.coverage,
      days: data.activity || {},
      pending: {},
    }, { minSpanDays: 70, minActiveDays: 14 });
    if (!gate.ok) {
      hideDayGrid();
      return;
    }

    dayGridCard.hidden = false;
    window.DayGrid.mount(dayGridHost, {
      data,
      mode: 'navigate',
      appPath: '/app/speakers',
      unit: dayGridUnit(),
      activityUnit: dayGridActivityUnit(),
    });
    window.DayGrid.legend(dayGridLegend, {
      unit: dayGridUnit(),
      data,
    });
    mountedDayGridKey = key;
  }

  async function loadDayGrid() {
    try {
      const response = await fetch('/app/speakers/api/grid', {cache: 'no-store'});
      if (!response.ok) throw new Error('speaker grid failed');
      renderDayGrid(await response.json());
    } catch (_error) {
      hideDayGrid();
    }
  }

  function init() {
    setupSort();
    loadDayGrid();
    loadOwner();
    loadQuality();
    loadKnown();
    loadDiscovery().then(() => {
      return handleOverviewHandoff();
    }).then(() => {
      refreshDiscoveryScan();
    });
  }

  function renderOverviewStateError(err) {
    window.logError?.(err, { context: 'speakers-overview-state' });
    ownerPanel.innerHTML = window.SurfaceState.error({
      heading: "Couldn't load speakers",
      desc: window.CONVEY_COPY.RELOAD_HINT,
      serverMessage: err?.serverMessage || err?.message || '',
      detail: err,
      retry: true,
    });
    // The failure above covers the whole overview (its retry re-runs
    // startOverview, which repopulates these too) — don't leave the other
    // panels spinning on a load that will never resolve.
    qualityPanel.innerHTML = '';
    knownContainer.innerHTML = '';
    ownerPanel.querySelector('.surface-state-retry')?.addEventListener('click', () => {
      window.SPEAKERS_STATE_PROMISE = window.loadSpeakersState();
      startOverview();
    });
  }

  async function startOverview() {
    const context = window.SPEAKERS_CONTEXT || {};
    if (context.isDay) return;
    document.getElementById('speakersOverviewView').hidden = false;
    ownerPanel.innerHTML = window.SurfaceState.loading({ text: 'loading speakers...' });
    // These two panels otherwise sit blank (not a labeled loading state) for
    // as long as their own reads take, which can be well over ten seconds.
    qualityPanel.innerHTML = window.SurfaceState.loading({ text: 'loading voice quality...' });
    knownContainer.innerHTML = window.SurfaceState.loading({ text: 'loading known voices...' });
    sortSelect.hidden = true;
    try {
      const payload = await window.SPEAKERS_STATE_PROMISE;
      applyOverviewState(payload);
      init();
    } catch (err) {
      renderOverviewStateError(err);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startOverview);
  } else {
    startOverview();
  }
})();
</script>
