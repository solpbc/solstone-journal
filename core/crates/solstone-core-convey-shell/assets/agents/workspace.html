        view.querySelector('.toolbar')?.insertAdjacentHTML('afterbegin', `<div class="field"><label for="a-agent">${window.JournalI18n.renderHtml('journal.window.agents.field.label.agent')}</label><select id="a-agent"><option value="">${window.JournalI18n.renderHtml('journal.window.agents.option.label.all.agents')}</option>${state.connections.map(connection => `<option value="${esc(connection.key)}">${esc(connection.name)}${connection.memory_source ? ` · ${esc(String(connection.memory_source).slice(0, 4))}` : ''}</option>`).join('')}</select></div><div class="field"><label for="a-from">${window.JournalI18n.renderHtml('journal.window.agents.field.label.from')}</label><input id="a-from" type="date"></div><div class="field"><label for="a-to">${window.JournalI18n.renderHtml('journal.window.agents.field.label.to')}</label><input id="a-to" type="date"></div>`);
        for (const [key, value] of Object.entries(activityFilters)) document.getElementById(`a-${key}`).value = value;
        const agentFilter = document.getElementById('a-agent');
        agentFilter?.addEventListener('change', () => window.SolFocus.keepAfterPick(agentFilter, ctx));
      }
      if (window.JournalClock?.placeNote) {
        for (const el of view.querySelectorAll('[data-activity-heading]')) {
          window.JournalClock.placeNote(el, { inside: true });
        }
        for (const el of view.querySelectorAll('[data-request-list-heading]')) {
          window.JournalClock.placeNote(el, { inside: true });
        }
        if (route.name === 'activity') {
          const h1 = view.querySelector('h1');

        }
        for (const el of view.querySelectorAll('[data-expiry-time]')) {
          window.JournalClock.placeNote(el, { inside: false });
        }
        for (const el of view.querySelectorAll('[data-next-attempt]')) {
          window.JournalClock.placeNote(el, { inside: false });
        }
      }
      drawn = {html, first: view.firstChild, last: view.lastChild, count: view.childNodes.length};
      return true;
    }

    function enableViewKey(op) { const { elapsed_ms, ...stable } = op || {}; return JSON.stringify(stable); }
    function scheduleEnablePoll() { ctx.clearTimeout(enablePollTimer); enablePollTimer = ctx.setTimeout(pollEnable, 1500); }
    async function pollEnable() {
      try {
        const res = await api('/app/agents/api/enable');
        enableOp = res?.operation;
        if (!enableOp || enableOp.phase === 'enabled') { enableOp = null; lastEnableView = ''; await reload(true); return; }
        const shown = enableViewKey(enableOp);
        if (shown !== lastEnableView) { lastEnableView = shown; render(); }
        if (pending()) scheduleEnablePoll();
      } catch (_) {}
    }
    async function checkEnableOp() {
      try {
        const res = await api('/app/agents/api/enable');
        if (res?.operation && res.operation.phase !== 'enabled') { enableOp = res.operation; if (pending()) scheduleEnablePoll(); }
      } catch (_) {}
    }
    async function reload(quiet = false) {
      if (!quiet || !state) view.innerHTML = `<p class="lead">${window.JournalI18n.renderHtml('journal.window.agents.visible.text.loading.agents')}</p>`;
      // The first load asks for the state and the memory summary together; the page draws once both answer.
      const summary = quiet ? null : loadMemorySummary(true);
      try {
        state = await (quiet ? api('/app/agents/api/state') : ctx.read('/app/agents/api/state'));
        if (summary) await summary;
        else if (!memorySummary) await loadMemorySummary();
        if (state?.byo?.hostname && !byoCommands) {

        if (byoReady()) {

          }
        } else {
          byoOutsideChecked = false;
          byoOutsideResult = null;
        }
        if (relayAvailable() && !state.enabled && usesConsentFlow()) await checkEnableOp();
        else enableOp = null;
        render();
        reportAgentsReady('content');
      }
      catch (error) { errorPage(error.message || window.JournalI18n.render('journal.window.agents.status.text.the.journal.did.not.return.its')); reportAgentsReady('error'); }
    }
    async function applyActivityFilters(filters) {
      const params = new URLSearchParams();
      for (const [key, value] of Object.entries(filters)) {
        if (value) params.set(key === 'agent' ? 'connection' : key, key === 'from' || key === 'to' ? value.replaceAll('-', '') : value);
      }
      const result = await api(`/app/agents/api/activity${params.size ? `?${params}` : ''}`);
      activity = result;
      activityFilters = filters;
      route = {name: 'activity'};
      render();
    }
    async function loadActivity(connection = '') {
      try { await applyActivityFilters({outcome: '', tool: '', agent: connection, from: '', to: ''}); }
      catch (error) { notify(error.message || window.JournalI18n.render('journal.window.agents.status.text.activity.could.not.be.read')); }
    }
    async function turnOn() {
      lane = 'me';
      const meNext = ['A|data-solstone-outside|', 'switch|solstone.me'];
      if (!usesConsentFlow()) { await api('/app/agents/api/capability', jsonOptions('PUT', {enabled:true})); landing = meNext; await reload(true); return; }
      try {
        const start = await api('/app/agents/api/enable', jsonOptions('POST', {}));
        if (ctx.disposed) return;
        enableOp = start?.operation;
        if (enableOp?.portal_url) {
          window.solstoneOutside.openDelayed(enableOp.portal_url, 'noopener,noreferrer');
        }
        lastEnableView = enableViewKey(enableOp);
        landing = meNext;
        render();
        if (pending()) scheduleEnablePoll();
      } catch (e) {
        if (ctx.disposed) return;
        await checkEnableOp();
        if (enableOp) { lastEnableView = enableViewKey(enableOp); landing = meNext; render(); }
        else notify(e.message || window.JournalI18n.render('journal.window.agents.status.text.couldn.t.start.turning.on.solstone'));
      }
    }

    view.addEventListener('keydown', event => {
      if (event.key !== 'Escape' || event.defaultPrevented) return;
      const modal = view.querySelector('.modal');
      if (!modal) return;
      event.preventDefault();
      if (dialog) closeDialog();
      else modal.remove();
    });

    view.addEventListener('click', async event => {
      const target = event.target.closest('button,a,[data-close-modal]'); if (!target) return;
      // A control whose write is out ignores presses until it answers.
      if (SolFocus.isBusy(target)) { event.preventDefault(); return; }
      followLink = target.tagName === 'A' && /^\/app\/agents\/#memories\//.test(target.getAttribute('href') || '');
      if (target.dataset.closeModal !== undefined && (target === event.target || target.tagName === 'BUTTON')) { if (dialog) closeDialog(); else { pairingCode = null; target.closest('.modal')?.remove(); } return; }
      if (target.closest('.modal-card') === null && target.dataset.closeModal !== undefined) return;
      const action = target.dataset.action;
      if (target.dataset.lane) { lane = target.dataset.lane; render(); return; }
      if (target.dataset.way) { connectWay = target.dataset.way; pairingCode = null; stopWatch(); render(); return; }
      if (target.dataset.agent) { agentChoice = target.dataset.agent; render(); return; }
      if (target.dataset.moveByo) { dialogOpener = keyOf(target); const moving = (state.connections || []).find(c => String(c.id) === target.dataset.moveByo); const kind = Object.keys(AGENT_NAMES).find(k => AGENT_NAMES[k].toLowerCase() === String(moving?.name || '').toLowerCase()); stopWatch(); dialog = 'connect'; connectWay = 'byo'; agentChoice = kind || null; pairingCode = null; render(); return; }
      if (target.dataset.route) { event.preventDefault(); if (target.dataset.route === 'activity') await loadActivity(); else { route = {name: target.dataset.route}; if (route.name === 'home') await loadMemorySummary(); render(); } return; }
      if (target.dataset.memories) { await openMemories(target.dataset.memories); return; }
      if (target.dataset.memoriesRetry !== undefined) { const source = target.dataset.memoriesRetry || route.connection?.memory_source; if (source) await loadMemories(source); render(); return; }
      if (target.dataset.memoriesOlder) { await loadMemories(route.source, {more: true}); render(); return; }
      if (target.dataset.memoryOpen) { memoryOpen.add(target.dataset.memoryOpen); landing = [deleteKey(target.dataset.memoryOpen)]; render(); return; }
      if (target.dataset.memoryDelete) { memoryToDelete = memoryAt(target.dataset.memoryDelete); if (memoryToDelete) { dialogOpener = keyOf(target); openMemoryDeleteStep('move', '[data-memory-confirm]'); } return; }
      if (target.dataset.memoryEraseStep) { if (memoryToDelete) openMemoryDeleteStep('erase', '[data-memory-back]'); return; }
      if (target.dataset.memoryBack) { if (memoryToDelete) openMemoryDeleteStep('move', '[data-memory-erase-step]'); return; }
      if (target.dataset.memoryConfirm || target.dataset.memoryErase) {
        const memory = memoryToDelete; const erase = Boolean(target.dataset.memoryErase); memoryToDelete = null; dialog = null;
        // The memories around this one, as the page shows them, for where focus goes once it's gone.

        const at = memory ? places.indexOf(memoryPlace(memory)) : -1;
        const busy = keyOf(target);
        markBusy(busy, target, true);
        try { await deleteMemory(memory, erase, at >= 0 ? [places[at + 1], places[at - 1]] : []); }
        finally { markBusy(busy, target, false); }
        return;
      }
      if (target.dataset.activityConnection) { event.preventDefault(); await loadActivity(target.dataset.activityConnection); return; }
      if (target.dataset.connection) { event.preventDefault(); const [kind,id] = target.dataset.connection.split(':'); await openConnection(state.connections.find(item => item.kind === kind && item.id === id)); return; }
      if (target.dataset.copy) { await navigator.clipboard?.writeText(target.dataset.copy); target.textContent = window.JournalI18n.render('journal.window.agents.visible.text.copied'); drawn = null; return; }
      if (target.dataset.activityIndex) {
        const entry = activity.entries[Number(target.dataset.activityIndex)];
        view.insertAdjacentHTML('beforeend', activityDetail(entry));
        view.querySelector('.modal-card:last-of-type')?.insertAdjacentHTML('beforeend', targetLinks(entry));
        const reqTime = view.querySelector('.modal:last-of-type [data-request-time]');
        if (reqTime && window.JournalClock?.placeNote) {
          window.JournalClock.placeNote(reqTime, { inside: false });
        }
        return;
      }
      const busy = keyOf(target);
      markBusy(busy, target, true);
      try {
        if (action === 'reload' || action === 'refresh') await reload(true);
        else if (action === 'connect') { dialogOpener = keyOf(target); stopWatch(); againTarget = null; dialog = 'connect'; connectWay = null; pairingCode = null; render(); }
        else if (target.dataset.again) { dialogOpener = keyOf(target); const agent = target.dataset.again; const live = (state.connections || []).find(c => c.key === agent); const source = live ? live.memory_source : agent.slice('source:'.length); againTarget = {agent, name: live ? live.name : memoryAgentName(source), source}; const kind = Object.keys(AGENT_NAMES).find(k => AGENT_NAMES[k].toLowerCase() === String(againTarget.name).toLowerCase()); stopWatch(); dialog = 'connect'; connectWay = live && connectWays().some(([id]) => id === live.door) ? live.door : null; agentChoice = kind || null; pairingCode = null; render(); }
        else if (target.dataset.suggestionsSwitch) { const [kind, id] = target.dataset.suggestionsSwitch.split(':'); await api(`/app/agents/api/connections/${encodeURIComponent(kind)}/${encodeURIComponent(id)}/suggestions`, jsonOptions('PUT', {enabled: target.getAttribute('aria-checked') !== 'true'})); await reload(true); const found = state.connections.find(item => item.kind === kind && item.id === id); if (found) await openConnection(found); else { route = {name: 'home'}; render(); } }
        else if (target.dataset.pause) { const [kind, id] = target.dataset.pause.split(':'); await api(`/app/agents/api/connections/${encodeURIComponent(kind)}/${encodeURIComponent(id)}/pause`, jsonOptions('PUT', {paused: target.dataset.pausedTo === 'true'})); await reload(true); const found = state.connections.find(item => item.kind === kind && item.id === id); if (found) await openConnection(found); else { route = {name: 'home'}; render(); } }
        else if (action === 'open-connection' || action === 'open-activity') { const key = watch?.connection?.key; stopWatch(); pairingCode = null; dialog = null; await reload(true); if (action === 'open-activity') await loadActivity(key); else { const found = state.connections.find(item => item.key === key); route = found ? {name: 'connection', connection: found} : {name: 'home'}; render(); } }
        else if (action === 'me-off' || action === 'own-off' || action === 'lan-off') { dialogOpener = keyOf(target); dialog = action; render(); }
        else if (action === 'lan-on' || action === 'lan-door-off') { await api('/app/agents/api/lan-door', jsonOptions('PUT', {enabled: action === 'lan-on'})); dialog = null; if (action === 'lan-door-off') landing = [dialogOpener, 'switch|network']; await reload(true); }
        else if (action === 'own-on' || action === 'door-off') { await api('/app/agents/api/local-door', jsonOptions('PUT', {enabled: action === 'own-on'})); dialog = null; if (action === 'door-off') landing = [dialogOpener, 'switch|device']; await reload(true); }
        else if (action === 'byo-setup') { byoSetupOpen = true; render(); }
        else if (action === 'byo-save') { const hostname = document.getElementById('byo-hostname').value.trim(); if (!hostname) { notify(window.JournalI18n.render('journal.window.agents.status.text.enter.your.journal.s.address.first')); return; } if (state.byo?.hostname && state.byo.hostname !== hostname && !(await window.SolQuestion.ask({ message: window.JournalI18n.render('journal.window.agents.message.changing.your.journal.s.address.disconnects'), action: window.JournalI18n.render('journal.window.agents.window.state.text.change.address'), signal: ctx.signal, opener: () => findKey(view, busy) }))) return; if (ctx.disposed) return; await api('/app/agents/api/byo', jsonOptions('PUT', {hostname, enabled:false})); await api('/app/agents/api/byo/account', ownerOptions('POST')); await reload(true); }
        else if (action === 'byo-relay-save') { const address = document.getElementById('byo-relay-address').value.trim(); const port = parseInt(document.getElementById('byo-relay-port').value.trim(), 10) || 22; await api('/app/agents/api/byo/relay', jsonOptions('PUT', {address, port})); byoRelayCheck = null; await loadByoCommands(); await reload(true); }
        else if (action === 'byo-relay-check') { const res = await api('/app/agents/api/byo/relay/check', ownerOptions('POST')); byoRelayCheck = res?.code || null; render(); }
        else if (action === 'byo-relay-trust-again') { await api('/app/agents/api/byo/relay/trust-again', ownerOptions('POST')); byoRelayCheck = null; await reload(true); }
        else if (action === 'byo-dns-check') { byoDnsResult = await api('/app/agents/api/byo/dns-check', ownerOptions('POST')); render(); }
        else if (action === 'byo-outside-check') { const res = await api('/app/agents/api/byo/outside-check', ownerOptions('POST')); byoOutsideResult = res?.code || null; render(); }
        else if (action === 'byo-on' || action === 'byo-off') { await api('/app/agents/api/byo', jsonOptions('PUT', {enabled:action === 'byo-on'})); await reload(true); }
        else if (action === 'byo-remove') { if (!(await window.SolQuestion.ask({ message: window.JournalI18n.render('journal.window.agents.message.remove.your.journal.s.address.agents'), action: window.JournalI18n.render('journal.window.agents.window.state.text.remove.address'), signal: ctx.signal, opener: () => findKey(view, busy) }))) return; if (ctx.disposed) return; await api('/app/agents/api/byo', ownerOptions('DELETE')); byoRemovedMessage = window.JournalI18n.render('journal.window.agents.window.explanation.delete.the.a.record.at.your'); byoRelayCheck = null; byoDnsResult = null; byoOutsideResult = null; byoSetupOpen = false; landing = ['[data-byo-removed]']; await reload(true); }
        else if (action === 'byo-replace') { if (!(await window.SolQuestion.ask({ message: window.JournalI18n.render('journal.window.agents.message.replace.this.journal.s.certificate.registration'), action: window.JournalI18n.render('journal.window.agents.window.state.text.replace.registration'), signal: ctx.signal, opener: () => findKey(view, busy) }))) return; if (ctx.disposed) return; await api('/app/agents/api/byo/account/replace', ownerOptions('POST')); landing = ['[data-byo-step="dns"]']; await reload(true); }
        else if (action === 'turn-on') await turnOn();
        else if (action === 'turn-off') { await api('/app/agents/api/capability', jsonOptions('PUT', {enabled:false})); dialog = null; landing = [dialogOpener, 'switch|solstone.me']; await reload(true); }
        else if (action === 'dismiss-enable') { ctx.clearTimeout(enablePollTimer); enableOp = null; lastEnableView = ''; render(); }
        else if (action === 'sme-account-replace') { await api('/app/agents/api/solstone-me/account/replace', ownerOptions('POST')); await reload(true); }
        else if (action === 'dismiss-sme-replaced') { await api('/app/agents/api/solstone-me/account/notice/dismiss', ownerOptions('POST')); await reload(true); }
        else if (action === 'dismiss-replay') {
          const notices = (state.replay_notices || []).filter(notice => !notice.dismissed).map(notice => `BUTTON|data-action|dismiss-replay|${notice.id}`);
          const at = notices.indexOf(busy);
          await api('/app/agents/api/replay-notices/' + encodeURIComponent(target.dataset.notice) + '/dismiss', ownerOptions('POST'));
          landing = [notices[at + 1], notices[at - 1], '[data-agents-heading]'];
          await reload(true);
        }
        else if (action === 'new-code') { if (connectWay && connectWays().some(([id]) => id === connectWay)) { const known = await pairedBefore(); const res = await api('/app/agents/api/pairing', jsonOptions('POST', againTarget ? {door: connectWay, agent: againTarget.agent} : {door: connectWay})); pairingCode = res; state.pairing = {expires_at: res.expires_at, generation: res.generation, locked: false, door: res.door}; stopWatch(); render(); startWatch(res, known); } }
        else if (action === 'filter-activity') { const filters = Object.fromEntries(Object.keys(activityFilters).map(key => [key, document.getElementById(`a-${key}`).value])); await applyActivityFilters(filters); }
        else if (target.dataset.savePermission) { const [kind,id] = target.dataset.savePermission.split(':'); const categories = [...document.querySelectorAll('input[name=category]:checked')].map(node => node.value); const scope = document.getElementById('scope').value; const facets = [...document.querySelectorAll('input[name=facet]:checked')].map(node => node.value); await api(`/app/agents/api/connections/${encodeURIComponent(kind)}/${encodeURIComponent(id)}/permission`, jsonOptions('PUT', {categories, scope, facets})); route = {name:'home'}; await reload(true); }
        else if (target.dataset.revoke) { const [kind,id] = target.dataset.revoke.split(':'); if (await window.SolQuestion.ask({ message: window.JournalI18n.render('journal.window.agents.message.value1.what.it.already.read.stays', [['value1', String(kind === 'bearer' ? window.JournalI18n.render('journal.window.agents.window.state.text.revoke.this.key') : window.JournalI18n.render('journal.window.agents.window.state.text.disconnect.this.agent'))]]), action: kind === 'bearer' ? window.JournalI18n.render('journal.window.agents.window.state.text.revoke.key') : window.JournalI18n.render('journal.window.agents.window.state.text.disconnect.agent'), signal: ctx.signal, opener: () => findKey(view, busy) }) && !ctx.disposed) { const order = state.connections.map(item => rowKey(item.kind, item.id)); const at = order.indexOf(rowKey(kind, id)); await api(`/app/agents/api/connections/${encodeURIComponent(kind)}/${encodeURIComponent(id)}`, ownerOptions('DELETE')); landing = [order[at + 1], order[at - 1], '[data-agents-heading]']; route = {name:'home'}; await reload(true); } }
        else if (target.dataset.rename) { const id = target.dataset.rename; const name = await window.SolQuestion.ask({ message: window.JournalI18n.render('journal.window.agents.message.name.this.key'), action: window.JournalI18n.render('journal.window.agents.window.state.text.save.name'), value: route.connection.name, signal: ctx.signal, opener: () => findKey(view, busy) }); if (name && !ctx.disposed) { await api(`/app/agents/api/connections/bearer/${encodeURIComponent(id)}`, jsonOptions('PATCH', {name})); route = {name:'home'}; await reload(true); } }
      } catch (error) { notify(error.message || window.JournalI18n.render('journal.window.agents.status.text.that.change.did.not.finish')); }
      finally { markBusy(busy, target, false); }
    });
    // A back or forward onto one of this view's own entries closes an open dialog. The dialog
    // goes first and the layer is told a move closed it, so it neither pulls focus back into the
    // dialog nor hands it to an opener the draw has replaced; then focus goes to the page, as
    // every other back puts it.
    function closeDialogsForMove() {
      if (!view.querySelector('.modal')) return;
      const held = Boolean(view.querySelector('.modal')?.contains?.(document.activeElement));
      againTarget = null;
      stopWatch();
      pairingCode = null;
      dialog = null;
      for (const modal of view.querySelectorAll('.modal')) modal.remove();
      render();
      window.ConveyModalLayer?.reconcile?.({restore: false});
      if (held || SolFocus.focusLost(document)) document.getElementById('main-content')?.focus?.({preventScroll: true});
    }
    const ownPath = ctx.route?.pathname || window.location.pathname;
    ctx.on(window, 'popstate', () => { if (window.location.pathname === ownPath) closeDialogsForMove(); });
    agentsHooks = {recoverMemory};
    ctx.onDispose(() => {
      if (agentsHooks?.recoverMemory === recoverMemory) agentsHooks = null;
      // A dialog may have held the rest of the page inert.
      window.ConveyModalLayer?.reconcile?.();
    });
    reload().then(openMemoryFromAddress);
    ctx.on(window, 'hashchange', openMemoryFromAddress);
    // Paused while the page is hidden, read again on return.
    const every = (window.AppServices?.visibleInterval ? (fn, ms) => ctx.visibleInterval(fn, ms) : (fn, ms) => ctx.setInterval(fn, ms));
    every(() => {
      if (route.name !== 'home' || dialog) return;
      if (lane === 'byo' && state?.byo?.hostname && state?.byo?.account_uri && !byoReady()) {
        api('/app/agents/api/byo/dns-check', ownerOptions('POST')).then(res => { byoDnsResult = res; if (lane === 'byo' && !dialog) render(); }).catch(() => {});
      }
      if (pending()) pollEnable();
      else if ((state?.enabled && state?.status !== 'on') || (state?.local_door && !state.local_door.listening) || state?.lan_door?.enabled || state?.byo?.enabled) reload(true);
    }, 20000);
  }

  window.SolViews.register('agents', { mount: mountAgents });
})();
