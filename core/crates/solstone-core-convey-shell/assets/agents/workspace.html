<main class="agents" id="agents-root" tabindex="-1">
  <div id="agents-view" aria-live="polite"><p class="lead">loading agents…</p></div>
</main>

<script>
(() => {
  'use strict';
  const view = document.getElementById('agents-view');
  const esc = value => window.AppServices.escapeHtml(String(value ?? ''));
  const PORTAL = 'https://services.solstone.app/services/solstone-me';
  const LOCAL_DOOR_ADDRESS = 'http://127.0.0.1:7659/mcp';
  let state = null;
  let enableOp = null;
  let enablePollTimer = null;
  let lastEnableView = '';
  let route = {name: 'home'};
  let lane = null;
  let dialog = null;
  let activity = null;
  let pairingCode = null;
  let connectWay = null;
  let identity = null;

  async function api(path, options) { return window.apiJson(path, options); }
  function jsonOptions(method, body) { return {method, headers:{'content-type':'application/json'}, body:JSON.stringify(body)}; }
  function ownerOptions(method) { return {method}; }
  function notify(message) { window.AppServices?.notifications?.show?.({title:'agents', body:message}); }
  // A journal that serves agents on this computer reports local_door; one that doesn't, doesn't.
  function hasDoor() { return Boolean(state?.local_door); }
  function doorAddress() { return state?.local_door?.address || LOCAL_DOOR_ADDRESS; }
  // A journal that serves agents on your network reports lan_door; one that doesn't, doesn't.
  function hasLan() { return Boolean(state?.lan_door); }
  function lanAddresses() { return Array.isArray(state?.lan_door?.addresses) ? state.lan_door.addresses : []; }
  function lanOpen() { return lanAddresses().filter(address => address.listening); }
  function lanTaken() { return lanAddresses().filter(address => address.reason === 'port_in_use'); }
  function fingerprint() { return String(state?.lan_door?.fingerprint || '').replaceAll(':', ' '); }
  function meAddress() { return state?.owner_state?.address || state?.certificate?.hostname || ''; }
  function meEndpoint() { return `https://${meAddress()}/mcp`; }
  function byoEndpoint() { return `https://${state?.byo?.hostname}/mcp`; }
  function byoReady() { return Boolean(state?.byo?.enabled && state?.byo?.socket_listening && state?.byo?.certificate_active); }
  function pending() { return Boolean(enableOp && (enableOp.phase === 'waiting' || enableOp.phase === 'starting')); }
  function usesConsentFlow() { return !state.owner_state?.address || state.owner_state?.status === 'not_accepted'; }
  function frame(title, lead, body) { return `<h1>${esc(title)}</h1>${lead ? `<p class="lead">${lead}</p>` : ''}${body}`; }
  function errorPage(message) { view.innerHTML = frame('agents could not open.', `<span class="error notice">${esc(message)}</span>`, `<button class="btn" data-action="reload">try again</button>`); }
  function laneChip(connection) {
    if (connection.kind !== 'oauth') return '';
    const label = connection.door === 'byo' ? 'your hostname' : connection.door === 'lan' ? 'your network' : connection.door === 'local' ? 'this computer' : connection.door === 'relay' || !hasDoor() ? 'solstone.me' : '';
    return label ? `<span class="chip">${label}</span>` : '';
  }
  function permissionLine(permission) {
    const read = permission?.read;
    if (!read) return 'nothing until you choose';
    const categories = read.categories.join(', ');
    return read.scope.kind === 'whole_journal' ? `${categories} across your whole journal` : `${categories} in ${read.scope.ids.length} chosen facet${read.scope.ids.length === 1 ? '' : 's'}`;
  }
  function connectionKind(connection) { return connection.kind === 'oauth' ? 'paired in your browser' : 'a key you created'; }
  function connectionAccessCopy(connection) { return connection.kind === 'oauth' ? 'paired in your browser. it can read what it may see until you disconnect it.' : 'a key you created. anyone holding it can read what it may see until you revoke it.'; }
  function lastRequestCopy(connection, separator = ' · ') { if (!connection.last_request_at) return ''; return `${separator}${connection.activity_complete ? 'last' : 'latest found'} ${esc(new Date(connection.last_request_at).toLocaleString())}`; }
  const categoryGloss = {
    transcripts: 'what was said in your recordings and imports, as text. never the audio or the screen frames themselves.',
    entities: 'the people, places and projects your journal knows, and what it has noted about them.',
    facets: 'the shape of your journal: facet names and descriptions, and the activities, events and summaries filed in them.',
  };

  function markUnit() {
    if (identity?.generic) {
      const chip = (color, turn) => `<span class="mark-generic"${turn ? ' style="transform:rotate(45deg)"' : ''}><svg viewBox="0 0 48 48" width="48" height="48" aria-hidden="true"><rect x="1" y="1" width="46" height="46" rx="12" ry="12" fill="${color}" fill-opacity="0.07" stroke="${color}" stroke-width="2" stroke-dasharray="5.7 4.3"/></svg></span>`;
      return `<div class="journal-mark" role="img" aria-label="your journal, not set up yet"><span class="mark-chips">${chip('var(--orange)', false)}${chip('var(--gold)', true)}</span><span class="mark-words">your<span class="sep">·</span>journal</span></div>`;
    }
    const spec = identity?.mark;
    const icons = spec ? [spec.icon1, spec.icon2] : [];
    const words = Array.isArray(spec?.words) ? spec.words : [];
    if (icons.length !== 2 || !icons.every(icon => icon?.svg && icon?.color?.hex) || words.length !== 2) return '';
    const chip = icon => `<span class="mark-chip" style="border-color:${esc(icon.color.hex)};background:${esc(icon.color.hex)}1f${icon.rot === 45 ? ';transform:rotate(45deg)' : ''}"><svg viewBox="0 0 24 24" fill="none" stroke="${esc(icon.color.hex)}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icon.svg}</svg></span>`;
    return `<div class="journal-mark" role="img" aria-label="${esc(`${icons[0].color.name}, ${icons[1].color.name} · ${words[0]} ${words[1]}`)}"><span class="mark-chips">${chip(icons[0])}${chip(icons[1])}</span><span class="mark-words">${esc(words[0])}<span class="sep">·</span>${esc(words[1])}</span></div>`;
  }

  // ---- your own: agents on this computer --------------------------------------------------------
  function ownState() {
    if (!hasDoor()) return 'soon';
    const door = state.local_door;
    if (door.listening) return 'on';
    if (door.reason === 'config_invalid') return 'invalid';
    if (door.enabled === false) return 'off';
    if (door.reason === 'port_in_use') return 'port';
    if (door.reason === 'config_unreadable') return 'unreadable';
    return 'down';
  }
  function localTag() {
    return {on:['on','on'], off:['','off'], invalid:['warn','needs attention'], port:['bad','needs attention'], unreadable:['warn','needs attention'], down:['warn','not running'], soon:['','coming later']}[ownState()];
  }
  function ownTag() {
    if (!hasLan()) return localTag();
    const own = ownState(), lan = lanState();
    if (own === 'port' || lan === 'port' || lanTaken().length) return ['bad','needs attention'];
    if (['invalid','unreadable','tls','bindfail','enum'].includes(lan)) return ['warn','needs attention'];
    const local = localTag();
    if (local[1] === 'needs attention') return local;
    if (own === 'on' || ['on','noaddr','retrying'].includes(lan)) return ['on','on'];
    if (own === 'down' || lan === 'down') return ['warn','not running'];
    return ['','off'];
  }
  function sw(on, label, action) { return `<button class="sw${on ? '' : ' off'}" role="switch" aria-checked="${on}" aria-label="${label}" data-action="${action}"><i></i></button>`; }
  function ownBody() {
    const own = ownState();
    const body = inner => `<div class="lane-body">${inner}${hasLan() ? lanBlock() : ''}</div>`;
    if (own === 'soon') return body(`<p class="note">this isn't available in this version of your journal yet.</p>`);
    const address = `<dl class="lane-row"><dt>address</dt><dd><code>${esc(doorAddress())}</code><button class="btn sm" data-copy="${esc(doorAddress())}">copy</button></dd></dl>`;
    const row = (sub, on) => `<div class="onoff"><div><p class="onlab">agents on this computer</p><p class="onsub">${sub}</p></div>${sw(on, 'agents on this computer', on ? 'own-off' : 'own-on')}</div>`;
    const check = '<div class="hand"><button class="btn" data-action="refresh">check again</button></div>';
    if (own === 'off') return body(`${row('off', false)}<p class="note">agents on this computer can't reach your journal. the ones you connected are kept, with what each may see, for when you turn this back on.</p>`);
    if (own === 'invalid') return body(`${row("off until your journal's settings are fixed", false)}<p class="note">your journal's settings file has a value for this that it doesn't understand, so it keeps agents on this computer out. turning this on replaces that value.</p>`);
    if (own === 'unreadable') return body(`${row("your journal can't read its settings", true)}<div class="notice"><p>until it can, this stays as it was, and right now agents on this computer can't reach your journal. your connected agents and what each may see don't change.</p></div>${check}`);
    if (own === 'port') { const mark = markUnit(); return body(`${row('on, but something else has the address', true)}${address}<div class="notice error"><p><strong>something else is using this address.</strong> an agent that uses it reaches whatever is there, not your journal. that may be a journal under another login on this computer, or a program pretending to be your journal.</p>${mark ? `<p>before you enter a pairing code, check the page asking for it shows your journal's mark:</p>${mark}<p>if it shows a different mark, or none, close that page.</p>` : `<p>before you enter a pairing code, check the page asking for it shows your journal's mark. if it doesn't, close that page.</p>`}</div>${check}`); }
    if (own === 'down') return body(`${row('on, not running right now', true)}${address}<div class="notice"><p>the part of your journal that serves agents isn't running, so agents on this computer can't reach it.</p></div>${check}`);
    return body(`${row('on', true)}${address}<p class="note">any agent running on this computer can use this address. it reads nothing until you connect it with a pairing code and choose what it may see.</p>`);
  }

  // ---- your own: agents on your network ----------------------------------------------------------
  function lanState() {
    const door = state.lan_door;
    if (door.listening) return 'on';
    if (door.reason === 'config_invalid') return 'invalid';
    if (door.reason === 'config_unreadable') return 'unreadable';
    if (door.enabled === false) return 'off';
    return {no_address:'noaddr', enumeration_failed:'enum', tls_unavailable:'tls', port_in_use:'port', bind_failed:'bindfail', retrying:'retrying'}[door.reason] || 'down';
  }
  function lanBlock() {
    const lan = lanState();
    const row = (sub, on) => `<div class="onoff"><div><p class="onlab">agents on your network</p><p class="onsub">${sub}</p></div>${sw(on, 'agents on your network', on ? 'lan-off' : 'lan-on')}</div>`;
    const check = '<div class="hand"><button class="btn" data-action="refresh">check again</button></div>';
    const addrTag = {port_in_use:['bad','something else is using it'], bind_failed:['warn',"couldn't open"], tls_unavailable:['warn',"couldn't open"], retrying:['warn','reopening']};
    const addrRow = address => {
      if (address.listening) return `<dl class="lane-row"><dt>address</dt><dd><code>${esc(address.url)}</code><button class="btn sm" data-copy="${esc(address.url)}">copy</button></dd></dl>`;
      const [cls, text] = addrTag[address.reason] || ['', 'opening'];
      return `<dl class="lane-row"><dt>address</dt><dd><code>${esc(address.url)}</code><span class="tag ${cls}">${text}</span></dd></dl>`;
    };
    const addresses = lanAddresses().map(addrRow).join('');
    const taken = lanTaken().map(address => address.url);
    const takenNotice = taken.length === 1 && lan === 'on'
      ? `<div class="notice error"><p>something else on this computer is using ${esc(taken[0])}. an agent that uses that address reaches whatever is there, not your journal. that may be a journal under another login on this computer, or a program pretending to be your journal. until this clears, don't enter a pairing code on a page opened through ${esc(taken[0])}, and close any that is open.</p></div>`
      : taken.length ? `<div class="notice error"><p>something else on this computer is using ${taken.length === 1 ? 'this address' : 'these addresses'}. an agent that uses one reaches whatever is there, not your journal. that may be a journal under another login on this computer, or a program pretending to be your journal. until this clears, don't enter a pairing code on a page opened through ${taken.map(esc).join(' or ')}. if one is open, close it.</p></div>` : '';
    const caFingerprint = String(state?.lan_door?.ca_fingerprint || '').replaceAll(':', ' ');
    const trust = caFingerprint ? `<details><summary>let an agent on your network verify these addresses</summary><p>download your journal's public LAN CA certificate here, then move that file to the computer running your agent. before trusting it there, check its SHA-256 fingerprint against this one:</p><p><code class="fp">${esc(caFingerprint)}</code></p><p><a class="link" href="/app/agents/api/lan-door/ca.pem" download="solstone-lan-ca.pem">download the public CA certificate →</a></p><p>when starting Claude Code, set <code>NODE_EXTRA_CA_CERTS</code> to that file. for Codex CLI, set <code>CODEX_CA_CERTIFICATE</code> to it. keep TLS verification on. use these settings only for the agent that needs this address: it will trust any certificate your journal's CA signs. these settings do not make your browser trust the CA. if this computer's network address changes, use its new address; the same CA signs its new certificate.</p></details>` : '';
    const fp = fingerprint() ? `<details><summary>certificate fingerprint</summary><p>your journal's certificate for these addresses has this SHA-256 fingerprint:</p><p><code class="fp">${esc(fingerprint())}</code></p></details>` : '';
    const about = `<details><summary>about these addresses</summary><p>these addresses can change when this computer joins a network again. if one does, give your agent the new one. you may need to connect it again with a new pairing code.</p><p>any device on a network this computer is on can reach them, including other people on a café's or hotel's wifi, or a VPN service's other customers, but not the wider internet.</p><p>if another computer can't reach them, check whether this computer's firewall is blocking incoming connections.</p></details>`;
    const lanAgents = state.connections.some(connection => connection.kind === 'oauth' && connection.door === 'lan');
    let inner;
    if (lan === 'off') {
      const preview = lanAddresses().length ? `<p class="note">when it's on, agents use one of these addresses:</p><div class="addr-preview">${lanAddresses().map(address => `<dl class="lane-row"><dt>address</dt><dd><code>${esc(address.url)}</code></dd></dl>`).join('')}</div>` : '';
      inner = `${row('off', false)}<p class="note">turn this on for agents on other computers on your wifi or VPN, like Tailscale. while it's on, any device on a network this computer is on can reach its addresses, including on a café's or hotel's wifi. an agent reads nothing until you connect it with a pairing code and choose what it may see.${lanAgents ? ' the ones you connected this way are kept, with what each may see, for when you turn this back on.' : ''}</p>${preview}`;
    } else if (lan === 'on') {
      inner = `${row('on', true)}${addresses}${takenNotice}<p class="note">agents on other computers on your wifi or VPN can use these addresses. use the one on the same network as that computer. an agent reads nothing until you connect it with a pairing code and choose what it may see.</p><p class="note">a key you created doesn't work at these addresses, so don't give one to an agent on your network.</p>${trust}${fp}${about}`;
    } else if (lan === 'invalid') {
      inner = `${row("off until your journal's settings are fixed", false)}<p class="note">your journal's settings file has a value for this that it doesn't understand, so it keeps this off. turning this on replaces that value.</p>`;
    } else if (lan === 'unreadable') {
      inner = `${row("your journal can't read its settings", true)}<div class="notice"><p>until it can, these addresses stay closed. your connected agents and what each may see don't change.</p></div>${check}`;
    } else if (lan === 'noaddr') {
      inner = `${row("on, but this computer isn't on a network your journal can use", true)}<p class="note">this computer has no local network or VPN address your journal can use right now. your journal uses local network and VPN addresses only, not public ones or a cable plugged straight between two computers. it opens its addresses on its own when this computer joins a network it can use.</p>`;
    } else if (lan === 'enum') {
      inner = `${row("on, but your journal can't read this computer's addresses", true)}<div class="notice"><p>your journal can't read this computer's network addresses right now, so it hasn't opened any. it keeps trying on its own.</p></div>${check}`;
    } else if (lan === 'tls') {
      inner = `${row("on, but your journal's certificate isn't ready", true)}${addresses}<div class="notice"><p>your journal can't read or make the certificate for these addresses, so it hasn't opened them. it keeps trying on its own.</p></div>${check}`;
    } else if (lan === 'port') {
      inner = `${row(`on, but something else has ${lanAddresses().length > 1 ? "one of your journal's addresses" : 'the address'}`, true)}${addresses}${takenNotice}${check}`;
    } else if (lan === 'bindfail') {
      inner = `${row("on, but your journal couldn't open its addresses", true)}${addresses}<div class="notice"><p>your journal couldn't open its addresses on your network. it keeps trying on its own.</p></div>${check}`;
    } else if (lan === 'retrying') {
      inner = `${row("on, reopening your journal's addresses", true)}${addresses}<div class="notice"><p>your journal is reopening its addresses on your network.</p></div>${check}`;
    } else {
      inner = `${row('on, not running right now', true)}<div class="notice"><p>the part of your journal that serves agents isn't running, so these addresses are closed.</p></div>${check}`;
    }
    return `<div class="door-lan">${inner}</div>`;
  }

  // ---- your hostname: a raw public route that ends TLS in this journal ---------------------------
  function byoTag() {
    const b = state?.byo;
    if (!b?.hostname) return ['', 'not set up'];
    if (!b.enabled) return ['', 'off'];
    if (byoReady()) return ['on', 'ready here'];
    return ['warn', 'needs setup'];
  }
  function byoBody() {
    const b = state?.byo;
    if (!b) return '<div class="lane-body"><p class="note">this isn\'t available in this version of your journal yet.</p></div>';
    const host = b.hostname || '';
    const caa = b.account_uri ? `0 issue "letsencrypt.org; accounturi=${b.account_uri}; validationmethods=tls-alpn-01"` : '';
    const action = {
      set_hostname:'set your hostname', register_account:'register this journal with the certificate authority',
      account_key_lost:'replace the certificate registration and publish its new CAA record', publish_caa:'check the A/AAAA and CAA records',
      enable:'turn on this route', socket_blocked:'clear the socket problem',
      issue_certificate:'wait for the certificate; it comes through your public route', none:'check reachability from your agent',
    }[b.next_action] || 'check the setup';
    const setup = `<div class="field"><label for="byo-hostname">your public hostname</label><input id="byo-hostname" autocomplete="off" spellcheck="false" placeholder="journal.example.com" value="${esc(host)}"></div><div class="button-row"><button class="btn" data-action="byo-save">save hostname</button>${host ? '<button class="btn danger" data-action="byo-remove">remove hostname</button>' : ''}</div>`;
    if (!host) return `<div class="lane-body byo-setup"><p class="note">use a public DNS name you control. your journal serves HTTPS through a connection you set up. once your public route is reachable, anyone on the internet can reach its address, but an agent reads nothing until you pair it. the certificate puts your hostname in public certificate logs permanently. a tunnel that ends HTTPS can read your agent's traffic and reuse its credential to reach your journal. for agents on this computer or your network, use "your own" above.</p>${setup}</div>`;
    const register = b.account_uri ? '' : `<p class="note">register this journal with Let's Encrypt before you publish CAA. the private key for that registration stays in your journal.</p><div class="button-row"><button class="btn primary" data-action="byo-register">register with Let's Encrypt</button></div>`;
    const dns = b.account_uri ? `<dl class="lane-row"><dt>certificate registration</dt><dd><code>${esc(b.account_uri)}</code></dd></dl><p class="note">publish a direct A or AAAA record for this hostname, with no CNAME. publish this exact CAA issue record at the hostname or the nearest parent domain that has CAA records, with no other issue permission:</p><p><code>${esc(caa)}</code> <button class="btn sm" data-copy="${esc(caa)}">copy</button></p><p class="note">keep control of the hostname, its DNS and this certificate registration. CAA restricts new certificates; it does not cancel one issued before you published it. someone who changes your DNS can take over this address between your journal's checks.</p>` : '';
    const socket = b.account_uri ? `<p class="note">on a public server you control, forward TCP port 443 through OpenSSH to this socket on your journal computer. keep the encrypted bytes intact; do not set up HTTPS termination in the forwarder.</p><dl class="lane-row"><dt>local socket</dt><dd><code>${esc(b.socket_path)}</code><button class="btn sm" data-copy="${esc(b.socket_path)}">copy</button></dd></dl><p class="note">the SSH process must run under the same login as your journal to reach this socket. keep this public server and your journal's folder under your control. someone who can read the folder and redirect this address can impersonate your journal.</p>` : '';
    const dnsResult = {
      unchecked:'not checked', admitted:'verified', cname:'remove the CNAME', no_address:'add a direct A or AAAA record',
      caa_missing:'add the CAA record', issuewild:'remove wildcard issuance', extra_issue:'remove extra certificate issuers',
      other_ca:'allow only your specified certificate authority', account_uri:'the registration in CAA does not match this journal',
      validation_method:'CAA must allow only TLS-ALPN-01', lookup_error:'DNS could not be checked', lookup_timeout:'DNS check timed out',
    }[b.dns_verdict] || 'not checked';
    const status = `<dl class="lane-row"><dt>DNS policy</dt><dd>${esc(dnsResult)}</dd></dl><dl class="lane-row"><dt>socket</dt><dd>${b.socket_listening ? 'listening here' : 'closed here'}</dd></dl><dl class="lane-row"><dt>certificate</dt><dd>${b.certificate_active ? 'active here' : 'not active'}</dd></dl><p class="note"><strong>next:</strong> ${esc(action)}. these checks cannot show whether the public route reaches this journal; test from the agent's network.</p>`;
    const toggle = b.enabled ? '<button class="btn danger" data-action="byo-off">turn off public route</button>' : b.account_uri ? '<button class="btn primary" data-action="byo-on">turn on public route</button>' : '';
    const ready = byoReady() ? `<dl class="lane-row"><dt>agent URL</dt><dd><code>${esc(byoEndpoint())}</code><button class="btn sm" data-copy="${esc(byoEndpoint())}">copy</button></dd></dl>` : '';
    const replace = b.next_action === 'account_key_lost' ? '<button class="btn danger" data-action="byo-replace">replace certificate registration</button>' : '';
    return `<div class="lane-body byo-setup"><p class="note">to use this address without sol pbc's relay, set up your own public server, DNS and OpenSSH. when the route is ready, your journal presents the certificate and opens the encrypted requests. once your public route is reachable, anyone on the internet can reach its address, but an agent reads nothing until you pair it. the certificate puts your hostname in public certificate logs permanently. a tunnel that ends HTTPS can read your agent's traffic and reuse its credential to reach your journal.</p>${setup}${register}${dns}${socket}${status}${ready}<div class="button-row">${toggle}${replace}</div></div>`;
  }

  // ---- solstone.me: agents anywhere, operated by sol pbc ------------------------------------------
  function meState() {
    if (pending()) return 'approve';
    if (enableOp?.phase === 'needs_subscription') return 'notyet';
    if (enableOp?.phase === 'error' || enableOp?.phase === 'revoked') return 'failed';
    if (!state.enabled) return state.owner_state?.address ? 'turnedoff' : 'off';
    if (state.status === 'on') return 'on';
    if (state.status === 'offline' || state.status === 'failed') return 'offline';
    if (state.status === 'renewal_overdue') return 'renewal';
    if (state.status === 'needs_subscription') return 'lapsed';
    if (state.status === 'not_accepted') return 'refused';
    return 'turning';
  }
  function meTag() {
    return {off:['','off'], turnedoff:['','off'], approve:['warn','setting up'], notyet:['warn','not on yet'], failed:['warn','not on yet'], on:['on','on'], offline:['warn','offline'], renewal:['warn','needs attention'], lapsed:['warn','not on'], refused:['warn','needs attention'], turning:['warn','turning on']}[meState()];
  }
  function meBody() {
    const me = meState();
    const row = (sub, on) => `<div class="onoff"><div><p class="onlab">solstone.me</p><p class="onsub">${sub}</p></div>${sw(on, 'solstone.me', on ? 'me-off' : 'turn-on')}</div>`;
    const address = `<dl class="lane-row"><dt>address</dt><dd><code>${esc(meEndpoint())}</code><button class="btn sm" data-copy="${esc(meEndpoint())}">copy</button></dd></dl>`;
    const about = `<details><summary>about this address</summary><p>eight random characters with nothing of yours in them. because the address gets a real certificate, it is written into public certificate logs. that record is permanent: it stays even if you turn solstone.me off, and it shows that an address existed, not whose.</p></details>`;
    const relay = "requests stay encrypted until your journal opens them; the solstone.me relay forwards the encrypted bytes. sol pbc sees network addresses, timing, and volume. because sol pbc controls the public address and route, it could get another valid certificate, redirect the route, and read your agent's traffic while it's redirected. it could reuse a credential it saw that way until you disconnect that agent.";
    const portal = url => `<div class="hand"><a class="link" href="${esc(url || PORTAL)}" target="_blank" rel="noopener">manage solstone.me in the services portal →</a></div>`;
    const next = state.owner_state?.next_attempt_at ? ` next check: ${esc(new Date(state.owner_state.next_attempt_at).toLocaleString())}.` : '';
    if (me === 'off') return `<div class="lane-body"><ul class="trust"><li>${relay}</li><li>the address is eight random characters with nothing of yours in them. because it gets a real certificate, it is written into public certificate logs. that record is permanent, and it shows that an address existed, not whose.</li></ul><div class="hand"><button class="btn primary" data-action="turn-on">set up solstone.me →</button><span class="meta">you approve it in the services portal, then it turns on here.</span></div></div>`;
    if (me === 'turnedoff') return `<div class="lane-body">${row('off', false)}<p class="note">agents connected through solstone.me can't reach your journal while it's off. the address and your agents are kept: turning back on uses the same address, with no new certificate.</p>${about}</div>`;
    if (me === 'approve') return `<div class="lane-body">${row('setting up', false)}<p class="note">waiting for you to approve solstone.me in the services portal. the request stays open for about fifteen minutes.</p><div class="hand">${enableOp?.portal_url ? `<a class="btn primary" href="${esc(enableOp.portal_url)}" target="_blank" rel="noopener">continue to approve →</a>` : ''}</div></div>`;
    if (me === 'notyet') return `<div class="lane-body">${row('not on yet', false)}<div class="notice"><p>${esc(enableOp.guidance || "solstone.me isn't on yet. finish turning it on in the services portal, then turn it on here again.")}</p></div><div class="hand"><a class="btn primary" href="${esc(enableOp.subscribe_url || PORTAL)}" target="_blank" rel="noopener">open the services portal</a><button class="btn" data-action="dismiss-enable">not now</button></div></div>`;
    if (me === 'failed') return `<div class="lane-body">${row('not on yet', false)}<div class="notice error"><p>${esc(enableOp.guidance || "couldn't finish turning on solstone.me. try again.")}</p></div><div class="hand"><button class="btn primary" data-action="turn-on">try again</button><button class="btn" data-action="dismiss-enable">not now</button></div></div>`;
    if (me === 'turning') {
      const owner = state.owner_state || {};
      const legs = [['getting your journal its address', owner.address_leg || 'in_progress'], ["getting a certificate for it. its key never leaves this computer.", owner.certificate_leg || 'waiting'], ['connecting to the relay', owner.relay_leg || 'waiting']];
      return `<div class="lane-body">${row('turning on', true)}<ol class="legs">${legs.map(([title, leg], i) => `<li class="${leg === 'done' ? 'done' : ''}"><span class="step">${leg === 'done' ? '✓' : i + 1}</span><span>${title}</span><span class="meta">${esc(leg.replaceAll('_', ' '))}</span></li>`).join('')}</ol>${owner.certificate_leg === 'not_this_week' ? `<div class="notice"><p>certificates are rationed each week, and this week's have run out. your journal tries again on its own.${next}</p></div>` : ''}<p class="note">your journal does this itself. you can leave this page.</p></div>`;
    }
    if (me === 'offline') return `<div class="lane-body">${row('on, not reaching it right now', true)}${address}<div class="notice"><p>this computer isn't reaching solstone.me right now, so agents can't reach your journal through it. your journal keeps trying on its own.</p></div>${about}</div>`;
    if (me === 'renewal') return `<div class="lane-body">${row('on, certificate renewal overdue', true)}${address}<div class="notice"><p>the address's certificate is past its renewal window and its renewal hasn't gone through yet. your journal keeps trying on its own. if the certificate expires first, agents will see a warning from their side.</p></div>${about}</div>`;
    if (me === 'lapsed') return `<div class="lane-body">${row("on here, but solstone.me isn't on", true)}<div class="notice"><p>turn it back on in the services portal. your journal checks again about every five minutes and picks it up on its own.${next}</p></div><div class="hand"><a class="btn primary" href="${esc(state.subscribe_url || PORTAL)}" target="_blank" rel="noopener">open the services portal</a></div></div>`;
    if (me === 'refused') return `<div class="lane-body">${row("on, but solstone.me didn't accept this journal", true)}<div class="notice"><p>if you haven't allowed solstone.me for this journal yet, turn it off and back on to do that. your journal keeps trying on its own, about every five minutes.${next}</p></div></div>`;
    return `<div class="lane-body">${row('on, reachable from anywhere', true)}${address}<p class="note">${relay}</p>${about}${portal()}</div>`;
  }

  // ---- the page ----------------------------------------------------------------------------------
  function baseStatusLine() {
    const own = ownState(), me = meState();
    if (own === 'port') return ['r', "something else on this computer is using your journal's address for agents."];
    const ownOn = own === 'on', meOn = me === 'on' || me === 'renewal';
    if (ownOn && meOn) return ['g', 'agents on this computer, and anywhere through solstone.me, can reach your journal.'];
    if (ownOn && me === 'offline') return ['a', "agents on this computer can reach your journal. solstone.me isn't reaching it right now."];
    if (ownOn) return ['g', 'agents on this computer can reach your journal.'];
    if (meOn) return ['g', 'agents can reach your journal through solstone.me.'];
    if (own === 'down' || own === 'unreadable') return ['a', "agents on this computer can't reach your journal right now."];
    return ['', 'neither way is on right now.', true];
  }
  function statusLine() {
    const base = baseStatusLine();
    if (!hasLan() || ownState() === 'port') return base.slice(0, 2);
    const lan = lanState();
    if (lan === 'port' || lanTaken().length) return ['r', "something else on this computer is using one of your journal's addresses for agents on your network."];
    const [tone, sentence, neither] = base;
    if (lan === 'on') return neither ? ['g', 'agents on your network can reach your journal.'] : [tone, `${sentence} agents on your network can reach your journal too.`];
    if (lan === 'off' || lan === 'invalid') return [tone, sentence];
    return neither ? ['a', "your journal's addresses on your network aren't open right now."] : [tone === 'g' ? 'a' : tone, `${sentence} your journal's addresses on your network aren't open right now.`];
  }
  function segment(id, name, desc, disclosure, cls, [tagCls, tagText]) {
    return `<button class="seg${lane === id ? ' is' : ''}${id === 'own' && !hasDoor() ? ' soon' : ''}" role="radio" aria-checked="${lane === id}" data-lane="${id}"><span class="segtop"><span class="radio" aria-hidden="true"></span><span class="segname">${name}</span><span class="tag ${tagCls}">${tagText}</span></span><span class="segdesc">${desc}</span><span class="${cls}">${disclosure}</span></button>`;
  }
  function agentsList() {
    const rows = state.connections;
    const head = `<div class="sh"><h2>your agents</h2>${rows.length ? '<button class="btn primary" data-action="connect">connect an agent</button>' : ''}</div>`;
    if (!rows.length) return `<section class="section">${head}<div class="list empty"><h3>no agents connected yet</h3><p>connect one to let it search and read your journal, within what you choose.</p><button class="btn primary" data-action="connect">connect an agent</button></div></section>`;
    return `<section class="section">${head}<div class="list">${rows.map(connection => `<button class="ag-row" data-connection="${esc(connection.kind)}:${esc(connection.id)}"><span class="m"><strong>${esc(connection.name)}${laneChip(connection)}</strong><small>${connection.kind === 'bearer' ? 'a key you created · ' : ''}${connection.activity_complete ? '' : 'at least '}${esc(connection.requests_this_week)} request${connection.requests_this_week === 1 ? '' : 's'} this week${lastRequestCopy(connection)}</small><small>${esc(permissionLine(connection.permission))}</small></span><span aria-hidden="true">›</span></button>`).join('')}</div><p class="foot"><a class="link" href="#" data-route="activity">recent activity →</a> what your agents asked, and what they got. recorded in your journal.</p></section>`;
  }
  function home() {
    const [tone, sentence] = statusLine();
    const lanes = `<section class="lanes"><p class="sectlab">how your agents reach your journal</p><p class="secthint">whichever way an agent uses, it reads only what you let it see.</p><div class="seg3" role="radiogroup" aria-label="how your agents reach your journal">${segment('own', 'your own', hasLan() ? 'by default, agents on this computer reach your journal directly. agents on your wifi or VPN can too, once you turn that on.' : `agents on this computer reach your journal directly.${hasDoor() ? ' the default.' : ''}`, 'sol pbc is never in the path', 'byob', ownTag())}${segment('byo', 'your hostname', 'agents anywhere reach your journal through a public route and DNS you set up.', 'you operate the route', 'byob', byoTag())}${segment('me', 'solstone.me', 'agents anywhere, like Claude on the web, reach your journal at its own address, through a relay sol pbc runs for you.', 'operated by sol pbc', 'oper', meTag())}</div>${lane === 'own' ? ownBody() : lane === 'byo' ? byoBody() : meBody()}</section>`;
    return `<p class="brandlock"><span class="lockdot" aria-hidden="true"></span>your journal is always private, only yours.</p><h1>agents</h1><p class="status-line"><span class="sdot ${tone}" aria-hidden="true"></span>${sentence}</p>${lanes}${agentsList()}`;
  }

  // ---- dialogs -----------------------------------------------------------------------------------
  function connectDialog() {
    const lanWay = hasLan() && lanState() === 'on' && lanOpen().length > 0;
    const otherOn = ownState() === 'on' || Boolean(state.enabled && meAddress());
    const choices = [['other', 'on this computer, or anywhere through solstone.me'], ...(lanWay ? [['lan', 'on another computer on your wifi or VPN']] : []), ...(byoReady() ? [['byo', 'anywhere through your hostname']] : [])];
    if (!otherOn) choices.shift();
    if (!choices.length) choices.push(['other', 'on this computer, or anywhere through solstone.me']);
    if (choices.length === 1) connectWay = choices[0][0];
    else if (connectWay && !choices.some(([id]) => id === connectWay)) connectWay = null;
    const wantLan = connectWay === 'lan';
    const wantByo = connectWay === 'byo';
    const codeMatches = code => wantByo ? code?.door === 'byo' : wantLan ? code?.door === 'lan' : code?.door !== 'byo' && code?.door !== 'lan';
    const choice = choices.length > 1 ? `<div class="mstep" style="display:block"><p><strong>where is this agent?</strong></p><div class="seg3" role="radiogroup" aria-label="where is this agent">${choices.map(([id, name]) => `<button class="seg${connectWay === id ? ' is' : ''}" role="radio" aria-checked="${connectWay === id}" data-way="${id}"><span class="segtop"><span class="radio" aria-hidden="true"></span><span class="segname">${name}</span></span></button>`).join('')}</div></div>` : '';
    const mark = markUnit();
    const close = `<button class="btn sm" style="float:right" data-close-modal>close</button><h2>connect an agent</h2>`;
    if (!connectWay) return `<div class="modal" data-close-modal><article class="modal-card" role="dialog" aria-modal="true" aria-label="connect an agent">${close}${choice}<p class="meta">pick where the agent is first. the pairing code works only for the one you pick.</p></article></div>`;
    const addresses = [];
    if (wantByo) {
      addresses.push(`<div class="addr"><span>an agent anywhere · test this route from the agent's network</span><div><code>${esc(byoEndpoint())}</code><button class="btn sm" data-copy="${esc(byoEndpoint())}">copy</button></div></div>`);
    } else if (wantLan) {
      for (const address of lanOpen()) addresses.push(`<div class="addr"><span>an agent on another computer on your wifi or VPN · use the address on the same network as that computer</span><div><code>${esc(address.url)}</code><button class="btn sm" data-copy="${esc(address.url)}">copy</button></div></div>`);
    } else {
      if (ownState() === 'on') addresses.push(`<div class="addr"><span>an agent on this computer</span><div><code>${esc(doorAddress())}</code><button class="btn sm" data-copy="${esc(doorAddress())}">copy</button></div></div>`);
      if (state.enabled && meAddress()) addresses.push(`<div class="addr"><span>an agent anywhere, through solstone.me · in Claude, add it as a custom connector</span><div><code>${esc(meEndpoint())}</code><button class="btn sm" data-copy="${esc(meEndpoint())}">copy</button></div></div>`);
    }
    const other = wantByo ? 'another address' : wantLan ? (byoReady() ? 'this computer, solstone.me or your hostname' : 'this computer and solstone.me') : (byoReady() ? 'your network or hostname' : 'your network');
    const shown = pairingCode && codeMatches(pairingCode) ? pairingCode : null;
    const open = state.pairing && !shown ? (codeMatches(state.pairing) ? `<p class="meta">a code is already open. codes are shown once; make a new one to see it.</p>` : hasLan() ? `<p class="meta">the open code is for ${other}. make a new one for this agent. it replaces the open one.</p>` : `<p class="meta">a code is already open. codes are shown once; make a new one to see it.</p>`) : '';
    const code = shown
      ? `<code class="copy-code">${esc(shown.code)}</code><p class="meta">works once. expires at ${esc(new Date(shown.expires_at).toLocaleTimeString())}.${wantLan ? ' this code works only for an agent on your network.' : wantByo ? ' this code works only at your hostname.' : ''}</p><button class="btn sm" data-action="new-code">make a new code</button>`
      : `${state.pairing?.locked && codeMatches(state.pairing) ? `<p class="meta">the last code was entered wrong too many times, so it no longer works.</p>` : open}<button class="btn primary" data-action="new-code">make a pairing code</button><p class="meta">it works once and expires after 10 minutes.</p>`;
    const step1 = `<div class="mstep"><span class="n">1</span><div><p>give your agent your journal's address, where it asks for an MCP server.</p>${addresses.length ? addresses.join('') : `<p class="meta">neither way is on right now. turn one on first.</p>`}${wantLan ? `<p class="meta">a key you created doesn't work at these addresses, so don't give one to an agent on your network.</p>` : ''}<p class="meta">if an app already opened your journal's page on its own, go to step 2.</p></div></div>`;
    const where = `<details><summary>certificate fingerprint</summary><p>your journal's certificate for these addresses has this SHA-256 fingerprint:</p><p><code class="fp">${esc(fingerprint())}</code></p><p>your browser shows it in the certificate's details.</p></details>`;
    const step2 = wantLan
      ? `<div class="mstep"><span class="n">2</span><div><p>the browser on that computer opens your journal's page. it may warn about the certificate unless you have trusted your journal's LAN CA there. check the page shows ${mark ? 'this mark:' : "your journal's mark."}</p>${mark}${fingerprint() ? where : ''}</div></div>`
      : `<div class="mstep"><span class="n">2</span><div><p>your browser opens your journal's page.${wantByo ? ' check the address is your hostname.' : ''} check it shows ${mark ? 'this mark:' : "your journal's mark."}</p>${mark}</div></div>`;
    const step3 = `<div class="mstep"><span class="n">3</span><div><p>enter a pairing code on that page.</p>${code}</div></div>`;
    return `<div class="modal" data-close-modal><article class="modal-card" role="dialog" aria-modal="true" aria-label="connect an agent">${close}${choice}${step1}${step2}${step3}<p class="meta">a different mark, or not expecting this? close that page. nothing connects until you enter the code.</p></article></div>`;
  }
  function confirmDialog(kind) {
    if (kind === 'lan-off') {
      const own = ownState() === 'on', me = meState() === 'on' || meState() === 'renewal';
      const keep = own && me ? ' agents on this computer, and through solstone.me, keep working.' : own ? ' agents on this computer keep working.' : me ? ' agents through solstone.me keep working.' : '';
      return `<div class="modal" data-close-modal><article class="modal-card" role="dialog" aria-modal="true" aria-label="turn off agents on your network"><h2>turn off agents on your network?</h2><p>agents you connected on your network stop reaching your journal within a few seconds.${keep}</p><p>the ones you connected are kept, with what each may see, for when you turn this back on. their activity stays in your journal.</p><div class="button-row"><button class="btn danger" data-action="lan-door-off">turn off</button><button class="btn" data-close-modal>keep it on</button></div></article></div>`;
    }
    const body = kind === 'me-off'
      ? `<h2>turn off solstone.me?</h2><p>agents connected through solstone.me stop reaching your journal on their next request.${ownState() === 'on' ? ' agents on this computer keep working.' : ''}</p><p>the address and your agents are kept: turning back on uses the same address, with no new certificate. its public certificate record remains either way.</p><div class="button-row"><button class="btn danger" data-action="turn-off">turn off</button><button class="btn" data-close-modal>keep it on</button></div>`
      : `<h2>turn off agents on this computer?</h2><p>agents on this computer stop reaching your journal within a few seconds.</p><p>the ones you connected are kept, with what each may see, for when you turn this back on. their activity stays in your journal.</p><div class="button-row"><button class="btn danger" data-action="door-off">turn off</button><button class="btn" data-close-modal>keep it on</button></div>`;
    return `<div class="modal" data-close-modal><article class="modal-card" role="dialog" aria-modal="true" aria-label="${kind === 'me-off' ? 'turn off solstone.me' : 'turn off agents on this computer'}">${body}</article></div>`;
  }

  function picker(connection) {
    const read = connection?.permission?.read;
    const cats = read?.categories || ['transcripts','entities','facets'];
    return `<div class="field"><label for="scope">which part of your journal</label><select id="scope"><option value="whole_journal"${read?.scope?.kind !== 'facets' ? ' selected' : ''}>your whole journal</option><option value="facets"${read?.scope?.kind === 'facets' ? ' selected' : ''}>only facets you choose</option></select><span class="meta" id="scope-gloss">your whole journal includes everything now and anything added later, including facets you create later. chosen facets grow with their contents; facets you create later are not included.</span></div><div class="checks" aria-label="what kinds of material">${['transcripts','entities','facets'].map(cat => `<label class="check"><input type="checkbox" name="category" value="${cat}"${cats.includes(cat) ? ' checked' : ''}><span><strong>${cat}</strong><small class="meta">${categoryGloss[cat]}</small></span></label>`).join('')}</div><div class="field" id="facet-field"><span class="meta">facets</span><div class="checks">${state.facets.map(facet => `<label class="check"><input type="checkbox" name="facet" value="${esc(facet.name)}"${read?.scope?.ids?.includes(facet.id) ? ' checked' : ''}><span style="color:${esc(facet.color || 'var(--orange)')}">●</span> ${esc(facet.title)}</label>`).join('')}</div></div>`;
  }


  function connectionPage(connection) {
    return frame(connection.name, `${laneChip(connection)}${connectionAccessCopy(connection)}`, `<a class="back" href="#" data-route="home">← agents</a><section class="card pad"><div class="section-head"><h2>what ${esc(connection.name)} may see</h2></div><p>narrow or widen at any time. ${esc(connection.name)} sees the change the next time it asks for anything; requests already in flight finish under the old choice.</p><p>${esc(permissionLine(connection.permission))}.</p>${picker(connection)}<div class="button-row"><button class="btn primary" data-save-permission="${esc(connection.kind)}:${esc(connection.id)}">save</button></div></section><section class="card pad section"><div class="section-head"><h2>its activity</h2><button class="btn" data-activity-connection="${esc(connection.key)}">see recent requests</button></div><p>${connection.activity_complete ? '' : 'at least '}${esc(connection.requests_this_week)} request${connection.requests_this_week === 1 ? '' : 's'} this week${lastRequestCopy(connection, '; ')}.</p></section><section class="card pad section"><h2>${connection.kind === 'bearer' ? 'revoke' : 'disconnect'}</h2><p>${esc(connection.name)} loses access on its next request. what it already read stays with it. its activity stays in your journal. to reconnect, pair again.</p><div class="button-row">${connection.kind === 'bearer' ? `<button class="btn" data-rename="${esc(connection.id)}">rename</button>` : ''}<button class="btn danger" data-revoke="${esc(connection.kind)}:${esc(connection.id)}">${connection.kind === 'bearer' ? 'revoke key' : 'disconnect'}</button></div></section>`);
  }


  const outcomeLabel = {served:'served',empty:'nothing matched',refused:'refused',error:"couldn't complete",uncertain:'unknown ending'};
  function activityPage() {
    const entries = activity?.entries || [];
    const counts = activity?.counts || {};
    const atLeast = activity && !activity.examination_complete ? 'at least ' : '';
    return frame('activity', 'what your agents asked, in their own words, and what they got or were refused. recorded in your journal. the content that was released isn\'t copied here; each entry points at it.', `<a class="back" href="#" data-route="home">← agents</a><section class="card summary">${Object.entries(outcomeLabel).map(([key,label]) => `<span><strong>${atLeast}${counts[key] || 0}</strong>${label}</span>`).join('')}</section><div class="toolbar section"><div class="field"><label for="a-outcome">how it ended</label><select id="a-outcome"><option value="">any way</option>${Object.entries(outcomeLabel).map(([key,label]) => `<option value="${key}">${label}</option>`).join('')}</select></div><div class="field"><label for="a-tool">what it did</label><select id="a-tool"><option value="">any tool</option>${['list_facets','search','fetch','list_transcripts','get_transcript','list_entities','get_entity'].map(tool => `<option>${tool}</option>`).join('')}</select></div><button class="btn" data-action="filter-activity">apply</button></div><section class="card section">${entries.length ? entries.map((entry,index) => `<button class="row activity-row" style="width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;font:inherit" data-activity-index="${index}"><time class="meta">${esc(new Date(entry.timestamp).toLocaleString())}</time><span class="row-main"><span class="quote">${esc(entry.agent_identity)} used ${esc(entry.tool)}</span><small>${esc(entry.reason || 'open for request and result details')}</small></span><span class="outcome ${esc(entry.outcome)}">${esc(outcomeLabel[entry.outcome])}</span></button>`).join('') : `<div class="empty"><h3>nothing matches these filters.</h3></div>`}</section>${activity && !activity.examination_complete ? `<div class="notice">only the first 100 matching requests are shown. these counts are minimums.</div>` : ''}`);
  }

  function activityDetail(entry) {
    return `<div class="modal" data-close-modal><article class="modal-card" role="dialog" aria-modal="true" aria-label="one request"><button class="btn" style="float:right" data-close-modal>close</button><h2>${esc(entry.agent_identity)} used ${esc(entry.tool)}</h2><p class="meta">${esc(new Date(entry.timestamp).toLocaleString())}</p><h3>how it ended</h3><p><span class="outcome ${esc(entry.outcome)}">${esc(outcomeLabel[entry.outcome])}</span></p><h3>what it asked</h3><pre style="white-space:pre-wrap">${esc(JSON.stringify(entry.request?.arguments || {}, null, 2))}</pre><h3>what happened</h3><p>${esc(entry.reason || (entry.outcome === 'uncertain' ? 'nothing is known to have been released. the request was allowed; the record of how it ended was never written.' : entry.outcome === 'empty' ? 'nothing was released. the request was allowed and nothing in scope matched it.' : 'the result details are below.'))}</p>${entry.result ? `<pre style="white-space:pre-wrap">${esc(JSON.stringify(entry.result, null, 2))}</pre>` : ''}</article></div>`;
  }

  function targetLinks(entry) {
    const targets = entry?.result?.targets || [];
    if (!targets.length) return '';
    const link = target => {
      const coordinate = String(target);
      const entity = coordinate.match(/\/entity:([^/]+)$/);
      if (entity) return `/app/entities/?entity=${encodeURIComponent(entity[1])}`;
      if (coordinate.startsWith('entity:')) return `/app/entities/?entity=${encodeURIComponent(coordinate.slice(7))}`;
      if (coordinate.startsWith('facet:')) return `/app/settings/?facet=${encodeURIComponent(coordinate.slice(6))}`;
      const day = coordinate.match(/^(\d{8})\//)?.[1];
      if (day) return `/app/transcripts/${encodeURIComponent(day)}`;
      return '/app/search/';
    };
    return `<h3>what was released</h3><ul>${targets.map(target => `<li><a href="${esc(link(target))}">${esc(target)}</a></li>`).join('')}</ul><p class="meta">these links open the corresponding journal record. the activity entry stores coordinates and a fingerprint, not a second copy of the content.</p>`;
  }


  function render() {
    if (!state) return;
    if (!lane) lane = hasDoor() ? 'own' : 'me';
    if (route.name === 'connection') view.innerHTML = connectionPage(route.connection);
    else if (route.name === 'activity') view.innerHTML = activityPage();
    else view.innerHTML = home();
    if (dialog === 'connect') view.insertAdjacentHTML('beforeend', connectDialog());
    else if (dialog) view.insertAdjacentHTML('beforeend', confirmDialog(dialog));
    const scope = document.getElementById('scope');
    const facetField = document.getElementById('facet-field');
    if (scope && facetField) { const sync = () => facetField.classList.toggle('hidden', scope.value !== 'facets'); scope.addEventListener('change', sync); sync(); }
    if (route.name === 'activity') {
      view.querySelector('.toolbar')?.insertAdjacentHTML('afterbegin', `<div class="field"><label for="a-agent">agent</label><select id="a-agent"><option value="">all agents</option>${state.connections.map(connection => `<option value="${esc(connection.key)}">${esc(connection.name)}</option>`).join('')}</select></div><div class="field"><label for="a-from">from</label><input id="a-from" type="date"></div><div class="field"><label for="a-to">to</label><input id="a-to" type="date"></div>`);
    }
  }

  function enableViewKey(op) { const { elapsed_ms, ...stable } = op || {}; return JSON.stringify(stable); }
  function scheduleEnablePoll() { clearTimeout(enablePollTimer); enablePollTimer = setTimeout(pollEnable, 1500); }
  async function pollEnable() {
    try {
      const res = await api('/app/agents/api/enable');
      enableOp = res?.operation;
      if (!enableOp || enableOp.phase === 'enabled') { enableOp = null; lastEnableView = ''; await reload(true); return; }
      const shown = enableViewKey(enableOp);
      if (shown !== lastEnableView) { lastEnableView = shown; render(); }
      if (pending()) scheduleEnablePoll();
    } catch (_) {}
  }
  async function checkEnableOp() {
    try {
      const res = await api('/app/agents/api/enable');
      if (res?.operation && res.operation.phase !== 'enabled') { enableOp = res.operation; if (pending()) scheduleEnablePoll(); }
    } catch (_) {}
  }
  async function loadIdentity() {
    try {
      const data = await api('/app/network/api/identity');
      identity = data?.committed && data.mark ? {mark: data.mark} : {generic: true};
    } catch (_) { identity = null; }
  }
  async function reload(quiet = false) {
    if (!quiet || !state) view.innerHTML = '<p class="lead">loading agents…</p>';
    try {
      state = await api('/app/agents/api/state');
      if (!identity) await loadIdentity();
      if (!state.enabled && usesConsentFlow()) await checkEnableOp();
      else enableOp = null;
      render();
    }
    catch (error) { errorPage(error.message || 'the journal did not return its agent state.'); }
  }
  async function loadActivity(connection = '') {
    try { activity = await api(`/app/agents/api/activity${connection ? `?connection=${encodeURIComponent(connection)}` : ''}`); route = {name:'activity', connection}; render(); if (connection) document.getElementById('a-agent').value = connection; }
    catch (error) { notify(error.message || 'activity could not be read'); }
  }
  async function turnOn() {
    lane = 'me';
    if (!usesConsentFlow()) { await api('/app/agents/api/capability', jsonOptions('PUT', {enabled:true})); await reload(true); return; }
    try {
      const start = await api('/app/agents/api/enable', jsonOptions('POST', {}));
      enableOp = start?.operation;
      if (enableOp?.portal_url) window.open(enableOp.portal_url, '_blank', 'noopener,noreferrer');
      lastEnableView = enableViewKey(enableOp);
      render();
      if (pending()) scheduleEnablePoll();
    } catch (e) {
      await checkEnableOp();
      if (enableOp) { lastEnableView = enableViewKey(enableOp); render(); }
      else notify(e.message || "couldn't start turning on solstone.me. try again.");
    }
  }

  view.addEventListener('click', async event => {
    const target = event.target.closest('button,a,[data-close-modal]'); if (!target) return;
    if (target.dataset.closeModal !== undefined && (target === event.target || target.tagName === 'BUTTON')) { if (dialog) { dialog = null; render(); } else target.closest('.modal')?.remove(); return; }
    if (target.closest('.modal-card') === null && target.dataset.closeModal !== undefined) return;
    const action = target.dataset.action;
    if (target.dataset.lane) { lane = target.dataset.lane; render(); return; }
    if (target.dataset.way) { connectWay = target.dataset.way; render(); return; }
    if (target.dataset.route) { event.preventDefault(); if (target.dataset.route === 'activity') await loadActivity(); else { route = {name: target.dataset.route}; render(); } return; }
    if (target.dataset.activityConnection) { await loadActivity(target.dataset.activityConnection); return; }
    if (target.dataset.connection) { const [kind,id] = target.dataset.connection.split(':'); route = {name:'connection', connection: state.connections.find(item => item.kind === kind && item.id === id)}; render(); return; }
    if (target.dataset.copy) { await navigator.clipboard?.writeText(target.dataset.copy); target.textContent = 'copied'; return; }
    if (target.dataset.activityIndex) { const entry = activity.entries[Number(target.dataset.activityIndex)]; view.insertAdjacentHTML('beforeend', activityDetail(entry)); view.querySelector('.modal-card:last-of-type')?.insertAdjacentHTML('beforeend', targetLinks(entry)); return; }
    try {
      if (action === 'reload' || action === 'refresh') await reload(true);
      else if (action === 'connect') { dialog = 'connect'; connectWay = null; render(); }
      else if (action === 'me-off' || action === 'own-off' || action === 'lan-off') { dialog = action; render(); }
      else if (action === 'lan-on' || action === 'lan-door-off') { await api('/app/agents/api/lan-door', jsonOptions('PUT', {enabled: action === 'lan-on'})); dialog = null; await reload(true); }
      else if (action === 'own-on' || action === 'door-off') { await api('/app/agents/api/local-door', jsonOptions('PUT', {enabled: action === 'own-on'})); dialog = null; await reload(true); }
      else if (action === 'byo-save') { const hostname = document.getElementById('byo-hostname').value.trim(); if (!hostname) { notify('enter a public hostname first'); return; } if (state.byo?.hostname && state.byo.hostname !== hostname && !confirm('changing your hostname disconnects agents paired at the old address. continue?')) return; await api('/app/agents/api/byo', jsonOptions('PUT', {hostname, enabled:false})); await reload(true); }
      else if (action === 'byo-register') { await api('/app/agents/api/byo/account', ownerOptions('POST')); await reload(true); }
      else if (action === 'byo-on' || action === 'byo-off') { await api('/app/agents/api/byo', jsonOptions('PUT', {enabled:action === 'byo-on'})); await reload(true); }
      else if (action === 'byo-remove') { if (!confirm('remove this hostname? agents paired through it lose access, even if you add the same hostname again.')) return; await api('/app/agents/api/byo', ownerOptions('DELETE')); await reload(true); }
      else if (action === 'byo-replace') { if (!confirm("replace this journal's certificate registration? the public route will turn off and you must publish a new CAA record before turning it on again.")) return; await api('/app/agents/api/byo/account/replace', ownerOptions('POST')); await reload(true); }
      else if (action === 'turn-on') await turnOn();
      else if (action === 'turn-off') { await api('/app/agents/api/capability', jsonOptions('PUT', {enabled:false})); dialog = null; await reload(true); }
      else if (action === 'dismiss-enable') { clearTimeout(enablePollTimer); enableOp = null; lastEnableView = ''; render(); }
      else if (action === 'new-code') { const codeDoor = connectWay === 'lan' ? 'lan' : connectWay === 'byo' ? 'byo' : null; pairingCode = await api('/app/agents/api/pairing', codeDoor ? jsonOptions('POST', {door:codeDoor}) : ownerOptions('POST')); if (codeDoor && !pairingCode.door) pairingCode.door = codeDoor; state.pairing = pairingCode; render(); }
      else if (action === 'filter-activity') { const params = new URLSearchParams(); const outcome = document.getElementById('a-outcome').value; const tool = document.getElementById('a-tool').value; const connection = document.getElementById('a-agent').value; const from = document.getElementById('a-from').value.replaceAll('-',''); const to = document.getElementById('a-to').value.replaceAll('-',''); if (outcome) params.set('outcome', outcome); if (tool) params.set('tool', tool); if (connection) params.set('connection', connection); if (from) params.set('from', from); if (to) params.set('to', to); activity = await api(`/app/agents/api/activity?${params}`); render(); }
      else if (target.dataset.savePermission) { const [kind,id] = target.dataset.savePermission.split(':'); const categories = [...document.querySelectorAll('input[name=category]:checked')].map(node => node.value); const scope = document.getElementById('scope').value; const facets = [...document.querySelectorAll('input[name=facet]:checked')].map(node => node.value); await api(`/app/agents/api/connections/${encodeURIComponent(kind)}/${encodeURIComponent(id)}/permission`, jsonOptions('PUT', {categories, scope, facets})); route = {name:'home'}; await reload(true); }
      else if (target.dataset.revoke) { const [kind,id] = target.dataset.revoke.split(':'); if (confirm('disconnect this agent? what it already read stays with it. its activity stays in your journal.')) { await api(`/app/agents/api/connections/${encodeURIComponent(kind)}/${encodeURIComponent(id)}`, ownerOptions('DELETE')); route = {name:'home'}; await reload(true); } }
      else if (target.dataset.rename) { const name = prompt('name this key', route.connection.name); if (name) { await api(`/app/agents/api/connections/bearer/${encodeURIComponent(target.dataset.rename)}`, jsonOptions('PATCH', {name})); route = {name:'home'}; await reload(true); } }
    } catch (error) { notify(error.message || 'that change did not finish'); }
  });
  reload();
  window.setInterval(() => {
    if (route.name !== 'home' || dialog) return;
    if (pending()) pollEnable();
    else if ((state?.enabled && state?.status !== 'on') || (state?.local_door && !state.local_door.listening) || state?.lan_door?.enabled || state?.byo?.enabled) reload(true);
  }, 10000);
})();
</script>
