[package]
name = "solstone-core-convey-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"
autotests = false

[[test]]
name = "convey_authorization_contracts"
path = "tests/convey_authorization_contracts.rs"

[[test]]
name = "convey_route_contracts"
path = "tests/convey_route_contracts.rs"

# Cargo auto-discovery is disabled for this package, so this corpus target is explicit.
[[test]]
name = "corpus"
path = "tests/corpus.rs"

[[test]]
name = "convey_shell_boundaries"
path = "tests/convey_shell_boundaries.rs"
required-features = ["test-hooks"]

[[test]]
name = "convey_speaker_contracts"
path = "tests/convey_speaker_contracts.rs"

# Cargo auto-discovery is disabled for this package, so this route-contract target is explicit.
[[test]]
name = "thinking_sol_reads"
path = "tests/thinking_sol_reads.rs"

# Cargo auto-discovery is disabled; this exercises the composed Health journal-data routes.
[[test]]
name = "health_journal_data"
path = "tests/health_journal_data.rs"

# Cargo auto-discovery is disabled; this exercises the composed Profile routes.
[[test]]
name = "profile_routes"
path = "tests/profile_routes.rs"

# Cargo auto-discovery is disabled, and this target isolates process-global
# PATH mutation needed to verify Thinking reads never reach nvidia-smi.
[[test]]
name = "thinking_provider_status_probe_contract"
path = "tests/thinking_provider_status_probe_contract.rs"

[[test]]
name = "thinking_runs_contracts"
path = "tests/thinking_runs_contracts.rs"

[[test]]
name = "thinking_runs_dom"
path = "tests/thinking_runs_dom.rs"

[[test]]
name = "entities_workspace_dom"
path = "tests/entities_workspace_dom.rs"

# Cargo auto-discovery is disabled; this custom node-driven harness exercises the embedded pairing asset.
[[test]]
name = "network_pairing_dom"
path = "tests/network_pairing_dom.rs"

[[test]]
name = "shell_chrome_dom"
path = "tests/shell_chrome_dom.rs"

# Cargo auto-discovery is disabled; this custom Node target drives global shell action handlers.
[[test]]
name = "shell_global_facet_contract_dom"
path = "tests/shell_global_facet_contract_dom.rs"

[lints]
workspace = true

[features]
default = ["host"]
test-hooks = []
host = [
    "dep:percent-encoding",
    "dep:solstone-core-callosum",
    "solstone-core-callosum/wire",
    "dep:solstone-core-sol-link",
    "dep:solstone-core-spl",
    "dep:solstone-core-thinking",
    "dep:solstone-core-thinking-copy",
    "dep:solstone-core-handoff-nonce",
    "dep:solstone-core-journal-config-write",
    "dep:solstone-core-identity",
    "solstone-core-sol-link/host",
    "dep:rustls",
    "dep:socket2",
    "dep:spl-core",
    "dep:spl-home",
]

[dependencies]
axum = { workspace = true, features = ["tokio"] }
chrono.workspace = true
futures-core = "0.3.33"
log.workspace = true
ndarray = "=0.17.2"
percent-encoding = { version = "2.3.2", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2 = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
solstone-core-callosum = { workspace = true, optional = true }
solstone-core-backup-web.workspace = true
solstone-core-convey-body.workspace = true
solstone-core-convey-http.workspace = true
solstone-core-entities.workspace = true
solstone-core-entity.workspace = true
solstone-core-entity-matching.workspace = true
solstone-core-facets.workspace = true
solstone-core-facets-web.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-journal.workspace = true
solstone-core-journal-config.workspace = true
solstone-core-journal-config-write = { workspace = true, optional = true }
solstone-core-identity = { workspace = true, optional = true }
solstone-core-npy.workspace = true
solstone-core-clients-web.workspace = true
solstone-core-records-web.workspace = true
solstone-core-speaker-id.workspace = true
solstone-core-speaker-resolve.workspace = true
solstone-core-settings-web.workspace = true
solstone-core-import-web.workspace = true
solstone-core-ingest.workspace = true
solstone-core-push.workspace = true
solstone-core-support-web.workspace = true
solstone-core-transcripts-web.workspace = true
solstone-core-health-web.workspace = true
solstone-core-profile-web.workspace = true
solstone-core-stats-web.workspace = true
solstone-core-home-web.workspace = true
solstone-core-home.workspace = true
spl-home = { workspace = true, optional = true }
spl-core = { workspace = true, optional = true }
solstone-core-sol-link = { workspace = true, optional = true }
solstone-core-spl = { workspace = true, optional = true }
solstone-core-thinking = { workspace = true, optional = true }
solstone-core-thinking-copy = { workspace = true, optional = true }
solstone-core-handoff-nonce = { workspace = true, optional = true }
solstone-core-talent-cli.workspace = true
solstone-core-talent-config.workspace = true
solstone-core-journal-cli.workspace = true
solstone-core-system.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "sync", "time"] }
tower.workspace = true
ureq = { workspace = true, features = ["rustls"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal"] }

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
filetime = "0.2.29"
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std"] }
tempfile = "3.24.0"
temp-env = "0.3.6"
rcgen.workspace = true
rustls.workspace = true
sha2.workspace = true
solstone-core-brain.workspace = true
solstone-core-local.workspace = true
