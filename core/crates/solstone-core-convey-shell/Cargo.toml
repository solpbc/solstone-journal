publish = false
build = "build.rs"

[lints]
workspace = true

[dependencies]
axum = { workspace = true, features = ["tokio"] }
chrono.workspace = true
futures-core = "0.3.33"
ndarray = "=0.17.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
solstone-core-convey-http.workspace = true
solstone-core-entity.workspace = true
solstone-core-entity-matching.workspace = true
solstone-core-facets.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-npy.workspace = true
solstone-core-speaker-id.workspace = true
solstone-core-speaker-resolve.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
