[package]
name = "solstone-core-sense"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
chrono.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
solstone-core-callosum = { workspace = true, features = ["wire"] }
solstone-core-journal-config.workspace = true
solstone-core-local.workspace = true
solstone-core-system.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "sync", "time"] }

[[bin]]
name = "solstone-core-sense-test-handler"
path = "tests/bin/handler.rs"
test = false

[dev-dependencies]
tempfile = "3.24.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
