[package]
name = "solstone-core-speakers-onnx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["runtime"]
runtime = ["dep:ort"]
full-tests = ["runtime"]

[dependencies]
ort = { workspace = true, features = ["api-24", "std"], optional = true }
solstone-core-speakers.workspace = true

[target.'cfg(target_vendor = "apple")'.dependencies]
ort = { workspace = true, features = ["coreml"], optional = true }

[dev-dependencies]
serde_json.workspace = true
