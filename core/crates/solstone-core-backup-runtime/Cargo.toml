[package]
name = "solstone-core-backup-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# std::env::set_var is unsafe. The fallback-plant tests are the only callers,
# and each one carries its own allow.
[lints.rust]
unsafe_code = "deny"

[features]
full-tests = []
default = []
test-hooks = []
test-support = []

[dependencies]
chrono.workspace = true
getrandom.workspace = true
hmac.workspace = true
log.workspace = true
md5.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ureq.workspace = true
solstone-core-installed-payload.workspace = true
solstone-core-backup.workspace = true
solstone-core-body-rebuild.workspace = true
solstone-core-indexer-store.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-system.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "process", "signal"] }
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
solstone-core-distribution.workspace = true

[dev-dependencies]
tempfile = "3.24.0"
solstone-core-backup-runtime = { path = ".", features = ["test-support"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["fs", "signal"] }

[[test]]
name = "backup_runtime_process"
path = "tests/backup_runtime_process.rs"
required-features = ["test-hooks"]
