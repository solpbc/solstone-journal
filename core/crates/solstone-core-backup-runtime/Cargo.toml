[package]
name = "solstone-core-backup-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# std::env::set_var is unsafe. The fallback-plant tests are the only callers,
# and each one carries its own allow.
[lints.rust]
unsafe_code = "deny"

[features]
full-tests = ["solstone-core-backup/full-tests"]
default = []
test-hooks = ["solstone-core-journal-io/test-hooks"]
test-support = []
# iOS only: the final link supplies the Go backup bridge archive. Only the
# app's static library (tools/ios-runtime/native) enables it; without it the
# iOS callable path refuses and references no bridge symbol.
ios-linked-bridge = ["solstone-core-backup/ios-linked-bridge"]

[dependencies]
chrono.workspace = true
getrandom.workspace = true
hmac.workspace = true
log.workspace = true
md5.workspace = true
quick-xml = "0.41.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile = "3.24.0"
ureq = { workspace = true, features = ["rustls"] }
solstone-core-installed-payload.workspace = true
solstone-core-backup.workspace = true
solstone-core-body-rebuild.workspace = true
solstone-core-indexer-store.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-journal-config.workspace = true
solstone-core-journal-config-write.workspace = true
solstone-core-system.workspace = true
solstone-core-spp-attest.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "android", windows))'.dependencies]
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "macros"] }
socket2.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "process", "signal"] }
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
solstone-core-distribution.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
plist.workspace = true
zeroize = "1.8"

[dev-dependencies]
solstone-core-distribution.workspace = true
solstone-core-journal-io = { workspace = true, features = ["test-hooks"] }
solstone-core-backup-runtime = { path = ".", features = ["test-support"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["fs", "signal", "resource"] }

[[test]]
name = "backup_runtime_process"
path = "tests/backup_runtime_process.rs"
required-features = ["test-hooks"]

# OnceLock process-global storage in spp-attest means tests mutating the
# admitted Android service tools cannot run concurrently with other test threads.
[[test]]
name = "android_service_tools_process"
path = "tests/android_service_tools_process.rs"
