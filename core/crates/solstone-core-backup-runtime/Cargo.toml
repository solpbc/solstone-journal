[package]
name = "solstone-core-backup-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
test-hooks = []
test-support = []

[dependencies]
bzip2-rs.workspace = true
chrono.workspace = true
getrandom.workspace = true
hmac.workspace = true
md5.workspace = true
rustix = { workspace = true, features = ["process"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ureq.workspace = true
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
solstone-core-artifact-download.workspace = true
solstone-core-backup.workspace = true
solstone-core-body-rebuild.workspace = true
solstone-core-indexer-store.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-system.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "process", "signal"] }

[dev-dependencies]
tempfile = "3.24.0"
solstone-core-backup-runtime = { path = ".", features = ["test-support"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["fs", "signal"] }

[[test]]
name = "backup_runtime_process"
path = "tests/backup_runtime_process.rs"
required-features = ["test-hooks"]
