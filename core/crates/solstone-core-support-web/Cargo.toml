solstone-core-support-portal.workspace = true
tempfile = "3.24.0"
tower.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
sha2.workspace = true
solstone-core-convey-shell.workspace = true
solstone-core-support-portal = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt"] }
