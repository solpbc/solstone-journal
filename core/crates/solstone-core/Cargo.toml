[package]
name = "solstone-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[lints]
workspace = true

[features]
# Cross-language differentials — tests that execute the Python implementation as
# their oracle. They need a populated `.venv` (`make install`), so they are off
# by default; that is what lets the frozen native `make ci` run on a bare
# checkout. They run from `make check-differentials`.
differential = []

[[test]]
name = "core_brain_contracts"
path = "tests/core_brain_contracts.rs"

[[test]]
name = "core_cli_contracts"
path = "tests/core_cli_contracts.rs"

[[test]]
name = "core_convey_contracts"
path = "tests/core_convey_contracts.rs"

[[test]]
name = "core_differentials"
path = "tests/core_differentials.rs"
required-features = ["differential"]

[[test]]
name = "core_journal_contracts"
path = "tests/core_journal_contracts.rs"

[[test]]
name = "core_repository_contracts"
path = "tests/core_repository_contracts.rs"

[[test]]
name = "core_supervisor_contracts"
path = "tests/core_supervisor_contracts.rs"

[[test]]
name = "identity_cli"
path = "tests/identity_cli.rs"

[[test]]
name = "supervisor_app_stack"
path = "tests/supervisor_app_stack.rs"

[[test]]
name = "supervisor_shutdown"
path = "tests/supervisor_shutdown.rs"

[[test]]
name = "supervisor_tick"
path = "tests/supervisor_tick.rs"

[[bin]]
name = "solstone-core-generate-session-kill-helper"
path = "tests/bin/generate_session_kill_helper.rs"
test = false

[[bin]]
name = "solstone-core-system-test-child"
path = "../solstone-core-system/src/bin/solstone_system_test_child.rs"
test = false

[[bin]]
name = "solstone-core-race-classifier"
path = "tests/bin/race_classifier.rs"
test = false

[dependencies]
chrono.workspace = true
serde.workspace = true
serde_path_to_error = "0.1.20"
solstone-core-cli.workspace = true
solstone-core-check.workspace = true
solstone-core-convey-shell.workspace = true
solstone-core-body-rebuild.workspace = true
solstone-core-observer.workspace = true
solstone-core-body-ingest.workspace = true
solstone-core-entity.workspace = true
solstone-core-facets.workspace = true
solstone-core-format.workspace = true
solstone-core-identity.workspace = true
solstone-core-brain.workspace = true
solstone-core-doctor.workspace = true
solstone-core-indexer-query.workspace = true
solstone-core-indexer-store.workspace = true
solstone-core-import.workspace = true
solstone-core-import-sources.workspace = true
solstone-core-journal.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-journal-config.workspace = true
solstone-core-journal-config-write.workspace = true
solstone-core-local.workspace = true
solstone-core-assets.workspace = true
solstone-core-generate.workspace = true
solstone-core-generate-wire.workspace = true
solstone-core-cogitate-runtime.workspace = true
solstone-core-cogitate-tools.workspace = true
solstone-core-cogitate-wire.workspace = true
solstone-core-cogitate.workspace = true
solstone-core-grab.workspace = true
solstone-core-spl.workspace = true
solstone-core-sense.workspace = true
solstone-core-speaker-id.workspace = true
solstone-core-speaker-resolve.workspace = true
solstone-core-system.workspace = true
solstone-core-system-health.workspace = true
solstone-core-top.workspace = true
solstone-core-operational-logs.workspace = true
solstone-core-service-unit.workspace = true
solstone-core-transfer.workspace = true
solstone-core-transcribe.workspace = true
solstone-core-streams-cli.workspace = true
solstone-core-segment-cli.workspace = true
solstone-core-journal-stats-cli.workspace = true
solstone-core-reprocess-cli.workspace = true
solstone-core-backfill-cli.workspace = true
solstone-core-callosum = { workspace = true, features = ["wire"] }
serde_json.workspace = true
jsonschema.workspace = true
nix = { workspace = true, features = ["fs", "process", "signal", "user"] }
plist.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std"] }
image.workspace = true
nix = { workspace = true, features = ["ptrace", "signal"] }
rcgen.workspace = true
rustls.workspace = true
rusqlite.workspace = true
sha2.workspace = true
solstone-core-npy.workspace = true
solstone-core-segment.workspace = true
spl-core.workspace = true
tempfile = "3.24.0"
tokio-tungstenite = { version = "0.26.2", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
