[package]
name = "solstone-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
# Cross-language differentials — tests that execute the Python implementation as
# their oracle. They need a populated `.venv` (`make install`), so they are off
# by default; that is what lets the frozen native `make ci` run on a bare
# checkout. They run from `make check-differentials`.
differential = []

[[test]]
name = "native_sol_coverage"
path = "tests/native_sol_coverage.rs"
required-features = ["differential"]

[[test]]
name = "journal_config_client"
path = "tests/journal_config_client.rs"
required-features = ["differential"]

[[test]]
name = "journal_config_corruption"
path = "tests/journal_config_corruption.rs"
required-features = ["differential"]

[[test]]
name = "body_restore_client"
path = "tests/body_restore_client.rs"
required-features = ["differential"]

[[test]]
name = "grab_differential"
path = "tests/grab_differential.rs"
required-features = ["differential"]

[[test]]
name = "transfer_send_differential"
path = "tests/transfer_send_differential.rs"
required-features = ["differential"]

[[test]]
name = "export_differential"
path = "tests/export_differential.rs"
required-features = ["differential"]

[[bin]]
name = "solstone-core-generate-session-kill-helper"
path = "tests/bin/generate_session_kill_helper.rs"
test = false

[[bin]]
name = "solstone-core-system-test-child"
path = "../solstone-core-system/src/bin/solstone_system_test_child.rs"
test = false

[dependencies]
chrono.workspace = true
serde.workspace = true
solstone-core-cli.workspace = true
solstone-core-convey-shell.workspace = true
solstone-core-body-rebuild.workspace = true
solstone-core-observer.workspace = true
solstone-core-body-ingest.workspace = true
solstone-core-entity.workspace = true
solstone-core-brain.workspace = true
solstone-core-indexer-query.workspace = true
solstone-core-indexer-store.workspace = true
solstone-core-journal.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-journal-config.workspace = true
solstone-core-journal-config-write.workspace = true
solstone-core-local.workspace = true
solstone-core-generate.workspace = true
solstone-core-generate-wire.workspace = true
solstone-core-cogitate-runtime.workspace = true
solstone-core-cogitate-tools.workspace = true
solstone-core-cogitate-wire.workspace = true
solstone-core-cogitate.workspace = true
solstone-core-grab.workspace = true
solstone-core-spl.workspace = true
solstone-core-speaker-id.workspace = true
solstone-core-speaker-resolve.workspace = true
solstone-core-system.workspace = true
solstone-core-transfer.workspace = true
solstone-core-transcribe.workspace = true
solstone-core-callosum = { workspace = true, features = ["wire"] }
serde_json.workspace = true
nix = { workspace = true, features = ["process", "signal"] }
tokio = { workspace = true, features = ["io-std", "io-util", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std"] }
image.workspace = true
nix = { workspace = true, features = ["signal"] }
rcgen.workspace = true
rustls.workspace = true
rusqlite.workspace = true
sha2.workspace = true
solstone-core-npy.workspace = true
spl-core.workspace = true
tempfile = "3.24.0"
tokio-tungstenite = { version = "0.26.2", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
