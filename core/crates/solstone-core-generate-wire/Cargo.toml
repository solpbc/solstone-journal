[package]
name = "solstone-core-generate-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "0.22.1"
chrono.workspace = true
image.workspace = true
jsonschema.workspace = true
serde_json.workspace = true
solstone-core-generate.workspace = true
solstone-core-local.workspace = true
solstone-core-spp-ratls.workspace = true
ureq = { workspace = true, features = ["rustls"] }
regex = "1.13.1"

[features]
# Cross-language differentials against the Python reference implementation.
# They need a populated `.venv` (`make install`).
differential = []
test-hooks = []

[[test]]
name = "endpoint_transport"
path = "tests/endpoint_transport.rs"

[[test]]
name = "responsiveness_differential"
path = "tests/responsiveness_differential.rs"
required-features = ["differential"]

[[test]]
name = "token_log_differential"
path = "tests/token_log_differential.rs"
required-features = ["differential"]

[[test]]
name = "confidential_transport"
path = "tests/confidential_transport.rs"
required-features = ["test-hooks"]

[dev-dependencies]
socket2.workspace = true
solstone-core-spp-attest.workspace = true

[lints]
workspace = true
