[package]
name = "solstone-core-generate-wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "0.22.1"
chrono.workspace = true
image.workspace = true
serde_json.workspace = true
solstone-core-generate.workspace = true
solstone-core-local.workspace = true
ureq.workspace = true
regex = "1.13.1"

[features]
# Cross-language differentials — tests that drive the real Python endpoint
# overflow decision. They need a populated `.venv` (`make install`).
differential = []

[[test]]
name = "endpoint_overflow_differential"
path = "tests/endpoint_overflow_differential.rs"
required-features = ["differential"]

[[test]]
name = "responsiveness_differential"
path = "tests/responsiveness_differential.rs"
required-features = ["differential"]

[[test]]
name = "token_log_differential"
path = "tests/token_log_differential.rs"
required-features = ["differential"]

[lints]
workspace = true
