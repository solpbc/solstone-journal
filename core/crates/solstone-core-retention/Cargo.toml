[package]
name = "solstone-core-retention"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Required, not cosmetic: `wildcards = "deny"` with `allow-wildcard-paths` only
# exempts UNPUBLISHED crates, so omitting this fails `cargo deny` on the path
# dependencies -- and that failure surfaces through the ci-gate-purity test, not
# through the deny gate a session is likely to run first.
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
# Declared before any type here references it: the deny.toml wrappers entry this
# dependency requires is a file all three conversion lanes edit, so it is added
# once here rather than again in each wave that adds a verb.
solstone-core-journal-io = { workspace = true }

[dev-dependencies]
# The outcome model's emitted shape is part of its contract -- a later wave's
# tombstone and activity log both carry it -- so one test asserts on real JSON
# rather than on a mock of both sides.
serde_json = { workspace = true }
