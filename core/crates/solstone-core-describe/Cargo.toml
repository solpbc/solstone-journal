[package]
name = "solstone-core-describe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
env_logger.workspace = true
log.workspace = true
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["format", "software-scaling", "build"] }
# This direct dependency only enables the shared FFmpeg source build's portable
# baseline; decode calls stay within ffmpeg-next's safe API.
ffmpeg-sys-next = { version = "9.0.0", default-features = false, features = ["build-portable"] }
image.workspace = true
serde.workspace = true
serde_json.workspace = true
solstone-core-describe-categories.workspace = true
solstone-core-journal-config.workspace = true
solstone-core-format.workspace = true
solstone-core-generate.workspace = true
solstone-core-processing-record.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-cli.workspace = true
solstone-core-local.workspace = true
solstone-core-assets.workspace = true
base64 = "0.22.1"
chrono.workspace = true

[features]
full-tests = []
test-stubs = []

[[bin]]
name = "solstone-describe-session-stub"
path = "tests/bin/session_stub.rs"
test = false
required-features = ["test-stubs"]

[[bin]]
name = "solstone-describe-detect-stub"
path = "tests/bin/detector_stub.rs"
test = false
required-features = ["test-stubs"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["test-stubs"]

[dev-dependencies]
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["format", "software-scaling", "build"] }
tempfile = "3.24.0"

[lints]
workspace = true
