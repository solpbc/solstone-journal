[package]
name = "solstone-core-journal-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
differential = []

[[bin]]
name = "solstone-core-journal"
path = "src/main.rs"

[[test]]
name = "journal_process_bootstrap"
path = "tests/journal_process_bootstrap.rs"
required-features = ["differential"]

[dependencies]
solstone-core-journal-cli = { workspace = true }

[dev-dependencies]
nix = { workspace = true, features = ["signal"] }
rusqlite = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
solstone-core-cli = { workspace = true }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[lints]
workspace = true
