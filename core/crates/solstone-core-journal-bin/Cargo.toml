[package]
name = "solstone-core-journal-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "solstone-core-journal"
path = "src/main.rs"

[[bin]]
name = "setup-fixture-journal"
path = "src/setup_fixture_journal.rs"

[dependencies]
env_logger.workspace = true
log.workspace = true
solstone-core-journal-cli = { workspace = true }
solstone-core-setup.workspace = true

[dev-dependencies]
solstone-core-journal.workspace = true
solstone-core-installation-identity.workspace = true
solstone-core-service-unit.workspace = true
rusqlite = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
solstone-core-cli = { workspace = true }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["signal"] }

[lints]
workspace = true
