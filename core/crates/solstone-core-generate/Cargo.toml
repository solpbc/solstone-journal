[package]
name = "solstone-core-generate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Cross-language differentials — tests that drive the real Python
# `solstone-generate-wire`. They need a populated `.venv` (`make install`), so
# they are off by default; that is what lets the frozen native `make ci` run on
# a bare checkout. They run from `make check-differentials`.
differential = []

[dependencies]
serde.workspace = true
serde_json.workspace = true

[[test]]
name = "no_downgrade"
path = "tests/no_downgrade.rs"

[[test]]
name = "session"
path = "tests/session.rs"

[[test]]
name = "session_real"
path = "tests/session_real.rs"

[[test]]
name = "wire"
path = "tests/wire.rs"

[[test]]
name = "one_shot_stub"
path = "tests/one_shot_stub.rs"

[[bin]]
name = "solstone-generate-session-stub"
path = "tests/bin/session_stub.rs"
test = false

[[bin]]
name = "solstone-generate-one-shot-stub"
path = "tests/bin/one_shot_stub.rs"
test = false

[lints]
workspace = true
