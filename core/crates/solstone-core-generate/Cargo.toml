[package]
name = "solstone-core-generate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
log.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
solstone-core-import = { workspace = true }
solstone-core-import-sources = { workspace = true }
solstone-core-indexer-store = { workspace = true }
solstone-core-segment = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["signal"] }

[[test]]
name = "no_downgrade"
path = "tests/no_downgrade.rs"

[[test]]
name = "session"
path = "tests/session.rs"

[[test]]
name = "session_real"
path = "tests/session_real.rs"

[[test]]
name = "wire"
path = "tests/wire.rs"

[[test]]
name = "one_shot_stub"
path = "tests/one_shot_stub.rs"

[[test]]
name = "import_session"
path = "tests/import_session.rs"

[[bin]]
name = "solstone-generate-session-stub"
path = "tests/bin/session_stub.rs"
test = false

[[bin]]
name = "solstone-generate-one-shot-stub"
path = "tests/bin/one_shot_stub.rs"
test = false

[lints]
workspace = true
