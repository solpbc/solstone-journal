[package]
name = "solstone-core-backup-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
axum = { workspace = true, features = ["tokio"] }
chrono.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
solstone-core-artifact-download.workspace = true
solstone-core-backup.workspace = true
solstone-core-backup-runtime.workspace = true
solstone-core-callosum.workspace = true
solstone-core-journal-config.workspace = true
solstone-core-handoff-nonce.workspace = true
solstone-core-journal-config-write.workspace = true
solstone-core-offload.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
sha2.workspace = true
tempfile = "3.24.0"
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tower.workspace = true
solstone-core-convey-shell.workspace = true
solstone-core-backup-runtime = { path = "../solstone-core-backup-runtime", features = ["test-support"] }

[[test]]
name = "backup_web_callosum_transport"
path = "tests/backup_web_callosum_transport.rs"
