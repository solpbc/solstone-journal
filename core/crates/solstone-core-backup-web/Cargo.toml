[package]
name = "solstone-core-backup-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# Hands the dashboard shell's build script this crate's served asset list.
links = "solstone_convey_assets_backup_web"

# std::env::set_var is unsafe. The fallback-plant tests are the only callers,
# and each one carries its own allow.
[lints.rust]
unsafe_code = "deny"

[dependencies]
axum = { workspace = true, features = ["tokio"] }
chrono.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
solstone-core-backup.workspace = true
solstone-core-backup-runtime.workspace = true
solstone-core-installed-payload.workspace = true
solstone-core-callosum.workspace = true
solstone-core-convey-http.workspace = true
solstone-core-journal-config.workspace = true
solstone-core-handoff-nonce.workspace = true
solstone-core-journal-config-write.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-offload.workspace = true
solstone-core-retention.workspace = true
solstone-core-sol-link = { workspace = true, default-features = false, features = ["host"] }
solstone-core-system.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dev-dependencies]
solstone-core-system = { workspace = true, features = ["test-hooks"] }

[dev-dependencies]
sha2.workspace = true
tempfile = "3.24.0"
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tower.workspace = true
solstone-core-convey-shell.workspace = true
solstone-core-backup-runtime = { path = "../solstone-core-backup-runtime", features = ["test-support"] }

[[test]]
name = "backup_web_callosum_transport"
path = "tests/backup_web_callosum_transport.rs"

[features]
full-tests = [
    "solstone-core-sol-link/test-hooks",
    "solstone-core-journal-io/test-hooks",
    "solstone-core-backup-runtime/test-hooks",
    "solstone-core-backup/full-tests",
]
