[package]
name = "solstone-core-brain-owner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Required, not cosmetic: wildcards = "deny" in deny.toml requires every
# workspace crate to opt out of publication until it has a reviewed package plan.
publish = false

[lints]
workspace = true

[features]
full-tests = []

[dependencies]
chrono.workspace = true
serde_json.workspace = true
solstone-core-brain.workspace = true
solstone-core-chatgpt-auth.workspace = true
solstone-core-generate.workspace = true
solstone-core-generate-wire.workspace = true
solstone-core-journal-config.workspace = true
solstone-core-journal-config-write.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-local.workspace = true
solstone-core-spp-ratls.workspace = true

[dev-dependencies]
solstone-core-journal-io = { workspace = true, features = ["test-hooks"] }
solstone-core-callosum = { workspace = true, features = ["wire", "test-hooks"] }
tempfile = "3.24.0"
