[package]
name = "solstone-core-transcribe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
test-hooks = []

[[test]]
name = "transcription_transports"
path = "tests/transcription_transports.rs"
required-features = ["test-hooks"]

[dependencies]
chrono = { workspace = true }
getrandom = { workspace = true }
nix = { workspace = true, features = ["process", "signal"] }
serde_json = { workspace = true }
sha2.workspace = true
solstone-core-observe-audio = { workspace = true }
solstone-core-system = { workspace = true }
solstone-core-speaker-id = { workspace = true }
solstone-core-processing-record = { workspace = true }
solstone-core-callosum = { workspace = true }
solstone-core-journal-config = { workspace = true }
solstone-core-journal-io = { workspace = true }
solstone-core-sound-tags = { workspace = true }
solstone-core-local = { workspace = true }
solstone-core-spp-ratls = { workspace = true }
tempfile = "3.24.0"
ureq = { workspace = true, features = ["multipart"] }

[dev-dependencies]
socket2 = { workspace = true }
solstone-core-spp-attest = { workspace = true }
solstone-core-spp-ratls = { workspace = true }

[lints]
workspace = true
