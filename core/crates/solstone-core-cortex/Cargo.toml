[package]
name = "solstone-core-cortex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
test-hooks = []

[dependencies]
chrono.workspace = true
log.workspace = true
serde_json.workspace = true
solstone-core-brain.workspace = true
solstone-core-callosum = { workspace = true, features = ["wire"] }
solstone-core-generate-wire.workspace = true
solstone-core-journal-cli.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-journal.workspace = true
solstone-core-spp-ratls.workspace = true
solstone-core-system.workspace = true
solstone-core-talent-cli.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["process", "signal"] }

[dev-dependencies]
tempfile = "3.24.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[target.'cfg(unix)'.dev-dependencies]
solstone-core-journal-io = { workspace = true, features = ["test-hooks"] }

[[bin]]
name = "solstone-cortex-controller"
path = "tests/bin/controller.rs"
test = false
required-features = ["test-hooks"]

[[bin]]
name = "solstone-cortex-worker"
path = "tests/bin/worker.rs"
test = false
required-features = ["test-hooks"]

[[test]]
name = "cortex_child_supervisor"
path = "tests/cortex_child_supervisor.rs"
required-features = ["test-hooks"]
