[package]
name = "solstone-core-callosum"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
# Deterministic in-crate wire tests (continuity markers, AC6 framing,
# AC8/9/11/17/18 in-memory counterparts):
# cargo test --manifest-path core/Cargo.toml -p solstone-core-callosum --features wire --locked --lib wire::tests::
wire = ["dep:tokio"]
# Hidden door for live-socket wire tests. Production crates must not enable this.
test-hooks = []
# Cross-language Callosum differentials (AC19-22), run by `make check-differentials`.
differential = ["wire"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
solstone-core-journal-io = { workspace = true }
tokio = { workspace = true, optional = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
regex.workspace = true
solstone-core-cogitate-wire.workspace = true
solstone-core-system = { workspace = true }

[[test]]
name = "callosum_cross_process"
path = "tests/callosum_cross_process.rs"
required-features = ["differential"]

[[test]]
name = "callosum_wire_component"
path = "tests/callosum_wire_component.rs"
required-features = ["test-hooks", "wire"]

[[test]]
name = "registry_conformance"
path = "tests/registry_conformance.rs"
required-features = ["differential"]

[lints]
workspace = true
