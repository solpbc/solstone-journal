[package]
name = "solstone-core-repository-contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
solstone-core-journal.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-sol-link = { workspace = true, default-features = true }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syn = { version = "2.0.119", features = ["full", "visit"] }
toml_edit = { workspace = true, features = ["serde"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["process", "resource", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp"] }

# Unsafe stays denied except the audited native loader/job boundaries.
[lints.rust]
unsafe_code = "deny"

[dev-dependencies]
tempfile = "3.24.0"

[features]
full-tests = []

# Native job containment needs Windows process handles and full-tests; it
# cannot run in the routine library harness or the POSIX policy harnesses.
[[test]]
name = "windows_process_tree"
required-features = ["full-tests"]
