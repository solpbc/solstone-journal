<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title></title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/tokens-dark.css">
  <style>
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: var(--font-body); margin: 0; padding: 1em; background: var(--paper); color: var(--ink);
    }
    input, select, textarea, button {
      background-color: var(--paper);
      color: var(--ink);
      border: 1px solid var(--hairline);
    }
    input[type="checkbox"], input[type="radio"] {
      accent-color: var(--orange-ink);
    }
    .init-container { max-width: 520px; width: 90vw; }
    h1 {
      text-align: center; font-family: var(--font-display); font-weight: 700;
      letter-spacing: 0.05em; color: var(--ink); font-size: 2.2rem;
      text-transform: lowercase; margin-bottom: 0.5rem;
    }
    h2 {
      font-family: var(--font-display); font-size: 1.25rem; font-weight: 600;
      border-bottom: 1px solid var(--hairline); padding-bottom: 0.5rem; margin-bottom: 0.75rem;
    }
    .error-message {
      margin-top: 0.75rem;
      padding: 0.75rem 0.9rem;
      border: 1px solid var(--danger);
      border-radius: 8px;
      background: var(--danger-wash);
      color: var(--danger);
      font-size: 0.85rem;
      line-height: 1.4;
    }
    .cta-button {
      display: inline-block; margin-top: 1rem; padding: 12px 24px; background: var(--orange);
      color: var(--ink-on-brand); border: none; border-radius: 8px; font-size: 0.95rem; cursor: pointer;
      font-family: var(--font-display); text-transform: lowercase;
    }
    .cta-button:hover { filter: brightness(0.94); }
    .cta-button:disabled { opacity: 0.5; cursor: not-allowed; }
    .settings-preset-btn {
      padding: 0.5em 0.9em; border: 1px solid var(--hairline-2); border-radius: 4px;
      background: var(--paper); color: var(--ink-soft-paper); cursor: pointer; font-size: 0.85rem;
    }
    .settings-preset-btn:hover { border-color: var(--ink-faint-paper); }
    .settings-preset-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .mark-display { display: flex; justify-content: center; min-height: 64px; margin: 0 0 0.85rem; }
    .mark-card { display: inline-flex; flex-direction: column; align-items: center; gap: 0.55rem; background: var(--cream-bright); border: 1px solid var(--hairline-2); border-radius: 12px; padding: 1.15rem 1.4rem; }
    .mark-chips { display: flex; gap: 0.7rem; }
    .mark-chip { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--hairline-2); border-radius: 12px; box-sizing: border-box; }
    .mark-chip svg { width: 28px; height: 28px; display: block; }
    .mark-words { display: flex; align-items: center; gap: 0.5rem; font-family: var(--font-display); font-size: 1.1rem; letter-spacing: .3px; color: var(--ink); }
    .mark-words .mark-sep { color: var(--ink-faint); }
    .mark-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.75rem; margin-top: 0.25rem; }
    .mark-permanence { flex-basis: 100%; text-align: center; font-size: 0.85rem; color: var(--ink-soft-paper); margin: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .mark-card.pop { animation: mark-pop .26s ease-out; }
      @keyframes mark-pop { from { opacity: 0; transform: translateY(4px) scale(.98); } to { opacity: 1; transform: none; } }
    }
    [hidden] { display: none !important; }
    body[data-recovery] #setup-heading,
    body[data-recovery] #welcome-beats,
    body[data-recovery] #section-machine-card,
    body[data-recovery] #setup-mark,
    body[data-recovery] #setup-thinking,
    body[data-recovery] #downloads,
    body[data-recovery] #setup-footer,
    body[data-recovery] #setup-help { display: none !important; }
    #setup-recovery label { display: block; margin-top: 1rem; }
    #setup-recovery input { display: block; box-sizing: border-box; width: 100%; min-height: 46px; padding: .6rem; font-size: 1rem; }
    #setup-recovery button { min-height: 46px; }
    #setup-recovery details { margin-top: 1rem; overflow-wrap: anywhere; }
    #setup-recovery summary { cursor: pointer; }
    .machine-card {
      margin-bottom: 2rem;
      padding: 1rem;
      border: 1px solid var(--hairline-2);
      border-radius: 8px;
      background: var(--cream-bright);
      color: var(--ink-soft-paper);
    }
    .machine-card-headline {
      margin: 0 0 0.75rem;
      color: var(--ink);
      font-size: 1.25rem;
      font-weight: 600;
      font-family: var(--font-display);
    }
    .machine-card p { margin: 0; font-size: 0.9rem; line-height: 1.5; }
    .setup-rows { margin: 0; display: grid; gap: 0.6rem; }
    .setup-row { display: grid; grid-template-columns: 9.5rem 1fr; gap: 0.75rem; align-items: baseline; }
    .setup-row dt { margin: 0; color: var(--ink); font-family: var(--font-display); font-weight: 600; font-size: 0.95rem; }
    .setup-row dd { margin: 0; font-size: 0.9rem; line-height: 1.5; }
    @media (max-width: 480px) {
      .setup-row { grid-template-columns: 1fr; gap: 0.1rem; }
    }
    .thinking-summary-row {
      display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem;
    }
    .thinking-summary-row p { margin: 0; }
    .radio-option {
      display: flex; align-items: flex-start; gap: 0.5rem; margin-bottom: 0.75rem; cursor: pointer;
    }
    .radio-content {
      display: flex; flex-direction: column; gap: 0.2rem;
    }
    .radio-label {
      font-weight: 500; color: var(--ink);
    }
    .radio-sub {
      font-size: 0.85rem; color: var(--ink-soft-paper);
    }
    .radio-desc {
      font-size: 0.8rem; color: var(--ink-faint-paper);
    }
    .local-reason { margin: -0.4rem 0 0.75rem; }
    #requirements-link { color: var(--orange-text-aa); }
    .download-row {
      margin-top: 0.5rem; font-size: 0.85rem;
    }
    .download-bar { display: block; width: 100%; height: 6px; margin: 0.35rem 0; accent-color: var(--orange-ink); }
    #setup-help { font-size: 0.8rem; color: var(--ink-faint-paper); margin-top: 0.5rem; text-align: center; }
    #setup-help a { color: var(--orange-text-aa); }
    #setup-footer {
      font-size: 0.8rem; color: var(--ink-faint-paper); margin-top: 1.5rem; text-align: center;
    }
  </style>
  <script src="/static/error-handler.js"></script>
  <script src="/static/api.js"></script>
</head>
<body>
  <main>
    <div class="init-container">
      <h1 id="setup-heading" tabindex="-1"></h1>

      <section id="setup-recovery" hidden aria-labelledby="recovery-heading">
        <h2 id="recovery-heading" tabindex="-1">restore your journal</h2>
        <p id="recovery-message" role="status" aria-live="polite">checking restore status...</p>
        <p id="recovery-source"></p>
        <form id="recovery-form" hidden>
          <label for="recovery-key">recovery key</label>
          <input id="recovery-key" type="password" autocomplete="off" spellcheck="false" required>
          <button id="recovery-show-key" type="button" class="settings-preset-btn" aria-pressed="false">show key</button>
          <details id="recovery-credentials" hidden>
            <summary>update storage credentials</summary>
            <label id="recovery-access-label" for="recovery-access">access key id</label>
            <input id="recovery-access" autocomplete="off" spellcheck="false">
            <label id="recovery-secret-label" for="recovery-secret">secret access key</label>
            <input id="recovery-secret" type="password" autocomplete="off" spellcheck="false">
            <button id="recovery-show-secret" type="button" class="settings-preset-btn" aria-pressed="false">show secret</button>
            <div id="recovery-region-row">
              <label for="recovery-region">region (optional)</label>
              <input id="recovery-region" autocomplete="off" spellcheck="false">
            </div>
          </details>
          <button id="recovery-continue" type="submit" class="cta-button">continue restore</button>
        </form>
        <button id="recovery-stop" type="button" class="settings-preset-btn" hidden>stop restore</button>
        <button id="recovery-check" type="button" class="settings-preset-btn">check restore status</button>
        <div id="recovery-error" class="error-message" role="alert" tabindex="-1" hidden></div>
        <details id="recovery-details" hidden><summary>restore details</summary><p id="recovery-selection"></p></details>
      </section>

      <div id="welcome-beats"></div>

      <section id="section-machine-card" class="machine-card" aria-labelledby="machine-card-headline">
        <h2 class="machine-card-headline" id="machine-card-headline"></h2>
        <dl class="setup-rows">
          <div class="setup-row">
            <dt id="fits-journal-term"></dt>
            <dd id="fits-journal"></dd>
          </div>
          <div class="setup-row">
            <dt id="fits-app-term"></dt>
            <dd id="fits-app"></dd>
          </div>
          <div class="setup-row">
            <dt id="fits-thinking-term"></dt>
            <dd id="fits-thinking"></dd>
          </div>
        </dl>
      </section>

      <section id="setup-mark" aria-labelledby="mark-title">
        <h2 id="mark-title" tabindex="-1"></h2>
        <p id="mark-help"></p>
        <div id="journal-mark-display" class="mark-display" aria-live="polite"></div>
        <div id="mark-error" class="error-message" role="alert" tabindex="-1" hidden></div>
        <button type="button" id="setup-retry" class="settings-preset-btn" hidden></button>
        <div class="mark-actions">
          <button type="button" id="mark-try-another" class="settings-preset-btn"></button>
          <button type="button" id="mark-continue" class="cta-button" disabled></button>
          <p id="mark-permanence" class="mark-permanence"></p>
        </div>
      </section>

      <section id="setup-thinking" hidden>
        <h2 id="thinking-title" tabindex="-1"></h2>
        <form id="thinking-form">
          <div class="thinking-summary-row">
            <p id="thinking-summary"></p>
            <button type="button" id="thinking-change" class="settings-preset-btn"></button>
          </div>
          <p id="thinking-choose-later" hidden></p>
          <div id="thinking-options" hidden></div>
          <p><a id="requirements-link" href="https://github.com/solpbc/solstone-journal/blob/main/INSTALL.md#choosing-a-provider" target="_blank" rel="noopener noreferrer">requirements</a></p>
          <button type="submit" id="thinking-continue" class="cta-button"></button>
          <div id="thinking-error" class="error-message" role="alert" tabindex="-1" hidden></div>
        </form>
      </section>

      <div id="downloads" hidden>
        <div id="download-thinking" class="download-row" hidden>
          <span class="download-label"></span>
          <span class="download-status"></span>
          <progress class="download-bar" hidden></progress>
          <button type="button" id="download-thinking-cancel" class="settings-preset-btn" hidden></button>
          <button type="button" id="download-thinking-retry" class="settings-preset-btn" hidden></button>
        </div>
        <div id="download-speech" class="download-row" hidden>
          <span class="download-label"></span>
          <span class="download-status"></span>
          <progress class="download-bar" hidden></progress>
          <button type="button" id="download-speech-retry" class="settings-preset-btn" hidden></button>
        </div>
      </div>

      <p id="setup-footer"></p>
      <p id="setup-help" hidden><span id="setup-help-text"></span> <a id="setup-help-link" target="_blank" rel="noopener noreferrer"></a></p>
    </div>
  </main>

  <script type="application/json" id="setup-copy-bootstrap"></script>

  <script>
    const STATE_POLL_MS = 1000;
    const STATE_READ_DEADLINE_MS = 8000;

    let setupState = null;
    let setupCopy = null;
    let displayGeneration = 0;
    let markRefreshSeq = 0;
    let displayedProposalId = null;
    let markIsLocked = false;
    let proposalMutationInFlight = false;
    let localCapability = null;
    let capabilityLoaded = false;
    let userPicked = false;
    let pickedChoice = null;
    let selectionEpoch = 0;
    let pollIntervalId = null;
    let stateReadInFlight = false;
    let thinkingContinueInFlight = false;
    let saveThinkingInFlight = false;
    let downloadsNeedReconciliation = false;
    let finalizeInFlight = false;
    let recoveryShown = false;
    let recoveryState = null;
    let recoveryBound = false;
    let recoveryRequestInFlight = false;

    let requestSeq = 0;
    let newestAppliedSeq = 0;
    let displayedThinkingAttemptId = null;
    let displayedSpeechAttemptId = null;
    const retiredSpeechAttemptIds = new Set();
    const retiredAttemptIds = new Set();
    const cancelledAttemptIds = new Set();
    const pendingCancelIds = new Set();

    function errorText(err) {
      if (!err) return '';
      if (typeof err.rawDetail === 'string' && err.rawDetail.trim()) return err.rawDetail;
      if (typeof err.serverMessage === 'string' && err.serverMessage.trim()) return err.serverMessage;
      if (typeof err.message === 'string' && err.message.trim()) return err.message;
      return String(err);
    }

    function formatByteSize(bytes) {
      if (typeof bytes !== 'number' || !Number.isFinite(bytes) || bytes < 0) return null;
      if (bytes < 1000) return `${bytes} B`;
      const units = ['KB', 'MB', 'GB', 'TB'];
      let val = bytes / 1000;
      let unitIdx = 0;
      while (val >= 1000 && unitIdx < units.length - 1) {
        val /= 1000;
        unitIdx++;
      }
      const formatted = Number.isInteger(val) ? String(val) : (Math.round(val * 10) / 10).toFixed(1);
      return `${formatted} ${units[unitIdx]}`;
    }

    // "downloading… 239.4 MB / 980.9 MB" over a bar, never raw byte counts.
    function renderDownloadProgress(row, status, job) {
      const progress = (setupCopy && setupCopy.downloads && setupCopy.downloads.progress) || '';
      const done = formatByteSize(job.bytes_done);
      const total = formatByteSize(job.bytes_total);
      const sizes = done && total ? `${done} / ${total}` : (done || '');
      status.textContent = [progress, sizes].filter(Boolean).join(' ');
      const bar = row.querySelector('.download-bar');
      if (!bar) return;
      bar.hidden = false;
      if (typeof job.bytes_total === 'number' && job.bytes_total > 0 && typeof job.bytes_done === 'number') {
        bar.max = job.bytes_total;
        bar.value = Math.min(job.bytes_done, job.bytes_total);
      } else if (typeof bar.removeAttribute === 'function') {
        bar.removeAttribute('value');
      }
    }

    function hideDownloadBar(row) {
      const bar = row.querySelector('.download-bar');
      if (bar) bar.hidden = true;
    }

    async function apiCall(endpoint, options = {}) {
      const opts = { ...options, noAuthRedirect: true };
      return await window.apiJson(endpoint, opts);
    }

    function recoveryError(message) {
      const error = document.getElementById('recovery-error');
      error.textContent = message;
      error.hidden = !message;
    }

    function showRecovery(state) {
      recoveryShown = true;
      recoveryState = state;
      for (const id of ['setup-heading', 'welcome-beats', 'section-machine-card', 'setup-mark', 'setup-thinking', 'downloads', 'setup-footer']) {
        document.getElementById(id).hidden = true;
      }
      document.getElementById('setup-recovery').hidden = false;
      const active = state.in_progress === true;
      const ready = state.recovery === 'pending' && state.source && state.in_progress === false;
      document.getElementById('recovery-form').hidden = !ready;
      document.getElementById('recovery-stop').hidden = !active;
      document.getElementById('recovery-continue').disabled = recoveryRequestInFlight;
      document.getElementById('recovery-message').textContent = active
        ? 'restoring your journal...'
        : recoveryRequestInFlight ? 'starting restore...'
        : ready ? "the restore hasn't finished. enter your recovery key to continue."
        : state.recovery === 'unavailable'
          ? "the restore record can't be read. your journal isn't ready to use."
          : 'checking restore status...';
      const source = state.source;
      document.getElementById('recovery-source').textContent = source && source.kind === 'byo' ? source.repository : '';
      document.getElementById('recovery-credentials').hidden = !source || source.kind !== 'byo';
      const b2 = source && source.backend === 'b2';
      document.getElementById('recovery-access-label').textContent = b2 ? 'account id' : 'access key id';
      document.getElementById('recovery-secret-label').textContent = b2 ? 'application key' : 'secret access key';
      document.getElementById('recovery-region-row').hidden = b2;
      document.getElementById('recovery-details').hidden = !state.snapshot_id;
      document.getElementById('recovery-selection').textContent = state.snapshot_id ? `${state.snapshot_id}\n${state.subtree}` : '';
      if (!recoveryBound) {
        recoveryBound = true;
        document.getElementById('recovery-check').addEventListener('click', runInitialStateRead);
        for (const [button, input, show, hide] of [
          ['recovery-show-key', 'recovery-key', 'show key', 'hide key'],
          ['recovery-show-secret', 'recovery-secret', 'show secret', 'hide secret'],
        ]) {
          document.getElementById(button).addEventListener('click', () => {
            const field = document.getElementById(input);
            const visible = field.type === 'password';
            field.type = visible ? 'text' : 'password';
            document.getElementById(button).textContent = visible ? hide : show;
            document.getElementById(button).setAttribute('aria-pressed', String(visible));
          });
        }
        document.getElementById('recovery-form').addEventListener('submit', async event => {
          event.preventDefault();
          if (recoveryRequestInFlight || !recoveryState || recoveryState.in_progress !== false) return;
          const source = recoveryState.source;
          const key = document.getElementById('recovery-key').value.trim();
          if (!key) { recoveryError('enter your recovery key.'); return; }
          const payload = { recovery_key: key, snapshot_id: recoveryState.snapshot_id, subtree: recoveryState.subtree };
          if (source && source.kind === 'byo') {
            const access = document.getElementById('recovery-access').value.trim();
            const secret = document.getElementById('recovery-secret').value.trim();
            if (!!access !== !!secret) { recoveryError('enter both storage credentials.'); return; }
            if (access && secret) {
              payload.kind = 'byo'; payload.repository = source.repository; payload.backend = source.backend;
              payload.credentials = source.backend === 'b2' ? {account_id: access, account_key: secret} : {access_key_id: access, secret_access_key: secret};
              const region = document.getElementById('recovery-region').value.trim();
              if (source.backend === 's3' && region) payload.credentials.region = region;
            }
          }
          for (const id of ['recovery-key', 'recovery-access', 'recovery-secret', 'recovery-region']) document.getElementById(id).value = '';
          recoveryRequestInFlight = true; recoveryError(''); showRecovery(recoveryState);
          try {
            await apiCall('/init/api/recovery/retry', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
          } catch (error) {
            recoveryError(error.serverMessage || "the restore result couldn't be read. check restore status.");
          } finally {
            recoveryRequestInFlight = false;
            showRecovery(recoveryState);
            runInitialStateRead();
          }
        });
        document.getElementById('recovery-stop').addEventListener('click', async () => {
          const button = document.getElementById('recovery-stop');
          button.disabled = true;
          try {
            await apiCall('/init/api/recovery/stop', {method: 'POST'});
          } catch (error) { recoveryError(error.serverMessage || "the stop result couldn't be read. check restore status."); }
          finally { button.disabled = false; runInitialStateRead(); }
        });
      }
      managePollInterval();
    }

    async function postAction(payload) {
      return await apiCall('/init/api/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    }

    function showMarkError(msg) {
      const el = document.getElementById('mark-error');
      if (el) {
        el.textContent = msg || '';
        el.hidden = !msg;
        if (msg) {
          const retry = document.getElementById('setup-retry');
          if (retry) retry.hidden = false;
          if (typeof el.focus === 'function') el.focus();
        }
      }
    }

    function clearMarkError() {
      showMarkError('');
    }

    function showThinkingError(msg) {
      const el = document.getElementById('thinking-error');
      if (el) {
        el.textContent = msg || '';
        el.hidden = !msg;
        if (msg && typeof el.focus === 'function') {
          el.focus();
        }
      }
    }

    function clearThinkingError() {
      showThinkingError('');
    }

    function showCurrentError(msg) {
      const thinkingSec = document.getElementById('setup-thinking');
      if (thinkingSec && !thinkingSec.hidden) {
        showThinkingError(msg);
      } else {
        showMarkError(msg);
      }
    }

    function updateMarkButtons() {
      const tryAnother = document.getElementById('mark-try-another');
      const continueBtn = document.getElementById('mark-continue');
      if (tryAnother) {
        tryAnother.disabled = proposalMutationInFlight || !displayedProposalId;
        if (markIsLocked) {
          tryAnother.hidden = true;
        }
      }
      const retry = document.getElementById('setup-retry');
      if (retry) retry.disabled = proposalMutationInFlight;
      if (continueBtn) {
        continueBtn.disabled = proposalMutationInFlight || !displayedProposalId;
      }
    }

    function renderMark(spec) {
      const display = document.getElementById('journal-mark-display');
      if (!display) return false;
      if (!spec || !spec.icon1 || !spec.icon2 || !Array.isArray(spec.words) || spec.words.length !== 2) {
        display.innerHTML = '';
        return false;
      }
      const icons = [spec.icon1, spec.icon2];
      const words = spec.words;
      display.innerHTML = '<div class="mark-card pop" role="img"><div class="mark-chips"><div class="mark-chip"></div><div class="mark-chip"></div></div><div class="mark-words"><span></span><span class="mark-sep">·</span><span></span></div></div>';
      const card = display.querySelector('.mark-card');
      if (card && icons[0].color && icons[1].color) {
        card.setAttribute('aria-label', `${icons[0].color.name}, ${icons[1].color.name} · ${words[0]} ${words[1]}`);
      }
      const chips = display.querySelectorAll('.mark-chip');
      chips.forEach((chip, index) => {
        const icon = icons[index];
        if (!icon || !icon.color) return;
        chip.style.borderColor = icon.color.hex;
        chip.style.background = icon.color.hex + '1f';
        if (icon.rot === 45) chip.style.transform = 'rotate(45deg)';
        chip.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="${icon.color.hex}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon.svg}</svg>`;
      });
      const wordSpans = display.querySelectorAll('.mark-words span:not(.mark-sep)');
      if (wordSpans.length >= 2) {
        wordSpans[0].textContent = words[0];
        wordSpans[1].textContent = words[1];
      }
      return wordSpans.length === 2 && chips.length === 2;
    }

    function isValidMarkSnapshot(markObj) {
      if (!markObj || !['proposed', 'locked'].includes(markObj.state)) return false;
      const nonblank = value => typeof value === 'string' && value.trim().length > 0;
      if (!nonblank(markObj.proposal_id)) return false;
      const r = markObj.render;
      if (!r || !Array.isArray(r.words) || r.words.length !== 2 || !r.words.every(nonblank)) return false;
      const glyph = /^(?:\s*<(?:path\s+d="[Mm][0-9a-z .,+-]*"|(?:circle|ellipse|rect)(?:\s+(?:cx|cy|r|rx|ry|x|y|width|height)="[-0-9.]+")+)\s*\/>\s*)+$/i;
      return [r.icon1, r.icon2].every(icon => icon && nonblank(icon.svg)
        && glyph.test(icon.svg) && icon.color && nonblank(icon.color.name)
        && typeof icon.color.hex === 'string' && /^#[0-9a-f]{6}$/i.test(icon.color.hex));
    }

    function adoptMark(markObj) {
      if (markObj && markObj.state === 'locked') markIsLocked = true;
      if (markIsLocked && markObj && markObj.state !== 'locked') return false;
      if (!isValidMarkSnapshot(markObj) || !renderMark(markObj.render)) {
        showMarkError((setupCopy && setupCopy.mark && setupCopy.mark.error) || '');
        displayedProposalId = null;
        document.getElementById('journal-mark-display').innerHTML = '';
        const retry = document.getElementById('setup-retry');
        if (retry) retry.hidden = false;
        updateMarkButtons();
        return false;
      }
      clearMarkError();
      displayGeneration++;
      displayedProposalId = markObj.proposal_id;
      markIsLocked = markObj.state === 'locked';
      const retry = document.getElementById('setup-retry');
      if (retry) retry.hidden = true;
      updateMarkButtons();
      return true;
    }

    function renderThinkingOptions() {
      const container = document.getElementById('thinking-options');
      if (!container || !setupCopy || !setupCopy.thinking) return;
      if (container.children.length > 0) return;

      const choices = Array.isArray(setupCopy.thinking.choices) ? setupCopy.thinking.choices : [];
      choices.forEach(choice => {
        const label = document.createElement('label');
        label.className = 'radio-option';
        const input = document.createElement('input');
        input.type = 'radio';
        input.name = 'thinking-choice';
        input.value = choice.id;
        input.addEventListener('change', () => {
          if (input.checked) {
            clearThinkingError();
            userPicked = true;
            pickedChoice = choice.id;
            selectionEpoch++;
            renderThinkingUI();
          }
        });
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            handleThinkingSubmit();
          }
        });

        const wrap = document.createElement('div');
        wrap.className = 'radio-content';

        const labelSpan = document.createElement('span');
        labelSpan.className = 'radio-label';
        labelSpan.textContent = choice.label || choice.id;
        wrap.appendChild(labelSpan);

        if (choice.sub) {
          const subSpan = document.createElement('span');
          subSpan.className = 'radio-sub';
          subSpan.textContent = choice.sub;
          wrap.appendChild(subSpan);
        }

        if (choice.description) {
          const descSpan = document.createElement('span');
          descSpan.className = 'radio-desc';
          descSpan.textContent = choice.description;
          wrap.appendChild(descSpan);
        }

        label.append(input, wrap);
        container.appendChild(label);

        // Why local isn't offered sits beside the choice, outside it, so a
        // computer that can't run local reads a plain line, never a greyed choice.
        if (choice.id === 'local') {
          const reasonEl = document.createElement('p');
          reasonEl.className = 'radio-desc local-reason';
          reasonEl.id = 'thinking-local-reason';
          reasonEl.hidden = true;
          container.appendChild(reasonEl);
        }
      });

      const laterLabel = document.createElement('label');
      laterLabel.className = 'radio-option';
      const laterInput = document.createElement('input');
      laterInput.type = 'radio';
      laterInput.name = 'thinking-choice';
      laterInput.value = 'later';
      laterInput.addEventListener('change', () => {
        if (laterInput.checked) {
          clearThinkingError();
          userPicked = true;
          pickedChoice = 'later';
          selectionEpoch++;
          renderThinkingUI();
        }
      });
      laterInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          handleThinkingSubmit();
        }
      });
      const laterSpan = document.createElement('span');
      laterSpan.textContent = (setupCopy && setupCopy.thinking && setupCopy.thinking.later) || '';
      laterLabel.append(laterInput, laterSpan);
      container.appendChild(laterLabel);
    }

    function localChoiceAdmitted(capability) {
      return capability.overall === 'ok'
        || (capability.overall === 'unknown' && capability.local_admitted === true);
    }

    function renderThinkingUI() {
      renderThinkingOptions();

      if (localCapability !== null && !localChoiceAdmitted(localCapability)) {
        if (userPicked && pickedChoice === 'local') {
          userPicked = false;
          pickedChoice = null;
        }
        if (setupState && setupState.thinking && setupState.thinking.choice === 'local') {
          setupState.thinking.saved = false;
          setupState.thinking.choice = null;
        }
      }

      const stateCapability = (setupState && setupState.thinking && setupState.thinking.capability) || 'unknown';
      const localSelectable = (localCapability === null)
        ? (stateCapability !== 'blocked')
        : localChoiceAdmitted(localCapability);
      const isBlocked = !localSelectable;

      const saved = setupState && setupState.thinking && setupState.thinking.saved === true && ['local', 'byo', 'spp', 'later'].includes(setupState.thinking.choice);
      const savedChoice = saved ? setupState.thinking.choice : null;

      const summaryEl = document.getElementById('thinking-summary');
      const chooseLaterEl = document.getElementById('thinking-choose-later');
      const changeBtn = document.getElementById('thinking-change');

      const activeChoiceId = userPicked ? pickedChoice : savedChoice;

      if (activeChoiceId === 'byo' || activeChoiceId === 'spp') {
        const choiceObj = setupCopy && setupCopy.thinking && Array.isArray(setupCopy.thinking.choices)
          ? setupCopy.thinking.choices.find(c => c.id === activeChoiceId)
          : null;
        if (summaryEl) {
          summaryEl.textContent = (choiceObj && choiceObj.label) || activeChoiceId;
          summaryEl.hidden = false;
        }
        if (chooseLaterEl) chooseLaterEl.hidden = true;
        if (changeBtn) changeBtn.hidden = false;
      } else if (activeChoiceId === 'later') {
        if (summaryEl) {
          summaryEl.textContent = (setupCopy && setupCopy.thinking && setupCopy.thinking.choose_later) || '';
          summaryEl.hidden = false;
        }
        if (chooseLaterEl) chooseLaterEl.hidden = true;
        if (changeBtn) changeBtn.hidden = false;
      } else if (activeChoiceId === 'local' || (!activeChoiceId && localSelectable && stateCapability === 'ok')) {
        const bytes = setupState && setupState.thinking && setupState.thinking.download_bytes;
        const isFiniteBytes = typeof bytes === 'number' && Number.isFinite(bytes);
        const formatted = isFiniteBytes ? formatByteSize(bytes) : null;
        const sizeStr = (formatted !== null) ? formatted : ((setupCopy && setupCopy.thinking && setupCopy.thinking.size_unknown) || '');
        if (summaryEl) {
          if (setupCopy && setupCopy.thinking && setupCopy.thinking.default_line) {
            summaryEl.textContent = setupCopy.thinking.default_line.replace('{size}', sizeStr);
          } else {
            summaryEl.textContent = sizeStr;
          }
          summaryEl.hidden = false;
        }
        if (chooseLaterEl) chooseLaterEl.hidden = true;
        if (changeBtn) changeBtn.hidden = false;
      } else {
        if (summaryEl) {
          summaryEl.textContent = (setupCopy && setupCopy.thinking && setupCopy.thinking.choose_later) || '';
          summaryEl.hidden = false;
        }
        if (chooseLaterEl) {
          chooseLaterEl.textContent = '';
          chooseLaterEl.hidden = true;
        }
        if (changeBtn) changeBtn.hidden = false;
      }

      const localInput = document.querySelector('input[value="local"]');
      if (localInput) {
        localInput.disabled = isBlocked;
        const localLabel = localInput.parentElement || localInput.parent;
        if (localLabel) {
          localLabel.hidden = isBlocked;
          if (localLabel.classList) {
            if (isBlocked) {
              localLabel.classList.add('is-unavailable');
            } else {
              localLabel.classList.remove('is-unavailable');
            }
          }
        }
      }

      let reasonDetail = '';
      if (localCapability !== null && localCapability.overall !== 'ok') {
        if (Array.isArray(localCapability.checks)) {
          const nonOkChecks = localCapability.checks.filter(
            c => c && c.severity !== 'ok' && typeof c.detail === 'string' && c.detail.trim()
          );
          if (nonOkChecks.length > 0) {
            reasonDetail = nonOkChecks.map(c => c.detail.trim()).join(' ');
          }
        }
        if (!reasonDetail && setupCopy && setupCopy.thinking && typeof setupCopy.thinking.check_unknown === 'string') {
          reasonDetail = setupCopy.thinking.check_unknown.trim();
        }
      }

      const reasonEl = document.getElementById('thinking-local-reason');
      if (reasonEl) {
        if (reasonDetail) {
          reasonEl.textContent = reasonDetail;
          reasonEl.hidden = false;
        } else {
          reasonEl.textContent = '';
          reasonEl.hidden = true;
        }
      }

      const defaultChoice = (stateCapability === 'ok' && localSelectable) ? 'local' : null;
      const radioValueToSelect = userPicked ? pickedChoice : (savedChoice ? savedChoice : defaultChoice);
      const radios = document.querySelectorAll('input[name="thinking-choice"]');
      radios.forEach(radio => {
        radio.checked = Boolean(radioValueToSelect && radio.value === radioValueToSelect);
      });
    }

    async function loadLocalCapabilityOnce() {
      if (capabilityLoaded) return;
      capabilityLoaded = true;
      try {
        const res = await apiCall('/init/api/local-capability');
        localCapability = res;
      } catch (_) {
        localCapability = {
          overall: (setupState && setupState.thinking && setupState.thinking.capability) || 'unknown',
          checks: []
        };
      }
      renderThinkingUI();
    }

    function showThinkingSection() {
      const markSec = document.getElementById('setup-mark');
      if (markSec) markSec.hidden = true;
      const thinkingSec = document.getElementById('setup-thinking');
      if (thinkingSec) {
        thinkingSec.hidden = false;
        const title = document.getElementById('thinking-title');
        if (title && typeof title.focus === 'function') title.focus();
      }
      loadLocalCapabilityOnce();
      renderThinkingUI();
    }

    function applyDownloadsSnapshot(incomingDownloads, seq) {
      if (!incomingDownloads) return;
      if (typeof seq === 'number' && seq < newestAppliedSeq) return;
      if (typeof seq === 'number') {
        newestAppliedSeq = seq;
      }
      if (!setupState) {
        setupState = { downloads: incomingDownloads };
      }
      if (!setupState.downloads) {
        setupState.downloads = incomingDownloads;
      }

      const speech = incomingDownloads.speech;
      if (speech && !retiredSpeechAttemptIds.has(speech.attempt_id)
          && !(speech.state === 'idle' && !speech.attempt_id && displayedSpeechAttemptId)) {
        if (speech.attempt_id && speech.attempt_id !== displayedSpeechAttemptId) {
          if (displayedSpeechAttemptId) retiredSpeechAttemptIds.add(displayedSpeechAttemptId);
          displayedSpeechAttemptId = speech.attempt_id;
        }
        setupState.downloads.speech = speech;
      }

      const incomingThinking = incomingDownloads.thinking;
      if (incomingThinking) {
        const incId = incomingThinking.attempt_id;
        const isRetired = incId && retiredAttemptIds.has(incId);

        if (isRetired) {
          // ignore retired thinking snapshot
        } else if (!incId && displayedThinkingAttemptId && incomingThinking.state === 'idle') {
          // do not revert an active attempt to idle
        } else {
          if (incId) {
            if (displayedThinkingAttemptId && displayedThinkingAttemptId !== incId) {
              retiredAttemptIds.add(displayedThinkingAttemptId);
            }
            displayedThinkingAttemptId = incId;
          }
          let effThinking = { ...incomingThinking };
          if (incId && cancelledAttemptIds.has(incId) && effThinking.state === 'downloading') {
            effThinking.state = 'cancelled';
          }
          if (effThinking.state === 'cancelled' && incId) {
            cancelledAttemptIds.add(incId);
          }
          setupState.downloads.thinking = effThinking;
        }
      }

      updateDownloadsUI();
    }

    function applyActionDownloads(downloads, seq) {
      if (seq < newestAppliedSeq) {
        // Delivery order does not make an old action snapshot authoritative.
        // Ask the journal again, including when the last read said idle.
        reconcileDownloadsSoon();
      } else {
        applyDownloadsSnapshot(downloads, seq);
      }
    }

    function mergeSetupResponse(response) {
      const downloads = setupState && setupState.downloads;
      setupState = response ? { ...response, downloads } : response;
    }

    function reconcileDownloadsSoon() {
      downloadsNeedReconciliation = true;
      managePollInterval();
    }

    function updateDownloadsUI() {
      const downloadsContainer = document.getElementById('downloads');
      if (!downloadsContainer || !setupState || !setupState.downloads) return;

      const downloads = setupState.downloads;
      const thinking = downloads.thinking || { state: 'idle' };
      const speech = downloads.speech || { state: 'idle' };

      const activeStates = ['downloading', 'complete', 'error', 'cancelled'];
      const hasActive = activeStates.includes(thinking.state) || activeStates.includes(speech.state);
      downloadsContainer.hidden = !hasActive;

      // Thinking row
      const tRow = document.getElementById('download-thinking');
      if (tRow) {
        if (!activeStates.includes(thinking.state)) {
          tRow.hidden = true;
        } else {
          tRow.hidden = false;
          const label = tRow.querySelector('.download-label');
          if (label && setupCopy && setupCopy.downloads) label.textContent = setupCopy.downloads.thinking || '';
          const status = tRow.querySelector('.download-status');

          if (thinking.state === 'cancelled' && displayedThinkingAttemptId) {
            cancelledAttemptIds.add(displayedThinkingAttemptId);
          }

          const cancelBtn = document.getElementById('download-thinking-cancel');
          const retryBtn = document.getElementById('download-thinking-retry');

          if (thinking.state !== 'downloading') hideDownloadBar(tRow);
          if (thinking.state === 'downloading') {
            renderDownloadProgress(tRow, status, thinking);
            if (cancelBtn) {
              cancelBtn.hidden = displayedThinkingAttemptId ? cancelledAttemptIds.has(displayedThinkingAttemptId) : false;
              cancelBtn.disabled = pendingCancelIds.has(displayedThinkingAttemptId);
            }
            if (retryBtn) retryBtn.hidden = true;
          } else if (thinking.state === 'complete') {
            status.textContent = (setupCopy && setupCopy.downloads && setupCopy.downloads.complete) || '';
            if (cancelBtn) cancelBtn.hidden = true;
            if (retryBtn) retryBtn.hidden = true;
          } else if (thinking.state === 'cancelled') {
            status.textContent = (setupCopy && setupCopy.downloads && setupCopy.downloads.cancelled) || '';
            if (cancelBtn) cancelBtn.hidden = true;
            if (retryBtn) {
              retryBtn.hidden = false;
              retryBtn.textContent = (setupCopy && setupCopy.downloads && setupCopy.downloads.retry) || '';
              retryBtn.disabled = false;
            }
          } else if (thinking.state === 'error') {
            status.textContent = (setupCopy && setupCopy.downloads && setupCopy.downloads.error) || '';
            if (cancelBtn) cancelBtn.hidden = true;
            if (retryBtn) {
              retryBtn.hidden = false;
              retryBtn.textContent = (setupCopy && setupCopy.downloads && setupCopy.downloads.retry) || '';
              retryBtn.disabled = false;
            }
          }
        }
      }

      // Speech row
      const sRow = document.getElementById('download-speech');
      if (sRow) {
        if (!activeStates.includes(speech.state)) {
          sRow.hidden = true;
        } else {
          sRow.hidden = false;
          const sLabel = sRow.querySelector('.download-label');
          const status = sRow.querySelector('.download-status');
          const retryBtn = document.getElementById('download-speech-retry');

          if (speech.state !== 'downloading') hideDownloadBar(sRow);
          if (speech.state === 'downloading') {
            if (sLabel) {
              sLabel.textContent = (setupCopy && setupCopy.downloads && setupCopy.downloads.speech) || '';
              sLabel.hidden = false;
            }
            renderDownloadProgress(sRow, status, speech);
            if (retryBtn) retryBtn.hidden = true;
          } else if (speech.state === 'complete') {
            if (sLabel) {
              sLabel.textContent = (setupCopy && setupCopy.downloads && setupCopy.downloads.speech) || '';
              sLabel.hidden = false;
            }
            status.textContent = (setupCopy && setupCopy.downloads && setupCopy.downloads.complete) || '';
            if (retryBtn) retryBtn.hidden = true;
          } else if (speech.state === 'cancelled') {
            if (sLabel) {
              sLabel.textContent = (setupCopy && setupCopy.downloads && setupCopy.downloads.speech) || '';
              sLabel.hidden = false;
            }
            status.textContent = (setupCopy && setupCopy.downloads && setupCopy.downloads.cancelled) || '';
            if (retryBtn) retryBtn.hidden = true;
          } else if (speech.state === 'error') {
            if (speech.error && speech.error.code === 'speech_package_unavailable') {
              if (sLabel) {
                sLabel.textContent = '';
                sLabel.hidden = true;
              }
              status.textContent = (speech.error && speech.error.detail) || '';
              if (retryBtn) retryBtn.hidden = true;
            } else {
              if (sLabel) {
                sLabel.textContent = (setupCopy && setupCopy.downloads && setupCopy.downloads.speech) || '';
                sLabel.hidden = false;
              }
              status.textContent = (setupCopy && setupCopy.downloads && setupCopy.downloads.error) || '';
              if (retryBtn) {
                retryBtn.hidden = false;
                retryBtn.disabled = false;
              }
            }
          }
        }
      }

      managePollInterval();
    }

    function shouldPoll() {
      if (recoveryShown) return true;
      if (saveThinkingInFlight || downloadsNeedReconciliation) return true;
      if (!setupState || !setupState.downloads) return false;
      const d = setupState.downloads;
      const thinkingDownloading = d.thinking && d.thinking.state === 'downloading';
      const speechDownloading = d.speech && d.speech.state === 'downloading';
      const speechAwaitingAdmission = d.speech && d.speech.state === 'idle' && setupState.done !== true;
      return thinkingDownloading || speechDownloading || speechAwaitingAdmission;
    }

    function managePollInterval() {
      if (shouldPoll()) {
        if (pollIntervalId === null) {
          pollIntervalId = setInterval(pollTick, STATE_POLL_MS);
        }
      } else {
        if (pollIntervalId !== null) {
          clearInterval(pollIntervalId);
          pollIntervalId = null;
        }
      }
    }

    async function pollTick() {
      if (stateReadInFlight) return;
      stateReadInFlight = true;
      const seq = ++requestSeq;
      const reconciling = downloadsNeedReconciliation;
      downloadsNeedReconciliation = false;

      const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
      let deadlineTimeout = null;
      if (controller) {
        deadlineTimeout = setTimeout(() => {
          controller.abort();
        }, STATE_READ_DEADLINE_MS);
      }

      try {
        const opts = controller ? { signal: controller.signal } : {};
        const freshState = await apiCall('/init/api/state', opts);
        if (deadlineTimeout) clearTimeout(deadlineTimeout);
        if (freshState && freshState.recovery) { showRecovery(freshState); return; }
        if (recoveryShown) { window.location.href = freshState && freshState.done && freshState.redirect ? freshState.redirect : '/init'; return; }
        if (freshState && freshState.downloads) {
          applyDownloadsSnapshot(freshState.downloads, seq);
        }
      } catch (err) {
        if (deadlineTimeout) clearTimeout(deadlineTimeout);
        if (reconciling) downloadsNeedReconciliation = true;
        if (recoveryShown) recoveryError(errorText(err));
        else showCurrentError(errorText(err));
      } finally {
        stateReadInFlight = false;
        managePollInterval();
      }
    }

    async function runInitialStateRead() {
      if (stateReadInFlight || proposalMutationInFlight) return;
      proposalMutationInFlight = true;
      updateMarkButtons();
      stateReadInFlight = true;
      let ownsStateRead = true;
      const seq = ++requestSeq;

      const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
      let didAbort = false;
      let deadlineTimeout = null;
      if (controller) {
        deadlineTimeout = setTimeout(() => {
          didAbort = true;
          controller.abort();
        }, STATE_READ_DEADLINE_MS);
      }

      try {
        const opts = controller ? { signal: controller.signal } : {};
        const freshState = await apiCall('/init/api/state', opts);
        stateReadInFlight = false;
        ownsStateRead = false;
        if (deadlineTimeout) clearTimeout(deadlineTimeout);
        if (didAbort || (controller && controller.signal.aborted)) {
          return;
        }

        if (freshState && freshState.recovery) { showRecovery(freshState); return; }
        if (recoveryShown) { window.location.href = freshState && freshState.done && freshState.redirect ? freshState.redirect : '/init'; return; }

        if (freshState && freshState.done === true && freshState.redirect) {
          window.location.href = freshState.redirect;
          return;
        }
        const setupRetry = document.getElementById('setup-retry');
        if (setupRetry) setupRetry.hidden = true;

        setupState = freshState;
        if (freshState && freshState.copy) {
          setupCopy = freshState.copy;
          applyCopy();
        }
        if (freshState && freshState.downloads) {
          applyDownloadsSnapshot(freshState.downloads, seq);
        }

        const mark = freshState && freshState.mark;
        if (!mark) {
          adoptMark(null);
        } else if (mark.state === 'locked') {
          if (adoptMark(mark)) showThinkingSection();
        } else if (mark.state === 'unavailable') {
          proposalMutationInFlight = true;
          updateMarkButtons();
          try {
            const actionSeq = ++requestSeq;
            const res = await postAction({ action: 'regenerate_mark' });
            mergeSetupResponse(res);
            if (res.downloads) applyActionDownloads(res.downloads, actionSeq);
            adoptMark(res.mark);
          } catch (err) {
            showMarkError(errorText(err));
          }
        } else {
          adoptMark(mark);
        }
      } catch (err) {
        if (deadlineTimeout) clearTimeout(deadlineTimeout);
        showMarkError(errorText(err));
        const setupRetry = document.getElementById('setup-retry');
        if (setupRetry) {
          setupRetry.hidden = false;
          setupRetry.disabled = false;
        }
      } finally {
        if (ownsStateRead) stateReadInFlight = false;
        proposalMutationInFlight = false;
        updateMarkButtons();
        if (deadlineTimeout) clearTimeout(deadlineTimeout);
      }
    }

    async function handleThinkingSubmit(e) {
      if (e && typeof e.preventDefault === 'function') e.preventDefault();
      if (thinkingContinueInFlight || finalizeInFlight) return;
      thinkingContinueInFlight = true;
      const thinkingContinueBtn = document.getElementById('thinking-continue');
      if (thinkingContinueBtn) thinkingContinueBtn.disabled = true;
      clearThinkingError();

      const currentEpoch = selectionEpoch;
      const stateCap = (setupState && setupState.thinking && setupState.thinking.capability) || 'unknown';
      const localAdmitted = (localCapability === null) ? (stateCap === 'ok') : localChoiceAdmitted(localCapability);
      const defaultsToLocal = (localCapability === null) ? (stateCap === 'ok') : (localCapability.overall === 'ok');
      const saved = setupState && setupState.thinking && setupState.thinking.saved === true && ['local', 'byo', 'spp', 'later'].includes(setupState.thinking.choice);
      let chosen = userPicked ? pickedChoice : (saved ? setupState.thinking.choice : (defaultsToLocal ? 'local' : 'later'));
      if (chosen === 'local' && !localAdmitted) chosen = 'later';
      const effectiveChoice = chosen;
      const needsSave = !saved || (userPicked && pickedChoice !== setupState.thinking.choice);

      if (needsSave) {
        saveThinkingInFlight = true;
        managePollInterval();
        const seq = ++requestSeq;
        try {
          const saveRes = await postAction({ action: 'save_thinking', choice: effectiveChoice });
          saveThinkingInFlight = false;
          if (saveRes && saveRes.downloads) applyActionDownloads(saveRes.downloads, seq);
          managePollInterval();
          if (currentEpoch !== selectionEpoch) {
            thinkingContinueInFlight = false;
            if (thinkingContinueBtn) thinkingContinueBtn.disabled = false;
            return;
          }
          const existingDownloads = setupState ? setupState.downloads : undefined;
          setupState = saveRes ? {
            ...saveRes,
            downloads: existingDownloads
          } : saveRes;
        } catch (err) {
          saveThinkingInFlight = false;
          reconcileDownloadsSoon();
          thinkingContinueInFlight = false;
          if (thinkingContinueBtn) thinkingContinueBtn.disabled = false;
          showThinkingError(errorText(err));
          return;
        }
      }

      finalizeInFlight = true;
      try {
        const finRes = await postAction({ action: 'finalize' });
        thinkingContinueInFlight = false;
        finalizeInFlight = false;
        if (thinkingContinueBtn) thinkingContinueBtn.disabled = false;
        if (finRes && finRes.done === true && currentEpoch === selectionEpoch) {
          if (finRes.redirect) {
            window.location.href = finRes.redirect;
          }
        }
      } catch (err) {
        thinkingContinueInFlight = false;
        finalizeInFlight = false;
        if (thinkingContinueBtn) thinkingContinueBtn.disabled = false;
        showThinkingError(errorText(err));
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const bootstrapEl = document.getElementById('setup-copy-bootstrap');
      if (bootstrapEl && typeof bootstrapEl.textContent === 'string' && bootstrapEl.textContent.trim()) {
        try {
          setupCopy = JSON.parse(bootstrapEl.textContent);
          applyCopy();
        } catch (_) {}
      }

      const setupRetryBtn = document.getElementById('setup-retry');
      if (setupRetryBtn) {
        setupRetryBtn.addEventListener('click', () => {
          runInitialStateRead();
        });
      }

      const tryAnotherBtn = document.getElementById('mark-try-another');
      if (tryAnotherBtn) {
        tryAnotherBtn.addEventListener('click', async () => {
          if (proposalMutationInFlight) return;
          proposalMutationInFlight = true;
          updateMarkButtons();
          clearMarkError();
          markRefreshSeq++;
          try {
            const actionSeq = ++requestSeq;
            const res = await postAction({ action: 'regenerate_mark' });
            mergeSetupResponse(res);
            if (res.downloads) applyActionDownloads(res.downloads, actionSeq);
            adoptMark(res.mark);
          } catch (err) {
            showMarkError(errorText(err));
          } finally {
            proposalMutationInFlight = false;
            updateMarkButtons();
          }
        });
      }

      const markContinueBtn = document.getElementById('mark-continue');
      if (markContinueBtn) {
        markContinueBtn.addEventListener('click', async () => {
          if (proposalMutationInFlight) return;
          if (!displayedProposalId) return;
          proposalMutationInFlight = true;
          updateMarkButtons();
          clearMarkError();
          const postingProposalId = displayedProposalId;
          const actionSeq = ++requestSeq;
          try {
            const res = await postAction({ action: 'commit_mark', proposal_id: postingProposalId });
            proposalMutationInFlight = false;
            mergeSetupResponse(res);
            if (res.downloads) applyActionDownloads(res.downloads, actionSeq);
            if (res.mark && res.mark.state === 'locked') {
              if (adoptMark(res.mark)) showThinkingSection();
            } else {
              updateMarkButtons();
            }
          } catch (err) {
            if (err && err.reasonCode === 'proposal_conflict') {
              showMarkError(err.rawDetail || errorText(err));
              const startMarkSeq = ++markRefreshSeq;
              const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
              let deadlineTimeout = null;
              let didAbort = false;
              if (controller) {
                deadlineTimeout = setTimeout(() => {
                  didAbort = true;
                  controller.abort();
                }, STATE_READ_DEADLINE_MS);
              }
              try {
                const readSeq = ++requestSeq;
                const opts = controller ? { signal: controller.signal } : {};
                const freshState = await apiCall('/init/api/state', opts);
                if (deadlineTimeout) clearTimeout(deadlineTimeout);
                if (didAbort || (controller && controller.signal.aborted)) {
                  return;
                }
                if (startMarkSeq < markRefreshSeq) {
                  return;
                }
                mergeSetupResponse(freshState);
                if (freshState && freshState.downloads) applyDownloadsSnapshot(freshState.downloads, readSeq);
                if (freshState && freshState.mark) {
                  if (adoptMark(freshState.mark)) showMarkError(err.rawDetail || errorText(err));
                }
              } catch (readErr) {
                if (deadlineTimeout) clearTimeout(deadlineTimeout);
                showMarkError(errorText(readErr));
              } finally {
                proposalMutationInFlight = false;
                updateMarkButtons();
              }
            } else {
              proposalMutationInFlight = false;
              updateMarkButtons();
              showMarkError(errorText(err));
            }
          }
        });
      }

      const thinkingChangeBtn = document.getElementById('thinking-change');
      if (thinkingChangeBtn) {
        thinkingChangeBtn.addEventListener('click', () => {
          const opts = document.getElementById('thinking-options');
          if (opts) opts.hidden = false;
        });
      }

      const thinkingForm = document.getElementById('thinking-form');
      if (thinkingForm) {
        thinkingForm.addEventListener('submit', (e) => {
          handleThinkingSubmit(e);
        });
      }

      const cancelThinkingBtn = document.getElementById('download-thinking-cancel');
      if (cancelThinkingBtn) {
        cancelThinkingBtn.addEventListener('click', async () => {
          const attemptToCancel = displayedThinkingAttemptId;
          if (!attemptToCancel) return;
          if (pendingCancelIds.has(attemptToCancel)) return;
          pendingCancelIds.add(attemptToCancel);
          cancelThinkingBtn.disabled = true;
          const seq = ++requestSeq;
          try {
            const res = await postAction({ action: 'cancel_thinking_download', attempt_id: attemptToCancel });
            if (res && res.downloads) {
              applyActionDownloads(res.downloads, seq);
            }
          } catch (err) {
            reconcileDownloadsSoon();
            showCurrentError(errorText(err));
          } finally {
            pendingCancelIds.delete(attemptToCancel);
            updateDownloadsUI();
          }
        });
      }

      const retryThinkingBtn = document.getElementById('download-thinking-retry');
      if (retryThinkingBtn) {
        retryThinkingBtn.addEventListener('click', async () => {
          retryThinkingBtn.disabled = true;
          const seq = ++requestSeq;
          try {
            const res = await postAction({ action: 'start_thinking_download' });
            if (res && res.downloads) {
              applyActionDownloads(res.downloads, seq);
            }
          } catch (err) {
            reconcileDownloadsSoon();
            showCurrentError(errorText(err));
          } finally {
            retryThinkingBtn.disabled = false;
          }
        });
      }

      const retrySpeechBtn = document.getElementById('download-speech-retry');
      if (retrySpeechBtn) {
        retrySpeechBtn.addEventListener('click', async () => {
          retrySpeechBtn.disabled = true;
          const seq = ++requestSeq;
          try {
            const res = await postAction({ action: 'retry_speech_download' });
            if (res && res.downloads) {
              applyActionDownloads(res.downloads, seq);
            }
          } catch (err) {
            reconcileDownloadsSoon();
            showCurrentError(errorText(err));
          } finally {
            retrySpeechBtn.disabled = false;
          }
        });
      }

      runInitialStateRead();
    });
  </script>
</body>
</html>
