[package]
name = "solstone-core-sol-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
hkdf = "0.12.4"
log = { workspace = true }
rcgen = { workspace = true }
ring = "0.17.14"
rustls = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
solstone-core-journal-io = { workspace = true }
solstone-core-sol-client = { workspace = true }
spl-core = { workspace = true }
spl-transport = { workspace = true }
time = "0.3.54"
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "net",
    "time",
    "io-util",
    "sync",
] }
x509-parser = "0.16.0"

[dev-dependencies]
solstone-core-journal-io = { workspace = true, features = ["test-hooks"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }

[lints]
workspace = true
