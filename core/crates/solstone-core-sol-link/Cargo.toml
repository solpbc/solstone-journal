[package]
name = "solstone-core-sol-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["client", "host"]
client = []
host = [
    "client",
    "dep:base64",
    "dep:argon2",
    "dep:axum",
    "dep:hkdf",
    "dep:indexmap",
    "dep:log",
    "dep:libc",
    "dep:rcgen",
    "dep:ring",
    "dep:sha2",
    "dep:solstone-core-convey-http",
    "dep:solstone-core-journal-config",
    "dep:solstone-core-journal-config-write",
    "dep:solstone-core-journal-io",
    "dep:solstone-core-thinking-copy",
    "dep:time",
    "dep:x509-parser",
]
full-tests = []
test-hooks = ["solstone-core-journal-io?/test-hooks"]

[dependencies]
base64 = { version = "0.22.1", optional = true }
argon2 = { version = "0.5.3", optional = true }
axum = { workspace = true, optional = true }
hkdf = { version = "0.12.4", optional = true }
indexmap = { version = "2.14.0", features = ["serde"], optional = true }
log = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
ring = { version = "0.17.14", optional = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
solstone-core-convey-http = { workspace = true, optional = true }
solstone-core-journal-config = { workspace = true, optional = true }
solstone-core-journal-config-write = { workspace = true, optional = true }
sha2 = { version = "0.10.9", optional = true }
solstone-core-journal-io = { workspace = true, optional = true }
solstone-core-ingest-contract = { workspace = true }
solstone-core-sol-client = { workspace = true }
solstone-core-thinking-copy = { workspace = true, optional = true }
spl-core = { workspace = true }
spl-transport = { workspace = true }
time = { version = "0.3.54", features = ["parsing"], optional = true }
tokio = { workspace = true, features = [
    "rt",
    "rt-multi-thread",
    "net",
    "time",
    "io-util",
    "sync",
] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
x509-parser = { version = "0.16.0", optional = true }

[dev-dependencies]
rcgen = { workspace = true }
tower = { workspace = true }

[[test]]
name = "device_door_identity"
required-features = ["host"]

[[test]]
name = "device_door_tls"
required-features = ["host"]

[[test]]
name = "sol_link_serving"
required-features = ["host"]

[[test]]
name = "sol_link_publish_crash"
required-features = ["host", "test-hooks"]

# `getifaddrs` requires one audited unsafe syscall boundary; keep the exception
# local to that function instead of relaxing the workspace-wide hard forbid.
[lints.rust]
unsafe_code = "deny"
