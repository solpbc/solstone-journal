[package]
name = "solstone-core-distribution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "solstone-distribution"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
toml_edit = { workspace = true, features = ["serde"] }
ureq = { workspace = true, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "distribution_cleanroom_loopback"
path = "tests/distribution_cleanroom_loopback.rs"
