[package]
name = "solstone-core-distribution"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "solstone-distribution"
path = "src/main.rs"

[[bin]]
name = "solstone-distribution-fixture"
path = "src/bin/solstone-distribution-fixture.rs"
required-features = ["test-fixture-pin"]
test = false
bench = false

# Unsafe code is denied except the reviewed Windows no-replace FFI leaf.
[lints.rust]
unsafe_code = "deny"

[features]
test-fixture-pin = []
test-hooks = []

[dependencies]
flate2.workspace = true
minisign.workspace = true
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
quick-xml = "0.41.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
solstone-core-ffmpeg-build-support.workspace = true
solstone-core-journal-io.workspace = true
tar.workspace = true
tempfile = "3"
toml_edit = { workspace = true, features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(not(windows))'.dependencies]
solstone-core-artifact-download.workspace = true

[dev-dependencies]
solstone-core-journal-io = { workspace = true, features = ["test-hooks"] }

[[test]]
name = "distribution_cleanroom_loopback"
path = "tests/distribution_cleanroom_loopback.rs"

[[test]]
name = "distribution_sign"
path = "tests/distribution_sign.rs"
required-features = ["test-fixture-pin"]

[[test]]
name = "distribution_publish"
path = "tests/distribution_publish.rs"
required-features = ["test-fixture-pin"]

[[test]]
name = "windows_payload"
path = "tests/windows_payload.rs"
required-features = ["test-fixture-pin"]

[[test]]
name = "controlled_build_receipt_race"
path = "tests/controlled_build_receipt_race.rs"

[[test]]
name = "distribution_build_capture"
path = "tests/distribution_build_capture.rs"
required-features = ["test-hooks"]
