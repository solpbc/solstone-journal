[package]
name = "solstone-core-system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autobins = false
autotests = false

# CommandExt::pre_exec is the only parent-death-signal seam on Linux; keep the
# exception local to that function instead of relaxing the workspace-wide hard forbid.
[lints.rust]
unsafe_code = "deny"

[features]
test-hooks = ["solstone-core-journal-io/test-hooks"]

[dependencies]
chrono = { workspace = true }
getrandom = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
solstone-core-journal-io = { workspace = true }
solstone-core-processing-record = { workspace = true }
solstone-core-format = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }

[target.'cfg(unix)'.dependencies]
# `feature` enables sysconf/SysconfVar for Linux process start-time identity.
# `fs` is already unified from the workspace; name it here for lifecycle fd APIs.
nix = { workspace = true, features = ["event", "feature", "fs", "hostname", "process", "signal"] }
solstone-core-journal-config = { workspace = true }
solstone-core-brain = { workspace = true }
solstone-core-local = { workspace = true }
solstone-core-assets = { workspace = true }

[dev-dependencies]
filetime = "0.2.29"
tempfile = "3.24.0"

[target.'cfg(windows)'.dependencies]
solstone-core-local = { workspace = true }
windows-sys = { workspace = true, features = ["Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_System_Pipes"] }

[[bin]]
name = "solstone-system-test-child"
path = "src/bin/solstone_system_test_child.rs"
test = false
bench = false

[[test]]
name = "system_contracts"
path = "tests/system_contracts.rs"

# Source-text architecture guards are deliberately a lightweight explicit
# target because this package disables Cargo integration-test auto-discovery.
[[test]]
name = "architecture"
path = "tests/architecture.rs"

# Real LaunchAuthority child behavior is a distinct subject from ManagedProcess
# in system_lifecycle, and cannot live under the routine `--lib` unit harness
# (hard process boundary). Explicit target because autotests = false.
[[test]]
name = "launch_authority"
path = "tests/launch_authority.rs"

[[test]]
name = "system_lifecycle"
path = "tests/system_lifecycle.rs"

# Native Windows lifecycle receipts need the feature-gated checkpoint seam;
# system_lifecycle's unconditional composed suite must not require test-hooks.
[[test]]
name = "windows_lifecycle_receipt"
path = "tests/windows_lifecycle_receipt.rs"
required-features = ["test-hooks"]

[[test]]
name = "system_provider_runtime"
path = "tests/system_provider_runtime.rs"

[[test]]
name = "system_schedule_queue"
path = "tests/system_schedule_queue.rs"
