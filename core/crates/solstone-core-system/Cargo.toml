[package]
name = "solstone-core-system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autobins = false

[lints]
workspace = true

[features]
# Cross-language differentials — tests that drive a real Python process as an
# oracle. They need a populated `.venv` (`make install`), so they are off by
# default; that is what lets the frozen native `make ci` run on a bare
# checkout. They run from `make check-differentials`.
differential = []

[dependencies]
chrono = { workspace = true }
# `feature` enables sysconf/SysconfVar for Linux process start-time identity.
# `fs` is already unified from the workspace; name it here for lifecycle fd APIs.
nix = { workspace = true, features = ["feature", "fs", "process", "signal"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
solstone-core-journal-io = { workspace = true }
solstone-core-journal-config = { workspace = true }
solstone-core-brain = { workspace = true }
solstone-core-local = { workspace = true }
thiserror = { workspace = true }

[[bin]]
name = "solstone-system-test-child"
path = "src/bin/solstone_system_test_child.rs"
test = false
bench = false

[[test]]
name = "partition_differential"
path = "tests/partition_differential.rs"
required-features = ["differential"]

[[test]]
name = "stt_backend_choice_differential"
path = "tests/stt_backend_choice_differential.rs"
required-features = ["differential"]
