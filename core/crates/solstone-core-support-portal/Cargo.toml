[package]
name = "solstone-core-support-portal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
test-support = []

[lints]
workspace = true

[dependencies]
base64 = "0.22.1"
chrono.workspace = true
getrandom.workspace = true
hmac.workspace = true
log.workspace = true
regex.workspace = true
ring = "=0.17.14"
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
solstone-core-brain.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-thinking.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
ureq = { workspace = true, features = ["rustls", "multipart"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "hostname"] }

[dev-dependencies]
tempfile = "3.24.0"
socket2.workspace = true
solstone-core-support-portal = { path = ".", features = ["test-support"] }
