[package]
name = "solstone-core-segment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
caseless = "0.2.2"
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = "0.10.9"
solstone-core-format = { workspace = true }
solstone-core-journal-io = { workspace = true }
solstone-core-processing-record = { workspace = true }
unicode-normalization.workspace = true

[lints]
workspace = true

[dev-dependencies]
solstone-core-journal-io = { workspace = true, features = ["test-hooks"] }
socket2 = "0.6.5"

[[test]]
name = "segment_supervisor_loopback"
path = "tests/segment_supervisor_loopback.rs"

[features]
full-tests = []
test-hooks = []
# Shared test fixtures, such as a capture beside a body window. No hooks.
test-fixtures = []

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
solstone-core-local-endpoint.workspace = true
