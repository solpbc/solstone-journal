[package]
name = "solstone-core-spp-ratls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
ring = "=0.17.14"
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
solstone-core-installed-payload = { workspace = true }
solstone-core-spp-attest = { workspace = true }
thiserror = { workspace = true }
x509-parser = "=0.16.0"

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

[features]
test-hooks = []
nvattest-directory = ["test-hooks", "solstone-core-spp-attest/test-hooks"]

[dev-dependencies]
rcgen = { workspace = true }
sha2 = { workspace = true }
socket2.workspace = true

[[test]]
name = "attested_channels"
path = "tests/attested_channels.rs"

[[example]]
name = "qualification_probe"
path = "examples/qualification_probe.rs"
required-features = ["nvattest-directory"]

[lints]
workspace = true
