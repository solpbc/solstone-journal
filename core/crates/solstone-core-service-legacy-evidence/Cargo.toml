[package]
name = "solstone-core-service-legacy-evidence"
version = "1.0.22"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
publish = false
build = "build.rs"

[workspace]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
