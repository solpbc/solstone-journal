[package]
name = "solstone-core-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Cross-language differentials — tests that drive a real Python process as an
# oracle. They need a populated `.venv` (`make install`), so they are off by
# default; that is what lets the frozen native `make ci` run on a bare
# checkout. They run from `make check-differentials`.
differential = []

# Narrow test driver for the loopback installer transport target.  Production
# builds deliberately do not expose fixture-row or injected-write seams.
test-hooks = []

[dependencies]
nix = { workspace = true, features = ["time"] }
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
chrono.workspace = true
hmac.workspace = true
sha2.workspace = true
tar.workspace = true
flate2.workspace = true
thiserror.workspace = true
solstone-core-brain.workspace = true
solstone-core-assets.workspace = true
solstone-core-artifact-download.workspace = true
solstone-core-journal-config.workspace = true
solstone-core-journal-config-write.workspace = true
uuid = { version = "1", features = ["v4"] }
log.workspace = true

[dev-dependencies]
socket2 = "0.6.5"
tempfile = "3.24.0"
rcgen.workspace = true
rustls.workspace = true

[[test]]
name = "local_runtime_transport"
path = "tests/local_runtime_transport.rs"

[[test]]
name = "local_installer_transport"
path = "tests/local_installer_transport.rs"
required-features = ["test-hooks"]

[[test]]
name = "local_installer_process"
path = "tests/local_installer_process.rs"

[[test]]
name = "admission_cross_process"
path = "tests/admission_cross_process.rs"
required-features = ["differential"]

[[test]]
name = "vulkan_differential"
path = "tests/vulkan_differential.rs"
required-features = ["differential"]

[[test]]
name = "local_fit_report_differential"
path = "tests/local_fit_report_differential.rs"
required-features = ["differential"]

[[test]]
name = "install_provider_differential"
path = "tests/install_provider_differential.rs"
required-features = ["differential"]

[[test]]
name = "downloading_installers_differential"
path = "tests/downloading_installers_differential.rs"
required-features = ["differential"]
