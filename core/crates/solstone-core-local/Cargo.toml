[package]
name = "solstone-core-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Narrow test driver for the loopback installer transport target.  Production
# builds deliberately do not expose fixture-row or injected-write seams.
test-hooks = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
chrono.workspace = true
hmac.workspace = true
sha2.workspace = true
tar.workspace = true
flate2.workspace = true
thiserror.workspace = true
solstone-core-brain.workspace = true
solstone-core-assets.workspace = true
solstone-core-ced-sys.workspace = true
solstone-core-artifact-download.workspace = true
solstone-core-journal-config.workspace = true
solstone-core-journal-config-write.workspace = true
uuid = { version = "1", features = ["v4"] }
log.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["time"] }

[dev-dependencies]
socket2 = "0.6.5"
tempfile = "3.24.0"
rcgen.workspace = true
rustls.workspace = true

[[test]]
name = "local_runtime_transport"
path = "tests/local_runtime_transport.rs"

[[test]]
name = "local_installer_transport"
path = "tests/local_installer_transport.rs"
required-features = ["test-hooks"]

[[test]]
name = "local_installer_process"
path = "tests/local_installer_process.rs"
required-features = ["test-hooks"]

# This target isolates process-global PATH mutation needed to verify the
# production nvidia-smi subprocess boundary.
[[test]]
name = "local_readiness_probe_contract"
path = "tests/local_readiness_probe_contract.rs"
