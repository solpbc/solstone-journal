[package]
name = "solstone-core-vad-analyze"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["runtime"]
runtime = ["dep:ort", "dep:solstone-core-speakers-onnx"]
full-tests = ["runtime"]

[dependencies]
ort = { workspace = true, features = ["api-24", "std"], optional = true }
serde_json.workspace = true
sha2.workspace = true

[[bin]]
name = "solstone-core-vad-analyze"
path = "src/main.rs"
required-features = ["runtime"]

[[test]]
name = "vad_oracles"
path = "tests/vad_oracles.rs"
required-features = ["runtime"]

[target.'cfg(windows)'.dependencies]
ort = { workspace = true, features = ["load-dynamic"], optional = true }
solstone-core-speakers-onnx = { workspace = true, optional = true }
