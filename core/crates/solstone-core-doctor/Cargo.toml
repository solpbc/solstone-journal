[package]
name = "solstone-core-doctor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
solstone-core-callosum = { workspace = true, features = ["wire"] }
solstone-core-journal.workspace = true
solstone-core-journal-config.workspace = true
solstone-core-system.workspace = true
solstone-core-system-health.workspace = true
solstone-core-brain.workspace = true
solstone-core-sol-link = { workspace = true, features = ["host"] }
solstone-core-transcribe.workspace = true
solstone-core-skill-state.workspace = true
plist.workspace = true
rustix = { workspace = true, features = ["process"] }
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
solstone-core-assets.workspace = true
