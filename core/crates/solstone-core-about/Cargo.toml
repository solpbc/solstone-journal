[package]
name = "solstone-core-about"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autobins = false

# Native platform queries are quarantined in the two small host modules.
[lints.rust]
unsafe_code = "deny"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
log.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["hostname"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
plist.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[[example]]
name = "about-contract"
path = "examples/contract.rs"

[dev-dependencies]
jsonschema.workspace = true
