[package]
name = "solstone-core-grab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
chrono.workspace = true
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["format", "software-scaling", "build"] }
# This direct dependency enables the shared FFmpeg source build's portable baseline.
ffmpeg-sys-next = { version = "9.0.0", default-features = false, features = ["build-portable"] }
image.workspace = true
serde.workspace = true
serde_json.workspace = true
solstone-core-format.workspace = true
solstone-core-journal-io.workspace = true
thiserror.workspace = true

[features]
test-hooks = []

[dev-dependencies]
sha2.workspace = true
tempfile = "3.24.0"

[[test]]
name = "native_media_semantics"
path = "tests/native_media_semantics.rs"
required-features = ["test-hooks"]

[lints]
workspace = true
