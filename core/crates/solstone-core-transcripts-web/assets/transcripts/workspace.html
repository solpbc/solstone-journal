<!-- open-day: /app/transcripts/ -> /app/transcripts/api/open-day -->

<link rel="stylesheet" href="/static/date-nav.css">

<style>
/* Transcripts app styles - all classes prefixed with .tr- to avoid conflicts */

/* Columns are sticky+viewport-height; the content column scrolls the page. */

/* Main container */
.tr-wrap {
  max-width: 1400px;
  margin: 0 auto;
  padding: 16px 24px;
  box-sizing: border-box;
}

/* Under the day heading, only when part of the day was recorded on another
   clock: says which, so the grid's times read right. */
.tr-day-zones {
  margin: -4px 0 12px;
  font-size: 0.8125rem;
  color: var(--ink-faint-paper);
}

.tr-card {
  min-height: calc(100vh - 48px);
  background: var(--paper);
  border: 1px solid var(--hairline);
  border-radius: 12px;
  display: grid;
  --tr-day-col: 200px;
  --tr-zoom-col: 120px;
  grid-template-columns: var(--tr-day-col) var(--tr-zoom-col) minmax(0, 1fr);
}



/* Left timeline */
.tr-timeline {
  --tr-legend-h: 30px;
  position: sticky;
  top: 16px;
  align-self: start;
  border-right: 1px solid var(--hairline-2);
  user-select: none;
  height: calc(100vh - 32px);
  overflow: hidden;
  touch-action: pan-y;
  cursor: crosshair;
  padding: 12px 0;
  box-sizing: border-box;
}

.tr-timeline-label {
  position: absolute;
  top: 0;
  left: 64px;
  right: 0;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--ink-faint-paper);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 700;
  pointer-events: none;
  z-index: 3;
  border-bottom: 1px solid var(--hairline);
}

.tr-timeline-legend {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--tr-legend-h);
  display: flex;
  flex-wrap: wrap;
  align-content: center;
  justify-content: center;
  box-sizing: border-box;
  column-gap: 8px;
  row-gap: 0;
  padding: 0 4px;
  font-size: 12px;
  line-height: 14px;
  color: var(--ink-faint);
  background: var(--paper);
  pointer-events: none;
  z-index: 3;
}

.tr-legend-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 4px;
  vertical-align: baseline;
  position: relative;
  top: 1px;
}

.tr-grid {
  position: absolute;
  top: 16px;
  bottom: var(--tr-legend-h, 12px);
  left: 0;
  right: 0;
}

.tr-grid-hour {
  position: absolute;
  left: 0;
  right: 0;
  border-top: 1px solid var(--hairline);
}

.tr-grid-quarter {
  position: absolute;
  left: 0;
  right: 0;
  border-top: 1px dashed var(--hairline-2);
}

.tr-labels {
  position: absolute;
  left: 0;
  top: 16px;
  bottom: var(--tr-legend-h, 12px);
  width: 64px;
  background: var(--cream-bright);
  border-right: 1px solid var(--hairline);
  pointer-events: none;
}

.tr-label {
  position: absolute;
  right: 0;
  padding-right: 8px;
  transform: translateY(-50%);
  font-size: 12px;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}

.tr-labels .tr-label:last-child {
  transform: translateY(-100%);
}

/* Selection box */
.tr-sel-wrap {
  position: absolute;
  left: 64px;
  right: 8px;
  pointer-events: none;
  z-index: 4;
}

.tr-sel {
  position: absolute;
  left: 0;
  right: -4px;
  height: 100%;
  background: var(--orange-wash);
  border: 1px solid var(--orange);
  border-radius: 12px;
  box-shadow: 0 1px 2px rgba(0,0,0,.06);
  pointer-events: auto;
  cursor: grab;
  touch-action: none;
}

.tr-sel:active {
  cursor: grabbing;
}

.tr-sel:hover {
  background: var(--orange-wash);
  border-color: var(--orange-ink);
}

.tr-sel:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.tr-bumper {
  position: absolute;
  left: 28px;
  right: 28px;
  margin: auto;
  height: 14px;
  border: 1px solid var(--orange);
  border-radius: 999px;
  background: var(--orange-wash);
  cursor: ns-resize;
  touch-action: none;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.tr-bumper-top {
  top: -7px;
}

.tr-bumper-bottom {
  bottom: -7px;
}

.tr-bumper:hover {
  background: var(--orange-wash);
  border-color: var(--orange-ink);
}

.tr-bumper:active {
  background: var(--orange-wash);
  border-color: var(--orange-ink);
}

/* Segments lane (audio/screen indicators) */
.tr-segments {
  --seg-col-0: 8px;
  --seg-col-1: 56px;
  position: absolute;
  left: 64px;
  right: 0;
  top: 16px;
  bottom: var(--tr-legend-h, 12px);
  pointer-events: none;
  z-index: 1;
}

.tr-seg {
  position: absolute;
  width: 40px;
  border-radius: 12px;
  box-shadow: 0 1px 1px rgba(0,0,0,.04);
  pointer-events: auto;
  cursor: pointer;
  transition: filter 0.15s ease, box-shadow 0.15s ease;
}

/* Short segments (a 5-minute import renders ~2px tall) stay clickable: a
   transparent ::after extends the pointer target to at least 14px tall,
   centered on the segment, without distorting the rendered geometry. */
.tr-seg::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 100%;
  min-height: 14px;
  transform: translateY(-50%);
}

.tr-seg:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}

.tr-seg:hover {
  filter: brightness(0.92);
  box-shadow: 0 2px 4px rgba(0,0,0,.10);
}

.tr-seg:active {
  filter: brightness(0.88);
  box-shadow: 0 1px 2px rgba(0,0,0,.08);
}

.tr-seg-col-0 { left: var(--seg-col-0); }
.tr-seg-col-1 { left: var(--seg-col-1); }

.tr-seg-audio {
  background: color-mix(in srgb, var(--success) 60%, transparent);
  border: 1px solid var(--success);
}

.tr-seg-screen {
  background: color-mix(in srgb, var(--warn) 60%, transparent);
  border: 1px solid var(--warn);
}

.tr-seg-browser {
  background: var(--cream-bright);
  border: 1px solid var(--hairline-2);
}

.tr-seg-markdown {
  background: color-mix(in srgb, var(--orange) 32%, transparent);
  border: 1px solid var(--orange);
}

.tr-body-events {
  position: absolute;
  /* Audio is x=72..112 and screen/import is x=120..160. Body starts after
     them; 24px blocks end at x=192, keeping an 8px gutter inside the
     200px day column instead of clipping. */
  left: 168px;
  top: 16px;
  bottom: var(--tr-legend-h, 12px);
  width: 24px;
  pointer-events: none;
  z-index: 1;
}

.tr-body-event {
  position: absolute;
  left: 0;
  width: 24px;
  min-height: 4px;
  border-radius: 12px;
  box-shadow: 0 1px 1px rgba(0,0,0,.04);
  pointer-events: auto;
  cursor: pointer;
  transition: filter 0.15s ease, box-shadow 0.15s ease;
}

.tr-body-event:hover {
  filter: brightness(0.94);
  box-shadow: 0 2px 4px rgba(0,0,0,.10);
}

.tr-body-event:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}

.tr-body-event-sleep {
  background: color-mix(in srgb, var(--ink-soft) 40%, transparent);
  border: 1px solid var(--ink-soft);
}

/* Workout is clay, not gold: gold on this timeline is screen, and nothing
   else, so a workout never reads as screen in the legend. */
.tr-body-event-workout {
  background: color-mix(in srgb, var(--danger) 30%, transparent);
  border: 1px solid var(--danger);
}

.tr-seg-pending {
  opacity: 0.9;
  border-style: dashed;
}

.tr-seg-audio.tr-seg-pending {
  background:
    repeating-linear-gradient(
      135deg,
      color-mix(in srgb, var(--success) 45%, transparent) 0,
      color-mix(in srgb, var(--success) 45%, transparent) 3px,
      color-mix(in srgb, var(--success) 16%, transparent) 3px,
      color-mix(in srgb, var(--success) 16%, transparent) 8px
    );
  border-color: var(--hairline-2);
}

.tr-seg-screen.tr-seg-pending {
  background:
    repeating-linear-gradient(
      135deg,
      color-mix(in srgb, var(--warn) 45%, transparent) 0,
      color-mix(in srgb, var(--warn) 45%, transparent) 3px,
      color-mix(in srgb, var(--warn) 18%, transparent) 3px,
      color-mix(in srgb, var(--warn) 18%, transparent) 8px
    );
  border-color: var(--hairline-2);
}

/* "awaiting thinking" is a waiting state, and waiting is not a hue: the
   segment is drawn hollow, an empty outline in its own modality colour, so it
   reads as not yet thought about without borrowing gold (which is screen's)
   or looking like a finished segment. */
.tr-seg-awaiting {
  opacity: 1;
  border-style: solid;
  background: var(--paper);
}

.tr-seg-audio.tr-seg-awaiting {
  border-color: var(--success);
  box-shadow: inset 0 0 0 1px var(--success);
}

.tr-seg-screen.tr-seg-awaiting {
  border-color: var(--warn);
  box-shadow: inset 0 0 0 1px var(--warn);
}

.tr-seg-analyzing {
  opacity: 1;
  border-style: solid;
  animation: tr-analyzing-pulse 1.5s ease-in-out infinite;
}

/* "analysing" is in-progress, and in-progress is not a hue: a neutral warm
   wash, distinguished from the striped pending and hollow awaiting states by
   form, not hue. G1-211 named the screen rule; the audio sibling was teal, which the
   same token rule excludes, so both say in-progress the same way. Which
   modality a segment is stays in its own resting colour and in its lane. */
.tr-seg-audio.tr-seg-analyzing,
.tr-seg-screen.tr-seg-analyzing {
  background: color-mix(in srgb, var(--ink-faint) 42%, transparent);
  border-color: var(--ink-faint);
}

@keyframes tr-analyzing-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}

.tr-now-marker {
  position: absolute;
  left: 64px;
  right: 0;
  height: 0;
  border-top: 2px solid var(--danger);
  z-index: 3;
  pointer-events: none;
}

.tr-now-label {
  position: absolute;
  left: 4px;
  top: -8px;
  font-size: 12px;
  color: var(--danger);
  font-weight: 500;
  line-height: 1;
}

/* Right content panel */
.tr-content {
  padding: 4px 24px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-sizing: border-box;
}

.tr-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.tr-header > div {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.tr-title {
  font-size: 20px;
  font-weight: 600;
  margin: 0;
}

.tr-copy-stream-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  padding: 0;
  border: 1px solid var(--hairline-2, #ccc);
  background: var(--paper, #fff);
  color: var(--ink-faint, #666);
  border-radius: 6px;
  cursor: pointer;
}

.tr-copy-stream-btn:hover {
  color: var(--ink, #111);
  border-color: var(--ink, #111);
}

.tr-toast {
  position: absolute;
  margin-left: 8px;
  background: var(--surface-dark, #222);
  color: var(--ink-on-dark, #fff);
  padding: 0.2em 0.8em;
  border-radius: 12px;
  font-size: 12px;
  z-index: 10;
}

.tr-range-text {
  color: var(--ink-faint);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

.tr-tabs {
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--hairline);
  flex-shrink: 0;
  display: none;
}

.tr-tabs.visible {
  display: flex;
}

.tr-tab {
  padding: 8px 12px;
  border: 1px solid var(--hairline-2);
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  background: var(--paper);
  color: var(--ink-soft);
  transition: all 0.15s;
}

.tr-tab:hover {
  background: var(--cream-bright);
}

.tr-tab.active {
  background: var(--orange-ink);
  border-color: var(--orange-ink);
  color: var(--ink-on-dark);
}

.tr-tab:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}

.tr-tab:active:not(.active) {
  background: var(--cream-bright);
  border-color: var(--hairline-2);
}

.tr-tab-pane {
  display: none;
  height: 100%;
}

.tr-tab-pane:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.tr-tab-pane.active {
  display: block;
}

.tr-state-stack {
  display: grid;
  gap: 12px;
  padding: 16px;
}

.tr-analyze-action[disabled] {
  cursor: progress;
  opacity: 0.65;
}

.tr-analyze-error {
  margin: 8px 0 0;
  color: var(--danger);
  font-size: 13px;
}

.tr-md-content {
  padding: 16px;
  line-height: 1.6;
  font-size: 14px;
  max-width: 70ch;
}

.tr-md-content a {
  color: var(--orange-text-aa);
}

.tr-md-content h1, .tr-md-content h2, .tr-md-content h3 {
  margin-top: 16px;
  margin-bottom: 8px;
}

.tr-md-content p {
  margin-bottom: 12px;
}

.tr-md-content ul, .tr-md-content ol {
  margin-bottom: 12px;
  padding-left: 24px;
}

.tr-md-content code {
  background: var(--cream-bright);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
}

.tr-md-content pre {
  background: var(--cream-bright);
  padding: 12px;
  border-radius: 6px;
  overflow-x: auto;
  margin-bottom: 12px;
}

.tr-body-strip,
.tr-body-context-card,
.tr-body-panel {
  border: 1px solid var(--hairline);
  background: var(--paper);
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
}

.tr-body-strip {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0 0 12px;
  padding: 10px 12px;
  border-radius: 10px;
  color: var(--ink-soft);
  font-size: 13px;
}

.tr-body-strip-label {
  color: var(--ink-faint);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-size: 11px;
}

.tr-body-strip-separator {
  color: var(--ink-faint);
}

.tr-body-strip-button,
.tr-body-context-button,
.tr-body-panel-close,
.tr-body-link {
  border: 1px solid var(--hairline-2);
  background: var(--paper);
  color: var(--ink);
  border-radius: 999px;
  padding: 5px 10px;
  font: inherit;
  cursor: pointer;
}

.tr-body-link {
  display: inline-flex;
  align-items: center;
  text-decoration: none;
}

.tr-body-strip-button:hover,
.tr-body-context-button:hover,
.tr-body-panel-close:hover,
.tr-body-link:hover {
  background: var(--cream-bright);
}

/* X-08: 63x31 is a mouse target. On a touch width the close control grows to
   44px; the inline .tr-body-link sits in running text and keeps its size. */
@media (max-width: 768px) {
  .tr-body-panel-close {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    min-width: 44px;
    justify-content: center;
  }
}

.tr-body-strip-button:focus-visible,
.tr-body-context-button:focus-visible,
.tr-body-panel-close:focus-visible,
.tr-body-link:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}

.tr-body-context-card {
  display: grid;
  gap: 12px;
  margin: 16px;
  padding: 18px;
  border-radius: 12px;
  max-width: 760px;
}

.tr-body-context-card h3,
.tr-body-panel h3 {
  margin: 0;
  font-size: 18px;
}

.tr-body-context-card p,
.tr-body-panel p {
  margin: 0;
  color: var(--ink-soft);
}

.tr-body-context-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.tr-body-context-fact {
  border: 1px solid var(--hairline);
  border-radius: 999px;
  padding: 5px 9px;
  background: var(--cream-bright);
  color: var(--ink-soft);
  font-size: 12px;
}

.tr-body-rhythm {
  display: grid;
  gap: 8px;
}

.tr-body-rhythm-title {
  color: var(--ink-faint);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.tr-body-rhythm-grid {
  display: grid;
  grid-template-columns: repeat(24, minmax(8px, 1fr));
  gap: 3px;
  align-items: end;
}

.tr-body-hour {
  position: relative;
  min-width: 0;
  min-height: 34px;
  border: 1px solid var(--hairline);
  border-radius: 5px;
  padding: 0;
  background: var(--cream-bright);
  cursor: pointer;
}

.tr-body-hour-empty {
  cursor: default;
  opacity: 0.48;
}

/* Warm sequential ramp (G1-110): RGB of --orange (232,145,58) at rising
   alpha, the same construction stats/dashboard.js uses for its heatmap
   (WARM_HEATMAP_RGB), replacing the prior cool blue-to-orange ramp. */
.tr-body-hour-level-1 { background: color-mix(in srgb, var(--orange) 15%, transparent); border-color: color-mix(in srgb, var(--orange) 35%, transparent); }
.tr-body-hour-level-2 { background: color-mix(in srgb, var(--orange) 35%, transparent); border-color: color-mix(in srgb, var(--orange) 55%, transparent); }
.tr-body-hour-level-3 { background: color-mix(in srgb, var(--orange) 55%, transparent); border-color: color-mix(in srgb, var(--orange) 75%, transparent); }
.tr-body-hour-level-4 { background: color-mix(in srgb, var(--orange) 75%, transparent); border-color: var(--orange-ink); }

.tr-body-hour:hover:not(.tr-body-hour-empty) {
  filter: brightness(0.96);
}

.tr-body-hour:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}

.tr-body-hour-label {
  position: absolute;
  top: calc(100% + 3px);
  left: 50%;
  transform: translateX(-50%);
  color: var(--ink-faint);
  font-size: 9px;
  white-space: nowrap;
}

.tr-body-hour-list {
  display: grid;
  gap: 6px;
  margin: 4px 0 0;
  padding: 0;
  list-style: none;
}

.tr-body-hour-list li {
  display: grid;
  grid-template-columns: minmax(82px, auto) 1fr;
  gap: 10px;
  align-items: baseline;
  color: var(--ink-soft);
  font-size: 13px;
}

.tr-body-hour-list time {
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}

.tr-body-context-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

.tr-body-panel {
  position: fixed;
  top: calc(var(--status-instrument-inset) + var(--status-instrument-size) + var(--chrome-gap));
  right: 20px;
  bottom: 20px;
  z-index: 45;
  width: min(420px, calc(100vw - 40px));
  border-radius: 14px;
  transform: translateX(calc(100% + 28px));
  opacity: 0;
  /* visibility keeps the closed panel's focusable children out of the tab
     order; its discrete transition flips to hidden only after the slide. */
  visibility: hidden;
  pointer-events: none;
  transition: transform 0.18s ease, opacity 0.18s ease, visibility 0.18s;
  display: grid;
  grid-template-rows: auto 1fr;
  overflow: hidden;
}

.tr-body-panel.visible {
  transform: translateX(0);
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.tr-body-panel-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 18px;
  border-bottom: 1px solid var(--hairline);
}

.tr-body-panel-body {
  overflow: auto;
  padding: 18px;
  display: grid;
  gap: 16px;
}

.tr-body-panel-section {
  display: grid;
  gap: 8px;
}

.tr-body-panel-section h4 {
  margin: 0;
  color: var(--ink-faint);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.tr-body-panel-list {
  display: grid;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.tr-body-chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tr-body-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  padding: 4px 8px;
  background: var(--cream-bright);
  font-size: 12px;
}

.tr-body-panel-more,
.tr-body-panel-more a {
  color: var(--ink-faint);
  font-size: 12px;
}


	.tr-md-content pre {
	  background: var(--cream-bright);
	  padding: 12px;
	  border-radius: 6px;
	  overflow-x: auto;
	  margin-bottom: 12px;
	}

.tr-signals {
  display: grid;
  gap: 14px;
  padding: 16px;
  max-width: 920px;
}

.tr-signal-summary {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.tr-signal-chip {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  border: 1px solid var(--hairline-2);
  border-radius: 999px;
  padding: 4px 9px;
  background: var(--paper);
  color: var(--ink-soft);
  font-size: 12px;
}

.tr-signal-chip strong {
  color: var(--ink);
  font-weight: 700;
}

.tr-signal-section {
  border: 1px solid var(--hairline);
  border-radius: 8px;
  background: var(--paper);
  overflow: hidden;
}

.tr-signal-section h3 {
  margin: 0;
  padding: 10px 12px;
  border-bottom: 1px solid var(--hairline-2);
  color: var(--ink);
  font-size: 14px;
  font-weight: 650;
  background: var(--cream-bright);
}

.tr-signal-body {
  display: grid;
  gap: 8px;
  padding: 12px;
  color: var(--ink-soft);
  font-size: 13px;
  line-height: 1.5;
}

.tr-signal-row {
  display: grid;
  grid-template-columns: 96px minmax(0, 1fr);
  gap: 10px;
}

.tr-signal-label {
  color: var(--ink-faint);
  font-size: 12px;
}

.tr-signal-value {
  min-width: 0;
  overflow-wrap: anywhere;
}

.tr-signal-list {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.tr-signal-list li {
  padding: 8px 10px;
  border: 1px solid var(--hairline-2);
  border-radius: 6px;
  background: var(--cream-bright);
}

.tr-signal-raw summary {
  cursor: pointer;
  color: var(--ink-soft);
  font-size: 13px;
}

.tr-signal-raw pre {
  margin: 8px 0 0;
  padding: 10px;
  overflow-x: auto;
  border-radius: 6px;
  background: var(--cream-bright);
  color: var(--ink);
  font-size: 12px;
  line-height: 1.45;
}

.tr-screen-text {
  padding: 8px 12px;
  color: var(--ink-soft);
  font-size: 13px;
  border-left: 3px solid var(--hairline);
  margin: 4px 0;
}

/* Delete button */
.tr-delete-btn {
  display: none;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 1px solid var(--hairline);
  border-radius: 6px;
  background: var(--paper);
  color: var(--ink-faint);
  cursor: pointer;
  transition: all 0.15s;
  margin-left: 8px;
}

.tr-delete-btn:hover {
  background: var(--danger-wash);
  border-color: var(--danger);
  color: var(--danger);
}

.tr-delete-btn:focus-visible {
  outline: 2px solid var(--danger);
  outline-offset: 2px;
}

.tr-delete-btn:active {
  background: var(--danger-wash);
  border-color: var(--danger);
  color: var(--danger);
}

.tr-delete-btn.visible {
  display: flex;
}

.tr-delete-btn svg {
  width: 16px;
  height: 16px;
}

/* X-08 fourth layer: the detail pane's own controls exist only once a block is
   open, so the sweep never measured them. 32x32 and 79x33 are mouse targets;
   on a touch width both reach 44px. Width and height only, so .tr-delete-btn
   stays hidden until .visible puts it back. S-10. */
@media (max-width: 768px) {
  .tr-delete-btn {
    width: 44px;
    height: 44px;
  }

  .tr-tab {
    min-height: 44px;
    min-width: 44px;
  }
}

.tr-panel {
  flex: 1;
  padding: 16px;
  overflow-x: auto;
  font-size: 14px;
  line-height: 1.5;
  transition: opacity 0.1s ease;
}

.tr-panel.loading {
  opacity: 0.5;
}

.tr-panel pre {
  white-space: pre-wrap;
  word-wrap: break-word;
  overflow-wrap: break-word;
}

.tr-panel code {
  white-space: pre-wrap;
  word-wrap: break-word;
}

/* Middle zoom timeline (segment selector) */
.tr-zoom {
  position: sticky;
  top: 16px;
  align-self: start;
  border-right: 1px solid var(--hairline);
  user-select: none;
  height: calc(100vh - 32px);
  overflow: hidden;
  padding: 12px 0;
  box-sizing: border-box;
}



.tr-zoom-timeline-label {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--ink-faint-paper);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 700;
  pointer-events: none;
  z-index: 3;
  border-bottom: 1px solid var(--hairline);
}

/* 64px, the day rail's width: the detail rail names midnight too now, and 48px
   clipped it. .tr-zoom-segments clears it at 64 + 4. S-12. */
.tr-zoom-labels {
  position: absolute;
  left: 0;
  top: 16px;
  bottom: 12px;
  width: 64px;
  background: var(--cream-bright);
  border-right: 1px solid var(--hairline);
  pointer-events: none;
}

.tr-zoom-label {
  position: absolute;
  right: 0;
  padding-right: 8px;
  transform: translateY(-50%);
  font-size: 12px;
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}

.tr-zoom-grid {
  position: absolute;
  top: 16px;
  bottom: 12px;
  left: 0;
  right: 0;
}

.tr-zoom-segments {
  position: absolute;
  left: 68px;
  right: 4px;
  top: 16px;
  bottom: 12px;
}

.tr-zoom-empty {
  position: absolute;
  inset: 0;
  padding: 0 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--ink-faint);
  font-size: 12px;
  line-height: 1.35;
  pointer-events: none;
}

/* Segment pills in zoom view */
.tr-zoom-pill {
  position: absolute;
  left: 0;
  right: 0;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s ease;
  box-shadow: 0 1px 2px rgba(0,0,0,.08);
}

.tr-zoom-pill:hover {
  filter: brightness(0.95);
  box-shadow: 0 2px 4px rgba(0,0,0,.12);
}

.tr-zoom-pill.tr-active {
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 50%, transparent), 0 2px 4px rgba(0,0,0,.12);
}

.tr-zoom-pill:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}

.tr-zoom-pill:active {
  filter: brightness(0.90);
  transform: scale(0.98);
}

.tr-zoom-pill-audio {
  background: linear-gradient(135deg, color-mix(in srgb, var(--success) 80%, transparent), color-mix(in srgb, var(--success) 60%, transparent));
  border: 1px solid var(--success);
}

.tr-zoom-pill-screen {
  background: linear-gradient(135deg, color-mix(in srgb, var(--warn) 80%, transparent), color-mix(in srgb, var(--warn) 60%, transparent));
  border: 1px solid var(--warn);
}

.tr-zoom-pill-markdown {
  background: linear-gradient(135deg, color-mix(in srgb, var(--focus) 80%, transparent), color-mix(in srgb, var(--focus) 60%, transparent));
  border: 1px solid var(--orange-ink);
}

.tr-zoom-pill-browser {
  background: var(--cream-bright);
  border: 1px solid var(--hairline-2);
}

/* A moment holding only screenshots: a short mark in screen's gold with the
   screenshot glyph, tall enough to see. */
.tr-zoom-pill-shot {
  min-height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--ink);
}

.tr-zoom-pill-shot svg {
  width: 13px;
  height: 13px;
}

.tr-zoom-pill-image {
  background: color-mix(in srgb, var(--ink-faint) 24%, var(--paper));
  border: 1px solid var(--ink-faint);
}

.tr-zoom-pill-both {
  background: linear-gradient(to right, color-mix(in srgb, var(--success) 75%, transparent), color-mix(in srgb, var(--success) 70%, transparent) 50%, color-mix(in srgb, var(--warn) 75%, transparent));
  border: 1px solid var(--success);
}

.tr-zoom-pill-pending {
  border-style: dashed;
}

.tr-zoom-pill-audio.tr-zoom-pill-pending {
  background:
    repeating-linear-gradient(
      135deg,
      color-mix(in srgb, var(--success) 38%, transparent) 0,
      color-mix(in srgb, var(--success) 38%, transparent) 4px,
      color-mix(in srgb, var(--success) 18%, transparent) 4px,
      color-mix(in srgb, var(--success) 18%, transparent) 10px
    );
  border-color: var(--hairline-2);
}

.tr-zoom-pill-screen.tr-zoom-pill-pending {
  background:
    repeating-linear-gradient(
      135deg,
      color-mix(in srgb, var(--warn) 38%, transparent) 0,
      color-mix(in srgb, var(--warn) 38%, transparent) 4px,
      color-mix(in srgb, var(--warn) 20%, transparent) 4px,
      color-mix(in srgb, var(--warn) 20%, transparent) 10px
    );
  border-color: var(--hairline-2);
}

.tr-zoom-pill-both.tr-zoom-pill-pending {
  background:
    repeating-linear-gradient(
      135deg,
      color-mix(in srgb, var(--success) 38%, transparent) 0,
      color-mix(in srgb, var(--success) 38%, transparent) 4px,
      color-mix(in srgb, var(--success) 20%, transparent) 4px,
      color-mix(in srgb, var(--success) 20%, transparent) 10px
    );
  border-color: var(--hairline-2);
}

/* Hollow, like .tr-seg-awaiting: waiting is a form, not a hue. */
.tr-zoom-pill-awaiting {
  border-style: solid;
  background: var(--paper);
}

.tr-zoom-pill-audio.tr-zoom-pill-awaiting,
.tr-zoom-pill-both.tr-zoom-pill-awaiting {
  border-color: var(--success);
  box-shadow: inset 0 0 0 1px var(--success);
}

.tr-zoom-pill-screen.tr-zoom-pill-awaiting {
  border-color: var(--warn);
  box-shadow: inset 0 0 0 1px var(--warn);
}

.tr-zoom-pill-analyzing {
  border-style: solid;
  animation: tr-analyzing-pulse 1.5s ease-in-out infinite;
}

.tr-zoom-pill-audio.tr-zoom-pill-analyzing,
.tr-zoom-pill-screen.tr-zoom-pill-analyzing,
.tr-zoom-pill-both.tr-zoom-pill-analyzing {
  background: color-mix(in srgb, var(--ink-faint) 44%, transparent);
  border-color: var(--ink-faint);
}

/* Dragging state */
.tr-dragging {
  user-select: none;
  -webkit-user-select: none;
}

/* Image modal */
.tr-screenshot-modal {
  position: fixed;
  inset: 0;
  background: color-mix(in srgb, var(--surface-dark) 85%, transparent);
  display: flex;
  z-index: 1000;
}

.tr-modal-nav {
  width: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: color-mix(in srgb, var(--ink-on-dark) 40%, transparent);
  transition: all 0.15s;
  flex-shrink: 0;
}

.tr-modal-nav:hover {
  background: color-mix(in srgb, var(--ink-on-dark) 10%, transparent);
  color: color-mix(in srgb, var(--ink-on-dark) 90%, transparent);
}

.tr-modal-nav:active {
  background: color-mix(in srgb, var(--ink-on-dark) 20%, transparent);
  color: color-mix(in srgb, var(--ink-on-dark) 100%, transparent);
}

.tr-modal-nav:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--ink-on-dark) 60%, transparent);
  outline-offset: -2px;
}

.tr-modal-nav.disabled {
  cursor: default;
  color: color-mix(in srgb, var(--ink-on-dark) 15%, transparent);
  pointer-events: none;
}

.tr-modal-nav svg {
  width: 24px;
  height: 24px;
}

.tr-modal-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.tr-modal-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  flex-shrink: 0;
}

.tr-modal-badge {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  background: color-mix(in srgb, var(--ink-on-dark) 15%, transparent);
  color: var(--ink-on-dark);
}

.tr-modal-badge-monitor {
  background: var(--cream-bright);
  color: var(--ink-soft);
}

.tr-modal-badge-category {
  background: var(--warn-wash);
  color: var(--warn-ink);
}

.tr-modal-close {
  margin-left: auto;
  width: 36px;
  height: 36px;
  background: color-mix(in srgb, var(--ink-on-dark) 15%, transparent);
  border: none;
  border-radius: 50%;
  color: var(--ink-on-dark);
  font-size: 18px;
  cursor: pointer;
  transition: background 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.tr-modal-close:hover {
  background: color-mix(in srgb, var(--ink-on-dark) 30%, transparent);
}

.tr-modal-close:active {
  background: color-mix(in srgb, var(--ink-on-dark) 40%, transparent);
}

.tr-modal-close:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--ink-on-dark) 60%, transparent);
  outline-offset: 2px;
}

.tr-modal-img-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
  padding: 0 20px;
}

.tr-modal-img-wrap img,
.tr-modal-img-wrap canvas {
  display: block;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 8px;
  background: var(--ink);
}

.tr-modal-img-wrap canvas.loading {
  animation: tr-pulse 1.5s ease-in-out infinite;
}

.tr-modal-description {
  padding: 12px 20px 20px;
  color: color-mix(in srgb, var(--ink-on-dark) 80%, transparent);
  font-size: 14px;
  line-height: 1.5;
  text-align: center;
  flex-shrink: 0;
}

#trDeleteSegmentModal {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: color-mix(in srgb, var(--surface-dark) 55%, transparent);
  z-index: 1100;
}

#trDeleteSegmentModal .modal-content {
  width: min(520px, 100%);
  background: var(--paper);
  border-radius: 16px;
  box-shadow: 0 24px 48px rgba(0, 0, 0, 0.22);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* Title and buttons stay put; only the body scrolls on a short screen. */
#trDeleteSegmentModal .modal-header,
#trDeleteSegmentModal .modal-footer {
  flex: none;
}

#trDeleteSegmentModal .modal-body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
}

#trDeleteSegmentModal .modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--hairline);
}

#trDeleteSegmentModal .modal-header h3 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  color: var(--ink);
}

#trDeleteSegmentModal .modal-header.danger h3 {
  color: var(--danger);
}

#trDeleteSegmentModal .modal-body {
  padding: 20px 24px;
}

#trDeleteSegmentModal .modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  padding: 0 24px 24px;
}

#trDeleteSegmentModal .close {
  color: var(--ink-faint);
  font-size: 28px;
  line-height: 1;
  cursor: pointer;
  transition: color 0.15s ease;
}

#trDeleteSegmentModal .close:hover {
  color: var(--ink-soft);
}

#trDeleteSegmentModal .close:active {
  color: var(--ink);
}

#trDeleteSegmentModal .btn-secondary,
#trDeleteSegmentModal .btn-danger {
  border: none;
  border-radius: 10px;
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
}

#trDeleteSegmentModal .btn-secondary {
  background: var(--cream-bright);
  color: var(--ink-soft);
}

#trDeleteSegmentModal .btn-secondary:hover {
  background: var(--hairline);
}

#trDeleteSegmentModal .btn-secondary:active {
  transform: translateY(1px);
}

#trDeleteSegmentModal .btn-danger {
  background: var(--danger);
  color: var(--ink-on-danger);
}

#trDeleteSegmentModal .btn-danger:hover {
  background: color-mix(in srgb, var(--danger) 78%, var(--surface-dark));
}

#trDeleteSegmentModal .btn-danger:active {
  transform: translateY(1px);
}

#trDeleteSegmentModal .delete-warning {
  padding: 16px 18px;
  border-radius: 12px;
  background: var(--danger-wash);
  border-left: 4px solid var(--hairline-2);
  color: var(--danger);
}

#trDeleteSegmentModal .delete-warning p {
  margin: 0 0 12px;
}

#trDeleteSegmentModal .delete-warning p:last-child {
  margin-bottom: 0;
}

#trDeleteSegmentModal .tr-delete-segment-meta {
  font-size: 14px;
}

#trDeleteSegmentModal .tr-delete-segment-meta strong {
  white-space: nowrap;
}

#trDeleteSegmentModal .delete-warning .tr-delete-segment-meta {
  color: var(--danger);
}

#trDeleteSegmentModal .tr-delete-segment-list {
  margin: 0 0 12px;
  padding-left: 20px;
}

#trDeleteSegmentModal .tr-delete-segment-list li + li {
  margin-top: 6px;
}

#trDeleteSegmentModal .tr-delete-segment-size {
  font-size: 13px;
  color: var(--ink-soft);
}

/* The first step moves to the trash and is not danger-styled; erase now has its own step. */
#trDeleteSegmentModal .trash-dlg-note {
  padding: 16px 18px;
  border-radius: 12px;
  background: var(--cream);
  border-left: 4px solid var(--hairline-2);
  color: var(--ink);
}

#trDeleteSegmentModal .trash-dlg-note p {
  margin: 0 0 12px;
}

#trDeleteSegmentModal .trash-dlg-note p:last-child {
  margin-bottom: 0;
}

#trDeleteSegmentModal .trash-dlg-foot {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5em;
}

#trDeleteSegmentModal .trash-dlg-foot[hidden] {
  display: none;
}

#trDeleteSegmentModal .trash-dlg-right {
  margin-left: auto;
  display: flex;
  gap: 0.5em;
}

#trDeleteSegmentModal .trash-primary,
#trDeleteSegmentModal .trash-danger-outline {
  border-radius: 10px;
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

#trDeleteSegmentModal .trash-primary {
  background: var(--orange);
  color: var(--ink-on-brand);
  border: 0;
}

#trDeleteSegmentModal .trash-danger-outline {
  background: var(--paper);
  color: var(--danger);
  border: 1px solid var(--danger);
}

@media (max-width: 480px) {
  #trDeleteSegmentModal .trash-dlg-foot button {
    min-height: 44px;
    padding-left: 12px;
    padding-right: 12px;
    white-space: nowrap;
  }
}

/* The set dialog lists up to five segments, then how many more. */
#trDeleteSegmentModal .trash-set-list {
  list-style: none;
  margin: 0 0 12px;
  padding: 0;
  font-size: 14px;
}

#trDeleteSegmentModal .trash-set-list li + li {
  margin-top: 2px;
}

#trDeleteSegmentModal .trash-set-more {
  color: var(--ink-soft);
}

/* Select mode: the transcript gives way to a list of this range's segments. */
.tr-head-actions { display: inline-flex; align-items: center; gap: 8px; }
.tr-pick-btn { padding: .4em .9em; font-size: .9em; font-weight: 600; border: 0; border-radius: 6px; background: var(--cream-bright); color: var(--ink-soft); cursor: pointer; }
.tr-pick-btn:hover { background: var(--hairline); }
.tr-pick-btn[hidden], .tr-pick-panel[hidden] { display: none; }
.tr-picking > .tr-tabs, .tr-picking > .tr-warning-notice, .tr-picking > .tr-panel, .tr-picking .tr-head-actions { display: none !important; }
.tr-pick-panel .log-entries { max-height: none; overflow: visible; padding: 0; }
.tr-pick-panel .trash-bar { position: sticky; top: 0; z-index: 1; min-height: 2.5em; padding: .5em 1em .5em .85em; border-bottom: 1px solid var(--hairline); background: var(--cream); border-radius: 8px 8px 0 0; }
.tr-pick-panel .trash-bar:focus { outline: none; }
.tr-pick-panel .trash-bar-group { display: flex; align-items: center; flex-wrap: wrap; gap: .5em .75em; }
.tr-pick-panel .trash-bar-group[hidden] { display: none; }
.tr-pick-panel .trash-count, .tr-pick-panel .trash-all { color: var(--ink-soft); font-weight: 600; font-size: .9em; }
.tr-pick-panel .trash-all { display: inline-flex; align-items: center; gap: .5em; cursor: pointer; }
.tr-pick-panel .trash-bar-actions { margin-left: auto; display: flex; gap: .5em; }
.tr-pick-panel .trash-row { display: flex; align-items: flex-start; gap: .75em; padding: .65em 1em; font-size: .85em; cursor: pointer; }
.tr-pick-panel .trash-row + .trash-row { border-top: 1px solid var(--hairline); }
.tr-pick-panel .trash-row input { margin-top: .25em; flex: none; }
.tr-pick-panel .trash-row-body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.tr-pick-panel .trash-row-body > span { display: block; }
.tr-pick-panel .removal-line { display: flex; flex-wrap: wrap; align-items: baseline; row-gap: 0.1em; }
.tr-pick-panel .removal-what { color: var(--ink); font-weight: 500; }
.tr-pick-panel .removal-time { white-space: nowrap; }
.tr-pick-panel .removal-qual { color: var(--ink-faint); font-weight: 400; }
.tr-pick-panel .removal-qual::before { content: "\00b7"; margin: 0 0.4em; }
.tr-pick-note { margin-top: .25em; color: var(--ink-soft); font-size: .95em; }
.tr-zoom-pill.tr-picked::after { content: "\2713"; position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font: 700 12px/1 system-ui; color: var(--ink); }
@media (max-width: 768px) {
  .tr-picking .tr-segment-picker { display: none; }
}
@media (max-width: 480px) {
  .tr-pick-panel .trash-row, .tr-pick-panel .trash-all { min-height: 44px; }
  .tr-pick-panel .trash-row input, .tr-pick-panel .trash-all input { width: 20px; height: 20px; }
  .tr-pick-btn { min-height: 44px; }
}

/* Unified timeline view */
.tr-unified {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* .tr-entry sets display:flex, which outranks the UA [hidden] rule, so the
   bound list has to hide its held-back entries itself. */
.tr-unified > [role="listitem"][hidden] {
  display: none;
}

/* Only the first TR_ENTRY_VISIBLE_MAX entries render on open; this control
   reveals the rest of the block. Full-width and 44px tall so it stays a
   phone-sized target. */
.tr-entry-more {
  display: block;
  width: 100%;
  min-height: 44px;
  margin: 12px 0 0;
  padding: 12px 16px;
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  text-align: left;
  color: var(--orange-text-aa);
  background: var(--cream-bright);
  border: 1px solid var(--hairline);
  border-radius: 8px;
  cursor: pointer;
}

.tr-entry-more:hover {
  background: var(--orange-wash);
}

.tr-entry-more:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.tr-location-toggle,
.tr-location-row {
  display: block;
  width: 100%;
  min-height: 44px;
  margin: 8px 0 0;
  padding: 12px 16px;
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  text-align: left;
  color: var(--orange-text-aa);
  background: var(--cream-bright);
  border: 1px solid var(--hairline);
  border-radius: 8px;
  cursor: pointer;
}

.tr-location-toggle:hover,
.tr-location-row:hover {
  background: var(--orange-wash);
}

.tr-location-toggle:focus-visible,
.tr-location-row:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.tr-location-rows {
  margin-top: 4px;
}

.tr-location-section {
  margin-top: 16px;
}

.tr-location-heading {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
}

[data-location-notice] {
  margin-top: 16px;
  font-size: 13px;
  color: var(--text-secondary);
}

.tr-audio-players {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 16px;
  background: var(--cream-bright);
  border-radius: 12px;
  border: 1px solid var(--hairline);
}

.tr-audio-player {
  flex: 1;
  min-width: 200px;
}

.tr-audio-player audio {
  width: 100%;
}

.tr-audio-player-label {
  font-size: 12px;
  color: var(--ink-faint);
  margin-bottom: 4px;
}

.tr-purge-notice {
  padding: 0.5em 0.75em;
  margin-bottom: 0.5em;
  font-size: 0.8em;
  color: var(--ink-faint);
  background: var(--cream-bright);
  border-radius: 4px;
  border-left: 3px solid var(--hairline-2);
}

.tr-entry {
  display: flex;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s;
}

.tr-entry:hover {
  background: var(--cream-bright);
}

.tr-entry-audio {
  border-left: 3px solid var(--hairline-2);
}

.tr-entry-audio:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: -1px;
}

.tr-entry-audio:active {
  background: var(--cream-bright);
}

.tr-entry.tr-entry-active {
  background: var(--cream-bright);
  border-left-color: var(--orange-ink);
}

.tr-entry-screen {
  border-left: 3px solid var(--hairline-2);
}

.tr-entry-browser {
  border-left: 3px solid var(--ink-faint);
  cursor: default;
}

.tr-entry-time {
  flex-shrink: 0;
  width: 48px;
  font-size: 12px;
  color: var(--ink-faint);
  font-family: ui-monospace, monospace;
}

.tr-entry-content {
  flex: 1;
  min-width: 0;
}

.tr-entry-text {
  font-size: 14px;
  line-height: 1.5;
}

/* A possible name the journal suggests for the words before it: tentative,
   never part of what was said. */
.tr-possible-name {
  color: var(--ink-faint);
  font-style: italic;
}

.tr-entry-meta {
  font-size: 11px;
  color: var(--ink-faint);
  margin-top: 2px;
}

.tr-entry-browser .tr-entry-content {
  display: grid;
  gap: 6px;
}

.tr-browser-site {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: baseline;
  color: var(--ink-faint);
  font-size: 12px;
  font-weight: 600;
}

.tr-browser-title {
  color: var(--ink-faint);
  font-weight: 400;
}

.tr-entry-thumb {
  flex-shrink: 0;
  width: 120px;
  height: 68px;
  border-radius: 6px;
  object-fit: cover;
  border: 1px solid var(--hairline);
  background: var(--cream-bright);
  cursor: pointer;
  transition: box-shadow 0.15s ease, border-color 0.15s ease;
}

.tr-entry-thumb:hover {
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
  border-color: var(--hairline-2);
}

/* A screenshot is kept by the owner's choice, so it shows at its own shape
   and a size you can recognise: a phone's tall, a computer's wide. */
.tr-entry-screenshot .tr-entry-content {
  align-items: flex-start;
  flex-wrap: wrap;
}

/* The text sits beside a tall screenshot and wraps below a wide one. */
.tr-entry-screenshot .tr-entry-desc {
  flex: 1 1 240px;
  min-width: 240px;
}

.tr-entry-shot {
  flex-shrink: 0;
  display: block;
  width: auto;
  height: auto;
  max-width: min(100%, 440px);
  max-height: 360px;
  border-radius: 6px;
  border: 1px solid var(--hairline);
  background: var(--cream-bright);
  cursor: zoom-in;
  object-fit: contain;
  transition: box-shadow 0.15s ease, border-color 0.15s ease;
}

.tr-entry-shot:hover {
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
  border-color: var(--hairline-2);
}

.tr-shot-label {
  color: var(--ink-faint);
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 4px;
}

.tr-shot-waiting {
  color: var(--ink-faint);
}

.tr-shot-final .tr-shot-action {
  margin-top: 6px;
}

.tr-shot-action a {
  color: var(--orange-text-aa);
  text-decoration: underline;
  text-underline-offset: 2px;
}

.tr-entry-thumb.loading {
  animation: tr-pulse 1.5s ease-in-out infinite;
}

@keyframes tr-pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

.tr-entry-screen .tr-entry-content {
  display: flex;
  gap: 12px;
  align-items: center;
}

.tr-entry-desc {
  flex: 1;
  min-width: 0;
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.5;
}

.tr-entry-badge {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
  background: var(--warn-wash);
  color: var(--ink-faint);
  margin-right: 6px;
}

.tr-entry-badge-monitor {
  background: var(--orange-wash);
  color: var(--ink-soft);
}

.tr-speaker-label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-soft);
  margin-bottom: 2px;
}

.tr-speaker-label a {
  color: var(--ink-soft);
  text-decoration: none;
}

.tr-speaker-label a:hover {
  color: var(--ink-soft);
  text-decoration: underline;
}

.tr-speaker-label a:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 2px;
}

.tr-speaker-label a:active {
  color: var(--ink);
}

.tr-speaker-label-owner {
  color: var(--orange-text-aa);
}

.tr-speaker-label-owner a {
  color: var(--orange-text-aa);
}

.tr-speaker-label-owner a:active {
  color: var(--ink);
}

.tr-speaker-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.tr-speaker-dot-high {
  background: var(--success);
}

.tr-speaker-dot-medium {
  background: var(--warn);
}

.tr-speaker-slot {
  margin-bottom: 4px;
}

.tr-speaker-chip,
.tr-speaker-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
}

.tr-speaker-chip {
  color: var(--ink-soft);
}

.tr-speaker-chip-neutral {
  color: var(--ink-faint);
}

.tr-speaker-button {
  min-height: var(--touch-min);
  min-width: var(--touch-min);
  padding: 4px 8px;
  border: 1px solid var(--hairline-2);
  background: var(--paper);
  color: var(--ink-soft);
  cursor: pointer;
}

.tr-speaker-button:hover {
  border-color: var(--hairline-2);
  background: var(--cream-bright);
}

.tr-speaker-button:focus-visible,
.tr-speaker-picker-option:focus-visible,
.tr-speaker-picker-close:focus-visible,
.tr-speaker-status-retry:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.tr-speaker-button[aria-busy="true"] {
  opacity: 0.7;
  cursor: progress;
}

.tr-speaker-disabled {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--ink-faint);
  font-size: 12px;
}

.tr-speaker-popover {
  position: fixed;
  z-index: 2000;
  width: min(320px, calc(100vw - 24px));
  max-height: min(420px, calc(100vh - 24px));
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  border: 1px solid var(--hairline-2);
  border-radius: 8px;
  background: var(--paper);
  box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
}

.tr-speaker-picker-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.tr-speaker-picker-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
}

.tr-speaker-picker-scope-note {
  font-size: 12px;
  color: var(--ink-faint);
  margin-top: -4px;
}

.tr-speaker-picker-scope {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: var(--touch-min);
  font-size: 13px;
  color: var(--ink);
}

.tr-speaker-picker-close {
  min-height: var(--touch-min);
  min-width: var(--touch-min);
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--ink-faint);
  cursor: pointer;
}

.tr-speaker-picker-search {
  min-height: var(--touch-min);
  min-width: var(--touch-min);
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--hairline-2);
  border-radius: 6px;
  font-size: 14px;
}

.tr-speaker-picker-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow: auto;
}

.tr-speaker-picker-option {
  min-height: var(--touch-min);
  min-width: var(--touch-min);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--ink);
  text-align: left;
  cursor: pointer;
}

.tr-speaker-picker-option:hover {
  background: var(--cream-bright);
}

.tr-speaker-picker-divider {
  width: 100%;
  margin: 4px 0;
  border: 0;
  border-top: 1px solid var(--hairline);
}

.tr-speaker-picker-handoff {
  color: var(--orange-text-aa);
  text-decoration: underline;
}

.tr-speaker-picker-title-line {
  display: none;
}

.tr-speaker-picker-title-time {
  color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}

.tr-speaker-picker-tail,
.tr-speaker-status {
  font-size: 12px;
  color: var(--ink-faint);
}

.tr-speaker-status {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 4px;
}

.tr-speaker-status-error {
  color: var(--danger);
}

.tr-speaker-status-retry {
  min-height: var(--touch-min);
  min-width: var(--touch-min);
  padding: 6px 10px;
  border: 1px solid var(--hairline-2);
  border-radius: 6px;
  background: var(--paper);
  color: var(--ink-soft);
  cursor: pointer;
}

.tr-speaker-owner-set {
  display: inline-flex;
  color: var(--orange-ink);
}

.tr-speaker-owner-set svg {
  width: 12px;
  height: 12px;
}

.tr-speaker-picker-line-only {
  font-size: 12px;
  color: var(--ink-soft);
}

.tr-speaker-picker-line-only p {
  margin: 0;
}

.tr-speaker-picker-line-only a {
  color: var(--orange-text-aa);
}

.tr-panel > .surface-state {
  min-height: 100%;
}

/* When the day's location list follows the empty state, the empty state
   gives up the full height so the list is visible without scrolling. */
.tr-panel > .surface-state:has(~ [data-location-section]),
.tr-panel > .surface-state:has(~ [data-location-notice]) {
  min-height: 0;
}

.tr-warning-notice {
  display: none;
  flex-direction: column;
  align-items: stretch;
  gap: 6px;
  padding: 8px 12px;
  font-size: 13px;
  color: var(--warn-ink);
  background: var(--warn-wash);
  border: 1px solid var(--hairline-2);
  border-radius: 0 0 8px 8px;
  margin-top: auto;
  transition: opacity 0.3s ease;
}

.tr-warning-notice.visible {
  display: flex;
}

.tr-warning-summary {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}

.tr-warning-notice svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  stroke: var(--ink-soft);
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.tr-warning-caret {
  margin-left: auto;
}

.tr-warning-details {
  margin: 0;
  padding-left: 24px;
  color: var(--warn-ink);
}

.tr-warning-details[hidden] {
  display: none;
}

/* Markdown content styling within screen entries */
.tr-entry-desc h3 {
  display: none; /* Hide timestamp header - already shown in time column */
}

.tr-entry-desc p {
  margin: 4px 0;
}

.tr-entry-desc strong {
  color: var(--ink);
}

.tr-entry-desc pre, .tr-screen-text pre {
  background: var(--cream-bright);
  border: 1px solid var(--hairline);
  border-radius: 6px;
  padding: 8px 12px;
  margin: 8px 0;
  overflow-x: auto;
  overflow-y: auto;
  max-height: 16rem;
  font-size: 12px;
}

.tr-entry-desc pre.tr-pre-expanded,
.tr-screen-text pre.tr-pre-expanded {
  max-height: none;
}

.tr-pre-toggle {
  display: inline-block;
  margin: -4px 0 8px;
  padding: 3px 10px;
  font-size: 12px;
  line-height: 1.4;
  border: 1px solid var(--hairline, var(--hairline));
  border-radius: 6px;
  background: var(--cream, var(--paper));
  color: var(--ink-soft, var(--ink-soft));
  cursor: pointer;
}

.tr-pre-toggle:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

/* Raw payload folded away behind a disclosure (see renderScreenChunkMarkdown). */
.tr-raw-json {
  margin: 4px 0;
}

.tr-raw-json > summary {
  cursor: pointer;
  color: var(--ink-soft);
  font-size: 12px;
  line-height: 20px;
  padding: 12px 0;
}

.tr-raw-json > summary:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.tr-entry-desc code {
  font-family: ui-monospace, monospace;
  font-size: 12px;
}

.tr-entry-desc pre code {
  background: none;
  padding: 0;
}

/* Basic frame groups - collapsed by default */
.tr-group {
  border-left: 3px solid var(--hairline);
  border-radius: 8px;
  margin: 4px 0;
  background: var(--cream);
}

.tr-group-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  cursor: pointer;
  user-select: none;
}

.tr-group-header:hover {
  background: var(--cream-bright);
}

.tr-group-header:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: -1px;
}

.tr-group-header:active {
  background: var(--hairline);
}

.tr-group-chevron {
  width: 16px;
  height: 16px;
  color: var(--ink-faint);
  transition: transform 0.15s;
  flex-shrink: 0;
}

.tr-group.expanded .tr-group-chevron {
  transform: rotate(90deg);
}

.tr-group-time {
  font-size: 12px;
  color: var(--ink-faint);
  font-family: ui-monospace, monospace;
  flex-shrink: 0;
  line-height: 16px;
}

.tr-group-count {
  font-size: 12px;
  color: var(--ink-faint);
  line-height: 16px;
}

.tr-group-grid {
  display: none;
  padding: 8px 12px 12px;
  gap: 10px;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
}

.tr-group.expanded .tr-group-grid {
  display: grid;
}

.tr-group-item {
  position: relative;
  cursor: pointer;
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid var(--hairline);
  transition: box-shadow 0.15s, transform 0.15s;
}

.tr-group-item:hover {
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.tr-group-item:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}

.tr-group-item:active {
  box-shadow: 0 1px 2px rgba(0,0,0,.08);
  transform: scale(0.97);
}

.tr-group-item img,
.tr-group-item canvas {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  display: block;
  background: var(--cream-bright);
}

.tr-group-item canvas.loading {
  animation: tr-pulse 1.5s ease-in-out infinite;
}

.tr-group-item-badge {
  position: absolute;
  bottom: 4px;
  left: 4px;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
  background: color-mix(in srgb, var(--surface-dark) 60%, transparent);
  color: var(--paper);
  max-width: calc(100% - 8px);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ── Presentation mode (?present=1) — back-row legibility on a projector ── */
body.presentation-mode .tr-card { --tr-day-col: 240px; --tr-zoom-col: 150px; }
body.presentation-mode .tr-timeline-label,
body.presentation-mode .tr-zoom-timeline-label { font-size: 14px; font-weight: 700; }
body.presentation-mode .tr-label,
body.presentation-mode .tr-zoom-label { font-size: 14px; color: var(--ink); }
body.presentation-mode .tr-now-label { font-size: 14px; font-weight: 700; }
body.presentation-mode .tr-now-marker { border-top-width: 3px; }
body.presentation-mode .tr-seg { width: 48px; box-shadow: 0 2px 4px rgba(0,0,0,.10); }
body.presentation-mode .tr-seg-audio:not(.tr-seg-pending, .tr-seg-analyzing, .tr-seg-awaiting) { background: color-mix(in srgb, var(--success) 85%, transparent); border-width: 2px; }
body.presentation-mode .tr-seg-screen:not(.tr-seg-pending, .tr-seg-analyzing, .tr-seg-awaiting) { background: color-mix(in srgb, var(--warn) 85%, transparent); border-width: 2px; }
body.presentation-mode .tr-seg-browser { background: var(--cream-bright); border-width: 2px; }
body.presentation-mode .tr-zoom-pill { font-weight: 700; }
body.presentation-mode .tr-content { padding: 8px 28px 28px; gap: 20px; }
body.presentation-mode .tr-title { font-size: 28px; color: var(--ink); }
body.presentation-mode .tr-range-text { font-size: 16px; color: var(--ink-soft); }
body.presentation-mode .tr-tabs { padding: 12px 0; border-bottom-width: 2px; }
body.presentation-mode .tr-tab { font-size: 16px; font-weight: 600; padding: 10px 16px; border-width: 2px; }
body.presentation-mode .tr-tab.active { background: var(--orange-ink); border-color: var(--orange-ink); }
body.presentation-mode .tr-md-content {
  font-size: 19px;
  line-height: 1.65;
  padding: 20px;
  max-width: 78ch;
  color: var(--ink);
}
body.presentation-mode .tr-md-content code { font-size: 17px; }
body.presentation-mode .tr-panel { font-size: 18px; line-height: 1.6; padding: 20px; }
body.presentation-mode .tr-entry-time { width: 64px; font-size: 16px; color: var(--ink); font-weight: 600; }
body.presentation-mode .tr-entry-text { font-size: 19px; line-height: 1.6; color: var(--ink); }
body.presentation-mode .tr-entry-meta { font-size: 14px; color: var(--ink-faint); margin-top: 4px; }
body.presentation-mode .tr-screen-text { font-size: 16px; padding: 12px 16px; border-left-width: 4px; color: var(--ink); }

.tr-segment-picker { display: none; }
.tr-segment-picker select {
  display: block;
  width: 100%;
  min-height: 44px;
  margin-top: 6px;
  padding: 8px;
  border: 1px solid var(--hairline);
  border-radius: 8px;
  background: var(--paper);
  color: var(--ink);
  font: inherit;
}

@media (max-width: 768px) {
  .tr-segment-picker { display: block; }

  .tr-card {
    grid-template-columns: var(--tr-day-col) minmax(0, 1fr);
    grid-template-rows: auto auto;
    min-height: 0;
  }

  .tr-timeline {
    grid-column: 1;
    grid-row: 1;
    position: relative;
    top: auto;
    height: 46vh;
  }

  .tr-zoom {
    grid-column: 2;
    grid-row: 1;
    position: relative;
    top: auto;
    height: 46vh;
  }

  .tr-content {
    grid-column: 1 / -1;
    grid-row: 2;
  }
}
@media (max-width: 480px) {
  .tr-speaker-picker-title--line .tr-speaker-picker-title-any { display: none; }
  .tr-speaker-picker-title--line .tr-speaker-picker-title-line { display: inline; }
  .tr-wrap { padding: 12px; }
  .tr-content { padding: 12px; }
  .tr-panel { padding: 8px; }
  .tr-entry { flex-direction: column; gap: 6px; padding: 10px 4px; }
  .tr-entry-time { width: auto; }
}
</style>

<div class="tr-wrap">
  <div data-date-nav></div>
  <h2 class="tr-day-heading" data-date-nav-heading></h2>
  <p class="tr-day-zones" id="trDayZones" hidden></p>
  <div class="tr-card">
    <!-- Left timeline -->
    <div id="trTimeline" class="tr-timeline" aria-label="day timeline">
      <div class="tr-timeline-label">day</div>
      <div class="tr-grid" id="trGrid"></div>
      <div class="tr-labels" id="trLabels"></div>
      <div class="tr-segments" id="trSegments"></div>
      <div class="tr-body-events" id="trBodyEvents" aria-label="body context events"></div>
      <div class="tr-sel-wrap" id="trSelWrap">
        <div class="tr-sel" data-handle="move">
          <div class="tr-bumper tr-bumper-top" data-handle="start" title="drag to adjust start"></div>
          <div class="tr-bumper tr-bumper-bottom" data-handle="end" title="drag to adjust end"></div>
        </div>
      </div>
      <div class="tr-timeline-legend">
        <span><span class="tr-legend-dot" style="background: var(--success);"></span>audio</span>
        <span><span class="tr-legend-dot" style="background: var(--warn);"></span>screen</span>
        <span><span class="tr-legend-dot" style="background: var(--orange);"></span>import</span>
        <span><span class="tr-legend-dot" style="background: var(--ink-soft);"></span>sleep</span>
        <span><span class="tr-legend-dot" style="background: var(--danger);"></span>workout</span>
      </div>
    </div>

    <!-- Middle zoom timeline -->
    <div class="tr-zoom" id="trZoom">
      <div class="tr-zoom-timeline-label">detail</div>
      <div class="tr-zoom-grid" id="trZoomGrid"></div>
      <div class="tr-zoom-labels" id="trZoomLabels"></div>
      <div class="tr-zoom-segments" id="trZoomSegments"></div>
    </div>

    <!-- Right content panel -->
    <div class="tr-content" id="trContent">
      <label class="tr-segment-picker" for="trSegmentPicker">segments in this range
        <select id="trSegmentPicker" disabled><option value="">choose a segment</option></select>
      </label>
      <div class="tr-header">
        <div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <h2 class="tr-title">transcripts</h2>
            <button type="button" id="trCopyStreamBtn" class="tr-copy-stream-btn" aria-label="copy stream id" style="display: none;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            </button>
            <div id="trToast" class="tr-toast" role="status" aria-live="polite" hidden></div>
          </div>
          <div class="tr-range-text" id="trRangeText"></div>
        </div>
        <span class="tr-head-actions">
          <button type="button" id="trSelectBtn" class="tr-pick-btn" hidden></button>
          <button type="button" id="trDeleteBtn" class="tr-delete-btn" title="delete segment">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </span>
      </div>
      <div class="tr-tabs" id="trTabs"></div>
	      <div id="trWarningNotice" class="tr-warning-notice" aria-expanded="false">
	        <div class="tr-warning-summary" role="button" tabindex="0">
	          <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
	          <span id="trWarningText"></span>
	          <span class="tr-warning-caret" id="trWarningCaret">▾</span>
	        </div>
	        <ul class="tr-warning-details" id="trWarningDetails" hidden></ul>
	      </div>
      <div class="tr-panel" id="trPanel">
        <div class="surface-state surface-state--loading" role="status">
          <div class="surface-state-spinner" aria-hidden="true"></div>
          <span class="surface-state-text" data-role="loading-status">loading this day…</span>
          <span class="surface-state-still" data-role="still-working" aria-hidden="true">still working&hellip;</span>
        </div>
      </div>
      <!-- Select mode: the segments in this range, to delete several at once -->
      <div class="log-panel tr-pick-panel" id="trPickPanel" hidden>
        <div class="trash-bar" id="trPickBar" tabindex="-1">
          <div class="trash-bar-group" id="trPickIdle">
            <label class="trash-all"><input type="checkbox" id="trPickAll"> <span id="trPickAllLabel"></span></label>
            <span class="trash-bar-actions"><button type="button" class="tr-pick-btn" id="trPickDoneIdle"></button></span>
          </div>
          <div class="trash-bar-group" id="trPickSome" hidden>
            <span class="trash-count" id="trPickCount"></span>
            <span class="trash-bar-actions"><button type="button" class="tr-pick-btn" id="trPickDelete"></button><button type="button" class="tr-pick-btn" id="trPickDoneSome"></button></span>
          </div>
        </div>
        <div class="log-entries" id="trPickList"></div>
      </div>
    </div>
  </div>
</div>

<aside id="trBodyPanel" class="tr-body-panel" aria-hidden="true" aria-labelledby="trBodyPanelTitle">
  <div class="tr-body-panel-header">
    <div>
      <h3 id="trBodyPanelTitle">body context</h3>
      <p id="trBodyPanelRange"></p>
    </div>
    <button type="button" id="trBodyPanelClose" class="tr-body-panel-close">close</button>
  </div>
  <div id="trBodyPanelBody" class="tr-body-panel-body"></div>
</aside>

<div id="trDeleteSegmentModal" class="modal" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="trDeleteSegmentModalTitle">
  <div class="modal-content">
    <div class="modal-header" id="trDeleteSegmentModalHeader">
      <h3 id="trDeleteSegmentModalTitle"></h3>
      <span class="close" id="trDeleteSegmentModalClose">&times;</span>
    </div>
    <div class="modal-body">
      <div id="trDeleteSegmentModalBody" class="trash-dlg-note"></div>
    </div>
    <div class="modal-footer trash-dlg-foot" id="trDeleteSegmentModalMoveFoot">
      <button type="button" id="trDeleteSegmentModalErase" class="trash-danger-outline"></button>
      <span class="trash-dlg-right">
        <button type="button" id="trDeleteSegmentModalCancel" class="btn-secondary"></button>
        <button type="button" id="trDeleteSegmentModalConfirm" class="trash-primary"></button>
      </span>
    </div>
    <div class="modal-footer trash-dlg-foot" id="trDeleteSegmentModalEraseFoot" hidden>
      <span class="trash-dlg-right">
        <button type="button" id="trDeleteSegmentModalBack" class="btn-secondary"></button>
        <button type="button" id="trDeleteSegmentModalEraseConfirm" class="btn-danger"></button>
      </span>
    </div>
  </div>
</div>

<script src="/app/transcripts/static/transcripts.js"></script>
