<style>
/* Transcripts app styles - all classes prefixed with .tr- to avoid conflicts */

/* Columns are sticky+viewport-height; the content column scrolls the page. */

/* Main container */
.tr-wrap {
  max-width: 1400px;
  margin: 0 auto;
  padding: 16px 24px;
  box-sizing: border-box;
}

.tr-card {
  min-height: calc(100vh - 48px);
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  display: grid;
  --tr-day-col: 200px;
  --tr-zoom-col: 120px;
  grid-template-columns: var(--tr-day-col) var(--tr-zoom-col) minmax(0, 1fr);
}



/* Left timeline */
.tr-timeline {
  --tr-legend-h: 30px;
  position: sticky;
  top: 16px;
  align-self: start;
  border-right: 1px solid #d1d5db;
  user-select: none;
  height: calc(100vh - 32px);
  overflow: hidden;
  touch-action: pan-y;
  cursor: crosshair;
  padding: 12px 0;
  box-sizing: border-box;
}

.tr-timeline-label {
  position: absolute;
  top: 0;
  left: 64px;
  right: 0;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: #9ca3af;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 700;
  pointer-events: none;
  z-index: 3;
  border-bottom: 1px solid #e5e7eb;
}

.tr-timeline-legend {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--tr-legend-h);
  display: flex;
  flex-wrap: wrap;
  align-content: center;
  justify-content: center;
  box-sizing: border-box;
  column-gap: 8px;
  row-gap: 0;
  padding: 0 4px;
  font-size: 12px;
  line-height: 14px;
  color: #9ca3af;
  background: #fff;
  pointer-events: none;
  z-index: 3;
}

.tr-legend-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 4px;
  vertical-align: baseline;
  position: relative;
  top: 1px;
}

.tr-grid {
  position: absolute;
  top: 16px;
  bottom: var(--tr-legend-h, 12px);
  left: 0;
  right: 0;
}

.tr-grid-hour {
  position: absolute;
  left: 0;
  right: 0;
  border-top: 1px solid #e5e7eb;
}

.tr-grid-quarter {
  position: absolute;
  left: 0;
  right: 0;
  border-top: 1px dashed #f3f4f6;
}

.tr-labels {
  position: absolute;
  left: 0;
  top: 16px;
  bottom: var(--tr-legend-h, 12px);
  width: 64px;
  background: #f9fafb;
  border-right: 1px solid #e5e7eb;
  pointer-events: none;
}

.tr-label {
  position: absolute;
  right: 0;
  padding-right: 8px;
  transform: translateY(-50%);
  font-size: 12px;
  color: #6b7280;
  font-variant-numeric: tabular-nums;
}

.tr-labels .tr-label:last-child {
  transform: translateY(-100%);
}

/* Selection box */
.tr-sel-wrap {
  position: absolute;
  left: 64px;
  right: 8px;
  pointer-events: none;
  z-index: 4;
}

.tr-sel {
  position: absolute;
  left: 0;
  right: -4px;
  height: 100%;
  background: var(--orange-wash);
  border: 1px solid var(--orange);
  border-radius: 12px;
  box-shadow: 0 1px 2px rgba(0,0,0,.06);
  pointer-events: auto;
  cursor: grab;
  touch-action: none;
}

.tr-sel:active {
  cursor: grabbing;
}

.tr-sel:hover {
  background: var(--orange-wash);
  border-color: var(--orange-ink);
}

.tr-sel:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.tr-bumper {
  position: absolute;
  left: 28px;
  right: 28px;
  margin: auto;
  height: 14px;
  border: 1px solid var(--orange);
  border-radius: 999px;
  background: var(--orange-wash);
  cursor: ns-resize;
  touch-action: none;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.tr-bumper-top {
  top: -7px;
}

.tr-bumper-bottom {
  bottom: -7px;
}

.tr-bumper:hover {
  background: var(--orange-wash);
  border-color: var(--orange-ink);
}

.tr-bumper:active {
  background: var(--orange-wash);
  border-color: var(--orange-ink);
}

/* Segments lane (audio/screen indicators) */
.tr-segments {
  --seg-col-0: 8px;
  --seg-col-1: 56px;
  position: absolute;
  left: 64px;
  right: 0;
  top: 16px;
  bottom: var(--tr-legend-h, 12px);
  pointer-events: none;
  z-index: 1;
}

.tr-seg {
  position: absolute;
  width: 40px;
  border-radius: 12px;
  box-shadow: 0 1px 1px rgba(0,0,0,.04);
  pointer-events: auto;
  cursor: pointer;
  transition: filter 0.15s ease, box-shadow 0.15s ease;
}

/* Short segments (a 5-minute import renders ~2px tall) stay clickable: a
   transparent ::after extends the pointer target to at least 14px tall,
   centered on the segment, without distorting the rendered geometry. */
.tr-seg::after {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 100%;
  min-height: 14px;
  transform: translateY(-50%);
}

.tr-seg:focus-visible {
  outline: 2px solid var(--accent, #4a9eff);
  outline-offset: 1px;
}

.tr-seg:hover {
  filter: brightness(0.92);
  box-shadow: 0 2px 4px rgba(0,0,0,.10);
}

.tr-seg:active {
  filter: brightness(0.88);
  box-shadow: 0 1px 2px rgba(0,0,0,.08);
}

.tr-seg-col-0 { left: var(--seg-col-0); }
.tr-seg-col-1 { left: var(--seg-col-1); }

.tr-seg-audio {
  background: rgba(134, 239, 172, 0.6);
  border: 1px solid #4ade80;
}

.tr-seg-screen {
  background: rgba(253, 230, 138, 0.6);
  border: 1px solid #eab308;
}

.tr-seg-browser {
  background: rgba(147, 197, 253, 0.55);
  border: 1px solid #2563eb;
}

.tr-seg-markdown {
  background: rgba(232, 145, 58, 0.32);
  border: 1px solid var(--orange);
}

.tr-body-events {
  position: absolute;
  /* Audio is x=72..112 and screen/import is x=120..160. Body starts after
     them; 24px blocks end at x=192, keeping an 8px gutter inside the
     200px day column instead of clipping. */
  left: 168px;
  top: 16px;
  bottom: var(--tr-legend-h, 12px);
  width: 24px;
  pointer-events: none;
  z-index: 1;
}

.tr-body-event {
  position: absolute;
  left: 0;
  width: 24px;
  min-height: 4px;
  border-radius: 12px;
  box-shadow: 0 1px 1px rgba(0,0,0,.04);
  pointer-events: auto;
  cursor: pointer;
  transition: filter 0.15s ease, box-shadow 0.15s ease;
}

.tr-body-event:hover {
  filter: brightness(0.94);
  box-shadow: 0 2px 4px rgba(0,0,0,.10);
}

.tr-body-event:focus-visible {
  outline: 2px solid var(--accent, #4a9eff);
  outline-offset: 1px;
}

.tr-body-event-sleep {
  background: rgba(110, 100, 83, 0.4);
  border: 1px solid var(--ink-soft);
}

.tr-body-event-workout {
  background: rgba(201, 154, 46, 0.4);
  border: 1px solid var(--warn-ink);
}

.tr-seg-pending {
  opacity: 0.9;
  border-style: dashed;
}

.tr-seg-audio.tr-seg-pending {
  background:
    repeating-linear-gradient(
      135deg,
      rgba(74, 222, 128, 0.45) 0,
      rgba(74, 222, 128, 0.45) 3px,
      rgba(134, 239, 172, 0.16) 3px,
      rgba(134, 239, 172, 0.16) 8px
    );
  border-color: #22c55e;
}

.tr-seg-screen.tr-seg-pending {
  background:
    repeating-linear-gradient(
      135deg,
      rgba(234, 179, 8, 0.45) 0,
      rgba(234, 179, 8, 0.45) 3px,
      rgba(253, 230, 138, 0.18) 3px,
      rgba(253, 230, 138, 0.18) 8px
    );
  border-color: #ca8a04;
}

.tr-seg-awaiting {
  opacity: 1;
  border-style: solid;
}

.tr-seg-audio.tr-seg-awaiting {
  background: rgba(245, 158, 11, 0.58);
  border-color: #b45309;
}

.tr-seg-screen.tr-seg-awaiting {
  background: rgba(251, 191, 36, 0.58);
  border-color: #b45309;
}

.tr-seg-analyzing {
  opacity: 1;
  border-style: solid;
  animation: tr-analyzing-pulse 1.5s ease-in-out infinite;
}

.tr-seg-audio.tr-seg-analyzing {
  background: rgba(45, 212, 191, 0.58);
  border-color: #0d9488;
}

.tr-seg-screen.tr-seg-analyzing {
  background: rgba(96, 165, 250, 0.58);
  border-color: #2563eb;
}

@keyframes tr-analyzing-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}

.tr-now-marker {
  position: absolute;
  left: 64px;
  right: 0;
  height: 0;
  border-top: 2px solid #ef4444;
  z-index: 3;
  pointer-events: none;
}

.tr-now-label {
  position: absolute;
  left: 4px;
  top: -8px;
  font-size: 12px;
  color: #ef4444;
  font-weight: 500;
  line-height: 1;
}

/* Right content panel */
.tr-content {
  padding: 4px 24px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  box-sizing: border-box;
}

.tr-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

.tr-header > div {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.tr-title {
  font-size: 20px;
  font-weight: 600;
  margin: 0;
}

.tr-range-text {
  color: #6b7280;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

.tr-tabs {
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid #e5e7eb;
  flex-shrink: 0;
  display: none;
}

.tr-tabs.visible {
  display: flex;
}

.tr-tab {
  padding: 8px 12px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  background: #fff;
  color: #374151;
  transition: all 0.15s;
}

.tr-tab:hover {
  background: #f9fafb;
}

.tr-tab.active {
  background: #3b82f6;
  border-color: #3b82f6;
  color: #fff;
}

.tr-tab:focus-visible {
  outline: 2px solid var(--accent, #4a9eff);
  outline-offset: 1px;
}

.tr-tab:active:not(.active) {
  background: #f3f4f6;
  border-color: #9ca3af;
}

.tr-tab-pane {
  display: none;
  height: 100%;
}

.tr-tab-pane:focus-visible {
  outline: 2px solid var(--accent, #4a9eff);
  outline-offset: 2px;
}

.tr-tab-pane.active {
  display: block;
}

.tr-state-stack {
  display: grid;
  gap: 12px;
  padding: 16px;
}

.tr-analyze-action[disabled] {
  cursor: progress;
  opacity: 0.65;
}

.tr-analyze-error {
  margin: 8px 0 0;
  color: #991b1b;
  font-size: 13px;
}

.tr-md-content {
  padding: 16px;
  line-height: 1.6;
  font-size: 14px;
  max-width: 70ch;
}

.tr-md-content h1, .tr-md-content h2, .tr-md-content h3 {
  margin-top: 16px;
  margin-bottom: 8px;
}

.tr-md-content p {
  margin-bottom: 12px;
}

.tr-md-content ul, .tr-md-content ol {
  margin-bottom: 12px;
  padding-left: 24px;
}

.tr-md-content code {
  background: #f3f4f6;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 13px;
}

.tr-md-content pre {
  background: #f3f4f6;
  padding: 12px;
  border-radius: 6px;
  overflow-x: auto;
  margin-bottom: 12px;
}

.tr-body-strip,
.tr-body-context-card,
.tr-body-panel {
  border: 1px solid var(--border, #e5e7eb);
  background: var(--surface, #ffffff);
  box-shadow: 0 1px 2px rgba(0,0,0,.04);
}

.tr-body-strip {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0 0 12px;
  padding: 10px 12px;
  border-radius: 10px;
  color: #374151;
  font-size: 13px;
}

.tr-body-strip-label {
  color: #6b7280;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-size: 11px;
}

.tr-body-strip-separator {
  color: #9ca3af;
}

.tr-body-strip-button,
.tr-body-context-button,
.tr-body-panel-close,
.tr-body-link {
  border: 1px solid var(--border, #d1d5db);
  background: #ffffff;
  color: #111827;
  border-radius: 999px;
  padding: 5px 10px;
  font: inherit;
  cursor: pointer;
}

.tr-body-link {
  display: inline-flex;
  align-items: center;
  text-decoration: none;
}

.tr-body-strip-button:hover,
.tr-body-context-button:hover,
.tr-body-panel-close:hover,
.tr-body-link:hover {
  background: #f9fafb;
}

.tr-body-strip-button:focus-visible,
.tr-body-context-button:focus-visible,
.tr-body-panel-close:focus-visible,
.tr-body-link:focus-visible {
  outline: 2px solid var(--accent, #4a9eff);
  outline-offset: 1px;
}

.tr-body-context-card {
  display: grid;
  gap: 12px;
  margin: 16px;
  padding: 18px;
  border-radius: 12px;
  max-width: 760px;
}

.tr-body-context-card h3,
.tr-body-panel h3 {
  margin: 0;
  font-size: 18px;
}

.tr-body-context-card p,
.tr-body-panel p {
  margin: 0;
  color: #4b5563;
}

.tr-body-context-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.tr-body-context-fact {
  border: 1px solid #e5e7eb;
  border-radius: 999px;
  padding: 5px 9px;
  background: #f9fafb;
  color: #374151;
  font-size: 12px;
}

.tr-body-rhythm {
  display: grid;
  gap: 8px;
}

.tr-body-rhythm-title {
  color: #6b7280;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.tr-body-rhythm-grid {
  display: grid;
  grid-template-columns: repeat(24, minmax(8px, 1fr));
  gap: 3px;
  align-items: end;
}

.tr-body-hour {
  position: relative;
  min-width: 0;
  min-height: 34px;
  border: 1px solid #e5e7eb;
  border-radius: 5px;
  padding: 0;
  background: #f9fafb;
  cursor: pointer;
}

.tr-body-hour-empty {
  cursor: default;
  opacity: 0.48;
}

.tr-body-hour-level-1 { background: #eff6ff; border-color: #bfdbfe; }
.tr-body-hour-level-2 { background: #dbeafe; border-color: #93c5fd; }
.tr-body-hour-level-3 { background: #bfdbfe; border-color: #60a5fa; }
.tr-body-hour-level-4 { background: #93c5fd; border-color: #3b82f6; }

.tr-body-hour:hover:not(.tr-body-hour-empty) {
  filter: brightness(0.96);
}

.tr-body-hour:focus-visible {
  outline: 2px solid var(--accent, #4a9eff);
  outline-offset: 1px;
}

.tr-body-hour-label {
  position: absolute;
  top: calc(100% + 3px);
  left: 50%;
  transform: translateX(-50%);
  color: #6b7280;
  font-size: 9px;
  white-space: nowrap;
}

.tr-body-hour-list {
  display: grid;
  gap: 6px;
  margin: 4px 0 0;
  padding: 0;
  list-style: none;
}

.tr-body-hour-list li {
  display: grid;
  grid-template-columns: minmax(82px, auto) 1fr;
  gap: 10px;
  align-items: baseline;
  color: #374151;
  font-size: 13px;
}

.tr-body-hour-list time {
  color: #6b7280;
  font-variant-numeric: tabular-nums;
}

.tr-body-context-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
}

.tr-body-panel {
  position: fixed;
  top: calc(var(--status-instrument-inset) + var(--status-instrument-size) + var(--chrome-gap));
  right: 20px;
  bottom: 20px;
  z-index: 45;
  width: min(420px, calc(100vw - 40px));
  border-radius: 14px;
  transform: translateX(calc(100% + 28px));
  opacity: 0;
  /* visibility keeps the closed panel's focusable children out of the tab
     order; its discrete transition flips to hidden only after the slide. */
  visibility: hidden;
  pointer-events: none;
  transition: transform 0.18s ease, opacity 0.18s ease, visibility 0.18s;
  display: grid;
  grid-template-rows: auto 1fr;
  overflow: hidden;
}

.tr-body-panel.visible {
  transform: translateX(0);
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

.tr-body-panel-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 18px;
  border-bottom: 1px solid var(--border, #e5e7eb);
}

.tr-body-panel-body {
  overflow: auto;
  padding: 18px;
  display: grid;
  gap: 16px;
}

.tr-body-panel-section {
  display: grid;
  gap: 8px;
}

.tr-body-panel-section h4 {
  margin: 0;
  color: #6b7280;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.tr-body-panel-list {
  display: grid;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.tr-body-chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tr-body-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border: 1px solid #e5e7eb;
  border-radius: 999px;
  padding: 4px 8px;
  background: #f9fafb;
  font-size: 12px;
}

.tr-body-panel-more,
.tr-body-panel-more a {
  color: #6b7280;
  font-size: 12px;
}

.tr-body-panel-more a {
  text-decoration: none;
}

.tr-body-panel-more a:hover,
.tr-body-panel-more a:focus-visible {
  text-decoration: underline;
}

	.tr-md-content pre {
	  background: #f3f4f6;
	  padding: 12px;
	  border-radius: 6px;
	  overflow-x: auto;
	  margin-bottom: 12px;
	}

.tr-signals {
  display: grid;
  gap: 14px;
  padding: 16px;
  max-width: 920px;
}

.tr-signal-summary {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.tr-signal-chip {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  border: 1px solid #d1d5db;
  border-radius: 999px;
  padding: 4px 9px;
  background: #fff;
  color: #374151;
  font-size: 12px;
}

.tr-signal-chip strong {
  color: #111827;
  font-weight: 700;
}

.tr-signal-section {
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  background: #fff;
  overflow: hidden;
}

.tr-signal-section h3 {
  margin: 0;
  padding: 10px 12px;
  border-bottom: 1px solid #eef2f7;
  color: #111827;
  font-size: 14px;
  font-weight: 650;
  background: #f9fafb;
}

.tr-signal-body {
  display: grid;
  gap: 8px;
  padding: 12px;
  color: #374151;
  font-size: 13px;
  line-height: 1.5;
}

.tr-signal-row {
  display: grid;
  grid-template-columns: 96px minmax(0, 1fr);
  gap: 10px;
}

.tr-signal-label {
  color: #6b7280;
  font-size: 12px;
}

.tr-signal-value {
  min-width: 0;
  overflow-wrap: anywhere;
}

.tr-signal-list {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.tr-signal-list li {
  padding: 8px 10px;
  border: 1px solid #eef2f7;
  border-radius: 6px;
  background: #fbfdff;
}

.tr-signal-raw summary {
  cursor: pointer;
  color: #4b5563;
  font-size: 13px;
}

.tr-signal-raw pre {
  margin: 8px 0 0;
  padding: 10px;
  overflow-x: auto;
  border-radius: 6px;
  background: #f3f4f6;
  color: #1f2937;
  font-size: 12px;
  line-height: 1.45;
}

.tr-screen-text {
  padding: 8px 12px;
  color: #374151;
  font-size: 13px;
  border-left: 3px solid #e5e7eb;
  margin: 4px 0;
}

/* Delete button */
.tr-delete-btn {
  display: none;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  padding: 0;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
  background: #fff;
  color: #9ca3af;
  cursor: pointer;
  transition: all 0.15s;
  margin-left: 8px;
}

.tr-delete-btn:hover {
  background: #fef2f2;
  border-color: #fecaca;
  color: #ef4444;
}

.tr-delete-btn:focus-visible {
  outline: 2px solid #ef4444;
  outline-offset: 2px;
}

.tr-delete-btn:active {
  background: #fee2e2;
  border-color: #f87171;
  color: #dc2626;
}

.tr-delete-btn.visible {
  display: flex;
}

.tr-delete-btn svg {
  width: 16px;
  height: 16px;
}

.tr-panel {
  flex: 1;
  padding: 16px;
  overflow-x: auto;
  font-size: 14px;
  line-height: 1.5;
  transition: opacity 0.1s ease;
}

.tr-panel.loading {
  opacity: 0.5;
}

.tr-panel pre {
  white-space: pre-wrap;
  word-wrap: break-word;
  overflow-wrap: break-word;
}

.tr-panel code {
  white-space: pre-wrap;
  word-wrap: break-word;
}

/* Middle zoom timeline (segment selector) */
.tr-zoom {
  position: sticky;
  top: 16px;
  align-self: start;
  border-right: 1px solid #e5e7eb;
  user-select: none;
  height: calc(100vh - 32px);
  overflow: hidden;
  padding: 12px 0;
  box-sizing: border-box;
}



.tr-zoom-timeline-label {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: #9ca3af;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 700;
  pointer-events: none;
  z-index: 3;
  border-bottom: 1px solid #e5e7eb;
}

.tr-zoom-labels {
  position: absolute;
  left: 0;
  top: 16px;
  bottom: 12px;
  width: 48px;
  background: #f9fafb;
  border-right: 1px solid #e5e7eb;
  pointer-events: none;
}

.tr-zoom-label {
  position: absolute;
  right: 0;
  padding-right: 8px;
  transform: translateY(-50%);
  font-size: 12px;
  color: #6b7280;
  font-variant-numeric: tabular-nums;
}

.tr-zoom-grid {
  position: absolute;
  top: 16px;
  bottom: 12px;
  left: 0;
  right: 0;
}

.tr-zoom-segments {
  position: absolute;
  left: 52px;
  right: 4px;
  top: 16px;
  bottom: 12px;
}

.tr-zoom-empty {
  position: absolute;
  inset: 0;
  padding: 0 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: #9ca3af;
  font-size: 12px;
  line-height: 1.35;
  pointer-events: none;
}

/* Segment pills in zoom view */
.tr-zoom-pill {
  position: absolute;
  left: 0;
  right: 0;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.15s ease;
  box-shadow: 0 1px 2px rgba(0,0,0,.08);
}

.tr-zoom-pill:hover {
  filter: brightness(0.95);
  box-shadow: 0 2px 4px rgba(0,0,0,.12);
}

.tr-zoom-pill.tr-active {
  box-shadow: 0 0 0 2px rgba(74, 158, 255, 0.5), 0 2px 4px rgba(0,0,0,.12);
}

.tr-zoom-pill:focus-visible {
  outline: 2px solid var(--accent, #4a9eff);
  outline-offset: 1px;
}

.tr-zoom-pill:active {
  filter: brightness(0.90);
  transform: scale(0.98);
}

.tr-zoom-pill-audio {
  background: linear-gradient(135deg, rgba(134, 239, 172, 0.8), rgba(134, 239, 172, 0.6));
  border: 1px solid #4ade80;
}

.tr-zoom-pill-screen {
  background: linear-gradient(135deg, rgba(253, 230, 138, 0.8), rgba(253, 230, 138, 0.6));
  border: 1px solid #eab308;
}

.tr-zoom-pill-markdown {
  background: linear-gradient(135deg, rgba(147, 197, 253, 0.8), rgba(147, 197, 253, 0.6));
  border: 1px solid #3b82f6;
}

.tr-zoom-pill-browser {
  background: linear-gradient(135deg, rgba(96, 165, 250, 0.78), rgba(191, 219, 254, 0.68));
  border: 1px solid #2563eb;
}

.tr-zoom-pill-both {
  background: linear-gradient(to right, rgba(134, 239, 172, 0.75), rgba(194, 234, 155, 0.7) 50%, rgba(253, 230, 138, 0.75));
  border: 1px solid #84cc16;
}

.tr-zoom-pill-pending {
  border-style: dashed;
}

.tr-zoom-pill-audio.tr-zoom-pill-pending {
  background:
    repeating-linear-gradient(
      135deg,
      rgba(74, 222, 128, 0.38) 0,
      rgba(74, 222, 128, 0.38) 4px,
      rgba(134, 239, 172, 0.18) 4px,
      rgba(134, 239, 172, 0.18) 10px
    );
  border-color: #22c55e;
}

.tr-zoom-pill-screen.tr-zoom-pill-pending {
  background:
    repeating-linear-gradient(
      135deg,
      rgba(234, 179, 8, 0.38) 0,
      rgba(234, 179, 8, 0.38) 4px,
      rgba(253, 230, 138, 0.2) 4px,
      rgba(253, 230, 138, 0.2) 10px
    );
  border-color: #ca8a04;
}

.tr-zoom-pill-both.tr-zoom-pill-pending {
  background:
    repeating-linear-gradient(
      135deg,
      rgba(132, 204, 22, 0.38) 0,
      rgba(132, 204, 22, 0.38) 4px,
      rgba(194, 234, 155, 0.2) 4px,
      rgba(194, 234, 155, 0.2) 10px
    );
  border-color: #65a30d;
}

.tr-zoom-pill-awaiting {
  border-style: solid;
}

.tr-zoom-pill-audio.tr-zoom-pill-awaiting {
  background: rgba(245, 158, 11, 0.62);
  border-color: #b45309;
}

.tr-zoom-pill-screen.tr-zoom-pill-awaiting {
  background: rgba(251, 191, 36, 0.62);
  border-color: #b45309;
}

.tr-zoom-pill-both.tr-zoom-pill-awaiting {
  background: linear-gradient(to right, rgba(245, 158, 11, 0.64), rgba(251, 191, 36, 0.64));
  border-color: #b45309;
}

.tr-zoom-pill-analyzing {
  border-style: solid;
  animation: tr-analyzing-pulse 1.5s ease-in-out infinite;
}

.tr-zoom-pill-audio.tr-zoom-pill-analyzing {
  background: rgba(45, 212, 191, 0.6);
  border-color: #0d9488;
}

.tr-zoom-pill-screen.tr-zoom-pill-analyzing {
  background: rgba(96, 165, 250, 0.6);
  border-color: #2563eb;
}

.tr-zoom-pill-both.tr-zoom-pill-analyzing {
  background: linear-gradient(to right, rgba(45, 212, 191, 0.62), rgba(96, 165, 250, 0.62));
  border-color: #0891b2;
}

/* Dragging state */
.tr-dragging {
  user-select: none;
  -webkit-user-select: none;
}

/* Image modal */
.tr-screenshot-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: flex;
  z-index: 1000;
}

.tr-modal-nav {
  width: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: rgba(255,255,255,0.4);
  transition: all 0.15s;
  flex-shrink: 0;
}

.tr-modal-nav:hover {
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.9);
}

.tr-modal-nav:active {
  background: rgba(255,255,255,0.2);
  color: rgba(255,255,255,1);
}

.tr-modal-nav:focus-visible {
  outline: 2px solid rgba(255,255,255,0.6);
  outline-offset: -2px;
}

.tr-modal-nav.disabled {
  cursor: default;
  color: rgba(255,255,255,0.15);
  pointer-events: none;
}

.tr-modal-nav svg {
  width: 24px;
  height: 24px;
}

.tr-modal-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.tr-modal-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  flex-shrink: 0;
}

.tr-modal-badge {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  background: rgba(255,255,255,0.15);
  color: #fff;
}

.tr-modal-badge-monitor {
  background: rgba(124, 58, 237, 0.3);
  color: #c4b5fd;
}

.tr-modal-badge-category {
  background: rgba(59, 130, 246, 0.3);
  color: #93c5fd;
}

.tr-modal-close {
  margin-left: auto;
  width: 36px;
  height: 36px;
  background: rgba(255,255,255,0.15);
  border: none;
  border-radius: 50%;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  transition: background 0.15s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.tr-modal-close:hover {
  background: rgba(255,255,255,0.3);
}

.tr-modal-close:active {
  background: rgba(255,255,255,0.4);
}

.tr-modal-close:focus-visible {
  outline: 2px solid rgba(255,255,255,0.6);
  outline-offset: 2px;
}

.tr-modal-img-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
  padding: 0 20px;
}

.tr-modal-img-wrap img,
.tr-modal-img-wrap canvas {
  display: block;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 8px;
  background: #1f2937;
}

.tr-modal-img-wrap canvas.loading {
  animation: tr-pulse 1.5s ease-in-out infinite;
}

.tr-modal-description {
  padding: 12px 20px 20px;
  color: rgba(255,255,255,0.8);
  font-size: 14px;
  line-height: 1.5;
  text-align: center;
  flex-shrink: 0;
}

#trDeleteSegmentModal {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: rgba(15, 23, 42, 0.55);
  z-index: 1100;
}

#trDeleteSegmentModal .modal-content {
  width: min(520px, 100%);
  background: #ffffff;
  border-radius: 16px;
  box-shadow: 0 24px 48px rgba(15, 23, 42, 0.22);
  overflow: hidden;
}

#trDeleteSegmentModal .modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px 16px;
  border-bottom: 1px solid #e5e7eb;
}

#trDeleteSegmentModal .modal-header h3 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  color: #111827;
}

#trDeleteSegmentModal .modal-header.danger h3 {
  color: #991b1b;
}

#trDeleteSegmentModal .modal-body {
  padding: 20px 24px;
}

#trDeleteSegmentModal .modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  padding: 0 24px 24px;
}

#trDeleteSegmentModal .close {
  color: #9ca3af;
  font-size: 28px;
  line-height: 1;
  cursor: pointer;
  transition: color 0.15s ease;
}

#trDeleteSegmentModal .close:hover {
  color: #4b5563;
}

#trDeleteSegmentModal .close:active {
  color: #111827;
}

#trDeleteSegmentModal .btn-secondary,
#trDeleteSegmentModal .btn-danger {
  border: none;
  border-radius: 10px;
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
}

#trDeleteSegmentModal .btn-secondary {
  background: #f3f4f6;
  color: #374151;
}

#trDeleteSegmentModal .btn-secondary:hover {
  background: #e5e7eb;
}

#trDeleteSegmentModal .btn-secondary:active {
  transform: translateY(1px);
}

#trDeleteSegmentModal .btn-danger {
  background: #dc2626;
  color: #ffffff;
}

#trDeleteSegmentModal .btn-danger:hover {
  background: #b91c1c;
}

#trDeleteSegmentModal .btn-danger:active {
  transform: translateY(1px);
}

#trDeleteSegmentModal .delete-warning {
  padding: 16px 18px;
  border-radius: 12px;
  background: #fef2f2;
  border-left: 4px solid #dc2626;
  color: #7f1d1d;
}

#trDeleteSegmentModal .delete-warning p {
  margin: 0 0 12px;
}

#trDeleteSegmentModal .delete-warning p:last-child {
  margin-bottom: 0;
}

#trDeleteSegmentModal .tr-delete-segment-meta {
  font-size: 14px;
  color: #991b1b;
}

#trDeleteSegmentModal .tr-delete-segment-list {
  margin: 0 0 12px;
  padding-left: 20px;
}

#trDeleteSegmentModal .tr-delete-segment-list li + li {
  margin-top: 6px;
}

#trDeleteSegmentModal .tr-delete-segment-size {
  font-size: 13px;
  color: #7f1d1d;
}

/* Unified timeline view */
.tr-unified {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.tr-audio-players {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  padding: 16px;
  background: #f9fafb;
  border-radius: 12px;
  border: 1px solid #e5e7eb;
}

.tr-audio-player {
  flex: 1;
  min-width: 200px;
}

.tr-audio-player audio {
  width: 100%;
}

.tr-audio-player-label {
  font-size: 12px;
  color: #6b7280;
  margin-bottom: 4px;
}

.tr-purge-notice {
  padding: 0.5em 0.75em;
  margin-bottom: 0.5em;
  font-size: 0.8em;
  color: #888;
  background: #f8f8f8;
  border-radius: 4px;
  border-left: 3px solid #ccc;
}

.tr-entry {
  display: flex;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s;
}

.tr-entry:hover {
  background: #f9fafb;
}

.tr-entry-audio {
  border-left: 3px solid #86efac;
}

.tr-entry-audio:focus-visible {
  outline: 2px solid var(--accent, #4a9eff);
  outline-offset: -1px;
}

.tr-entry-audio:active {
  background: #f0f9ff;
}

.tr-entry.tr-entry-active {
  background: #f0f9ff;
  border-left-color: #3b82f6;
}

.tr-entry-screen {
  border-left: 3px solid #facc15;
}

.tr-entry-browser {
  border-left: 3px solid #60a5fa;
  cursor: default;
}

.tr-entry-time {
  flex-shrink: 0;
  width: 48px;
  font-size: 12px;
  color: #6b7280;
  font-family: ui-monospace, monospace;
}

.tr-entry-content {
  flex: 1;
  min-width: 0;
}

.tr-entry-text {
  font-size: 14px;
  line-height: 1.5;
}

.tr-entry-meta {
  font-size: 11px;
  color: #9ca3af;
  margin-top: 2px;
}

.tr-entry-browser .tr-entry-content {
  display: grid;
  gap: 6px;
}

.tr-browser-site {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: baseline;
  color: #1d4ed8;
  font-size: 12px;
  font-weight: 600;
}

.tr-browser-title {
  color: #6b7280;
  font-weight: 400;
}

.tr-entry-thumb {
  flex-shrink: 0;
  width: 120px;
  height: 68px;
  border-radius: 6px;
  object-fit: cover;
  border: 1px solid #e5e7eb;
  background: #f3f4f6;
  cursor: pointer;
  transition: box-shadow 0.15s ease, border-color 0.15s ease;
}

.tr-entry-thumb:hover {
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
  border-color: #d1d5db;
}

.tr-entry-thumb.loading {
  animation: tr-pulse 1.5s ease-in-out infinite;
}

@keyframes tr-pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

.tr-entry-screen .tr-entry-content {
  display: flex;
  gap: 12px;
  align-items: center;
}

.tr-entry-desc {
  flex: 1;
  font-size: 13px;
  color: #374151;
  line-height: 1.5;
}

.tr-entry-badge {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 500;
  background: #dbeafe;
  color: #1d4ed8;
  margin-right: 6px;
}

.tr-entry-badge-monitor {
  background: #f3e8ff;
  color: #7c3aed;
}

.tr-speaker-label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 500;
  color: #374151;
  margin-bottom: 2px;
}

.tr-speaker-label a {
  color: #374151;
  text-decoration: none;
}

.tr-speaker-label a:hover {
  color: #374151;
  text-decoration: underline;
}

.tr-speaker-label a:focus-visible {
  outline: 2px solid var(--accent, #4a9eff);
  outline-offset: 2px;
  border-radius: 2px;
}

.tr-speaker-label a:active {
  color: #1f2937;
}

.tr-speaker-label-owner {
  color: var(--orange-ink);
}

.tr-speaker-label-owner a {
  color: var(--orange-ink);
}

.tr-speaker-label-owner a:active {
  color: var(--ink);
}

.tr-speaker-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.tr-speaker-dot-high {
  background: #22c55e;
}

.tr-speaker-dot-medium {
  background: #eab308;
}

.tr-speaker-slot {
  margin-bottom: 4px;
}

.tr-speaker-chip,
.tr-speaker-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
}

.tr-speaker-chip {
  color: #374151;
}

.tr-speaker-chip-neutral {
  color: #6b7280;
}

.tr-speaker-button {
  min-height: var(--touch-min);
  min-width: var(--touch-min);
  padding: 4px 8px;
  border: 1px solid #d1d5db;
  background: #ffffff;
  color: #374151;
  cursor: pointer;
}

.tr-speaker-button:hover {
  border-color: #9ca3af;
  background: #f9fafb;
}

.tr-speaker-button:focus-visible,
.tr-speaker-picker-option:focus-visible,
.tr-speaker-picker-close:focus-visible,
.tr-speaker-propagation-action:focus-visible,
.tr-speaker-propagation-dismiss:focus-visible,
.tr-speaker-status-retry:focus-visible {
  outline: 2px solid var(--accent, #4a9eff);
  outline-offset: 2px;
}

.tr-speaker-button[aria-busy="true"] {
  opacity: 0.7;
  cursor: progress;
}

.tr-speaker-disabled {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: #6b7280;
  font-size: 12px;
}

.tr-speaker-popover {
  position: fixed;
  z-index: 2000;
  width: min(320px, calc(100vw - 24px));
  max-height: min(420px, calc(100vh - 24px));
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  background: #ffffff;
  box-shadow: 0 18px 45px rgba(15, 23, 42, 0.18);
}

.tr-speaker-picker-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.tr-speaker-picker-title {
  font-size: 13px;
  font-weight: 600;
  color: #111827;
}

.tr-speaker-picker-close,
.tr-speaker-propagation-dismiss {
  min-height: var(--touch-min);
  min-width: var(--touch-min);
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: #6b7280;
  cursor: pointer;
}

.tr-speaker-picker-search {
  min-height: var(--touch-min);
  min-width: var(--touch-min);
  width: 100%;
  padding: 8px 10px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  font-size: 14px;
}

.tr-speaker-picker-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow: auto;
}

.tr-speaker-picker-option {
  min-height: var(--touch-min);
  min-width: var(--touch-min);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: #111827;
  text-align: left;
  cursor: pointer;
}

.tr-speaker-picker-option:hover {
  background: #f3f4f6;
}

.tr-speaker-picker-tail,
.tr-speaker-status {
  font-size: 12px;
  color: #6b7280;
}

.tr-speaker-status {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 4px;
}

.tr-speaker-status-error {
  color: #991b1b;
}

.tr-speaker-status-retry,
.tr-speaker-propagation-action {
  min-height: var(--touch-min);
  min-width: var(--touch-min);
  padding: 6px 10px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  background: #ffffff;
  color: #374151;
  cursor: pointer;
}

.tr-speaker-propagation {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 8px;
  padding: 8px 10px;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
  background: #f9fafb;
  color: #374151;
  font-size: 12px;
}

.tr-speaker-propagation-actions {
  display: flex;
  align-items: center;
  gap: 4px;
}

.tr-panel > .surface-state {
  min-height: 100%;
}

.tr-warning-notice {
  display: none;
  flex-direction: column;

<script>
(() => {
  const escapeHtml = (value) => window.AppServices.escapeHtml(value);
  // Timeline bounds - computed dynamically from content

  // every day navigation, so watch it rather than fixing it once at mount.
  const dayHeading = document.querySelector('[data-date-nav-heading]');
  if (dayHeading) {
    const LOWERCASE_DAY_LABELS = new Set(['Today', 'Yesterday']);
    const lowercaseDayHeading = () => {
      const text = dayHeading.textContent;
      if (LOWERCASE_DAY_LABELS.has(text)) dayHeading.textContent = text.toLowerCase();
    };
    lowercaseDayHeading();
    new MutationObserver(lowercaseDayHeading).observe(dayHeading, { childList: true, characterData: true, subtree: true });
  }

  // Elements - main timeline
  const timeline = document.getElementById('trTimeline');
  const grid = document.getElementById('trGrid');
  const labels = document.getElementById('trLabels');
  const segmentsLane = document.getElementById('trSegments');
  const bodyEventsLane = document.getElementById('trBodyEvents');
  const selWrap = document.getElementById('trSelWrap');
  const sel = selWrap.querySelector('.tr-sel');

  // Elements - zoom timeline
  const zoom = document.getElementById('trZoom');
  const zoomGrid = document.getElementById('trZoomGrid');
  const zoomLabels = document.getElementById('trZoomLabels');
  const zoomSegments = document.getElementById('trZoomSegments');

  // Elements - content panel
  const titleEl = document.querySelector('.tr-title');
  const rangeText = document.getElementById('trRangeText');
  const tabsContainer = document.getElementById('trTabs');
  tabsContainer.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const tabs = [...tabsContainer.querySelectorAll('.tr-tab')];
    const idx = tabs.indexOf(e.target);
    if (idx < 0) return;
    const next = e.key === 'ArrowRight'
      ? tabs[(idx + 1) % tabs.length]
      : tabs[(idx - 1 + tabs.length) % tabs.length];
    activateTab(next.dataset.tab);
    next.focus();
  });
	  const panel = document.getElementById('trPanel');
	  const warningNotice = document.getElementById('trWarningNotice');
	  const warningText = document.getElementById('trWarningText');
	  const warningDetails = document.getElementById('trWarningDetails');
	  const warningCaret = document.getElementById('trWarningCaret');
	  const deleteBtn = document.getElementById('trDeleteBtn');
  const bodyPanel = document.getElementById('trBodyPanel');
  const bodyPanelTitle = document.getElementById('trBodyPanelTitle');
  const bodyPanelRange = document.getElementById('trBodyPanelRange');
  const bodyPanelBody = document.getElementById('trBodyPanelBody');
  const bodyPanelClose = document.getElementById('trBodyPanelClose');
  const deleteSegmentModal = document.getElementById('trDeleteSegmentModal');
  const deleteSegmentModalBody = document.getElementById('trDeleteSegmentModalBody');
  const deleteSegmentModalConfirm = document.getElementById('trDeleteSegmentModalConfirm');
  const initialEmptyIcon = document.getElementById('trInitialEmptyIcon');
  if (initialEmptyIcon) {
    initialEmptyIcon.innerHTML = window.ConveyIcons.svg('clock');
  }

  function emptyIconForModality(modality) {
    switch (modality) {
      case 'audio':
        return window.ConveyIcons.svg('volume-2');
      case 'screen':
        return window.ConveyIcons.svg('monitor');
      case 'signals':
        return window.ConveyIcons.svg('activity');
      case 'transcript':
      default:
        return window.ConveyIcons.svg('file-text');
    }
  }

  const BTN_LABEL_PENDING = 'analyze now';
  const BTN_LABEL_FAILED = 'try again';
  const ANALYZING_LABEL = 'analyzing…';
  const AWAITING_THINKING_LABEL = 'awaiting thinking';
  const BTN_TITLE = modality => `Process this segment's raw ${modality} observed data and generate analyzed content.`;
  const ANALYZE_POLL_INTERVAL_MS = 3000;
  const ANALYZE_POLL_MAX_MS = 30 * 60 * 1000;

  const DATA_STATE_SUFFIX = {
    pending: 'analysis pending',
    analyzing: '',
    failed: 'analysis failed'
  };

  function dataStateCopy(modality, state) {
    if (state === 'analyzing') {
      return `${modality} observed · ${ANALYZING_LABEL}`;
    }
    const suffix = DATA_STATE_SUFFIX[state];
    return suffix ? `${modality} observed · ${suffix}` : '';
  }

	  function warningTimestampLabel(ts) {
	    const parsed = new Date(ts);
	    if (Number.isNaN(parsed.getTime())) return 'time unknown';
	    return relativeTime(Date.now() - parsed.getTime()) + ' ago';
	  }

	  function renderWarningNotice(data) {
	    const count = data.warnings || 0;
	    const details = Array.isArray(data.warning_details) ? data.warning_details : [];
	    warningDetails.innerHTML = '';
	    warningNotice.setAttribute('aria-expanded', 'false');
	    warningDetails.hidden = true;
	    warningCaret.textContent = '▾';
	    if (count <= 0) {
	      warningNotice.classList.remove('visible');
	      return;
	    }
	    warningText.textContent = count + ' warning' + (count === 1 ? '' : 's') + ' during processing';
	    if (details.length === 0) {
	      const item = document.createElement('li');
	      item.textContent = 'warning details unavailable';
	      warningDetails.appendChild(item);
	    } else {
	      for (const detail of details) {
	        const item = document.createElement('li');
	        const type = detail.type || 'warning';
	        const file = detail.file || 'unknown file';
	        item.textContent = `${type} — ${file} (${warningTimestampLabel(detail.ts)})`;
	        warningDetails.appendChild(item);
	      }
	    }
	    warningNotice.classList.add('visible');
	  }

	  function toggleWarningDetails() {
	    const expanded = warningNotice.getAttribute('aria-expanded') === 'true';
	    warningNotice.setAttribute('aria-expanded', String(!expanded));
	    warningDetails.hidden = expanded;
	    warningCaret.textContent = expanded ? '▾' : '▴';
	  }

	  const warningSummary = warningNotice.querySelector('.tr-warning-summary');
	  warningSummary.addEventListener('click', toggleWarningDetails);
	  warningSummary.addEventListener('keydown', (event) => {
	    if (event.key !== 'Enter' && event.key !== ' ') return;
	    event.preventDefault();
	    toggleWarningDetails();
	  });

  // State
  let height = timeline.clientHeight;
  let ppm = height / (timelineEnd - timelineStart);
  let range = { start: 9 * 60, end: 10 * 60 };
  let drag = null;
  let allSegments = [];
  let dayBodyWindow = null;
  let selectedSegment = null;
  let updateNowPosition = null;
  let deleteModalReturnFocus = null;
  let deleteModalPrevOverflow = '';

  // Zoom state
  let zoomHeight = zoom.clientHeight;
  let zoomPpm = 0;

  // Modal state - all screen frames for navigation
  let allScreenFrames = [];
  let currentFrameIndex = -1;

  // ========================================
  // FrameCapture - Client-side thumbnail + on-demand full frame decoder
  // ========================================
  class FrameCapture {
    constructor() {
      // Map of video URL -> { video, ready, width, height, thumbs }
      this.videos = new Map();
      // Pending thumbnail promises per frame
      this.pendingThumbs = new Map();
      this.warnedUrls = new Set();
    }

    // Load video and wait for metadata
    loadVideo(url) {
      if (this.videos.has(url)) {
        const entry = this.videos.get(url);
        if (entry.ready) return Promise.resolve(entry);
        return entry.promise;
      }

      const video = document.createElement('video');
      video.preload = 'metadata';
      video.muted = true;
      video.playsInline = true;
      video.crossOrigin = 'anonymous';

      const promise = new Promise((resolve, reject) => {
        video.onloadedmetadata = () => {
          const entry = this.videos.get(url);
          entry.ready = true;
          entry.width = video.videoWidth;
          entry.height = video.videoHeight;
          resolve(entry);
        };
        video.onerror = () => {
          const mediaError = video.error;
          if (mediaError?.code === MediaError.MEDIA_ERR_SRC_NOT_SUPPORTED) {
            const entry = this.videos.get(url);
            entry.unsupported = true;
            entry.errorCode = mediaError.code;
            entry.ready = true;
            if (!this.warnedUrls.has(url)) {
              this.warnedUrls.add(url);
              console.warn(`Video format not supported by this browser: ${url}`);
            }
            resolve(entry);
            return;
          }
          reject(new Error(`Failed to load video: ${url}`));
        };
        video.src = url;
      });

      this.videos.set(url, {
        video,
        ready: false,
        unsupported: false,
        errorCode: null,
        width: 0,
        height: 0,
        promise,
        thumbs: new Map(),
        queue: Promise.resolve()
      });
      return promise;
    }

    async _withVideoQueue(videoUrl, task) {
      const entry = await this.loadVideo(videoUrl);
      const run = entry.queue.then(task, task);
      entry.queue = run.catch(() => {});
      return run;
    }

    async _seekTo(video, timestamp) {
      return new Promise((resolve, reject) => {
        const onSeeked = () => {
          video.removeEventListener('seeked', onSeeked);
          video.removeEventListener('error', onError);
          resolve();
        };
        const onError = () => {
          video.removeEventListener('seeked', onSeeked);
          video.removeEventListener('error', onError);
          reject(new Error('Video seek failed'));
        };
        video.addEventListener('seeked', onSeeked);
        video.addEventListener('error', onError);
        video.currentTime = timestamp;
      });
    }

    async captureThumbnail(videoUrl, frameId, width, height) {
      const entry = await this.loadVideo(videoUrl);
      if (entry.unsupported) return null;
      const cacheKey = `${videoUrl}|${frameId}`;

      if (entry.thumbs.has(frameId)) {
        return entry.thumbs.get(frameId);
      }

      if (this.pendingThumbs.has(cacheKey)) {
        return this.pendingThumbs.get(cacheKey);
      }

      const pending = this._withVideoQueue(videoUrl, async () => {
        const video = entry.video;
        const timestamp = Math.max(0, frameId - 1);
        await this._seekTo(video, timestamp);

        let bitmap;
        if (width && height) {
          bitmap = await createImageBitmap(video, {
            resizeWidth: width,
            resizeHeight: height,
            resizeQuality: 'high'
          });
        } else {
          bitmap = await createImageBitmap(video);
        }

        const canvas = document.createElement('canvas');
        canvas.width = width || bitmap.width;
        canvas.height = height || bitmap.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        if (bitmap && typeof bitmap.close === 'function') {
          bitmap.close();
        }
        entry.thumbs.set(frameId, canvas);
        return canvas;
      });

      this.pendingThumbs.set(cacheKey, pending);
      try {
        return await pending;
      } finally {
        this.pendingThumbs.delete(cacheKey);
      }
    }

    async captureFullFrame(videoUrl, frameId) {
      const entry = await this.loadVideo(videoUrl);
      if (entry.unsupported) return null;
      return this._withVideoQueue(videoUrl, async () => {
        const video = entry.video;
        const timestamp = Math.max(0, frameId - 1);
        await this._seekTo(video, timestamp);
        return createImageBitmap(video);
      });
    }

    async prefetchThumbnails(videoUrl, frameIds, onProgress = null, signal = null) {
      if (!frameIds || frameIds.length === 0) return null;

      const sorted = [...new Set(frameIds)].sort((a, b) => a - b);
      for (let i = 0; i < sorted.length; i += 1) {
        if (signal?.aborted) return this.videos.get(videoUrl);
        const frameId = sorted[i];
        await this.captureThumbnail(videoUrl, frameId, 120, 68);
        if (onProgress) onProgress(i + 1, sorted.length);
      }

      return this.videos.get(videoUrl);
    }

    // Clear all loaded videos and cached thumbnails
    clear() {
      for (const entry of this.videos.values()) {
        entry.thumbs.clear();
        entry.video.src = '';
        entry.video.load();
      }
      this.videos.clear();
      this.pendingThumbs.clear();
      this.warnedUrls.clear();
    }

    _drawUnsupportedPlaceholder(canvas, width, height, errorCode = null) {
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#f3f4f6';
      ctx.fillRect(0, 0, width, height);

      const minDim = Math.min(width, height);
      const iconWidth = minDim * 0.42;
      const iconHeight = iconWidth * 0.68;
      const radius = Math.max(4, iconWidth * 0.08);
      const strokeWidth = Math.max(2, minDim * 0.03);
      const standHeight = Math.max(6, iconHeight * 0.22);
      const textSize = Math.max(10, Math.min(height > 120 ? 24 : 14, width / (height > 120 ? 9 : 12)));
      const gap = Math.max(10, height * 0.06);
      const totalHeight = iconHeight + standHeight + gap + textSize;
      const iconX = (width - iconWidth) / 2;
      const iconY = Math.max(height * 0.14, (height - totalHeight) / 2);

      ctx.strokeStyle = '#9ca3af';
      ctx.lineWidth = strokeWidth;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      ctx.beginPath();
      ctx.moveTo(iconX + radius, iconY);
      ctx.lineTo(iconX + iconWidth - radius, iconY);
      ctx.quadraticCurveTo(iconX + iconWidth, iconY, iconX + iconWidth, iconY + radius);
      ctx.lineTo(iconX + iconWidth, iconY + iconHeight - radius);
      ctx.quadraticCurveTo(iconX + iconWidth, iconY + iconHeight, iconX + iconWidth - radius, iconY + iconHeight);
      ctx.lineTo(iconX + radius, iconY + iconHeight);
      ctx.quadraticCurveTo(iconX, iconY + iconHeight, iconX, iconY + iconHeight - radius);
      ctx.lineTo(iconX, iconY + radius);
      ctx.quadraticCurveTo(iconX, iconY, iconX + radius, iconY);
      ctx.stroke();

      const standY = iconY + iconHeight + standHeight * 0.45;
      const standWidth = iconWidth * 0.28;
      ctx.beginPath();
      ctx.moveTo(width / 2, iconY + iconHeight);
      ctx.lineTo(width / 2, standY);
      ctx.moveTo(width / 2 - standWidth / 2, standY);
      ctx.lineTo(width / 2 + standWidth / 2, standY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(iconX + iconWidth * 0.18, iconY + iconHeight * 0.2);
      ctx.lineTo(iconX + iconWidth * 0.82, iconY + iconHeight * 0.84);
      ctx.stroke();

      ctx.fillStyle = '#6b7280';
      ctx.font = `${textSize}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText('Format not supported', width / 2, standY + gap * 0.55);
      if (errorCode !== null) {
        ctx.fillStyle = '#6b7280';
        ctx.font = '10px ui-monospace, SFMono-Regular, Menlo, monospace';
        ctx.fillText(
          `code ${errorCode}`,
          width / 2,
          standY + gap * 0.55 + textSize + 2
        );
      }

      canvas.classList.remove('loading');
    }

    // Draw thumbnail to canvas (no overlays - those are only for full frame view)
    async drawThumbnail(canvas, videoUrl, frameId, options = {}) {
      const { width, height } = options;

      try {
        const thumb = await this.captureThumbnail(videoUrl, frameId, width, height);
        if (!thumb) {
          this._drawUnsupportedPlaceholder(
            canvas,
            width || 120,
            height || 68,
            this.videos.get(videoUrl)?.errorCode ?? null
          );
          return false;
        }

        canvas.width = width || thumb.width;
        canvas.height = height || thumb.height;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(thumb, 0, 0, canvas.width, canvas.height);

        canvas.classList.remove('loading');
        return true;
      } catch (err) {
        canvas.classList.remove('loading');
        console.warn('Thumbnail draw failed:', err);
        return false;
      }
    }

    // Draw full-resolution frame to canvas (no caching)
    async drawFull(canvas, videoUrl, frameId, options = {}) {
      const { boxCoords, participants } = options;

      try {
        const bitmap = await this.captureFullFrame(videoUrl, frameId);
        if (!bitmap) {
          this._drawUnsupportedPlaceholder(
            canvas,
            640,
            360,
            this.videos.get(videoUrl)?.errorCode ?? null
          );
          return false;
        }

        canvas.width = bitmap.width;
        canvas.height = bitmap.height;

        const ctx = canvas.getContext('2d');
        ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);

        this._applyOverlays(ctx, canvas, bitmap.width, bitmap.height, { boxCoords, participants });

        if (bitmap && typeof bitmap.close === 'function') {
          bitmap.close();
        }
        canvas.classList.remove('loading');
        return true;
      } catch (err) {
        canvas.classList.remove('loading');
        console.warn('Full frame draw failed:', err);
        return false;
      }
    }

    _applyOverlays(ctx, canvas, sourceWidth, sourceHeight, options = {}) {
      const { boxCoords, participants } = options;
      const scaleX = canvas.width / sourceWidth;
      const scaleY = canvas.height / sourceHeight;

      if (boxCoords && boxCoords.length === 4) {
        const [xMin, yMin, xMax, yMax] = boxCoords;
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 3;
        ctx.strokeRect(
          xMin * scaleX,
          yMin * scaleY,
          (xMax - xMin) * scaleX,
          (yMax - yMin) * scaleY
        );
      }

      if (participants && participants.length > 0) {
        for (const p of participants) {
          const x = (p.left / 100) * canvas.width;
          const y = (p.top / 100) * canvas.height;
          const w = (p.width / 100) * canvas.width;
          const h = (p.height / 100) * canvas.height;

          const colors = {
            speaking: '#fbbf24',
            active: '#4ade80',
            muted: '#f87171',
            presenting: '#60a5fa',
            unknown: '#9ca3af'
          };
          ctx.strokeStyle = colors[p.status] || colors.unknown;
          ctx.lineWidth = 2;
          ctx.setLineDash([5, 5]);
          ctx.strokeRect(x, y, w, h);
          ctx.setLineDash([]);

          const labelY = y + h + 16;
          ctx.font = '11px system-ui, sans-serif';
          const textWidth = ctx.measureText(p.name).width;
          ctx.fillStyle = colors[p.status] || colors.unknown;
          ctx.fillRect(x, y + h + 2, textWidth + 8, 16);

          ctx.fillStyle = '#000';
          ctx.fillText(p.name, x + 4, labelY - 3);
        }
      }
    }
  }

  // Global frame capture instance
  let frameCapture = new FrameCapture();

  // Utilities
  const y = (m) => (m - timelineStart) * ppm;
  const mFromY = (py) => Math.max(timelineStart, Math.min(timelineEnd, Math.round(py / ppm) + timelineStart));
  const snap = (m) => Math.round(m / STEP) * STEP;
  const hhmm = (m) => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');

  // Zoom utilities - map minutes to pixels within the zoomed range
  const zoomY = (m) => (m - range.start) * zoomPpm;

  function parseTime(timeStr) {
    const [hh, mm] = timeStr.split(':').map(Number);
    return hh * 60 + mm;
  }

  function dayParts() {
    return {
      year: Number(day.slice(0, 4)),
      month: Number(day.slice(4, 6)) - 1,
      date: Number(day.slice(6, 8))
    };
  }

  function localIsoString(dateValue) {
    const pad = value => String(value).padStart(2, '0');
    const offsetMinutes = -dateValue.getTimezoneOffset();
    const sign = offsetMinutes >= 0 ? '+' : '-';
    const absOffset = Math.abs(offsetMinutes);
    return dateValue.getFullYear()
      + '-' + pad(dateValue.getMonth() + 1)
      + '-' + pad(dateValue.getDate())
      + 'T' + pad(dateValue.getHours())
      + ':' + pad(dateValue.getMinutes())
      + ':' + pad(dateValue.getSeconds())
      + sign + pad(Math.floor(absOffset / 60))
      + ':' + pad(absOffset % 60);
  }

  function isoForDayMinute(minute) {
    const parts = dayParts();
    return localIsoString(new Date(parts.year, parts.month, parts.date, 0, minute, 0, 0));
  }

  function minuteForIso(value) {
    const parts = dayParts();
    const dayStart = new Date(parts.year, parts.month, parts.date, 0, 0, 0, 0);
    const moment = new Date(value);
    return Math.round((moment.getTime() - dayStart.getTime()) / 60000);
  }

  function bodyWindowUrl(fromIso, toIso) {
    const params = new URLSearchParams({ from: fromIso, to: toIso });
    return `/app/body/api/window?${params.toString()}`;
  }

  async function fetchBodyWindow(fromIso, toIso, signal = null) {
    const response = await fetch(bodyWindowUrl(fromIso, toIso), { signal });
    if (!response.ok) {
      throw new Error('body window failed: ' + response.status);
    }
    return response.json();
  }

  function fetchDayBodyWindow(signal = null) {
    return fetchBodyWindow(isoForDayMinute(0), isoForDayMinute(24 * 60), signal);
  }

  function fetchSegmentBodyWindow(seg, signal = null) {
    return fetchBodyWindow(
      isoForDayMinute(parseTime(seg.start)),
      isoForDayMinute(parseTime(seg.end)),
      signal
    );
  }

  function isBodySummarySegment(seg = selectedSegment) {
    return seg?.stream === 'import.apple_health';
  }

  function bodyWindowParts(payload, limit = 4) {
    if (!payload || !payload.has_data) return [];
    const parts = [];
    if (payload.heart_rate?.count && payload.heart_rate?.label) {
      parts.push('HR ' + payload.heart_rate.label);
    }
    if (payload.glucose?.count && (payload.glucose?.range_label || payload.glucose?.delta_label)) {
      parts.push('glucose ' + (payload.glucose.range_label || payload.glucose.delta_label));
    }
    if (payload.steps?.label) {
      parts.push(payload.steps.label);
    }
    if ((payload.workouts || []).length > 0) {
      const count = payload.workouts.length;
      parts.push(count + ' workout' + (count === 1 ? '' : 's'));
    }
    return parts.slice(0, limit);
  }

  function bodyHourSummary(hour) {
    const summary = (hour?.summary || []).filter(Boolean);
    if (summary.length) return summary.slice(0, 3).join(' · ');
    if (hour?.has_data && hour?.entry_total_label) return hour.entry_total_label + ' entries present';
    return '';
  }

  function bodyHourLevel(hour, maxEntries) {
    if (!hour?.has_data) return 0;
    const count = Number(hour.entry_total || 0);
    if (!maxEntries || count <= 0) return 1;
    const ratio = Math.log1p(count) / Math.log1p(maxEntries);
    return Math.max(1, Math.min(4, Math.ceil(ratio * 4)));
  }

  function renderBodyHourList(payload, limit = 12) {
    const hours = (payload?.hourly || []).filter(hour => hour.has_data);
    if (!hours.length) return '';
    const visible = hours.slice(0, limit);
    const more = hours.length > visible.length
      ? `<li><time></time><span>and ${hours.length - visible.length} more hours</span></li>`
      : '';
    return '<ul class="tr-body-hour-list">'
      + visible.map(hour => {
        const summary = bodyHourSummary(hour) || 'Body data present';
        return `<li><time>${escapeHtml(hour.label || '')}</time><span>${escapeHtml(summary)}</span></li>`;
      }).join('\n')
      + more
      + '</ul>';
  }

  // Span gates for the day-rhythm block: the hourly strip only reads at day
  // scale, and hourly rows only add information beyond the brief when the
  // window would produce at least two rows.
  const BODY_RHYTHM_STRIP_MIN_HOURS = 6;
  const BODY_HOURLY_ROWS_MIN_HOURS = 1;

  function bodyWindowSpanHours(payload) {
    const start = Date.parse(payload?.from || '');
    const end = Date.parse(payload?.to || '');
    if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) return 0;
    return (end - start) / 3600000;
  }

  function renderBodyRhythm(payload, options = {}) {
    const hours = payload?.hourly || [];
    if (!hours.length) return '';
    const spanHours = bodyWindowSpanHours(payload);
    const showStrip = spanHours >= BODY_RHYTHM_STRIP_MIN_HOURS;
    const showRows = Boolean(options.rows) && spanHours > BODY_HOURLY_ROWS_MIN_HOURS;
    if (!showStrip && !showRows) return '';
    let grid = '';
    if (showStrip) {
      const maxEntries = hours.reduce((max, hour) => Math.max(max, Number(hour.entry_total || 0)), 0);
      const cells = hours.map((hour, index) => {
        const summary = bodyHourSummary(hour);
        const level = bodyHourLevel(hour, maxEntries);
        const classes = ['tr-body-hour', `tr-body-hour-level-${level}`];
        if (!hour.has_data) classes.push('tr-body-hour-empty');
        const hourLabel = index % 6 === 0
          ? `<span class="tr-body-hour-label">${escapeHtml(hour.label || '')}</span>`
          : '';
        const title = `${hour.range_label || hour.label || 'Hour'}${summary ? ' · ' + summary : ' · no body data'}`;
        const actionAttrs = hour.has_data
          ? ` data-action="open-body-hour" data-from="${escapeHtml(hour.start || '')}" data-to="${escapeHtml(hour.end || '')}" data-range="${escapeHtml(hour.range_label || '')}"`
          : ' disabled';
        return `<button type="button" class="${classes.join(' ')}" title="${escapeHtml(title)}" aria-label="${escapeHtml(title)}"${actionAttrs}>${hourLabel}</button>`;
      }).join('\n');
      grid = `<div class="tr-body-rhythm-grid">${cells}</div>`;
    }
    const rows = showRows ? renderBodyHourList(payload, options.limit || 12) : '';
    const heading = options.title === false
      ? ''
      : '<div class="tr-body-rhythm-title">Day rhythm</div>';
    return '<div class="tr-body-rhythm">'
      + heading
      + grid
      + rows
      + '</div>';
  }

  function renderBodyPanelSection(title, innerHtml) {
    if (!innerHtml) return '';
    return `<section class="tr-body-panel-section"><h4>${escapeHtml(title)}</h4>\n${innerHtml}\n</section>`;
  }

  // "1,234" -> "1,234 entries"; a count_label that already carries a noun
  // (e.g. "3 readings") passes through untouched. Never a bare number.
  function bodyCountText(item) {
    const label = String(item?.count_label ?? item?.count ?? '').trim();
    if (!label) return '';
    if (/[a-z]/i.test(label)) return label;
    const noun = Number(item?.count) === 1 ? 'entry' : 'entries';
    return `${label} ${noun}`;
  }

  function renderBodyPanelFooter() {
    return '<div class="tr-body-context-actions">'
      + `<a class="tr-body-link" href="/app/body/${day}">Open full Body day</a>`
      + '</div>';
  }

  // Focus management mirrors the screenshot modal: opening the docked panel
  // moves focus to its close button; closing returns focus to the trigger.
  let bodyPanelTrigger = null;

  function openBodyPanelSurface() {
    if (!bodyPanel.classList.contains('visible')) {
      bodyPanelTrigger = document.activeElement;
    }
    bodyPanel.classList.add('visible');
    bodyPanel.setAttribute('aria-hidden', 'false');
    bodyPanelClose.focus();
  }

  function renderBodyPanel(payload, title, rangeLabel) {
    bodyPanelTitle.textContent = title || 'Body context';
    bodyPanelRange.textContent = rangeLabel || '';

    if (!payload || !payload.has_data) {
      bodyPanelBody.innerHTML = '<p>No body context in this window.</p>'
        + renderBodyPanelFooter();
      openBodyPanelSurface();
      return;
    }

    const briefRows = bodyWindowParts(payload, 8)
      .map(row => `<li>${escapeHtml(row)}</li>`)
      .join('\n');
    const sources = (payload.sources?.chips || [])
      .map(source => `<span class="tr-signal-chip">${escapeHtml(source.name)} · ${escapeHtml(bodyCountText(source))}</span>`)
      .join('\n');
    // Rows already presented as events (workouts, sleep) stay out of the
    // signals list — compare labels case-insensitively, no hardcoded names.
    const eventLabels = new Set((payload.events || [])
      .map(event => String(event.label || '').trim().toLowerCase())
      .filter(label => label));
    const signalItems = (payload.signals || [])
      .filter(signal => !eventLabels.has(String(signal.label || '').trim().toLowerCase()));
    const signalOverflow = signalItems.length > 10
      ? `<li class="tr-body-panel-more"><a href="/app/body/${day}">+${signalItems.length - 10} more in Body</a></li>`
      : '';
    const signals = signalItems.slice(0, 10)
      .map(signal => `<li>${escapeHtml(signal.label)} · ${escapeHtml(bodyCountText(signal))}</li>`)
      .join('\n');
    const events = (payload.events || [])
      .map(event => `<li>${escapeHtml(event.label)} · ${escapeHtml(event.start_label)}–${escapeHtml(event.end_label)} · ${escapeHtml(event.overlap_label)}</li>`)
      .join('\n');
    const rhythm = renderBodyRhythm(payload, { rows: true, limit: 24, title: false });

    bodyPanelBody.innerHTML = ''
      + renderBodyPanelSection('Brief', `<ul class="tr-body-panel-list">${briefRows || '<li>Body data present.</li>'}</ul>`)
      + renderBodyPanelSection('Day rhythm', rhythm)
      + renderBodyPanelSection('Events', events ? `<ul class="tr-body-panel-list">${events}</ul>` : '')
      + renderBodyPanelSection('Sources', sources ? `<div class="tr-body-chip-row">${sources}</div>` : '')
      + renderBodyPanelSection('Signals', signals ? `<ul class="tr-body-panel-list">${signals}${signalOverflow}</ul>` : '')
      + renderBodyPanelFooter();
    attachBodyWindowButtons(bodyPanelBody);
    openBodyPanelSurface();
  }

  function closeBodyPanel() {
    bodyPanel.classList.remove('visible');
    bodyPanel.setAttribute('aria-hidden', 'true');
    if (bodyPanelTrigger && document.contains(bodyPanelTrigger)) {
      bodyPanelTrigger.focus();
    }
    bodyPanelTrigger = null;
  }

  bodyPanelClose.addEventListener('click', closeBodyPanel);
  bodyPanelClose.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); closeBodyPanel(); }
  });

  function openBodyWindow(payload, title, rangeLabel) {
    renderBodyPanel(payload, title, rangeLabel);
  }

  async function openBodyWindowFromIso(fromIso, toIso, title, rangeLabel) {
    bodyPanelTitle.textContent = title || 'Body context';
    bodyPanelRange.textContent = rangeLabel || '';
    bodyPanelBody.innerHTML = window.SurfaceState.loading({ text: 'loading body context…' });
    openBodyPanelSurface();
    try {
      const payload = await fetchBodyWindow(fromIso, toIso);
      renderBodyPanel(payload, title, rangeLabel);
    } catch (_) {
      bodyPanelBody.innerHTML = window.SurfaceState.error({
        heading: "couldn't load body context",
        desc: 'try again in a moment'
      });
    }
  }

  // Sleep/workout event counts ("1 sleep session") for windows whose
  // compact summary is empty but which still hold body events.
  function bodyEventParts(payload) {
    const events = payload?.events || [];
    const counts = { sleep: 0, workout: 0 };
    events.forEach(event => {
      if (event.kind === 'sleep') counts.sleep += 1;
      else if (event.kind === 'workout') counts.workout += 1;
    });
    const parts = [];
    if (counts.sleep) {
      parts.push(counts.sleep + ' sleep session' + (counts.sleep === 1 ? '' : 's'));
    }
    if (counts.workout) {
      parts.push(counts.workout + ' workout' + (counts.workout === 1 ? '' : 's'));
    }
    return parts;
  }

  function renderBodyStrip(payload) {
    let parts = bodyWindowParts(payload, 4);
    if (parts.length === 0 && payload?.has_data) {
      parts = bodyEventParts(payload).slice(0, 4);
    }
    if (parts.length === 0) return '';
    return '<div class="tr-body-strip">'
      + '<span class="tr-body-strip-label">Body context</span>'
      + '\n'
      + parts.map(part => `<span>${escapeHtml(part)}</span>`).join('<span class="tr-body-strip-separator" aria-hidden="true"> · </span>')
      + '\n'
      + '<button type="button" class="tr-body-strip-button" data-action="open-body-window">Open details</button>'
      + '</div>';
  }

  function renderBodyContextCard(data) {
    const payload = data.body_window;
    const parts = bodyWindowParts(payload, 6);
    let summary = 'Body context unavailable for this day window.';
    if (payload) {
      summary = payload.has_data
        ? 'Body data present for this day.'
        : 'No compact body context in this day window.';
    }
    const facts = parts.length
      ? '<div class="tr-body-context-facts">'
        + parts.map(part => `<span class="tr-body-context-fact">${escapeHtml(part)}</span>`).join('\n')
        + '</div>'
      : `<p>${escapeHtml(summary)}</p>`;
    const rhythm = payload ? renderBodyRhythm(payload) : '';
    const detailsButton = payload
      ? '<button type="button" class="tr-body-context-button" data-action="open-body-window">Open details</button>'
      : '';
    return '<div class="tr-body-context-card">'
      + '<h3>Body context</h3>'
      + '\n'
      + facts
      + rhythm
      + '\n'
      + '<div class="tr-body-context-actions">'
      + detailsButton
      + `<a class="tr-body-link" href="/app/body/${day}">Open full Body day</a>`
      + '</div>'
      + '</div>';
  }

  function attachBodyWindowButtons(targetEl) {
    targetEl.querySelectorAll('[data-action="open-body-window"]').forEach(button => {
      button.addEventListener('click', () => {
        const payload = segmentData?.body_window;
        if (payload) {
          const title = isBodySummarySegment() ? 'Body context' : 'Body during this segment';
          const label = isBodySummarySegment()
            ? 'Full day'
            : `${selectedSegment?.start || ''}–${selectedSegment?.end || ''}`;
          openBodyWindow(payload, title, label);
        }
      });
    });
    targetEl.querySelectorAll('[data-action="open-body-hour"]').forEach(button => {
      button.addEventListener('click', () => {
        if (!button.dataset.from || !button.dataset.to) return;
        openBodyWindowFromIso(
          button.dataset.from,
          button.dataset.to,
          'Body during this hour',
          button.dataset.range || ''
        );
      });
    });
  }

  // Returns {text: "3c", title: "$0.0312"} or {text: "", title: ""} if null/zero

  // Format bytes as human-readable size (KB, MB, GB)
  function formatSize(bytes) {
    if (!bytes) return '';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    return (bytes / (1024 * 1024 * 1024)).toFixed(2) + ' GB';
  }

  // seg.stream is a raw internal identifier (e.g. "device_watch-audio",
  // "iphone.mobile") — never show it verbatim in owner-facing text.
  function humanizeStreamName(stream) {
    if (!stream) return '';
    return window.JournalFormat.stream(stream);
  }

  // Build range text with total media size
  function updateRangeText() {
    if (!selectedSegment || !segmentData) return;
    const seg = selectedSegment;
    let parts = [`${seg.start} - ${seg.end}`];


    const sizes = segmentData.media_sizes;
    if (sizes) {
      let total = 0;
      const breakdown = [];
      if (sizes.audio) {
        total += sizes.audio;
        breakdown.push('audio ' + formatSize(sizes.audio));
      }
      if (sizes.screen) {
        total += sizes.screen;
        breakdown.push('screen ' + formatSize(sizes.screen));
      }
      if (total) {
        const title = breakdown.join(', ');
        parts.push(`<span title="${title}">${formatSize(total)}</span>`);
      }
    }

    rangeText.innerHTML = parts.join(' · ');
  }

  function computeTimelineBounds(ranges) {
    // Compute dynamic timeline bounds from content ranges
    // Returns {start, end} in minutes, snapped to hours
    const allRanges = [...(ranges.audio || []), ...(ranges.screen || []), ...(ranges.segments || [])];

    if (allRanges.length === 0) {
      return { start: DEFAULT_START, end: DEFAULT_END };
    }

    // Find min/max times across all ranges
    let minTime = Infinity;
    let maxTime = -Infinity;
    for (const rg of allRanges) {
      const s = parseTime(rg.start);
      const e = parseTime(rg.end);
      if (s < minTime) minTime = s;
      if (e > maxTime) maxTime = e;
    }

    // Add buffer and snap to hours
    let start = Math.floor((minTime - BUFFER) / 60) * 60;
    let end = Math.ceil((maxTime + BUFFER) / 60) * 60;

    // Enforce minimum span - extend end if needed
    if (end - start < MIN_SPAN) {
      end = start + MIN_SPAN;
    }

    // Clamp to valid day range (0:00 - 24:00)
    start = Math.max(0, start);
    end = Math.min(24 * 60, end);

    return { start, end };
  }

  function markdownOnlySegments(segments) {
    return (segments || []).filter(seg => {
      const types = seg.types || [];
      return types.includes('markdown') && !types.includes('audio') && !types.includes('screen');
    });
  }

  function browserOnlySegments(segments) {
    return (segments || []).filter(seg => {
      const types = seg.types || [];
      return types.includes('browser') && !types.includes('audio') && !types.includes('screen');
    });
  }

  function addSegmentIndicator(type, startMin, endMin, column, streams = [], state = 'analyzed', think = null, segment = null) {
    const el = document.createElement('div');
    el.className = 'tr-seg ' + (
      type === 'screen'
        ? 'tr-seg-screen'
        : type === 'markdown'
          ? 'tr-seg-markdown'
          : type === 'browser'
            ? 'tr-seg-browser'
            : 'tr-seg-audio'
    );
    if (state === 'pending') {
      el.classList.add('tr-seg-pending');
    } else if (state === 'analyzing') {
      el.classList.add('tr-seg-analyzing');
    } else if (think === 'awaiting') {
      el.classList.add('tr-seg-awaiting');
    }
    el.dataset.startMinute = startMin;
    el.dataset.endMinute = endMin;
    el.style.top = y(startMin) + 'px';
    el.style.height = Math.max(2, y(endMin) - y(startMin)) + 'px';
    el.classList.add(column === 1 ? 'tr-seg-col-1' : 'tr-seg-col-0');
    // Zero-padded HH:MM label
    const _h = Math.floor(startMin / 60);
    const _m = startMin % 60;
    const _label = `Segment ${String(_h).padStart(2, '0')}:${String(_m).padStart(2, '0')}`;
    el.setAttribute('role', 'button');
    el.setAttribute('tabindex', '0');
    el.setAttribute('aria-label', _label);
    const sortedStreams = [...streams].sort();
    const humanizedStreams = sortedStreams.map(humanizeStreamName);
    const streamHead = humanizedStreams.slice(0, 3).join(' + ');
    const streamToken = humanizedStreams.length > 3 ? streamHead + ' +' + (humanizedStreams.length - 3) : streamHead;
    const streamSuffix = sortedStreams.length ? ' · ' + streamToken : '';
    const stateSuffix = state === 'pending' ? ' · pending' : state === 'analyzing' ? ' · analyzing' : (think === 'awaiting' ? ' · ' + AWAITING_THINKING_LABEL : '');
    el.title = hhmm(startMin) + ' – ' + hhmm(endMin) + ' (' + (endMin - startMin) + ' min, ' + type + streamSuffix + stateSuffix + ')';
    const activate = () => {
      if (segment) {
        selectSegment(segment);
        return;
      }
      const midMin = (startMin + endMin) / 2;
      const start = snap(midMin - DEFAULT_LEN / 2);
      range = { start, end: start + DEFAULT_LEN };
      renderTimeline();
      updateZoom();
    };
    el.addEventListener('click', e => {
      e.stopPropagation();
      activate();
    });
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        activate();
      }
    });
    segmentsLane.appendChild(el);
  }

  function renderBodyEvents(payload) {
    bodyEventsLane.innerHTML = '';
    if (!payload || !payload.has_data || !(payload.events || []).length) {
      return;
    }
    (payload.events || []).forEach(event => {
      const startMin = minuteForIso(event.start);
      const endMin = minuteForIso(event.end);
      const visStart = Math.max(startMin, timelineStart);
      const visEnd = Math.min(endMin, timelineEnd);
      if (visEnd <= visStart) {
        return;
      }
      const block = document.createElement('div');
      block.className = 'tr-body-event tr-body-event-' + (event.kind === 'sleep' ? 'sleep' : 'workout');
      block.dataset.startMinute = visStart;
      block.dataset.endMinute = visEnd;
      block.style.top = y(visStart) + 'px';
      block.style.height = Math.max(4, y(visEnd) - y(visStart)) + 'px';
      block.setAttribute('role', 'button');
      block.setAttribute('tabindex', '0');
      const title = `${event.label} · ${event.start_label}–${event.end_label}`;
      block.setAttribute('aria-label', title);
      block.title = `${title} · ${event.overlap_label}`;
      const open = () => openBodyWindowFromIso(event.start, event.end, 'Body context', title);
      block.addEventListener('click', open);
      block.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          open();
        }
      });
      bodyEventsLane.appendChild(block);
    });
  }

  function buildGrid() {
    grid.innerHTML = '';
    labels.innerHTML = '';

    for (let h = timelineStart / 60; h <= timelineEnd / 60; h++) {
      const hourLine = document.createElement('div');
      hourLine.className = 'tr-grid-hour';

  function renderTimeline() {
    selWrap.style.top = (HEADER_HEIGHT + y(range.start)) + 'px';

  }

  function buildZoomGrid() {
    zoomGrid.innerHTML = '';
    zoomLabels.innerHTML = '';

    const rangeLen = range.end - range.start;
    // Determine label interval based on range length
    let labelInterval = 5; // default 5 min
    if (rangeLen > 120) labelInterval = 15;
    else if (rangeLen > 60) labelInterval = 10;

    for (let m = range.start; m <= range.end; m++) {
      const yPos = zoomY(m);

      if (m % 60 === 0) {
        const line = document.createElement('div');
        line.className = 'tr-grid-hour';
        line.style.top = yPos + 'px';
        zoomGrid.appendChild(line);
      } else if (m % 15 === 0) {
        const line = document.createElement('div');
        line.className = 'tr-grid-quarter';
        line.style.top = yPos + 'px';
        zoomGrid.appendChild(line);
      }

      if (m % labelInterval === 0) {
        const lab = document.createElement('div');
        lab.className = 'tr-zoom-label';
        lab.style.top = yPos + 'px';
        lab.textContent = hhmm(m);
        zoomLabels.appendChild(lab);
      }
    }
  }

  function filterSegmentsInRange() {
    return allSegments.filter(seg => {
      const segStart = parseTime(seg.start);
      const segEnd = parseTime(seg.end);
      return segEnd > range.start && segStart < range.end;
    });
  }

  function buildZoomSegments() {
    const filtered = filterSegmentsInRange();
    const streams = [...new Set(filtered.map(s => s.stream))].sort();
    const colCount = streams.length;
    zoomSegments.innerHTML = '';

    if (filtered.length === 0) {
      zoomSegments.innerHTML = '<div class="tr-zoom-empty">nothing in this range</div>';
      return;
    }

    filtered.forEach(seg => {
      const segStart = parseTime(seg.start);
      const segEnd = parseTime(seg.end);

      // Clamp to visible range
      const visStart = Math.max(segStart, range.start);
      const visEnd = Math.min(segEnd, range.end);

      const pill = document.createElement('div');
      pill.className = 'tr-zoom-pill';
      pill.setAttribute('role', 'button');
      pill.setAttribute('tabindex', '0');

      if (colCount > 1) {
        const colIdx = streams.indexOf(seg.stream);
        const colWidth = 100 / colCount;
        const gap = 0.5;
        pill.style.left = (colIdx * colWidth + gap / 2) + '%';
        pill.style.right = 'auto';
        pill.style.width = (colWidth - gap) + '%';
      }

      // Determine pill type based on content
      const hasAudio = seg.types.includes('audio');
      const hasScreen = seg.types.includes('screen');
      const hasMarkdown = seg.types.includes('markdown');
      const hasBrowser = seg.types.includes('browser');
      const dataState = seg.data_state || {};
      const hasPendingAdvertised = (seg.types || []).some(
        type => dataState[type] && dataState[type] !== 'analyzed'
      );
      const hasAnalyzingAdvertised = (seg.types || []).some(
        type => dataState[type] === 'analyzing'
      );
      if (hasAudio && hasScreen) {
        pill.classList.add('tr-zoom-pill-both');
      } else if (hasAudio) {
        pill.classList.add('tr-zoom-pill-audio');
      } else if (hasMarkdown) {
        pill.classList.add('tr-zoom-pill-markdown');
      } else if (hasBrowser) {
        pill.classList.add('tr-zoom-pill-browser');
      } else {
        pill.classList.add('tr-zoom-pill-screen');
      }
