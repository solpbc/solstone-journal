[package]
name = "solstone-core-offload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
full-tests = []
test-hooks = []

[lints]
workspace = true

[dependencies]
solstone-core-removals.workspace = true
chrono.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
solstone-core-backup.workspace = true
solstone-core-backup-runtime.workspace = true
solstone-core-format.workspace = true
solstone-core-journal-config.workspace = true
solstone-core-journal-config-write.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-retention.workspace = true
solstone-core-segment.workspace = true

[target.'cfg(windows)'.dependencies]
solstone-core-system.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
ureq.workspace = true
solstone-core-journal-io = { workspace = true, features = ["test-hooks"] }
solstone-core-backup-runtime = { workspace = true, features = ["test-support"] }
tempfile = "3.24.0"
minisign.workspace = true
solstone-core-distribution = { workspace = true, features = ["test-fixture-pin"] }
solstone-core-system.workspace = true
solstone-core-artifact-download.workspace = true
