[package]
name = "solstone-core-facets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
solstone-core-removals.workspace = true
caseless = "0.2.2"
chrono.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
solstone-core-entity.workspace = true
solstone-core-entity-matching.workspace = true
solstone-core-format.workspace = true
solstone-core-indexer-store.workspace = true
solstone-core-journal-config.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-segment.workspace = true
solstone-core-retention.workspace = true
solstone-core-trash.workspace = true

[features]
full-tests = []
test-hooks = ["solstone-core-entity/test-hooks"]

[dev-dependencies]
solstone-core-npy.workspace = true
solstone-core-segment = { workspace = true, features = ["test-fixtures"] }
solstone-core-entity = { workspace = true, features = ["test-hooks"] }
solstone-core-indexer-store = { workspace = true, features = ["test-fixtures"] }
solstone-core-indexer-todo = { workspace = true }
solstone-core-journal-config-write.workspace = true
tempfile = "3"

[lints]
workspace = true

[[test]]
name = "facet_lock_component"
path = "tests/facet_lock_component.rs"
required-features = ["test-hooks"]
