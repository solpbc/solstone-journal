[package]
name = "solstone-core-spp-attest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
base64 = "=0.22.1"
ring = "=0.17.14"
plist.workspace = true
serde.workspace = true
serde_json = { workspace = true }
solstone-core-backup.workspace = true
solstone-core-distribution.workspace = true
solstone-core-installed-payload.workspace = true
subtle.workspace = true
thiserror = { workspace = true }
x509-parser = "=0.16.0"

[lints.rust]
unsafe_code = "deny"

[features]
full-tests = []
ios-owner-app = []
test-hooks = ["solstone-core-distribution/test-fixture-pin"]

[dev-dependencies]
minisign.workspace = true
tempfile = "3"

[[test]]
name = "windows_verifier"
path = "tests/windows_verifier.rs"
required-features = ["test-hooks"]
