<style>
.dashboard { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
.token-card { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1.25rem; }
.token-rollup { display: flex; align-items: end; gap: 4px; height: 180px; margin: 1rem 0; }
.token-rollup__bar { flex: 1; min-width: 12px; border: 0; background: var(--facet-color, #b06a1a); cursor: pointer; }
.token-rollup__bar[aria-pressed="true"] { outline: 3px solid #111827; }
.token-detail { border-top: 1px solid #e5e7eb; padding-top: 1rem; }
.token-detail table { width: 100%; border-collapse: collapse; } .token-detail th, .token-detail td { padding: .5rem; text-align: left; }
</style>
<main class="dashboard" data-stats-url="/app/stats/api/stats">
  <h1>journal dashboard</h1>
  <section class="token-card" id="cost" data-token-card-state="loading" aria-labelledby="tokenCostHeading">
    <h2 id="tokenCostHeading">token activity (last 30 days)</h2>
    <div id="statsDateNav" aria-label="selected token day"></div>
    <div class="token-rollup" id="tokenRollup" aria-label="30 day token cost rollup"></div>
    <section class="token-detail" aria-labelledby="tokenDayHeading">
      <h3 id="tokenDayHeading" tabindex="-1">selected day</h3>
      <p id="tokenSummary" aria-live="polite"></p>
      <table>
        <thead><tr><th scope="col" aria-sort="none">provider</th><th scope="col" aria-sort="none">requests</th><th scope="col" aria-sort="none">tokens</th><th scope="col" aria-sort="none">cost</th></tr></thead>
        <tbody id="tokenProviders"></tbody>
      </table>
      <table>
        <thead><tr><th scope="col" aria-sort="none">model</th><th scope="col" aria-sort="none">requests</th><th scope="col" aria-sort="none">tokens</th><th scope="col" aria-sort="none">cost</th></tr></thead>
        <tbody id="tokenModels"></tbody>
      </table>
    </section>
  </section>
</main>
<script src="/app/stats/static/dashboard.js"></script>
