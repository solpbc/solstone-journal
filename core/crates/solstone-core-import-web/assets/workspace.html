function setupGuidedUploadArea() {
  const dropArea = document.getElementById('guidedDropArea');
  const fileInput = document.getElementById('guidedFileInput');
  const fileLabel = document.getElementById('guidedFileLabel');

  if (!dropArea || !fileInput || !fileLabel) {
    return;
  }

  const setFile = file => {
    if (!file || guidedFolderBusy || fileInput.disabled) return;
    currentGuidedFile = file || null;
    fileLabel.textContent = file ? file.name : '';
    currentGuidedSaved = null;
    invalidateImportPreview('guided');
    window._guidedClientItemId = file ? crypto.randomUUID() : null;
    if (document.getElementById('guidedFolderBtn')) {
      folderSelection({name: currentGuideSource}, null);
      const status = document.getElementById('guidedFolderStatus');
      if (status) status.textContent = '';
      folderControls(false);
    }
  };

  dropArea.onclick = () => fileInput.click();
  dropArea.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      fileInput.click();
    }
  });
  ['dragenter', 'dragover'].forEach(eventName => {
    dropArea.addEventListener(eventName, event => {
      event.preventDefault();
      dropArea.classList.add('dragover');
    });
  });
  ['dragleave', 'drop'].forEach(eventName => {
    dropArea.addEventListener(eventName, event => {
      event.preventDefault();
      dropArea.classList.remove('dragover');
    });
  });
  dropArea.addEventListener('drop', event => {
    const file = event.dataTransfer.files[0];
    if (file) {
      setFile(file);
    }
  });
  fileInput.onchange = event => {
    setFile(event.target.files[0]);
  };
}

function setupQuickImportForm() {
  const dropArea = document.getElementById('dropArea');
  const fileInput = document.getElementById('fileInput');
  const fileLabel = document.getElementById('fileLabel');
  const pasteText = document.getElementById('pasteText');
  const importForm = document.getElementById('importForm');
  const quickSettingInput = document.getElementById('quickSettingInput');

  if (!dropArea || !fileInput || !fileLabel || !pasteText || !importForm) {
    return;
  }

  currentFile = null;
  window._quickClientItemId = null;
  window._quickSaved = null;
  invalidateImportPreview('quick');
  dropArea.onclick = () => fileInput.click();
  dropArea.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      fileInput.click();
    }
  });
  ['dragenter', 'dragover'].forEach(ev => dropArea.addEventListener(ev, e => {
    e.preventDefault();
    dropArea.classList.add('dragover');
  }));
  ['dragleave', 'drop'].forEach(ev => dropArea.addEventListener(ev, e => {
    e.preventDefault();
    dropArea.classList.remove('dragover');
  }));
  dropArea.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if (file) {
      currentFile = file;
      fileLabel.textContent = file.name;
      window._quickClientItemId = crypto.randomUUID();
      window._quickSaved = null;
  invalidateImportPreview('quick');
    }
  });
  fileInput.onchange = e => {
    currentFile = e.target.files[0];
    if (currentFile) {
      fileLabel.textContent = currentFile.name;
      window._quickClientItemId = crypto.randomUUID();
      window._quickSaved = null;
  invalidateImportPreview('quick');
    }
  };
  ['input', 'paste'].forEach(eventName => {
    pasteText.addEventListener(eventName, () => {
      window._quickClientItemId = crypto.randomUUID();
      window._quickSaved = null;
  invalidateImportPreview('quick');
    });
  });

  importForm.onsubmit = async e => {
    e.preventDefault();
    const validateBtn = document.getElementById('validateBtn');
    const hasFile = currentFile != null;
    const hasText = pasteText.value.trim().length > 0;

    if (!hasFile && !hasText) {
      if (window.showError) {
        showError('Please provide a file or paste text');
      }
      return;
    }

    validateBtn.disabled = true;
    validateBtn.innerHTML = 'validating<span class="spinner"></span>';

    try {
      const fd = new FormData();
      if (hasFile) {
        fd.append('file', currentFile);
      } else {
        fd.append('text', pasteText.value);
      }
      fd.append(
        'client_item_id',
        window._quickClientItemId || (window._quickClientItemId = crypto.randomUUID())
      );

      const settingValue = quickSettingInput ? quickSettingInput.value.trim() : '';
      if (settingValue) {
        fd.append('setting', settingValue);
      }

      const response = await fetch('/app/import/api/save', { method: 'POST', body: fd });
      const data = await response.json();
      validateBtn.disabled = false;
      validateBtn.textContent = 'validate';

      if (!response.ok) {
        if (window.showError) {
          showError(importErrorMessage(data, 'Validation failed'));
        }
        return;
      }
      showDetect(data);
    } catch (_err) {
      validateBtn.disabled = false;
      validateBtn.textContent = 'validate';
      await loadImports();
      if (window.showError) {
        showError('Validation failed');
      }
    }
  };
}

async function uploadGuidedSourceFile(source) {
  const revision = previewRevisions.guided;
  if (!currentGuidedFile) {
    throw new Error('Please select a file to import.');
  }

  const guidedSettingInput = document.getElementById('guidedSettingInput');
  const fd = new FormData();
  fd.append('file', currentGuidedFile);
  fd.append(
    'client_item_id',
    window._guidedClientItemId || (window._guidedClientItemId = crypto.randomUUID())
  );
  if (source && source.name !== 'recording') {
    fd.append('source_hint', source.name);
  }
  if (guidedSettingInput && guidedSettingInput.value.trim()) {
    fd.append('setting', guidedSettingInput.value.trim());
  }

  const response = await fetch('/app/import/api/save', {
    method: 'POST',
    body: fd,
  });
  const data = await response.json();
  if (!response.ok) {
    throw new Error(importErrorMessage(data, 'Failed to save import'));
  }

  if (revision !== previewRevisions.guided) return null;
  currentGuidedSaved = data;

  if (isTerminalDuplicate(data)) {
    showDedupNotice(data.duplicate, Boolean(data.in_progress));
  }

  return data;
}

function showDedupNotice(duplicate, inProgress = false) {
  const container = document.getElementById('guidedDedupNotice');
  if (!container) return;
  container.innerHTML = `
    <div class="import-dedup-notice">
      <span class="dedup-text">${escapeHtml(duplicateNoticeText(duplicate, inProgress))}</span>
    </div>
  `;
}

let guidedFolderBusy = false;
function folderSelectionKey(source) { return `journal-import-folder:${source.name}`; }
function folderSelection(source, value) {
  try {
    if (value !== undefined) sessionStorage.setItem(folderSelectionKey(source), JSON.stringify(value));
    return JSON.parse(sessionStorage.getItem(folderSelectionKey(source)) || 'null');
  } catch (error) { return null; }
}
function folderControls(busy) {
  const choose = document.getElementById('guidedFolderBtn');
  const start = document.getElementById('guidedStartBtn');
  const file = document.getElementById('guidedFileInput');
  if (choose) choose.disabled = busy || guidedFolderBusy;
  if (file) file.disabled = guidedFolderBusy;
  if (start) start.disabled = busy || guidedFolderBusy || (!currentGuidedSaved && !file);
}
async function chooseGuidedFolder(source) {
  if (guidedFolderBusy || currentGuideSource !== source.name) return;
  const choose = document.getElementById('guidedFolderBtn');
  const status = document.getElementById('guidedFolderStatus');
  const reference = crypto.randomUUID();
  const live = () => currentGuideSource === source.name && document.getElementById('guidedFolderBtn') === choose;
  guidedFolderBusy = true;
  folderControls(true);
  try {
    const result = await window.JournalOwnerFolders.choose(source.name, reference, () => {
      if (!live()) return false;
      const retained = folderSelection(source, { client_item_id: reference });
      if (retained?.client_item_id !== reference) return false;
      currentGuidedSaved = null;
      currentGuidedFile = null;
      const file = document.getElementById('guidedFileInput');
      const label = document.getElementById('guidedFileLabel');
      if (file) file.value = '';
      if (label) label.textContent = '';
      invalidateImportPreview('guided');
      window._guidedClientItemId = reference;
      status.textContent = 'saving folder… this can take a while for a large folder.';
      return true;
    });
    if (result.state === 'outcome_unknown' && result.client_item_id === reference) {
      folderSelection(source, { client_item_id: reference });
    }
    if (!live() || result.state === 'cancelled') return;
    if (result.state === 'saved' && result.ok && result.value?.path) {
      currentGuidedSaved = result.value;
      folderSelection(source, { client_item_id: reference, import_id: result.import_id });
      status.textContent = `${result.folder_name}: saved`;
    } else if (result.state === 'registration_failed') {
      currentGuidedSaved = null;
      folderSelection(source, { client_item_id: reference, import_id: result.import_id, custody: 'saved' });
      status.textContent = `${result.folder_name}: saved, but import setup could not be confirmed. check your imports before choosing it again.`;
    } else {
      await reconcileGuidedFolder(source, true);
      if (live() && !currentGuidedSaved) status.textContent = result.error || 'this import could not be confirmed. check your imports before choosing it again.';
    }
    await loadImports();
  } catch (error) {
    if (live()) {
      await reconcileGuidedFolder(source, true);
      if (!currentGuidedSaved) status.textContent = 'this import could not be confirmed. check your imports before choosing it again.';
    }
  } finally {
    guidedFolderBusy = false;
    folderControls(false);
    if (live()) choose.focus();
    else if (currentGuideSource && document.getElementById('guidedFolderStatus')) {
      await reconcileGuidedFolder({name: currentGuideSource});
    }
  }
}
async function reconcileGuidedFolder(source, duringReply = false) {
  const status = document.getElementById('guidedFolderStatus');
  if (!status || (guidedFolderBusy && !duringReply)) return;
  const retained = folderSelection(source);
  if (!retained?.client_item_id) { folderControls(false); return; }
  let clientChoice = window._guidedClientItemId;
  if (clientChoice && clientChoice !== retained.client_item_id) { folderControls(false); return; }
  const live = () => currentGuideSource === source.name && document.getElementById('guidedFolderStatus') === status
    && folderSelection(source)?.client_item_id === retained.client_item_id && window._guidedClientItemId === clientChoice;
  folderControls(true);
  status.textContent = 'checking import…';
  try {
    const response = await fetch(`/app/import/api/list?client_item_id=${encodeURIComponent(retained.client_item_id)}`);
    if (!response.ok) throw new Error('unavailable');
    const list = await response.json();
    const rows = list.imports?.filter(row => row.client_item_id === retained.client_item_id) || [];
    if (rows.length !== 1) throw new Error('unconfirmed');
    const detail = await fetch(`/app/import/api/${encodeURIComponent(rows[0].timestamp)}`);
    if (!detail.ok) throw new Error('unavailable');
    const metadata = (await detail.json()).import_json;
    if (!metadata || metadata.client_item_id !== retained.client_item_id || metadata.source_hint !== source.name
        || typeof metadata.file_path !== 'string' || !metadata.file_path) throw new Error('unconfirmed');
    if (!live()) return;
    if (source.name === 'audio_archive' && currentGuidedSaved?.client_item_id !== retained.client_item_id) {
      const zone = document.getElementById('guidedArchiveZone');
      const manifest = document.getElementById('guidedArchiveManifest');
      const options = metadata.preview?.options;
      if (zone && manifest && !zone.value && !manifest.value && options) {
        if (typeof options.source_zone === 'string') zone.value = options.source_zone;
        if (typeof options.archive_manifest === 'string') manifest.value = options.archive_manifest;
      }
    }
    currentGuidedSaved = { path: metadata.file_path, timestamp: rows[0].timestamp,
      source_timestamp: metadata.source_timestamp || rows[0].timestamp, client_item_id: retained.client_item_id };
    window._guidedClientItemId = retained.client_item_id;
    clientChoice = retained.client_item_id;
    status.textContent = `${metadata.original_filename}: saved`;
  } catch (error) {
    if (live()) {
      currentGuidedSaved = null;
      status.textContent = retained.custody === 'saved'
        ? 'folder saved, but import setup could not be confirmed. check your imports before choosing it again.'
        : 'this import could not be confirmed. check your imports before choosing it again.';
    }
  } finally { if (live()) folderControls(false); }
}

async function saveGuidedPath(source) {
  const revision = previewRevisions.guided;
  const pathInput = document.getElementById('guidedPathInput');
  if (!pathInput || !pathInput.value.trim()) {
    throw new Error('Please enter the path to your vault folder.');
  }

  const guidedSettingInput = document.getElementById('guidedSettingInput');
  const setting = guidedSettingInput ? guidedSettingInput.value.trim() : '';
  const payload = {
    path: pathInput.value.trim(),
    setting,
    client_item_id: window._guidedClientItemId
      || (window._guidedClientItemId = crypto.randomUUID()),
  };
  if (source && source.name !== 'recording') {
    payload.source_hint = source.name;
  }

  const response = await fetch('/app/import/api/save-path', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const data = await response.json();
  if (!response.ok) {
    throw new Error(importErrorMessage(data, 'Path not found'));
  }

  if (revision !== previewRevisions.guided) return null;
  currentGuidedSaved = data;
  if (isTerminalDuplicate(data)) {
    showDedupNotice(data.duplicate, Boolean(data.in_progress));
  }
  return data;
}

const importPreviews = { guided: null, quick: null };
const previewRevisions = { guided: 0, quick: 0 };
const importInFlight = { guided: false, quick: false };

function invalidateImportPreview(kind) {
  importPreviews[kind] = null;
  previewRevisions[kind] += 1;
  const panel = document.getElementById(`${kind}SizePreview`);
  if (panel) panel.textContent = '';
  const button = document.getElementById(kind === 'guided' ? 'guidedStartBtn' : 'startBtn');
  if (button) { button.textContent = 'preview import'; button.disabled = importInFlight[kind]; }
}

function restoreImportButton(kind, button) {
  const preview = importPreviews[kind];
  button.textContent = preview ? 'start import' : 'preview import';
  button.disabled = importInFlight[kind] || Boolean(preview && !preview.ready);
}

async function prepareImportPreview(kind, payload, setting, button) {
  const key = JSON.stringify({ ...payload, setting });
  const previous = importPreviews[kind];
  if (previous?.key === key && previous.ready) return previous.token;
  const revision = previewRevisions[kind];
  button.textContent = 'preparing preview…';
  const response = await fetch('/app/import/api/preview', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
  });
  const data = await response.json();
  if (!response.ok) throw new Error(importErrorMessage(data, 'could not preview this import'));
  if (revision !== previewRevisions[kind]) return null;
  const size = data.size;
  if (size?.schema === 'solstone.import.audio-archive.size.v1') {
    if (!['members', 'source_bytes', 'days', 'tiles'].every(key => Number.isSafeInteger(size[key]) && size[key] >= 0)
        || !size.left_out || !Object.values(size.left_out).every(value => Number.isSafeInteger(value) && value >= 0) || !data.preview_token) throw new Error('could not read the archive size');
    const ready = size.tiles > 0;
    importPreviews[kind] = { key, token: data.preview_token, ready };
    const panel = document.getElementById(`${kind}SizePreview`);
    if (panel) {
      const skipped = Object.values(size.left_out).reduce((total, count) => total + count, 0);
      panel.textContent = `${size.members} source ${size.members === 1 ? 'file' : 'files'} · ${size.source_bytes} recording bytes · ${size.days} ${size.days === 1 ? 'day' : 'days'}`
        + (skipped ? ` · ${skipped} left out` : '')
        + (Number.isSafeInteger(size.saved_parts) ? ` · ${size.saved_parts} audio ${size.saved_parts === 1 ? 'part' : 'parts'} already saved` : '')
        + (!ready ? ' · nothing to import' : '');
    }
    restoreImportButton(kind, button);
    return null;
  }
  if (!size || !Number.isInteger(size.recordings) || !Number.isInteger(size.days) || !data.preview_token) {
    throw new Error('could not read the import size');
  }
  const ready = size.recordings > 0 || Boolean(size.other_units?.[1]);
  importPreviews[kind] = { key, token: data.preview_token, ready };
  const panel = document.getElementById(`${kind}SizePreview`);
  if (panel) {
    panel.textContent = `${size.recordings} ${size.recordings === 1 ? 'recording' : 'recordings'} across ${size.days} ${size.days === 1 ? 'day' : 'days'}`;
    if (size.other_units) panel.textContent += ` · ${size.other_units[1]} ${size.other_units[0]}`;
    if (size.skipped) panel.textContent += ` · ${size.skipped} skipped`;
    if (data.force_notice) panel.textContent += ` · ${data.force_notice}`;
    if (!ready) panel.textContent += ' · nothing to import';
  }
  restoreImportButton(kind, button);
  return null;
}

document.addEventListener('input', event => {
  const id = event.target?.id;
  if (['guidedPathInput', 'guidedFileInput'].includes(id)) currentGuidedSaved = null;
  if (['guidedSettingInput', 'guidedPathInput', 'guidedFileInput', 'guidedArchiveZone', 'guidedArchiveManifest'].includes(id)) invalidateImportPreview('guided');
  if (['timestampInput', 'settingInput', 'fileInput', 'pasteText', 'quickSettingInput'].includes(id)) invalidateImportPreview('quick');
});

async function startGuidedImport(source) {
  if (importInFlight.guided) return;
  importInFlight.guided = true;
  const revision = previewRevisions.guided;
  let preparedPreview = false;
  const startButton = document.getElementById('guidedStartBtn');
  const guidedSettingInput = document.getElementById('guidedSettingInput');

  startButton.disabled = true;
  startButton.innerHTML = 'starting<span class="spinner"></span>';

  try {
    let saved;
    if (source.input_type === 'path_input') {
      saved = currentGuidedSaved || await saveGuidedPath(source);
    } else {
      saved = currentGuidedSaved || await uploadGuidedSourceFile(source);
    }
    if (revision !== previewRevisions.guided) return;
    if (isTerminalDuplicate(saved)) {
      showDedupNotice(saved.duplicate, Boolean(saved.in_progress));
      return;
    }
    const path = saved.path;
    const ts = saved.source_timestamp || saved.timestamp;
    const setting = guidedSettingInput ? guidedSettingInput.value.trim() : '';

    const metaResponse = await fetch('/app/import/api/meta', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path, setting, import_id: saved.timestamp }),
    });

    if (!metaResponse.ok) {
      const errorData = await metaResponse.json().catch(() => ({}));
      throw new Error(importErrorMessage(errorData, 'Failed to save import settings'));
    }

    if (revision !== previewRevisions.guided) return;
    const payload = { path, timestamp: ts, import_id: saved.timestamp };
    if (source.name === 'audio_archive') {
      payload.source_zone = document.getElementById('guidedArchiveZone').value;
      const manifest = document.getElementById('guidedArchiveManifest').value.trim();
      if (!payload.source_zone && !manifest) throw new Error('choose the time zone in the recording filenames, or enter the manifest filename.');
      if (manifest) payload.archive_manifest = manifest;
    }
    const previewToken = await prepareImportPreview('guided', payload, setting, startButton);
    preparedPreview = !previewToken && revision === previewRevisions.guided && Boolean(importPreviews.guided?.ready);
    if (!previewToken || revision !== previewRevisions.guided) return;
    const startResponse = await fetch('/app/import/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...payload, preview_token: previewToken }),
    });

    const started = await startResponse.json().catch(() => ({}));
    if (!startResponse.ok) {
      throw new Error(importErrorMessage(started, 'Failed to start import'));
    }
    const importId = started.import_id || saved.timestamp;
    // A replayed start found the import already started or finished, so the progress view
    // shows the journal's own status for it instead of a fresh start.
    if (started.replay !== true && (!importEvents[importId] || !IMPORT_TERMINAL_EVENTS.has(importEvents[importId].event))) {
      trackPendingImport(importId);
      importEvents[importId] = {
        import_id: importId,
        event: 'started',
        stage: 'initialization',
        source_type: source.name,
        source_display: source.display_name,
        ...(importEvents[importId] || {})
      };
    }
    loadImports();
    navigateTo(`progress/${importId}`);
  } catch (err) {
    invalidateImportPreview('guided');
    await loadImports();
    if (window.showError && err instanceof Error) {
      showError(err.message);
    }
  } finally {
    importInFlight.guided = false;
    restoreImportButton('guided', startButton);
    if (preparedPreview) startButton.focus();
  }
}

async function repeatSource(sourceName) {
  currentGuidedFile = null;
  currentGuidedSaved = null;
  invalidateImportPreview('guided');
  window._guidedClientItemId = null;
  const hash = window.location.hash.slice(1);
  if (hash.startsWith('progress/')) {
    const importId = hash.split('/')[1];
    clearPendingImport(importId);
    if (importEvents[importId]) {
      importEvents[importId].stalled = false;
    }
  }
  await navigateTo(`guide/${sourceName}`);
  const dropArea = document.getElementById('guidedDropArea');
  const pathInput = document.getElementById('guidedPathInput');
  const quickDropArea = document.getElementById('dropArea');
  if (dropArea) {
    dropArea.focus();
  } else if (pathInput) {
    pathInput.value = '';
    pathInput.focus();
  } else if (quickDropArea) {
    quickDropArea.focus();
  }
  const dedup = document.getElementById('guidedDedupNotice');
  if (dedup) dedup.innerHTML = '';
}

function formatStatValue(val) {
  if (typeof val === 'number') return escapeHtml(String(val));
  if (val === null || val === undefined) return '—';
  return escapeHtml(String(val));
}

function renderThinkingProgress(progress) {
  if (!progress || progress.status === 'not_published') return '';
  if (progress.status !== 'current') return 'thinking progress is unavailable';
  return `${escapeHtml(progress.ready)} of ${escapeHtml(progress.recordings)} ${progress.recordings === 1 ? 'recording' : 'recordings'} ready to find`
    + (progress.waiting ? ` · ${escapeHtml(progress.waiting)} waiting` : '')
    + (progress.held ? ` · ${escapeHtml(progress.held)} held — <a href="/app/health/">review on Health</a>` : '')
    + (progress.unreadable ? ` · ${escapeHtml(progress.unreadable)} could not be checked` : '');
}

function showProgressView(importId, eventData = null) {
  const guideSteps = document.getElementById('guideSteps');
  const source = sourceMetadataByName[currentGuideSource] || null;
  const importInfo = getImportById(importId);
  const currentEvent = eventData || importEvents[importId] || null;

  if (!guideSteps) {
    return;
  }

  const isConfirmedSuccess = currentEvent
    ? currentEvent.event === 'completed' || currentEvent.status === 'success'
    : importInfo?.status === 'success';
  const isUnconfirmed = currentEvent
    ? currentEvent.status === 'unconfirmed'
    : importInfo?.status === 'unconfirmed';
  const isUnavailable = currentEvent
    ? currentEvent.status === 'unavailable'
    : importInfo?.status === 'unavailable';
  const isFailed = currentEvent
    ? currentEvent.event === 'error' || currentEvent.status === 'failed'
    : importInfo?.status === 'failed';
  const isStalled = Boolean(currentEvent?.stalled);

  const displayName = currentEvent?.source_display || importInfo?.source_display || source?.display_name || 'Import';

  const stageLabel = isStalled
    ? 'stalled: no updates in 10 minutes'
    : isConfirmedSuccess
      ? 'recordings saved'
      : isUnconfirmed
        ? 'import unconfirmed'
        : isUnavailable
          ? 'import status unavailable'
          : isFailed
            ? 'import failed'
            : currentEvent?.source_type === 'audio_archive' && currentEvent?.save_complete === true
              ? 'recordings saved; processing continues'
              : humanStageName(currentEvent?.stage || 'initialization', displayName);
  const progressHtml = currentEvent ? renderProgressStats(currentEvent) : '';
  let completionHtml = '';

  if (isConfirmedSuccess) {
    const completedInfo = currentEvent || importInfo || {};
    const range = completedInfo.date_range || importInfo?.date_range || null;
    const entriesWritten = completedInfo.entries_written ?? importInfo?.entries_written ?? null;
    const entitiesSeeded = completedInfo.entities_seeded ?? importInfo?.entities_seeded ?? null;
    const durationMs = completedInfo.duration_ms ?? importInfo?.duration_ms ?? null;
    const unavailDesc = completedInfo.unavailable_description ?? importInfo?.unavailable_description ?? null;
    const unavailPages = completedInfo.unavailable_pages ?? importInfo?.unavailable_pages ?? null;
    let gapHtml = '';
    if (unavailDesc) {
      gapHtml += `<div class="progress-gap-chip" style="margin-top: 0.5rem; color: var(--warn-ink);">original saved (description unavailable)</div>`;
    }
    if (typeof unavailPages === 'number' && unavailPages > 0) {
      const pageLabel = unavailPages === 1 ? '1 page unavailable' : `${unavailPages} pages unavailable`;
      gapHtml += `<div class="progress-gap-chip" style="margin-top: 0.5rem; color: var(--warn-ink);">partially extracted (${pageLabel})</div>`;
    }
    const sourceName = currentGuideSource || source?.name || completedInfo.source_type || importInfo?.source_type || '';
    const repeatBtn = sourceName ? `
      <button type="button" class="import-primary-btn" data-source="${escapeHtml(sourceName)}">${escapeHtml(['image', 'document'].includes(sourceName) ? 'import another ' + (source?.display_name || sourceName) : 'import another source')}</button>
    ` : '';
    completionHtml = `
      <div class="import-completion-summary">
        <div><strong>entries written:</strong> ${formatStatValue(entriesWritten)}</div>
        <div><strong>entities seeded:</strong> ${formatStatValue(entitiesSeeded)}</div>
        <div><strong>date range:</strong> ${escapeHtml(formatDateRange(range) || '—')}</div>
        <div><strong>duration:</strong> ${durationMs !== null && durationMs !== undefined ? formatElapsed(durationMs) : '—'}</div>
        ${gapHtml}
        <div class="import-action-row">
          <a class="import-secondary-btn" href="/app/import/${encodeURIComponent(completedInfo.processed_timestamp || importId)}#content">browse what was imported →</a>
          ${repeatBtn}
          <a href="#" class="import-secondary-btn" onclick="showGrid(); return false;">import another source</a>
        </div>
      </div>
    `;
  } else if (isUnconfirmed) {
    const unconfirmedInfo = currentEvent || importInfo || {};
    const totalFiles = typeof unconfirmedInfo.total_files_created === 'number'
      ? unconfirmedInfo.total_files_created
      : (typeof importInfo?.total_files_created === 'number' ? importInfo.total_files_created : null);
    const entries = typeof unconfirmedInfo.entries_written === 'number'
      ? unconfirmedInfo.entries_written
      : (typeof importInfo?.entries_written === 'number' ? importInfo.entries_written : null);
    const hasVerifiedOutputs = (typeof totalFiles === 'number' && totalFiles > 0) || (typeof entries === 'number' && entries > 0);
    const browseBtn = hasVerifiedOutputs ? `
      <a class="import-secondary-btn" href="/app/import/${encodeURIComponent(importId)}#content">browse what was imported →</a>
    ` : '';
    completionHtml = `
      <div class="import-completion-summary unconfirmed">
        <div class="progress-gap-chip" style="margin-bottom: 0.5rem; color: var(--warn-ink);">this import couldn't be confirmed as finished.</div>
        <div class="import-action-row">
          <button type="button" class="import-primary-btn" data-import-check-status="${escapeHtml(importId)}">check status</button>
          ${browseBtn}
          <a href="#" class="import-secondary-btn" onclick="showGrid(); return false;">import another source</a>
        </div>
      </div>
    `;
  } else if (isUnavailable) {
    // unavailable_description is a server field and can carry a provider's own
    // error text. Escaping it makes it safe to put in the page; it does not make
    // it owner copy. The panel says what we can stand behind, the way the detail
    // drawer does with its own fixed line.
    // The heading already says it; a second copy of the same words adds nothing.
    completionHtml = `
      <div class="import-completion-summary unavailable">
        <div class="import-action-row">
          <button type="button" class="import-primary-btn" data-import-check-status="${escapeHtml(importId)}">check status</button>
          <a href="#" class="import-secondary-btn" onclick="showGrid(); return false;">import another source</a>
        </div>
      </div>
    `;
  } else if (isFailed) {
    const errorText = currentEvent?.error || importInfo?.error || 'import failed';
    completionHtml = `
      <div class="import-completion-summary failed">
        <div><strong>error:</strong> ${escapeHtml(errorText)}</div>
        <div class="import-action-row">
          <a href="#" class="import-secondary-btn" onclick="showGrid(); return false;">import another source</a>
        </div>
      </div>
    `;
  } else if (currentEvent?.stalled) {
    completionHtml = `
      <div class="import-completion-summary stalled">
        <div><strong>import id:</strong> ${escapeHtml(importId)}</div>
        <div>stalled: no updates in 10 minutes. ${window.CONVEY_COPY.RELOAD_HINT}</div>
        <div class="import-action-row">
          <button type="button" class="import-primary-btn" data-import-check-status="${escapeHtml(importId)}">check status</button>
          <a href="#" class="import-secondary-btn" onclick="showGrid(); return false;">import another source</a>
        </div>
      </div>
    `;
  }

  // tabindex="-1" is the landing place for focus when an answer repaints this
  // panel out from under the button that asked for it: without somewhere to go,
  // focus falls to <body> and a keyboard owner starts the page over.
  guideSteps.innerHTML = `
    <div class="import-progress-panel" tabindex="-1">
      <div class="import-step-number">progress</div>
      <h3 class="import-progress-title">${escapeHtml(displayName)}</h3>
      <p class="import-progress-message">${escapeHtml(stageLabel)}</p>
      ${currentEvent?.elapsed_ms ? `<div class="progress-detail">${escapeHtml(formatElapsed(currentEvent.elapsed_ms))} elapsed</div>` : ''}
      <div id="progressReconcileError" role="alert" aria-live="polite" style="display:none; color:var(--danger); margin-top:0.5rem; font-size:0.9rem;"></div>
      ${progressHtml}
      <div class="import-thinking-progress" role="status" aria-live="polite">${renderThinkingProgress(currentEvent?.thinking)}</div>
      ${completionHtml}
    </div>
  `;
}

startBtn.addEventListener('click', async () => {
  if (importInFlight.quick) return;
  const revision = previewRevisions.quick;
  let preparedPreview = false;
  const ts = document.getElementById('timestampInput').value.trim();
  const path = document.getElementById('savedPath').value;
  const setting = settingInput.value.trim();

  if (!ts) {
    if (window.showError) showError('the date is required before starting the import.');
    return;
  }
  if (isTerminalDuplicate(window._quickSaved)) {
    showDetect(window._quickSaved);
    return;
  }

  importInFlight.quick = true;
  startBtn.disabled = true;
  startBtn.innerHTML = 'starting<span class="spinner"></span>';

  try {
    const response = await fetch('/app/import/api/meta', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path, setting, import_id: window._quickSaved?.timestamp }),
    });

    if (!response.ok) {
      const errorData = await response.json().catch(() => ({}));
      throw new Error(importErrorMessage(errorData, 'Failed to save import settings'));
    }

    if (revision !== previewRevisions.quick) return;
    const payload = { path, timestamp: ts, import_id: window._quickSaved?.timestamp,
      timestamp_override: ts !== (window._quickSaved?.source_timestamp || window._quickSaved?.timestamp) };
    const previewToken = await prepareImportPreview('quick', payload, setting, startBtn);
    preparedPreview = !previewToken && revision === previewRevisions.quick && Boolean(importPreviews.quick?.ready);
    if (!previewToken || revision !== previewRevisions.quick) return;
    const startResponse = await fetch('/app/import/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...payload, preview_token: previewToken }),
    });

    const started = await startResponse.json().catch(() => ({}));
    if (!startResponse.ok) {
      throw new Error(importErrorMessage(started, 'Failed to start import'));
    }
    const importId = started.import_id || window._quickSaved?.timestamp || ts;
    restoreImportButton('quick', startBtn);
    closeDetectModal();
    // A replayed start found the import already started or finished, so the progress view
    // shows the journal's own status for it instead of a fresh start.
    if (started.replay !== true && (!importEvents[importId] || !IMPORT_TERMINAL_EVENTS.has(importEvents[importId].event))) {
      trackPendingImport(importId);
      importEvents[importId] = {
        import_id: importId,
        event: 'started',
        stage: 'initialization',
        source_type: 'quick',
        source_display: 'quick import',
        ...(importEvents[importId] || {})
      };
    }
    loadImports();
    navigateTo(`progress/${importId}`);
  } catch (err) {
    invalidateImportPreview('quick');
    restoreImportButton('quick', startBtn);
    if (window.showError && err instanceof Error) showError(err.message);
  } finally {
    importInFlight.quick = false;
    restoreImportButton('quick', startBtn);
    if (preparedPreview) startBtn.focus();
  }
});

window.onclick = e => {
  if (e.target === document.getElementById('detectModal')) {
    closeDetectModal();
  }
};

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && document.getElementById('detectModal').style.display === 'block') {
    closeDetectModal();
  }
});

let thinkingProgressTimer = null;
function scheduleThinkingProgress() {
  if (thinkingProgressTimer !== null) clearTimeout(thinkingProgressTimer);
  const hash = window.location.hash.slice(1);
  if (!hash.startsWith('progress/') || document.visibilityState === 'hidden') { thinkingProgressTimer = null; return; }
  const id = hash.split('/')[1];
  const archive = importEvents[id]?.source_type === 'audio_archive';
  const activeArchive = archive && !['success', 'failed', 'unavailable', 'unconfirmed'].includes(importEvents[id]?.status);
  thinkingProgressTimer = setTimeout(async () => {
    thinkingProgressTimer = null;
    if (window.location.hash.slice(1) !== `progress/${id}`) return;
    try {
      const res = await window.apiJson(`/app/import/api/${encodeURIComponent(id)}`);
      if (window.location.hash.slice(1) === `progress/${id}`) {
        if (archive) await reconcileImportState(id, { quiet: true, observed: res });
        if (importEvents[id]) importEvents[id].thinking = res?.thinking;
        const panel = document.querySelector('.import-thinking-progress');
        // Keep controls in place during background refresh so focus stays put.
        const markup = renderThinkingProgress(res?.thinking);
        if (panel && panel.innerHTML !== markup && !panel.contains(document.activeElement)) panel.innerHTML = markup;
      }
    } catch (_) { /* The next read can recover without replacing the last known progress. */ }
    scheduleThinkingProgress();
  }, activeArchive ? 5000 : 30000);
}
window.addEventListener('hashchange', scheduleThinkingProgress);

const inFlightReconcile = new Set();

async function reconcileImportState(importId, options = {}) {
  if (!importId || inFlightReconcile.has(importId)) return;
  inFlightReconcile.add(importId);
  const { fromStall = false, quiet = false } = options;
  const activeEl = typeof document !== 'undefined' ? document.activeElement : null;
  try {
    const res = options.observed || await window.apiJson(`/app/import/api/${encodeURIComponent(importId)}`);
    if (!res) return;
    const archiveId = res.archive_run_id;
    if (typeof archiveId === 'string' && /^[0-9]{8}_[0-9]{6}$/.test(archiveId) && archiveId !== importId) {
      clearPendingImport(importId);
      if (window.location.hash.slice(1) === `progress/${importId}`) await navigateTo(`progress/${archiveId}`);
      return archiveId;
    }
    const archive = res.source_type === 'audio_archive' || res.import_json?.source_hint === 'audio_archive';
    const canonicalStatus = archive && (res.archive_lookup_unknown || res.archive_active === false) ? 'unconfirmed' : res.status;
    const eventName = canonicalStatus === 'success'
      ? 'completed'
      : (canonicalStatus === 'failed' || canonicalStatus === 'unconfirmed' || canonicalStatus === 'unavailable')
        ? 'error'
        : (canonicalStatus === 'running')
          ? 'status'
          : 'started';
    const eventData = {
      import_id: importId,
      event: eventName,
      status: canonicalStatus,
      thinking: res.thinking,
      generation: res.generation,
      attempt_id: res.attempt_id,
      entries_written: res.entries_written,
      entities_seeded: res.entities_seeded,
      total_files_created: res.total_files_created,
      unavailable_description: res.unavailable_description,
      unavailable_pages: res.unavailable_pages,
      has_gaps: res.has_gaps,
      duration_ms: res.duration_ms,
      date_range: res.date_range,
      error: res.error,
      error_stage: res.error_stage,
      fromStall: fromStall
    };
    if (archive) {
      eventData.source_type = 'audio_archive';
      eventData.source_display = res.source_display || 'audio archive';
      eventData.stage = res.save_complete === true ? 'processing' : 'saving';
      for (const key of ['saved_parts', 'saved_tiles', 'remaining', 'left_out', 'processing', 'processed_parts', 'save_complete', 'unavailable_parts', 'rejected_parts']) {
        if (res[key] !== undefined) eventData[key] = res[key];
      }
    }
    if (IMPORT_TERMINAL_EVENTS.has(eventName) || canonicalStatus === 'unconfirmed' || canonicalStatus === 'unavailable') {
      clearPendingImport(importId);
    } else if (canonicalStatus === 'running') {
      trackPendingImport(importId);
    }
    updateImportRow(importId, eventData, { authoritative: true });
    const errEl = typeof document !== 'undefined' && typeof document.getElementById === 'function'
      ? document.getElementById('progressReconcileError')
      : null;
    if (errEl) {
      errEl.style.display = 'none';
    }
  } catch (err) {
    // A read the owner did not ask for stays silent when it fails: the live event already
    // told them the outcome, this only tops up the facts a live event does not carry.
    if (quiet) return;
    const errEl = typeof document !== 'undefined' && typeof document.getElementById === 'function'
      ? document.getElementById('progressReconcileError')
      : null;
    if (errEl) {
      errEl.setAttribute('role', 'alert');
      errEl.setAttribute('aria-live', 'polite');
      errEl.textContent = "couldn't check status. reload to try again.";
      errEl.style.display = '';
    }
  } finally {
    inFlightReconcile.delete(importId);
    const checkId = activeEl && typeof activeEl.getAttribute === 'function'
      ? activeEl.getAttribute('data-import-check-status')
      : null;
    const stillAttached = Boolean(
      activeEl && document.body && typeof document.body.contains === 'function' && document.body.contains(activeEl)
    );
    if (stillAttached && typeof activeEl.focus === 'function') {
      activeEl.focus();
    } else if (checkId) {
      // The answer repaints the panel, so the button that was pressed is gone.
      // The panel's own button is where focus belongs -- a document-wide lookup
      // can land on the history row's button for the same import instead -- and
      // a panel that has no button any more (it succeeded, or it failed) takes
      // focus itself rather than letting it fall to <body>.
      const safe = typeof CSS !== 'undefined' && typeof CSS.escape === 'function' ? CSS.escape(checkId) : checkId;
      const selector = `[data-import-check-status="${safe}"]`;
      const panel = typeof document.querySelector === 'function'
        ? document.querySelector('.import-progress-panel')
        : null;
      const panelBtn = panel && typeof panel.querySelector === 'function' ? panel.querySelector(selector) : null;
      const target = panelBtn
        || panel
        || (typeof document.querySelector === 'function' ? document.querySelector(selector) : null);
      if (target && typeof target.focus === 'function') {
        target.focus();
      }
    }
  }
}

if (typeof window.addEventListener === 'function') {
  window.addEventListener('online', () => {
    const hash = window.location.hash.slice(1);
    if (hash.startsWith('progress/')) {
      const importId = hash.split('/')[1];
      reconcileImportState(importId);
    }
  });
}

document.addEventListener('click', event => {
  const checkBtn = event.target.closest('[data-import-check-status]');
  if (checkBtn) {
    event.stopPropagation();
    const id = checkBtn.getAttribute('data-import-check-status');
    if (id) {
      reconcileImportState(id);
    }
    return;
  }
  const repeatBtn = event.target.closest('[data-source]');
  if (repeatBtn) {
    event.stopPropagation();
    const source = repeatBtn.getAttribute('data-source');
    if (source) {
      repeatSource(source);
    }
    return;
  }
  const sourceCard = event.target.closest('[data-import-source], [data-import-quick]');
  if (sourceCard) {
    event.stopPropagation();
    if (sourceCard.hasAttribute('data-import-quick')) {
      showQuickImport();
      return;
    }
    const name = sourceCard.getAttribute('data-import-source');
    if (name) {
      navigateTo(`guide/${name}`);
    }
    return;
  }
  const tr = event.target.closest('tr[data-import-link]');
  if (tr && !event.target.closest('a, button, input, select, textarea')) {
    const link = tr.getAttribute('data-import-link');
    if (link) window.location.href = link;
  }
});

document.addEventListener('keydown', event => {
  if (event.key === 'Enter') {
    const tr = event.target.closest('tr[data-import-link]');
    if (tr && event.target === tr) {
      const link = tr.getAttribute('data-import-link');
      if (link) window.location.href = link;
    }
  }
});

// One live importer event: track or release the pending timer, update the row and panel, and
// after a terminal event read the durable record once (see below).
function handleImporterEvent(eventData) {
  if (!IMPORT_ROW_EVENTS.has(eventData.event)) {
    return;
  }
  const held = typeof importEvents === 'undefined' || !importEvents
    ? undefined
    : importEvents[eventData.import_id];
  const heldTerminal = !!held
    && (typeof isTerminalState === 'function'
      ? isTerminalState(held.event || held.status)
      : false);
  const newerAttempt = heldTerminal
    && typeof held.generation === 'number'
    && typeof eventData.generation === 'number'
    && eventData.generation > held.generation;
  if (IMPORT_TERMINAL_EVENTS.has(eventData.event)) {
    clearPendingImport(eventData.import_id);
  } else if (!heldTerminal || newerAttempt) {
    trackPendingImport(eventData.import_id);
  }
  updateImportRow(eventData.import_id, eventData);
  if (eventData.event === 'completed' || eventData.event === 'error') {
    // A live event carries the counts but neither what was only partly done (pages or a
    // description that could not be produced) nor whether an error was a definite failure
    // or an outcome that could not be confirmed. Read the durable record once so the panel
    // says the right thing now, not after a reload.
    reconcileImportState(eventData.import_id, { quiet: true });
  }
}

function bindImportReturnRead() {
  if (typeof window.addEventListener !== 'function') return;
  const returned = () => {
    if (window._quickClientItemId || window._guidedClientItemId) loadImports();
    const source = sourceMetadataByName[currentGuideSource];
    if (window.JournalOwnerFolders && source) reconcileGuidedFolder(source);
    const view = window.location.hash.slice(1);
    if (view.startsWith('progress/')) reconcileImportState(view.split('/')[1]);
    scheduleThinkingProgress();
  };
  window.addEventListener('pageshow', returned);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') returned(); else scheduleThinkingProgress(); });
}

function initImportWorkspace() {
  const listView = document.getElementById('importListView');
  if (window.solPathContext().segment) {
    if (listView) listView.style.display = 'none';
    return;
  }
  if (listView) listView.style.display = '';

  if (typeof connectionStateCleanup === 'function') {
    connectionStateCleanup();
    connectionStateCleanup = null;
  }
  if (typeof importEventsCleanup === 'function') {
    importEventsCleanup();
    importEventsCleanup = null;
  }
  if (window.appEvents && typeof window.appEvents.onConnectionState === 'function') {
    connectionStateCleanup = window.appEvents.onConnectionState(({ connected }) => {
      if (connected) {
        const hash = window.location.hash.slice(1);
        if (hash.startsWith('progress/')) {
          const importId = hash.split('/')[1];
          reconcileImportState(importId);
        }
      }
    });
  }

  importEventsCleanup = window.appEvents.listen('importer', {
    correlationKey: 'import_id',
    timeout: IMPORT_STALL_TIMEOUT_MS,
    onTimeout: markRowStalled,
  }, handleImporterEvent);

  if (typeof window.addEventListener === 'function') {
    const teardown = () => {
      if (typeof importEventsCleanup === 'function') {
        importEventsCleanup();
      }
      if (typeof connectionStateCleanup === 'function') {
        connectionStateCleanup();
      }
    };
    window.addEventListener('pagehide', teardown);
    window.addEventListener('unload', teardown);
  }

  // The progress panel renders from the import list, so the list has to be in
  // hand before the hash is acted on: a reload straight onto #progress/<id> was
  // rendering an empty "preparing…" panel for an import that had already
  // finished, and nothing re-rendered it. loadImports loads the source grid
  // first, so there is no separate call for it here.
  if (typeof bindImportReturnRead === 'function') bindImportReturnRead();
  loadImports()
    .catch(err => window.logError?.(err, { context: 'import: initial load failed' }))
    .finally(handleHashChange);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initImportWorkspace);
} else {
  initImportWorkspace();
}
</script>

        <select id="contentMonth" class="import-content-month" aria-label="filter by month">
          <option value="">all months</option>
        </select>
      </div>
      <div id="contentItems" class="import-content-items"></div>
      <div id="contentPagination" class="import-content-pagination"></div>
    </div>
  </div>

</div>

<script src="/app/import/static/source_connections.js"></script>
<script src="/app/import/static/import_detail.js"></script>
<script>
(function() {
const importDetailTimestamp = window.solPathContext().segment;
const importDetailPathSegment = importDetailTimestamp ? encodeURIComponent(importDetailTimestamp) : '';
if (!importDetailTimestamp) {
  return;
}
// Tab switching
const tabs = document.querySelectorAll('.tab');
const contents = document.querySelectorAll('.tab-content');
let contentLoaded = false;
let contentPage = 1;
let contentSearch = '';
let contentMonth = '';
let searchDebounce = null;

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    const target = tab.dataset.target;
    tabs.forEach(t => t.classList.toggle('active', t.dataset.target === target));
    contents.forEach(c => c.classList.toggle('active', c.id === target));
    if (target === 'content' && !contentLoaded) {
      loadContent(1);
    }
  });
  tab.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      tab.click();
    }
  });
});

function loadContent(page = 1) {
  const container = document.getElementById('contentContainer');
  const loading = document.getElementById('contentLoading');
  loading.textContent = 'loading content…';
  loading.style.display = 'block';

  const params = new URLSearchParams({page, per_page: 50});
  if (contentSearch) params.set('q', contentSearch);
  if (contentMonth) params.set('month', contentMonth);

  fetch(`/app/import/api/${importDetailPathSegment}/content?${params}`)
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        loading.textContent = data.error;
        return;
      }
      loading.style.display = 'none';
      container.style.display = 'block';
      contentPage = data.page;
      renderContentSummary(data);
      renderContentMonths(data.months);
      renderContentItems(data.items);
      renderContentPagination(data);
      contentLoaded = true;
    })
    .catch(err => {
      loading.textContent = 'error loading content';
      console.error('Content load error:', err);
    });
}

function renderContentSummary(data) {
  const el = document.getElementById('contentSummary');
  const iconSvg = data.source_icon_svg || '';
  const display = data.source_display || '';
  const iconHtml = iconSvg ? `<span class="import-content-summary-icon" aria-hidden="true">${iconSvg}</span>` : '';
  el.innerHTML = `${iconHtml}<strong>${escapeHtml(display)}</strong>, ${data.total} items`;
}

function renderContentMonths(months) {
  const select = document.getElementById('contentMonth');
  const current = select.value;
  select.innerHTML = '<option value="">all months</option>';
  for (const [month, count] of Object.entries(months)) {
    const label = month.slice(0, 4) + '-' + month.slice(4, 6);
    const opt = document.createElement('option');
    opt.value = month;
    opt.textContent = `${label} (${count})`;
    select.appendChild(opt);
  }
  select.value = current;
}

function renderContentItems(items) {
  const el = document.getElementById('contentItems');
  if (!items.length) {
    el.innerHTML = '<div class="no-data">no items found</div>';
    return;
  }
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  let currentMonth = '';
  let html = '';
  items.forEach(item => {
    const itemMonth = item.date ? item.date.slice(0, 6) : '';
    if (itemMonth && itemMonth !== currentMonth) {
      currentMonth = itemMonth;
      const year = itemMonth.slice(0, 4);
      const monthIdx = parseInt(itemMonth.slice(4, 6), 10) - 1;
      const monthLabel = monthNames[monthIdx] || '';
      const monthCount = items.filter(i => (i.date || '').startsWith(itemMonth)).length;
      html += `<div class="import-content-month-header">${monthLabel} ${year}, ${monthCount} items</div>`;
    }
    const typeLabel = {
      conversation: 'chat',
      event: 'event',
      highlight_group: 'highlights',
      note: 'note',
    }[item.type] || item.type;
    const date = item.date ? window.JournalFormat.day(item.date) : '';
    // Audio has no inline reader: each segment deep-links straight to that segment in
    // the transcripts app rather than expanding in place, so it gets no toggle/body.
    if (item.type === 'audio') {
      const segment = item.segments && item.segments[0];
      const day = segment?.day || '';
      const key = segment?.key || '';
      const stream = segment?.stream || '';
      if (day && key) {
        const segmentTime = window.JournalFormat.segmentTime(key);
        html += `
          <a class="import-content-item import-content-item-link" href="/app/transcripts/${encodeURIComponent(day)}?stream=${encodeURIComponent(stream)}#${encodeURIComponent(key)}">
            <div class="import-content-item-header">
              <span class="import-content-item-type">${typeLabel}</span>
              <span class="import-content-item-title">${escapeContentHtml(item.title)}</span>
              <span class="import-content-item-date">${date}${segmentTime ? ` · ${escapeContentHtml(segmentTime)}` : ''}</span>
              <span class="import-content-item-arrow" aria-hidden="true">→</span>
            </div>
          </a>`;
        return;
      }
    }
    html += `
      <div class="import-content-item" data-item-id="${item.id}" tabindex="0" role="button" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleContentItem(this)}">
        <div class="import-content-item-header" onclick="toggleContentItem(this.parentElement)">
          <span class="import-content-item-type">${typeLabel}</span>
          <span class="import-content-item-title">${escapeContentHtml(item.title)}</span>
          <span class="import-content-item-date">${date}</span>
        </div>
        <div class="import-content-item-meta">
          ${item.meta?.message_count ? `${item.meta.message_count} messages` : ''}
          ${item.meta?.highlight_count ? `${item.meta.highlight_count} highlights` : ''}
          ${item.meta?.time_range ? `${escapeContentHtml(item.meta.time_range)}` : (item.meta?.duration_minutes ? `${item.meta.duration_minutes} min` : '')}
          ${item.meta?.attendee_names?.length ? ` · ${item.meta.attendee_names.map(n => escapeContentHtml(n)).join(', ')}` : (item.meta?.attendee_count ? ` · ${item.meta.attendee_count} attendees` : '')}
          ${item.meta?.location ? ` · ${escapeContentHtml(item.meta.location)}` : ''}
          ${item.meta?.author ? `· ${escapeContentHtml(item.meta.author)}` : ''}
          ${item.meta?.tags?.length ? `· ${item.meta.tags.map(t => escapeContentHtml(t)).join(', ')}` : ''}
        </div>
        ${item.preview ? `<div class="import-content-item-preview">${escapeContentHtml(stripMarkdown(item.preview))}</div>` : ''}
        <div class="import-content-item-body"><div class="no-data">loading…</div></div>
      </div>`;
  });
  el.innerHTML = html;
}

function toggleContentItem(el) {
  const wasExpanded = el.classList.contains('expanded');
  document.querySelectorAll('.import-content-item.expanded').forEach(item => {
    item.classList.remove('expanded');
  });
  if (wasExpanded) return;

  el.classList.add('expanded');
  const body = el.querySelector('.import-content-item-body');
  const itemId = el.dataset.itemId;

  fetch(`/app/import/api/${importDetailPathSegment}/content/${encodeURIComponent(itemId)}`)
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        body.innerHTML = `<div class="no-data">${escapeContentHtml(data.error)}</div>`;
        return;
      }
      body.innerHTML = renderContentDetail(data);
    })
    .catch(() => {
      body.innerHTML = '<div class="no-data">Error loading content</div>';
    });
}

function renderContentDetail(data) {
  if (!data.content || !data.content.length) {
    return '<div class="no-data">No content available</div>';
  }

  return data.content.map(part => {
    if (part.type === 'markdown') {
      return `<div class="import-content-markdown">${window.AppServices.renderMarkdown(part.content)}</div>`;
    }
    const speaker = part.speaker || 'Unknown';
    const cls = speaker === 'You' || speaker === 'Human' ? 'human'
      : speaker === 'Assistant' ? 'assistant' : '';
    return `<div class="import-content-message"><span class="import-content-speaker ${cls}">${escapeContentHtml(speaker)}:</span> ${escapeContentHtml(part.text || '')}</div>`;
  }).join('');
}

function renderContentPagination(data) {
  const el = document.getElementById('contentPagination');
  if (data.pages <= 1) {
    el.innerHTML = '';
    return;
  }
  let html = '';
  html += `<button ${data.page <= 1 ? 'disabled' : ''} onclick="loadContent(${data.page - 1})">prev</button>`;
  const start = Math.max(1, data.page - 2);
  const end = Math.min(data.pages, data.page + 2);
  for (let i = start; i <= end; i++) {
    html += `<button class="${i === data.page ? 'active' : ''}" onclick="loadContent(${i})">${i}</button>`;
  }
  html += `<button ${data.page >= data.pages ? 'disabled' : ''} onclick="loadContent(${data.page + 1})">next</button>`;
  el.innerHTML = html;
}

function escapeContentHtml(str) {
  if (!str) return '';
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function stripMarkdown(str) {
  if (!str) return '';
  return str
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/\*([^*]+)\*/g, '$1')
    .replace(/^[-*+]\s+/gm, '')
    .replace(/^\d+\.\s+/gm, '')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/^>\s+/gm, '')
    .trim();
}

document.getElementById('contentSearch').addEventListener('input', function() {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    contentSearch = this.value.trim();
    loadContent(1);
  }, 300);
});

document.getElementById('contentMonth').addEventListener('change', function() {
  contentMonth = this.value;
  loadContent(1);
});

// Load import details
let importDetailRequest = 0;
function loadImportDetail(keepSavedStart = false) {
  const request = ++importDetailRequest;
  return window.apiJson(`/app/import/api/${importDetailPathSegment}`)
    .then(data => {
      if (request !== importDetailRequest) return;
      const overview = document.getElementById('overviewContent');
      const restoreFocus = Boolean(overview.querySelector('[data-saved-start-slot]')?.contains(document.activeElement));
      document.getElementById('importMeta').innerHTML = window.ImportDetail.renderMeta(data);
      overview.innerHTML = window.ImportDetail.renderDetail(data);
      window.ImportDetail.mountSavedStart(overview, data, () => loadImportDetail(true), restoreFocus);
      if (restoreFocus && !overview.querySelector('[data-saved-start-slot]')) {
        const heading = document.getElementById('importDetailHeading');
        heading?.setAttribute('tabindex', '-1');
        heading?.focus();
      }
      const detailView = document.getElementById('importDetailView');
      const firstWallTime = detailView?.querySelector('[data-wall-time]');
      if (firstWallTime && window.JournalClock?.placeNote) {
        window.JournalClock.placeNote(firstWallTime, { inside: false });
      }
    })
    .catch(err => {
      if (request !== importDetailRequest) return;
      const serverMessage = window.SurfaceState.serverMessageFrom(err);
      const escapedMessage = window.AppServices.escapeHtml(serverMessage);
      document.getElementById('importMeta').innerHTML = `<div class="surface-state-refresh-error">couldn&#39;t load import details.${escapedMessage ? ` ${escapedMessage}` : ''}</div>`;
      const overview = document.getElementById('overviewContent');
      if (!overview.querySelector('[data-saved-start-slot]')) {
        overview.innerHTML = '<div class="no-data">overview unavailable</div>';
      }
      if (keepSavedStart) throw err;
    });
}

function initImportDetail() {
  const listView = document.getElementById('importListView');
  if (listView) listView.style.display = 'none';

  const detailView = document.getElementById('importDetailView');
  if (detailView) detailView.style.display = '';

  const heading = document.getElementById('importDetailHeading');
  if (heading) heading.textContent = `import: ${window.JournalFormat.day(importDetailTimestamp.slice(0, 8))} · ${window.JournalFormat.segmentTime(importDetailTimestamp.slice(9))}`;

  loadImportDetail();

  const detailEventsCleanup = window.appEvents.listen('importer', { correlationKey: 'import_id' }, eventData => {
    if (!IMPORT_ROW_EVENTS.has(eventData.event)) return;
    if (eventData.import_id !== importDetailTimestamp) return;
    loadImportDetail();
  });

  function openContentFromHash() {
    if (window.location.hash !== '#content' || !detailView?.isConnected) return;
    tabs.forEach(t => t.classList.toggle('active', t.dataset.target === 'content'));
    contents.forEach(c => c.classList.toggle('active', c.id === 'content'));
    if (!contentLoaded) loadContent(1);
  }
  window.addEventListener('hashchange', openContentFromHash);
  openContentFromHash();

  if (typeof window.addEventListener === 'function') {
    const detailTeardown = () => {
      if (typeof detailEventsCleanup === 'function') {
        detailEventsCleanup();
      }
      if (typeof window.removeEventListener === 'function') {
        window.removeEventListener('hashchange', openContentFromHash);
      }
    };
    window.addEventListener('pagehide', detailTeardown);
    window.addEventListener('unload', detailTeardown);
  }
}

window.loadContent = loadContent;
window.toggleContentItem = toggleContentItem;

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initImportDetail);
} else {
  initImportDetail();
}
})();
</script>
