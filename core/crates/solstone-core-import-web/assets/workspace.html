<script>
// Keep diagnostic detail out of the message shown to the owner.
function importErrorMessage(data, fallback) {
  if (data?.reason_code === 'invalid_operation_for_state') {
    switch (data.detail) {
      case 'content already imported':
      case 'content already imported; will not start':
        return "you've already imported this file.";
      case 'import already started or processed':
        return 'this import has already started. check its progress in your imports.';
      default:
        return 'this import has changed. refresh the page and try again.';
    }
  }
  return data?.error || fallback;
}

const escapeHtml = (value) => window.AppServices.escapeHtml(value);

let connectionStateCleanup = null;

function malformedImportHistoryResponse(url) {
  return new window.ApiError({
    status: 200,
    statusText: 'OK',
    serverMessage: 'Malformed import history response',
    url,
    cause: 'parse',
  });
}

function clearImportListErrors() {
  const container = document.getElementById('importListContent');
  const loadMoreError = document.getElementById('importLoadMoreError');
  if (loadMoreError) {
    loadMoreError.remove();
  }
  if (!container) {
    return;
  }
  const siblingError = container.nextElementSibling;
  if (siblingError && siblingError.classList.contains('surface-state-refresh-error')) {
    siblingError.remove();
  }
}

function trackPendingImport(importId) {
  if (!importId || !importEventsCleanup?.pending) {
    return;
  }
  importEventsCleanup.pending.track(importId);
}

function clearPendingImport(importId) {
  if (!importId || !importEventsCleanup?.pending) {
    return;
  }
  importEventsCleanup.pending.clear(importId);
}

let navigatingHash = false;

async function navigateTo(view, options = {}) {
  const { updateHash = true } = options;
  const grid = document.getElementById('importGrid');
  const guide = document.getElementById('importGuide');
  const connections = document.getElementById('importSyncSources');
  const cleanView = view ? String(view).replace(/^#/, '') : '';
  if (connections) connections.hidden = (!!cleanView && cleanView !== 'grid') || !window.JournalOwnerFolders;
  const nextHash = cleanView === 'grid' || !cleanView ? '' : `#${cleanView}`;
  if (!cleanView.startsWith('guide/') && window.JournalOwnerFolders) window.JournalOwnerFolders.cancel();
  // Where the owner was when this navigation started. The hash is written after
  // the awaits below, and in that window the owner can navigate somewhere else.
  const hashAtEntry = window.location.hash;

  if (grid) {
    grid.style.display = cleanView === 'grid' || !cleanView ? '' : 'none';
  }
  if (guide) {
    guide.style.display = cleanView === 'grid' || !cleanView ? 'none' : '';
  }

  if (cleanView.startsWith('guide/')) {
    const source = cleanView.split('/')[1];
    await loadGuidedFlow(source);
  } else if (cleanView.startsWith('progress/')) {
    const importId = cleanView.split('/')[1];
    showProgressView(importId);
    if (typeof reconcileImportState === 'function') {
      const resolvedId = await reconcileImportState(importId);
      if (typeof resolvedId === 'string' && resolvedId !== importId) {
        if (window.location.hash !== hashAtEntry) return;
        return navigateTo(`progress/${resolvedId}`, options);
      }
      scheduleThinkingProgress();
    }
  } else {
    currentGuideSource = null;
  }

  // The owner's own navigation is newer than ours and wins. Everything above
  // this point can await, and an owner who clicks "import another source" while
  // a status read is in flight ends up on the grid -- writing our hash now would
  // drag them back to the view they just left.
  if (window.location.hash !== hashAtEntry) {
    return;
  }

  // hashchange is delivered as a queued task, so a flag raised and dropped
  // around the assignment is already down by the time the handler reads it:
  // every programmatic navigation re-entered navigateTo and redid the work it
  // had just finished -- a second GET for a progress view, and a second
  // loadGuidedFlow that rewrote guideSteps under the focus repeatSource had
  // just placed. The handler consumes the flag instead.
  //
  // The browser normalises what it stores -- a space, a quote, angle brackets,
  // a backtick or anything non-ASCII comes back percent-encoded -- so a hash
  // that looks different from nextHash can still be the same fragment. The
  // timestamp the quick flow puts in progress/<ts> is free text, so this is
  // reachable. Reading the hash back after the assignment is the only way to
  // know whether anything changed: if it did not, no event is coming and the
  // flag has to come down, or it swallows the owner's next navigation.
  if (updateHash && window.location.hash !== nextHash) {
    const before = window.location.hash;
    navigatingHash = true;
    window.location.hash = nextHash;
    if (window.location.hash === before) {
      navigatingHash = false;
    }
  }
}

function showGrid() {
  if (window.JournalOwnerFolders) window.JournalOwnerFolders.cancel();
  currentGuideSource = null;
  currentGuidedFile = null;
  currentGuidedSaved = null;
  invalidateImportPreview('guided');
  window._guidedClientItemId = null;
  navigateTo('grid');
}

window.addEventListener('hashchange', handleHashChange);

function handleHashChange() {
  if (navigatingHash) {
    navigatingHash = false;
    return;
  }
  const hash = (window.location.hash || '').replace(/^#/, '');
  if (hash.startsWith('guide/')) {
    navigateTo(hash, { updateHash: false });
  } else if (hash.startsWith('progress/')) {
    navigateTo(hash, { updateHash: false });
  } else {
    navigateTo('grid', { updateHash: false });
  }
}

async function loadSourceGrid() {
  if (!cachedSources.length) {
    const res = await fetch('/app/import/api/sources');
    const payload = await res.json();
    cachedSources = payload.items || [];
    sourceMetadataByName = Object.fromEntries(cachedSources.map(source => [source.name, source]));
    sourceIconSvgByName = Object.fromEntries(cachedSources.map(source => [source.name, source.icon_svg || '']));
  }

  const grid = document.getElementById('importGrid');
  if (!grid) {
    return;
  }

  // The card carries the source name in a data attribute and the delegated
  // listener reads it, the same way the repeat button does. An inline onclick
  // builds a line of JavaScript out of a server string, and an attribute escape
  // is the only thing standing between that string and the script context.
  grid.innerHTML = cachedSources.map(source => {
    const cardAttr = source.name === 'quick'
      ? 'data-import-quick="true"'
      : `data-import-source="${escapeHtml(source.name)}"`;
    return `
      <button type="button" class="import-source-card" ${cardAttr}>
        <div class="import-source-card-icon" aria-label="${escapeHtml(source.display_name)}">${source.icon_svg || ''}</div>
        <div class="import-source-card-name">${escapeHtml(source.display_name)}</div>
        <div class="import-source-card-desc">${escapeHtml(source.description || '')}</div>
      </button>
    `;
  }).join('');
}

function showQuickImport() {
  navigateTo('guide/quick');
}

let previousDetectFocus = null;
let detectFocusTrapHandler = null;

function isTerminalDuplicate(data) {
  return data?.status === 'duplicate' || data?.recommended_action === 'do_not_start';
}

function duplicateNoticeText(duplicate = {}, inProgress = false) {
  const state = duplicate.state || 'imported';
  const importId = duplicate.import_id || '';
  if (inProgress) {
    return `this import is already in progress${importId ? ` as ${importId}` : ''}.`;
  }
  if (state === 'staged') {
    return `this file was already staged${importId ? ` as ${importId}` : ''}.`;
  }
  const importedAt = duplicate.imported_at || 'an earlier import';
  const entries = duplicate.entry_count ? ` (${duplicate.entry_count} entries)` : '';
  return `this file was already imported on ${importedAt}${entries}.`;
}

function showDetect(res) {
  invalidateImportPreview('quick');
  window._quickSaved = res;
  document.getElementById('timestampInput').value = res.source_timestamp || res.timestamp || '';
  document.getElementById('savedPath').value = res.path;
  const duplicateNotice = document.getElementById('detectDuplicateNotice');
  if (duplicateNotice) {
    duplicateNotice.textContent = ['upload_fallback', 'path_fallback'].includes(res.diagnostics?.timestamp_detection_method)
      ? 'no creation date was found in this file. choose its date, or keep the upload date.'
      : res.diagnostics?.timestamp_detection_method === 'document_dates' ? 'this PDF uses its own dates. you can choose a date for this file.' : '';
  }
  startBtn.style.display = '';
  startBtn.disabled = false;
  if (isTerminalDuplicate(res)) {
    if (duplicateNotice) {
      duplicateNotice.innerHTML = `
        <div class="import-dedup-notice">
          <span class="dedup-text">${escapeHtml(duplicateNoticeText(res.duplicate, Boolean(res.in_progress)))}</span>
        </div>
      `;
    }
    startBtn.disabled = true;
    startBtn.style.display = 'none';
  }
  settingInput.value = res.setting || '';
  previousDetectFocus = document.activeElement;
  document.getElementById('detectModal').style.display = 'block';
  document.getElementById('timestampInput').focus();
  detectFocusTrapHandler = function(e) {
    if (e.key !== 'Tab') return;
    const modal = document.getElementById('detectModal');
    const focusable = Array.from(
      modal.querySelectorAll('button, [href], input, select, textarea, [tabindex="0"]')
    ).filter(el => el.offsetParent !== null && el.tabIndex >= 0 && !el.disabled);
    if (focusable.length === 0) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  };
  document.addEventListener('keydown', detectFocusTrapHandler);
}

function closeDetectModal() {
  document.getElementById('detectModal').style.display = 'none';
  if (detectFocusTrapHandler) {
    document.removeEventListener('keydown', detectFocusTrapHandler);
    detectFocusTrapHandler = null;
  }
  if (previousDetectFocus && previousDetectFocus.isConnected) {
    previousDetectFocus.focus();
  }
  previousDetectFocus = null;
}

function formatElapsed(ms) {
  if (!ms) return '0s';
  const totalSeconds = Math.floor(ms / 1000);
  const hours = Math.floor(totalSeconds / 3600);
  const mins = Math.floor((totalSeconds % 3600) / 60);
  const secs = totalSeconds % 60;
  if (hours > 0) {
    return `${hours}h ${mins}m`;
  }
  if (mins > 0) {
    return `${mins}m ${secs}s`;
  }
  return `${secs}s`;
}

// One stage, or no stage time: the total alone, never the same time twice.
function statusElapsedDetail(eventData) {
  const totalTime = formatElapsed(eventData.elapsed_ms);
  return eventData.stage_elapsed_ms && eventData.stage_elapsed_ms !== eventData.elapsed_ms
    ? `${formatElapsed(eventData.stage_elapsed_ms)} (${totalTime} total)`
    : `${totalTime} elapsed`;
}

function capitalizeStage(stage) {
  if (!stage) return '';
  return stage.charAt(0).toUpperCase() + stage.slice(1);
}

function humanStageName(stage, sourceDisplay = '') {
  const fallback = STAGE_NAMES[stage] || `${capitalizeStage(stage)}…`;
  if ((stage === 'importing' || stage === 'execution') && sourceDisplay) {
    return `reading ${sourceDisplay}…`;
  }
  return fallback;
}



function formatDateRange(dateRange) {
  if (!Array.isArray(dateRange) || !dateRange[0]) {
    return '';
  }
  if (!dateRange[1] || dateRange[0] === dateRange[1]) {
    return dateRange[0];
  }
  return `${dateRange[0]} - ${dateRange[1]}`;
}

function formatImportStats(entriesWritten, entitiesSeeded) {
  const parts = [];
  if (typeof entriesWritten === 'number') {
    parts.push(`${entriesWritten} ${entriesWritten === 1 ? 'entry' : 'entries'}`);
  }
  if (typeof entitiesSeeded === 'number') {
    parts.push(`${entitiesSeeded} entities`);
  }
  return parts.join(' • ') || '—';
}

function formatProgressStats(eventData) {
  const stats = [];
  if (eventData.items_total) {
    stats.push(`${eventData.items_processed || 0}/${eventData.items_total} items`);
  }
  if (eventData.earliest_date) {
    stats.push(`from ${eventData.earliest_date}`);
  }
  if (eventData.latest_date && eventData.latest_date !== eventData.earliest_date) {
    stats.push(`to ${eventData.latest_date}`);
  }
  if (eventData.entities_found) {
    stats.push(`${eventData.entities_found} entities found`);
  }
  return stats;
}

function renderProgressStats(eventData) {
  if (eventData.source_type === 'audio_archive') {
    const count = value => Number.isSafeInteger(value) && value >= 0 ? String(value) : '—';
    const stats = [`${count(eventData.saved_parts)} audio ${eventData.saved_parts === 1 ? 'part' : 'parts'} saved`, `${count(eventData.processed_parts)} processed`,
      `${count(eventData.processing)} waiting for processing`, `${count(eventData.remaining)} still to save`, `${count(eventData.left_out)} left out`];
    return `<div class="import-progress-stats">${stats.map(stat => `<div class="import-progress-stat">${escapeHtml(stat)}</div>`).join('')}</div>`;
  }
  const stats = formatProgressStats(eventData);
  if (!stats.length) {
    return '';
  }
  return `<div class="import-progress-stats">${stats.map(stat => `<div class="import-progress-stat">${escapeHtml(stat)}</div>`).join('')}</div>`;
}

// An unknown reads as an em dash everywhere the history table renders one, the
// way the stats column already does. A measured zero is a number and stays 0.
function renderSourceDisplay(sourceType, sourceDisplay, fallbackText = '—') {
  const iconSvg = sourceIconSvgByName[sourceType] || '';
  const displayText = sourceDisplay || fallbackText || '—';
  return `<div class="import-source-inline">${iconSvg ? `<span class="import-source-inline-icon" aria-hidden="true">${iconSvg}</span>` : ''}<span>${escapeHtml(displayText)}</span></div>`;
}

function getImportById(importId) {
  return importsCache.find(item => item.timestamp === importId) || null;
}

// Sources describe the whole history, independently of this page or filter.
function sourceFilterOptionsHtml() {
  const labels = new Map(importSourceOptions.map(name => [name,
    sourceLabel({ source_type: name, source_display: name }) || name]));
  return [
    '<option value="">all sources</option>',
    ...[...labels].sort((a, b) => a[1].localeCompare(b[1])).map(([name, label]) => {
      const selected = currentSourceFilter === name ? ' selected' : '';
      return `<option value="${escapeHtml(name)}"${selected}>${escapeHtml(label)}</option>`;
    }),
  ].join('');
}

function buildHistoryHeader(total, totalEntriesWritten) {
  const sourceOptions = sourceFilterOptionsHtml();

  const importsLabel = total === 1 ? 'import' : 'imports';
  const entriesPart = (totalEntriesWritten === null || totalEntriesWritten === undefined)
    ? '—'
    : `${totalEntriesWritten.toLocaleString()} ${totalEntriesWritten === 1 ? 'entry' : 'entries'}`;
  const summaryText = `${total.toLocaleString()} ${importsLabel}, ${entriesPart}.`;

  return `
    <div class="import-history-header">
      <div class="import-history-summary">${escapeHtml(summaryText)}</div>
      <div class="import-history-filters">
        <label for="importSourceFilter">source</label>
        <select id="importSourceFilter">
          ${sourceOptions}
        </select>
      </div>
    </div>
  `;
}

function sourceLabel(imp) {
  if (imp.source_type === 'audio_archive') return 'audio archive';
  const knownSourceName = sourceMetadataByName[imp.source_type]?.display_name || '';
  const recordedDisplay = typeof imp.source_display === 'string' ? imp.source_display.trim() : '';
  const recordedIsFilename = /\.[a-z0-9]{2,5}$/i.test(recordedDisplay);
  return knownSourceName || (recordedIsFilename ? '' : recordedDisplay);
}

function renderImportRow(imp) {
  const importedAtMs = (imp.imported_at || imp.created_at) * 1000;
  const importedAt = window.JournalFormat.timestamp(importedAtMs);
  const targetDayDisplay = imp.target_day ? window.JournalFormat.day(imp.target_day) : '—';

  let statusClass;
  let statusText;
  let statusDetail = '';
  if (imp.status === 'success') {
    statusClass = 'success';
    statusText = 'completed';
  } else if (imp.status === 'failed') {
    statusClass = 'failed';
    statusText = 'failed';
    if (imp.error) {
      const errorStage = imp.error_stage ? ` (${capitalizeStage(imp.error_stage)})` : '';
      statusDetail = `<div class="progress-detail">${escapeHtml(imp.error)}${escapeHtml(errorStage)}</div>`;
    }
  } else if (imp.status === 'unconfirmed') {
    statusClass = 'unconfirmed';
    statusText = 'unconfirmed';
  } else if (imp.status === 'unavailable') {
    statusClass = 'unavailable';
    statusText = 'status unavailable';
  } else if (imp.status === 'running') {
    statusClass = 'running';
    statusText = 'running';
  } else {
    statusClass = 'pending';
    statusText = 'pending';
  }

  if (imp.has_gaps) {
    statusDetail += `<div class="progress-gap-chip" style="margin-top:2px; font-size:0.8em; color:var(--warn-ink);">contains gaps</div>`;
  }

  // The file column holds a file and nothing else, and the source column holds a
  // source (G3-113, G3-308). Older imports recorded the uploaded file's name in
  // source_display, so the source column repeated a filename while the file
  // column was a dash on every row. A recorded display that ends in a file
  // extension is that file and belongs in the file cell; a recorded display that
  // names a source the app does not carry metadata for is still a source.
  const recordedDisplay = typeof imp.source_display === 'string' ? imp.source_display.trim() : '';
  const recordedIsFilename = /\.[a-z0-9]{2,5}$/i.test(recordedDisplay);
  const sourceDisplayText = sourceLabel(imp);
  const fileDisplay = imp.original_filename || (recordedIsFilename ? recordedDisplay : '') || '—';
  const sourceCell = sourceDisplayText
    ? renderSourceDisplay(imp.source_type || '', sourceDisplayText, sourceDisplayText)
    : '—';
  let statsText = formatImportStats(imp.entries_written, imp.entities_seeded);
  const isArchive = imp.source_type === 'audio_archive' || imp.saved !== undefined;
  if (isArchive) {
    const saved = imp.saved ?? 0;
    const remaining = imp.remaining ?? 0;
    const processing = imp.processing ?? 0;
    const leftOut = imp.left_out ?? 0;
    statsText = `${saved} parts saved · ${remaining} left to save · ${processing} waiting to process · ${imp.processed_parts ?? 0} processed · ${leftOut} members left out`;
    if (imp.rejected_parts) statsText += ` · ${imp.rejected_parts} parts rejected`;
    if (imp.unavailable_parts) statsText += ` · ${imp.unavailable_parts} unavailable`;
  }
  const encodedId = encodeURIComponent(imp.timestamp);

  let html = `<tr data-import-id="${escapeHtml(imp.timestamp)}" data-source-type="${escapeHtml(imp.source_type || '')}"`;
  if (isArchive) {
    html += ` data-saved="${imp.saved ?? 0}" data-remaining="${imp.remaining ?? 0}" data-left-out="${imp.left_out ?? 0}" data-processing="${imp.processing ?? 0}" data-unavailable="${imp.unavailable_parts ?? 0}"`;
  }
  html += ` tabindex="0" role="link" data-import-link="/app/import/${encodedId}">`;
  // 'imported to' leads: it is the column that varies, and it is the fact the
  // owner came for. 'imported at' is constant across a bulk import, so it sits
  // last rather than first (G3-209).
  html += '<td class="nowrap">';
  if (imp.target_day) {
    html += `<a href="/app/transcripts/${encodeURIComponent(imp.target_day)}" class="timestamp-link">${escapeHtml(targetDayDisplay)}</a>`;
  } else {
    html += '—';
  }
  html += '</td>';
  html += `<td>${escapeHtml(fileDisplay)}</td>`;
  html += `<td class="source-cell">${sourceCell}</td>`;
  html += `<td class="status-cell"><span class="import-status ${statusClass}">${statusText}</span>${statusDetail}</td>`;
  html += `<td class="stats-cell import-stats-cell">${statsText}</td>`;
  html += `<td class="nowrap">${importedAt}</td>`;
  html += '</tr>';
  return html;
}

function scrollToGrid() {
  const grid = document.getElementById('importGrid');
  if (grid) {
    grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
    const firstCard = grid.querySelector('.import-source-card');
    if (firstCard) firstCard.focus();
  }
}

async function loadImports() {
  const generation = ++historyRequestGeneration;
  historyLoading = true;
  currentPage = 1;
  loadingMoreGeneration = null;
  const url = `/app/import/api/list?page=1&per_page=${IMPORT_PAGE_SIZE}&source=${encodeURIComponent(currentSourceFilter)}`;
  await loadSourceGrid();
  if (generation !== historyRequestGeneration) return;
  try {
    const data = await window.apiJson(url);
    if (generation !== historyRequestGeneration) return;
    if (!Array.isArray(data.imports) || !Array.isArray(data.source_options) || typeof data.total !== 'number' || typeof data.page !== 'number' || typeof data.pages !== 'number') {
      throw malformedImportHistoryResponse(url);
    }
    const imports = data.imports;
    importsCache = imports;
    importSourceOptions = data.source_options;
    pruneImportGenerationFloor();
    totalImports = data.total;
    const container = document.getElementById('importListContent');
    clearImportListErrors();

    if (imports.length === 0 && !currentSourceFilter) {
      container.innerHTML = window.SurfaceState.empty({
        icon: window.ConveyIcons.svg('inbox'),
        heading: 'no imports yet',
        desc: 'import from any source above.',
        action: '<a href="#" onclick="scrollToGrid(); return false;" style="color: var(--orange-text-aa); font-weight: 600;">choose a source →</a>'
      });
      return;
    }

    let html = buildHistoryHeader(data.total, data.total_entries_written);
    html += '<table class="import-table">';
    html += '<thead><tr>';
    html += '<th>imported to</th>';
    html += '<th>file</th>';
    html += '<th>source</th>';
    html += '<th>status</th>';
    html += '<th>entries</th>';
    html += '<th>imported at</th>';
    html += '</tr></thead><tbody>';

    imports.forEach(imp => {
      html += renderImportRow(imp);
    });

    html += '</tbody></table>';
    if (!imports.length) html += window.SurfaceState.empty({
      icon: window.ConveyIcons.svg('search'), heading: 'no imports match this filter'
    });
    if (data.page < data.pages) {
      html += `
        <div id="importLoadMore" style="text-align: center; margin: 1.5rem 0;">
          <button class="import-primary-btn" onclick="loadMoreImports()">
            load more (${importsCache.length} of ${data.total} shown)
          </button>
        </div>
      `;
    }
    const restoreFilterFocus = document.activeElement?.id === 'importSourceFilter';
    container.innerHTML = html;

    const sourceFilter = document.getElementById('importSourceFilter');
    if (sourceFilter) {
      if (restoreFilterFocus) sourceFilter.focus();
      sourceFilter.onchange = event => {
        currentSourceFilter = event.target.value;
        loadImports();
      };
    }

    imports.forEach(imp => {
      if (imp.status === 'running' || imp.status === 'pending') {
        trackPendingImport(imp.timestamp);
      } else {
        clearPendingImport(imp.timestamp);
      }
    });
  } catch (err) {
    if (generation !== historyRequestGeneration) return;
    window.SurfaceState.replaceLoading('importListContent', window.SurfaceState.error({
      heading: 'couldn\'t load your import history',
      desc: window.CONVEY_COPY.RELOAD_HINT,
      serverMessage: window.SurfaceState.serverMessageFrom(err),
      detail: err,
    }));
  } finally {
    if (generation === historyRequestGeneration) historyLoading = false;
  }
}

function renderLoadMoreError(err) {
  const table = document.querySelector('.import-table');
  if (!table || !table.parentNode) {
    return;
  }

  let errorEl = document.getElementById('importLoadMoreError');
  if (!errorEl) {
    errorEl = document.createElement('div');
    errorEl.id = 'importLoadMoreError';
    errorEl.className = 'surface-state-refresh-error';
  }

  const serverMessage = window.SurfaceState.serverMessageFrom(err);
  errorEl.innerHTML = `<strong>couldn&#39;t load more imports.</strong> ${window.CONVEY_COPY.RELOAD_HINT}${serverMessage ? ` ${escapeHtml(serverMessage)}` : ''}`;

  const loadMoreContainer = document.getElementById('importLoadMore');
  if (loadMoreContainer) {
    table.parentNode.insertBefore(errorEl, loadMoreContainer);
  } else {
    table.parentNode.appendChild(errorEl);
  }
}

async function loadMoreImports() {
  const generation = historyRequestGeneration;
  if (historyLoading || loadingMoreGeneration === generation) return;
  loadingMoreGeneration = generation;
  const nextPage = currentPage + 1;
  const url = `/app/import/api/list?page=${nextPage}&per_page=${IMPORT_PAGE_SIZE}&source=${encodeURIComponent(currentSourceFilter)}`;
  try {
    const data = await window.apiJson(url);
    if (generation !== historyRequestGeneration) return;
    if (!Array.isArray(data.imports) || !Array.isArray(data.source_options) || typeof data.total !== 'number' || typeof data.page !== 'number' || typeof data.pages !== 'number') {
      throw malformedImportHistoryResponse(url);
    }

    currentPage = data.page;
    importSourceOptions = data.source_options;
    importsCache = importsCache.concat(data.imports);
    const sourceFilter = document.getElementById('importSourceFilter');
    if (sourceFilter) sourceFilter.innerHTML = sourceFilterOptionsHtml();
    const existingError = document.getElementById('importLoadMoreError');
    if (existingError) {
      existingError.remove();
    }

    const tbody = document.querySelector('.import-table tbody');
    if (tbody) {
      let rowsHtml = '';
      data.imports.forEach(imp => {
        rowsHtml += renderImportRow(imp);
      });
      tbody.insertAdjacentHTML('beforeend', rowsHtml);
    }

    const loadMoreContainer = document.getElementById('importLoadMore');
    if (loadMoreContainer) {
      if (data.page < data.pages) {
        loadMoreContainer.innerHTML = `
          <button class="import-primary-btn" onclick="loadMoreImports()">
            load more (${importsCache.length} of ${data.total} shown)
          </button>`;
      } else {
        loadMoreContainer.remove();
      }
    }

    data.imports.forEach(imp => {
      if (imp.status === 'running' || imp.status === 'pending') {
        trackPendingImport(imp.timestamp);
      } else {
        clearPendingImport(imp.timestamp);
      }
    });
  } catch (err) {
    if (generation === historyRequestGeneration) renderLoadMoreError(err);
  } finally {
    if (loadingMoreGeneration === generation) loadingMoreGeneration = null;
  }
}

function markRowStalled(importId) {
  if (!importId) {
    return;
  }

  clearPendingImport(importId);
  importEvents[importId] = { ...(importEvents[importId] || {}), stalled: true };

  const safeId = typeof CSS !== 'undefined' && typeof CSS.escape === 'function' ? CSS.escape(importId) : importId;
  const row = document.querySelector(`tr[data-import-id="${safeId}"]`);
  if (row) {
    row.classList.add('import-row--stalled');
    const statusCell = row.querySelector('.status-cell');
    if (statusCell) {
      statusCell.innerHTML = `<span class="import-status stalled">stalled</span><button type="button" class="import-retry-btn" data-import-check-status="${escapeHtml(importId)}">check status</button><div class="progress-detail import-stalled-meta">stalled: no updates in 10 minutes. import id: ${escapeHtml(importId)}. ${window.CONVEY_COPY.RELOAD_HINT}</div><div class="import-retry-result"></div>`;
    }
  }

  refreshInlineProgress(importId);
  reconcileImportState(importId, { fromStall: true });
}

// The floor is module state that nothing ever pruned: a tab left open through a
// few hundred imports kept a generation for every id it had ever seen. An id is
// dropped once the history list no longer carries it and nothing in flight
// refers to it.
//
// Pinned, and never dropped: the import the open progress view is showing --
// that is the entry repeatSource depends on when it walks away from that view
// and a delayed event for the old run lands afterwards -- and any import still
// running, which is the only kind a stale event can still arrive for. An import
// that has already finished is guarded by its own terminal state, so its floor
// goes when it scrolls out of the history list.
function pruneImportGenerationFloor() {
  const tracked = Object.keys(importGenerationFloor);
  if (!tracked.length) {
    return;
  }
  const pinned = new Set();
  const hash = (window.location.hash || '').replace(/^#/, '');
  if (hash.startsWith('progress/')) {
    pinned.add(hash.split('/')[1]);
  }
  Object.keys(importEvents).forEach(id => {
    const event = importEvents[id];
    if (event && !isTerminalState(event.event || event.status)) {
      pinned.add(id);
    }
  });
  const listed = new Set(importsCache.map(item => item.timestamp));
  tracked.forEach(id => {
    if (!pinned.has(id) && !listed.has(id)) {
      delete importGenerationFloor[id];
    }
  });
  const remaining = Object.keys(importGenerationFloor);
  if (remaining.length <= IMPORT_GENERATION_FLOOR_CAP) {
    return;
  }
  // Still over the cap after the list pass: the oldest unpinned ids go first.
  // Import ids are timestamps, so they sort oldest to newest as strings.
  const droppable = remaining.filter(id => !pinned.has(id)).sort();
  let excess = remaining.length - IMPORT_GENERATION_FLOOR_CAP;
  for (let index = 0; index < droppable.length && excess > 0; index += 1, excess -= 1) {
    delete importGenerationFloor[droppable[index]];
  }
}

function isTerminalState(eventOrStatus) {
  return eventOrStatus === 'completed' || eventOrStatus === 'success' ||
         eventOrStatus === 'failed' || eventOrStatus === 'error' ||
         eventOrStatus === 'unconfirmed' || eventOrStatus === 'unavailable';
}

function updateImportRow(importId, eventData, options = {}) {
  const { authoritative = false } = options;
  // What actually gets stored, and therefore what the panel repaints from. The
  // raw read is not it: a null this update dropped must not come back through
  // refreshInlineProgress and blank a count the owner is looking at.
  let cleanEventData = eventData;
  if (importId) {
    const floor = importGenerationFloor[importId];
    const existing = importEvents[importId];
    const currGen = existing && typeof existing.generation === 'number' ? existing.generation : floor;
    const newGen = eventData.generation;
    if (!authoritative && typeof currGen === 'number') {
      if (newGen === undefined || newGen === null) {
        return;
      }
      if (typeof newGen === 'number' && newGen < currGen) {
        return;
      }
    }
    if (typeof newGen === 'number') {
      importGenerationFloor[importId] = Math.max(importGenerationFloor[importId] || 0, newGen);
    }
    const incomingTerminal = isTerminalState(eventData.event || eventData.status);
    // authoritative means "canonical for the generation gate", nothing more. A
    // canonical read that says running does not erase a completed import: the
    // only thing that outranks a terminal record is a later generation, which
    // is a genuine re-run. Without this, one reconcile on the way into a
    // progress view rewrote a finished import back to running.
    if (existing) {
      if (isTerminalState(existing.event || existing.status) && !incomingTerminal) {
        if (!(typeof currGen === 'number' && typeof newGen === 'number' && newGen > currGen)) {
          return;
        }
      }
    }
    // A read of an import that is still going carries null for every fact it
    // cannot answer yet. Merging those nulls would blank counts the owner has
    // already been shown, so an unfinished update contributes only the keys it
    // actually has an answer for.
    cleanEventData = Object.fromEntries(
      Object.entries(eventData).filter(([_, v]) => v !== undefined && (incomingTerminal || v !== null))
    );
    importEvents[importId] = { ...(existing || {}), ...cleanEventData };
    if (IMPORT_ROW_EVENTS.has(eventData.event)) {
      if (eventData.fromStall && (eventData.event === 'status' || eventData.status === 'running') && !isTerminalState(eventData.event || eventData.status)) {
        importEvents[importId].stalled = true;
        trackPendingImport(importId);
      } else {
        importEvents[importId].stalled = false;
      }
    }
  }

  const safeId = typeof CSS !== 'undefined' && typeof CSS.escape === 'function' ? CSS.escape(importId) : importId;
  const row = document.querySelector(`tr[data-import-id="${safeId}"]`);
  if (!row) {
    refreshInlineProgress(importId, cleanEventData);
    return;
  }

  const statusCell = row.querySelector('.status-cell');
  const statsCell = row.querySelector('.stats-cell');
  const sourceCell = row.querySelector('.source-cell');

  if (IMPORT_ROW_EVENTS.has(eventData.event)) {
    if (!importEvents[importId]?.stalled) {
      row.classList.remove('import-row--stalled');
    }
  }

  if (sourceCell && (eventData.source_type || eventData.source_display)) {
    const displayText = eventData.source_display
      || sourceMetadataByName[eventData.source_type]?.display_name
      || eventData.source_type
      || '';
    sourceCell.innerHTML = displayText
      ? renderSourceDisplay(eventData.source_type || '', displayText, displayText)
      : '—';
    row.dataset.sourceType = eventData.source_type || '';
  }

  const status = eventData.status || (eventData.event === 'completed' ? 'success' : eventData.event === 'error' ? 'failed' : null);
  let gapDetail = eventData.has_gaps ? '<div class="progress-gap-chip" style="margin-top:2px; font-size:0.8em; color:var(--warn-ink);">contains gaps</div>' : '';

  if (status === 'unconfirmed') {
    if (statusCell) {
      statusCell.innerHTML = `<span class="import-status unconfirmed">unconfirmed</span>${gapDetail}`;
    }
  } else if (status === 'unavailable') {
    if (statusCell) {
      statusCell.innerHTML = `<span class="import-status unavailable">status unavailable</span>${gapDetail}`;
    }
  } else if (eventData.event === 'started') {
    if (statusCell) {
      statusCell.innerHTML = `<span class="import-status running">${escapeHtml(humanStageName(eventData.stage, eventData.source_display))}</span>${gapDetail}`;
    }
  } else if (eventData.event === 'status') {
    if (statusCell) {
      const progressStats = formatProgressStats(eventData);
      const detailParts = [statusElapsedDetail(eventData)];
      if (progressStats.length) {
        detailParts.push(progressStats.join(' • '));
      }
      statusCell.innerHTML = `<span class="import-status running">${escapeHtml(humanStageName(eventData.stage, eventData.source_display))}</span><div class="progress-detail">${escapeHtml(detailParts.join(' • '))}</div>${gapDetail}`;
    }
  } else if (eventData.event === 'completed' || status === 'success') {
    if (statusCell) {
      statusCell.innerHTML = `<span class="import-status success">completed</span>${gapDetail}`;
    }
    if (statsCell) {
      statsCell.textContent = formatImportStats(eventData.entries_written, eventData.entities_seeded);
    }
    setTimeout(() => loadImports(), 1000);
  } else if (eventData.event === 'error' || status === 'failed') {
    if (statusCell) {
      statusCell.innerHTML = `<span class="import-status failed">failed</span><div class="progress-detail">${escapeHtml(eventData.error || 'unknown error')}</div>${gapDetail}`;
    }
  }

  refreshInlineProgress(importId, cleanEventData);
}

function refreshInlineProgress(importId, eventData = null) {
  const hash = window.location.hash.slice(1);
  if (!hash.startsWith('progress/')) {
    return;
  }
  const currentImportId = hash.split('/')[1];
  if (currentImportId !== importId) {
    return;
  }
  const merged = eventData ? { ...(importEvents[importId] || {}), ...eventData } : importEvents[importId];
  if (merged) {
    showProgressView(importId, merged);
  }
}
