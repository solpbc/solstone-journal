.spinner { display:inline-block; width:12px; height:12px; border:2px solid #ccc; border-top-color:#fff; border-radius:50%; animation:spin 1s linear infinite; margin-left:6px; }

  .import-table td:nth-child(4),

  .import-table td:nth-child(7),
  .import-table th:nth-child(9),

  .import-table td:nth-child(2),

  .import-table td:nth-child(4),
  .import-table th:nth-child(5),
  .import-table td:nth-child(5),
  .import-table th:nth-child(7),
  .import-table td:nth-child(7),
  .import-table th:nth-child(8),
  .import-table td:nth-child(8),
  .import-table th:nth-child(9),
  .import-table td:nth-child(9) {

  }

  .import-table th,
  .import-table td {

  .import-table tr[tabindex] {
    min-height: 44px;
  }

  /* keep the status column visible without a horizontal scroll: it is the
     one column that answers "did it work" (G3-13). */
  .import-table td.source-cell {
    max-width: 38vw;
  }

  .import-table td.source-cell .import-source-inline span:last-child {
    overflow: hidden;
    text-overflow: ellipsis;

  }

  .import-table tbody tr:active td:nth-child(6) {

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
@keyframes spin { to { transform:rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
    .import-status.running::before {
        animation: none;
        opacity: 1;

    .spinner {

        border-top-color: #fff;

<div id="importListView">
<div class="workspace-content-wide">
  <div id="importGrid" class="import-source-grid"></div>

  <div id="importGuide" class="import-guided-flow" style="display:none">
    <a href="#" class="import-back-link" onclick="showGrid(); return false;">← back to sources</a>
    <div id="guideSteps"></div>
  </div>

  <div class="import-list">
    <h2>import history</h2>
    <div id="importListContent">
      <div class="surface-state surface-state--loading" role="status" aria-busy="true">
        <div class="surface-state-spinner" aria-hidden="true"></div>
        <span class="surface-state-text" data-role="loading-status">loading imports...</span>
      </div>
    </div>
  </div>
</div>

<div id="detectModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="detectModalTitle">
  <div class="modal-content">
    <h3 id="detectModalTitle">confirm import details</h3>
    <button class="close" type="button" aria-label="close" onclick="closeDetectModal()">&times;</button>
    <div class="confirm-fields">
      <div class="confirm-field">
        <label for="timestampInput">date</label>
        <input id="timestampInput" />
      </div>
      <div class="confirm-field">
        <label for="settingInput">context <span class="import-field-optional">(optional)</span></label>
        <input id="settingInput" placeholder="e.g. rae lunch with joe" />
        <div class="import-field-hint">a short note about what this is, so it's easier to find later</div>
      </div>
    </div>
    <input type="hidden" id="savedPath" />
    <div id="detectDuplicateNotice"></div>
    <div class="modal-actions">
      <button id="startBtn" class="import-primary-btn">start import</button>
    </div>
  </div>
</div>

</div>

<script>
const settingInput = document.getElementById('settingInput');
const startBtn = document.getElementById('startBtn');

const STAGE_NAMES = {
  initialization: 'Preparing...',
  importing: 'Reading your data...',
  detection: 'Detecting content type...',
  audio_segmenting: 'Splitting audio...',
  transcription: 'Transcribing audio...',
  processing: 'Processing entries...',
  writing: 'Writing to journal...',
  indexing: 'Building search index...',
  cleanup: 'Finishing up...',
  segmenting: 'Preparing segments...',
  transcribing: 'Transcribing audio...',
  segments: 'Merging segments...',
  entities: 'Merging entities...',
  facets: 'Merging facets...',
  imports: 'Copying prior imports...',
};
const IMPORT_STALL_TIMEOUT_MS = 10 * 60 * 1000; // longest observed real import; stalled rows surface amber after this without a terminal event
const IMPORT_ROW_EVENTS = new Set(['started', 'status', 'completed', 'error']);
const IMPORT_TERMINAL_EVENTS = new Set(['completed', 'error']);

let cachedSources = [];
let sourceMetadataByName = {};
let sourceIconSvgByName = {};
let currentFile = null;
let currentGuideSource = null;
let currentGuidedFile = null;
let currentGuidedSaved = null;
window._quickClientItemId = null;
window._quickSaved = null;
window._guidedClientItemId = null;
let importEvents = {};
let importsCache = [];
let currentSourceFilter = '';
let currentPage = 1;
let totalImports = 0;
const escapeHtml = (value) => window.AppServices.escapeHtml(value);
let importEventsCleanup = null;

function malformedImportHistoryResponse(url) {
  return new window.ApiError({
    status: 200,
    statusText: 'OK',
    serverMessage: 'Malformed import history response',
    url,
    cause: 'parse',
  });
}

function clearImportListErrors() {
  const container = document.getElementById('importListContent');
  const loadMoreError = document.getElementById('importLoadMoreError');
  if (loadMoreError) {
    loadMoreError.remove();
  }
  if (!container) {
    return;
  }
  const siblingError = container.nextElementSibling;
  if (siblingError && siblingError.classList.contains('surface-state-refresh-error')) {
    siblingError.remove();
  }
}

function trackPendingImport(importId) {
  if (!importId || !importEventsCleanup?.pending) {
    return;
  }
  importEventsCleanup.pending.track(importId);
}

function clearPendingImport(importId) {
  if (!importId || !importEventsCleanup?.pending) {
    return;
  }
  importEventsCleanup.pending.clear(importId);
}

function navigateTo(view, options = {}) {
  const { updateHash = true } = options;
  const grid = document.getElementById('importGrid');
  const guide = document.getElementById('importGuide');
  const nextHash = view === 'grid' ? '' : view;

  if (grid) {
    grid.style.display = view === 'grid' ? '' : 'none';
  }
  if (guide) {
    guide.style.display = view === 'grid' ? 'none' : '';
  }

  if (view.startsWith('guide/')) {
    const source = view.split('/')[1];
    loadGuidedFlow(source);
  } else if (view.startsWith('progress/')) {
    const importId = view.split('/')[1];
    showProgressView(importId);
  } else {
    currentGuideSource = null;
  }

  if (updateHash && window.location.hash.slice(1) !== nextHash) {
    window.location.hash = nextHash;
  }
}

function showGrid() {
  currentGuideSource = null;
  currentGuidedFile = null;
  currentGuidedSaved = null;
  window._guidedClientItemId = null;
  navigateTo('grid');
}

window.addEventListener('hashchange', handleHashChange);

function handleHashChange() {
  const hash = window.location.hash.slice(1);
  if (hash.startsWith('guide/')) {
    navigateTo(hash, { updateHash: false });
  } else if (hash.startsWith('progress/')) {
    navigateTo(hash, { updateHash: false });
  } else {
    navigateTo('grid', { updateHash: false });
  }
}

async function loadSourceGrid() {
  if (!cachedSources.length) {

function showQuickImport() {
  navigateTo('guide/quick');
}

let previousDetectFocus = null;
let detectFocusTrapHandler = null;

function isTerminalDuplicate(data) {
  return data?.status === 'duplicate' || data?.recommended_action === 'do_not_start';
}

function duplicateNoticeText(duplicate = {}, inProgress = false) {
  const state = duplicate.state || 'imported';
  const importId = duplicate.import_id || '';
  if (inProgress) {
    return `this import is already in progress${importId ? ` as ${importId}` : ''}.`;
  }
  if (state === 'staged') {
    return `this file was already staged${importId ? ` as ${importId}` : ''}.`;
  }
  const importedAt = duplicate.imported_at || 'an earlier import';
  const entries = duplicate.entry_count ? ` (${duplicate.entry_count} entries)` : '';
  return `this file was already imported on ${importedAt}${entries}.`;
}

function showDetect(res) {
  window._quickSaved = res;
  document.getElementById('timestampInput').value = res.timestamp || '';
  document.getElementById('savedPath').value = res.path;
  const duplicateNotice = document.getElementById('detectDuplicateNotice');
  if (duplicateNotice) {
    duplicateNotice.innerHTML = '';
  }
  startBtn.style.display = '';
  startBtn.disabled = false;
  if (isTerminalDuplicate(res)) {
    if (duplicateNotice) {
      duplicateNotice.innerHTML = `
        <div class="import-dedup-notice">
          <span class="dedup-text">${escapeHtml(duplicateNoticeText(res.duplicate, Boolean(res.in_progress)))}</span>
        </div>
      `;
    }
    startBtn.disabled = true;
    startBtn.style.display = 'none';
  }
  settingInput.value = res.setting || '';
  previousDetectFocus = document.activeElement;
  document.getElementById('detectModal').style.display = 'block';
  document.getElementById('timestampInput').focus();
  detectFocusTrapHandler = function(e) {
    if (e.key !== 'Tab') return;
    const modal = document.getElementById('detectModal');
    const focusable = Array.from(
      modal.querySelectorAll('button, [href], input, select, textarea, [tabindex="0"]')
    ).filter(el => el.offsetParent !== null && el.tabIndex >= 0 && !el.disabled);
    if (focusable.length === 0) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault();
      last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault();
      first.focus();
    }
  };
  document.addEventListener('keydown', detectFocusTrapHandler);
}

function closeDetectModal() {
  document.getElementById('detectModal').style.display = 'none';
  if (detectFocusTrapHandler) {
    document.removeEventListener('keydown', detectFocusTrapHandler);
    detectFocusTrapHandler = null;
  }
  if (previousDetectFocus && previousDetectFocus.isConnected) {
    previousDetectFocus.focus();
  }
  previousDetectFocus = null;
}

function formatFileSize(bytes) {
  if (bytes === null || bytes === undefined) return '-';
  if (bytes === 0) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

function formatDuration(minutes) {
  if (!minutes) return '-';
  const hours = Math.floor(minutes / 60);
  const mins = minutes % 60;
  if (hours > 0) {
    return `${hours}h ${mins}m`;
  }
  return `${mins}m`;
}

function formatElapsed(ms) {
  if (!ms) return '0s';
  const totalSeconds = Math.floor(ms / 1000);
  const mins = Math.floor(totalSeconds / 60);
  const secs = totalSeconds % 60;
  if (mins > 0) {
    return `${mins}m ${secs}s`;
  }
  return `${secs}s`;
}

function capitalizeStage(stage) {
  if (!stage) return '';
  return stage.charAt(0).toUpperCase() + stage.slice(1);
}

function humanStageName(stage, sourceDisplay = '') {
  const fallback = STAGE_NAMES[stage] || `${capitalizeStage(stage)}...`;
  if (stage === 'importing' && sourceDisplay) {
    return `Reading ${sourceDisplay}...`;
  }
  return fallback;
}

function retryImport(event) {
  event.stopPropagation();
  const button = event.target.closest('[data-import-retry]');
  if (!button) return;
  const importId = button.dataset.importId;
  const stage = button.dataset.stage || '';
  const statusCell = button.closest('.status-cell');
  const result = statusCell?.querySelector('.import-retry-result');
  button.disabled = true;
  button.textContent = 'retrying...';
  if (result) result.textContent = '';
  const payload = { import_id: importId };
  if (stage) payload.stage = stage;
  window.apiJson('/app/health/api/retry-import', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  })
    .then(() => {
      button.textContent = 'retry sent';
      if (result) result.textContent = 'retry sent';
    })
    .catch(err => {
      window.logError(err, { context: 'import: retry-import failed' });
      button.disabled = false;
      button.textContent = stage ? `retry from ${humanStageName(stage)}` : 'retry import';
      if (result) {
        result.innerHTML = window.SurfaceState.error({
          heading: "I couldn't retry that import",
          desc: window.CONVEY_COPY?.RELOAD_HINT || 'reload to try again.',
          serverMessage: err.serverMessage,
          detail: err,
          headingLevel: 'h4'
        });
      }
    });
}

document.addEventListener('click', event => {
  if (event.target.closest('[data-import-retry]')) {
    retryImport(event);
  }
});

function formatDateRange(dateRange) {
  if (!Array.isArray(dateRange) || !dateRange[0]) {
    return '';
  }
  if (!dateRange[1] || dateRange[0] === dateRange[1]) {
    return dateRange[0];
  }
  return `${dateRange[0]} - ${dateRange[1]}`;
}

function formatImportStats(entriesWritten, entitiesSeeded) {
  const parts = [];
  if (typeof entriesWritten === 'number' && entriesWritten > 0) {
    parts.push(`${entriesWritten} entries`);
  }
  if (typeof entitiesSeeded === 'number' && entitiesSeeded > 0) {
    parts.push(`${entitiesSeeded} entities`);
  }
  return parts.join(' • ') || '-';
}

function formatProgressStats(eventData) {
  const stats = [];
  if (eventData.items_total) {
    stats.push(`${eventData.items_processed || 0}/${eventData.items_total} items`);
  }
  if (eventData.earliest_date) {
    stats.push(`from ${eventData.earliest_date}`);
  }
  if (eventData.latest_date && eventData.latest_date !== eventData.earliest_date) {
    stats.push(`to ${eventData.latest_date}`);
  }
  if (eventData.entities_found) {
    stats.push(`${eventData.entities_found} entities found`);
  }
  return stats;
}

function renderProgressStats(eventData) {
  const stats = formatProgressStats(eventData);
  if (!stats.length) {
    return '';
  }
  return `<div class="import-progress-stats">${stats.map(stat => `<div class="import-progress-stat">${escapeHtml(stat)}</div>`).join('')}</div>`;
}

function renderSourceDisplay(sourceType, sourceDisplay, fallbackText = '-') {
  const iconSvg = sourceIconSvgByName[sourceType] || '';
  const displayText = sourceDisplay || fallbackText || '-';
  return `<div class="import-source-inline">${iconSvg ? `<span class="import-source-inline-icon" aria-hidden="true">${iconSvg}</span>` : ''}<span>${escapeHtml(displayText)}</span></div>`;
}

function getImportById(importId) {
  return importsCache.find(item => item.timestamp === importId) || null;
}

function buildHistoryHeader(total, totalEntriesWritten, totalEntitiesSeeded) {
  const sourceOptions = [
    '<option value="">all sources</option>',
    ...cachedSources.map(source => {
      const selected = currentSourceFilter === source.name ? ' selected' : '';
      return `<option value="${escapeHtml(source.name)}"${selected}>${escapeHtml(source.display_name)}</option>`;
    }),
  ].join('');

  return `
    <div class="import-history-header">
      <div class="import-history-summary">${total} imports total, ${totalEntriesWritten} entries imported, ${totalEntitiesSeeded} entities found</div>
      <div class="import-history-filters">
        <label for="importSourceFilter">source</label>
        <select id="importSourceFilter">
          ${sourceOptions}
        </select>
      </div>
    </div>
  `;
}

function renderImportRow(imp) {
  const importedAtMs = (imp.imported_at || imp.created_at) * 1000;
  const importedAt = window.JournalFormat.timestamp(importedAtMs);
  const targetDayDisplay = imp.target_day ? window.JournalFormat.day(imp.target_day) : '-';

  let statusClass;
  let statusText;
  let statusDetail = '';
  if (imp.status === 'success') {
    statusClass = 'success';
    statusText = 'completed';
  } else if (imp.status === 'failed') {
    statusClass = 'failed';
    statusText = 'failed';
    if (imp.error) {
      const errorStage = imp.error_stage ? ` (${capitalizeStage(imp.error_stage)})` : '';
      statusDetail = `<div class="progress-detail">${escapeHtml(imp.error)}${escapeHtml(errorStage)}</div>`;
    }
  } else if (imp.status === 'running') {
    statusClass = 'running';
    statusText = 'running';
  } else {
    statusClass = 'pending';
    statusText = 'pending';
  }

  const sourceCell = imp.source_type
    ? renderSourceDisplay(imp.source_type, imp.source_display || sourceMetadataByName[imp.source_type]?.display_name || imp.original_filename || '-')
    : renderSourceDisplay('', imp.original_filename || '-', imp.original_filename || '-');
  const statsText = formatImportStats(imp.entries_written, imp.entities_seeded);

  let html = `<tr data-import-id="${imp.timestamp}" data-source-type="${imp.source_type || ''}" tabindex="0" role="link" onclick="window.location.href='/app/import/${imp.timestamp}'" onkeydown="if(event.key==='Enter')window.location.href='/app/import/${imp.timestamp}'">`;
  html += `<td class="nowrap">${importedAt}</td>`;
  html += `<td>${escapeHtml(imp.original_filename || imp.source_display || '-')}</td>`;
  html += `<td class="source-cell">${sourceCell}</td>`;
  html += `<td class="file-size nowrap">${formatFileSize(imp.file_size)}</td>`;
  html += '<td class="nowrap">';
  if (imp.target_day) {
    html += `<a href="/app/timeline/${encodeURIComponent(imp.target_day)}" class="timestamp-link" onclick="event.stopPropagation();">${targetDayDisplay}</a>`;
  } else {
    html += '-';
  }
  html += '</td>';
  html += `<td class="status-cell"><span class="import-status ${statusClass}">${statusText}</span>${statusDetail}</td>`;
  html += `<td class="files-cell">${imp.total_files_created || 0}</td>`;
  html += `<td class="stats-cell import-stats-cell">${statsText}</td>`;
  html += `<td class="duration-cell">${formatDuration(imp.duration_minutes)}</td>`;
  html += '</tr>';
  return html;
}

function scrollToGrid() {
  const grid = document.getElementById('importGrid');
  if (grid) {
    grid.scrollIntoView({ behavior: 'smooth', block: 'start' });
    const firstCard = grid.querySelector('.import-source-card');
    if (firstCard) firstCard.focus();
  }
}

async function loadImports() {
  currentPage = 1;
  await loadSourceGrid();
  try {
    const data = await window.apiJson('/app/import/api/list?page=1&per_page=25');
    if (!Array.isArray(data.imports) || typeof data.total !== 'number' || typeof data.page !== 'number' || typeof data.pages !== 'number') {
      throw malformedImportHistoryResponse('/app/import/api/list?page=1&per_page=25');
    }
    const imports = data.imports;
    importsCache = imports;
    totalImports = data.total;
    const container = document.getElementById('importListContent');
    clearImportListErrors();

    if (imports.length === 0) {
      container.innerHTML = window.SurfaceState.empty({
        icon: window.ConveyIcons.svg('inbox'),
        heading: 'no imports yet',
        desc: 'import your data from any supported source above.',
        action: '<a href="#" onclick="scrollToGrid(); return false;" style="color: var(--orange-text-aa, #a15f17); font-weight: 600;">choose a source →</a>'
      });
      return;
    }

    let html = buildHistoryHeader(data.total, data.total_entries_written || 0, data.total_entities_seeded || 0);
    html += '<table class="import-table">';
    html += '<thead><tr>';
    html += '<th>imported at</th>';
    html += '<th>file</th>';
    html += '<th>source</th>';
    html += '<th>size</th>';
    html += '<th>imported to</th>';
    html += '<th>status</th>';
    html += '<th>files created</th>';
    html += '<th>stats</th>';
    html += '<th>duration</th>';
    html += '</tr></thead><tbody>';

    imports.forEach(imp => {
      html += renderImportRow(imp);
    });

    html += '</tbody></table>';
    if (data.page < data.pages) {
      html += `
        <div id="importLoadMore" style="text-align: center; margin: 1.5rem 0;">
          <button class="import-primary-btn" onclick="loadMoreImports()">
            Load More (${importsCache.length} of ${data.total} shown)
          </button>
        </div>
      `;
    }
    container.innerHTML = html;

    const sourceFilter = document.getElementById('importSourceFilter');
    if (sourceFilter) {
      sourceFilter.onchange = event => {
        currentSourceFilter = event.target.value;
        filterImportsBySource();
      };
    }

    imports.forEach(imp => {
      if (imp.status === 'running' || imp.status === 'pending') {
        trackPendingImport(imp.timestamp);
      } else {
        clearPendingImport(imp.timestamp);
      }
    });

    filterImportsBySource();
  } catch (err) {
    window.SurfaceState.replaceLoading('importListContent', window.SurfaceState.error({
      heading: 'couldn\'t load your import history',
      desc: window.CONVEY_COPY.RELOAD_HINT,
      serverMessage: err?.serverMessage || err?.message || '',
      detail: err,
    }));
  }
}

function renderLoadMoreError(err) {
  const table = document.querySelector('.import-table');
  if (!table || !table.parentNode) {
    return;
  }

  let errorEl = document.getElementById('importLoadMoreError');
  if (!errorEl) {
    errorEl = document.createElement('div');
    errorEl.id = 'importLoadMoreError';
    errorEl.className = 'surface-state-refresh-error';
  }

  const serverMessage = err?.serverMessage || err?.message || '';
  errorEl.innerHTML = `<strong>Couldn&#39;t load more imports.</strong> ${window.CONVEY_COPY.RELOAD_HINT}${serverMessage ? ` ${escapeHtml(serverMessage)}` : ''}`;

  const loadMoreContainer = document.getElementById('importLoadMore');
  if (loadMoreContainer) {
    table.parentNode.insertBefore(errorEl, loadMoreContainer);
  } else {
    table.parentNode.appendChild(errorEl);
  }
}

async function loadMoreImports() {
  currentPage++;
  try {
    const data = await window.apiJson(`/app/import/api/list?page=${currentPage}&per_page=25`);
    if (!Array.isArray(data.imports) || typeof data.total !== 'number' || typeof data.page !== 'number' || typeof data.pages !== 'number') {
      throw malformedImportHistoryResponse(`/app/import/api/list?page=${currentPage}&per_page=25`);
    }

    importsCache = importsCache.concat(data.imports);
    const existingError = document.getElementById('importLoadMoreError');
    if (existingError) {
      existingError.remove();
    }

    const tbody = document.querySelector('.import-table tbody');
    if (tbody) {
      let rowsHtml = '';
      data.imports.forEach(imp => {
        rowsHtml += renderImportRow(imp);
      });
      tbody.insertAdjacentHTML('beforeend', rowsHtml);
    }

    const loadMoreContainer = document.getElementById('importLoadMore');
    if (loadMoreContainer) {
      if (data.page < data.pages) {
        loadMoreContainer.innerHTML = `
          <button class="import-primary-btn" onclick="loadMoreImports()">
            Load More (${importsCache.length} of ${data.total} shown)
          </button>`;
      } else {
        loadMoreContainer.remove();
      }
    }

    data.imports.forEach(imp => {
      if (imp.status === 'running' || imp.status === 'pending') {
        trackPendingImport(imp.timestamp);
      } else {
        clearPendingImport(imp.timestamp);
      }
    });

    filterImportsBySource();
  } catch (err) {
    currentPage--;
    renderLoadMoreError(err);
  }
}

function filterImportsBySource() {
  const rows = document.querySelectorAll('.import-table tbody tr');
  if (rows.length === 0) return;

  let visibleCount = 0;
  rows.forEach(row => {
    const sourceMatches = !currentSourceFilter || row.dataset.sourceType === currentSourceFilter;
    if (sourceMatches) {
      row.style.display = '';
      visibleCount++;
    } else {
      row.style.display = 'none';
    }
  });

  const container = document.getElementById('importListContent');
  if (visibleCount === 0 && rows.length > 0) {
    let noMatchEl = container.querySelector('.no-imports-filtered');
    if (!noMatchEl) {
      noMatchEl = document.createElement('div');
      noMatchEl.className = 'no-imports-filtered';
      container.appendChild(noMatchEl);
    }
    noMatchEl.innerHTML = window.SurfaceState.empty({
      icon: window.ConveyIcons.svg('search'),
      heading: 'no imports match this filter'
    });
    noMatchEl.style.display = '';
  } else {
    const noMatchEl = container.querySelector('.no-imports-filtered');
    if (noMatchEl) {
      noMatchEl.style.display = 'none';
    }
  }
}

function markRowStalled(importId) {
  if (!importId) {
    return;
  }

  clearPendingImport(importId);
  importEvents[importId] = { ...(importEvents[importId] || {}), stalled: true };

  const row = document.querySelector(`tr[data-import-id="${importId}"]`);
	  if (row) {
	    row.classList.add('import-row--stalled');
	    const statusCell = row.querySelector('.status-cell');
	    if (statusCell) {
	      const stage = importEvents[importId]?.stage || 'importing';
	      statusCell.innerHTML = `<span class="import-status stalled">stalled</span><button type="button" class="import-retry-btn" data-import-retry="true" data-import-id="${escapeHtml(importId)}" data-stage="${escapeHtml(stage)}">retry from ${escapeHtml(humanStageName(stage))}</button><div class="progress-detail import-stalled-meta">stalled — no updates in 10 minutes. import ID: ${escapeHtml(importId)}. ${window.CONVEY_COPY.RELOAD_HINT}</div><div class="import-retry-result"></div>`;
	    }
	  }

  refreshInlineProgress(importId);
}

function updateImportRow(importId, eventData) {
  if (importId) {
    importEvents[importId] = { ...(importEvents[importId] || {}), ...eventData };
    if (IMPORT_ROW_EVENTS.has(eventData.event)) {
      importEvents[importId].stalled = false;
    }
  }

  const row = document.querySelector(`tr[data-import-id="${importId}"]`);
  if (!row) {
    refreshInlineProgress(importId, eventData);
    return;
  }

  const statusCell = row.querySelector('.status-cell');
  const filesCell = row.querySelector('.files-cell');
  const statsCell = row.querySelector('.stats-cell');
  const durationCell = row.querySelector('.duration-cell');
  const sourceCell = row.querySelector('.source-cell');

  if (IMPORT_ROW_EVENTS.has(eventData.event)) {
    row.classList.remove('import-row--stalled');
  }

  if (sourceCell && (eventData.source_type || eventData.source_display)) {
    const displayText = eventData.source_display || sourceMetadataByName[eventData.source_type]?.display_name || row.children[1]?.textContent || '-';
    sourceCell.innerHTML = renderSourceDisplay(eventData.source_type || '', displayText, displayText);
    row.dataset.sourceType = eventData.source_type || '';
  }

  if (eventData.event === 'started') {
    if (statusCell) {
      statusCell.innerHTML = `<span class="import-status running">${escapeHtml(humanStageName(eventData.stage, eventData.source_display))}</span>`;
    }
  } else if (eventData.event === 'status') {
    if (statusCell) {
      const stageTime = formatElapsed(eventData.stage_elapsed_ms);
      const totalTime = formatElapsed(eventData.elapsed_ms);
      const progressStats = formatProgressStats(eventData);
      const detailParts = [`${stageTime} (${totalTime} total)`];
      if (progressStats.length) {
        detailParts.push(progressStats.join(' • '));
      }
      statusCell.innerHTML = `<span class="import-status running">${escapeHtml(humanStageName(eventData.stage, eventData.source_display))}</span><div class="progress-detail">${escapeHtml(detailParts.join(' • '))}</div>`;
    }
  } else if (eventData.event === 'completed') {
    if (statusCell) {
      statusCell.innerHTML = '<span class="import-status success">completed</span>';
    }
    if (filesCell && eventData.total_files_created !== undefined) {
      filesCell.textContent = eventData.total_files_created;
    }
    if (statsCell) {
      statsCell.textContent = formatImportStats(eventData.entries_written, eventData.entities_seeded);
    }
    if (durationCell && eventData.duration_ms) {
      durationCell.textContent = formatElapsed(eventData.duration_ms);
    }
    setTimeout(() => loadImports(), 1000);
	  } else if (eventData.event === 'error') {
	    if (statusCell) {
	      statusCell.innerHTML = `<span class="import-status failed">failed</span><button type="button" class="import-retry-btn" data-import-retry="true" data-import-id="${escapeHtml(importId)}">retry import</button><div class="progress-detail">${escapeHtml(eventData.error || 'unknown error')}</div><div class="import-retry-result"></div>`;
	    }
	  }

  refreshInlineProgress(importId, eventData);
}

function refreshInlineProgress(importId, eventData = null) {
  const hash = window.location.hash.slice(1);
  if (!hash.startsWith('progress/')) {
    return;
  }
  const currentImportId = hash.split('/')[1];
  if (currentImportId !== importId) {
    return;
  }
  const merged = eventData ? { ...(importEvents[importId] || {}), ...eventData } : importEvents[importId];
  if (merged) {
    renderProgressView(importId, merged);
  }
}

async function loadGuidedFlow(sourceName) {
  await loadSourceGrid();
  const source = sourceMetadataByName[sourceName];
  const guideSteps = document.getElementById('guideSteps');
  currentGuideSource = sourceName;
  currentGuidedFile = null;
  currentGuidedSaved = null;
  window._guidedClientItemId = null;
  if (!guideSteps) {
    return;
  }

  if (!source) {
    guideSteps.innerHTML = '<div class="no-imports">unknown import source</div>';
    return;
  }

  if (sourceName === 'quick') {
    renderQuickImportFlow();
    return;
  }

  let guideHtml = '';
  let guideStepNumber = 1;
  if (source.has_guide) {
    const response = await fetch(`/app/import/api/guide/${sourceName}`);
    if (response.ok) {
      const markdown = await response.text();
      guideHtml = `<li><div class="import-step"><div class="import-step-number">step ${guideStepNumber}</div><div class="import-guide-content">${window.AppServices.renderMarkdown(markdown)}</div></div></li>`;
      guideStepNumber += 1;
    }
  }
  const uploadStepNumber = guideStepNumber;
  const configureStepNumber = uploadStepNumber + 1;

  guideSteps.innerHTML = `
    <div>
      <h3 class="import-guide-title">${escapeHtml(source.display_name)}</h3>
      <p class="import-guide-subtitle">${escapeHtml(source.description || '')}</p>
    </div>
    <form id="guidedImportForm" onsubmit="return false;"><ol class="import-steps-list">
    ${guideHtml}
      <li><div class="import-step">
        <div class="import-step-number">step ${uploadStepNumber}</div>
        ${source.input_type === 'path_input' ? `
          <h4>${escapeHtml(source.upload_prompt || 'paste the full path to your folder')}</h4>
          <input id="guidedPathInput" class="import-path-input" type="text"
            placeholder="${escapeHtml(source.upload_prompt || 'paste the full path to your folder')}" />
        ` : `
          <h4>upload your file</h4>
          <div class="import-upload-area" id="guidedDropArea" role="button" tabindex="0" aria-label="choose file to upload">
            <p>${escapeHtml(source.upload_prompt || 'select a file to import')}</p>
            <div class="import-upload-help">${escapeHtml(source.accept ? `accepts ${source.accept}` : 'any supported file')}</div>
            <input id="guidedFileInput" type="file" accept="${escapeHtml(source.accept || '')}" style="display:none" />
            <div id="guidedFileLabel" class="import-file-label"></div>
          </div>
        `}
        <div id="guidedDedupNotice"></div>
      </div></li>
      <li><div class="import-step">
        <div class="import-step-number">step ${configureStepNumber}</div>
        ${source.name === 'journal_archive' ? `
          <h4>preview, then merge your archive</h4>
          <div class="import-action-row">
            <button id="guidedPreviewBtn" class="import-secondary-btn" type="button">preview</button>
            <button id="guidedStartBtn" class="import-primary-btn" type="submit">start import</button>
            <a class="import-secondary-btn" href="/app/import/api/journal-archive/export">download this journal</a>
          </div>
          <div id="guidedArchivePreview"></div>
        ` : `
          <h4>configure and start</h4>
          <div class="import-inline-fields">
            <div class="confirm-field">
              <label for="guidedSettingInput">context <span class="import-field-optional">(optional)</span></label>
              <input id="guidedSettingInput" placeholder="e.g. weekly planning" />
              <div class="import-field-hint">a short note about what this is, so it's easier to find later</div>
            </div>
          </div>
          <div class="import-action-row">
            <button id="guidedStartBtn" class="import-primary-btn" type="submit">start import</button>
          </div>
        `}
      </div></li>
    </ol></form>
  `;

  if (source.input_type !== 'path_input') {
    setupGuidedUploadArea();
  } else {
    const guidedPathInput = document.getElementById('guidedPathInput');
    if (guidedPathInput) {
      guidedPathInput.addEventListener('input', () => {
        currentGuidedSaved = null;
        window._guidedClientItemId = crypto.randomUUID();
      });
    }
  }
  const guidedStartBtn = document.getElementById('guidedStartBtn');
  if (guidedStartBtn) {
    guidedStartBtn.addEventListener('click', () => startGuidedImport(source));
  }
  const guidedPreviewBtn = document.getElementById('guidedPreviewBtn');
  if (guidedPreviewBtn) {
    guidedPreviewBtn.addEventListener('click', () => previewGuidedJournalArchive(source));
  }
  const guidedForm = document.getElementById('guidedImportForm');
  if (guidedForm && guidedStartBtn) {
    guidedForm.addEventListener('submit', e => {
      e.preventDefault();
      guidedStartBtn.click();
    });
  }
}

function renderQuickImportFlow() {
  const guideSteps = document.getElementById('guideSteps');
  if (!guideSteps) {
    return;
  }

  guideSteps.innerHTML = `
    <div>
      <h3 class="import-guide-title">quick import</h3>
      <p class="import-guide-subtitle">paste text or drop a file — you'll confirm the date before it goes in.</p>
    </div>
    <form id="importForm">
      <ol class="import-steps-list">
        <li><div class="import-step">
          <div class="import-step-number">step 1</div>
          <div class="import-upload-area" id="dropArea" role="button" tabindex="0" aria-label="choose file to upload">
            <p>drop a file here or choose one</p>
            <input id="fileInput" type="file" style="display:none" />
            <div id="fileLabel" class="import-file-label"></div>
          </div>
        </div></li>
        <li><div class="import-step">
          <div class="import-step-number">step 2</div>
          <textarea id="pasteText" class="import-paste-text" placeholder="paste text here..."></textarea>
          <div class="import-inline-fields">
            <div class="confirm-field">
              <label for="quickSettingInput">context <span class="import-field-optional">(optional)</span></label>
              <input id="quickSettingInput" placeholder="e.g. paste from notes app" />
              <div class="import-field-hint">a short note about what this is, so it's easier to find later</div>
            </div>
          </div>
          <div class="import-action-row">
            <button type="submit" id="validateBtn" class="import-primary-btn">validate</button>
          </div>
        </div></li>
      </ol>
    </form>
  `;

  setupQuickImportForm();
}

function setupGuidedUploadArea() {
  const dropArea = document.getElementById('guidedDropArea');
  const fileInput = document.getElementById('guidedFileInput');
  const fileLabel = document.getElementById('guidedFileLabel');

  if (!dropArea || !fileInput || !fileLabel) {
    return;
  }

  const setFile = file => {
    currentGuidedFile = file || null;
    fileLabel.textContent = file ? file.name : '';
    currentGuidedSaved = null;
    window._guidedClientItemId = file ? crypto.randomUUID() : null;
  };

  dropArea.onclick = () => fileInput.click();
  dropArea.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      fileInput.click();
    }
  });
  ['dragenter', 'dragover'].forEach(eventName => {
    dropArea.addEventListener(eventName, event => {
      event.preventDefault();
      dropArea.classList.add('dragover');
    });
  });
  ['dragleave', 'drop'].forEach(eventName => {
    dropArea.addEventListener(eventName, event => {
      event.preventDefault();
      dropArea.classList.remove('dragover');
    });
  });
  dropArea.addEventListener('drop', event => {
    const file = event.dataTransfer.files[0];
    if (file) {
      setFile(file);
    }
  });
  fileInput.onchange = event => {
    setFile(event.target.files[0]);
  };
}

function setupQuickImportForm() {
  const dropArea = document.getElementById('dropArea');
  const fileInput = document.getElementById('fileInput');
  const fileLabel = document.getElementById('fileLabel');
  const pasteText = document.getElementById('pasteText');
  const importForm = document.getElementById('importForm');
  const quickSettingInput = document.getElementById('quickSettingInput');

  if (!dropArea || !fileInput || !fileLabel || !pasteText || !importForm) {
    return;
  }

  currentFile = null;
  window._quickClientItemId = null;
  window._quickSaved = null;
  dropArea.onclick = () => fileInput.click();
  dropArea.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      fileInput.click();
    }
  });
  ['dragenter', 'dragover'].forEach(ev => dropArea.addEventListener(ev, e => {
    e.preventDefault();
    dropArea.classList.add('dragover');
  }));
  ['dragleave', 'drop'].forEach(ev => dropArea.addEventListener(ev, e => {
    e.preventDefault();
    dropArea.classList.remove('dragover');
  }));
  dropArea.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if (file) {
      currentFile = file;
      fileLabel.textContent = file.name;
      window._quickClientItemId = crypto.randomUUID();
      window._quickSaved = null;
    }
  });
  fileInput.onchange = e => {
    currentFile = e.target.files[0];
    if (currentFile) {
      fileLabel.textContent = currentFile.name;
      window._quickClientItemId = crypto.randomUUID();
      window._quickSaved = null;
    }
  };
  ['input', 'paste'].forEach(eventName => {
    pasteText.addEventListener(eventName, () => {
      window._quickClientItemId = crypto.randomUUID();
      window._quickSaved = null;
    });
  });

  importForm.onsubmit = async e => {
    e.preventDefault();
    const validateBtn = document.getElementById('validateBtn');
    const hasFile = currentFile != null;
    const hasText = pasteText.value.trim().length > 0;

    if (!hasFile && !hasText) {
      if (window.showError) {
        showError('Please provide a file or paste text');
      }
      return;
    }

    validateBtn.disabled = true;
    validateBtn.innerHTML = 'validating<span class="spinner"></span>';

    try {
      const fd = new FormData();
      if (hasFile) {
        fd.append('file', currentFile);
      } else {
        fd.append('text', pasteText.value);
      }
      fd.append(
        'client_item_id',
        window._quickClientItemId || (window._quickClientItemId = crypto.randomUUID())
      );

      const settingValue = quickSettingInput ? quickSettingInput.value.trim() : '';
      if (settingValue) {
        fd.append('setting', settingValue);
      }

      const response = await fetch('/app/import/api/save', { method: 'POST', body: fd });
      const data = await response.json();
      validateBtn.disabled = false;
      validateBtn.textContent = 'validate';

      if (!response.ok) {
        if (window.showError) {
          showError(data.error || 'Validation failed');
        }
        return;
      }
      showDetect(data);
    } catch (_err) {
      validateBtn.disabled = false;
      validateBtn.textContent = 'validate';
      if (window.showError) {
        showError('Validation failed');
      }
    }
  };
}

async function uploadGuidedSourceFile(source) {
  if (!currentGuidedFile) {
    throw new Error('Please select a file to import.');
  }

  const guidedSettingInput = document.getElementById('guidedSettingInput');
  const fd = new FormData();
  fd.append('file', currentGuidedFile);
  fd.append(
    'client_item_id',
    window._guidedClientItemId || (window._guidedClientItemId = crypto.randomUUID())
  );
  if (source && source.name !== 'recording') {
    fd.append('source_hint', source.name);
  }
  if (guidedSettingInput && guidedSettingInput.value.trim()) {
    fd.append('setting', guidedSettingInput.value.trim());
  }

  const response = await fetch('/app/import/api/save', {
    method: 'POST',
    body: fd,
  });
  const data = await response.json();
  if (!response.ok) {
    throw new Error(data.error || 'Failed to save import');
  }

  currentGuidedSaved = data;

  if (isTerminalDuplicate(data)) {
    showDedupNotice(data.duplicate, Boolean(data.in_progress));
  }

  return data;
}

function showDedupNotice(duplicate, inProgress = false) {
  const container = document.getElementById('guidedDedupNotice');
  if (!container) return;
  container.innerHTML = `
    <div class="import-dedup-notice">
      <span class="dedup-text">${escapeHtml(duplicateNoticeText(duplicate, inProgress))}</span>
    </div>
  `;
}

async function saveGuidedPath(source) {
  const pathInput = document.getElementById('guidedPathInput');
  if (!pathInput || !pathInput.value.trim()) {
    throw new Error('Please enter the path to your vault folder.');
  }

  const guidedSettingInput = document.getElementById('guidedSettingInput');
  const setting = guidedSettingInput ? guidedSettingInput.value.trim() : '';
  const payload = {
    path: pathInput.value.trim(),
    setting,
    client_item_id: window._guidedClientItemId
      || (window._guidedClientItemId = crypto.randomUUID()),
  };
  if (source && source.name !== 'recording') {
    payload.source_hint = source.name;
  }

  const response = await fetch('/app/import/api/save-path', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const data = await response.json();
  if (!response.ok) {
    throw new Error(data.error || 'Path not found');
  }

  currentGuidedSaved = data;
  if (isTerminalDuplicate(data)) {
    showDedupNotice(data.duplicate, Boolean(data.in_progress));
  }
  return data;
}

async function startGuidedImport(source) {
  const startButton = document.getElementById('guidedStartBtn');
  const guidedSettingInput = document.getElementById('guidedSettingInput');
  const originalText = startButton.textContent;

  startButton.disabled = true;
  startButton.innerHTML = 'starting<span class="spinner"></span>';

  try {
    let saved;
    if (source.input_type === 'path_input') {
      saved = currentGuidedSaved || await saveGuidedPath(source);
    } else {
      saved = currentGuidedSaved || await uploadGuidedSourceFile(source);
    }
    if (isTerminalDuplicate(saved)) {
      showDedupNotice(saved.duplicate, Boolean(saved.in_progress));
      return;
    }
    const path = saved.path;
    const ts = saved.timestamp;
    const setting = guidedSettingInput ? guidedSettingInput.value.trim() : '';

    const metaResponse = await fetch('/app/import/api/meta', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path, setting }),
    });

    if (!metaResponse.ok) {
      const errorData = await metaResponse.json().catch(() => ({}));
      throw new Error(errorData.error || 'Failed to save import settings');
    }

    const startResponse = await fetch('/app/import/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path, timestamp: ts }),
    });

    if (!startResponse.ok) {
      const errorData = await startResponse.json().catch(() => ({}));
      throw new Error(errorData.error || 'Failed to start import');
    }

    importEvents[ts] = {
      import_id: ts,
      event: 'started',
      stage: 'initialization',
      source_type: source.name,
      source_display: source.display_name,
    };
    trackPendingImport(ts);
    loadImports();
    navigateTo(`progress/${ts}`);
  } catch (err) {
    if (window.showError && err instanceof Error) {
      showError(err.message);
    }
  } finally {
    startButton.disabled = false;
    startButton.textContent = originalText;
  }
}

async function previewGuidedJournalArchive(source) {
  const previewButton = document.getElementById('guidedPreviewBtn');
  const preview = document.getElementById('guidedArchivePreview');
  const originalText = previewButton.textContent;

  previewButton.disabled = true;
  previewButton.innerHTML = 'previewing<span class="spinner"></span>';
  try {
    const saved = currentGuidedSaved || await uploadGuidedSourceFile(source);
    const response = await fetch('/app/import/api/journal-archive/preview', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: saved.path, timestamp: saved.timestamp }),
    });
    const data = await response.json();
    if (!response.ok) {
      throw new Error(data.error || 'Failed to preview archive');
    }
    const days = Array.isArray(data.days) ? data.days : [];
    preview.innerHTML = `
      <div class="import-dedup-notice">
        <span class="dedup-text">${escapeHtml(days.length ? `Archive days: ${days.join(', ')}` : 'The archive has no chronicle days.')}</span>
      </div>
    `;
  } catch (err) {
    if (window.showError && err instanceof Error) {
      showError(err.message);
    }
  } finally {
    previewButton.disabled = false;
    previewButton.textContent = originalText;
  }
}

function showProgressView(importId, eventData = null) {
  const guideSteps = document.getElementById('guideSteps');
  const source = sourceMetadataByName[currentGuideSource] || null;
  const importInfo = getImportById(importId);
  const currentEvent = eventData || importEvents[importId] || null;

  if (!guideSteps) {
    return;
  }

  const displayName = currentEvent?.source_display || importInfo?.source_display || source?.display_name || 'Import';
  const stageLabel = currentEvent?.stalled
    ? 'Stalled — no updates in 10 minutes'
    : currentEvent?.event === 'completed'
      ? 'Import complete'
      : currentEvent?.event === 'error'
        ? 'Import failed'
        : humanStageName(currentEvent?.stage || 'initialization', displayName);
  const progressHtml = currentEvent ? renderProgressStats(currentEvent) : '';
  let completionHtml = '';

  if (currentEvent?.event === 'completed' || importInfo?.status === 'success') {
    const completedInfo = currentEvent || importInfo || {};
    const range = completedInfo.date_range || importInfo?.date_range || null;
    completionHtml = `
      <div class="import-completion-summary">
        <div><strong>Entries written:</strong> ${completedInfo.entries_written || importInfo?.entries_written || 0}</div>
        <div><strong>Entities seeded:</strong> ${completedInfo.entities_seeded || importInfo?.entities_seeded || 0}</div>
        <div><strong>Date range:</strong> ${escapeHtml(formatDateRange(range) || '-')}</div>
        <div><strong>Duration:</strong> ${formatElapsed(completedInfo.duration_ms || 0)}</div>
        <div class="import-action-row">
          <a class="import-secondary-btn" href="/app/import/${completedInfo.processed_timestamp || importId}#content">browse what was imported →</a>
          <a href="#" class="import-secondary-btn" onclick="showGrid(); return false;">import another source</a>
        </div>
      </div>
    `;
  } else if (currentEvent?.event === 'error' || importInfo?.status === 'failed') {
    const errorText = currentEvent?.error || importInfo?.error || 'Unknown error';
    completionHtml = `
      <div class="import-completion-summary failed">
        <div><strong>Error:</strong> ${escapeHtml(errorText)}</div>
        <div class="import-action-row">
          <a href="#" class="import-secondary-btn" onclick="showGrid(); return false;">import another source</a>
        </div>
      </div>
    `;
  } else if (currentEvent?.stalled) {
    completionHtml = `
      <div class="import-completion-summary stalled">
        <div><strong>Import ID:</strong> ${escapeHtml(importId)}</div>
        <div>Stalled — no updates in 10 minutes. ${window.CONVEY_COPY.RELOAD_HINT}</div>
        <div class="import-action-row">
          <a href="#" class="import-secondary-btn" onclick="showGrid(); return false;">import another source</a>
        </div>
      </div>
    `;
  }

  guideSteps.innerHTML = `
    <div class="import-progress-panel">
      <div class="import-step-number">progress</div>
      <h3 class="import-progress-title">${escapeHtml(displayName)}</h3>
      <p class="import-progress-message">${escapeHtml(stageLabel)}</p>
      ${currentEvent?.elapsed_ms ? `<div class="progress-detail">${escapeHtml(formatElapsed(currentEvent.elapsed_ms))} elapsed</div>` : ''}
      ${progressHtml}
      ${completionHtml}
    </div>
  `;
}

startBtn.addEventListener('click', async () => {
  const ts = document.getElementById('timestampInput').value.trim();
  const path = document.getElementById('savedPath').value;
  const setting = settingInput.value.trim();

  if (!ts) {
    if (window.showError) showError('the date is required before starting the import.');
    return;
  }
  if (isTerminalDuplicate(window._quickSaved)) {
    showDetect(window._quickSaved);
    return;
  }

  const originalText = startBtn.textContent;
  startBtn.disabled = true;
  startBtn.innerHTML = 'starting<span class="spinner"></span>';

  try {
    const response = await fetch('/app/import/api/meta', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path, setting }),
    });

    if (!response.ok) {
      const errorData = await response.json().catch(() => ({}));
      throw new Error(errorData.error || 'Failed to save import settings');
    }

    const startResponse = await fetch('/app/import/api/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path, timestamp: ts }),
    });

    if (!startResponse.ok) {
      const errorData = await startResponse.json().catch(() => ({}));
      throw new Error(errorData.error || 'Failed to start import');
    }

    startBtn.disabled = false;
    startBtn.textContent = originalText;
    closeDetectModal();
    importEvents[ts] = {
      import_id: ts,
      event: 'started',
      stage: 'initialization',
      source_type: 'quick',
      source_display: 'quick import',
    };
    trackPendingImport(ts);
    loadImports();
    navigateTo(`progress/${ts}`);
  } catch (err) {
    startBtn.disabled = false;
    startBtn.textContent = originalText;
    if (window.showError && err instanceof Error) showError(err.message);
  }
});

window.onclick = e => {
  if (e.target === document.getElementById('detectModal')) {
    closeDetectModal();
  }
};

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape' && document.getElementById('detectModal').style.display === 'block') {
    closeDetectModal();
  }
});

function initImportWorkspace() {
  const listView = document.getElementById('importListView');
  if (window.solPathContext().segment) {
    if (listView) listView.style.display = 'none';
    return;
  }
  if (listView) listView.style.display = '';

  importEventsCleanup = window.appEvents.listen('importer', {
    correlationKey: 'import_id',
    timeout: IMPORT_STALL_TIMEOUT_MS,
    onTimeout: markRowStalled,
  }, eventData => {
    if (!IMPORT_ROW_EVENTS.has(eventData.event)) {
      return;
    }
    if (IMPORT_TERMINAL_EVENTS.has(eventData.event)) {
      clearPendingImport(eventData.import_id);
    } else {
      trackPendingImport(eventData.import_id);
    }
    updateImportRow(eventData.import_id, eventData);
  });

  loadSourceGrid();
  loadImports();
  handleHashChange();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initImportWorkspace);
} else {
  initImportWorkspace();
}
</script>

<div class="import-detail-content" id="importDetailView" style="display:none;">
  <a href="/app/import/" class="back-link">← back to imports</a>

  <div class="import-header">
    <h1 id="importDetailHeading"></h1>
    <div class="import-meta" id="importMeta">
      <span>loading...</span>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <div class="tab active" data-target="overview" tabindex="0" role="tab">overview</div>
    <div class="tab" data-target="content" tabindex="0" role="tab">content</div>
  </div>

  <div class="tab-content active" id="overview">
    <div id="overviewContent">loading...</div>
  </div>

  <div class="tab-content" id="content">
    <div id="contentLoading" class="no-data">select this tab to browse imported content</div>
    <div id="contentContainer" style="display:none;">
      <div class="import-content-summary" id="contentSummary"></div>
      <div class="import-content-controls">
        <input type="text" id="contentSearch" class="import-content-search" placeholder="search items..." />
        <select id="contentMonth" class="import-content-month">
          <option value="">all months</option>
        </select>
      </div>
      <div id="contentItems" class="import-content-items"></div>
      <div id="contentPagination" class="import-content-pagination"></div>
    </div>
  </div>

</div>

<script src="/app/import/static/import_detail.js"></script>
<script>
(function() {
const importDetailTimestamp = window.solPathContext().segment;
const importDetailPathSegment = importDetailTimestamp ? encodeURIComponent(importDetailTimestamp) : '';
if (!importDetailTimestamp) {
  return;
}
// Tab switching
const tabs = document.querySelectorAll('.tab');
const contents = document.querySelectorAll('.tab-content');
let contentLoaded = false;
let contentPage = 1;
let contentSearch = '';
let contentMonth = '';
let searchDebounce = null;

tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    const target = tab.dataset.target;
    tabs.forEach(t => t.classList.toggle('active', t.dataset.target === target));
    contents.forEach(c => c.classList.toggle('active', c.id === target));
    if (target === 'content' && !contentLoaded) {
      loadContent(1);
    }
  });
  tab.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      tab.click();
    }
  });
});

function loadContent(page = 1) {
  const container = document.getElementById('contentContainer');
  const loading = document.getElementById('contentLoading');
  loading.textContent = 'loading content...';
  loading.style.display = 'block';

  const params = new URLSearchParams({page, per_page: 50});
  if (contentSearch) params.set('q', contentSearch);
  if (contentMonth) params.set('month', contentMonth);

  fetch(`/app/import/api/${importDetailPathSegment}/content?${params}`)
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        loading.textContent = data.error;
        return;
      }
      loading.style.display = 'none';
      container.style.display = 'block';
      contentPage = data.page;
      renderContentSummary(data);
      renderContentMonths(data.months);
      renderContentItems(data.items);
      renderContentPagination(data);
      contentLoaded = true;
    })
    .catch(err => {
      loading.textContent = 'error loading content';
      console.error('Content load error:', err);
    });
}

function renderContentSummary(data) {
  const el = document.getElementById('contentSummary');
  const iconSvg = data.source_icon_svg || '';
  const display = data.source_display || '';
  const iconHtml = iconSvg ? `<span class="import-content-summary-icon" aria-hidden="true">${iconSvg}</span>` : '';
  el.innerHTML = `${iconHtml}<strong>${escapeHtml(display)}</strong> — ${data.total} items`;
}

function renderContentMonths(months) {
  const select = document.getElementById('contentMonth');
  const current = select.value;
  select.innerHTML = '<option value="">All months</option>';
  for (const [month, count] of Object.entries(months)) {
    const label = month.slice(0, 4) + '-' + month.slice(4, 6);
    const opt = document.createElement('option');
    opt.value = month;
    opt.textContent = `${label} (${count})`;
    select.appendChild(opt);
  }
  select.value = current;
}

function renderContentItems(items) {
  const el = document.getElementById('contentItems');
  if (!items.length) {
    el.innerHTML = '<div class="no-data">No items found</div>';
    return;
  }
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  let currentMonth = '';
  let html = '';
  items.forEach(item => {
    const itemMonth = item.date ? item.date.slice(0, 6) : '';
    if (itemMonth && itemMonth !== currentMonth) {
      currentMonth = itemMonth;
      const year = itemMonth.slice(0, 4);
      const monthIdx = parseInt(itemMonth.slice(4, 6), 10) - 1;
      const monthLabel = monthNames[monthIdx] || '';
      const monthCount = items.filter(i => (i.date || '').startsWith(itemMonth)).length;
      html += `<div class="import-content-month-header">${monthLabel} ${year} — ${monthCount} items</div>`;
    }
    const typeLabel = {
      conversation: 'Chat',
      event: 'Event',
      highlight_group: 'Highlights',
      note: 'Note',
    }[item.type] || item.type;
    const date = item.date ? window.JournalFormat.day(item.date) : '';
    html += `
      <div class="import-content-item" data-item-id="${item.id}" tabindex="0" role="button" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleContentItem(this)}">
        <div class="import-content-item-header" onclick="toggleContentItem(this.parentElement)">
          <span class="import-content-item-type">${typeLabel}</span>
          <span class="import-content-item-title">${escapeContentHtml(item.title)}</span>
          <span class="import-content-item-date">${date}</span>
        </div>
        <div class="import-content-item-meta">
          ${item.meta?.message_count ? `${item.meta.message_count} messages` : ''}
          ${item.meta?.highlight_count ? `${item.meta.highlight_count} highlights` : ''}
          ${item.meta?.time_range ? `${escapeContentHtml(item.meta.time_range)}` : (item.meta?.duration_minutes ? `${item.meta.duration_minutes} min` : '')}
          ${item.meta?.attendee_names?.length ? ` · ${item.meta.attendee_names.map(n => escapeContentHtml(n)).join(', ')}` : (item.meta?.attendee_count ? ` · ${item.meta.attendee_count} attendees` : '')}
          ${item.meta?.location ? ` · ${escapeContentHtml(item.meta.location)}` : ''}
          ${item.meta?.author ? `· ${escapeContentHtml(item.meta.author)}` : ''}
          ${item.meta?.tags?.length ? `· ${item.meta.tags.map(t => escapeContentHtml(t)).join(', ')}` : ''}
        </div>
        ${item.preview ? `<div class="import-content-item-preview">${escapeContentHtml(stripMarkdown(item.preview))}</div>` : ''}
        <div class="import-content-item-body"><div class="no-data">Loading...</div></div>
      </div>`;
  });
  el.innerHTML = html;
}

function toggleContentItem(el) {
  const wasExpanded = el.classList.contains('expanded');
  document.querySelectorAll('.import-content-item.expanded').forEach(item => {
    item.classList.remove('expanded');
  });
  if (wasExpanded) return;

  el.classList.add('expanded');
  const body = el.querySelector('.import-content-item-body');
  const itemId = el.dataset.itemId;

  fetch(`/app/import/api/${importDetailPathSegment}/content/${encodeURIComponent(itemId)}`)
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        body.innerHTML = `<div class="no-data">${data.error}</div>`;
        return;
      }
      body.innerHTML = renderContentDetail(data);
    })
    .catch(() => {
      body.innerHTML = '<div class="no-data">Error loading content</div>';
    });
}

function renderContentDetail(data) {
  if (!data.content || !data.content.length) {
    return '<div class="no-data">No content available</div>';
  }

  return data.content.map(part => {
    if (part.type === 'markdown') {
      return `<div class="import-content-markdown">${window.AppServices.renderMarkdown(part.content)}</div>`;
    }
    const speaker = part.speaker || 'Unknown';
    const cls = speaker === 'Human' ? 'human' : 'assistant';
    return `<div class="import-content-message"><span class="import-content-speaker ${cls}">${speaker}:</span> ${escapeContentHtml(part.text || '')}</div>`;
  }).join('');
}

function renderContentPagination(data) {
  const el = document.getElementById('contentPagination');
  if (data.pages <= 1) {
    el.innerHTML = '';
    return;
  }
  let html = '';
  html += `<button ${data.page <= 1 ? 'disabled' : ''} onclick="loadContent(${data.page - 1})">prev</button>`;
  const start = Math.max(1, data.page - 2);
  const end = Math.min(data.pages, data.page + 2);
  for (let i = start; i <= end; i++) {
    html += `<button class="${i === data.page ? 'active' : ''}" onclick="loadContent(${i})">${i}</button>`;
  }
  html += `<button ${data.page >= data.pages ? 'disabled' : ''} onclick="loadContent(${data.page + 1})">next</button>`;
  el.innerHTML = html;
}

function escapeContentHtml(str) {
  if (!str) return '';
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function stripMarkdown(str) {
  if (!str) return '';
  return str
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/\*([^*]+)\*/g, '$1')
    .replace(/^[-*+]\s+/gm, '')
    .replace(/^\d+\.\s+/gm, '')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/^>\s+/gm, '')
    .trim();
}

document.getElementById('contentSearch').addEventListener('input', function() {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    contentSearch = this.value.trim();
    loadContent(1);
  }, 300);
});

document.getElementById('contentMonth').addEventListener('change', function() {
  contentMonth = this.value;
  loadContent(1);
});

// Load import details
function loadImportDetail() {
  window.apiJson(`/app/import/api/${importDetailPathSegment}`)
    .then(data => {
      document.getElementById('importMeta').innerHTML = window.ImportDetail.renderMeta(data);
      document.getElementById('overviewContent').innerHTML = window.ImportDetail.renderDetail(data);
    })
    .catch(err => {
      const serverMessage = err?.serverMessage || err?.message || '';
      const escapedMessage = window.AppServices.escapeHtml(serverMessage);
      document.getElementById('importMeta').innerHTML = `<div class="surface-state-refresh-error">Couldn&#39;t load import details.${escapedMessage ? ` ${escapedMessage}` : ''}</div>`;
      document.getElementById('overviewContent').innerHTML = '<div class="no-data">overview unavailable</div>';
    });
}

function initImportDetail() {
  const listView = document.getElementById('importListView');
  if (listView) listView.style.display = 'none';

  const detailView = document.getElementById('importDetailView');
  if (detailView) detailView.style.display = '';

  const heading = document.getElementById('importDetailHeading');
  if (heading) heading.textContent = `import: ${window.JournalFormat.day(importDetailTimestamp.slice(0, 8))} · ${window.JournalFormat.segmentTime(importDetailTimestamp.slice(9))}`;

  loadImportDetail();

  window.appEvents.listen('importer', { correlationKey: 'import_id' }, eventData => {
    if (!IMPORT_ROW_EVENTS.has(eventData.event)) return;
    if (eventData.import_id !== importDetailTimestamp) return;
    loadImportDetail();
  });

  function openContentFromHash() {
    if (window.location.hash !== '#content' || !detailView?.isConnected) return;
    tabs.forEach(t => t.classList.toggle('active', t.dataset.target === 'content'));
    contents.forEach(c => c.classList.toggle('active', c.id === 'content'));
    if (!contentLoaded) loadContent(1);
  }
  window.addEventListener('hashchange', openContentFromHash);
  openContentFromHash();
}

window.loadContent = loadContent;
window.toggleContentItem = toggleContentItem;

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initImportDetail);
} else {
  initImportDetail();
}
})();
</script>
