[package]
name = "solstone-core-import-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
# Standalone helper-process fixture for the import_metadata_component integration test.
# Intentionally not installed or referenced by the production library.
name = "solstone-import-web-metadata-stub"
path = "tests/fixtures/metadata_stub.rs"
test = false

[dependencies]
axum = { workspace = true, features = ["tokio", "multipart"] }
base64 = "0.22.1"
chrono.workspace = true
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
solstone-core-convey-http.workspace = true
solstone-core-callosum.workspace = true
solstone-core-import.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-journal-config-write.workspace = true
solstone-core-entity-matching.workspace = true
tempfile = "3.24.0"
tokio = { workspace = true, features = ["fs", "io-util", "rt"] }

[dev-dependencies]
jsonschema.workspace = true
nix = { workspace = true, features = ["process", "signal"] }
solstone-core-convey-shell.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt"] }
tower.workspace = true
