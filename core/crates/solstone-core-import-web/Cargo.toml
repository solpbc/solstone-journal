[package]
name = "solstone-core-import-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# Hands the dashboard shell's build script this crate's served asset list.
links = "solstone_convey_assets_import_web"

[lints]
workspace = true

[dependencies]
axum = { workspace = true, features = ["tokio", "multipart"] }
chrono.workspace = true
chrono-tz.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
solstone-core-convey-http.workspace = true
solstone-core-callosum = { workspace = true, features = ["wire"] }
solstone-core-facets.workspace = true
solstone-core-generate.workspace = true
solstone-core-import.workspace = true
solstone-core-import-sources.workspace = true
solstone-core-indexer-store.workspace = true
solstone-core-removals.workspace = true
solstone-core-trash.workspace = true
solstone-core-journal-archive.workspace = true
solstone-core-journal-config.workspace = true
solstone-core-journal-config-write.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-processing-record.workspace = true
solstone-core-segment.workspace = true
solstone-core-system.workspace = true
solstone-core-system-health.workspace = true
tempfile = "3.24.0"
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["io"] }

[dev-dependencies]
filetime = "0.2.29"
solstone-core-callosum = { workspace = true, features = ["full-tests"] }
solstone-core-convey-shell.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt"] }
tower.workspace = true
zip = { version = "=9.0.3", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["process", "signal"] }

[features]
full-tests = []
