[package]
name = "solstone-core-location"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
full-tests = []

[dependencies]
chrono.workspace = true
chrono-tz.workspace = true
log.workspace = true
lzma-rs.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
solstone-core-artifact-download.workspace = true
solstone-core-assets.workspace = true
solstone-core-callosum.workspace = true
solstone-core-indexer-store.workspace = true
solstone-core-journal-config.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-sol-link = { workspace = true, features = ["host"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

[dev-dependencies]
solstone-core-artifact-download = { workspace = true, features = ["runtime-fetch-test"] }
solstone-core-assets = { workspace = true, features = ["runtime-fetch-test"] }
tempfile = "3.24.0"
