(() => {
  // --- owner-facing strings ---
  const STRINGS = {

  // --- end owner-facing strings ---

  const fmt = (key, vars) => String(STRINGS[key] ?? '').replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] != null ? String(vars[k]) : m));
  const cssId = (v) => (window.CSS && CSS.escape ? CSS.escape(String(v)) : String(v).replace(/["\\]/g, '\\$&'));

  const ACTOR_HEADER = 'x-solstone-actor';
  const ACTOR_OWNER = 'owner';

  const esc = (s) => (window.AppServices?.escapeHtml ? window.AppServices.escapeHtml(s) : String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));

  const MONTHS_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  const state = {
    day: null,
    facet: null,
    includeHidden: false,
    view: null,
    selectedFacet: null,
    selectedId: null,
    editing: false,
    isDirty: false,
    expandedEvidence: false,
    outlineBlock: null,
    fetchSequence: 0,
    justHidden: null,
    listboxOpen: false
  };

  function parsePathDay() {
    const m = window.location.pathname.match(/\/app\/activities\/(\d{8})/);
    return m ? m[1] : (window.JournalClock ? window.JournalClock.today() : '');
  }

  function readUrlParams() {
    const params = new URLSearchParams(window.location.search);
    state.facet = params.get('facet') || null;
    const hash = (window.location.hash || '').replace(/^#/, '');
    if (hash) {
      const slash = hash.indexOf('/');
      if (slash !== -1) {
        state.selectedFacet = decodeURIComponent(hash.slice(0, slash));
        state.selectedId = decodeURIComponent(hash.slice(slash + 1));
      } else {
        state.selectedId = decodeURIComponent(hash);
        state.selectedFacet = null;
      }
    } else {
      state.selectedFacet = null;
      state.selectedId = null;
    }
  }

  function isMobile() {
    return window.matchMedia ? window.matchMedia('(max-width: 700px)').matches : false;
  }

  function formatInstant(timestamp) {
    if (!timestamp) return '';
    try {
      const d = new Date(timestamp);
      if (isNaN(d.getTime())) return '';
      if (window.JournalClock && window.JournalClock.parts) {
        const p = window.JournalClock.parts(d);
        const m = MONTHS_SHORT[Number(p.month) - 1] || '';
        const day = String(Number(p.day));
        const hr = String(p.hour).padStart(2, '0');
        const min = String(p.minute).padStart(2, '0');
        return `${m} ${day}, ${hr}:${min}`;
      }
      const m = MONTHS_SHORT[d.getUTCMonth()];
      const day = String(d.getUTCDate());
      const hr = String(d.getUTCHours()).padStart(2, '0');
      const min = String(d.getUTCMinutes()).padStart(2, '0');
      return `${m} ${day}, ${hr}:${min}`;
    } catch {
      return '';
    }
  }

  function formatPeople(people) {
    if (!Array.isArray(people) || !people.length) return '';
    if (people.length === 1) return fmt('people-one', { a: people[0] });
    if (people.length === 2) return fmt('people-two', { a: people[0], b: people[1] });
    const rem = people.length - 2;
    return fmt(rem === 1 ? 'people-many-one' : 'people-many', { a: people[0], b: people[1], n: rem });
  }

  function formatFieldList(fields) {
    const arr = Array.isArray(fields) ? fields : [];
    const hasTitle = arr.includes('title');
    const hasDesc = arr.includes('description');
    const hasDetails = arr.includes('details');
    if (hasTitle && hasDesc && hasDetails) return STRINGS['fields-all'];
    if (hasTitle && hasDetails) return STRINGS['fields-title-details'];
    if (hasTitle && hasDesc) return STRINGS['fields-title-description'];
    if (hasTitle) return STRINGS['fields-title'];
    if (hasDesc && hasDetails) return STRINGS['fields-description-details'];
    if (hasDesc) return STRINGS['fields-description'];
    if (hasDetails) return STRINGS['fields-details'];
    return '';
  }

  let viewLoadedOnce = false;

  async function fetchView() {
    const seq = ++state.fetchSequence;
    const params = new URLSearchParams();
    if (state.facet) params.set('facet', state.facet);
    if (state.includeHidden) params.set('include_hidden', '1');
    const q = params.toString() ? '?' + params.toString() : '';
    const url = `/app/activities/api/day/${state.day}/view${q}`;

    try {
      const data = await (window.apiJson ? window.apiJson(url) : fetch(url).then(r => r.json()));
      if (seq !== state.fetchSequence) return;
      state.view = data;
      viewLoadedOnce = true;
      showContent();

      // Validate facet
      if (state.facet && Array.isArray(data.facets)) {
        const found = data.facets.some(f => f.name === state.facet);
        if (!found) {
          const u = new URL(window.location.href);
          u.searchParams.delete('facet');
          window.history.replaceState(null, '', u.pathname + (u.search ? u.search : '') + u.hash);
          state.facet = null;
          fetchView();
          const host = document.querySelector('[data-date-nav]');
          if (host && typeof host.refresh === 'function') host.refresh();
          return;
        }
      }

      // Validate selection (a record just hidden stays selected so its unhide is reachable)
      if (state.selectedId) {
        const item = (data.items || []).find(it => it.id === state.selectedId && (!state.selectedFacet || it.facet === state.selectedFacet));
        if (!item && !justHiddenMatches(state.selectedId, state.selectedFacet)) {
          const u = new URL(window.location.href);
          u.hash = '';
          window.history.replaceState(null, '', u.pathname + u.search);
          state.selectedId = null;
          state.selectedFacet = null;
        }
      }

      render();
    } catch (err) {
      if (seq !== state.fetchSequence) return;
      const stateArea = document.querySelector('[data-state-area]');
      if (!stateArea || !window.SurfaceState) return;
      const errorHtml = window.SurfaceState.error({ heading: STRINGS['load-error'], retry: true, detail: err });
      if (!viewLoadedOnce) {
        stateArea.innerHTML = errorHtml;
        stateArea.setAttribute('data-state', 'error');
        stateArea.querySelector('.surface-state-retry')?.addEventListener('click', () => {
          showLoading();
          fetchView();
        });
      } else {
        clearRefreshError();
        window.SurfaceState.replaceLoading('act-state-area', errorHtml);
        const refreshError = stateArea.nextElementSibling;
        if (refreshError && refreshError.classList.contains('surface-state-refresh-error')) {
          refreshError.querySelector('.surface-state-retry')?.addEventListener('click', () => fetchView());
        }
      }
    }
  }

  function showLoading() {
    const stateArea = document.querySelector('[data-state-area]');
    if (stateArea && window.SurfaceState) {
      stateArea.innerHTML = window.SurfaceState.loading({ text: STRINGS['loading'] });
      stateArea.setAttribute('data-state', 'loading');
    }
  }

  function clearRefreshError() {
    const stateArea = document.querySelector('[data-state-area]');
    const next = stateArea && stateArea.nextElementSibling;
    if (next && next.classList.contains('surface-state-refresh-error')) next.remove();
  }

  function showContent() {
    const stateArea = document.querySelector('[data-state-area]');
    if (stateArea) {
      stateArea.innerHTML = '';
      stateArea.removeAttribute('data-state');
    }
    clearRefreshError();
    const content = document.querySelector('[data-content-area]');
    if (content) content.hidden = false;
  }

  function justHiddenMatches(id, facet) {
    const jh = state.justHidden;
    return Boolean(jh && jh.item.id === id && (!facet || jh.item.facet === facet));
  }

  function computeDayContext() {
    if (!window.JournalClock) return 'past';
    const today = window.JournalClock.today();
    return state.day === today ? 'today' : 'past';
  }

  function render() {
    if (!state.view) return;
    renderHeader();
    renderMain();
    renderPanel();
  }

  function renderHeader() {
    // Scope listbox
    const labelEl = document.querySelector('[data-scope-label]');
    const listboxEl = document.querySelector('[data-scope-listbox]');
    const btnEl = document.querySelector('[data-scope-btn]');
    const facets = state.view.facets || [];

    const nonMutedTotal = facets.filter(f => !f.muted).reduce((sum, f) => sum + (f.count || 0), 0);
    const selectedObj = state.facet ? facets.find(f => f.name === state.facet) : null;
    if (labelEl) {
      labelEl.textContent = selectedObj ? fmt('scope-facet', { facet: selectedObj.title || selectedObj.name }) : STRINGS['scope-all'];
      labelEl.setAttribute('data-copy-key', selectedObj ? 'scope-facet' : 'scope-all');
    }

    // Border tint: columns region only, not whole content area
    const columnsArea = document.querySelector('[data-columns-area]');
    if (columnsArea) {
      columnsArea.style.borderTopColor = selectedObj && selectedObj.color ? selectedObj.color : 'transparent';
    }

    if (listboxEl) {
      let opts = `<li class="act-scope-option" role="option" aria-selected="${state.facet === null}" data-facet="" tabindex="-1"><span data-copy-key="scope-all-option">${STRINGS['scope-all-option']}</span><span class="act-scope-count">${nonMutedTotal}</span></li>`;
      facets.filter(f => !f.muted).forEach(f => {
        const dot = f.color ? `<span class="act-scope-dot" style="background-color: ${esc(f.color)}"></span>` : '';
        opts += `<li class="act-scope-option" role="option" aria-selected="${state.facet === f.name}" data-facet="${esc(f.name)}" tabindex="-1"><span>${dot} ${esc(f.title || f.name)}</span><span class="act-scope-count">${f.count || 0}</span></li>`;
      });
      facets.filter(f => f.muted).forEach(f => {
        const dot = f.color ? `<span class="act-scope-dot" style="background-color: ${esc(f.color)}"></span>` : '';
        opts += `<li class="act-scope-option act-scope-option--muted" role="option" aria-selected="${state.facet === f.name}" data-facet="${esc(f.name)}" tabindex="-1"><span>${dot} ${esc(f.title || f.name)}</span><span class="act-scope-count">${f.count || 0}</span></li>`;
      });
      listboxEl.innerHTML = opts;
    }

    // Note under heading
    const noteEl = document.querySelector('[data-day-note]');
    if (noteEl) {
      const ctx = computeDayContext();
      if (ctx === 'today') {
        noteEl.textContent = STRINGS['today-note'];
        noteEl.setAttribute('data-copy-key', 'today-note');
        noteEl.hidden = false;
      } else {
        noteEl.hidden = true;
      }
    }
  }

  function renderMain() {
    const items = state.view.items || [];
    const untimedArea = document.querySelector('[data-untimed-area]');
    const untimedList = document.querySelector('[data-untimed-list]');
    const timelineWrap = document.querySelector('[data-timeline-wrap]');
    const footerArea = document.querySelector('[data-footer-area]');
    const emptyArea = document.querySelector('[data-empty-area]');
    const blocksContainer = document.querySelector('[data-blocks-container]');
    const timeAxis = document.querySelector('[data-time-axis]');
    const gridLines = document.querySelector('[data-grid-lines]');
    const nowLine = document.querySelector('[data-now-line]');

    const untimed = items.filter(it => it.start_min == null);
    const timed = items.filter(it => it.start_min != null);
    // A record just hidden keeps its place as an outline, laid out like any block,
    // so the records beside it keep their lanes until the owner moves on.
    const outlineItem = state.outlineBlock && state.justHidden && !state.includeHidden
      && state.justHidden.item.start_min != null
      && !timed.some(it => it.id === state.justHidden.item.id && it.facet === state.justHidden.item.facet)
      ? { ...state.justHidden.item, _outline: true }
      : null;
    if (outlineItem) timed.push(outlineItem);

    // Empty state check. An empty today still draws its column and now line
    // under the message, so the morning reads as today's timeline.
    const emptyToday = !items.length && !outlineItem && computeDayContext() === 'today';
    if (emptyArea) emptyArea.classList.toggle('act-empty--above-column', emptyToday);
    if (!items.length && !outlineItem) {
      if (timelineWrap) timelineWrap.hidden = !emptyToday;
      if (untimedArea) untimedArea.hidden = true;
      if (emptyArea) {
        emptyArea.hidden = false;
        const ctx = computeDayContext();
        if (state.facet) {
          const facets = state.view.facets || [];
          const otherHasCounts = facets.some(f => !f.muted && f.name !== state.facet && f.count > 0);
          if (otherHasCounts) {
            const chosen = facets.find(f => f.name === state.facet);
            emptyArea.innerHTML = `<h2 class="act-empty-heading" data-copy-key="empty-facet-heading">${esc(fmt('empty-facet-heading', { facet: chosen ? (chosen.title || chosen.name) : state.facet }))}</h2><p class="act-empty-body" data-copy-key="empty-facet-body">${STRINGS['empty-facet-body']}</p><button type="button" class="act-empty-btn" data-copy-key="empty-facet-show-all">${STRINGS['empty-facet-show-all']}</button>`;
            emptyArea.querySelector('[data-copy-key="empty-facet-show-all"]')?.addEventListener('click', () => {
              selectFacet(null);
            });
          } else {
            renderGenericEmpty(emptyArea, ctx);
          }
        } else {
          renderGenericEmpty(emptyArea, ctx);
        }
      }
      if (!emptyToday) {
        renderFooter();
        return;
      }
    } else {
      if (emptyArea) emptyArea.hidden = true;
      if (timelineWrap) timelineWrap.hidden = false;
    }

    // Untimed render
    if (untimed.length) {
      untimedArea.hidden = false;
      let uhtml = '';
      untimed.forEach(it => {
        const fObj = (state.view.facets || []).find(f => f.name === it.facet);
        const fColor = fObj && fObj.color ? fObj.color : '';
        const dot = !state.facet && fColor ? `<span class="act-block-dot" style="background-color: ${esc(fColor)}"></span>` : '';
        uhtml += `<button type="button" class="act-untimed-row" data-id="${esc(it.id)}" data-facet="${esc(it.facet)}">${dot}<span class="act-untimed-label">${esc(it.activity_label || it.kind)}</span><span class="act-untimed-title">${esc(it.title)}</span></button>`;
      });
      untimedList.innerHTML = uhtml;
    } else {
      untimedArea.hidden = true;
    }

    // Time scale calculation
    const hourHeight = isMobile() ? 70 : 78;
    let minMinute = 8 * 60;
    let maxMinute = 18 * 60;

    const ctx = computeDayContext();
    let nowMinute = null;
    if (ctx === 'today' && window.JournalClock && window.JournalClock.parts) {
      const parts = window.JournalClock.parts();
      // parts() returns zero-padded strings; '05' * 60 + '49' would concatenate.
      nowMinute = Number(parts.hour) * 60 + Number(parts.minute);
    }

    if (timed.length) {
      minMinute = Math.min(...timed.map(it => it.start_min));
      maxMinute = Math.max(...timed.map(it => {
        const span = it.end_min != null ? (it.end_min - it.start_min) : 24;
        return it.start_min + Math.max(24, span);
      }));
      if (nowMinute != null) {
        minMinute = Math.min(minMinute, nowMinute);
        maxMinute = Math.max(maxMinute, nowMinute);
      }
    } else if (nowMinute != null) {
      minMinute = Math.min(minMinute, nowMinute);
      maxMinute = Math.max(maxMinute, nowMinute);
    }

    const startHour = Math.floor(minMinute / 60);
    const endHour = Math.ceil(maxMinute / 60);
    const totalHours = Math.max(1, endHour - startHour);
    const totalHeight = totalHours * hourHeight;

    timelineWrap.style.height = `${totalHeight}px`;

    // Render axis and grid lines
    let axisHtml = '';
    let gridHtml = '';
    for (let h = startHour; h <= endHour; h++) {
      const top = (h - startHour) * hourHeight;
      const displayHour = (h % 24 + 24) % 24;
      const label = `${String(displayHour).padStart(2, '0')}:00`;
      axisHtml += `<div class="act-time-label" style="top: ${top}px">${label}</div>`;
      if (h < endHour) {
        gridHtml += `<div class="act-grid-line" style="top: ${top}px"></div>`;
        gridHtml += `<div class="act-grid-line act-grid-line--half" style="top: ${top + hourHeight / 2}px"></div>`;
      } else {
        gridHtml += `<div class="act-grid-line" style="top: ${top}px"></div>`;
      }
    }
    timeAxis.innerHTML = axisHtml;
    gridLines.innerHTML = gridHtml;

    // Now line
    if (nowMinute != null && nowMinute >= startHour * 60 && nowMinute <= endHour * 60) {
      const nowTop = ((nowMinute - startHour * 60) / 60) * hourHeight;
      nowLine.style.top = `${nowTop}px`;
      nowLine.hidden = false;
    } else {
      nowLine.hidden = true;
    }

    // Lane allocation & block preparation
    const processed = timed.map(it => {
      const rawSpan = it.end_min != null ? (it.end_min - it.start_min) : 24;
      const drawnSpan = Math.max(24, rawSpan);
      return {
        ...it,
        drawn_span: drawnSpan,
        drawn_end: it.start_min + drawnSpan
      };
    });

    // Sort: start_min asc, drawn_span desc, id asc
    processed.sort((a, b) => {
      if (a.start_min !== b.start_min) return a.start_min - b.start_min;
      if (a.drawn_span !== b.drawn_span) return b.drawn_span - a.drawn_span;
      return a.id.localeCompare(b.id);
    });

    // Group into clusters of transitive overlap
    const clusters = [];
    let currentCluster = [];
    let clusterEnd = -1;

    processed.forEach(item => {
      if (!currentCluster.length) {
        currentCluster.push(item);
        clusterEnd = item.drawn_end;
      } else if (item.start_min < clusterEnd) {
        currentCluster.push(item);
        clusterEnd = Math.max(clusterEnd, item.drawn_end);
      } else {
        clusters.push(currentCluster);
        currentCluster = [item];
        clusterEnd = item.drawn_end;
      }
    });
    if (currentCluster.length) clusters.push(currentCluster);

    // Assign lanes per cluster
    clusters.forEach(cluster => {
      const laneEnds = [];
      cluster.forEach(item => {
        let assignedLane = -1;
        for (let i = 0; i < laneEnds.length; i++) {
          if (laneEnds[i] <= item.start_min) {
            assignedLane = i;
            laneEnds[i] = item.drawn_end;
            break;
          }
        }
        if (assignedLane === -1) {
          assignedLane = laneEnds.length;
          laneEnds.push(item.drawn_end);
        }
        item.lane = assignedLane;
      });
      const laneCount = Math.max(1, laneEnds.length);
      cluster.forEach(item => {
        item.cluster_lanes = laneCount;
        item.fraction = laneCount === 1 ? '1' : `1/${laneCount}`;
      });
    });

    // Sort for DOM order: start_min asc, lane asc
    processed.sort((a, b) => {
      if (a.start_min !== b.start_min) return a.start_min - b.start_min;
      return a.lane - b.lane;
    });

    // Render blocks
    let bhtml = '';
    processed.forEach(item => {
      const top = ((item.start_min - startHour * 60) / 60) * hourHeight;
      const height = (item.drawn_span / 60) * hourHeight;
      const leftPct = (item.lane / item.cluster_lanes) * 100;
      const widthPct = (1 / item.cluster_lanes) * 100;

      if (item._outline) {
        const undoIcon = window.ConveyIcons ? window.ConveyIcons.svg('undo-2') : '';
        bhtml += `<div class="act-block-outline" data-copy-key="hidden-outline" style="top: ${top}px; height: ${height}px; left: ${leftPct}%; width: ${widthPct}%;"><span>${STRINGS['hidden-outline']}</span><button type="button" class="act-unhide-btn" data-copy-key="unhide" data-outline-unhide="${esc(item.id)}" data-facet="${esc(item.facet)}">${undoIcon} ${STRINGS['unhide']}</button></div>`;
        return;
      }

      const isSelected = item.id === state.selectedId && (!state.selectedFacet || item.facet === state.selectedFacet);
      const isHidden = Boolean(item.hidden);
      const isShort = item.drawn_span < 40;

      let classes = 'act-block';
      if (isHidden) classes += ' act-block--hidden';
      if (isSelected) classes += ' act-block--selected';
      if (isShort) classes += ' act-block--short';

      // Accessible label
      const timeRange = item.end_min != null ? `${item.start}–${item.end}` : item.start;
      const facetObj = (state.view.facets || []).find(f => f.name === item.facet);
      const facetTitle = facetObj ? (facetObj.title || facetObj.name) : item.facet;
      const streamWords = item.concurrent && window.JournalFormat?.hasStreamLabel?.(item.stream) ? window.JournalFormat.stream(item.stream) : '';
      const stateWords = isHidden ? STRINGS['hidden-outline'] : '';
      const ariaLabel = `${timeRange}, ${facetTitle}${streamWords ? ', ' + streamWords : ''}${stateWords ? ', ' + stateWords : ''}: ${item.title}`;

      // Line 1
      const facetColor = facetObj && facetObj.color ? facetObj.color : '';
      const dot = !state.facet && facetColor ? `<span class="act-block-dot" style="background-color: ${esc(facetColor)}"></span>` : '';
      const pencil = item.edited_by_owner && window.ConveyIcons ? `<span class="act-block-icon">${window.ConveyIcons.svg('pencil')}</span>` : '';
      const line1 = `<div class="act-block-line1">${dot}<span class="act-block-time">${esc(timeRange)}</span>${pencil}</div>`;

      // Line 2
      const sourceSpan = streamWords ? `<span class="act-block-source" title="${esc(item.stream)}">${esc(streamWords)}</span>` : '';
      const eyeIcon = isHidden && window.ConveyIcons ? `<span class="act-block-icon">${window.ConveyIcons.svg('eye-off')}</span> ` : '';
      const line2 = `<div class="act-block-line2">${sourceSpan}<span class="act-block-title">${eyeIcon}${esc(item.title)}</span></div>`;

      bhtml += `<button type="button" class="${classes}" data-id="${esc(item.id)}" data-facet="${esc(item.facet)}" data-lane="${item.lane}" data-width="${item.fraction}" data-drawn-minutes="${item.drawn_span}" style="top: ${top}px; height: ${height}px; left: ${leftPct}%; width: ${widthPct}%;" aria-pressed="${isSelected}" aria-label="${esc(ariaLabel)}">${line1}${line2}</button>`;
    });

    blocksContainer.innerHTML = bhtml;
    renderFooter();
  }

  function renderGenericEmpty(emptyArea, ctx) {
    if (ctx === 'today') {
      emptyArea.innerHTML = `<h2 class="act-empty-heading" data-copy-key="empty-today-heading">${STRINGS['empty-today-heading']}</h2><p class="act-empty-body" data-copy-key="empty-today-body">${STRINGS['empty-today-body']}</p>`;
    } else {
      emptyArea.innerHTML = `<h2 class="act-empty-heading" data-copy-key="empty-past-heading">${STRINGS['empty-past-heading']}</h2><p class="act-empty-body" data-copy-key="empty-past-body">${STRINGS['empty-past-body']}</p>`;
    }
  }

  function renderFooter() {
    const footerArea = document.querySelector('[data-footer-area]');
    if (!footerArea) return;
    const count = state.view.hidden_count || 0;
    if (count > 0) {
      footerArea.hidden = false;
      const label = footerArea.querySelector('[data-copy-key="hidden-footer"]') || footerArea.querySelector('[data-copy-key="showing-hidden"]') || footerArea.querySelector('.act-footer-count');
      if (label) {
        if (state.includeHidden) {
          label.textContent = fmt('showing-hidden', { n: count });
          label.setAttribute('data-copy-key', 'showing-hidden');
        } else {
          label.textContent = fmt('hidden-footer', { n: count });
          label.setAttribute('data-copy-key', 'hidden-footer');
        }
      }
      const btn = footerArea.querySelector('[data-toggle-hidden]');
      if (btn) {
        btn.textContent = state.includeHidden ? STRINGS['stop-showing-hidden'] : STRINGS['show-hidden'];
        btn.setAttribute('data-copy-key', state.includeHidden ? 'stop-showing-hidden' : 'show-hidden');
      }
    } else {
      footerArea.hidden = true;
    }
  }

  function renderPanel() {
    const panelArea = document.querySelector('[data-panel-area]');
    if (!panelArea) return;

    const items = state.view.items || [];
    const mobile = isMobile();

    // Reconcile dialog role
    if (mobile && state.selectedId) {
      panelArea.setAttribute('role', 'dialog');
      panelArea.setAttribute('aria-modal', 'true');
    } else {
      panelArea.removeAttribute('role');
      panelArea.removeAttribute('aria-modal');
    }

    if (!state.selectedId || (!items.length && !justHiddenMatches(state.selectedId, state.selectedFacet))) {
      if (mobile) {
        panelArea.hidden = true;
        panelArea.innerHTML = '';
      } else {
        panelArea.hidden = false;
        if (!items.length) {
          panelArea.innerHTML = '';
        } else {
          panelArea.innerHTML = `<div class="act-panel-empty" data-copy-key="empty-pick">${STRINGS['empty-pick']}</div>`;
        }
      }
      return;
    }

    panelArea.hidden = false;
    const found = items.find(it => it.id === state.selectedId && (!state.selectedFacet || it.facet === state.selectedFacet));
    const justHidden = !found && justHiddenMatches(state.selectedId, state.selectedFacet);
    const item = found || (justHidden ? { ...state.justHidden.item, hidden: true, hidden_reason: 'owner' } : null);
    if (!item) {
      panelArea.innerHTML = '';
      return;
    }

    if (state.editing) {
      renderEditForm(panelArea, item);
      return;
    }

    let phtml = '';
    if (mobile) {
      phtml += `<div class="act-panel-grab"></div><button type="button" class="act-btn" data-copy-key="sheet-close" data-close-sheet style="align-self: flex-end;">${STRINGS['sheet-close']}</button>`;
    }

    // Title
    phtml += `<div class="act-panel-header"><div class="act-panel-title-wrap"><h2 class="act-panel-title">${esc(item.title)}</h2></div>`;

    // Meta
    const timeRange = item.end_min != null ? `${item.start}–${item.end}` : item.start;
    const facetObj = (state.view.facets || []).find(f => f.name === item.facet);
    const facetTitle = facetObj ? (facetObj.title || facetObj.name) : item.facet;
    const dot = !state.facet && facetObj && facetObj.color ? `<span class="act-block-dot" style="background-color: ${esc(facetObj.color)}"></span>` : '';
    const editedCue = item.edited_by_owner ? `<span class="act-cue" data-copy-key="cue-edited">${STRINGS['cue-edited']}</span>` : '';
    let metaSource = '';
    if (item.mixed) {
      metaSource = STRINGS['source-mixed'];
    } else if (item.stream && item.stream !== '_default' && window.JournalFormat?.hasStreamLabel?.(item.stream)) {
      metaSource = window.JournalFormat.stream(item.stream);
    } else if (item.kind === 'detected') {
      metaSource = STRINGS['source-unknown'];
    }
    const metaSourceHtml = metaSource ? `<span class="act-panel-source">${esc(metaSource)}</span> · ` : '';
    phtml += `<div class="act-panel-meta"><span class="act-panel-time">${esc(timeRange)}</span> · ${metaSourceHtml}<span class="act-panel-kind">${esc(item.activity_label || item.kind)}</span> · <span>${dot} ${esc(facetTitle)}</span>${editedCue}</div></div>`;

    // Hidden status & reason line
    if (item.hidden) {
      if (justHidden) {
        phtml += `<div class="act-panel-status" role="status" data-copy-key="hidden-status">${STRINGS['hidden-status']}</div>`;
      }
      const reasonKey = `reason-${item.hidden_reason || 'other'}`;
      phtml += `<div class="act-panel-hidden-reason" data-copy-key="${reasonKey}">${STRINGS[reasonKey] || STRINGS['reason-other']}</div>`;
    }

    // What the calendar had scheduled then, and where a device was, beside the activity
    if (item.calendar?.length || item.place) {
      phtml += '<div class="act-panel-calendar-list">';
      for (const meeting of item.calendar || []) {
        const key = meeting.title ? 'calendar-then' : 'calendar-then-untitled';
        const parts = [fmt(key, { title: meeting.title })];
        if (meeting.start && meeting.end) parts.push(`${meeting.start}–${meeting.end}`);
        if (meeting.people?.length) parts.push(formatPeople(meeting.people));
        phtml += `<div class="act-panel-calendar" data-copy-key="${key}">${esc(parts.join(' · '))}</div>`;
      }
      if (item.place) {
        const words = fmt('place-then', { device: item.place.device, words: item.place.words });
        phtml += `<div class="act-panel-calendar"><a class="act-panel-place-link" href="${esc(item.place.href)}" data-copy-key="place-then">${esc(words)}</a></div>`;
      }
      phtml += '</div>';
    }

    // Summary & People
    if (item.summary != null) {
      phtml += `<div class="act-panel-section"><h3 class="act-panel-heading" data-copy-key="heading-summary">${STRINGS['heading-summary']}</h3><p class="act-panel-text">${esc(item.summary)}</p></div>`;
    }
    if (item.people?.length) {
      phtml += `<div class="act-panel-people" data-copy-key="people">${esc(formatPeople(item.people))}</div>`;
    }

    // Description
    if (item.description && item.description !== item.title) {
      phtml += `<div class="act-panel-section"><h3 class="act-panel-heading" data-copy-key="heading-description">${STRINGS['heading-description']}</h3><p class="act-panel-text">${esc(item.description)}</p></div>`;
    }

    // Details
    if (item.details) {
      phtml += `<div class="act-panel-section"><h3 class="act-panel-heading" data-copy-key="heading-details">${STRINGS['heading-details']}</h3><p class="act-panel-text">${esc(item.details)}</p></div>`;
    }

    // Evidence
    if (item.segments?.length) {
      const count = item.segments.length;
      const shown = state.expandedEvidence ? item.segments : item.segments.slice(0, 4);
      const openKey = mobile ? 'evidence-open-narrow' : 'evidence-open';
      let eitems = '';
      shown.forEach(seg => {
        const key = seg.key || '';
        const stream = seg.stream || null;
        const href = stream ? `/app/transcripts/${state.day}?stream=${encodeURIComponent(stream)}#${encodeURIComponent(key)}` : `/app/transcripts/${state.day}#${encodeURIComponent(key)}`;
        let parts = [];
        if (seg.start) parts.push(seg.start);
        if (seg.seconds != null) {
          const m = Math.max(1, Math.round(seg.seconds / 60));
          parts.push(fmt('segment-minutes', { n: m }));
        }
        let segText = parts.join(' · ');
        if (item.mixed && seg.stream) {
          const segStreamWords = window.JournalFormat?.hasStreamLabel?.(seg.stream) ? window.JournalFormat.stream(seg.stream) : seg.stream;
          if (segStreamWords) segText += ` · ${segStreamWords}`;
        }
        eitems += `<li class="act-panel-evidence-item"><span data-copy-key="evidence-segment">${esc(segText)}</span><a class="act-panel-evidence-link" href="${esc(href)}" data-copy-key="${openKey}">${STRINGS[openKey]}</a></li>`;
      });
      const showAllBtn = (!state.expandedEvidence && count > 4) ? `<button type="button" class="act-btn" data-copy-key="evidence-show-all" data-expand-evidence>${esc(fmt('evidence-show-all', { n: count }))}</button>` : '';

      let srcWords = '';
      if (item.mixed) {
        srcWords = STRINGS['source-mixed'];
      } else if (!item.stream || item.stream === '_default' || !window.JournalFormat?.hasStreamLabel?.(item.stream)) {
        srcWords = STRINGS['source-unknown-phrase'];
      } else {
        srcWords = window.JournalFormat.stream(item.stream);
      }
      const timePart = item.end ? `${item.start}–${item.end}` : (item.start || '');
      const countLine = fmt(count === 1 ? 'segments-one' : 'segments-many', { n: count, source: srcWords, range: timePart });

      phtml += `<div class="act-panel-section"><h3 class="act-panel-heading" data-copy-key="evidence-heading">${STRINGS['evidence-heading']}</h3><div class="act-panel-text" data-copy-key="evidence-count">${esc(countLine)}</div><ul class="act-panel-evidence-list">${eitems}</ul>${showAllBtn}</div>`;
    }

    // History
    const historyEntries = [];
    if (item.kind === 'detected' && item.found_at) {
      const foundDate = formatInstant(item.found_at);
      let foundKey = 'history-found-unknown';
      let streamWords = '';
      if (item.mixed) {
        foundKey = 'history-found-mixed';
      } else if (item.stream && item.stream !== '_default' && window.JournalFormat?.hasStreamLabel?.(item.stream)) {
        foundKey = 'history-found';
        streamWords = window.JournalFormat.stream(item.stream);
      } else {
        foundKey = 'history-found-unknown';
      }
      let foundText = STRINGS[foundKey];
      if (foundKey === 'history-found') {
        foundText = fmt('history-found', { stream: streamWords });
      }
      const foundInstant = new Date(item.found_at).getTime();
      historyEntries.push({
        instant: isNaN(foundInstant) ? 0 : foundInstant,
        isFound: true,
        html: `<li class="act-panel-history-item"><span data-copy-key="${foundKey}">${esc(foundText)}</span>${foundDate ? `<span class="act-panel-history-date">${esc(foundDate)}</span>` : ''}</li>`
      });
    }

    (item.edits || []).forEach((ed, idx) => {
      if (ed.kind === 'other') return;
      const dateStr = ed.timestamp ? formatInstant(ed.timestamp) : '';
      let kindKey = null;
      switch (ed.kind) {
        case 'grew': kindKey = 'history-grew'; break;
        case 'owner_update': kindKey = 'history-you-changed'; break;
        case 'owner_hide': kindKey = 'history-you-hid'; break;
        case 'owner_unhide': kindKey = 'history-you-unhid'; break;
        case 'command_update': kindKey = 'history-cli-changed'; break;
        case 'command_hide': kindKey = 'history-cli-hid'; break;
        case 'command_unhide': kindKey = 'history-cli-unhid'; break;
        case 'command_create': kindKey = 'history-cli-added'; break;
        default: kindKey = null; break;
      }
      let editHtml = '';
      if (kindKey) {
        let label = STRINGS[kindKey];
        if (kindKey === 'history-you-changed') {
          label = fmt('history-you-changed', { fields: formatFieldList(ed.fields) });
        }
        editHtml += `<li class="act-panel-history-item"><span data-copy-key="${kindKey}">${esc(label)}</span>${dateStr ? `<span class="act-panel-history-date">${esc(dateStr)}</span>` : ''}</li>`;
      }
      if (editHtml) {
        const editInstant = ed.timestamp ? new Date(ed.timestamp).getTime() : null;
        historyEntries.push({
          instant: editInstant != null && !isNaN(editInstant) ? editInstant : null,
          index: idx,
          isFound: false,
          html: editHtml
        });
      }
    });

    historyEntries.sort((a, b) => {
      if (a.instant != null && b.instant != null) return a.instant - b.instant;
      if (a.instant == null && b.instant != null) return 1;
      if (a.instant != null && b.instant == null) return -1;
      return (a.index || 0) - (b.index || 0);
    });

    phtml += `<div class="act-panel-section"><h3 class="act-panel-heading" data-copy-key="heading-history">${STRINGS['heading-history']}</h3><ul class="act-panel-history-list">${historyEntries.map(e => e.html).join('')}</ul></div>`;

    // Actions
    phtml += `<div class="act-panel-actions">`;
    if (!item.hidden) {
      phtml += `<button type="button" class="act-btn" data-copy-key="action-edit" data-action-edit>${STRINGS['action-edit']}</button>`;
      phtml += `<button type="button" class="act-btn" data-copy-key="action-hide" data-action-hide>${STRINGS['action-hide']}</button>`;
    } else if (item.hidden_reason === 'owner' || item.hidden_reason === 'command') {
      phtml += `<button type="button" class="act-btn" data-copy-key="action-unhide" data-action-unhide>${STRINGS['action-unhide']}</button>`;
    }
    phtml += `<span class="control-save-error" role="alert" data-control-save-error hidden></span>`;
    phtml += `</div>`;

    panelArea.innerHTML = phtml;

    // Bind panel events
    panelArea.querySelector('[data-close-sheet]')?.addEventListener('click', () => {
      closePanel();
    });
    panelArea.querySelector('[data-expand-evidence]')?.addEventListener('click', () => {
      state.expandedEvidence = true;
      renderPanel();
    });
    panelArea.querySelector('[data-action-edit]')?.addEventListener('click', () => {
      state.editing = true;
      state.isDirty = false;
      renderPanel();
    });
    panelArea.querySelector('[data-action-hide]')?.addEventListener('click', (e) => {
      mutateHide(item, e.currentTarget);
    });
    panelArea.querySelector('[data-action-unhide]')?.addEventListener('click', (e) => {
      mutateUnhide(item, e.currentTarget);
    });
  }

  function renderEditForm(panelArea, item) {
    let fhtml = `<form class="act-form" data-edit-form><div class="act-form-field"><label class="act-form-label" for="act-edit-title" data-copy-key="label-title">${STRINGS['label-title']}</label><input type="text" class="act-form-input" id="act-edit-title" name="title" value="${esc(item.title || '')}" required /></div><div class="act-form-field"><label class="act-form-label" for="act-edit-description" data-copy-key="label-description">${STRINGS['label-description']}</label><textarea class="act-form-textarea" id="act-edit-description" name="description">${esc(item.description || '')}</textarea></div><div class="act-form-field"><label class="act-form-label" for="act-edit-details" data-copy-key="label-details">${STRINGS['label-details']}</label><textarea class="act-form-textarea" id="act-edit-details" name="details" placeholder="${esc(STRINGS['details-placeholder'])}">${esc(item.details || '')}</textarea></div><div class="act-form-actions"><span class="control-save-error" role="alert" data-copy-key="save-failure" hidden>${STRINGS['save-failure']}</span><button type="button" class="act-btn" data-copy-key="cancel" data-form-cancel>${STRINGS['cancel']}</button><button type="submit" class="act-btn act-btn--primary" data-copy-key="save">${STRINGS['save']}</button></div></form>`;
    panelArea.innerHTML = fhtml;

    const form = panelArea.querySelector('[data-edit-form]');
    const titleInput = form.querySelector('input[name="title"]');
    const descInput = form.querySelector('textarea[name="description"]');
    const detailsInput = form.querySelector('textarea[name="details"]');
    titleInput.focus();

    const checkDirty = () => {
      state.isDirty = (titleInput.value !== (item.title || '') || descInput.value !== (item.description || '') || detailsInput.value !== (item.details || ''));
    };

    form.addEventListener('input', checkDirty);

    form.querySelector('[data-form-cancel]').addEventListener('click', () => {
      state.editing = false;
      state.isDirty = false;
      renderPanel();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const patch = {};
      if (titleInput.value !== (item.title || '')) patch.title = titleInput.value;
      if (descInput.value !== (item.description || '')) patch.description = descInput.value;
      if (detailsInput.value !== (item.details || '')) patch.details = detailsInput.value;

      if (!Object.keys(patch).length) {
        state.editing = false;
        state.isDirty = false;
        renderPanel();
        return;
      }

      const errEl = form.querySelector('[data-copy-key="save-failure"]');
      try {
        const url = `/app/activities/api/day/${state.day}/record/${encodeURIComponent(item.id)}/update?facet=${encodeURIComponent(item.facet)}`;
        await (window.apiJson
          ? window.apiJson(url, { method: 'POST', headers: { [ACTOR_HEADER]: ACTOR_OWNER, 'Content-Type': 'application/json' }, body: JSON.stringify({ patch }) })
          : fetch(url, { method: 'POST', headers: { [ACTOR_HEADER]: ACTOR_OWNER, 'Content-Type': 'application/json' }, body: JSON.stringify({ patch }) }).then(r => r.json()));

        state.editing = false;
        state.isDirty = false;
        await fetchView();
        document.querySelector('[data-action-edit]')?.focus();
      } catch (err) {
        if (errEl) errEl.hidden = false;
      }
    });
  }

  function postRecord(item, action, control) {
    const url = `/app/activities/api/day/${state.day}/record/${encodeURIComponent(item.id)}/${action}?facet=${encodeURIComponent(item.facet)}`;
    const opts = { method: 'POST', headers: { [ACTOR_HEADER]: ACTOR_OWNER, 'Content-Type': 'application/json' }, body: '{}' };
    if (control && window.saveControl) {
      return window.saveControl({ el: control, fetchArgs: [url, opts], revertOnError: false });
    }
    return window.apiJson(url, opts);
  }

  async function mutateHide(item, control) {
    try {
      await postRecord(item, 'mute', control);

      state.outlineBlock = true;
      state.justHidden = state.includeHidden ? null : { item };
      await fetchView();
      refreshDateNav();
      (document.querySelector(`[data-outline-unhide="${cssId(item.id)}"]`) || document.querySelector('[data-action-unhide]'))?.focus();
    } catch (_) {
      // saveControl has shown the error beside the control; the record is unchanged.
    }
  }

  async function mutateUnhide(item, control) {
    try {
      await postRecord(item, 'unmute', control);
      state.outlineBlock = null;
      state.justHidden = null;
      await fetchView();
      refreshDateNav();
      document.querySelector(`button.act-block[data-id="${cssId(item.id)}"][data-facet="${cssId(item.facet)}"]`)?.focus();
    } catch (_) {
      // saveControl has shown the error beside the control; the record is unchanged.
    }
  }

  function refreshDateNav() {
    const host = document.querySelector('[data-date-nav]');
    if (host && typeof host.refresh === 'function') host.refresh();
  }

  function selectBlock(id, facet) {
    if (state.editing && state.isDirty) {
      document.querySelector('[data-edit-form] input[name="title"]')?.focus();
      return;
    }
    if (!justHiddenMatches(id, facet)) {
      state.justHidden = null;
      state.outlineBlock = null;
    }
    state.selectedId = id;
    state.selectedFacet = facet;
    state.editing = false;
    state.isDirty = false;
    state.expandedEvidence = false;
    const hash = `#${encodeURIComponent(facet)}/${encodeURIComponent(id)}`;
    window.history.pushState(null, '', window.location.pathname + window.location.search + hash);
    renderMain();
    renderPanel();
    if (isMobile()) {
      document.querySelector('[data-panel-area]')?.focus();
    }
  }

  function closePanel() {
    if (state.editing && state.isDirty) {
      document.querySelector('[data-edit-form] input[name="title"]')?.focus();
      return;
    }
    const prevId = state.selectedId;
    state.selectedId = null;
    state.selectedFacet = null;
    state.editing = false;
    state.isDirty = false;
    window.history.pushState(null, '', window.location.pathname + window.location.search);
    renderMain();
    renderPanel();
    if (prevId) {
      document.querySelector(`button.act-block[data-id="${cssId(prevId)}"]`)?.focus();
    }
  }

  function selectFacet(facet) {
    state.justHidden = null;
    state.outlineBlock = null;
    state.facet = facet;
    state.editing = false;
    state.isDirty = false;
    const u = new URL(window.location.href);
    if (facet) u.searchParams.set('facet', facet);
    else u.searchParams.delete('facet');
    window.history.pushState(null, '', u.pathname + (u.search ? u.search : '') + u.hash);
    fetchView();
    refreshDateNav();
  }

  function toggleScopeListbox(open) {
    state.listboxOpen = open !== undefined ? open : !state.listboxOpen;
    const listbox = document.querySelector('[data-scope-listbox]');
    const btn = document.querySelector('[data-scope-btn]');
    if (listbox) listbox.hidden = !state.listboxOpen;
    if (btn) btn.setAttribute('aria-expanded', String(state.listboxOpen));
    if (state.listboxOpen) {
      listbox?.focus();
      const first = listbox?.querySelector('.act-scope-option');
      if (first) first.classList.add('act-scope-option--active');
    }
  }

  function setupEvents() {
    // Listbox keydown listener directly on listbox
    const listbox = document.querySelector('[data-scope-listbox]');
    if (listbox) {
      listbox.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 't' || e.key === 'T') {
          e.preventDefault();
          return;
        }
        const options = Array.from(listbox.querySelectorAll('.act-scope-option') || []);
        let activeIdx = options.findIndex(o => o.classList.contains('act-scope-option--active'));
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (activeIdx < options.length - 1) {
            options[activeIdx]?.classList.remove('act-scope-option--active');
            activeIdx++;
            options[activeIdx]?.classList.add('act-scope-option--active');
            options[activeIdx]?.scrollIntoView({ block: 'nearest' });
          }
          return;
        }
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (activeIdx > 0) {
            options[activeIdx]?.classList.remove('act-scope-option--active');
            activeIdx--;
            options[activeIdx]?.classList.add('act-scope-option--active');
            options[activeIdx]?.scrollIntoView({ block: 'nearest' });
          }
          return;
        }
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          if (activeIdx >= 0) {
            const facet = options[activeIdx].getAttribute('data-facet') || null;
            selectFacet(facet);
          }
          toggleScopeListbox(false);
          return;
        }
        if (e.key === 'Escape') {
          e.preventDefault();
          toggleScopeListbox(false);
          document.querySelector('[data-scope-btn]')?.focus();
          return;
        }
      });
    }

    // Media query listener
    if (window.matchMedia) {
      const mql = window.matchMedia('(max-width: 700px)');
      const onMediaChange = () => renderPanel();
      if (typeof mql.addEventListener === 'function') {
        mql.addEventListener('change', onMediaChange);
      } else if (typeof mql.addListener === 'function') {
        mql.addListener(onMediaChange);
      }
    }

    // Scope control
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-scope-btn]');
      if (btn) {
        toggleScopeListbox();
        return;
      }
      const opt = e.target.closest('.act-scope-option');
      if (opt) {
        const facet = opt.getAttribute('data-facet') || null;
        selectFacet(facet);
        toggleScopeListbox(false);
        return;
      }
      if (state.listboxOpen && !e.target.closest('.act-scope-wrap')) {
        toggleScopeListbox(false);
      }

      // Block click
      const block = e.target.closest('button.act-block');
      if (block) {
        selectBlock(block.getAttribute('data-id'), block.getAttribute('data-facet'));
        return;
      }

      // Untimed row click
      const urow = e.target.closest('.act-untimed-row');
      if (urow) {
        selectBlock(urow.getAttribute('data-id'), urow.getAttribute('data-facet'));
        return;
      }

      // Outline unhide click
      const unhideBtn = e.target.closest('[data-outline-unhide]');
      if (unhideBtn) {
        mutateUnhide({ id: unhideBtn.getAttribute('data-outline-unhide'), facet: unhideBtn.getAttribute('data-facet') }, unhideBtn);
        return;
      }

      // Backdrop click on mobile sheet
      if (isMobile() && state.selectedId && !e.target.closest('[data-panel-area]') && !e.target.closest('button.act-block') && !e.target.closest('.act-untimed-row')) {
        closePanel();
      }
    });

    // Keydown handling on document
    document.addEventListener('keydown', (e) => {
      if (state.listboxOpen) {
        const listbox = document.querySelector('[data-scope-listbox]');
        const options = Array.from(listbox?.querySelectorAll('.act-scope-option') || []);
        let activeIdx = options.findIndex(o => o.classList.contains('act-scope-option--active'));

        if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 't' || e.key === 'T') {
          e.preventDefault();
          return;
        }
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (activeIdx < options.length - 1) {
            options[activeIdx]?.classList.remove('act-scope-option--active');
            activeIdx++;
            options[activeIdx]?.classList.add('act-scope-option--active');
            options[activeIdx]?.scrollIntoView({ block: 'nearest' });
          }
          return;
        }
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (activeIdx > 0) {
            options[activeIdx]?.classList.remove('act-scope-option--active');
            activeIdx--;
            options[activeIdx]?.classList.add('act-scope-option--active');
            options[activeIdx]?.scrollIntoView({ block: 'nearest' });
          }
          return;
        }
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          if (activeIdx >= 0) {
            const facet = options[activeIdx].getAttribute('data-facet') || null;
            selectFacet(facet);
          }
          toggleScopeListbox(false);
          return;
        }
        if (e.key === 'Escape') {
          e.preventDefault();
          toggleScopeListbox(false);
          document.querySelector('[data-scope-btn]')?.focus();
          return;
        }
      }

      if (e.key === 'Escape' && state.selectedId) {
        e.preventDefault();
        closePanel();
        return;
      }
    });

    // Toggle hidden
    document.querySelector('[data-toggle-hidden]')?.addEventListener('click', () => {
      state.includeHidden = !state.includeHidden;
      state.justHidden = null;
      state.outlineBlock = null;
      fetchView();
    });

    // Popstate
    window.addEventListener('popstate', () => {
      const oldFacet = state.facet;
      const wasDirty = state.editing && state.isDirty;
      const prevSelectedId = state.selectedId;
      const prevSelectedFacet = state.selectedFacet;
      readUrlParams();
      if (state.facet !== oldFacet) {
        state.editing = false;
        state.isDirty = false;
        fetchView();
        const host = document.querySelector('[data-date-nav]');
        if (host && typeof host.refresh === 'function') host.refresh();
      } else {
        if (wasDirty) {
          state.selectedId = prevSelectedId;
          state.selectedFacet = prevSelectedFacet;
          document.querySelector('[data-edit-form] input[name="title"]')?.focus();
          return;
        }
        renderMain();
        renderPanel();
      }
    });
  }

  function init() {
    state.day = parsePathDay();
    readUrlParams();
    setupEvents();
    showLoading();
    fetchView();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
