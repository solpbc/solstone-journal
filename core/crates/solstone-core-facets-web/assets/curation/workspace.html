<style>
.curation-shell {
  max-width: 980px;
  margin: 0 auto;
  padding: 1.5em;
  display: flex;
  flex-direction: column;
  gap: 1em;
}

.curation-header {
  margin: 0;
  color: var(--ink);
  font-size: 1.6em;
  font-weight: 650;
  line-height: 1.2;
}

.curation-empty {
  margin: 0;
  color: var(--ink-faint);
  line-height: 1.45;
}

.curation-list {
  display: flex;
  flex-direction: column;
  gap: 0.85em;
}

.curation-batch {
  display: flex;
  flex-direction: column;
  gap: 0.6em;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  padding: 0.85em;
  color: var(--ink-soft);
}

.curation-toolbar {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.55em;
}

.curation-toolbar-select {
  display: flex;
  align-items: center;
  gap: 0.4em;
  color: var(--ink-soft);
  cursor: pointer;
}

.curation-item {
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  background: #fff;
  padding: 1em;
}

.curation-item[data-removing="true"] {
  opacity: 0.55;
  pointer-events: none;
}

.curation-body {
  margin: 0;
  color: var(--ink);
  line-height: 1.45;
}

.curation-item-facets {
  margin: 0.45em 0 0;
  color: var(--ink-faint);
  font-size: 0.9em;
  line-height: 1.4;
}

.curation-group-lede {
  margin: 0 0 0.6em;
  color: var(--ink);
  line-height: 1.45;
}

.curation-group-progress {
  margin: 0 0 0.85em;
  color: var(--ink-faint);
  font-size: 0.9em;
}

.curation-group-progress:empty {
  display: none;
}

.curation-select {
  display: flex;
  align-items: center;
  gap: 0.6em;
  cursor: pointer;
}

.curation-tap-target {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 44px;
  min-height: 44px;
  flex-shrink: 0;
}

.curation-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.55em;
  margin-top: 0.85em;
}

.curation-button {
  min-height: 44px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  background: #fff;
  color: var(--ink);
  padding: 0.45em 0.75em;
  font: inherit;
  cursor: pointer;
}

.curation-button:hover:not(:disabled) {
  background: #f9fafb;
}

.curation-button-primary {
  border-color: #b06a1a;
  background: #e8913a;
  color: #211b14;
}

.curation-button-primary:hover:not(:disabled) {
  background: #df8126;
}

.curation-button-link {
  border-color: transparent;
  background: transparent;
  color: var(--orange-text-aa, #a15f17);
  padding-left: 0;
  padding-right: 0;
}

.curation-button:disabled {
  cursor: not-allowed;
  opacity: 0.65;
}

.curation-preview {
  margin-top: 0.85em;
  border-top: 1px solid #f3f4f6;
  padding-top: 0.85em;
}

.curation-preview[hidden] {
  display: none;
}

.curation-preview-list {
  margin: 0;
  padding-left: 1.2em;
  color: var(--ink-soft);
  line-height: 1.45;
}

.curation-preview-lead {
  margin: 0 0 0.55em;
  color: var(--ink-soft);
  font-weight: 600;
}

.curation-preview-error {
  color: #b91c1c;
}

.curation-batch-confirm {
  color: var(--ink-soft);
}

.curation-batch-confirm[hidden] {
  display: none;
}

.curation-batch-confirm-list {
  margin: 0;
  padding-left: 1.2em;
  color: var(--ink-soft);
  line-height: 1.45;
}

.curation-batch-status {
  margin: 0;
  color: var(--ink-soft);
}

.curation-batch-status[hidden] {
  display: none;
}

.curation-batch-status-error {
  color: #b91c1c;
}

.curation-item-error {
  margin: 0.75em 0 0;
  color: #b91c1c;
  line-height: 1.4;
}

.curation-outcomes {
  display: flex;
  flex-direction: column;
  gap: 0.6em;
}

.curation-outcome {
  border: 1px solid var(--hairline);
  border-radius: 8px;
  padding: 0.8em;
  background: var(--cream-bright);
}

.curation-ambiguity-origin {
  margin: 0.45em 0 0;
  color: var(--ink-faint);
  font-size: 0.9em;
}

.curation-pair-evidence {
  margin-top: 0.85em;
  border-top: 1px solid #f3f4f6;
  padding-top: 0.85em;
}

.curation-speaker-pair-summary {
  margin: 0 0 0.65em;
  color: var(--ink-soft);
  line-height: 1.45;
}

.curation-speaker-pair-samples {
  display: grid;
  gap: 0.75em;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
}

.curation-speaker-pair-samples h3 {
  margin: 0 0 0.45em;
  color: var(--ink-soft);
  font-size: 1em;
  font-weight: 650;
}

.curation-speaker-pair-samples ul {
  margin: 0;
  padding-left: 1.2em;
  color: var(--ink-soft);
  line-height: 1.45;
}

.curation-speaker-pair-samples audio {
  display: block;
  width: 100%;
  margin-top: 0.35em;
}

.curation-speaker-pair-samples li.curation-pair-sample {
  margin-bottom: 0.65em;
}

.curation-pair-sample-readable {
  margin: 0;
  color: var(--ink);
}

.curation-pair-sample-details,
.curation-pair-technical {
  margin-top: 0.35em;
}

.curation-pair-sample-details summary,
.curation-pair-technical summary {
  cursor: pointer;
  color: var(--ink-faint);
  padding: 0.3em 0;
}

.curation-pair-sample-details ul {
  margin: 0;
  padding-left: 1.2em;
  color: var(--ink-soft);
}

.curation-pair-technical .curation-speaker-pair-summary {
  margin: 0.35em 0 0;
}

@media (max-width: 640px) {
  .curation-shell {
    padding: 1em;
  }

  .curation-actions {
    align-items: stretch;
    flex-direction: column;
  }

  .curation-toolbar {
    align-items: stretch;
    flex-direction: column;
  }

  .curation-button {
    width: 100%;
  }
}
.curation-group{border:1px solid #dfd6c9;border-radius:12px;background:#fff}.curation-group>summary{padding:18px;cursor:pointer;font-weight:600;min-height:48px}.curation-group-items{padding:0 18px 18px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}.curation-group-items>.curation-item{min-width:0;overflow-wrap:anywhere}.curation-group-items>.curation-item{content-visibility:auto;contain-intrinsic-block-size:auto 240px}.curation-group:focus-within{outline-color:#b06a1a}.curation-group>summary:focus-visible{outline:2px solid #b06a1a;outline-offset:2px}
.curation-source-dates{display:flex;flex-wrap:wrap;gap:8px 16px}.curation-source-dates a{display:inline-flex;align-items:center;min-height:46px;color:var(--orange-text-aa,#a15f17)}.curation-origin-details summary{cursor:pointer;padding:12px 0}.curation-origin-details li{overflow-wrap:anywhere}
</style>

<section class="curation-shell" data-curation-root>
</section>

<script src="/app/curation/static/curation_evidence.js"></script>
<script>
let CUR_COPY = {};
window.CUR_COPY = CUR_COPY;

(function() {
  const root = document.querySelector('[data-curation-root]');
  if (!root) return;

  // G2-35: server-resolved slug -> declared-title map (the same source
  // thinking's runs facet filter reads), refreshed on every state load.
  let curationFacetTitles = {};

  // A facet the owner already named and can see in its real form elsewhere
  // (thinking, stats) — resolve through the declared title, falling back to
  // the raw slug only when nothing was ever declared for it.
  function facetDisplayName(slug) {
    return curationFacetTitles[slug] || slug;
  }

  function renderLoading() {
    root.innerHTML = window.SurfaceState
      ? window.SurfaceState.loading({text: 'loading suggestions...'})
      : '<p>loading suggestions...</p>';
  }

  function renderError(err, retry) {
    window.logError?.(err, {context: 'curation-state'});
    root.innerHTML = window.SurfaceState
      ? window.SurfaceState.error({
          retry: true,
          serverMessage: err?.serverMessage || err?.message || '',
          detail: err
        })
      : '<p>could not load suggestions.</p><button type="button" class="surface-state-retry">try again</button>';
    root.querySelector('.surface-state-retry')?.addEventListener('click', retry, {once: true});
  }

  // Some speculative-facet names were suggested before naming guidance
  // improved and are stored slug-style (e.g. "low_light_capture"). Never
  // show that raw punctuation to the owner.
  function humanizeFacetName(name) {
    if (!name) return name;
    return name.replace(/[_-]+/g, ' ').trim();
  }

  function copyFormat(template, values) {
    let result = String(template || '');
    Object.entries(values).forEach(([key, value]) => {
      result = result.replace(new RegExp(`\\{${key}\\}`, 'g'), String(value ?? ''));
    });
    return result;
  }

  function formatSimilarity(value) {
    const number = Number(value || 0);
    return Number.isFinite(number) ? number.toFixed(2) : '0.00';
  }

  function sampleAudioHtml(sample) {
    if (!sample?.audio_url) return '';
    return `<audio controls preload="metadata" src="${escapeHtml(sample.audio_url)}"></audio>`;
  }

  // G2-25: lead with a readable date/source/time; the raw stream, segment
  // key, source file and cluster id are technical evidence, not the
  // description — they move into a per-sample disclosure.
  function speakerCandidatePairSampleHtml(sample) {
    const day = sample?.day ? String(sample.day) : '';
    const stream = sample?.stream ? String(sample.stream) : '';
    const segment = sample?.segment_key ? String(sample.segment_key) : '';
    const readable = [
      day && window.JournalFormat.day(day),
      stream && window.JournalFormat.stream(stream),
      segment && window.JournalFormat.segmentTime(segment)
    ].filter(Boolean).join(' · ');
    const rawRows = [
      day && `<li>day: ${escapeHtml(day)}</li>`,
      stream && `<li>stream: ${escapeHtml(stream)}</li>`,
      segment && `<li>segment: ${escapeHtml(segment)}</li>`,
      sample?.source && `<li>source: ${escapeHtml(sample.source)}</li>`,
      (sample?.cluster_label !== undefined && sample.cluster_label >= 0) && `<li>cluster: ${escapeHtml(sample.cluster_label)}</li>`
    ].filter(Boolean).join('');
    return `
      <li class="curation-pair-sample">
        ${readable ? `<p class="curation-pair-sample-readable">${escapeHtml(readable)}</p>` : ''}
        ${sampleAudioHtml(sample)}
        ${rawRows ? `<details class="curation-pair-sample-details"><summary>technical details</summary><ul>${rawRows}</ul></details>` : ''}
      </li>
    `;
  }

  function speakerCandidatePairEvidenceHtml(item) {
    const evidence = item.evidence || {};
    const sourceSamples = evidence.source_samples || [];
    const targetSamples = evidence.target_samples || [];
    return `
      <div class="curation-pair-evidence">
        <div class="curation-speaker-pair-samples">
          <section>
            <h3>${escapeHtml(CUR_COPY.CUR_SPEAKER_CANDIDATE_PAIR_SOURCE_LABEL)}</h3>
            <ul>${sourceSamples.map(speakerCandidatePairSampleHtml).join('')}</ul>
          </section>
          <section>
            <h3>${escapeHtml(CUR_COPY.CUR_SPEAKER_CANDIDATE_PAIR_TARGET_LABEL)}</h3>
            <ul>${targetSamples.map(speakerCandidatePairSampleHtml).join('')}</ul>
          </section>
        </div>
        <details class="curation-pair-technical">
          <summary>technical details</summary>
          <p class="curation-speaker-pair-summary">
            ${escapeHtml(CUR_COPY.CUR_SPEAKER_CANDIDATE_PAIR_SIMILARITY_LABEL)}: ${escapeHtml(formatSimilarity(evidence.similarity))}
            · ${escapeHtml(CUR_COPY.CUR_SPEAKER_CANDIDATE_PAIR_SOURCE_LABEL)} ${escapeHtml(CUR_COPY.CUR_SPEAKER_CANDIDATE_PAIR_INTERVALS_LABEL)}: ${escapeHtml(evidence.source_intervals || 0)}
            · ${escapeHtml(CUR_COPY.CUR_SPEAKER_CANDIDATE_PAIR_TARGET_LABEL)} ${escapeHtml(CUR_COPY.CUR_SPEAKER_CANDIDATE_PAIR_INTERVALS_LABEL)}: ${escapeHtml(evidence.target_intervals || 0)}
          </p>
        </details>
      </div>
    `;
  }

  function facetItemHtml(item) {
    const evidenceProps = window.CurationEvidence.buildEvidenceDrawerProps(item);
    const evidenceHtml = evidenceProps ? window.Drawer.render(evidenceProps) : '';
    return `
      <article class="curation-item" data-curation-item data-kind="facet_candidate" data-name-key="${escapeHtml(item.key)}">
        <p class="curation-body">${escapeHtml(copyFormat(CUR_COPY.CUR_FACET_BODY, {name: humanizeFacetName(item.name)}))}</p>
        <div class="curation-actions">
          <button class="curation-button curation-button-primary" type="button" data-action="facet-accept" data-name-key="${escapeHtml(item.key)}">${escapeHtml(CUR_COPY.CUR_FACET_CREATE_ACTION)}</button>
          <button class="curation-button" type="button" data-action="facet-dismiss" data-name-key="${escapeHtml(item.key)}">${escapeHtml(CUR_COPY.CUR_FACET_DISMISS_ACTION)}</button>
        </div>
        ${evidenceHtml}
        <p class="curation-item-error" hidden></p>
      </article>
    `;
  }

  // G2-26: the same source/target pair can be surfaced once per facet it
  // was detected in (91 of 835 pairs, 2-4x each). Group by pair so the
  // owner sees one item per real question, with the facets it applies to.
  function groupEntityItems(items) {
    const groups = [];
    const byPair = new Map();
    items.forEach((item) => {
      const pairKey = `${item.source_slug}|${item.target_slug}`;
      let group = byPair.get(pairKey);
      if (!group) {
        group = {
          source: item.source, target: item.target,
          source_slug: item.source_slug, target_slug: item.target_slug,
          facets: []
        };
        byPair.set(pairKey, group);
        groups.push(group);
      }
      if (!group.facets.includes(item.facet)) group.facets.push(item.facet);
    });
    return groups;
  }

  function formatFacetList(facets) {
    const names = facets.map(facetDisplayName);
    if (names.length <= 1) return names.join('');
    if (names.length === 2) return `${names[0]} and ${names[1]}`;
    return `${names.slice(0, -1).join(', ')} and ${names[names.length - 1]}`;
  }

  function entityGroupPayload(item) {
    const ds = item?.dataset || {};
    return {
      source_slug: ds.sourceSlug || '',
      target_slug: ds.targetSlug || '',
      facets: JSON.parse(ds.facets || '[]')
    };
  }

  function entityBatchItems(group) {
    return group.facets.map((facet) => ({facet, source_slug: group.source_slug, target_slug: group.target_slug}));
  }

  function entityItemHtml(group) {
    const multiFacet = group.facets.length > 1;
    const dismissAttrs = multiFacet
      ? `data-action="entity-dismiss-group"`
      : `data-action="entity-dismiss" data-facet="${escapeHtml(group.facets[0])}" data-source-slug="${escapeHtml(group.source_slug)}" data-target-slug="${escapeHtml(group.target_slug)}"`;
    return `
      <article class="curation-item" data-curation-item data-kind="entity_merge" data-facets='${escapeAttr(JSON.stringify(group.facets))}' data-source-slug="${escapeHtml(group.source_slug)}" data-target-slug="${escapeHtml(group.target_slug)}" data-source="${escapeHtml(group.source)}" data-target="${escapeHtml(group.target)}">
        <label class="curation-select">
          <span class="curation-tap-target"><input type="checkbox" data-action="entity-select"></span>
          <span class="curation-body">${escapeHtml(copyFormat(CUR_COPY.CUR_ENTITY_BODY, {a: group.source, b: group.target}))}</span>
        </label>
        ${multiFacet ? `<p class="curation-item-facets">${escapeHtml(copyFormat(CUR_COPY.CUR_ENTITY_FACETS_LABEL, {facets: formatFacetList(group.facets)}))}</p>` : ''}
        <div class="curation-actions">
          <button class="curation-button curation-button-primary" type="button" data-action="entity-preview">${escapeHtml(CUR_COPY.CUR_ENTITY_MERGE_ACTION)}</button>
          <button class="curation-button" type="button" ${dismissAttrs}>${escapeHtml(CUR_COPY.CUR_ENTITY_DISMISS_ACTION)}</button>
        </div>
        <div class="curation-preview" hidden></div>
        <p class="curation-item-error" hidden></p>
      </article>
    `;
  }

  function ambiguityItemHtml(item) {
    const origins = item?.evidence?.origins || [];
    const days = [...new Set(origins.map(origin => origin.day).filter(day => /^\d{8}$/.test(day)))].sort();
    const sourceIds = [...new Set(origins.map(origin => [origin.lane, origin.field].filter(Boolean).join(' · ')).filter(Boolean))];
    const evidence = origins.length ? `<details class="curation-origin-details">
      <summary>source evidence</summary>
      <div class="curation-source-dates">${days.map(day => `<a href="/app/transcripts/${day}">${escapeHtml(window.JournalFormat.day(day))}</a>`).join('')}</div>
      ${sourceIds.length ? `<details><summary>source identifiers</summary><ul>${sourceIds.map(id => `<li>${escapeHtml(id)}</li>`).join('')}</ul></details>` : ''}
    </details>` : '';
    const candidates = item?.evidence?.ranked_candidates || [];
    return `
      <article class="curation-item" data-curation-item data-kind="entity_ambiguity" data-ambiguity-id="${escapeHtml(item.key)}">
        <p class="curation-body">${escapeHtml(copyFormat(CUR_COPY.CUR_AMBIGUITY_BODY, {query: item.name || item.source}))}</p>
        <div class="curation-actions">
          ${candidates.map((candidate) => `
            <button class="curation-button curation-button-primary" type="button" data-action="ambiguity-resolve" data-ambiguity-id="${escapeHtml(item.key)}" data-entity-id="${escapeHtml(candidate.id)}">
              ${escapeHtml(copyFormat(CUR_COPY.CUR_AMBIGUITY_CHOOSE_ACTION, {name: candidate.name}))}
            </button>
          `).join('')}
        </div>
        ${evidence}
        <p class="curation-item-error" hidden></p>
      </article>
    `;
  }

  function entityBatchHtml() {
    return `
      <div class="curation-batch" data-curation-batch>
        <div class="curation-toolbar" data-curation-toolbar>
          <label class="curation-toolbar-select">
            <span class="curation-tap-target"><input type="checkbox" data-action="entity-select-all"></span>
            <span>${escapeHtml(CUR_COPY.CUR_ENTITY_SELECT_ALL_ACTION)}</span>
          </label>
          <button class="curation-button curation-button-primary" type="button" data-action="entity-batch-merge" disabled>${escapeHtml(CUR_COPY.CUR_ENTITY_BATCH_MERGE_ACTION)}</button>
          <button class="curation-button" type="button" data-action="entity-batch-dismiss" disabled>${escapeHtml(CUR_COPY.CUR_ENTITY_BATCH_DISMISS_ACTION)}</button>
        </div>
        <div class="curation-batch-confirm" hidden></div>
        <p class="curation-batch-status" hidden></p>
      </div>
    `;
  }

  function speakerItemHtml(item) {
    return `
      <article class="curation-item" data-curation-item data-kind="speaker_name_variant" data-key="${escapeHtml(item.key)}" data-source-id="${escapeHtml(item.source_slug)}" data-target-id="${escapeHtml(item.target_slug)}">
        <p class="curation-body">${escapeHtml(copyFormat(CUR_COPY.CUR_SPEAKER_BODY, {source: item.source, target: item.target}))}</p>
        <div class="curation-actions">
          <button class="curation-button curation-button-primary" type="button" data-action="speaker-preview">${escapeHtml(CUR_COPY.CUR_SPEAKER_MERGE_ACTION)}</button>
          <button class="curation-button" type="button" data-action="speaker-dismiss">${escapeHtml(CUR_COPY.CUR_SPEAKER_DISMISS_ACTION)}</button>
        </div>
        <div class="curation-preview" hidden></div>
        <p class="curation-item-error" hidden></p>
      </article>
    `;
  }

  function speakerCandidatePairItemHtml(item) {
    return `
      <article class="curation-item" data-curation-item data-kind="speaker_candidate_pair" data-key="${escapeAttr(item.key)}" data-anchor-a="${escapeAttr(item.source_slug)}" data-anchor-b="${escapeAttr(item.target_slug)}">
        <p class="curation-body">${escapeHtml(CUR_COPY.CUR_SPEAKER_CANDIDATE_PAIR_BODY)}</p>
        ${speakerCandidatePairEvidenceHtml(item)}
        <div class="curation-actions">
          <button class="curation-button curation-button-primary" type="button" data-action="speaker-pair-accept">${escapeHtml(CUR_COPY.CUR_SPEAKER_CANDIDATE_PAIR_MERGE_ACTION)}</button>
          <button class="curation-button" type="button" data-action="speaker-pair-dismiss">${escapeHtml(CUR_COPY.CUR_SPEAKER_CANDIDATE_PAIR_DISMISS_ACTION)}</button>
        </div>
        <p class="curation-item-error" hidden></p>
      </article>
    `;
  }

  const openReviewGroups = new Set();
  function reviewGroup(key, label, items, renderItem, toolbar = '') {
    if (!items.length) return '';
    return `<details class="curation-group" data-review-group="${key}" ${openReviewGroups.has(key) ? 'open' : ''}><summary>${label} <span data-group-count>(${items.length})</span></summary><div class="curation-group-items">${toolbar}${items.map(renderItem).join('')}</div></details>`;
  }

  // G2-40: the duplicate-entity group is the one that shows up with
  // hundreds of undifferentiated pairs and no way to tell it's ordered or
  // to stop. `entityGroups` already arrives sorted highest-confidence-first
  // (the server sorts entity_items by composite/detection_count before the
  // client groups them by pair), so the first CURATION_ENTITY_BATCH_SIZE
  // pairs are the ones most worth the owner's attention. Everything past
  // that renders into the DOM (so counts and "left" stay accurate) but
  // stays hidden behind an explicit "show the rest" action.
  const CURATION_ENTITY_BATCH_SIZE = 10;
  function entityMergeGroupHtml(entityGroups) {
    if (!entityGroups.length) return '';
    const total = entityGroups.length;
    const visible = entityGroups.slice(0, CURATION_ENTITY_BATCH_SIZE);
    const rest = entityGroups.slice(CURATION_ENTITY_BATCH_SIZE);
    const lede = rest.length
      ? `<p class="curation-group-lede">${escapeHtml(copyFormat(CUR_COPY.CUR_ENTITY_GROUP_LEDE, {count: visible.length}))}</p>`
      : '';
    const showRest = rest.length
      ? `<div class="curation-group-more" data-group-more hidden>${rest.map(entityItemHtml).join('')}</div>
         <button class="curation-button curation-button-link" type="button" data-action="curation-show-rest">${escapeHtml(copyFormat(CUR_COPY.CUR_ENTITY_SHOW_REST_ACTION, {count: rest.length}))}</button>`
      : '';
    return `<details class="curation-group" data-review-group="merge" data-group-total="${total}" ${openReviewGroups.has('merge') ? 'open' : ''}>
      <summary>possible duplicate entities <span data-group-count>(${total})</span></summary>
      <div class="curation-group-items">
        ${lede}
        <p class="curation-group-progress" data-group-progress></p>
        ${entityBatchHtml()}
        ${visible.map(entityItemHtml).join('')}
        ${showRest}
        <div class="curation-actions">
          <button class="curation-button" type="button" data-action="curation-group-done">${escapeHtml(CUR_COPY.CUR_ENTITY_DONE_FOR_NOW_ACTION)}</button>
        </div>
      </div>
    </details>`;
  }

  function refreshGroupCounts() {
    root.querySelectorAll('[data-review-group]').forEach(group => {
      const remaining = group.querySelectorAll('[data-curation-item]').length;
      group.querySelector('[data-group-count]').textContent = `(${remaining})`;
      const progress = group.querySelector('[data-group-progress]');
      if (progress) {
        const groupTotal = Number(group.dataset.groupTotal || remaining);
        const reviewed = Math.max(0, groupTotal - remaining);
        progress.textContent = remaining
          ? copyFormat(CUR_COPY.CUR_ENTITY_PROGRESS_LABEL, {reviewed, left: remaining})
          : '';
      }
    });
    const count = root.querySelector('[data-review-total]');
    const total = root.querySelectorAll('[data-curation-item]').length;
    if (count) count.textContent = total ? `${total} suggestions to review. choose a group to begin.` : '';
  }
  function renderState(payload, preserveOutcomes = false) {
    const savedOutcomes = preserveOutcomes
      ? Array.from(root.querySelector('[data-curation-outcomes]')?.children || [])
      : [];
    CUR_COPY = payload.copy || {};
    window.CUR_COPY = CUR_COPY;
    curationFacetTitles = payload.facet_titles || {};
    const facetItems = payload.facet_items || [];
    const entityItems = payload.entity_items || [];
    const entityGroups = groupEntityItems(entityItems);
    const ambiguityItems = payload.ambiguity_items || [];
    const speakerItems = payload.speaker_items || [];
    const speakerCandidatePairItems = payload.speaker_candidate_pair_items || [];
    const empty = !facetItems.length && !entityItems.length && !ambiguityItems.length && !speakerItems.length && !speakerCandidatePairItems.length;
    window.Drawer.preserveOpen(root, () => {
      root.innerHTML = `
        <h1 class="curation-header">${escapeHtml(CUR_COPY.CUR_HEADING)}</h1>
        ${empty ? `<p class="curation-empty">${escapeHtml(CUR_COPY.CUR_EMPTY_STATE)}</p>` : ''}
        <p data-review-total></p>
        <div class="curation-outcomes" data-curation-outcomes></div>
        <div class="curation-list" data-curation-list>
          ${reviewGroup('facet', 'facet suggestions', facetItems, facetItemHtml)}
          ${entityMergeGroupHtml(entityGroups)}
          ${reviewGroup('ambiguity', 'names to clarify', ambiguityItems, ambiguityItemHtml)}
          ${reviewGroup('speaker', 'possible duplicate speaker names', speakerItems, speakerItemHtml)}
          ${reviewGroup('pair', 'possible duplicate voices', speakerCandidatePairItems, speakerCandidatePairItemHtml)}
        </div>
      `;
      const outcomes = root.querySelector('[data-curation-outcomes]');
      savedOutcomes.forEach((outcome) => outcomes?.appendChild(outcome));
      root.querySelectorAll('[data-review-group]').forEach(group => group.addEventListener('toggle', () => {
        if (group.open) openReviewGroups.add(group.dataset.reviewGroup); else openReviewGroups.delete(group.dataset.reviewGroup);
      }));
      refreshGroupCounts();
      refreshToolbar();
    });
  }

  async function refreshCurationState() {
    renderState(await window.apiJson('/app/curation/api/state'), true);
  }

  async function loadInitialState() {
    renderLoading();
    try {
      renderState(await window.apiJson('/app/curation/api/state'));
    } catch (err) {
      renderError(err, loadInitialState);
    }
  }

  loadInitialState();

  function setBusy(button, busy) {
    if (!button) return;
    button.disabled = busy;
  }

  function itemFor(node) {
    return node ? node.closest('[data-curation-item]') : null;
  }

  function showError(item, message) {
    const errorNode = item?.querySelector('.curation-item-error');
    if (!errorNode) return;
    errorNode.textContent = message || '';
    errorNode.hidden = !message;
  }

  function repairRequired(err) {
    return err?.payload?.operation_state === 'repair_required';
  }

  function mutationErrorMessage(err, fallback) {
    if (repairRequired(err)) {
      return copyFormat(CUR_COPY.CUR_REPAIR_REQUIRED, {
        detail: err.rawDetail || err.serverMessage || fallback,
        remediation: err.payload.safe_remediation || ''
      }).trim();
    }
    return err?.rawDetail || err?.serverMessage || err?.message || fallback;
  }

  function showMutationError(item, button, err, fallback) {
    if (repairRequired(err)) {
      item?.querySelectorAll('button, input').forEach((control) => setBusy(control, true));
    } else {
      setBusy(button, false);
    }
    showError(item, mutationErrorMessage(err, fallback));
  }

  function postJson(path, payload) {
    return window.apiJson(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  }

  function escapeHtml(value) {
    const holder = document.createElement('div');
    holder.textContent = value == null ? '' : String(value);
    return holder.innerHTML;
  }

  function escapeAttr(value) {
    return escapeHtml(value).replace(/"/g, '&quot;');
  }

  function removeItem(item) {
    if (!item) return;
    item.dataset.removing = 'true';
    item.remove();
    refreshGroupCounts();
    refreshToolbar();
  }

  function appendUndoOutcome(undo, label) {
    const outcomes = root.querySelector('[data-curation-outcomes]');
    if (!outcomes) return;
    const row = document.createElement('div');
    row.className = 'curation-outcome';
    if (undo?.merge_id) row.dataset.mergeId = undo.merge_id;
    const text = document.createElement('span');
    text.textContent = label || CUR_COPY.CUR_ENTITY_MERGE_ACTION;
    row.appendChild(text);
    if (undo?.available && undo.merge_id) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'curation-button';
      button.dataset.action = 'merge-undo';
      button.dataset.mergeId = undo.merge_id;
      button.textContent = CUR_COPY.CUR_UNDO_ACTION;
      row.appendChild(button);
    } else {
      const reason = document.createElement('p');
      reason.className = 'curation-item-error';
      reason.textContent = undo?.reason || CUR_COPY.CUR_UNDO_UNAVAILABLE;
      row.appendChild(reason);
    }
    outcomes.appendChild(row);
  }

  function entityPayload(button) {
    return {
      facet: button.dataset.facet,
      source_slug: button.dataset.sourceSlug,
      target_slug: button.dataset.targetSlug
    };
  }

  // G2-40: "select all" / batch merge must mean "all the owner can see",
  // not "all, including the 825 still behind 'show the rest'". An item
  // inside a not-yet-revealed `[data-group-more]` container is excluded
  // from selection and from the batch toolbar's count until it's shown.
  function isCurationItemRevealed(item) {
    const moreContainer = item.closest('[data-group-more]');
    return !moreContainer || !moreContainer.hidden;
  }

  function entityCheckboxes() {
    return Array.from(root.querySelectorAll('[data-curation-item][data-kind="entity_merge"] input[data-action="entity-select"]'))
      .filter((checkbox) => isCurationItemRevealed(checkbox));
  }

  function entityArticles() {
    return Array.from(root.querySelectorAll('[data-curation-item][data-kind="entity_merge"]'))
      .filter(isCurationItemRevealed);
  }

  function selectedEntityItems() {
    return entityCheckboxes()
      .filter((checkbox) => checkbox.checked)
      .map((checkbox) => itemFor(checkbox))
      .filter(Boolean);
  }

  // A grouped entity_merge item can represent more than one underlying
  // facet-scoped review candidate (G2-26); a batch request needs one entry
  // per facet, not one per visible card.
  function entityItemPayloads(item) {
    return entityBatchItems(entityGroupPayload(item));
  }

  function clearBatchConfirm() {
    const confirm = root.querySelector('.curation-batch-confirm');
    if (!confirm) return;
    confirm.hidden = true;
    confirm.innerHTML = '';
  }

  function clearBatchStatus() {
    const status = root.querySelector('.curation-batch-status');
    if (!status) return;
    status.hidden = true;
    status.textContent = '';
    status.classList.remove('curation-batch-status-error');
  }

  function setBatchBusy(busy) {
    const batch = root.querySelector('[data-curation-batch]');
    if (!batch) return;
    batch.querySelectorAll('button').forEach((batchButton) => setBusy(batchButton, busy));
  }

  function refreshToolbar() {
    refreshGroupCounts();
    const toolbar = root.querySelector('[data-curation-toolbar]');
    const confirm = root.querySelector('.curation-batch-confirm');
    if (!toolbar) return;
    const articles = entityArticles();
    const selected = selectedEntityItems();
    const count = selected.length;
    const total = articles.length;
    if (total === 0) {
      toolbar.hidden = true;
      if (confirm) {
        confirm.hidden = true;
        confirm.innerHTML = '';
      }
      return;
    }
    toolbar.hidden = false;
    const mergeButton = toolbar.querySelector('[data-action="entity-batch-merge"]');
    const dismissButton = toolbar.querySelector('[data-action="entity-batch-dismiss"]');
    const selectAll = toolbar.querySelector('[data-action="entity-select-all"]');
    const mergeBase = CUR_COPY.CUR_ENTITY_BATCH_MERGE_ACTION;
    const dismissBase = CUR_COPY.CUR_ENTITY_BATCH_DISMISS_ACTION;
    if (mergeButton) {
      mergeButton.textContent = count ? `${mergeBase} (${count})` : mergeBase;
      mergeButton.disabled = count === 0;
    }
    if (dismissButton) {
      dismissButton.textContent = count ? `${dismissBase} (${count})` : dismissBase;
      dismissButton.disabled = count === 0;
    }
    if (selectAll) {
      selectAll.checked = count === total && total > 0;
      selectAll.indeterminate = count > 0 && count < total;
    }
  }

  function speakerPayload(button) {
    const item = itemFor(button);
    const ds = item?.dataset || {};
    return {
      key: ds.key,
      source_id: ds.sourceId,
      target_id: ds.targetId
    };
  }

  function speakerCandidatePairPayload(button) {
    const item = itemFor(button);
    const ds = item?.dataset || {};
    return {
      key: ds.key,
      anchor_a: ds.anchorA,
      anchor_b: ds.anchorB
    };
  }

  function payloadAttrs(payload) {
    if (payload.facet !== undefined) {
      return `data-facet="${escapeHtml(payload.facet)}" data-source-slug="${escapeHtml(payload.source_slug)}" data-target-slug="${escapeHtml(payload.target_slug)}"`;
    }
    return `data-key="${escapeHtml(payload.key)}" data-source-id="${escapeHtml(payload.source_id)}" data-target-id="${escapeHtml(payload.target_id)}"`;
  }

  function previewRows(preview) {
    const rows = [];
    const aliases = preview.akas_added || [];
    if (aliases.length) {
      rows.push(`${CUR_COPY.CUR_PREVIEW_AKAS_LABEL}: ${aliases.join(', ')}`);
    }
    if (preview.emails_added_count) {
      rows.push(`${CUR_COPY.CUR_PREVIEW_EMAILS_LABEL}: ${preview.emails_added_count}`);
    }
    if (preview.facet_moved_count || preview.facet_merged_count) {
      rows.push(`${CUR_COPY.CUR_PREVIEW_FACETS_LABEL}: ${preview.facet_moved_count || 0} moved, ${preview.facet_merged_count || 0} merged`);
    }
    if (preview.observations_appended) {
      rows.push(`${CUR_COPY.CUR_PREVIEW_OBSERVATIONS_LABEL}: ${preview.observations_appended}`);
    }
    if (preview.labels_rewritten || preview.corrections_rewritten) {
      rows.push(`${CUR_COPY.CUR_PREVIEW_SEGMENTS_LABEL}: ${preview.labels_rewritten || 0} labels, ${preview.corrections_rewritten || 0} corrections`);
    }
    if (preview.voiceprints_added || preview.voiceprints_target_total) {
      rows.push(`${CUR_COPY.CUR_PREVIEW_VOICEPRINTS_LABEL}: ${preview.voiceprints_added || 0} added, ${preview.voiceprints_target_total || 0} total`);
    }
    return rows;
  }

  function renderPreview(item, payload, result, acceptAction = 'entity-accept', cancelAction = 'entity-cancel', groupFacets = null) {
    const previewNode = item.querySelector('.curation-preview');
    if (!previewNode) return;
    const preview = result.preview || {};
    const rows = previewRows(preview);
    const errors = preview.segment_errors || [];
    const listHtml = rows.length
      ? `<ul class="curation-preview-list">${rows.map((row) => `<li>${escapeHtml(row)}</li>`).join('')}</ul>`
      : `<p class="curation-empty">${escapeHtml(CUR_COPY.CUR_ENTITY_PREVIEW_EMPTY)}</p>`;
    const errorHtml = errors.length
      ? `<p class="curation-preview-error">${escapeHtml(CUR_COPY.CUR_ENTITY_PREVIEW_ERRORS)}</p>`
      : '';
    // G2-26: a merge across more than one facet-scoped suggestion for the
    // same pair confirms as one grouped action, not a re-run per facet.
    const confirmAttrs = groupFacets && groupFacets.length > 1
      ? `data-action="entity-accept-group" data-source-slug="${escapeHtml(payload.source_slug)}" data-target-slug="${escapeHtml(payload.target_slug)}" data-facets='${escapeAttr(JSON.stringify(groupFacets))}'`
      : `data-action="${escapeHtml(acceptAction)}" ${payloadAttrs(payload)}`;
    previewNode.innerHTML = `
      <p class="curation-preview-lead">${escapeHtml(CUR_COPY.CUR_ENTITY_PREVIEW_LEAD)}</p>
      ${listHtml}
      ${errorHtml}
      <div class="curation-actions">
        <button class="curation-button curation-button-primary" type="button" ${confirmAttrs}>${escapeHtml(CUR_COPY.CUR_ENTITY_CONFIRM_ACTION)}</button>
        <button class="curation-button" type="button" data-action="${escapeHtml(cancelAction)}">${escapeHtml(CUR_COPY.CUR_ENTITY_CANCEL_ACTION)}</button>
      </div>
    `;
    previewNode.hidden = false;
  }

  root.addEventListener('click', (event) => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const item = itemFor(button);
    const action = button.dataset.action;

    // G2-40: reveal the rest of a batched group in place, no re-fetch.
    if (action === 'curation-show-rest') {
      const more = button.previousElementSibling;
      if (more && more.hasAttribute('data-group-more')) more.hidden = false;
      button.remove();
      return;
    }

    // G2-40: an explicit, labelled way to stop reviewing a group for now
    // rather than the owner having to notice the summary bar also collapses
    // it. No data changes; the group reopens with everything still there.
    if (action === 'curation-group-done') {
      const group = button.closest('[data-review-group]');
      if (group) group.open = false;
      return;
    }

    if (action === 'merge-undo') {
      const outcome = button.closest('.curation-outcome');
      setBusy(button, true);
      postJson(`/app/entities/api/merge/${encodeURIComponent(button.dataset.mergeId)}/undo`, {})
        .then(async () => {
          button.remove();
          const done = document.createElement('span');
          done.textContent = CUR_COPY.CUR_UNDO_DONE;
          outcome?.appendChild(done);
          outcome?.querySelector('.curation-item-error')?.remove();
          try {
            await refreshCurationState();
          } catch (err) {
            const refreshError = document.createElement('p');
            refreshError.className = 'curation-item-error';
            refreshError.textContent = err.serverMessage || err.message;
            outcome?.appendChild(refreshError);
          }
        })
        .catch((err) => {
          if (!repairRequired(err)) setBusy(button, false);
          let error = outcome?.querySelector('.curation-item-error');
          if (!error && outcome) {
            error = document.createElement('p');
            error.className = 'curation-item-error';
            outcome.appendChild(error);
          }
          if (error) error.textContent = mutationErrorMessage(err, CUR_COPY.CUR_UNDO_FAILED);
        });
      return;
    }

    if (action === 'ambiguity-resolve') {
      setBusy(button, true);
      postJson(
        `/app/entities/api/ambiguities/${encodeURIComponent(button.dataset.ambiguityId)}/resolve`,
        {entity_id: button.dataset.entityId}
      )
        .then(() => removeItem(item))
        .catch((err) => {
          setBusy(button, false);
          showError(item, err.serverMessage || err.message);
        });
      return;
    }

    if (action === 'entity-cancel' || action === 'speaker-cancel') {
      const preview = item?.querySelector('.curation-preview');
      if (preview) {
        preview.hidden = true;
        preview.innerHTML = '';
      }
      return;
    }

    if (action === 'facet-accept' || action === 'facet-dismiss') {
      const nameKey = button.dataset.nameKey;
      const path = action === 'facet-accept'
        ? '/app/curation/api/facet/accept'
        : '/app/curation/api/facet/dismiss';
      setBusy(button, true);
      postJson(path, { name_key: nameKey })
        .then(() => removeItem(item))
        .catch((err) => {
          setBusy(button, false);
          showError(item, err.serverMessage || err.message);
        });
      return;
    }

    if (action === 'speaker-preview') {
      const payload = speakerPayload(button);
      setBusy(button, true);
      postJson('/app/curation/api/speaker/preview', payload)
        .then((result) => {
          setBusy(button, false);
          renderPreview(item, payload, result, 'speaker-accept', 'speaker-cancel');
        })
        .catch((err) => {
          setBusy(button, false);
          showError(item, err.serverMessage || err.message);
        });
      return;
    }

    if (action === 'speaker-accept' || action === 'speaker-dismiss') {
      const payload = speakerPayload(button);
      const path = action === 'speaker-accept'
        ? '/app/curation/api/speaker/accept'
        : '/app/curation/api/speaker/dismiss';
      setBusy(button, true);
      postJson(path, payload)
        .then((data) => {
          if (action === 'speaker-accept') appendUndoOutcome(data.undo, data.candidate?.target_label || data.key);
          removeItem(item);
        })
        .catch((err) => {
          if (action === 'speaker-accept') {
            showMutationError(item, button, err, CUR_COPY.CUR_UNDO_FAILED);
          } else {
            setBusy(button, false);
            showError(item, err.serverMessage || err.message);
          }
        });
      return;
    }

    if (action === 'speaker-pair-accept' || action === 'speaker-pair-dismiss') {
      const payload = speakerCandidatePairPayload(button);
      const path = action === 'speaker-pair-accept'
        ? '/app/curation/api/speaker-candidate-pair/accept'
        : '/app/curation/api/speaker-candidate-pair/dismiss';
      setBusy(button, true);
      postJson(path, payload)
        .then((data) => {
          if (action === 'speaker-pair-accept') appendUndoOutcome(data.undo, data.key);
          removeItem(item);
        })
        .catch((err) => {
          if (action === 'speaker-pair-accept') {
            showMutationError(item, button, err, CUR_COPY.CUR_UNDO_FAILED);
          } else {
            setBusy(button, false);
            showError(item, err.serverMessage || err.message);
          }
        });
      return;
    }

    if (action === 'entity-select' || action === 'entity-select-all') {
      if (action === 'entity-select-all') {
        entityCheckboxes().forEach((checkbox) => {
          checkbox.checked = button.checked;
        });
      }
      clearBatchConfirm();
      refreshToolbar();
      return;
    }

    if (action === 'entity-batch-merge' || action === 'entity-batch-dismiss') {
      const mode = action === 'entity-batch-merge' ? 'merge' : 'dismiss';
      const items = selectedEntityItems();
      if (!items.length) return;
      clearBatchStatus();
      const confirm = root.querySelector('.curation-batch-confirm');
      if (!confirm) return;
      const lead = mode === 'merge'
        ? CUR_COPY.CUR_ENTITY_BATCH_MERGE_LEAD
        : CUR_COPY.CUR_ENTITY_BATCH_DISMISS_LEAD;
      const actionCopy = mode === 'merge'
        ? CUR_COPY.CUR_ENTITY_BATCH_CONFIRM_MERGE_ACTION
        : CUR_COPY.CUR_ENTITY_BATCH_CONFIRM_DISMISS_ACTION;
      confirm.innerHTML = `
        <p class="curation-preview-lead">${escapeHtml(lead)}</p>
        <ul class="curation-batch-confirm-list">
          ${items.map((selectedItem) => {
            const facets = JSON.parse(selectedItem.dataset.facets || '[]');
            const pairText = `"${selectedItem.dataset.source}" and "${selectedItem.dataset.target}"`;
            const facetsText = facets.length > 1
              ? ` — ${copyFormat(CUR_COPY.CUR_ENTITY_FACETS_LABEL, {facets: formatFacetList(facets)})}`
              : '';
            return `<li>${escapeHtml(pairText + facetsText)}</li>`;
          }).join('')}
        </ul>
        <div class="curation-actions">
          <button class="curation-button curation-button-primary" type="button" data-action="entity-batch-confirm" data-mode="${mode}">${escapeHtml(actionCopy)}</button>
          <button class="curation-button" type="button" data-action="entity-batch-cancel">${escapeHtml(CUR_COPY.CUR_ENTITY_CANCEL_ACTION)}</button>
        </div>
      `;
      confirm.hidden = false;
      return;
    }

    if (action === 'entity-batch-cancel') {
      clearBatchConfirm();
      return;
    }

    if (action === 'entity-batch-confirm') {
      const mode = button.dataset.mode;
      const items = selectedEntityItems();
      if (!items.length) return;
      const path = mode === 'merge'
        ? '/app/curation/api/entity/accept-batch'
        : '/app/curation/api/entity/dismiss-batch';
      setBatchBusy(true);
      postJson(path, {items: items.flatMap(entityItemPayloads)})
        .then((data) => {
          const articlesByKey = {};
          entityArticles().forEach((article) => {
            articlesByKey[`${article.dataset.sourceSlug}|${article.dataset.targetSlug}`] = article;
          });
          const ok = mode === 'merge'
            ? {accepted: 1, already_accepted: 1}
            : {dismissed: 1, already_dismissed: 1};
          // A grouped card can carry more than one underlying result (one per
          // facet, G2-26): every successful result for the same pair removes
          // the (single) card, but the undo outcome is only appended once —
          // it is the same merge_id either way.
          const successfulPairs = new Set();
          const undoShownForPair = new Set();
          (data.results || []).forEach((result) => {
            const pairKey = `${result.source_slug}|${result.target_slug}`;
            const article = articlesByKey[pairKey];
            if (!article) return;
            if (Object.prototype.hasOwnProperty.call(ok, result.status)) {
              successfulPairs.add(pairKey);
              if (mode === 'merge' && !undoShownForPair.has(pairKey)) {
                undoShownForPair.add(pairKey);
                appendUndoOutcome(result.undo, `${result.source_slug} → ${result.target_slug}`);
              }
              removeItem(article);
              return;
            }
            const checkbox = article.querySelector('input[data-action="entity-select"]');
            if (checkbox) checkbox.checked = false;
            if (result.operation_state === 'repair_required') {
              article.querySelectorAll('button, input').forEach((control) => setBusy(control, true));
              showError(article, copyFormat(CUR_COPY.CUR_REPAIR_REQUIRED, {
                detail: result.error,
                remediation: result.safe_remediation || ''
              }).trim());
            } else {
              showError(article, result.error);
            }
          });
          const status = root.querySelector('.curation-batch-status');
          if (status) {
            // Counts are stated per selected pair, not per underlying
            // facet-scoped request row, so a merge across N facets still
            // reads as "1 of 1" rather than an inflated N of N (G2-26).
            const okCount = successfulPairs.size;
            const totalCount = items.length;
            let text = copyFormat(
              mode === 'merge'
                ? CUR_COPY.CUR_ENTITY_BATCH_MERGE_SUMMARY
                : CUR_COPY.CUR_ENTITY_BATCH_DISMISS_SUMMARY,
              {ok: okCount, total: totalCount}
            );
            if (totalCount - okCount > 0) {
              text += ' ' + copyFormat(CUR_COPY.CUR_ENTITY_BATCH_FAILED_NOTE, {failed: totalCount - okCount});
            }
            status.textContent = text;
            status.classList.remove('curation-batch-status-error');
            status.hidden = false;
          }
          clearBatchConfirm();
          setBatchBusy(false);
          refreshToolbar();
        })
        .catch((err) => {
          if (!repairRequired(err)) setBatchBusy(false);
          const status = root.querySelector('.curation-batch-status');
          if (status) {
            status.textContent = mutationErrorMessage(err, CUR_COPY.CUR_UNDO_FAILED);
            status.classList.add('curation-batch-status-error');
            status.hidden = false;
          }
        });
      return;
    }

    if (action === 'entity-preview') {
      // Preview only needs one facet-scoped candidate to check status and
      // compute the (facet-independent) merge preview; the confirm step
      // below still resolves every facet in the group (G2-26).
      const group = entityGroupPayload(item);
      const payload = {facet: group.facets[0], source_slug: group.source_slug, target_slug: group.target_slug};
      setBusy(button, true);
      postJson('/app/curation/api/entity/preview', payload)
        .then((result) => {
          setBusy(button, false);
          renderPreview(item, payload, result, 'entity-accept', 'entity-cancel', group.facets);
        })
        .catch((err) => {
          setBusy(button, false);
          showError(item, err.serverMessage || err.message);
        });
      return;
    }

    if (action === 'entity-accept-group' || action === 'entity-dismiss-group') {
      const group = entityGroupPayload(item);
      const path = action === 'entity-accept-group'
        ? '/app/curation/api/entity/accept-batch'
        : '/app/curation/api/entity/dismiss-batch';
      setBusy(button, true);
      postJson(path, {items: entityBatchItems(group)})
        .then((data) => {
          const results = data.results || [];
          const firstOk = results.find((result) => ['accepted', 'already_accepted', 'dismissed', 'already_dismissed'].includes(result.status));
          const firstFailed = results.find((result) => !['accepted', 'already_accepted', 'dismissed', 'already_dismissed'].includes(result.status));
          if (firstFailed && !firstOk) {
            showMutationError(item, button, {serverMessage: firstFailed.error, payload: firstFailed}, CUR_COPY.CUR_UNDO_FAILED);
            return;
          }
          if (action === 'entity-accept-group' && firstOk) {
            appendUndoOutcome(firstOk.undo, `${item.dataset.source} → ${item.dataset.target}`);
          }
          removeItem(item);
        })
        .catch((err) => {
          if (action === 'entity-accept-group') {
            showMutationError(item, button, err, CUR_COPY.CUR_UNDO_FAILED);
          } else {
            setBusy(button, false);
            showError(item, err.serverMessage || err.message);
          }
        });
      return;
    }

    if (action === 'entity-accept' || action === 'entity-dismiss') {
      const payload = entityPayload(button);
      const path = action === 'entity-accept'
        ? '/app/curation/api/entity/accept'
        : '/app/curation/api/entity/dismiss';
      setBusy(button, true);
      postJson(path, payload)
        .then((data) => {
          if (action === 'entity-accept') appendUndoOutcome(data.undo, `${item.dataset.source} → ${item.dataset.target}`);
          removeItem(item);
        })
        .catch((err) => {
          if (action === 'entity-accept') {
            showMutationError(item, button, err, CUR_COPY.CUR_UNDO_FAILED);
          } else {
            setBusy(button, false);
            showError(item, err.serverMessage || err.message);
          }
        });
    }
  });
})();
</script>
