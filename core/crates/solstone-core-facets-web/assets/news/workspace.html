<style>
.news-shell {
  max-width: 900px;
  margin: 0 auto;
  padding: 2rem 2rem 5rem;
  color: #1f2937;
}

.news-header {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  align-items: flex-start;
  margin-bottom: 1.5rem;
}

.news-kicker {
  margin: 0 0 0.35rem;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #1d4ed8;
}

.news-title {
  margin: 0;
  font-size: clamp(1.8rem, 4vw, 2.7rem);
  line-height: 1.1;
  color: #111827;
}

.news-subtitle {
  margin: 0.35rem 0 0;
  font-size: 1rem;
  color: #6b7280;
}

.news-actions {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  flex-shrink: 0;
}

.news-button,
.news-link-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  padding: 0 1rem;
  border-radius: 999px;
  border: 1px solid #d6d3d1;
  background: #f8fafc;
  color: #1f2937;
  font: inherit;
  text-decoration: none;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}

.news-button:hover,
.news-link-button:hover {
  background: #dbeafe;
  border-color: #2563eb;
}

.news-body,
.news-index {
  background: #fff;
  border: 1px solid #e7e5e4;
  border-radius: 18px;
  padding: 1.5rem;
  box-shadow: 0 20px 40px rgba(15, 23, 42, 0.04);
}

.news-body h1,
.news-body h2,
.news-body h3 {
  color: #111827;
}

.news-body p,
.news-body li,
.news-index p,
.news-index li {
  line-height: 1.7;
}

.news-index .surface-state-desc {
  line-height: 1.5;
}

.news-body blockquote {
  margin: 1.5rem 0;
  padding-left: 1rem;
  border-left: 3px solid #2563eb;
  color: #6b7280;
}

.news-body a,
.news-index a {
  color: #1d4ed8;
}

.news-body a:hover,
.news-index a:hover {
  color: #1e3a8a;
}

.news-populated-framing {
  margin: 0.25rem 0 1rem;
  font-size: 0.95rem;
  color: #4b5563;
}

.news-index-list {
  list-style: none;
  margin: 1.25rem 0 0;
  padding: 0;
  display: grid;
  gap: 0.75rem;
}

.news-index-link {
  display: grid;
  grid-template-columns: minmax(0, 11rem) 1fr max-content;
  gap: 1rem;
  align-items: center;
  padding: 1rem 1.1rem;
  border-radius: 14px;
  background: #eff6ff;
  border: 1px solid #93c5fd;
  text-decoration: none;
  color: #1f2937;
}

.news-index-link:hover {
  background: #dbeafe;
}

.news-index-facet {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.news-index-day {
  color: #4b5563;
  font-size: 0.95rem;
  white-space: nowrap;
}

.news-index-token {
  color: #78716c;
  font-size: 0.85rem;
}

.news-next-footer {
  margin: 1.25rem 0 0;
  font-size: 0.9rem;
  color: #6b7280;
}

.news-grid-card {
  background: var(--paper);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  padding: var(--space-4);
  margin-bottom: var(--space-4);
}

.news-grid-card[hidden] {
  display: none;
}

.news-grid-title {
  margin: 0;
  color: var(--ink);
  font-size: 1rem;
}

.news-grid-lede {
  margin: var(--space-2) 0 var(--space-3);
  color: var(--ink-soft-paper);
  line-height: 1.5;
}

.news-grid-host {
  margin-top: var(--space-3);
}

.news-grid-legend {
  margin-top: var(--space-2);
  color: var(--ink-faint-paper);
}

.news-debug-link {
  margin: 1.5rem 0 0;
  font-size: 0.9rem;
  color: #6b7280;
}

.news-sample-banner {
  display: block;
  padding: 0.5rem 0.875rem;
  margin: 0 0 1rem;
  border-radius: 0.5rem;
  background: #eff6ff;
  border: 1px solid #93c5fd;
  color: #1e3a8a;
  font-size: 0.9rem;
  font-style: italic;
}

@media (max-width: 720px) {
  .news-shell {
    padding: 1.25rem 1rem 4rem;
  }

  .news-header {
    flex-direction: column;
  }

  .news-actions {
    width: 100%;
  }

  .news-index-link {
    grid-template-columns: 1fr max-content;
  }

  .news-index-facet {
    grid-column: 1 / -1;
  }

  .news-index-day {
    grid-column: 1;
  }

  .news-index-token {
    grid-column: 2;
  }
}
.news-earlier>summary{min-height:46px;padding:14px 0;cursor:pointer;font-weight:600}.news-day-group h3{font-size:1.05rem}.news-index-link{gap:16px;flex-wrap:wrap}.news-index-link>span:last-child{font-size:.9rem}.news-earlier>summary:focus-visible{outline:2px solid #b06a1a;outline-offset:3px}
</style>

<div class="news-shell" id="newsApp">
  <div data-date-nav></div>
  <h2 class="news-title" data-date-nav-heading></h2>
  <div id="newsContent"></div>
</div>

<script>
(() => {
  const content = document.getElementById('newsContent');

  function escapeHtml(value) {
    const holder = document.createElement('div');
    holder.textContent = value == null ? '' : String(value);
    return holder.innerHTML;
  }

  function decodePart(value) {
    try {
      return decodeURIComponent(value || '');
    } catch (_error) {
      return value || '';
    }
  }

  function viewContext() {
    const parts = window.location.pathname.split('/');
    if (!parts[3]) {
      return {mode: 'index', url: '/app/news/api/state'};
    }
    const first = decodePart(parts[3]);
    if (first === 'sample') {
      return {mode: 'sample', url: '/app/news/api/sample'};
    }
    if (/^\d{8}$/.test(first) && !parts[4]) {
      return {
        mode: 'day',
        day: first,
        url: `/app/news/api/day/${encodeURIComponent(first)}`
      };
    }
    if (parts[3] && parts[4]) {
      const facet = decodePart(parts[3]);
      const day = decodePart(parts[4]);
      return {
        mode: 'detail',
        url: `/app/news/api/${encodeURIComponent(facet)}/${encodeURIComponent(day)}`
      };
    }
    return {mode: 'index', url: '/app/news/api/state'};
  }

  function suppressDateNavForDetail(context) {
    if (context.mode !== 'detail') return;
    const host = document.querySelector('[data-date-nav]');
    if (host) { host.dataset.dateNavSuppressed = 'true'; host.hidden = true; }
    document.querySelector('[data-date-nav-heading]')?.remove();
  }

  function renderLoading() {
    content.innerHTML = window.SurfaceState
      ? window.SurfaceState.loading({text: 'loading newsletters...'})
      : '<p>loading newsletters...</p>';
  }

  function renderError(err, retry) {
    window.logError?.(err, {context: 'news-state'});
    content.innerHTML = window.SurfaceState
      ? window.SurfaceState.error({
          retry: true,
          serverMessage: err?.serverMessage || err?.message || '',
          detail: err
        })
      : '<p>could not load newsletters.</p><button type="button" class="surface-state-retry">try again</button>';
    content.querySelector('.surface-state-retry')?.addEventListener('click', retry, {once: true});
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }

    const area = document.createElement('textarea');
    area.value = text;
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.appendChild(area);
    area.select();
    document.execCommand('copy');
    document.body.removeChild(area);
    return Promise.resolve();
  }

  function attachCopyButton(rawUrl) {
    const copyButton = document.getElementById('copyNewsletterButton');
    if (!copyButton) return;
    copyButton.addEventListener('click', async () => {
      const originalLabel = copyButton.textContent;
      try {
        const response = await fetch(rawUrl, {credentials: 'same-origin'});
        if (!response.ok) throw new Error('copy failed');
        await copyText(await response.text());
        copyButton.textContent = 'copied';
      } catch (_error) {
        copyButton.textContent = 'failed';
      } finally {
        window.setTimeout(() => {
          copyButton.textContent = originalLabel;
        }, 2000);
      }
    });
  }

  function renderMarkdown(markdownSource) {
    const newsletterBody = document.getElementById('newsletterBody');
    if (newsletterBody) {
      newsletterBody.innerHTML = window.AppServices.renderMarkdown(markdownSource || '');
    }
  }

  function newsGridUnit(copy) {
    return {
      one: copy.grid_unit_one,
      other: copy.grid_unit_other,
      none: copy.grid_unit_none,
    };
  }

  function hideNewsGrid(card, host, legend, unit) {
    card.hidden = true;
    if (window.DayGrid) {
      window.DayGrid.mount(host, {
        data: null,
        mode: 'navigate',
        appPath: '/app/news',
        unit,
        granularity: 'day',
      });
    } else {
      host.replaceChildren();
    }
    legend.replaceChildren();
  }

  async function fetchNewsGrid() {
    try {
      const response = await fetch('/app/news/api/grid', {cache: 'no-store'});
      if (!response.ok) return null;
      return response.json();
    } catch (_error) {
      return null;
    }
  }

  async function renderNewsGrid(copy) {
    const card = document.getElementById('newsGridCard');
    const host = document.getElementById('newsGridHost');
    const legend = document.getElementById('newsGridLegend');
    if (!card || !host || !legend) return;
    const unit = newsGridUnit(copy);
    const data = await fetchNewsGrid();
    if (!data || !window.DayGrid) {
      hideNewsGrid(card, host, legend, unit);
      return;
    }

    // Newsletters need both a long enough span and enough active days to make
    // the overview useful; keep this calibration explicit for this adopter.
    const gate = window.DayGrid.gate(data, {minSpanDays: 70, minActiveDays: 14});
    if (!gate.ok) {
      hideNewsGrid(card, host, legend, unit);
      return;
    }

    card.hidden = false;
    window.DayGrid.mount(host, {
      data,
      mode: 'navigate',
      appPath: '/app/news',
      unit,
      granularity: 'day',
    });
    window.DayGrid.legend(legend, {unit, data});
  }

  function renderIndex(payload) {
    const copy = payload.copy || {};
    const newsletters = payload.newsletters || [];
    const groups = new Map();
    newsletters.forEach(item => { if (!groups.has(item.day)) groups.set(item.day, []); groups.get(item.day).push(item); });
    const days = [...groups.keys()].sort().reverse();
    const groupHtml = day => `<section class="news-day-group"><h3>${escapeHtml(groups.get(day)[0].label)}</h3><ul class="news-index-list">${groups.get(day).map(item => `<li><a class="news-index-link" href="${escapeHtml(item.url)}"><span class="news-index-facet">${escapeHtml(item.facet)}</span><span>read newsletter →</span></a></li>`).join('')}</ul></section>`;
    const listHtml = newsletters.length
      ? `<h3>latest newsletters</h3>${groupHtml(days[0])}${days.length > 1 ? `<details class="news-earlier"><summary>earlier newsletters</summary>${days.slice(1).map(groupHtml).join('')}</details>` : ''}`
      : (window.SurfaceState
        ? window.SurfaceState.empty({
            icon: window.ConveyIcons.svg('mailbox'),
            heading: copy.empty_next,
            desc: copy.empty_body,
            action: `<p class="surface-state-desc">${escapeHtml(copy.empty_until_then)}</p><a href="${escapeHtml(copy.sample_url)}">${escapeHtml(copy.sample_link_label)}</a>`
          })
        : `
        <div class="news-empty-state">
          <p class="news-empty-body">${escapeHtml(copy.empty_body)}</p>
          <p class="news-empty-next">${escapeHtml(copy.empty_next)}</p>
          <p class="news-empty-until-then">${escapeHtml(copy.empty_until_then)}</p>
          <p class="news-empty-sample"><a href="${escapeHtml(copy.sample_url)}">${escapeHtml(copy.sample_link_label)}</a></p>
        </div>
      `);
    content.innerHTML = `
      <header class="news-header">
        <div>
          <p class="news-kicker">${escapeHtml(copy.kicker)}</p>
          <h2 class="news-title">${escapeHtml(copy.index_h1)}</h2>
          <p class="news-subtitle">${escapeHtml(copy.subtitle)}</p>
        </div>
      </header>
      <section class="news-index">${listHtml}</section>
      <section class="news-grid-card" id="newsGridCard" hidden>
        <h3 class="news-grid-title">${escapeHtml(copy.grid_title)}</h3>
        <p class="news-grid-lede">${escapeHtml(copy.grid_lede)}</p>
        <div class="news-grid-host" id="newsGridHost"></div>
        <div class="news-grid-legend" id="newsGridLegend"></div>
      </section>
    `;
    renderNewsGrid(copy);
  }

  function renderDay(payload) {
    const copy = payload.copy || {};
    const newsletters = payload.newsletters || [];
    const bodyHtml = payload.empty
      ? (window.SurfaceState
        ? window.SurfaceState.empty({
            icon: window.ConveyIcons.svg('mailbox'),
            desc: copy.empty_body
          })
        : `
        <div class="news-empty-state">
          <p class="news-empty-body">${escapeHtml(copy.empty_body)}</p>
        </div>
      `)
      : `
        <ul class="news-index-list">
          ${newsletters.map((item) => `
            <li>
              <a class="news-index-link" href="${escapeHtml(item.url)}">
                <span class="news-index-facet">${escapeHtml(item.facet)}</span>
              </a>
            </li>
          `).join('')}
        </ul>
      `;
    content.innerHTML = `
      <header class="news-header">
        <div>
          <p class="news-subtitle">${escapeHtml(copy.subtitle)}</p>
        </div>
      </header>
      <section class="news-index">${bodyHtml}</section>
    `;
  }

  function renderDetailEmpty(payload) {
    const copy = payload.copy || {};
    content.innerHTML = `
      <header class="news-header">
        <div>
          <h2 class="news-title">${escapeHtml(copy.empty_title)}</h2>
          <p class="news-subtitle">${escapeHtml(copy.empty_body)}</p>
        </div>
      </header>
      <section class="news-index">
        <p class="news-empty-sample"><a href="${escapeHtml(payload.day_url)}">${escapeHtml(copy.day_link)}</a></p>
      </section>
    `;
  }

  function renderDetail(payload) {
    if (payload.empty) {
      renderDetailEmpty(payload);
      return;
    }
    content.innerHTML = `
      <header class="news-header">
        <div>
          <p class="news-kicker">${escapeHtml(payload.kicker)}</p>
          <h2 class="news-title">${escapeHtml(payload.facet)} · ${escapeHtml(payload.date_label)}</h2>
          <p class="news-subtitle">${escapeHtml(payload.subtitle)}</p>
        </div>
        <div class="news-actions">
          <button type="button" class="news-button" id="copyNewsletterButton">copy</button>
          <a class="news-link-button" href="${escapeHtml(payload.pdf_url)}">download PDF</a>
        </div>
      </header>

      <section class="news-body" id="newsletterBody"></section>

      <p class="news-debug-link"><a href="${escapeHtml(payload.debug_link_url)}">${escapeHtml(payload.debug_link_label)}</a></p>
    `;
    renderMarkdown(payload.markdown);
    attachCopyButton(payload.raw_url);
  }

  function renderSample(payload) {
    content.innerHTML = `
      <header class="news-header">
        <div>
          <p class="news-kicker">${escapeHtml(payload.kicker)}</p>
          <h2 class="news-title">${escapeHtml(payload.sample_h1)}</h2>
        </div>
        <div class="news-actions">
          <button type="button" class="news-button" id="copyNewsletterButton">copy</button>
        </div>
      </header>

      <div class="news-sample-banner">${escapeHtml(payload.sample_banner)}</div>
      <section class="news-body" id="newsletterBody"></section>
    `;
    renderMarkdown(payload.markdown);
    attachCopyButton(payload.raw_url);
  }

  const initialContext = viewContext();
  suppressDateNavForDetail(initialContext);

  async function load() {
    const context = initialContext;
    renderLoading();
    try {
      const payload = await window.apiJson(context.url);
      if (context.mode === 'sample') {
        renderSample(payload);
      } else if (context.mode === 'day') {
        renderDay(payload);
      } else if (context.mode === 'detail') {
        renderDetail(payload);
      } else {
        renderIndex(payload);
      }
    } catch (err) {
      renderError(err, load);
    }
  }

  load();
})();
</script>
