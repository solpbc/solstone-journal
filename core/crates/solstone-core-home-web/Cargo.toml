[package]
name = "solstone-core-home-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# Hands the dashboard shell's build script this crate's served asset list.
links = "solstone_convey_assets_home_web"

[features]
default = []
full-tests = []

[[test]]
name = "review_transport"
path = "tests/review_transport.rs"
required-features = ["full-tests"]

[lints]
workspace = true

[dependencies]
axum = { workspace = true, features = ["tokio"] }
chrono.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
solstone-core-backup-web.workspace = true
solstone-core-convey-http.workspace = true
solstone-core-home.workspace = true
solstone-core-facets.workspace = true
solstone-core-journal-config.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-retention.workspace = true
solstone-core-retention-client.workspace = true
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
solstone-core-backup.workspace = true
solstone-core-backup-runtime.workspace = true
solstone-core-convey-shell.workspace = true
tempfile = "3.24.0"
temp-env = "0.3.6"
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tower.workspace = true
