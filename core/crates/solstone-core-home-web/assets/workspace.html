<style>
/* Pulse Landing Page */
.pulse-dashboard {
  padding: 1.5rem 2rem 5rem;
  background: var(--cream-bright);
  max-width: 1000px;
  margin: 0 auto;
  margin-left: max(0px, calc((100vw - 1000px) / 2 - var(--app-rail-width, 72px)));
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.pulse-dashboard a:focus-visible,
.pulse-dashboard button:focus-visible,
.pulse-dashboard [role="button"]:focus-visible {
  outline-color: var(--focus);
}

/* Vital Signs */
/* One status line on the page ground, and under it, only when something is
   there, what's waiting on the owner. */
.pulse-status {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  padding: 0 0.25rem;
}

.pulse-vitals {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.25rem 0;
  flex-wrap: wrap;
}

.pulse-waiting-heading {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--ink);
  margin: 0.25rem 0 0;
}

.pulse-waiting {
  list-style: none;
  margin: 0;
  padding: 0;
}

.pulse-waiting-row {
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  padding: 0.45rem 0;
  border-top: 1px solid var(--hairline);
  font-size: 0.875rem;
  color: var(--ink-soft);
}

/* A hollow ring, so what's waiting reads by shape as well as colour. */
.pulse-waiting-ring {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 2px solid var(--warn);
  flex-shrink: 0;
  position: relative;
  top: 1px;
}

.pulse-waiting-row.red .pulse-waiting-ring { border-color: var(--danger); }

.pulse-waiting-row a {
  color: var(--warn-ink);
  text-decoration: none;
}

.pulse-waiting-row.red a { color: var(--danger); }
.pulse-waiting-row a:hover { text-decoration: underline; }
.pulse-waiting-row a:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 2px;
}

.pulse-waiting-reason {
  display: block;
  font-size: 0.8rem;
  color: var(--ink-faint);
}

/* The written account: a day switch over yesterday and today. */
.pulse-account {
  padding: 1.25rem 1.5rem;
  background: var(--paper);
  border-radius: 10px;
  border: 1px solid var(--hairline);
}

.pulse-account-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem 1rem;
  margin-bottom: 1rem;
}

.pulse-account-tabs {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--hairline-2);
  border-radius: 10px;
  background: var(--cream-bright);
}

.pulse-account-tab {
  font: inherit;
  font-size: 0.9rem;
  min-height: var(--touch-min, 44px);
  padding: 0 1rem;
  border: 0;
  border-radius: 7px;
  background: none;
  color: var(--ink-soft);
  cursor: pointer;
}

.pulse-account-tab:hover { color: var(--ink); }
.pulse-account-tab[aria-selected="true"] {
  background: var(--orange-wash);
  color: var(--ink);
  font-weight: 600;
}

.pulse-account-tab:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

.pulse-account-day {
  font-size: 0.8rem;
  color: var(--ink-faint);
}

.pulse-account-panel[hidden] { display: none; }

.pulse-account-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.25rem 1rem;
  margin-top: 0.5rem;
  font-size: 0.75rem;
  color: var(--ink-faint);
}

.pulse-account-meta .pulse-tell-more { margin-top: 0; }

.pulse-account .pulse-activity { text-decoration: none; }
.pulse-account .pulse-activity:hover .pulse-activity-text { text-decoration: underline; }
.pulse-account .pulse-today-link { margin-top: 0.75rem; }

.pulse-account [data-account-part="activities"] {
  margin-top: 1rem;
  padding-top: 1rem;
  border-top: 1px solid var(--hairline);
}

.pulse-briefing-body {
  font-size: 0.9rem;
  line-height: 1.6;
  color: var(--ink);
  max-width: 65ch;
}

.pulse-briefing-body p { margin: 0 0 0.4rem; }
.pulse-briefing-body ul { margin: 0; padding-left: 1.25rem; }
.pulse-briefing-body li { margin-bottom: 0.3rem; }

/* Connections and your week side by side, connections the wider. */
.pulse-pair {
  display: grid;
  grid-template-columns: 1fr;
  gap: 1rem;
  align-items: start;
}

@media (min-width: 820px) {
  .pulse-pair--two { grid-template-columns: 3fr 2fr; }
}

.pulse-vitals-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.85rem;
  color: var(--ink-soft);
}

.pulse-vitals-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  position: relative;
  top: 0px;
}

.pulse-vitals-dot.green { background: var(--success); }
.pulse-vitals-dot.amber { background: var(--warn); }
.pulse-vitals-dot.red { background: var(--danger); }
.pulse-vitals-dot.neutral { background: var(--ink-faint); }

.pulse-vitals-sep {
  width: 1px;
  height: 1rem;
  background: var(--ink-faint);
}

.pulse-vitals > a.pulse-vitals-health-link {
  margin-left: auto;
  color: var(--orange-text-aa);
  text-decoration: none;
  font-size: 0.85rem;
}

.pulse-vitals a:hover { text-decoration: underline; }
.pulse-vitals a:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 2px;
}
.pulse-vitals a:active {
  color: var(--orange-text-aa);
}

.pulse-vitals-verdict {
  font-weight: 600;
  font-size: 0.8rem;
}
.pulse-vitals-verdict.green { color: var(--success-ink); }
.pulse-vitals-verdict.amber { color: var(--warn-ink); }
.pulse-vitals-verdict.red { color: var(--danger); }
.pulse-vitals-verdict.neutral { color: var(--ink-soft); }

.pulse-vitals-cta { color: var(--orange-text-aa); text-decoration: none; }

/* Not yet, and that's fine: a full-width calm row, a hollow ring (shape, not
   only colour), never a chip and never counted (the day-0 rule). */
.pulse-vitals > a.pulse-vitals-note {
  flex-basis: 100%;
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  padding-top: 0.6rem;
  border-top: 1px dashed var(--hairline);
  font-size: 0.8rem;
  color: var(--ink-soft);
  text-decoration: none;
}
.pulse-vitals-ring {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 1.5px solid var(--ink-faint);
  flex-shrink: 0;
  position: relative;
  top: 1px;
}

/* Section Headers */
.pulse-section-header {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--ink-faint);
  margin-bottom: 0.5rem;
  padding-bottom: 0.35rem;
  border-bottom: 1px solid var(--hairline);
  text-transform: none;
  letter-spacing: 0.06em;
}

/* Section collapse/expand */

/* Narrative */
.pulse-narrative-content {
  font-size: 0.9rem;
  line-height: 1.6;
  color: var(--ink);
  max-width: 65ch;
}

.pulse-narrative-content h1 { font-size: 1.1rem; margin: 0 0 0.75rem; color: var(--ink); }
.pulse-narrative-content h2 { font-size: 1rem; margin: 0.75rem 0 0.5rem; color: var(--ink); }
.pulse-narrative-content p { margin: 0 0 0.5rem; }

/* A link inside generated text sits mid-sentence, so it keeps its underline:
   colour alone would not set it apart from the words around it. */
.pulse-narrative-content a,
.pulse-reflection-memory a {
  color: var(--orange-text-aa);
  text-underline-offset: 2px;
}

.pulse-narrative-content a:focus-visible,
.pulse-reflection-memory a:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 2px;
}

.pulse-narrative-meta {
  margin-top: 0.5rem;
  font-size: 0.75rem;
  color: var(--ink-faint);
}

.pulse-narrative-empty {
  color: var(--ink-faint);
  font-style: italic;
  font-size: 0.85rem;
}

.pulse-reflection {
  padding: 1.25rem;
  background: var(--paper);
  border-radius: 10px;
  border: 1px solid var(--hairline);
}

.pulse-reflection-link,
.pulse-today-link {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  color: var(--warn-ink);
  font-size: 0.95rem;
  font-weight: 600;
  text-decoration: none;
}

.pulse-reflection-link:hover,
.pulse-today-link:hover {
  text-decoration: underline;
}

.pulse-reflection-link:focus-visible,
.pulse-today-link:focus-visible {
  outline: 2px solid var(--warn-ink);
  outline-offset: 2px;
  border-radius: 4px;
}

/* Today Section */
.pulse-activities-label {
  font-size: 0.75rem;
  color: var(--ink-faint);
  margin-bottom: 0.4rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
}

.pulse-facet-dist + .pulse-activities-label,
.pulse-activities + .pulse-activities-label {
  margin-top: 0.75rem;
}

.pulse-activities-more {
  font: inherit;
  color: var(--orange-text-aa);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  min-height: var(--touch-min, 44px);
}

.pulse-activities-more:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 4px;
}

.pulse-connections-more {
  margin-left: 0.5rem;
  white-space: nowrap;
  /* It can sit inside the italic coverage note; the way out reads upright. */
  font-style: normal;
}

.pulse-activities {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.pulse-activity {
  font-size: 0.8rem;
  color: var(--ink-soft);
  display: flex;
  gap: 0.5rem;
  padding: 0.25rem 0.35rem 0.25rem 0;
}

.pulse-activity-time {
  flex-shrink: 0;
  min-width: 40px;
  font-variant-numeric: tabular-nums;
  color: var(--ink-faint);
  white-space: nowrap;
}

.pulse-activity-source {
  display: block;
  font-size: 0.75rem;
  color: var(--ink-faint);
}

.pulse-facet-dist {
  display: flex;
  gap: 0.75rem;
  margin-top: 0.75rem;
  flex-wrap: wrap;
}

.pulse-facet-chip {
  font-size: 0.75rem;
  padding: 0.25rem 0.6rem;
  background: var(--hairline);
  border-radius: 4px;
  color: var(--ink-soft);
}

/* Needs You */

/* The circle read as an unchecked checkbox on a row that cannot be checked.
   A plain list is the honest shape. X-22. */

/* Connections */
.pulse-connections {
  padding: 1.25rem;
  background: var(--paper);
  border-radius: 10px;
  border: 1px solid var(--hairline);
}

.pulse-connections-shelf {
  margin-top: 0.85rem;
}

.pulse-connections-shelf-label {
  color: var(--ink-soft);
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: none;
  letter-spacing: 0.06em;
  margin-bottom: 0.45rem;
}

.pulse-connections-list {
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}

.pulse-connections-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  align-items: center;
  gap: 0.5rem;
  padding: 0.25rem 0;
}

.pulse-connections-name,
.pulse-connections-footer a,
.pulse-connections-more,
.pulse-connections-cluster a {
  color: var(--ink);
  text-decoration: none;
  font-weight: 500;
}

.pulse-connections-name:hover,
.pulse-connections-footer a:hover,
.pulse-connections-more:hover,
.pulse-connections-cluster a:hover {
  text-decoration: underline;
}

.pulse-connections-chip-list {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem;
  justify-content: flex-end;
}

.pulse-connections-chip {
  background: var(--cream-bright);
  border: 1px solid var(--hairline);
  border-radius: 999px;
  color: var(--ink-soft);
  font-size: 0.72rem;
  line-height: 1;
  padding: 0.25rem 0.5rem;
}

.pulse-connections-meta,
.pulse-connections-cluster,
.pulse-connections-note,
.pulse-connections-horizon,
.pulse-connections-footer {
  color: var(--ink-soft);
  font-size: 0.85rem;
}

.pulse-connections-note {
  font-style: italic;
}

.pulse-connections-cluster {
  line-height: 1.7;
}

.pulse-connections-cluster-count {
  color: var(--ink-faint);
}

.pulse-connections-horizon {
  border-top: 1px solid var(--hairline);
  margin-top: 0.9rem;
  padding-top: 0.75rem;
  font-style: italic;
}

.pulse-connections-horizon + .pulse-connections-footer {
  border-top: none;
  margin-top: 0.5rem;
  padding-top: 0;
}

.pulse-connections-footer {
  border-top: 1px solid var(--hairline);
  margin-top: 0.9rem;
  padding-top: 0.75rem;
}

.pulse-tell-more {
  display: inline-block;
  margin-top: 0.5rem;
  font-size: 0.8rem;
  color: var(--orange-text-aa);
  text-decoration: none;
}
.pulse-tell-more:hover {
  text-decoration: underline;
  background: transparent;
}
.pulse-tell-more:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 2px;
}
.pulse-tell-more:active {
  color: var(--orange-text-aa);
}

/* Briefing Card */

.pulse-briefing-body {
  margin-top: 1rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.pulse-briefing-placeholder {
  color: var(--ink-faint);
  font-style: italic;
  font-size: 0.85rem;
  margin-top: 0.5rem;
}

.pulse-briefing-status-link {
  display: inline-flex;
  align-items: center;
  margin-left: 0.45rem;
  padding: 0.2rem 0.5rem;
  border: 1px solid var(--hairline);
  border-radius: 6px;
  color: var(--ink-soft);
  font-style: normal;
  text-decoration: none;
  background: var(--paper);
}

.pulse-briefing-status-link:hover {
  border-color: var(--ink-faint);
  color: var(--ink);
  text-decoration: none;
}

.pulse-welcome {
  font-size: 0.95rem;
  color: var(--ink-soft);
  line-height: 1.6;
  margin: 0;
  padding: 0 0.25rem;
  max-width: 70ch;
}

.pulse-empty-state {
  padding: 1rem 1.25rem;
  background: var(--cream-bright);
  border-radius: 10px;
  border: 1px solid var(--hairline);
}

.pulse-getting-started {
  padding: 1.25rem;
  background: var(--cream-bright);
  border-radius: 10px;
  border: 1px solid var(--hairline);
}

/* The card reads as a sibling of welcome (its heading) and of the other
   cards (its section header and links). */
.pulse-getting-started h2 {
  font-family: var(--font-display);
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--ink);
  margin: 0 0 0.75rem;
  letter-spacing: -0.01em;
}

.pulse-getting-started p {
  font-size: 0.9rem;
  color: var(--ink-soft);
  line-height: 1.5;
  margin: 0 0 0.35rem;
}

.pulse-getting-started .pulse-device-line,
.pulse-getting-started .pulse-download,
.pulse-getting-started .pulse-first-segment {
  margin-bottom: 0.6rem;
}

.pulse-getting-started .pulse-download .pulse-progress {
  max-width: 360px;
  margin: 0.25rem 0 0.35rem;
}

.pulse-getting-started h3 {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--ink-faint);
  letter-spacing: 0.06em;
  margin: 1rem 0 0;
  padding-bottom: 0.35rem;
  border-bottom: 1px solid var(--hairline);
}

.pulse-getting-started-step {
  padding: 0.75rem 0;
  border-bottom: 1px solid var(--hairline);
}

.pulse-getting-started-step:last-child {
  border-bottom: none;
  padding-bottom: 0;
}

.pulse-getting-started-step h4 {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--ink);
  margin: 0 0 0.2rem;
}

.pulse-getting-started a {
  color: var(--orange-text-aa);
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 500;
}

.pulse-getting-started a:hover {
  text-decoration: underline;
}

.pulse-getting-started a:focus-visible,
.pulse-getting-started button:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 2px;
}

.pulse-getting-started code {
  font-family: var(--font-mono);
  font-size: 0.85em;
}

.pulse-agent-command {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  column-gap: 0.5rem;
  margin: 0.4rem 0 0.5rem;
}

.pulse-agent-command p {
  grid-column: 1 / -1;
}

.pulse-agent-command pre {
  margin: 0;
  padding: 0.45rem 0.6rem;
  background: var(--paper);
  border: 1px solid var(--hairline);
  border-radius: 6px;
  overflow-x: auto;
  font-size: 0.8rem;
  color: var(--ink);
}

.pulse-getting-started button {
  font: inherit;
  font-size: 0.8rem;
  color: var(--ink);
  background: var(--paper);
  border: 1px solid var(--hairline);
  border-radius: 999px;
  padding: 0.2rem 0.75rem;
  cursor: pointer;
}

.pulse-getting-started button:disabled {
  cursor: default;
  opacity: 0.6;
}

.pulse-progress {
  display: block;
  width: 100%;
  height: 6px;
  border: none;
  border-radius: 3px;
  background: var(--hairline);
  accent-color: var(--orange-text-aa);
  appearance: none;
  -webkit-appearance: none;
  overflow: hidden;
}

/* Browsers paint their own green bar unless both parts are styled. */
.pulse-progress::-webkit-progress-bar {
  background: var(--hairline);
  border-radius: 3px;
}

.pulse-progress::-webkit-progress-value {
  background: var(--orange-text-aa);
  border-radius: 3px;
}

.pulse-progress::-moz-progress-bar {
  background: var(--orange-text-aa);
  border-radius: 3px;
}

/* Shared left padding for indicator gutter */
.pulse-reflection,
.pulse-connections,
.pulse-empty-state,
.pulse-getting-started {
  padding-left: 2rem;
}

.pulse-empty-state .pulse-empty-message {
  color: var(--ink-faint);
  font-style: italic;
  font-size: 0.85rem;
}

.pulse-empty-state .pulse-empty-message a {
  color: var(--orange-text-aa);
  text-decoration: none;
}

.pulse-empty-state .pulse-empty-message a:hover {
  text-decoration: underline;
}

.pulse-empty-state .pulse-empty-message a:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 2px;
}

.pulse-empty-state .pulse-empty-message a:active {
  color: var(--orange-text-aa);
}

/* Responsive breakpoints */
@media (max-width: 768px) {
  .pulse-dashboard {
    padding: 1rem 1rem 5rem;
    gap: 1rem;
  }

  .pulse-vitals {
    gap: 0.25rem 1rem;
  }

  .pulse-vitals-sep {
    display: none;
  }

  .pulse-facet-chip,
  .pulse-activity,
  .pulse-connections-row {
    padding-block: 10px;
  }

  /* The dashboard's act-on-it controls on a phone: follow a connection, open
     health, open the full list. All were 16-19px tall. G1-31. */
  .pulse-connections-name,
  .pulse-connections-cluster a,
  .pulse-connections-footer a,
  .pulse-connections-more,
  .pulse-vitals-health-link,
  .pulse-vitals-cta,
  .pulse-vitals-note,
  .pulse-tell-more,
  .pulse-reflection-link,
  .pulse-today-link,
  .pulse-briefing-status-link,
  .pulse-empty-state .pulse-empty-message a {
    display: inline-flex;
    align-items: center;
    min-height: var(--touch-min, 44px);
  }

}

@media (max-width: 480px) {
  /* What's waiting is a link, and on a phone it is the first thing worth
     tapping on this page. X-08. */
  .pulse-waiting-row a {
    display: inline-flex;
    align-items: center;
    min-height: var(--touch-min, 44px);
  }

  .pulse-account {
    padding: 1rem;
  }

  .pulse-connections-row {
    display: flex;
    flex-wrap: wrap;
  }

  .pulse-connections-name {
    min-width: 0;
  }

  .pulse-connections-chip-list {
    justify-content: flex-start;
  }

  .pulse-connections-meta {
    flex-basis: 100%;
  }
}

@media (max-width: 375px) {
  .pulse-dashboard {
    padding: 0.75rem 0.75rem 5rem;
  }

  .pulse-account,
  .pulse-reflection,
  .pulse-connections,
  .pulse-empty-state {
    padding: 0.75rem;
  }

  .pulse-facet-dist {
    gap: 0.35rem;
  }

  .pulse-reflection,
  .pulse-connections,
  .pulse-empty-state,
  .pulse-getting-started {
    padding-left: 0.75rem;
  }

  .pulse-activity {
    padding-left: 0.35rem;
  }
}
