[package]
name = "solstone-core-import-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[[test]]
name = "import_host"
path = "tests/import_host.rs"

[lints]
workspace = true

[dependencies]
chrono.workspace = true
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["format", "software-resampling", "build"] }
ffmpeg-sys-next = { version = "9.0.0", default-features = false, features = ["build-portable"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
solstone-core-body-ingest.workspace = true
solstone-core-callosum = { workspace = true, features = ["wire"] }
solstone-core-import.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-processing-record.workspace = true
solstone-core-segment.workspace = true
solstone-core-system-health.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time", "net"] }

[dev-dependencies]
tempfile = "3.24.0"
