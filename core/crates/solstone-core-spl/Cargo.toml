[package]
name = "solstone-core-spl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
bytes = { workspace = true }
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std"] }
serde_json = { workspace = true }
spl-core = { workspace = true }
solstone-core-journal-config.workspace = true
solstone-core-journal-config-write.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-sol-link = { workspace = true, features = ["host"] }
solstone-core-system.workspace = true
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "rt", "rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.26.2", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
ureq = { workspace = true, features = ["rustls"] }

[features]
test-hooks = []

[dev-dependencies]
bytes = { workspace = true }
futures-util = { version = "0.3.33", default-features = false, features = ["sink", "std"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "test-util", "time"] }
tokio-tungstenite = { version = "0.26.2", default-features = false, features = ["connect", "handshake"] }

[[test]]
name = "spl_relay_lifecycle"
path = "tests/spl_relay_lifecycle.rs"
required-features = []

[[test]]
name = "spl_callosum_socket"
path = "tests/spl_callosum_socket.rs"
required-features = ["test-hooks"]

[lints]
workspace = true
