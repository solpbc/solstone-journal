[package]
name = "solstone-core-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[[test]]
name = "import_cli"
path = "tests/import_cli.rs"

[[test]]
name = "import_foundation"
path = "tests/import_foundation.rs"

[[test]]
name = "import_sync"
path = "tests/import_sync.rs"

[[test]]
name = "import_text"
path = "tests/import_text.rs"

# The host-zone test sets TZ and restores it. That is the only unsafe in this package.
[lints.rust]
unsafe_code = "deny"

[dependencies]
chrono.workspace = true
chrono-tz.workspace = true
log.workspace = true
regex.workspace = true
rusqlite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
getrandom.workspace = true
solstone-core-body-ingest.workspace = true
solstone-core-callosum = { workspace = true, features = ["wire"] }
solstone-core-facets.workspace = true
solstone-core-format.workspace = true
solstone-core-generate.workspace = true
solstone-core-indexer-store.workspace = true
solstone-core-journal-config.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-processing-record.workspace = true
solstone-core-segment.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

tempfile = "3.24.0"

[features]
full-tests = []
