[package]
name = "solstone-core-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[[test]]
name = "import_cli"
path = "tests/import_cli.rs"

[[test]]
name = "import_foundation"
path = "tests/import_foundation.rs"

[[test]]
name = "import_sync"
path = "tests/import_sync.rs"

[[test]]
name = "import_text"
path = "tests/import_text.rs"

[lints]
workspace = true

[dependencies]
chrono.workspace = true
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
solstone-core-body-ingest.workspace = true
solstone-core-callosum = { workspace = true, features = ["wire"] }
solstone-core-facets.workspace = true
solstone-core-generate.workspace = true
solstone-core-indexer-store.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-processing-record.workspace = true
solstone-core-segment.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[dev-dependencies]
solstone-core-format.workspace = true
solstone-core-import-sources.workspace = true
tempfile = "3.24.0"
