[package]
name = "solstone-core-speakers-analyze"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["runtime"]
runtime = ["dep:solstone-core-speakers-onnx"]
full-tests = ["runtime"]

[dependencies]
env_logger.workspace = true
log.workspace = true
serde_json.workspace = true
solstone-core-speakers.workspace = true
solstone-core-speakers-onnx = { workspace = true, optional = true }

# This admission hook dependency exists so the Unix hosted-child acknowledgement
# typechecks on Linux, macOS, and Android (where acknowledgement still fails
# closed). The Windows cross-check deliberately builds this crate's library to
# verify the helper's unsupported-runtime diagnostic; do not pull the hosted
# runtime's native dependency closure into that probe.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "android"))'.dependencies]
solstone-core-system.workspace = true

[[bin]]
name = "solstone-core-speakers-analyze"
path = "src/main.rs"
required-features = ["runtime"]

[lints]
workspace = true
