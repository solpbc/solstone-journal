[package]
name = "solstone-core-journal-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
chrono = { workspace = true }
getrandom = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
solstone-core-journal = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { workspace = true, features = ["dir", "fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[features]
test-hooks = []

[dev-dependencies]
tempfile = "3.24.0"

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["signal"] }

# The no-replace platform syscalls have narrowly audited FFI boundaries; keep
# the workspace prohibition in force elsewhere and allow those functions only.
[lints.rust]
unsafe_code = "deny"

[[test]]
name = "journal_io_lock_component"
path = "tests/journal_io_lock_component.rs"
required-features = ["test-hooks"]

# Cloud Files registration is irreconcilable process-global sync-root setup and
# must not run concurrently with any other test touching that namespace.
[[test]]
name = "windows_cloud_sync_root_registration"
path = "tests/windows_cloud_sync_root_registration.rs"
required-features = ["test-hooks"]
