[package]
name = "solstone-core-backup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Child-local descriptor inheritance requires one audited pre_exec closure.
[lints.rust]
unsafe_code = "deny"

[features]
default = []
full-tests = []
# The final iOS app supplies the maintained Go archive.
ios-linked-bridge = []
# Isolated Linux/macOS effect harness only; never part of an owner app.
native-archive-host-tests = ["full-tests", "ios-linked-bridge"]

[dependencies]
log.workspace = true
getrandom.workspace = true
hmac.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
solstone-core-journal-config.workspace = true
solstone-core-journal-config-write.workspace = true
solstone-core-journal-io.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["event", "fs", "process", "resource", "signal"] }
rustix = { workspace = true, features = ["process"] }
solstone-core-installed-payload.workspace = true

[dev-dependencies]
tempfile = "3.24.0"
solstone-core-journal-io = { workspace = true, features = ["test-hooks"] }

[[test]]
name = "bounded_child_process"
path = "tests/bounded_child_process.rs"
required-features = ["full-tests"]


[[test]]
name = "native_archive_readback"
path = "tests/native_archive_readback.rs"
required-features = ["native-archive-host-tests"]
