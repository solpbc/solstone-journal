[package]
name = "solstone-core-installation-identity"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Required, not cosmetic: wildcards = "deny" in deny.toml requires every
# workspace crate to opt out of publication until it has a reviewed package plan.
publish = false

# The Windows persistence backend has narrowly audited Win32 FFI boundaries.
# Keep unsafe code denied by default and permit it only at those call sites.
[lints.rust]
unsafe_code = "deny"

[dependencies]
getrandom.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["dir"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
