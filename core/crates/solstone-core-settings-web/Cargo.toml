[package]
name = "solstone-core-settings-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# Hands the dashboard shell's build script this crate's served asset list.
links = "solstone_convey_assets_settings_web"
build = "build.rs"

[lints]
workspace = true

[dependencies]
solstone-core-removals.workspace = true
axum = { workspace = true, features = ["tokio"] }
chrono.workspace = true
chrono-tz.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt"] }
solstone-core-convey-http.workspace = true
solstone-core-describe-categories.workspace = true
solstone-core-journal-config.workspace = true
solstone-core-journal-config-write.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-facets.workspace = true
solstone-core-entity.workspace = true
solstone-core-retention.workspace = true
solstone-core-processing-record.workspace = true
solstone-core-speaker-resolve.workspace = true
solstone-core-sense.workspace = true
solstone-core-system.workspace = true
solstone-core-segment.workspace = true
solstone-core-assets.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
solstone-core-convey-shell.workspace = true
tempfile = "3.24.0"
temp-env = "0.3.6"
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tower.workspace = true

[features]
full-tests = []
