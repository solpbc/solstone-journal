[package]
name = "solstone-core-journal-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "journal-app"
path = "src/main.rs"

# The Windows journal app is a Win32 program: its window icon, Start-menu
# shortcut, folder picker and sign-in entry are Win32 and COM calls. Each
# unsafe block names the call it makes and why its arguments are sound; the
# portable modules stay safe Rust.
[lints.rust]
unsafe_code = "allow"

[dependencies]
solstone-core-about.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
ureq = { workspace = true }
velopack = { workspace = true, features = ["public-utils"] }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "=0.38.2"

