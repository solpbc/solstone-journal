[package]
name = "solstone-core-journal-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
full-tests = []

[[bin]]
name = "journal-app"
path = "src/main.rs"

[[test]]
name = "updater_transport"
path = "tests/updater_transport.rs"
required-features = ["full-tests"]

[[test]]
name = "setup_ui_dom"
path = "tests/setup_ui_dom.rs"
required-features = ["full-tests"]

# The Windows journal app is a Win32 program: its window icon, Start-menu
# shortcut, folder picker and sign-in entry are Win32 and COM calls. Each
# unsafe block names the call it makes and why its arguments are sound; the
# portable modules stay safe Rust.
[lints.rust]
unsafe_code = "allow"

[dependencies]
solstone-core-about.workspace = true
solstone-core-journal-io.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
url = "2.5.8"
quick-xml = "0.41.0"
svgtypes = "=0.16.1"
spl-core.workspace = true
jsonschema.workspace = true
getrandom.workspace = true

[dev-dependencies]
tempfile = "3.24.0"
ureq = { workspace = true }
velopack = { workspace = true, features = ["public-utils"] }
sha2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
ureq = { workspace = true }
velopack = { workspace = true, features = ["public-utils"] }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
webview2-com = "=0.38.2"
