<style>

<!-- view-contract -->
<section class="search-app" id="journal-search">
<h1>search your journal</h1>
<p>find words and phrases in your journal, then read the matched entry.</p>
<form action="/app/search/" method="get" role="search">
<label for="journal-search-query">words or phrase</label>
<div class="search-query-row"><input id="journal-search-query" name="q" type="search" required placeholder="what would you like to find?" autocomplete="off"><button type="submit">search</button></div>
<details id="search-date-options"><summary>date range</summary><div class="search-dates"><div><label for="search-from">from</label><input id="search-from" name="from" type="date"></div><div><label for="search-to">through</label><input id="search-to" name="to" type="date"></div></div></details>
</form>
<div class="search-status" role="status" aria-live="polite">search your whole journal. quote an "exact phrase", or narrow to a day range above for faster results.</div>
<div class="search-results"></div>
<nav class="search-paging" aria-label="search result pages"></nav>
</section>
<script>

(function(){
 // Search on the view contract: this script only registers. Its state is the
 // address's query, so a new search, a page of results and a day's matches
 // are search's own history entries on the path it opened on.
 // The button that opens each matched entry, and what it opens.
 const ENTRIES=new WeakMap();
 function node(tag,cls,text){const e=document.createElement(tag);e.className=cls||'';if(text!==undefined)e.textContent=text;return e;}
 function dayLink(day){const a=node('a','',window.JournalFormat.day(day));a.href='/app/transcripts/'+encodeURIComponent(day);return a;}
 // G2-53: a whole-journal search rendered data.days in whatever order the
 // API returned it, which put every future-dated day (G2-52: a clock error
 // or imported content, not a defect on its own) above today — the answer
 // to "where did I talk about this recently" landed after all of them.
 // Newest-first here means newest relative to today: real days sort most
 // recent first as before, and a future-dated day still shows (nothing here
 // hides it) but sorts after every real day instead of ahead of all of them.
 function todayDay(){return window.JournalClock?window.JournalClock.today():'';}
 function orderedDays(days){
  const today=todayDay();
  return days.slice().sort((a,b)=>{
   const aFuture=a.day>today,bFuture=b.day>today;
   if(aFuture!==bFuture)return aFuture?1:-1;
   return b.day.localeCompare(a.day);
  });
 }
 function memoryPath(path){
  const found=/^(?:chronicle\/)?(\d{8})\/agent-memory-([0-9a-f]{64})\/([^/]+)\/note\.txt$/.exec(path);
  return found?{day:found[1],source:found[2],segment:found[3]}:null;
 }
 function sourceLink(hit){
  const path=String(hit.path||'');
  if(path.startsWith('entity_search:'))return '/app/entities/#'+encodeURIComponent(path.slice('entity_search:'.length));
  const screen=/^(?:chronicle\/)?(\d{8})\/([^/]+)\/([^/]+)\/talents\/screen_text\.md$/.exec(path);
  if(screen)return '/app/transcripts/'+screen[1]+'?stream='+encodeURIComponent(screen[2])+'#'+encodeURIComponent(screen[3]);
  const segment=/^(?:chronicle\/)?(\d{8})\/(?:(?<stream>[^/]+)\/)?([^/]+)\/(?:audio|screen|[^/]+_(?:audio|screen))\.jsonl/.exec(path);
  if(segment)return '/app/transcripts/'+segment[1]+(segment.groups.stream?'?stream='+encodeURIComponent(segment.groups.stream):'')+'#'+encodeURIComponent(segment[3]);
  const memory=memoryPath(path);
  if(memory)return '/app/agents/#memories/'+memory.source+'/'+memory.day+'/'+encodeURIComponent(memory.segment);
  const location=/^(?:chronicle\/)?(\d{8})\/location\.md$/.exec(path);
  if(location)return '/app/map/'+location[1];
  return null;
 }
 function sourceLabel(hit){
  const path=String(hit.path||'');
  if(path.startsWith('entity_search:'))return 'open entity';
  if(/(?:^|\/)location\.md$/.test(path))return 'open on the map';
  if(memoryPath(path))return 'open in agents';
  return 'open transcript';
 }
 function excerpt(value){
  // The API returns escaped excerpts with strong tags. Keep only text and that emphasis.
  const doc=new DOMParser().parseFromString(String(value||''),'text/html');const out=document.createDocumentFragment();
  function append(n,parent){if(n.nodeType===3){parent.append(document.createTextNode(n.textContent));return;}if(n.nodeType!==1)return;const dest=n.tagName==='STRONG'?node('mark'):parent;if(dest!==parent)parent.append(dest);for(const child of n.childNodes)append(child,dest);}
  for(const child of doc.body.childNodes)append(child,out);return out;
 }
 // G2-B04: a stored agent output is a JSON record, and the excerpt used to be
 // that record — braces, keys, the raw model id and a millisecond epoch, with
 // the one readable sentence buried inside it. The record is now read on the
 // server, before the 50-word cap that used to make anything longer than 50
 // words unparseable here and silently drop the whole readable path; the hit
 // arrives as readable text with its terms already bolded and its timestamp in
 // `ts`. The one exception is a row that matches only on a field the readable
 // sentences never carry: there the excerpt *is* the record, and the server
 // then sends no `record` so this card never prints it twice (FE3 #3).
 // The count line's words, one and many, so one match reads as one.
 const COUNT_COPY={match:{one:'match',other:'matches'},day:{one:'day',other:'days'}};
 function counted(n,noun){return `${n.toLocaleString()} ${n===1?COUNT_COPY[noun].one:COUNT_COPY[noun].other}`;}
 function matchesStatus(total,days){return `${counted(total,'match')} across ${counted(days,'day')}.`;}
 function renderHit(hit,dayHref){
  const card=node('article','search-result');const meta=node('div','search-meta');
  const recordTime=Number.isFinite(hit.ts)&&hit.ts>0?window.JournalFormat.time(hit.ts):'';
  const rawStream=String(hit.stream||'').trim();
  const memorySource=memoryPath(String(hit.path||''));
  // A memory names the agent that saved it. The name is the agent's own choice; the key tells two apart.
  const streamLabel=memorySource&&hit.creation_label?String(hit.creation_label)+' · '+memorySource.source.slice(0,4):rawStream&&window.JournalFormat?window.JournalFormat.stream(rawStream):'';
  // Don't say the type twice: drop the agent label when the stream label
  // already says it, as its what word ("Audio" beside an audio label) or as
  // an import ("Imported" beside an imported label).
  let showAgentLabel=Boolean(hit.agent_label);
  if(showAgentLabel&&rawStream){
   const agentKey=String(hit.agent_label).trim().toLowerCase();
   const says=window.JournalFormat.streamSays(rawStream);
   if((says.imported&&agentKey==='imported')||(says.what&&agentKey===says.what))showAgentLabel=false;
  }
  if(showAgentLabel)meta.append(node('span','',hit.agent_label));
  if(hit.facet_title)meta.append(node('span','',hit.facet_title));
  if(streamLabel){
   const streamSpan=node('span','',streamLabel);
   streamSpan.setAttribute('title',rawStream);
   meta.append(streamSpan);
  }
  if(recordTime)meta.append(node('span','',recordTime));
  // Screen text names when it was on screen; the segment id and its offset stand in only when it can't.
  if(hit.segment)meta.append(node('span','search-citation',hit.time?String(hit.time):String(hit.segment)+(hit.minute?' · '+String(hit.minute):'')));
  card.append(meta);const text=node('p','search-excerpt');
  text.append(excerpt(hit.text));
  card.append(text);
  const actions=node('div','search-actions');const destination=sourceLink(hit);
  if(destination){const a=node('a','search-link',sourceLabel(hit));a.href=destination;actions.append(a);}
  else if(hit.week_url){const a=node('a','search-link','open that week →');a.href=hit.week_url;actions.append(a);}
  // G2-B09: this link goes exactly where the day heading above it already
  // goes, so on a page of five results per day it was the same link a hundred
  // times over, teaching the eye to skip the one control the card has. Offer
  // it only when the day heading is not already carrying it.
  else if(hit.day){const href='/app/transcripts/'+encodeURIComponent(hit.day);if(href!==dayHref){const a=node('a','search-link','open that day →');a.href=href;actions.append(a);}}
  const path=String(hit.path||'');
  if(path&&!path.startsWith('entity_search:')&&hit.entry_id){
   const button=node('button','','read matched entry');button.type='button';button.setAttribute('aria-expanded','false');const content=node('pre','search-source');content.hidden=true;
   ENTRIES.set(button,{path,idx:String(hit.idx),entry_id:String(hit.entry_id),content});
   actions.append(button);card.append(actions,content);
  }else{
   // No entry to open, so the disclosure that normally holds the raw record is
   // not there. Keep the record reachable rather than dropping it (G2-B04).
   if(actions.childNodes.length)card.append(actions);
   if(hit.record){const disclosure=node('details');disclosure.append(node('summary','','the stored record'),node('pre','search-source',String(hit.record)));card.append(disclosure);}
  }
  return card;
 }
 const SEARCH_FAILURE_REASONS={
  index_locked:'the search index is busy right now.',
  index_absent:"your journal doesn't have a search index yet.",
  index_unreadable:"the search index couldn't be read.",
  empty_index:"there's nothing indexed yet."
 };
 // The answers this page drew for its last few history entries, so going
 // back or forward to a search shows it at once and its scroll can come back.
 // Keyed by entry: a move forward, a reload or a new tab is a new entry, and
 // reads. Data only, in memory. This script runs once in the life of the page,
 // so they outlive a move to another view and back.
 const HELD_LIMIT=8;const held=new Map();
 function hold(id,url,data){if(!id)return;held.delete(id);held.set(id,{url,data});while(held.size>HELD_LIMIT)held.delete(held.keys().next().value);}
 function heldFor(id,url){const entry=id?held.get(id):null;return entry&&entry.url===url?entry.data:null;}
 // Where each of search's own history entries was scrolled to.
 const SCROLL_LIMIT=50;const scrolls=new Map();
 function keepScroll(id){if(!id)return;scrolls.delete(id);scrolls.set(id,window.scrollY||0);while(scrolls.size>SCROLL_LIMIT)scrolls.delete(scrolls.keys().next().value);}
 function entryId(){return window.history.state&&window.history.state.solRoute?window.history.state.solRoute.id:null;}
 function stateOf(search){
  const params=new URLSearchParams(search);
  const q=params.get('q')||'',from=params.get('from')||'',to=params.get('to')||'';
  const offset=Math.max(0,Number.parseInt(params.get('offset')||'0',10)||0);
  const exactDay=Boolean(from&&from===to);
  return {search,params,q,from,to,offset,exactDay,limit:exactDay?100:5};
 }
 function focusQuietly(el){try{el.focus({preventScroll:true});}catch(_){el.focus();}}

 function mount(ctx){
  const root=document.getElementById('journal-search');
  const form=root.querySelector('form');
  const query=root.querySelector('[name=q]');const from=root.querySelector('[name=from]');const to=root.querySelector('[name=to]');
  const status=root.querySelector('.search-status');const results=root.querySelector('.search-results');const paging=root.querySelector('.search-paging');
  const dateOptions=root.querySelector('#search-date-options');
  const initialStatus=status.textContent;
  // Search's own entries all keep the path it opened on; only the query moves.
  // A mount placed after the address had already moved on (a move made within
  // a frame of the last) still has search's own path, never another view's.
  const path=/^\/app\/search\/?$/.test(window.location.pathname)?window.location.pathname:'/app/search/';
  let shown=stateOf(window.location.search);
  let shownId=entryId();
  let epoch=0;let running=null;let report=(state)=>ctx.ready(state);
  // Drawing is for this mount while the address is still search's. A move to
  // another view has written its address before this view is taken down.
  const live=(mine)=>mine===epoch&&!ctx.disposed&&window.location.pathname===path;

  function fill(state){
   query.value=state.q;from.value=state.from;to.value=state.to;
   // G2-39: the day-range narrowing option used to stay collapsed until the
   // owner opened it manually, so the fastest way to search was invisible on
   // first visit. Default it open until a search has actually run.
   dateOptions.open=Boolean(state.from||state.to||!state.q.trim());
  }
  function pageUrl(state,changes){const p=new URLSearchParams(state.params);p.delete('offset');Object.entries(changes).forEach(([k,v])=>p.set(k,v));return path+'?'+p.toString();}

  function stopProgress(){if(progressTimeout){ctx.clearTimeout(progressTimeout);progressTimeout=0;}if(progressInterval){ctx.clearInterval(progressInterval);progressInterval=0;}}

  // A redraw takes out what it replaces. Focus inside it goes to <main> first,
  // then to the first day heading the redraw puts in, never to the page.
  // Search's own moves and pops take focus from <main> or from nowhere too:
  // a tap on a phone focuses nothing, and blurs what had focus.
  function holdFocus(ours){
   const at=document.activeElement;
   const main=document.getElementById('main-content');

   const inside=at&&root.contains(at)&&!form.contains(at);
   const lost=!at||at===document.body||at===main;

   if(!main.hasAttribute('tabindex'))main.setAttribute('tabindex','-1');

   const heading=results.querySelector('h2');
   if(!heading)return;
   heading.setAttribute('tabindex','-1');focusQuietly(heading);
  }

   status.textContent=data.total?matchesStatus(data.total,data.total_days):'no matches. try fewer words or a wider date range.';
   if(data.rebuilding)status.append(node('p','','search is rebuilding, so older days may be missing for now.'));
   if(data.relaxed&&data.total)status.append(node('p','','nothing matched your exact search, so these are broader matches.'));
   for(const day of orderedDays(data.days)){
    const section=node('section','search-day');const heading=node('h2');heading.append(dayLink(day.day));section.append(heading);
    if(day.total>day.showing)section.append(node('p','search-meta',`showing the top ${day.showing} of ${day.total} matches for this day.`));
    const dayHref='/app/transcripts/'+encodeURIComponent(day.day);
    for(const hit of day.results)section.append(renderHit(hit,dayHref));
    if(day.total>day.showing&&!state.exactDay){const a=node('a','search-link','more from this day');const date=day.day.replace(/(\d{4})(\d{2})(\d{2})/,'$1-$2-$3');a.href=pageUrl(state,{from:date,to:date});section.append(a);}
    else if(day.total>day.showing)section.append(node('p','search-meta','add words to narrow these matches.'));
    results.append(section);
   }
   if(state.offset>0){const a=node('a','search-link','newer matching days');a.href=pageUrl(state,{offset:String(Math.max(0,state.offset-20))});paging.append(a);}
   if(state.offset+data.days.length<data.total_days){const a=node('a','search-link','older matching days');a.href=pageUrl(state,{offset:String(state.offset+20)});paging.append(a);}
   if(state.offset>0&&!data.days.length){const a=node('a','search-link','back to first results');a.href=pageUrl(state,{offset:'0'});paging.append(a);}
  }

  // Shows `state`. A restore (back or forward onto this entry) draws the
  // answer this page already had for it; anything else reads. Scrolls to
  // `scroll` once drawn.
  async function load(state,{restore=false,scroll=null,ours=false}={}){
   epoch+=1;const mine=epoch;const id=entryId();
   abortRunning();running=null;stopProgress();root.removeAttribute('aria-busy');
   shown=state;
   const moved=holdFocus(ours);
   const settle=()=>{placeFocus(moved);if(scroll!==null)window.scrollTo(0,scroll);};
   results.replaceChildren();paging.replaceChildren();status.classList.remove('search-error');
   if(!state.q.trim()){status.textContent=initialStatus;settle();report('content');return;}
   if(state.from&&state.to&&state.from>state.to){status.textContent='choose an end date on or after the start date.';status.classList.add('search-error');settle();report('error');return;}
   const p=new URLSearchParams({q:state.q.trim(),limit:String(state.limit),offset:String(state.offset)});
   if(state.from)p.set('day_from',state.from.replaceAll('-',''));if(state.to)p.set('day_to',state.to.replaceAll('-',''));
   const url='/app/search/api/search?'+p;
   const kept=restore?heldFor(id,url):null;
   if(kept){hold(id,url,kept);draw(state,kept);settle();report(kept.total?'content':'empty');return;}

  // A page that has learned the journal is another build has the old code.
  // As the router does for every move, it loads the address as a new page.
  function stale(){return !!(window.appEvents&&window.appEvents.buildChanged&&window.appEvents.buildChanged());}
  // One of search's own moves: a new search, a page of results, a day's
  // matches, the empty search. One history entry, then a read.
  function own(state,how,{focus=true}={}){
   if(stale()){window.location.assign(path+state.search);return;}
   if(how==='push'){keepScroll(entryId());ctx.history.push(path+state.search);shownId=entryId();window.scrollTo(0,0);}
   else if(how==='replace'){ctx.history.replace(path+state.search);}

   // stay up over the results: let go of the field and wait on <main>.
   const at=document.activeElement;

   }
   own(stateOf(search),search===window.location.search?'replace':'push',{focus:false});
  });

   event.preventDefault();

   if(window.location.pathname!==path)return;

   if(window.location.search===shown.search){shownId=id;return;}
   if(stale()){window.location.reload();return;}
   keepScroll(shownId);shownId=id;
   const state=stateOf(window.location.search);fill(state);
   const reportReady=window.beginViewReady?window.beginViewReady('search',{update:true}):null;
   report=(s)=>{ctx.ready(s);if(reportReady)reportReady(s);};
   load(state,{restore:true,scroll:scrolls.has(id)?scrolls.get(id):0,ours:true});
  });
  // Opening a matched entry. A read still out when the page of results, or
  // the view, has gone draws nothing.
  results.addEventListener('click',(event)=>{
   const button=event.target&&event.target.closest?event.target.closest('button'):null;
   const entry=button&&ENTRIES.get(button);
   if(!entry)return;
   const content=entry.content;
   if(!content.hidden){content.hidden=true;button.setAttribute('aria-expanded','false');button.textContent='read matched entry';return;}
   content.hidden=false;button.setAttribute('aria-expanded','true');button.textContent='close entry';
   if(content.dataset.loaded)return;
   content.textContent='loading entry…';
   const mine=epoch;
   ctx.read('/app/search/api/entry?'+new URLSearchParams({path:entry.path,idx:entry.idx,entry_id:entry.entry_id})).then(
    (data)=>{if(!live(mine)||!content.isConnected)return;content.replaceChildren(node('span','search-meta',data.reindexed_since_search?'this file was indexed again after your search, so this may not match the result':'as last indexed'),document.createTextNode(data.content));content.dataset.loaded='true';},
    (error)=>{if(!live(mine)||!content.isConnected)return;content.textContent="couldn't open this entry. "+String(error.serverMessage||error.message||'try again.');if(error.rawDetail)content.textContent+=' '+String(error.rawDetail);}
   );
  });
  query.addEventListener('input',abortRunning);from.addEventListener('input',abortRunning);to.addEventListener('input',abortRunning);
  ctx.onDispose(()=>{abortRunning();running=null;epoch+=1;});

  fill(shown);
  load(shown,{restore:true});
  return {dispose(){}};
 }

 window.SolViews.register('search',{mount});
})();
</script>
