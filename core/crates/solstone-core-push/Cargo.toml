[package]
name = "solstone-core-push"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
axum = { workspace = true }
base64 = "0.22.1"
hkdf = "0.12.4"
http = "1.5.0"
log = { workspace = true }
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic", "pkcs8", "ecdh"] }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10.9"
solstone-core-convey-http = { workspace = true }
solstone-core-journal-io = { workspace = true }
solstone-core-sol-link = { workspace = true, features = ["host"] }
time = { version = "0.3.54", features = ["formatting", "parsing"] }
tokio = { workspace = true, features = ["rt"] }
ureq = { workspace = true, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.24.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true }

[lints]
workspace = true

[features]
full-tests = []
