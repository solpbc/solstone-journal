        } else {
          cap.textContent = "";
        }
        return;
      }

      const { list, W, H, k, mx, my } = frame();
      lastK = k;
      const px = (x) => W / 2 + (x - mx) * k;
      const py = (y) => (H - 60) / 2 + 6 - (y - my) * k;
      const inView = (x, y) => px(x) > 6 && px(x) < W - 6 && py(y) > 10 && py(y) < H - 6;

      const screenOf = (ring) => ring.map(([x, y]) => `${px(x).toFixed(1)},${py(y).toFixed(1)}`).join(" ");
      const { res, groups } = drawnAt(list, k);
      drawnParents = new Map((groups || []).map((g) => [g.id, g]));
      const polys = groups ? groups.map((g) => {
        const d = g.days.size;
        const one = g.kids.length === 1 ? g.kids[0] : null;
        const cls = ["map-month-cell"];
        if (activeDay) cls.push(g.days.has(activeDay) ? "ring" : "dim");
        if (g.kids.some((c) => c.id === activeCell)) cls.push("sel");
        const title = one ? `${one.label} · ${plural(d, "day")}` : `${plural(g.kids.length, "area")} · ${plural(d, "day")}`;
        return `<polygon class="${cls.join(" ")}" data-parent="${g.id}" data-res="${res}"${one ? ` data-cell="${one.id}"` : ""} points="${screenOf(g.ring)}" style="fill:var(--b${bin(d)})"><title>${escapeHtml(title)}</title></polygon>`;
      }) : list.map((c) => {
        const d = c.dayCount;
        const cls = ["map-month-cell"];
        if (activeDay) cls.push(c.days.includes(activeDay) ? "ring" : "dim");
        if (activeCell === c.id) cls.push("sel");
        return `<polygon class="${cls.join(" ")}" data-cell="${c.id}" points="${screenOf(c.ring)}" style="fill:var(--b${bin(d)})"><title>${escapeHtml(c.label)} · ${escapeHtml(plural(d, "day"))}</title></polygon>`;
      });

      const towns = m.towns.filter((t) => inView(t.x, t.y)).map((t) => {
        const x = px(t.x), y = py(t.y);
        const anchor = x > W - 90 ? "end" : "start";
        return `<g class="map-month-town" aria-hidden="true"><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5"/><text x="${(x + (anchor === "end" ? -6 : 6)).toFixed(1)}" y="${(y - 6).toFixed(1)}" text-anchor="${anchor}">${escapeHtml(t.name)}</text></g>`;
      });

      const target = 110 / k;
      const nice = [100, 200, 500, 1000, 2000, 5000, 10000].find((n) => n >= target * 0.6) || 10000;
      const bl = nice * k;
      const scale = `<g class="map-month-scale" aria-hidden="true"><line x1="14" y1="${H - 16}" x2="${(14 + bl).toFixed(1)}" y2="${H - 16}"/><line x1="14" y1="${H - 21}" x2="14" y2="${H - 11}"/><line x1="${(14 + bl).toFixed(1)}" y1="${H - 21}" x2="${(14 + bl).toFixed(1)}" y2="${H - 11}"/><text x="14" y="${H - 25}">${nice >= 1000 ? `${nice / 1000} km` : `${nice} m`}</text></g>`;

      const home = activeChoice?.id === 'home';
      const area = ['area', String((home ? activeChoice.placeName : activeChoice?.name) || '')];
      const suffix = home ? '.home' : '';
      let summary = groups
        ? window.JournalI18n.render(`journal.window.map.month.map.group.summary${suffix}`, [area,
            ...quantityArgs(groups.length, 'shaded_areas', 'shaded_quantity'),
            ...quantityArgs(list.length, 'areas', 'area_quantity'), ['size', String(DRAWN_SIZE[res])],
          ])
        : window.JournalI18n.render(`journal.window.map.month.map.area.summary${suffix}`, [area,
            ...quantityArgs(list.length, 'shaded_areas', 'shaded_quantity'), ['size', String(SIZE.label)],
          ]);
      if (view.z > 1) summary += ' ' + window.JournalI18n.render('journal.window.map.month.zoom.notice');
      const outside = list.filter((c) => !(px(c.cx) > 0 && px(c.cx) < W && py(c.cy) > 0 && py(c.cy) < H - 50)).length;
      outBtn.hidden = !outside;
      outBtn.textContent = outside ? window.JournalI18n.render('journal.window.map.month.areas.outside.show.all', [...quantityArgs(outside)]) : "";
      wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${escapeHtml(summary)}">${polys.join("")}${towns.join("")}${scale}</svg>`;

      const activeCellObj = activeChoice?.areas.find((c) => c.id === activeCell);
      if (activeCell && activeCellObj) {
        cap.innerHTML = `<strong>${escapeHtml(activeCellObj.label)}</strong> · ${window.JournalI18n.renderHtml('journal.window.map.month.area.days.in.month', quantityArgs(activeCellObj.dayCount))}`;
      } else if (activeDay) {

        cap.innerHTML = `<strong>${escapeHtml(longDay(activeDay))}</strong> · ${n ? window.JournalI18n.renderHtml('journal.window.map.month.areas.outlined', [...quantityArgs(n)]) : window.JournalI18n.renderHtml('journal.window.map.month.map.nothing.drawn')}`;
      } else {
        cap.textContent = "";
      }
    }

          if (dayRecord.unreadable) quiet.push(window.JournalI18n.render('journal.window.map.window.explanation.your.journal.couldn.t.read.part'));
          if (readingsLine) quiet.push(readingsLine);
          detEl.innerHTML = `${head}<p style="margin-top:8px">${window.JournalI18n.renderHtml('journal.window.map.visible.text.location.was.kept.this.day.but')}</p>${quiet.map((n) => `<p class="map-muted" style="margin-top:6px">${escapeHtml(n)}</p>`).join("")}`;
        } else {
          const es = m.stops.filter((s) => s.days.includes(activeDay));
          const rows = es.map((s) => {
            const choiceOfStop = m.choices.find((c) => c.test(s));
            const cellOfStop = choiceOfStop?.areas.find((a) => a.id === s.cellId);
            const bits = [
              s.kind === "stay" ? window.JournalI18n.render('journal.window.map.month.day.stay.readings', quantityArgs(s.item.count)) : window.JournalI18n.render('journal.window.map.window.explanation.a.visit.your.phone.reported'),
              s.start == null ? window.JournalI18n.render('journal.window.map.entry.time.missing.arrival') : s.end == null ? window.JournalI18n.render('journal.window.map.entry.time.missing.departure') : "",
            ].filter(Boolean);
            if (!s.onMap) bits.push(window.JournalI18n.render('journal.window.map.window.explanation.hidden.from.the.map'));
            else if (!s.drawable) bits.push(window.JournalI18n.render('journal.window.map.window.explanation.margin.of.error.over.m.or'));
            else if (choiceOfStop && choiceOfStop !== activeChoice) bits.push(choiceOfStop.trip ? window.JournalI18n.render('journal.window.map.month.choice.trip', [['date', String(choiceOfStop.dateLabel)]]) : choiceOfStop.name);
            const inner = `<span class="when">${escapeHtml(spanText(s, activeDay))}</span><span class="what">${escapeHtml(s.words)}</span><span class="meta">${escapeHtml(bits.join(" · "))}</span>`;
            return cellOfStop ? `<li><button class="map-month-row" type="button" data-cell="${cellOfStop.id}" data-choice="${choiceOfStop.id}">${inner}</button></li>` : `<li><div class="map-month-row">${inner}</div></li>`;
          });
          const notes = [];
          for (const dev of dayRecord.interruptions || []) {
            notes.push(deviceInterruption(dev, dev.count, true));
          }
          if (dayRecord.unreadable) {
            notes.push(window.JournalI18n.render('journal.window.map.window.explanation.your.journal.couldn.t.read.part'));
          }
          if (readingsLine) {
            notes.push(readingsLine);
          }
          detEl.innerHTML = `${head}${stripMonthDay(activeDay, es)}<p class="map-month-subhead">${window.JournalI18n.renderHtml('journal.window.map.visible.text.stops.in.order')}</p><ul class="map-month-rows">${rows.join("")}</ul><div class="map-month-notes">${notes.map((n) => `<p class="map-muted">${escapeHtml(n)}</p>`).join("")}</div>`;
        }
      } else {
        const stopsDaysCount = m.days.filter((d) => d.state === "stops").length;
        const dates = [...quantityArgs(stopsDaysCount, 'days_with_stops', 'stops_quantity'), ['days_in_month', String(m.m)]];
        let glanceText;
        if (m.anchorId) {
          const trips = m.choices.filter((c) => c.trip).length;
          const home = m.choices[0];
          const daysInArea = [...dates, ['home_days', String(home.days.length)], ['home_area', String(home.placeName)]];
          glanceText = trips
            ? window.JournalI18n.render('journal.window.map.month.stops.glance.trips.days', [...daysInArea, ...quantityArgs(trips, 'trips', 'trip_quantity')])
            : window.JournalI18n.render('journal.window.map.month.stops.glance.home.days', daysInArea);
        } else {
          glanceText = window.JournalI18n.render('journal.window.map.month.stops.glance', dates);
        }
        if (m.noLocation) {
          glanceText += ' ' + window.JournalI18n.render('journal.window.map.month.location.gaps', quantityArgs(m.noLocation));
        }
        detEl.innerHTML = `<h2 id="map-month-detail-h">${window.JournalI18n.renderHtml('journal.window.map.section.heading.the.month.at.a.glance')}</h2>
          <p style="margin-top:6px">${escapeHtml(glanceText)}</p>
          <p class="map-muted" style="margin-top:8px">${m.anchorId ? window.JournalI18n.renderHtml('journal.window.map.window.explanation.choose.an.area.on.the.map') : window.JournalI18n.renderHtml('journal.window.map.window.explanation.choose.a.day.in.the.calendar')}</p>`;
      }
    }

    function renderAreas() {
      const areasEl = root.querySelector("[data-map-month-areas]");
      const moreBtn = root.querySelector("[data-map-month-areas-more]");
      const sumEl = root.querySelector("[data-map-month-areas-sum]");
      const list = activeChoice ? activeChoice.areas : [];
      const shown = showAllAreas ? list : list.slice(0, 8);
      const shared = activeChoice?.sharedRegion;
      const group = activeChoice?.trip ? 'trip' : 'region';
      const args = quantityArgs(list.length);
      const home = activeChoice?.id === 'home';
      args.push(activeChoice?.trip ? ['date', String(activeChoice.dateLabel)] : ['area', String((home ? activeChoice.placeName : activeChoice?.name) || '')]);
      if (shared) args.push(['region', String(shared)]);
      sumEl.textContent = window.JournalI18n.render(`journal.window.map.month.areas.list.${group}${shared ? '.shared' : ''}${home ? '.home' : ''}`, args);
      areasEl.innerHTML = shown.map((c) => `<li><button class="map-month-area" type="button" data-cell="${c.id}" aria-pressed="${activeCell === c.id}">
        <i class="map-month-sw" style="background:var(--b${bin(c.dayCount)})" aria-hidden="true"></i>
        <span class="name">${escapeHtml(c.listLabel)}<span class="town">${escapeHtml(fromBusiest(c, list, activeChoice.trip))}${c.nights ? ` · ${escapeHtml(plural(c.nights, "night"))}` : ""}</span></span>
        <span class="n">${escapeHtml(plural(c.dayCount, "day"))}</span></button></li>`).join("");
      moreBtn.hidden = list.length <= 8;
      moreBtn.textContent = showAllAreas ? window.JournalI18n.render('journal.window.map.visible.text.show.fewer') : window.JournalI18n.render('journal.window.map.month.areas.show.all', [...quantityArgs(list.length)]);
      moreBtn.setAttribute("aria-expanded", String(showAllAreas));
    }

    function renderAll() {
      renderMapSvg();
      renderNotDrawn();
      renderCalendar();
      renderDetail();
      renderAreas();
    }

    root.querySelector("[data-map-month-where]").addEventListener("change", (ev) => {
      const val = ev.target.value;
      const ch = m.choices.find((c) => c.id === val);
      if (ch && ch !== activeChoice) {
        activeChoice = ch;
        activeCell = null;
        showAllAreas = false;
        view.z = 1; view.dx = 0; view.dy = 0; view.all = false;
        renderChoices();
        renderAll();
        live(ch.trip
          ? window.JournalI18n.render('journal.window.map.month.live.showing.choice', [['name', String(ch.name)]])
          : window.JournalI18n.render('journal.window.map.month.live.showing.home', [['area', String(ch.placeName)]]));
      }
    });

    root.querySelector("[data-map-month-svg]").addEventListener("click", (ev) => {
      if (dragged) { dragged = false; return; }
      let cid = ev.target.closest("[data-cell]")?.getAttribute("data-cell");
      if (!cid) {
        const g = drawnParents.get(ev.target.closest("[data-parent]")?.getAttribute("data-parent"));
        if (!g) return;
        if (zoomToParent(g)) {
          renderMapSvg();
          live(window.JournalI18n.render('journal.window.map.month.areas.live.zoom', [...quantityArgs(g.kids.length)]));
          return;
        }
        // At the zoom limit, choose the parent's area with the most days.
        cid = g.kids[0].id;
      }
      if (cid) {
        activeCell = cid === activeCell ? null : cid;
        activeDay = null;
        renderAll();
        const c = activeChoice?.areas.find((a) => a.id === activeCell);
        live(c ? window.JournalI18n.render('journal.window.map.month.area.live.days', [...quantityArgs(c.dayCount), ['name', String(c.label)]]) : window.JournalI18n.render('journal.window.map.month.live.choice.none'));
      }
    });

    root.querySelector("[data-map-month-svg]").addEventListener("pointerdown", (ev) => {
      drag = { x: ev.clientX, y: ev.clientY, dx: view.dx, dy: view.dy, id: ev.pointerId };
      dragged = false;
    });
    releaseMonth();
    monthOff.push(ctx.on(window, "pointermove", (ev) => {
      if (!drag || ev.pointerId !== drag.id) return;
      const mx = ev.clientX - drag.x, my = ev.clientY - drag.y;
      if (!dragged && Math.hypot(mx, my) < 5) return;
      dragged = true;
      root.querySelector("[data-map-month-map]").classList.add("dragging");
      const svg = root.querySelector("[data-map-month-svg] svg");
      const scale = svg ? (svg.viewBox?.baseVal?.width || 600) / (svg.getBoundingClientRect?.()?.width || 600) : 1;
      view.dx = drag.dx - mx * scale / lastK;
      view.dy = drag.dy + my * scale / lastK;
      renderMapSvg();
    }));
    monthOff.push(ctx.on(window, "pointerup", () => {
      drag = null;
      root.querySelector("[data-map-month-map]").classList.remove("dragging");
      if (dragged) {
        const mine = epoch;
        ctx.setTimeout(() => {
          if (mine !== epoch) return;
          dragged = false;
        }, 0);
      }
    }));

    root.querySelector("[data-map-month-outside]").addEventListener("click", () => {
      view.z = 1; view.dx = 0; view.dy = 0; view.all = true;
      renderMapSvg();
      live(window.JournalI18n.render('journal.window.map.month.live.areas.all'));
    });

    root.querySelector(".map-month-zoom").addEventListener("click", (ev) => {
      const zBtn = ev.target.closest("[data-map-month-zoom]");
      const z = zBtn?.getAttribute("data-map-month-zoom");
      if (!z) return;
      if (z === "fit") {
        view.z = 1; view.dx = 0; view.dy = 0; view.all = false;
        renderMapSvg();
        live(window.JournalI18n.render('journal.window.map.month.live.fit'));
        return;
      }
      const f = z === "in" ? 1.6 : 1 / 1.6;
      const nz = Math.min(12, Math.max(1, view.z * f));
      const c = activeCell && activeChoice?.areas.find((a) => a.id === activeCell);
      if (c && z === "in") {
        view.all = true;
        const list = activeChoice.areas;
        const xs = list.flatMap((x) => x.ring);
        const cx0 = (Math.min(...xs.map((p) => p[0])) + Math.max(...xs.map((p) => p[0]))) / 2;
        const cy0 = (Math.min(...xs.map((p) => p[1])) + Math.max(...xs.map((p) => p[1]))) / 2;
        view.dx = c.cx - cx0;
        view.dy = c.cy - cy0;
      }
      if (nz === 1) { view.dx = 0; view.dy = 0; }
      view.z = nz;
      renderMapSvg();
      live(nz === 1 ? window.JournalI18n.render('journal.window.map.window.explanation.map.fitted.to.these.areas') : window.JournalI18n.render('journal.window.map.month.live.zoom.amount', [['zoom', String(z)]]));
    });

    root.querySelector("[data-map-month-areas]").addEventListener("click", (ev) => {
      const btn = ev.target.closest("[data-cell]");
      const cid = btn?.getAttribute("data-cell");
      if (cid) {
        activeCell = cid === activeCell ? null : cid;
        activeDay = null;
        renderAll();
        const c = activeChoice?.areas.find((a) => a.id === activeCell);
        live(c ? window.JournalI18n.render('journal.window.map.month.area.live.days', [...quantityArgs(c.dayCount), ['name', String(c.label)]]) : window.JournalI18n.render('journal.window.map.month.live.choice.none'));
      }
    });

    root.querySelector("[data-map-month-areas-more]").addEventListener("click", () => {
      showAllAreas = !showAllAreas;
      if (showAllAreas) {
        view.all = true;
      }
      renderMapSvg();
      renderAreas();
    });

    root.querySelector("[data-map-month-cal]").addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-day]");
      if (!b || b.tagName.toLowerCase() !== "button") return;
      const dStr = b.getAttribute("data-day");
      calFocus = parseInt(dStr.slice(6, 8), 10);
      if (activeDay === dStr) {
        activeDay = null;
      } else {
        activeDay = dStr;
        activeCell = null;
        if (activeChoice && !activeChoice.days.includes(dStr)) {
          const other = m.choices.find((c) => c.days.includes(dStr));
          if (other) {
            activeChoice = other;
            showAllAreas = false;
            view.z = 1; view.dx = 0; view.dy = 0; view.all = false;
            renderChoices();
          }
        }
      }
      renderAll();
      if (activeDay) live(longDay(activeDay));
    });

    root.querySelector("[data-map-month-cal]").addEventListener("keydown", (ev) => {
      const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[ev.key];
      const selectable = m.days.filter((x) => x.state !== "future").map((x) => parseInt(x.day.slice(6, 8), 10));
      if (selectable.length === 0) return;
      let d = calFocus;
      if (step) {
        let cand = Math.min(m.days.length, Math.max(1, d + step));
        if (cand > selectable[selectable.length - 1]) cand = selectable[selectable.length - 1];
        if (cand < selectable[0]) cand = selectable[0];
        while (cand <= selectable[selectable.length - 1] && cand >= selectable[0] && !selectable.includes(cand)) {
          cand += step > 0 ? 1 : -1;
        }
        d = cand;
      } else if (ev.key === "Home") {
        d = selectable[0];
      } else if (ev.key === "End") {
        d = selectable[selectable.length - 1];
      } else {
        return;
      }
      ev.preventDefault();
      calFocus = d;
      root.querySelectorAll("[data-map-month-cal] button").forEach((b) => {
        const bDay = parseInt(b.getAttribute("data-day").slice(6, 8), 10);
        b.tabIndex = bDay === d ? 0 : -1;
      });
      const targetBtn = root.querySelector(`[data-map-month-cal] button[data-day="${m.month}${String(d).padStart(2, "0")}"]`);
      targetBtn.focus();
    });

    root.querySelector("[data-map-month-detail]").addEventListener("click", (ev) => {
      if (ev.target.closest("[data-map-month-clear]")) {
        activeCell = null;
        activeDay = null;
        renderAll();
        live(window.JournalI18n.render('journal.window.map.month.live.choice.none'));
        return;
      }
      if (ev.target.closest("[data-map-month-alldays]")) {
        showAllDaysInArea = !showAllDaysInArea;
        renderDetail();
        return;
      }
      const dayBtn = ev.target.closest("[data-day]");
      if (dayBtn) {
        const dStr = dayBtn.getAttribute("data-day");
        activeDay = dStr;
        activeCell = null;
        calFocus = parseInt(dStr.slice(6, 8), 10);
        renderAll();
        live(longDay(activeDay));
        root.querySelector("[data-map-month-detail]").focus();
        return;
      }
      const cellBtn = ev.target.closest("[data-cell]");
      if (cellBtn) {
        const chId = cellBtn.getAttribute("data-choice");
        const cid = cellBtn.getAttribute("data-cell");
        if (chId) {
          const ch = m.choices.find((c) => c.id === chId);
          if (ch && ch !== activeChoice) {
            activeChoice = ch;
            showAllAreas = false;
            view.z = 1; view.dx = 0; view.dy = 0; view.all = false;
            renderChoices();
          }
        }
        if (cid) {
          activeCell = cid;
          activeDay = null;
          renderAll();
          const c = activeChoice?.areas.find((a) => a.id === activeCell);
          live(c ? window.JournalI18n.render('journal.window.map.month.area.live.days', [...quantityArgs(c.dayCount), ['name', String(c.label)]]) : window.JournalI18n.render('journal.window.map.month.live.choice.none'));
          root.querySelector("[data-map-month-detail]").focus();
        }
      }
    });

    monthOff.push(ctx.on(document, "keydown", (ev) => {
      if (ev.key === "Escape" && (activeCell || activeDay)) {
        activeCell = null;
        activeDay = null;
        renderAll();
        live(window.JournalI18n.render('journal.window.map.month.live.choice.none'));
      }
    }));

    let rw = 0;
    const svgWrap = root.querySelector("[data-map-month-svg]");
    monthObserver = new ResizeObserver(() => {
      const w = svgWrap.clientWidth;
      if (Math.abs(w - rw) > 4) {
        rw = w;
        renderMapSvg();
      }
    });
    ctx.observe(monthObserver);
    monthObserver.observe(svgWrap);

    renderChoices();
    renderAll();
  }

  function showDay(day) {
    if (!DAY_RE.test(String(day || ""))) return;
    // A week, a month, places or a place is a different page, so becoming a
    // day is an arrival. A step from one day to the next is already the day
    // and leaves focus where it is.
    const arrive = !!(shell && (shell.hasAttribute("data-map-page") || shell.hasAttribute("data-map-empty")));
    if (window.DateNav && typeof window.DateNav.setDay === "function") window.DateNav.setDay(day);
    loadDay(day, arrive);
  }

  async function openUndated() {
    const mine = beginPage();
    setGate(window.SurfaceState.loading({ text: window.JournalI18n.render('journal.window.map.text.loading.your.journal.s.location') }));
    try {
      const index = await readJson("/app/map/api/index");
      if (index === STALE || mine !== epoch || !alive()) return;
      const path = String(window.location?.pathname || "");
      if (path !== "/app/map" && path !== "/app/map/") return;
      const end = index?.coverage?.end;
      if (!DAY_RE.test(String(end || ""))) {
        renderJournalEmpty();
        reportMapReady("empty");
        return;
      }
      const next = `/app/map/${end}${window.location.search || ""}${window.location.hash || ""}`;
      ctx.history.replace(next);
      if (window.SolViews && typeof window.SolViews.routeOf === "function") {
        ctx.route = window.SolViews.routeOf(window.location);
      }
      if (window.DateNav && typeof window.DateNav.setDay === "function") window.DateNav.setDay(end);
      loadDay(end);
    } catch (err) {
      if (mine !== epoch || !alive()) return;
      showError(err, () => openUndated());
      reportMapReady("error");
    }
  }

  const workspaceApi = {
    renderDay, renderWeek, renderPlaces, renderPlace, renderMonth, monthModel,
    entryTitle, entryTime, entryMeta, entryWhere, entryWhy, accuracyCard, moment, thinned,
  };

  async function mount(mountCtx) {
    ctx = mountCtx;
    shell = document.getElementById("map-shell");
    root = document.getElementById("map-view-root");
    gate = document.getElementById("map-state-gate");
    ctx.global("__mapWorkspace", workspaceApi);
    ctx.onDispose(() => {
      releasePage();
      if (ctx === mountCtx) ctx = null;
    });
    const page = pathView();
    if (page.page) loadPage(page);
    else if (mountCtx.route && DAY_RE.test(String(mountCtx.route.day || ""))) loadDay(mountCtx.route.day);
    else await openUndated();
    return { update(params) { showDay(params && params.day); } };
  }

  window.SolViews.register("map", { mount });
})();
</script>
