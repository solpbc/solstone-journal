.map-month-area .town { display: block; font-weight: 400; font-size: 12.5px; color: var(--ink-soft-paper); }
.map-month-area .n { font-size: 13.5px; color: var(--ink-soft-paper); white-space: nowrap; }
</style>

<div class="workspace-content map-shell" id="map-shell">
  <div data-date-nav></div>
  <h1 class="map-title" data-date-nav-heading></h1>
  <div id="map-state-gate"></div>
  <div id="map-view-root" hidden></div>
</div>

<script src="/static/vendor/leaflet/leaflet.js"></script>
<script src="/static/vendor/h3/h3-js.umd.js"></script>
<script>
(() => {
  "use strict";

  const DAY_RE = /^\d{8}$/;
  const MONTH_RE = /^\d{6}$/;
  const escapeHtml = (value) => window.AppServices.escapeHtml(String(value ?? ""));
  let shell = null;
  let root = null;
  let gate = null;
  const MONTHS = [window.JournalI18n.render('journal.window.map.months.label.january'), window.JournalI18n.render('journal.window.map.months.label.february'), window.JournalI18n.render('journal.window.map.months.label.march'), window.JournalI18n.render('journal.window.map.months.label.april'), window.JournalI18n.render('journal.window.map.months.label.may'), window.JournalI18n.render('journal.window.map.months.label.june'), window.JournalI18n.render('journal.window.map.months.label.july'),
    window.JournalI18n.render('journal.window.map.months.label.august'), window.JournalI18n.render('journal.window.map.months.label.september'), window.JournalI18n.render('journal.window.map.months.label.october'), window.JournalI18n.render('journal.window.map.months.label.november'), window.JournalI18n.render('journal.window.map.months.label.december')];
  const WEEKDAYS = [
    window.JournalI18n.render('journal.window.date.weekdays.sunday'),
    window.JournalI18n.render('journal.window.date.weekdays.monday'),
    window.JournalI18n.render('journal.window.date.weekdays.tuesday'),
    window.JournalI18n.render('journal.window.date.weekdays.wednesday'),
    window.JournalI18n.render('journal.window.date.weekdays.thursday'),
    window.JournalI18n.render('journal.window.date.weekdays.friday'),
    window.JournalI18n.render('journal.window.date.weekdays.saturday')
  ];
  const SHORT_WEEKDAYS = [
    window.JournalI18n.render('journal.window.date.weekdays.short.sun'),
    window.JournalI18n.render('journal.window.date.weekdays.short.mon'),
    window.JournalI18n.render('journal.window.date.weekdays.short.tue'),
    window.JournalI18n.render('journal.window.date.weekdays.short.wed'),
    window.JournalI18n.render('journal.window.date.weekdays.short.thu'),
    window.JournalI18n.render('journal.window.date.weekdays.short.fri'),
    window.JournalI18n.render('journal.window.date.weekdays.short.sat')
  ];
  const SHORT_MONTHS = [
    window.JournalI18n.render('journal.window.date.months.short.jan'),
    window.JournalI18n.render('journal.window.date.months.short.feb'),
    window.JournalI18n.render('journal.window.date.months.short.mar'),
    window.JournalI18n.render('journal.window.date.months.short.apr'),
    window.JournalI18n.render('journal.window.date.months.short.may'),
    window.JournalI18n.render('journal.window.date.months.short.jun'),
    window.JournalI18n.render('journal.window.date.months.short.jul'),
    window.JournalI18n.render('journal.window.date.months.short.aug'),
    window.JournalI18n.render('journal.window.date.months.short.sep'),
    window.JournalI18n.render('journal.window.date.months.short.oct'),
    window.JournalI18n.render('journal.window.date.months.short.nov'),
    window.JournalI18n.render('journal.window.date.months.short.dec')
  ];
  const DEVICE_TIERS = new Set(['light', 'balanced', 'full']);
  let mapState = null;
  let ctx = null;
  let epoch = 0;
  let pageAbort = null;
  let accuracyTimer = null;
  let monthOff = [];
  let monthObserver = null;
  const STALE = Object.freeze({ stale: true });

  function alive() {
    return !!(ctx && !ctx.disposed);
  }

  function reportMapReady(state) {
    if (alive()) ctx.ready(state);
  }

  function showDayChrome() {
    shell?.removeAttribute("data-map-page");
    shell?.removeAttribute("data-map-empty");
  }

  function focusNode(node) {
    if (!node || typeof node.focus !== "function") return;
    if (!node.hasAttribute("tabindex")) node.setAttribute("tabindex", "-1");
    try { node.focus({ preventScroll: true }); }
    catch (_) { node.focus(); }
  }

  // The day's own heading once it is drawn; the workspace until then, and
  // when the day has nothing to draw. Never the document.
  function focusArrived() {
    const heading = root && root.hidden !== true && root.querySelector ? root.querySelector("h1, h2") : null;
    const visible = heading && !heading.closest("[hidden]") ? heading : null;
    focusNode(visible || document.getElementById("main-content"));
  }

  function removeMap() {
    if (mapState && mapState.map && typeof mapState.map.remove === "function") {
      try { mapState.map.remove(); } catch (_) {}
    }
    mapState = null;
  }

  function releaseMonth() {
    monthOff.forEach((fn) => { try { fn(); } catch (_) {} });
    monthOff = [];
    if (monthObserver) {
      try { monthObserver.disconnect(); } catch (_) {}
      monthObserver = null;
    }
  }

  function releasePage() {
    epoch += 1;
    if (pageAbort) {
      try { pageAbort.abort(); } catch (_) {}
      pageAbort = null;
    }
    removeMap();
    if (accuracyTimer != null && ctx && typeof ctx.clearTimeout === "function") ctx.clearTimeout(accuracyTimer);
    accuracyTimer = null;
    releaseMonth();
  }

  function beginPage() {
    releasePage();
    pageAbort = window.SolStore.createAbort();
    return epoch;
  }

  // Settles when the mount or the page has moved on. A cut-off read from the
  // store never resolves, and awaiting that inside mount would keep the view.
  function readJson(url) {
    if (!alive()) return Promise.resolve(STALE);
    const asked = epoch;
    const signal = pageAbort
      ? window.SolStore.eitherSignal(ctx.signal, pageAbort.signal)
      : ctx.signal;
    const pending = ctx.read(url, { signal });
    return new Promise((resolve, reject) => {
      let done = false;
      const current = () => asked === epoch && alive();
      const finish = (aborted, value, error) => {
        if (done) return;
        done = true;
        if (signal && typeof signal.removeEventListener === "function") signal.removeEventListener("abort", onAbort);
        if (aborted || !current()) resolve(STALE);
        else if (error) reject(error);
        else resolve(value);
      };
      const onAbort = () => finish(true);
      Promise.resolve(pending).then(
        (value) => finish(false, value, null),
        (error) => finish(false, null, error)
      );
      if (signal && signal.aborted) onAbort();
      else if (signal && typeof signal.addEventListener === "function") signal.addEventListener("abort", onAbort, { once: true });
    });
  }

  function asArray(value) {
    return Array.isArray(value) ? value : [];
  }

  function dayDate(day) {
    if (!DAY_RE.test(String(day || ""))) return null;
    return new Date(Number(day.slice(0, 4)), Number(day.slice(4, 6)) - 1, Number(day.slice(6, 8)));
  }

  function longDay(day) {
    const date = dayDate(day);
    return date ? window.JournalI18n.render('journal.window.map.date.long', [['weekday', String(WEEKDAYS[date.getDay()])], ['month', String(MONTHS[date.getMonth()])], ['day', String(date.getDate())]]) : "";
  }

  function shortDay(day) {
    const date = dayDate(day);
    return date ? window.JournalI18n.render('journal.window.map.date.short', [['month', String(SHORT_MONTHS[date.getMonth()])], ['day', String(date.getDate())]]) : "";
  }

  function quantityArgs(count, name = 'count', quantity = 'quantity') {
    return [[quantity, window.JournalI18n.cardinalQuantity(count)], [name, String(count)]];
  }

  function plural(count, kind) {
    return window.JournalI18n.render(`journal.window.map.count.${kind}`, quantityArgs(count));
  }

  // A time on the day being shown reads as its clock; one on another day
  // carries that day, so a visit begun the evening before says so.
  function moment(time, day) {
    if (!time) return "";
    return time.day === day ? time.clock : window.JournalI18n.render('journal.window.map.date.time', [['day', String(shortDay(time.day))], ['clock', String(time.clock)]]);
  }

  function pieceTime(segment) {
    const match = /^(\d{2})(\d{2})\d{2}_/.exec(String(segment || ""));
    return match ? `${match[1]}:${match[2]}` : String(segment || "");
  }

  function bytes(value) {
    const size = Number(value) || 0;
    if (size >= 1e9) return `${(size / 1e9).toFixed(1)} GB`;
    return `${Math.max(1, Math.round(size / 1e6))} MB`;
  }

  function listed(names) {
    if (names.length <= 1) return names.join("");
    return window.JournalI18n.render('journal.window.map.list.conjunction', [['leading', String(names.slice(0, -1).join(", "))], ['last', String(names[names.length - 1])]]);
  }

  function nearNames(place) {
    return listed(asArray(place?.near).map((near) => near.name));
  }

  function withinName(within) {
    if (!within) return "";
    return [within.neighbourhood, within.locality].filter(Boolean).join(", ");
  }

  function pathView() {
    const parts = String(window.location?.pathname || "").split("/");
    if (parts[1] !== "app" || parts[2] !== "map") return {};
    if (parts[3] === "places") return { page: "places" };
    if (parts[3] === "place" && parts[4]) return { page: "place", id: decodeURIComponent(parts[4]) };
    if (parts[3] === "week" && DAY_RE.test(parts[4] || "")) return { page: "week", day: parts[4] };
    if (parts[3] === "month" && MONTH_RE.test(parts[4] || "")) {
      const m = parts[4];
      const mo = Number(m.slice(4, 6));
      if (mo >= 1 && mo <= 12) return { page: "month", month: m };
    }
    return {};
  }

  function placeLink(ref) {
    if (!ref || !ref.id) return "";
    const name = ref.owner_name ? window.JournalI18n.renderHtml('journal.window.map.place.named.link', [['name', String(ref.owner_name)]]) : window.JournalI18n.renderHtml('journal.window.map.window.explanation.a.place.in.your.journal');
    const hidden = ref.hidden ? ` ${window.JournalI18n.renderHtml('journal.window.map.place.visibility.hidden')}` : "";
    return `<p class="map-muted"><a class="map-link" href="/app/map/place/${encodeURIComponent(ref.id)}">${name}</a>${hidden}</p>`;
  }

  function setGate(markup) {
    root.hidden = true;
    gate.hidden = false;
    gate.innerHTML = markup;
  }

  function reveal(markup) {
    gate.hidden = true;
    gate.innerHTML = "";
    root.innerHTML = markup;
    root.hidden = false;
  }

  function showError(err, retry, heading, context = "map:day") {
    if (window.logError) window.logError(err, { context: context });
    setGate(window.SurfaceState.error({
      heading: heading || window.JournalI18n.render('journal.window.map.heading.couldn.t.open.this.day.s'),
      desc: window.CONVEY_COPY?.RELOAD_HINT,
      serverMessage: err?.serverMessage,
      detail: err,
      retry: true,
    }));
    gate.querySelector(".surface-state-retry")?.addEventListener("click", () => {
      if (!alive()) return;
      retry();
    }, { once: true });
  }

  function renderJournalEmpty() {
    shell?.removeAttribute("data-map-page");
    shell.setAttribute("data-map-empty", "");
    setGate(window.SurfaceState.empty({
      icon: window.ConveyIcons?.svg("map-pin"),
      heading: window.JournalI18n.render('journal.window.map.heading.no.location.in.your.journal.yet'),
      desc: window.JournalI18n.render('journal.window.map.window.explanation.location.comes.from.the.solstone.app'),
    }));
  }

  function renderDayEmpty(data, day) {
    const nearby = data.nearby || {};
    const links = [nearby.previous, nearby.next]
      .filter((value) => DAY_RE.test(String(value || "")))
      .map((value) => `<a href="/app/map/${escapeHtml(value)}">${window.JournalI18n.renderHtml('journal.window.map.navigation.go.day', [['date', String(longDay(value))]])}</a>`)
      .join("");
    setGate(window.SurfaceState.empty({
      icon: window.ConveyIcons?.svg("map-pin"),
      heading: window.JournalI18n.render('journal.window.map.heading.no.location.kept.for.this.day'),
      desc: window.JournalI18n.render('journal.window.map.day.location.none', [['date', String(longDay(day))]]),
    }));
    if (links) {
      const actions = document.createElement("div");
      actions.className = "map-empty-actions";
      actions.innerHTML = links;
      gate.firstElementChild?.appendChild(actions);
    }
  }

  const deviceKinds = new Set(['iphone', 'ipad', 'watch', 'android phone', 'android tablet', 'tablet', 'phone']);

  function deviceKind(device) {
    return deviceKinds.has(device.word_key) ? device.word_key.replaceAll(' ', '.') : null;
  }

  function deviceDescription(usage, device, legacyMessage, phrase = String(device.phrase)) {
    const kind = deviceKind(device);
    if (!kind) return window.JournalI18n.render(legacyMessage, [['device', phrase]]);
    const named = device.visible_name != null;
    return window.JournalI18n.render(`journal.window.map.device.${usage}.${kind}${named ? '.named' : ''}`,
      named ? [['device_name', String(device.visible_name)]] : []);
  }

  function deviceInterruption(device, count, distinguishTwice = false) {
    const kind = deviceKind(device);
    const twice = distinguishTwice && count === 2;
    const args = twice ? [] : quantityArgs(count);
    if (!kind) args.push(['device', String(device.word)]);
    return window.JournalI18n.render(`journal.window.map.device.interrupted.${kind || 'unknown'}${twice ? '.twice' : ''}`, args);
  }

  function markupHtml(parts) {
    const holder = document.createElement('div');
    for (const part of parts) {
      holder.appendChild(typeof part === 'string' ? document.createTextNode(part) : part);
    }
    return holder.innerHTML;
  }

  function deviceNotes(device) {
    const notes = [];
    if (device.platform === "android") {
      notes.push(window.JournalI18n.renderHtml('journal.window.map.window.explanation.approximate.location.each.reading.is.only'));
    } else if (device.platform === "watchos") {
      notes.push(window.JournalI18n.renderHtml('journal.window.map.window.explanation.your.watch.gives.only.approximate.location'));
    } else if (DEVICE_TIERS.has(device.tier)) {
      notes.push(markupHtml(window.JournalI18n.renderMarkup(`journal.window.map.device.detail.tier.${device.tier}`, [], {
        elements: { level: document.createElement('strong') },
      })));
    }
    if (device.precision_reduced) {
      const kind = deviceKind(device);
      notes.push(window.JournalI18n.renderHtml(kind ? `journal.window.map.device.precision.off.${kind}` : 'journal.window.map.device.precision.off',
        kind ? [] : [['device', String(device.word)]]));
    }
    if (device.interrupted_segments > 0) {
      notes.push(escapeHtml(deviceInterruption(device, device.interrupted_segments)));
    }
    return notes;
  }

  function renderDevice(device, day) {
    const counts = [];
    if (device.readings) counts.push(plural(device.readings, "reading"));
    if (device.visits) counts.push(plural(device.visits, "visit"));
    if (device.first && device.last && device.readings > 1) {
      counts.push(window.JournalI18n.render('journal.window.map.date.time.range', [['first', String(moment(device.first, day))], ['last', String(moment(device.last, day))]]));
    }
    const notes = deviceNotes(device).map((note) => `<p class="map-muted">${note}</p>`).join("");
    const heading = escapeHtml(deviceDescription('from', device, 'journal.window.map.device.from', String(device.phrase ?? '')));
    return `<section class="map-card" aria-label="${heading}">
      <div class="map-device-head"><strong>${heading}</strong>
      <span class="map-device-count">${escapeHtml(counts.join(" · "))}</span></div>${notes}</section>`;
  }

  function entryTitle(entry) {
    if (entry.kind === "unreadable") {
      return entry.whole_file
        ? window.JournalI18n.render('journal.window.map.window.explanation.a.segment.your.journal.couldn.t')
        : window.JournalI18n.render('journal.window.map.entry.lines.unreadable', [...quantityArgs(entry.lines)]);
    }
    if ((entry.kind === "visit" || entry.kind === "stay") && entry.place_ref?.owner_name) {
      return window.JournalI18n.render('journal.window.map.area.label.at.place', [['name', String(entry.place_ref.owner_name)]]);
    }
    const place = entry.kind === "visit" || entry.kind === "stay" ? entry.place : null;
    if (place?.at) return window.JournalI18n.render('journal.window.map.area.label.at.place', [['name', String(place.at.name)]]);
    if (asArray(place?.near).length) return window.JournalI18n.render('journal.window.map.area.label.near.place', [['name', String(nearNames(place))]]);
    return entry.area?.label || window.JournalI18n.render('journal.window.map.window.explanation.no.named.town.nearby');
  }

  // Under a visit named by the download: where it was, then what was near.
  function entryWhere(entry) {
    const place = entry.kind === "visit" || entry.kind === "stay" ? entry.place : null;
    const named = entry.place_ref?.owner_name;
    if (!place) return named && entry.area?.label ? [entry.area.label] : [];
    const lines = [];
    if (named && place.at) lines.push(window.JournalI18n.render('journal.window.map.area.label.at.place', [['name', String(place.at.name)]]));
    if (place.at?.inside) lines.push(window.JournalI18n.render('journal.window.map.area.label.inside', [['place', String(place.at.inside)]]));
    if (entry.area?.label) lines.push(entry.area.label);
    const where = [lines.join(" · ")];
    if ((place.at || named) && asArray(place.near).length) where.push(window.JournalI18n.render('journal.window.map.area.label.near.place', [['name', String(nearNames(place))]]));
    return where.filter(Boolean);
  }

  // The reasons behind a record's words, from the map and the phone's own
  // margin of error.
  function entryWhy(entry, data) {
    const reasons = [];
    const place = entry.kind === "visit" || entry.kind === "stay" ? entry.place : null;
    const margin = place?.margin_m;
    if (entry.place_ref?.owner_name) {
      reasons.push(window.JournalI18n.render('journal.window.map.place.named.reason', [['name', String(entry.place_ref.owner_name)]]));
    }
    if (entry.kind === "stay") {
      reasons.push(window.JournalI18n.render('journal.window.map.entry.stay.precise.reason', [...quantityArgs(entry.count)]));
    }
    // A stay's margin is the journal's circle around its readings, not one
    // the phone reported.
    const kind = entry.kind === 'stay' ? 'stay' : 'visit';
    if (place?.at) {
      reasons.push(window.JournalI18n.render(`journal.window.map.entry.${kind}.margin.inside.place`, [
        ['margin_meters', String(margin)], ['place', String(place.at.name)],
      ]));
    }
    asArray(place?.near).forEach((near) => {
      const args = [['place', String(near.name)], ['distance_meters', String(near.distance_m)], ['margin_meters', String(margin)]];
      if (near.category) args.push(['category', String(near.category)]);
      const category = near.category ? '.category' : '';
      reasons.push(window.JournalI18n.render(`journal.window.map.entry.${kind}.margin.near.place${category}`, args));
    });
    const within = withinName(entry.area?.within);
    if (within) {
      reasons.push(margin
        ? window.JournalI18n.render('journal.window.map.entry.margin.within', [['area', String(within)]])
        : entry.kind === "readings"
          ? window.JournalI18n.render('journal.window.map.entry.readings.within', [['area', String(within)]])
          : entry.kind === "stay"
            ? window.JournalI18n.render('journal.window.map.entry.stay.within', [['area', String(within)]])
            : window.JournalI18n.render('journal.window.map.entry.visit.within', [['area', String(within)]]));
    } else if (entry.area?.town && entry.kind !== "unreadable") {
      reasons.push(window.JournalI18n.render('journal.window.map.entry.area.town.reason', [['town', String(entry.area.town)], ['distance_km', String(entry.area.town_km)]]));
    }
    const accuracy = entry.kind === "visit" ? entry.point?.[2] : null;
    if (entry.kind === "visit" && !place && data.accuracy?.installed && Number.isFinite(accuracy) && accuracy > 100) {
      reasons.push(window.JournalI18n.render('journal.window.map.entry.visit.margin.too.wide', [['margin_meters', String(accuracy)]]));
    }
    return reasons;
  }

  function entryTime(entry, day) {
    if (entry.kind === "readings") {
      return entry.count === 1
        ? moment(entry.first, day)
        : `${moment(entry.first, day)}–\u200b${moment(entry.last, day)}`;
    }
    if (entry.kind === "visit") {
      return `${entry.arrival ? moment(entry.arrival, day) : "…"}–\u200b${entry.departure ? moment(entry.departure, day) : "…"}`;
    }
    if (entry.kind === "stay") {
      return `${moment(entry.first, day)}–\u200b${moment(entry.last, day)}`;
    }
    return entry.at ? moment(entry.at, day) : "";
  }

  function entryMeta(entry, data) {
    const device = asArray(data.devices)[entry.device] || {};
    const many = asArray(data.devices).length > 1;
    const parts = [];
    if (entry.kind === "readings") {
      parts.push(plural(entry.count, "reading"));
      if (entry.precision === "approximate" || entry.precision === "reduced") parts.push(window.JournalI18n.render('journal.window.map.entry.precision.approximate'));
      if (many) parts.push(deviceDescription('from', device, 'journal.window.map.device.from'));
    } else if (entry.kind === "stay") {
      parts.push(deviceDescription('stay', device, 'journal.window.map.entry.stay.recorded.device'));
      parts.push(plural(entry.count, "reading"));
    } else if (entry.kind === "visit") {
      parts.push(deviceDescription('visit', device, 'journal.window.map.entry.reported.visit'));
      parts.push(entry.arrival ? window.JournalI18n.render('journal.window.map.entry.time.arrival', [['time', String(moment(entry.arrival, data.day))]]) : window.JournalI18n.render('journal.window.map.entry.time.missing.arrival'));
      parts.push(entry.departure ? window.JournalI18n.render('journal.window.map.entry.time.departure', [['time', String(moment(entry.departure, data.day))]]) : window.JournalI18n.render('journal.window.map.entry.time.missing.departure'));
    } else {
      parts.push(deviceDescription('from', device, 'journal.window.map.device.from'));
      parts.push(window.JournalI18n.render('journal.window.map.window.explanation.open.it.in.transcripts.to.see'));
    }
    return parts.join(" · ");
  }

  function entryActions(entry, index) {
    const segments = asArray(entry.segments);
    const actions = [];
    const drawn = entry.kind === "readings"
      ? asArray(entry.map_points ?? entry.points).length > 0
      : entry.on_map !== false;
    if (entry.kind !== "unreadable" && drawn) {
      actions.push(`<button type="button" data-map-show="${index}">${window.JournalI18n.renderHtml('journal.window.map.button.label.show.on.the.map')}</button>`);
    }
    if (segments.length === 1) {
      actions.push(`<a class="map-link" href="${escapeHtml(segments[0].url)}">${window.JournalI18n.renderHtml('journal.window.map.link.label.open.in.transcripts')}</a>`);
    }
    let pieces = "";
    if (segments.length > 1) {
      const items = segments
        .map((segment) => `<li><a class="map-link" href="${escapeHtml(segment.url)}">${escapeHtml(pieceTime(segment.segment))}</a></li>`)
        .join("");
      pieces = `<details class="map-pieces"><summary>${window.JournalI18n.renderHtml('journal.window.map.entry.transcripts.segments', quantityArgs(segments.length))}</summary><ul>${items}</ul></details>`;
    }
    return `<div class="map-row-actions">${actions.join("")}</div>${pieces}`;
  }

  function markClass(entry) {
    if (entry.kind === "readings") {
      return entry.precision === "precise" ? "map-row-mark-readings" : "map-row-mark-approximate";
    }
    return `map-row-mark-${entry.kind === "stay" ? "visit" : entry.kind}`;
  }

  function renderEntry(entry, index, data) {
    const where = entryWhere(entry).map((line) => `<p class="map-row-where">${escapeHtml(line)}</p>`).join("");
    const reasons = entryWhy(entry, data);
    const why = reasons.length
      ? `<details class="map-why"><summary>${window.JournalI18n.renderHtml('journal.window.map.disclosure.label.why.these.words')}</summary><ul>${reasons.map((reason) => `<li>${escapeHtml(reason)}</li>`).join("")}</ul></details>`
      : "";
    return `<li class="map-row" data-map-entry="${index}">
      <span class="map-row-time">${escapeHtml(entryTime(entry, data.day))}</span>
      <span class="map-row-mark ${markClass(entry)}" aria-hidden="true"></span>
      <div><p class="map-row-title">${escapeHtml(entryTitle(entry))}</p>${where}${placeLink(entry.place_ref)}
      <p class="map-muted">${escapeHtml(entryMeta(entry, data))}</p>${why}${entryActions(entry, index)}</div></li>`;
  }

  function accuracyCard(status) {
    if (!status) return "";
    const offered = status.offered;
    const installed = status.installed;
    const job = status.job || {};
    if (!offered && !installed) return "";
    const outlines = asArray(offered?.files).includes("containment.slpk") || installed?.containment;
    const what = outlines
      ? window.JournalI18n.render('journal.window.map.accuracy.explanation.outlines')
      : window.JournalI18n.render('journal.window.map.accuracy.explanation.names');
    let body;
    let actions = "";
    if (job.state === "verifying") {
      body = `<p role="status">${window.JournalI18n.renderHtml('journal.window.map.visible.text.checking.location.accuracy.before.using.it')}</p>`;
    } else if (job.state === "downloading") {
      body = `<p>${window.JournalI18n.renderHtml('journal.window.map.accuracy.download.progress', [['received', String(bytes(job.received))], ['total', String(bytes(job.total))]])}</p>
        <progress max="${Number(job.total) || 1}" value="${Number(job.received) || 0}"></progress>`;
      if (installed && job.source === "automatic") actions = `<button type="button" data-accuracy="remove">${window.JournalI18n.renderHtml('journal.window.map.button.label.remove.location.accuracy')}</button>`;
    } else if (installed && status.current) {
      body = `<p>${window.JournalI18n.renderHtml('journal.window.map.visible.text.location.accuracy.is.on')} ${escapeHtml(what)}</p>`;
      actions = `<button type="button" data-accuracy="remove">${window.JournalI18n.renderHtml('journal.window.map.button.label.remove.location.accuracy')}</button>
        <span class="map-muted">${window.JournalI18n.renderHtml('journal.window.map.accuracy.remove.effect', [['storage', String(bytes(installed.size_bytes))]])}</span>`;
    } else if (installed && job.state === "failed" && !(installed.venues && installed.containment)) {
      body = `<p>${window.JournalI18n.renderHtml('journal.window.map.visible.text.location.accuracy.is.unavailable')}</p>`;
      actions = `${offered ? `<button type="button" data-accuracy="download">${window.JournalI18n.renderHtml('journal.window.map.button.label.download.again')}</button>` : ""}
        <button type="button" data-accuracy="remove">${window.JournalI18n.renderHtml('journal.window.map.button.label.remove.location.accuracy')}</button>`;
    } else if (installed && offered) {
      body = `<p>${window.JournalI18n.renderHtml('journal.window.map.accuracy.update.available', [['size', String(bytes(offered.size_bytes))]])}</p>`;
      actions = `<button type="button" data-accuracy="download">${window.JournalI18n.renderHtml('journal.window.map.button.label.update')}</button>
        <button type="button" data-accuracy="remove">${window.JournalI18n.renderHtml('journal.window.map.button.label.remove.location.accuracy')}</button>`;
    } else if (installed) {
      body = `<p>${window.JournalI18n.renderHtml('journal.window.map.visible.text.location.accuracy.is.on')}</p>`;
      actions = `<button type="button" data-accuracy="remove">${window.JournalI18n.renderHtml('journal.window.map.button.label.remove.location.accuracy')}</button>`;
    } else {
      body = `<p>${window.JournalI18n.renderHtml(outlines ? 'journal.window.map.accuracy.offered.outlines' : 'journal.window.map.accuracy.offered.names')} ${window.JournalI18n.renderHtml('journal.window.map.visible.text.without.it.a.visit.is.named')}</p>
        <p class="map-muted">${window.JournalI18n.renderHtml('journal.window.map.accuracy.download.explanation', [['size', String(bytes(offered.size_bytes))]])}</p>`;
      actions = `<button type="button" data-accuracy="download">${window.JournalI18n.renderHtml('journal.window.map.accuracy.download.button', [['size', String(bytes(offered.size_bytes))]])}</button>`;
    }
    const failures = {
      not_enough_space: window.JournalI18n.render('journal.window.map.accuracy.storage.insufficient', [['required_storage', String(bytes(offered?.size_bytes))]]),
      integrity_failed: window.JournalI18n.render('journal.window.map.window.explanation.location.accuracy.failed.its.file.check'),
      download_failed: window.JournalI18n.render('journal.window.map.window.explanation.location.accuracy.couldn.t.be.downloaded'),
      write_failed: window.JournalI18n.render('journal.window.map.window.explanation.location.accuracy.couldn.t.be.saved'),
      nothing_offered: window.JournalI18n.render('journal.window.map.window.explanation.this.version.of.your.journal.has'),
    };
    const failed = job.state === "failed"
      ? `<p class="map-muted" role="status">${escapeHtml(failures[job.reason_code] || failures.download_failed)}</p>`
      : "";
    const notices = asArray(status.notices);
    const credits = asArray(status.attributions).map((text) => `<p class="map-muted">${escapeHtml(text)}</p>`).join("")
      + (notices.length
        ? `<details class="map-why"><summary>${window.JournalI18n.renderHtml('journal.window.map.disclosure.label.licences')}</summary>${notices.map((text) => `<p class="map-muted" style="white-space: pre-line">${escapeHtml(text)}</p>`).join("")}</details>`

  function accuracyDrawn(status) {
    const installed = status?.installed;
    if (!installed) return "";
    if (installed.containment) {
      return `<p>${window.JournalI18n.renderHtml('journal.window.map.visible.text.with.location.accuracy.a.visit.can.variant2')}</p>`;
    }
    return `<p>${window.JournalI18n.renderHtml('journal.window.map.visible.text.with.location.accuracy.a.visit.can')}</p>`;
  }

  async function accuracyAction(action, data) {
    const mine = epoch;
    root.querySelectorAll("[data-accuracy]").forEach((button) => { button.disabled = true; });
    try {
      const status = await window.apiJson(`/app/map/api/accuracy/${action}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: "{}",
      });
      if (mine !== epoch || !alive()) return;
      showAccuracy(status, data);
    } catch (err) {
      if (mine !== epoch || !alive()) return;
      if (window.logError) window.logError(err, { context: "map:accuracy" });
      const status = await readJson("/app/map/api/accuracy").catch(() => null);
      if (!status || status === STALE || mine !== epoch || !alive()) return;
      showAccuracy(status, data);
    }
  }

  function showAccuracy(status, data) {
    if (!alive()) return;
    const card = root.querySelector("[data-accuracy-card]");
    if (!card) return;
    const before = data.accuracy;
    data.accuracy = status;
    card.outerHTML = accuracyCard(status) || "<div data-accuracy-card hidden></div>";
    root.querySelectorAll("[data-accuracy]").forEach((button) => {
      button.addEventListener("click", () => accuracyAction(button.getAttribute("data-accuracy"), data));
    });
    if (accuracyTimer != null) ctx.clearTimeout(accuracyTimer);
    accuracyTimer = null;
    if (["downloading", "verifying"].includes(status?.job?.state)) {
      const mine = epoch;
      accuracyTimer = ctx.setTimeout(async () => {
        accuracyTimer = null;
        if (mine !== epoch || !alive()) return;
        const next = await readJson("/app/map/api/accuracy").catch(() => null);
        if (!next || next === STALE || mine !== epoch || !alive()) return;
        showAccuracy(next, data);
      }, 2000);
    } else if (before && JSON.stringify(before.installed) !== JSON.stringify(status?.installed)) {
      // Names change with the download, so the day is read again.
      loadDay(data.day);
    }
  }

  function accuracyAttribution(installed) {
    const link = (href) => {
      const element = document.createElement('a');
      element.className = 'map-link';
      element.setAttribute('href', href);
      element.setAttribute('rel', 'noopener noreferrer');
      return element;
    };
    const elements = {
      geonames: link('https://www.geonames.org/'),
      licence: link('https://creativecommons.org/licenses/by/4.0/'),
    };
    const source = installed ? (installed.containment ? 'outlines' : 'places') : 'base';
    if (installed) elements.overture = link('https://docs.overturemaps.org/attribution/');
    return markupHtml(window.JournalI18n.renderEnglishMarkup(`journal.window.map.attribution.${source}`, [], { elements }));
  }

  function renderDay(data) {
    const entries = asArray(data.entries);
    const devices = asArray(data.devices);
    const list = entries.map((entry, index) => renderEntry(entry, index, data)).join("");
    const mapCard = data.map
      ? `<section class="map-card map-figure-card" aria-label="${window.JournalI18n.renderHtml('journal.window.map.accessible.name.map')}">
          <div class="map-canvas" id="map-canvas" role="region" aria-label="${window.JournalI18n.renderHtml('journal.window.map.accessible.name.map.of.the.records.listed.here')}"></div>
          <p class="map-muted">${window.JournalI18n.renderHtml('journal.window.map.visible.text.named.features.only.streets.not.shown')}</p>
          <p class="map-muted">${accuracyAttribution(data.accuracy?.installed)}</p>
        </section>`
      : "";
    const accuracy = accuracyCard(data.accuracy) || "<div data-accuracy-card hidden></div>";
    reveal(`<nav class="map-page-nav" aria-label="${window.JournalI18n.renderHtml('journal.window.map.accessible.name.more.of.your.location')}"><a class="map-link" href="/app/map/week/${escapeHtml(data.day)}">${window.JournalI18n.renderHtml('journal.window.map.link.label.this.week')}</a><a class="map-link" href="/app/map/month/${escapeHtml(String(data.day || '').slice(0, 6))}">${window.JournalI18n.renderHtml('journal.window.map.link.label.this.month')}</a><a class="map-link" href="/app/map/places">${window.JournalI18n.renderHtml('journal.window.map.link.label.places')}</a></nav>
      ${devices.map((device) => renderDevice(device, data.day)).join("")}
      <div class="map-columns">
        <section class="map-card" aria-label="${window.JournalI18n.renderHtml('journal.window.map.accessible.name.the.day.in.order')}">
          <div class="map-list-head"><h2>${window.JournalI18n.renderHtml('journal.window.map.section.heading.the.day.in.order')}</h2>
          <span class="map-muted">${escapeHtml(plural(entries.length, "record"))}</span></div>
          <ol class="map-list">${list}</ol>
        </section>
        ${mapCard}
      </div>
      ${accuracy}
      <section class="map-card"><details class="map-details"><summary>${window.JournalI18n.renderHtml('journal.window.map.disclosure.label.how.this.is.drawn')}</summary>
        <p>${window.JournalI18n.renderHtml('journal.window.map.visible.text.your.journal.draws.this.from.the')}</p>
        <p>${window.JournalI18n.renderHtml('journal.window.map.visible.text.there.s.no.street.map.a')}</p>
        <p>${window.JournalI18n.renderHtml('journal.window.map.visible.text.without.location.accuracy.each.reading.is')}</p>
        ${accuracyDrawn(data.accuracy)}
        <p>${window.JournalI18n.renderHtml('journal.window.map.visible.text.for.readings.the.times.are.the')}</p>
        <p>${window.JournalI18n.renderHtml('journal.window.map.visible.text.a.stay.is.worked.out.from')}</p>
        <p>${window.JournalI18n.renderHtml('journal.window.map.visible.text.on.the.map.a.run.of')}</p>
      </details></section>
      <section class="map-card"><h2>${window.JournalI18n.renderHtml('journal.window.map.section.heading.deleting.any.of.this')}</h2>
        <p class="map-muted">${window.JournalI18n.renderHtml('journal.window.map.visible.text.every.record.above.opens.in.transcripts')}</p>
      </section>`);
    root.querySelectorAll("[data-map-show]").forEach((button) => {
      button.addEventListener("click", () => focusEntry(Number(button.getAttribute("data-map-show")), true));
    });
    root.querySelectorAll("[data-accuracy]").forEach((button) => {
      button.addEventListener("click", () => accuracyAction(button.getAttribute("data-accuracy"), data));
    });
    if (["downloading", "verifying"].includes(data.accuracy?.job?.state)) showAccuracy(data.accuracy, data);
    drawMap(data);
  }

  function cssColor(name, fallback) {
    const value = window.getComputedStyle?.(document.documentElement)?.getPropertyValue(name);
    return (value && value.trim()) || fallback;
  }

  function tooltipNode(text) {
    const span = document.createElement("span");
    span.textContent = text;
    return span;
  }

  // A precise run can hold hundreds of readings that read like a route when
  // all drawn, so the map draws the run as one dot at its middle reading.
  // The list keeps every reading.
  function thinned(points) {
    return points.length ? [points[Math.floor(points.length / 2)]] : [];
  }

  function drawMap(data) {
    const L = window.L;
    const element = document.getElementById("map-canvas");
    removeMap();
    if (!L || !element || !data.map) return;
    const ink = cssColor("--ink-soft", "#5B5246");
    const orange = cssColor("--orange", "#e8913a");
    const map = L.map(element, { attributionControl: false, zoomControl: false, zoomSnap: 0.5, worldCopyJump: false });
    L.control.zoom({
      zoomInTitle: window.JournalI18n.render('journal.window.map.leaflet.zoom.in'),
      zoomOutTitle: window.JournalI18n.render('journal.window.map.leaflet.zoom.out'),
    }).addTo(map);
    const [west, south, east, north] = data.map.bounds;
    map.fitBounds([[south, west], [north, east]], { padding: [28, 28], maxZoom: 14 });
    L.control.scale({ imperial: false }).addTo(map);
    const line = (lines, style) => asArray(lines).forEach((points) => L.polyline(points, style).addTo(map));
    asArray(data.map.countries).forEach((country) => line(country.lines, { color: ink, weight: 1.6, opacity: 0.8, interactive: false }));
    asArray(data.map.regions).forEach((region) => line(region.lines, { color: ink, weight: 1, opacity: 0.6, dashArray: "4 4", interactive: false }));
    // Only towns that carry a name are drawn: an unnamed dot says nothing.
    asArray(data.map.towns).slice(0, 15).forEach((town) => {
      const dot = L.circleMarker([town.lat, town.lon], { radius: 2.5, color: ink, weight: 1, fillColor: ink, fillOpacity: 0.9, interactive: false }).addTo(map);
      dot.bindTooltip(tooltipNode(town.name), { permanent: true, direction: "right", className: "map-town-label", offset: [4, 0] });
    });
    const layers = [];
    asArray(data.entries).forEach((entry, index) => {
      const group = L.featureGroup();
      // Nothing near a place the owner hid is drawn; the list still shows it.
      const stop = entry.kind === "visit" || entry.kind === "stay";
      if (stop && entry.on_map === false) {
        layers[index] = null;
        return;
      }
      const drawable = asArray(entry.map_points ?? entry.points);
      const points = entry.kind === "readings"
        ? (entry.precision === "precise" ? thinned(drawable) : drawable)
        : stop ? [entry.point] : [];
      const outline = stop ? asArray(entry.place?.at?.outline) : [];
      if (outline.length) {
        L.polygon(outline, { color: orange, weight: 1.5, dashArray: "3 3", fillColor: orange, fillOpacity: 0.06, interactive: false }).addTo(group);
      }
      points.forEach((point) => {
        const [lat, lon, accuracy] = point;
        if (Number.isFinite(accuracy) && accuracy > 25) {
          L.circle([lat, lon], { radius: accuracy, stroke: false, fillColor: orange, fillOpacity: accuracy > 500 ? 0.025 : 0.07, interactive: false }).addTo(group);
        }
        const marker = stop
          ? L.circleMarker([lat, lon], { radius: 8, color: orange, weight: 2.5, fill: false })
          : L.circleMarker([lat, lon], { radius: 3.5, color: orange, weight: 1, fillColor: orange, fillOpacity: entry.precision === "precise" ? 0.9 : 0.35 });
        marker.on("click", () => focusEntry(index, false));
        marker.addTo(group);
      });
      if (points.length) group.addTo(map);
      layers[index] = points.length ? group : null;
    });
    mapState = { map, layers };
  }

  function focusEntry(index, onMap) {
    root.querySelectorAll("[data-map-entry]").forEach((row) => {
      if (Number(row.getAttribute("data-map-entry")) === index) row.setAttribute("data-active", "");
      else row.removeAttribute("data-active");
    });
    const row = root.querySelector(`[data-map-entry="${index}"]`);
    if (!onMap) {
      row?.scrollIntoView?.({ block: "nearest", behavior: "smooth" });
      return;
    }
    const layer = mapState?.layers?.[index];
    if (layer && mapState.map) {
      mapState.map.fitBounds(layer.getBounds(), { padding: [40, 40], maxZoom: 15 });
      document.getElementById("map-canvas")?.scrollIntoView?.({ block: "nearest", behavior: "smooth" });
    }
  }

  // Whether focus sits on something the next draw replaces: the day's
  // heading, a marker or a control in the view, or the gate's retry.
  function focusInView() {
    for (let node = document.activeElement; node; node = node.parentNode) {
      if (node === root || node === gate) return true;
    }
    return false;
  }

  async function loadDay(day, arrive) {
    if (!alive() || !DAY_RE.test(String(day || ""))) return;
    // The link that opened this day, or what had focus in the day a step
    // leaves, is about to leave the page. Focus moves before that, or it
    // falls to the document. A step that started outside the view, from
    // date-nav's arrow, leaves focus where it is.
    const refocus = arrive || focusInView();
    const mine = beginPage();
    showDayChrome();
    if (refocus) focusNode(document.getElementById("main-content"));
    setGate(window.SurfaceState.loading({ text: window.JournalI18n.render('journal.window.map.text.loading.this.day.s.location') }));
    try {
      const data = await readJson(`/app/map/api/day/${day}`);
      if (data === STALE || mine !== epoch || !alive()) return;
      if (!asArray(data.entries).length && !asArray(data.devices).length) {
        if (data.journal_has_location) renderDayEmpty(data, day);
        else renderJournalEmpty();
        if (refocus) focusArrived();
        reportMapReady("empty");
        return;
      }
      renderDay(data);
      if (refocus) focusArrived();
      reportMapReady("content");
    } catch (err) {
      if (mine !== epoch || !alive()) return;
      showError(err, () => loadDay(day, arrive));
      if (refocus) focusArrived();
      reportMapReady("error");
    }
  }

  function pageShell(title, body, nav) {
    shell?.removeAttribute("data-map-empty");
    shell.setAttribute("data-map-page", "");
    const navMarkup = nav || `<nav class="map-page-nav" aria-label="${window.JournalI18n.renderHtml('journal.window.map.accessible.name.more.of.your.location')}"><a class="map-link" href="/app/map/">${window.JournalI18n.renderHtml('journal.window.map.link.label.the.day')}</a><a class="map-link" href="/app/map/places">${window.JournalI18n.renderHtml('journal.window.map.link.label.places')}</a></nav>`;
    const titleMarkup = title ? `<h1 class="map-page-title">${escapeHtml(title)}</h1>` : "";
    reveal(`${navMarkup}
      ${titleMarkup}${body}`);
  }

  function recorded(place) {
    const args = quantityArgs(place.dates);
    let message = 'journal.window.map.place.recorded.dates';
    if (place.first && place.last && place.first !== place.last) {
      message = 'journal.window.map.place.recorded.dates.range';
      args.push(['first', String(shortDay(place.first))], ['last', String(shortDay(place.last))]);
    } else if (place.first) {
      message = 'journal.window.map.place.recorded.dates.single';
      args.push(['date', String(shortDay(place.first))]);
    }
    const lines = [window.JournalI18n.render(message, args)];
    if (place.night_dates) {
      lines.push(window.JournalI18n.render('journal.window.map.place.recorded.nights', [...quantityArgs(place.night_dates)]));
    }
    return lines;
  }

  function renderPlaces(data) {
    const places = asArray(data.places);
    const items = places.map((place) => `<li>
        <p class="map-row-title"><a class="map-link" href="/app/map/place/${encodeURIComponent(place.id)}">${escapeHtml(place.label)}</a></p>
        ${place.owner_name && place.area?.label ? `<p class="map-row-where">${escapeHtml(place.area.label)}</p>` : ""}
        ${recorded(place).map((line) => `<p class="map-muted">${escapeHtml(line)}</p>`).join("")}
        ${place.hidden ? `<p class="map-muted">${window.JournalI18n.renderHtml('journal.window.map.visible.text.hidden')}</p>` : ""}</li>`).join("");
    const body = places.length
      ? `<section class="map-card"><ol class="map-places">${items}</ol></section>`
      : `<section class="map-card"><p>${window.JournalI18n.renderHtml('journal.window.map.visible.text.no.places.yet')}</p><p class="map-muted">${window.JournalI18n.renderHtml('journal.window.map.visible.text.a.place.is.a.spot.your')}</p></section>`;
    pageShell(window.JournalI18n.render('journal.window.map.link.label.places'), `${body}
      <section class="map-card"><details class="map-details"><summary>${window.JournalI18n.renderHtml('journal.window.map.disclosure.label.how.places.are.worked.out')}</summary>
        <p>${window.JournalI18n.renderHtml('journal.window.map.visible.text.a.place.starts.from.visits.or')}</p>
        <p>${window.JournalI18n.renderHtml('journal.window.map.visible.text.you.can.name.a.place.call')}</p>
        <p>${window.JournalI18n.renderHtml('journal.window.map.visible.text.a.place.lasts.as.long.as')}</p>
      </details></section>`);
  }

  function renderPlace(place) {
    const stays = asArray(place.stays).slice().reverse();
    const visits = stays.map((stay) => {
      const clock = (value) => value || "…";
      const how = stay.kind === "worked" ? window.JournalI18n.render('journal.window.map.window.explanation.a.stay.your.journal.worked.out') : window.JournalI18n.render('journal.window.map.window.explanation.a.visit.your.phone.reported');
      const date = dayDate(stay.day);
      const label = date ? window.JournalI18n.render('journal.window.map.date.short.weekday', [['weekday', String(SHORT_WEEKDAYS[date.getDay()])], ['date', String(shortDay(stay.day))]]) : stay.day;
      return `<li><span class="map-muted"><a class="map-link" href="/app/map/${escapeHtml(stay.day)}">${escapeHtml(label)}</a></span>

  const H3_RES = 8;
  const SIZE = { label: window.JournalI18n.render('journal.window.map.label.about.km') };
  // Resolution 8 cells are about 1 km across. The ring is the cell's own
  // boundary, projected with the stops, so a pentagon keeps five corners.
  // When a resolution 8 ring would draw under MIN_RING_PX, the month draws
  // the areas' fixed parent cells instead, at the finest resolution that
  // reaches it. DRAWN_SIZE is each resolution's average width, corner to corner.
  const MIN_RING_PX = 8;
  const DRAWN_SIZE = [...["2,600", "1,000", "370", "140", "50", "20", "7", "3"].map((size) =>
    window.JournalI18n.render('journal.window.map.area.size', [['size', String(size)]])), SIZE.label];
  const COMPASS = ['east', 'north-east', 'north', 'north-west', 'west', 'south-west', 'south', 'south-east'];

  function locationGrid() {
    const grid = window.h3;
    if (!grid || typeof grid.latLngToCell !== "function") {
      throw new Error("location grid is not available");
    }
    return grid;
  }

  function cellOf(lat, lon) {
    return locationGrid().latLngToCell(lat, lon, H3_RES);
  }

  function cellCenter(cell, project) {
    const [lat, lon] = locationGrid().cellToLatLng(cell);
    return project(lat, lon);
  }

  function cellRing(cell, project) {
    return locationGrid().cellToBoundary(cell).map(([lat, lon]) => project(lat, lon));
  }

  function ringSpan(ring) {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const [x, y] of ring) {
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
    }
    return Math.max(maxX - minX, maxY - minY);
  }

  function coreOf(list) {
    if (!list.length) return [];
    const a = list[0], total = list.reduce((s, c) => s + c.dayCount, 0);
    const byDist = [...list].sort((p, q) => Math.hypot(p.cx - a.cx, p.cy - a.cy) - Math.hypot(q.cx - a.cx, q.cy - a.cy));
    const out = []; let sum = 0;
    for (const c of byDist) {
      out.push(c);
      sum += c.dayCount;
      if (sum >= total * 0.5) break;
    }
    return out;
  }

  function unionMinutes(intervals, totalMin) {
    const xs = intervals
      .map(([a, b]) => [Math.max(a, 0), Math.min(b, totalMin)])
      .filter(([a, b]) => b > a)
      .sort((p, q) => p[0] - q[0]);
    let total = 0, cur = null;
    for (const [a, b] of xs) {
      if (!cur || a > cur[1]) {
        if (cur) total += cur[1] - cur[0];
        cur = [a, b];
      } else {
        cur[1] = Math.max(cur[1], b);
      }
    }
    if (cur) total += cur[1] - cur[0];
    return total;
  }

  function unionWithin(intervals, lo, hi) {
    const xs = intervals
      .map(([a, b]) => [Math.max(a, lo), Math.min(b, hi)])
      .filter(([a, b]) => b > a)
      .sort((p, q) => p[0] - q[0]);
    let total = 0, cur = null;
    for (const [a, b] of xs) {
      if (!cur || a > cur[1]) {
        if (cur) total += cur[1] - cur[0];
        cur = [a, b];
      } else {
        cur[1] = Math.max(cur[1], b);
      }
    }
    return cur ? total + cur[1] - cur[0] : total;
  }

  function hoursText(min) {
    return min < 90 ? `${Math.round(min)} min` : `${Math.round(min / 60)} h`;
  }

  function ptDist(p1, p2) {
    if (!p1 || !p2) return Infinity;
    const avgLat = (p1[0] + p2[0]) / 2 * Math.PI / 180;
    const dy = (p2[0] - p1[0]) * 111195;
    const dx = (p2[1] - p1[1]) * 111195 * Math.cos(avgLat);
    return Math.hypot(dx, dy);
  }

  function cutComma(text) {
    if (!text) return "";
    const idx = text.lastIndexOf(", ");
    return idx !== -1 ? text.slice(0, idx) : text;
  }

  function fromBusiest(c, list, isTrip) {
    const a = list[0];
    const tie = list.length > 1 && list[1].dayCount === a.dayCount;
    if (c === a) return tie ? window.JournalI18n.render('journal.window.map.window.explanation.tied.for.the.most.days') : isTrip ? window.JournalI18n.render('journal.window.map.window.explanation.this.trip.s.busiest.area') : window.JournalI18n.render('journal.window.map.window.explanation.the.area.with.the.most.days');
    const reference = tie ? 'first' : isTrip ? 'trip' : 'month';
    const dx = c.cx - a.cx, dy = c.cy - a.cy, km = Math.hypot(dx, dy) / 1000;
    const direction = COMPASS[(Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) + 8) % 8];
    const distance = km < 10 ? km.toFixed(1).replace(/\.0$/, '') : Math.round(km);
    return window.JournalI18n.render(`journal.window.map.month.area.distance.${reference}`, [
      ['distance', String(distance)], ['direction', direction],
    ]);
  }

  function spanText(s, d) {
    const a = s.start == null ? "…" : moment(s.item.arrival || s.item.first, d);
    const b = s.end == null ? "…" : moment(s.item.departure || s.item.last, d);

  }

  function dayInArea(es, d) {
    const dNum = parseInt(d.slice(6, 8), 10);
    const lo = (dNum - 1) * 1440, hi = dNum * 1440;
    const known = es
      .filter((s) => s.start != null && s.end != null)
      .map((s) => [Math.max(s.start, lo), Math.min(s.end, hi)])
      .filter(([a, b]) => b > a)
      .sort((p, q) => p[0] - q[0]);
    const mergedIntervals = [];
    for (const [a, b] of known) {
      const prev = mergedIntervals[mergedIntervals.length - 1];
      if (prev && a <= prev[1]) prev[1] = Math.max(prev[1], b);
      else mergedIntervals.push([a, b]);
    }
    const clockStr = (m) => {
      const min = ((m % 1440) + 1440) % 1440;
      return `${Math.floor(min / 60)}:${String(min % 60).padStart(2, "0")}`;
    };
    const parts = mergedIntervals.map(([a, b]) => {
      if (a === lo && b === hi) return window.JournalI18n.render('journal.window.map.month.time.all.day');
      if (a === lo) return window.JournalI18n.render('journal.window.map.month.time.until', [['time', String(clockStr(b))]]);
      if (b === hi) return window.JournalI18n.render('journal.window.map.month.time.from', [['time', String(clockStr(a))]]);
      return `${clockStr(a)}–${clockStr(b)}`;
    });
    for (const s of es) {
      if (s.end == null && s.start != null) parts.push(window.JournalI18n.render('journal.window.map.entry.open.departure', [['arrival', String(clockStr(s.start))]]));
      else if (s.start == null && s.end != null) parts.push(window.JournalI18n.render('journal.window.map.entry.open.arrival', [['departure', String(clockStr(s.end))]]));
    }
    return parts.join(" · ");
  }

  function stripMonthDay(d, es) {
    const dNum = parseInt(d.slice(6, 8), 10);
    const lo = (dNum - 1) * 1440, hi = dNum * 1440;
    const bars = es.map((s) => {
      const a = s.start == null ? null : Math.max(s.start, lo);
      const b = s.end == null ? null : Math.min(s.end, hi);
      const start = a ?? Math.max(lo, b - 45);
      const end = b ?? Math.min(hi, a + 45);
      const open = a == null ? " open from-end" : b == null ? " open" : "";
      return `<span class="${escapeHtml(s.kind)}${open}" style="left:${((start - lo) / 14.4).toFixed(2)}%;width:${((end - start) / 14.4).toFixed(2)}%"></span>`;
    }).join("");
    return `<div class="map-month-strip" role="img" aria-label="${window.JournalI18n.renderHtml('journal.window.map.accessible.name.the.stops.across.the.day.shown')}">${bars}</div>
      <div class="map-month-strip-scale" aria-hidden="true"><span>0:00</span><span>6:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
      <p class="map-month-strip-key">${es.some((s) => s.kind === "stay") ? window.JournalI18n.renderHtml('journal.window.map.month.strip.visits.and.stays') : window.JournalI18n.renderHtml('journal.window.map.window.explanation.each.bar.is.a.visit.your')}${es.some((s) => s.openEnded) ? ` ${window.JournalI18n.renderHtml('journal.window.map.month.strip.faded.bar')}` : ""}</p>`;
  }

  function monthModel(data, today) {
    const month = String(data.month || "");
    const year = parseInt(month.slice(0, 4), 10);
    const monthNum = parseInt(month.slice(4, 6), 10);
    const monthName = MONTHS[monthNum - 1] || "";
    const prevDate = new Date(year, monthNum - 1, 0);
    const previousMonthName = MONTHS[prevDate.getMonth()] || "";
    const previousMonthLastDay = `${prevDate.getFullYear()}${String(prevDate.getMonth() + 1).padStart(2, "0")}${String(prevDate.getDate()).padStart(2, "0")}`;
    const totalDaysInMonth = new Date(year, monthNum, 0).getDate();
    const effToday = String(today || data.today || "");

    const rawItems = [];
    function pushDayItems(items, devices, dayStr) {
      const devArr = asArray(devices);
      for (const it of asArray(items)) {
        const dev = devArr[it.device];
        const deviceKey = dev?.key ?? (typeof it.device === "string" ? it.device : String(it.device ?? ""));
        rawItems.push({ item: it, deviceKey, dayStr });
      }
    }

    if (data.before) pushDayItems(data.before.items, data.before.devices, "before");
    for (const d of asArray(data.days)) {
      pushDayItems(d.items, d.devices, d.day);
    }
    if (data.after) pushDayItems(data.after.items, data.after.devices, "after");

    // 1. Drop exact duplicates
    const deduped = [];
    for (const raw of rawItems) {
      const it = raw.item;
      const isDup = deduped.some((ex) => {
        const exIt = ex.item;
        if (ex.deviceKey !== raw.deviceKey) return false;
        if (exIt.kind !== it.kind) return false;
        const arrEx = (exIt.arrival ?? exIt.first)?.utc ?? null;
        const arrIt = (it.arrival ?? it.first)?.utc ?? null;
        const depEx = (exIt.departure ?? exIt.last)?.utc ?? null;
        const depIt = (it.departure ?? it.last)?.utc ?? null;
        return arrEx === arrIt && depEx === depIt;
      });
      if (!isDup) deduped.push(raw);
    }

    // 2. Drop arrival-only visit when complete report is later, within 3 min UTC, points <= 300m
    const merged = [];
    for (let i = 0; i < deduped.length; i++) {
      const a = deduped[i];
      const itA = a.item;
      const isArrivalOnly = itA.kind === "visit" && itA.arrival && !itA.departure;
      if (isArrivalOnly && itA.arrival.utc && itA.point) {
        const tA = Date.parse(itA.arrival.utc);
        const hasComplete = deduped.some((b, j) => {
          if (i === j) return false;
          const itB = b.item;
          if (b.deviceKey !== a.deviceKey) return false;
          if (itB.kind !== "visit" || !itB.arrival || !itB.departure || !itB.arrival.utc || !itB.point) return false;
          const tB = Date.parse(itB.arrival.utc);
          if (tB < tA) return false;
          if (tB - tA > 3 * 60 * 1000) return false;
          return ptDist(itA.point, itB.point) <= 300;
        });
        if (hasComplete) continue;
      }
      merged.push(a);
    }

    // 3. Local minutes from month start
    function localMinute(timeObj) {
      if (!timeObj || !timeObj.day || !timeObj.clock) return null;
      const y = parseInt(timeObj.day.slice(0, 4), 10);
      const mo = parseInt(timeObj.day.slice(4, 6), 10);
      const da = parseInt(timeObj.day.slice(6, 8), 10);
      const dt = new Date(y, mo - 1, da);
      const m1 = new Date(year, monthNum - 1, 1);
      const dayOffset = Math.round((dt - m1) / (86400 * 1000));
      const [h, mi] = timeObj.clock.split(":").map(Number);
      return dayOffset * 1440 + h * 60 + mi;
    }

    const monthMinutes = totalDaysInMonth * 1440;
    const kept = [];

    for (const raw of merged) {
      const it = raw.item;
      const startObj = it.kind === "stay" ? it.first : it.arrival;
      const endObj = it.kind === "stay" ? it.last : it.departure;
      const sMin = localMinute(startObj);
      const eMin = localMinute(endObj);
      const openEnded = sMin == null || eMin == null;
      const clipped = sMin != null && eMin != null && (sMin < 0 || eMin > monthMinutes);

      const touched = [];
      if (sMin != null && eMin != null) {
        const a = Math.max(sMin, 0);
        const b = Math.min(eMin, monthMinutes) - 1;
        if (b >= a) {
          const d1 = Math.floor(a / 1440) + 1;
          const d2 = Math.floor(b / 1440) + 1;
          for (let d = d1; d <= d2; d++) {
            if (d >= 1 && d <= totalDaysInMonth) {
              touched.push(`${month}${String(d).padStart(2, "0")}`);
            }
          }
        }
      } else if (sMin != null) {
        const d = Math.floor(sMin / 1440) + 1;
        if (d >= 1 && d <= totalDaysInMonth) {
          touched.push(`${month}${String(d).padStart(2, "0")}`);
        }
      } else if (eMin != null) {
        const d = Math.floor((eMin - 1) / 1440) + 1;
        if (d >= 1 && d <= totalDaysInMonth) {
          touched.push(`${month}${String(d).padStart(2, "0")}`);
        }
      }

      if (touched.length === 0) continue;

      kept.push({
        raw,
        item: it,
        deviceKey: raw.deviceKey,
        startMin: sMin,
        endMin: eMin,
        openEnded,
        clipped,
        days: touched,
      });
    }

    // Origin
    const withPoints = kept.filter((s) => s.item.point && s.item.point[0] != null && s.item.point[1] != null);
    let originLat = 0, originLon = 0;
    if (withPoints.length > 0) {
      const lats = withPoints.map((s) => s.item.point[0]).sort((a, b) => a - b);
      const lons = withPoints.map((s) => s.item.point[1]).sort((a, b) => a - b);
      const mid = Math.floor(lats.length / 2);
      originLat = lats.length % 2 !== 0 ? lats[mid] : (lats[mid - 1] + lats[mid]) / 2;
      originLon = lons.length % 2 !== 0 ? lons[mid] : (lons[mid - 1] + lons[mid]) / 2;
    }
    const cosLat = Math.cos(originLat * Math.PI / 180);
    const project = (lat, lon) => [(lon - originLon) * 111195 * cosLat, (lat - originLat) * 111195];

    function getPlace(places, id) {
      if (!places || !id) return null;
      if (places[id]) return places[id];
      if (Array.isArray(places)) return places.find((p) => p.id === id);
      return null;
    }

    const stops = kept.map((s) => {
      const it = s.item;
      const onMap = it.on_map !== false;
      const margin = it.point?.[2] ?? null;
      const drawable = onMap && margin != null && margin <= 500;
      const placeId = it.place_ref?.id || null;
      const place = getPlace(data.places, placeId);
      const atPlace = drawable && place && margin <= 50;
      const drawLat = atPlace ? place.lat : (it.point ? it.point[0] : originLat);
      const drawLon = atPlace ? place.lon : (it.point ? it.point[1] : originLon);
      const [drawnX, drawnY] = project(drawLat, drawLon);
      const [x, y] = it.point ? project(it.point[0], it.point[1]) : [null, null];

      const ownerNamed = !!it.place_ref?.owner_name;
      const label = it.area?.label || null;
      // The area's catalogue patterns keep the comma separator. Remove the
      // formatter's isolates before comparing or trimming that qualifier.
      const areaWords = window.JournalI18n.formatLocale ? label?.replace(/[\u2066-\u2069]/g, "") : label;
      let words = window.JournalI18n.render('journal.window.map.window.explanation.a.place.in.your.journal');
      if (ownerNamed) words = it.place_ref.owner_name;
      else if (areaWords) words = areaWords;
      else if (it.area?.town) words = it.area.town;

      return {
        device: s.deviceKey,
        kind: it.kind,
        days: s.days,
        openEnded: s.openEnded,
        clipped: s.clipped,
        margin,
        onMap,
        placeId,
        words,
        town: it.area?.town || null,
        label: areaWords,
        ownerNamed,
        drawable,
        x,
        y,
        start: s.startMin,
        end: s.endMin,
        // internal helpers
        drawnX,
        drawnY,
        cellId: drawable ? cellOf(drawLat, drawLon) : null,
        item: it,
      };
    });

    function countNotDrawn(stopList) {
      const hidden = stopList.filter((s) => !s.onMap);
      const idStops = hidden.filter((s) => s.placeId);
      const idSet = new Set(idStops.map((s) => s.placeId));
      const noIdStops = hidden.filter((s) => !s.placeId);

      const clusters = [];
      const visited = new Set();
      for (let i = 0; i < noIdStops.length; i++) {
        if (visited.has(i)) continue;
        visited.add(i);
        const cluster = [noIdStops[i]];
        const q = [noIdStops[i]];
        while (q.length > 0) {
          const cur = q.shift();
          for (let j = 0; j < noIdStops.length; j++) {
            if (!visited.has(j)) {
              if (ptDist(cur.item.point, noIdStops[j].item.point) <= 100) {
                visited.add(j);
                cluster.push(noIdStops[j]);
                q.push(noIdStops[j]);
              }
            }
          }
        }
        clusters.push(cluster);
      }

      const hiddenPlacesFound = [];
      for (const id of idSet) {
        const p = getPlace(data.places, id);
        if (p && p.lat != null && p.lon != null) {
          hiddenPlacesFound.push(p);
        }
      }

      let unfoldedClusters = 0;
      for (const cluster of clusters) {
        const folds = cluster.some((s) => {
          if (!s.item.point) return false;
          return hiddenPlacesFound.some((p) => ptDist(s.item.point, [p.lat, p.lon]) <= 50);
        });
        if (!folds) unfoldedClusters++;
      }

      const hiddenPlaces = idSet.size + unfoldedClusters;
      const wideStops = [];
      for (let i = 0; i < stops.length; i++) {
        const s = stops[i];
        if (stopList.includes(s) && s.onMap && (s.margin == null || s.margin > 500)) {
          wideStops.push(i);
        }
      }
      return { hiddenPlaces, wide: wideStops.length, wideStops };
    }

    const drawableStops = stops.filter((s) => s.drawable);
    let anchorId = null;
    const choices = [];

    if (drawableStops.length > 0) {
      const cellDaysMap = new Map();
      const cellFirstIndex = new Map();
      for (let i = 0; i < drawableStops.length; i++) {
        const s = drawableStops[i];
        const cid = s.cellId;
        if (!cid) throw new Error("location grid is not available");
        if (!cellDaysMap.has(cid)) {
          cellDaysMap.set(cid, new Set());
          cellFirstIndex.set(cid, i);
        }
        for (const d of s.days) cellDaysMap.get(cid).add(d);
      }
      const sortedHexes = [...cellDaysMap.entries()].sort((a, b) => {
        return b[1].size - a[1].size || cellFirstIndex.get(a[0]) - cellFirstIndex.get(b[0]);
      });
      anchorId = sortedHexes[0][0];
      const [hx, hy] = cellCenter(anchorId, project);

      const far = (s) => Math.hypot(s.drawnX - hx, s.drawnY - hy) > 50000;
      const farDays = new Set();
      for (const s of drawableStops) {
        if (far(s)) {
          for (const d of s.days) farDays.add(d);
        }
      }

      const runs = [];
      let curRun = null;
      for (let d = 1; d <= totalDaysInMonth; d++) {
        const dStr = `${month}${String(d).padStart(2, "0")}`;
        if (farDays.has(dStr)) {
          if (curRun && curRun.lastD === d - 1) {
            curRun.days.push(dStr);
            curRun.lastD = d;
          } else {
            curRun = { days: [dStr], lastD: d };
            runs.push(curRun);
          }
        }
      }

      function buildAreasForStops(drawStops) {
        const cellMap = new Map();
        const cellFirst = new Map();
        for (let i = 0; i < drawStops.length; i++) {
          const s = drawStops[i];
          const cid = s.cellId;
          if (!cid) throw new Error("location grid is not available");
          if (!cellMap.has(cid)) {
            const [cx, cy] = cellCenter(cid, project);
            cellMap.set(cid, { id: cid, cx, cy, ring: cellRing(cid, project), entries: [] });
            cellFirst.set(cid, i);
          }
          cellMap.get(cid).entries.push(s);
        }

        const areasList = [];
        for (const c of cellMap.values()) {
          const daysSet = new Set(c.entries.flatMap((s) => s.days));
          const knownEntries = c.entries.filter((s) => s.start != null && s.end != null);
          const knownMinutes = unionMinutes(knownEntries.map((s) => [s.start, s.end]), monthMinutes);
          const openEnded = c.entries.filter((s) => s.openEnded).length;

          const nightDays = new Set();
          for (let d = 1; d <= totalDaysInMonth; d++) {
            const lo = (d - 1) * 1440 + 22 * 60;
            const hi = Math.min((d - 1) * 1440 + 30 * 60, monthMinutes);
            const hasNight = knownEntries.some((s) => {
              const start = Math.max(s.start, lo);
              const end = Math.min(s.end, hi);
              return end - start >= 120;
            });
            if (hasNight) {
              nightDays.add(`${month}${String(d).padStart(2, "0")}`);
            }
          }

          const perWords = {};
          const wordFirstStop = {};
          for (const s of c.entries) {
            (perWords[s.words] ||= new Set());
            for (const d of s.days) perWords[s.words].add(d);
            if (!wordFirstStop[s.words]) wordFirstStop[s.words] = s;
          }
          const names = Object.entries(perWords)
            .map(([w, dSet]) => ({ words: w, days: dSet.size }))
            .sort((a, b) => b.days - a.days || a.words.localeCompare(b.words));

          const topName = names[0];
          const topStop = wordFirstStop[topName.words] || c.entries[0];
          const words = topName.words;
          const ownerNamed = topStop.ownerNamed;
          const label = topStop.label;

          const overlap = knownEntries.reduce((sum, s) => sum + Math.min(s.end, monthMinutes) - Math.max(s.start, 0), 0) > knownMinutes + 1;
          const clipped = c.entries.some((s) => s.clipped);

          areasList.push({
            id: c.id,
            cx: c.cx,
            cy: c.cy,
            ring: c.ring,
            entries: c.entries,
            days: [...daysSet].sort(),
            dayCount: daysSet.size,
            nights: nightDays.size,
            nightDays: [...nightDays].sort(),
            knownMinutes,
            stopCount: c.entries.length,
            openEnded,
            words,
            label,
            listLabel: words,
            ownerNamed,
            names,
            overlap,
            clipped,
            firstIndex: cellFirst.get(c.id),
          });
        }

        areasList.sort((a, b) => b.dayCount - a.dayCount || b.nights - a.nights || b.knownMinutes - a.knownMinutes || a.firstIndex - b.firstIndex);
        return areasList;
      }

      // Home choice
      const homeNearStops = stops.filter((s) => !s.drawable || !far(s));
      const homeDrawStops = drawableStops.filter((s) => !far(s));
      const homeAreas = buildAreasForStops(homeDrawStops);
      const homeDays = [...new Set(homeNearStops.flatMap((s) => s.days))].sort();

      const homeCommaLabels = homeAreas.map((a) => a.label).filter((l) => l && l.includes(", "));
      let homeSharedRegion = null;
      if (homeCommaLabels.length > 0) {
        const getTail = (l) => l.slice(l.lastIndexOf(", ") + 2);
        const firstTail = getTail(homeCommaLabels[0]);
        if (homeCommaLabels.every((l) => getTail(l) === firstTail)) {
          homeSharedRegion = firstTail;
        }
      }
      for (const a of homeAreas) {
        if (a.ownerNamed || !homeSharedRegion || !a.words.endsWith(", " + homeSharedRegion)) {
          a.listLabel = a.words;
        } else {
          a.listLabel = a.words.slice(0, a.words.lastIndexOf(", "));
        }
      }

      const anchorStops = drawableStops.filter((s) => s.cellId === anchorId);
      anchorStops.sort((a, b) => b.days.length - a.days.length || stops.indexOf(a) - stops.indexOf(b));
      const topAnchorStop = anchorStops[0];
      const homePlaceName = topAnchorStop?.town || cutComma(topAnchorStop?.label) || window.JournalI18n.render('journal.window.map.window.explanation.a.place.in.your.journal');
      const homeChoice = {
        id: "home",
        trip: false,
        name: window.JournalI18n.render('journal.window.map.month.area.around', [['name', String(homePlaceName)]]),
        placeName: homePlaceName,
        dateLabel: null,
        days: homeDays,
        areas: homeAreas,
        sharedRegion: homeSharedRegion,
        notDrawn: countNotDrawn(homeNearStops),
        test: (s) => !s.drawable || !far(s),
      };
      choices.push(homeChoice);

      // Trips
      for (const r of runs) {
        const rSet = new Set(r.days);
        const tripTest = (s) => s.drawable && far(s) && s.days.some((d) => rSet.has(d));
        const tripStops = stops.filter(tripTest);
        const tripAreas = buildAreasForStops(tripStops);

        const tripCommaLabels = tripAreas.map((a) => a.label).filter((l) => l && l.includes(", "));
        let tripSharedRegion = null;
        if (tripCommaLabels.length > 0) {
          const getTail = (l) => l.slice(l.lastIndexOf(", ") + 2);
          const firstTail = getTail(tripCommaLabels[0]);
          if (tripCommaLabels.every((l) => getTail(l) === firstTail)) {
            tripSharedRegion = firstTail;
          }
        }
        for (const a of tripAreas) {
          if (a.ownerNamed || !tripSharedRegion || !a.words.endsWith(", " + tripSharedRegion)) {
            a.listLabel = a.words;
          } else {
            a.listLabel = a.words.slice(0, a.words.lastIndexOf(", "));
          }
        }

        const topTripArea = tripAreas[0];
        const topTripStop = topTripArea ? [...topTripArea.entries].sort((a, b) => b.days.length - a.days.length || stops.indexOf(a) - stops.indexOf(b))[0] : null;
        const tripPlaceName = topTripStop?.town || cutComma(topTripStop?.label) || window.JournalI18n.render('journal.window.map.window.explanation.a.place.in.your.journal');
        const dateLabel = r.days.length === 1 ? shortDay(r.days[0]) : `${shortDay(r.days[0])}–${parseInt(r.days[r.days.length - 1].slice(6, 8), 10)}`;

        choices.push({
          id: `trip-${r.days[0]}`,
          trip: true,
          name: tripPlaceName,
          dateLabel,
          days: [...r.days].sort(),
          areas: tripAreas,
          sharedRegion: tripSharedRegion,
          notDrawn: { hiddenPlaces: 0, wide: 0, wideStops: [] },
          test: tripTest,
        });
      }
    }

    const topNotDrawn = choices.length > 0 ? choices[0].notDrawn : countNotDrawn(stops);

    // Calendar days
    const calendarDays = [];
    for (let d = 1; d <= totalDaysInMonth; d++) {
      const dStr = `${month}${String(d).padStart(2, "0")}`;
      const backendDay = asArray(data.days).find((x) => x.day === dStr);
      const hasLoc = !!backendDay?.has_location;
      const readings = asArray(backendDay?.devices).reduce((sum, dev) => sum + (dev.readings || 0), 0);
      const unreadable = asArray(backendDay?.devices).some((dev) => (dev.unreadable_lines || 0) > 0 || (dev.unreadable_files || 0) > 0);
      const interrupted = asArray(backendDay?.devices).reduce((sum, dev) => sum + (dev.interrupted_segments || 0), 0);

      let state = "no-location";
      const dayStops = stops.filter((s) => s.days.includes(dStr));
      if (dayStops.length > 0) {
        state = "stops";
      } else if (hasLoc) {
        if (readings === 0 && unreadable) {
          state = "unreadable";
        } else if (readings > 0) {
          state = "no-stops";
        } else {
          state = "kept";
        }
      } else if (dStr > effToday) {
        state = "future";
      }

      const inChoices = choices.filter((c) => c.days.includes(dStr)).map((c) => c.id);
      calendarDays.push({
        day: dStr,
        state,
        inChoices,
        readings,
        unreadable,
        interrupted,
        interruptions: asArray(backendDay?.devices).filter((dev) => (dev.interrupted_segments || 0) > 0).map((dev) => ({ word: dev.word || "phone", word_key: dev.word_key, count: dev.interrupted_segments })),
        backendDay,
      });
    }

    const mCount = calendarDays.filter((d) => d.state !== "future").length;
    const noLocCount = calendarDays.filter((d) => d.state === "no-location").length;

    const projectedTowns = asArray(data.towns).map((t) => {
      const [x, y] = project(t.lat, t.lon);
      return { name: t.name, x, y, lat: t.lat, lon: t.lon, population: t.population };
    });

    return {
      month,
      previous: data.previous || null,
      next: data.next || null,
      monthName,
      previousMonthName,
      previousMonthLastDay,
      year,
      today: effToday,
      m: mCount,
      noLocation: noLocCount,
      journalHasLocation: !!data.journal_has_location,
      anchorId,
      stops,
      choices,
      notDrawn: topNotDrawn,
      days: calendarDays,
      towns: projectedTowns,
      project,
    };
  }

  async function renderMonth(data) {

    // The map's size and scale for the current view: k is pixels per metre,
    // (mx, my) the centre drawn, (cx, cy) the fitted centre before panning.
    function frame() {
      const list = activeChoice ? activeChoice.areas : [];
      const W = Math.max(280, root.querySelector("[data-map-month-map]").clientWidth || 600);
      const narrow = W < 560;
      const fit = view.all || (activeChoice && activeChoice.trip) ? list : coreOf(list);
      const pts = fit.flatMap((c) => c.ring);
      let x0 = Math.min(...pts.map((p) => p[0])), x1 = Math.max(...pts.map((p) => p[0]));
      let y0 = Math.min(...pts.map((p) => p[1])), y1 = Math.max(...pts.map((p) => p[1]));
      if (pts.length === 0) {
        x0 = -500; x1 = 500; y0 = -500; y1 = 500;
      }
      const aspect = (y1 - y0 + 800) / (x1 - x0 + 800);
      const H = Math.round(W * Math.min(narrow ? 1.1 : 0.8, Math.max(narrow ? 1 : 0.62, aspect)));
      const padM = Math.max(250, (x1 - x0) * 0.07, (y1 - y0) * 0.07);
      x0 -= padM; x1 += padM; y0 -= padM; y1 += padM;
      const k = Math.min((W - 24) / (x1 - x0), (H - 72) / (y1 - y0)) * view.z;
      const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
      return { list, W, H, k, cx, cy, mx: cx + view.dx, my: cy + view.dy };
    }

    // A parent cell holding several areas zooms the map to those areas. It
    // returns false, leaving the view as it was, when that can't draw them any
    // larger (the zoom is already at its limit).
    function zoomToParent(g) {
      const before = { ...view };
      Object.assign(view, { z: 1, dx: 0, dy: 0, all: true });
      const base = frame();
      const pts = g.kids.flatMap((c) => c.ring);
      const bx0 = Math.min(...pts.map((p) => p[0])), bx1 = Math.max(...pts.map((p) => p[0]));
      const by0 = Math.min(...pts.map((p) => p[1])), by1 = Math.max(...pts.map((p) => p[1]));
      const pad = Math.max(250, (bx1 - bx0) * 0.07, (by1 - by0) * 0.07);
      const want = Math.min((base.W - 24) / (bx1 - bx0 + 2 * pad), (base.H - 72) / (by1 - by0 + 2 * pad)) / base.k;
      const z = Math.min(12, Math.max(1, want));
      if (base.k * z <= lastK * 1.01) {
        Object.assign(view, before);
        return false;
      }
      Object.assign(view, { z, dx: (bx0 + bx1) / 2 - base.cx, dy: (by0 + by1) / 2 - base.cy });
      return true;
    }

    function renderMapSvg() {
      const wrap = root.querySelector("[data-map-month-svg]");

        const notDrawnHtml = items.length

        wrap.innerHTML = `<p class="map-muted" style="padding: 16px;" data-map-month-nothing>${window.JournalI18n.renderHtml('journal.window.map.visible.text.no.stops.to.draw.this.month')}</p>${notDrawnHtml}`;
