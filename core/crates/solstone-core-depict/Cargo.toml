[package]
name = "solstone-core-depict"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
full-tests = []

# No unit tests live in this target, so the unit gate builds no harness for it.
[[bin]]
name = "solstone-core-depict"
path = "src/main.rs"
test = false

[dependencies]
solstone-core-cli-copy.workspace = true
solstone-core-segment.workspace = true
base64 = "0.22.1"
env_logger.workspace = true
image.workspace = true
jiff.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
solstone-core-assets.workspace = true
solstone-core-installed-payload.workspace = true
solstone-core-local.workspace = true
solstone-core-journal-io.workspace = true
solstone-core-journal.workspace = true
solstone-core-generate.workspace = true
solstone-core-processing-record.workspace = true

solstone-core-system.workspace = true
solstone-core-time.workspace = true
toml_edit = { workspace = true, features = ["serde"] }

[dev-dependencies]
solstone-core-local = { workspace = true, features = ["test-hooks"] }
temp-env = "0.3.6"
tempfile = "3.24.0"

[lints]
workspace = true
