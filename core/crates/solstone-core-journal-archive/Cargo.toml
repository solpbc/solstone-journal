[package]
name = "solstone-core-journal-archive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["dir", "user"] }
solstone-core-journal-io = { workspace = true }

[target.'cfg(windows)'.dependencies]
solstone-core-journal-io = { workspace = true }

[lints]
workspace = true

[features]
test-hooks = ["solstone-core-journal-io/test-hooks"]

[[test]]
name = "archive_fault_boundaries"
path = "tests/archive_fault_boundaries.rs"
required-features = ["test-hooks"]

[dev-dependencies]
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["fs"] }
