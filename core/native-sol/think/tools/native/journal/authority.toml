[[entries]]
path=["journal","search"]
kind="command"
help="Search the journal index.\n\nUse 2-4 content terms instead of natural-language questions; question words\nlike what/how/did/when add noise in this keyword/BM25 index. Syntax: OR for\nany term, quoted phrases for exact text, and * for prefix matches. Zero\nresults means zero: broaden by dropping terms, using OR, then adding *.\nCounts help drill down with --facet, --agent, --day, and --time-bucket.\nRead one result as last indexed with `solstone call journal read --path PATH --idx IDX --entry-id ENTRY_ID`. Copy all three fields from the same result; do not use its display id as a file path."
operation_id="journal.search"
entry_type="http"
method="GET"
route="/app/search/api/search"
handler="search"
params=[{name="query",kind="argument",type="text",required=false,nargs=1,multiple=false,default="",options=["query"],secondary=[],hidden=false,is_flag=false,count=false},{name="query_opt",kind="option",type="text",required=false,nargs=1,multiple=false,options=["--query","-q"],secondary=[],hidden=false,is_flag=false,count=false},{name="limit",kind="option",type="integer",required=false,nargs=1,multiple=false,default=10,options=["--limit","-n"],secondary=[],hidden=false,is_flag=false,count=false},{name="offset",kind="option",type="integer",required=false,nargs=1,multiple=false,default=0,options=["--offset"],secondary=[],hidden=false,is_flag=false,count=false},{name="day",kind="option",type="text",required=false,nargs=1,multiple=false,options=["--day","-d"],secondary=[],hidden=false,is_flag=false,count=false},{name="day_from",kind="option",type="text",required=false,nargs=1,multiple=false,options=["--day-from"],secondary=[],hidden=false,is_flag=false,count=false},{name="day_to",kind="option",type="text",required=false,nargs=1,multiple=false,options=["--day-to"],secondary=[],hidden=false,is_flag=false,count=false},{name="facet",kind="option",type="text",required=false,nargs=1,multiple=false,options=["--facet","-f"],secondary=[],hidden=false,is_flag=false,count=false},{name="agent",kind="option",type="text",required=false,nargs=1,multiple=false,options=["--agent","-a"],secondary=[],hidden=false,is_flag=false,count=false},{name="stream",kind="option",type="text",required=false,nargs=1,multiple=false,options=["--stream"],secondary=[],hidden=false,is_flag=false,count=false},{name="time_bucket",kind="option",type="text",required=false,nargs=1,multiple=false,options=["--time-bucket"],secondary=[],hidden=false,is_flag=false,count=false},{name="json_output",kind="option",type="boolean",required=false,nargs=1,multiple=false,default=false,options=["--json"],secondary=[],hidden=false,is_flag=true,count=false,flag_value=true}]

