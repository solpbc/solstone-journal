schema = "native-sol-authority-v1"
source = "command.rs"

[[entries]]
surface = "sol-chat"
path = ["chat"]
kind = "top-level"
help = "Chat with your journal"
operation_id = "chat.top_level"
entry_type = "top-level-chat"
handler = "chat"
backing_contract_operation_ids = ["chat.postMessage", "chat.session", "callosum.rootEvents"]
params = [
  { name = "message", kind = "argument", type = "text", required = false, nargs = -1, multiple = false, options = ["message"], secondary = [], hidden = false, is_flag = false, count = false },
  { name = "facet", kind = "option", type = "text", required = false, nargs = 1, multiple = false, options = ["--facet"], secondary = [], hidden = false, is_flag = false, count = false },
  { name = "verbose", kind = "option", type = "boolean", required = false, nargs = 1, multiple = false, default = false, options = ["-v", "--verbose"], secondary = [], hidden = false, is_flag = true, count = false, flag_value = true },
  { name = "debug", kind = "option", type = "boolean", required = false, nargs = 1, multiple = false, default = false, options = ["-d", "--debug"], secondary = [], hidden = false, is_flag = true, count = false, flag_value = true },
]
