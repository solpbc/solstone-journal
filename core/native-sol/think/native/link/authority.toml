schema = "native-sol-authority-v1"
source = "command.rs"

[[entries]]
surface = "sol-link"
path = ["link", "join"]
kind = "top-level"
help = "join a solstone with a short code or pair link"
operation_id = "link.join"
entry_type = "top-level-link"
handler = "link_join"
params = [
  { name = "home", kind = "option", type = "text", required = false, nargs = 1, multiple = false, options = ["--home"], secondary = [], hidden = false, is_flag = false, count = false },
  { name = "code", kind = "option", type = "text", required = true, nargs = 1, multiple = false, options = ["--code"], secondary = [], hidden = false, is_flag = false, count = false },
  { name = "as_role", kind = "option", type = "text", required = false, nargs = 1, multiple = false, options = ["--as"], secondary = [], hidden = false, is_flag = false, count = false },
  { name = "label", kind = "option", type = "text", required = false, nargs = 1, multiple = false, options = ["--label"], secondary = [], hidden = false, is_flag = false, count = false },
]

[[entries]]
surface = "sol-link"
path = ["link", "serve"]
kind = "top-level"
help = "serve a paired journal over the local link bridge"
operation_id = "link.serve"
entry_type = "top-level-link"
handler = "link_serve"
resident = true
params = [
  { name = "label", kind = "option", type = "text", required = false, nargs = 1, multiple = false, options = ["--label"], secondary = [], hidden = false, is_flag = false, count = false },
  { name = "port", kind = "option", type = "integer", required = false, nargs = 1, multiple = false, default = 5015, options = ["--port"], secondary = [], hidden = false, is_flag = false, count = false },
  { name = "relay_url", kind = "option", type = "text", required = false, nargs = 1, multiple = false, options = ["--relay-url"], secondary = [], hidden = false, is_flag = false, count = false },
  { name = "direct", kind = "option", type = "boolean", required = false, nargs = 1, multiple = false, default = false, options = ["--direct"], secondary = [], hidden = false, is_flag = true, count = false, flag_value = true },
  { name = "relay_only", kind = "option", type = "boolean", required = false, nargs = 1, multiple = false, default = false, options = ["--relay-only"], secondary = [], hidden = false, is_flag = true, count = false, flag_value = true },
]

[[entries]]
surface = "sol-link"
path = ["link", "status"]
kind = "top-level"
help = "show link status and observed remote journal version"
operation_id = "link.top_level_status"
entry_type = "top-level-link"
handler = "link_status"
params = [
  { name = "label", kind = "option", type = "text", required = false, nargs = 1, multiple = false, options = ["--label"], secondary = [], hidden = false, is_flag = false, count = false },
]
