schema = "native-sol-authority-v1"
source = "command.rs"

[[entries]]
path = ["facets", "list-candidates"]
kind = "command"
help = "List recorded facet review candidates."
operation_id = "facets.list-candidates"
entry_type = "http"
method = "GET"
route = "/app/curation/api/facet/candidates"
contract_operation_id = "facets.list-candidates"
handler = "list_candidates"
params = [
  { name = "status", kind = "option", type = "text", required = false, nargs = 1, multiple = false, options = ["--status"], secondary = [], hidden = false, is_flag = false, count = false },
  { name = "json_output", kind = "option", type = "boolean", required = false, nargs = 1, multiple = false, default = false, options = ["--json"], secondary = [], hidden = false, is_flag = true, count = false, flag_value = true },
]

