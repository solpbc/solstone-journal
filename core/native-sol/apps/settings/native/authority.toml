  { name = "pronouns", kind = "option", type = "text", required = false, nargs = 1, multiple = false, options = ["--pronouns"], secondary = [], hidden = false, is_flag = false, count = false },
  { name = "add_email", kind = "option", type = "text", required = false, nargs = 1, multiple = false, options = ["--add-email"], secondary = [], hidden = false, is_flag = false, count = false },
  { name = "remove_email", kind = "option", type = "text", required = false, nargs = 1, multiple = false, options = ["--remove-email"], secondary = [], hidden = false, is_flag = false, count = false },
  { name = "add_alias", kind = "option", type = "text", required = false, nargs = 1, multiple = false, options = ["--add-alias"], secondary = [], hidden = false, is_flag = false, count = false },
  { name = "remove_alias", kind = "option", type = "text", required = false, nargs = 1, multiple = false, options = ["--remove-alias"], secondary = [], hidden = false, is_flag = false, count = false },
]

