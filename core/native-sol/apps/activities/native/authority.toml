  { name = "to_day", kind = "option", type = "text", required = false, nargs = 1, multiple = false, options = ["--to"], secondary = [], hidden = false, is_flag = false, count = false },
  { name = "facet", kind = "option", type = "text", required = false, nargs = 1, multiple = false, options = ["--facet", "-f"], secondary = [], hidden = false, is_flag = false, count = false },
  { name = "activity", kind = "option", type = "text", required = false, nargs = 1, multiple = false, options = ["--activity", "-a"], secondary = [], hidden = false, is_flag = false, count = false },
  { name = "entity", kind = "option", type = "text", required = false, nargs = 1, multiple = false, options = ["--entity"], secondary = [], hidden = false, is_flag = false, count = false },
  { name = "source", kind = "option", type = "text", required = false, nargs = 1, multiple = false, options = ["--source"], secondary = [], hidden = false, is_flag = false, count = false },
  { name = "include_all", kind = "option", type = "boolean", required = false, nargs = 1, multiple = false, default = false, options = ["--all"], secondary = [], hidden = false, is_flag = true, count = false, flag_value = true },
