[[entries]]
path = ["speakers", "attribute-segment"]
kind = "command"
help = "Run speaker attribution (Layers 1-3) on a single segment.\n\nClassifies each sentence using owner detection, structural heuristics,\nand acoustic voiceprint matching.  Optionally writes speaker_labels.json\nand accumulates high-confidence voiceprints."
operation_id = "speakers.attribute-segment"
entry_type = "http"
method = "POST"
route = "/app/speakers/api/attribute-segment"
contract_operation_id = "speakers.attribute-segment"
handler = "attribute_segment"
params = [
  { name = "day", kind = "argument", type = "text", required = true, nargs = 1, multiple = false, options = ["day"], secondary = [], hidden = false, is_flag = false, count = false },
  { name = "stream", kind = "argument", type = "text", required = true, nargs = 1, multiple = false, options = ["stream"], secondary = [], hidden = false, is_flag = false, count = false },
  { name = "segment", kind = "argument", type = "text", required = true, nargs = 1, multiple = false, options = ["segment"], secondary = [], hidden = false, is_flag = false, count = false },
  { name = "commit", kind = "option", type = "boolean", required = false, nargs = 1, multiple = false, default = false, options = ["--commit"], secondary = [], hidden = false, is_flag = true, count = false, flag_value = true },
  { name = "save", kind = "option", type = "boolean", required = false, nargs = 1, multiple = false, default = true, options = ["--save"], secondary = ["--no-save"], hidden = false, is_flag = true, count = false, flag_value = true },
  { name = "accumulate", kind = "option", type = "boolean", required = false, nargs = 1, multiple = false, default = true, options = ["--accumulate"], secondary = ["--no-accumulate"], hidden = false, is_flag = true, count = false, flag_value = true },
  { name = "json_output", kind = "option", type = "boolean", required = false, nargs = 1, multiple = false, default = false, options = ["--json"], secondary = [], hidden = false, is_flag = true, count = false, flag_value = true },
]

