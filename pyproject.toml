[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solstone"
version = "2.0.0"
description = "Navigate Life Intelligently"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "AGPL-3.0-only"}
authors = [
    {name = "sol pbc"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["audio", "transcription", "screenshot", "multimodal", "ai", "gemini"]

dependencies = [
    # The thin `sol` access surface only. `pip install solstone` (the default)
    # is a thin client that talks to a journal — it carries NO provider SDKs,
    # no AI/media/ML runtime, no Flask. Install a journal host through
    # `pip install solstone-journal` or `pip install solstone-journal-cuda`.
    #
    # This partition is the boundary the access-surface import-clean guard
    # (scripts/check_access_imports_clean.py) and the extras-consistency lint
    # (scripts/check_extras_consistency.py) enforce. Adding a dependency here
    # must keep the `sol` access commands import-clean — do not add anything the
    # journal host needs; that belongs in [journal-host] below.
    "setproctitle",
    "typer",
    "requests",
    "psutil",
    "userpath>=1.9.2,<2",
]

[project.optional-dependencies]
# ---------------------------------------------------------------------------
# Install menu. `pip install solstone` is the thin access client above.
# The journal is now its own package:
#
#   pip install solstone-journal          # the journal (CPU)
#   pip install solstone-journal-cuda     # the journal on NVIDIA CUDA
#
# [journal] and [journal-cuda] are retired tombstones that fail loudly and point
# old installs at the new leaf packages. They no longer install the journal.
#
# [journal-host], [pdf-import], and [pdf] remain internal building blocks.
# The leaf packages compose [journal-host] with the CPU ONNX runtime.
# PDF export is dropped. [pdf] is the import extra.
#
# Base solstone owns the public POSIX launchers. The platform-native
# `solstone-core` executable is installed as the launcher sibling. Install exactly
# one journal leaf; the CPU and GPU ONNX wheels own the same `onnxruntime/`
# import dir and clobber each other.
# ---------------------------------------------------------------------------
pdf-import = [
    "pypdfium2>=5.11,<6",
    "Pillow>=11.0.0",
]

pdf = [
    "solstone[pdf-import]",
]

# The full journal-host stack EXCEPT the ONNX runtime package (which is the
# CPU-vs-CUDA choice made by the solstone-journal leaf packages). Not a
# user-facing extra — always pulled in by a leaf package.
journal-host = [
    "python-dotenv",
    # Private-link host/runtime helpers: local CA, CSR/cert handling, secure
    # listener pairing, and PL transfer. Public `sol link` caller commands are
    # native.
    "cryptography>=42,<47",
    # Host/shared private-link TLS memory-BIO support. Public caller CLI is
    # native; Python keeps the home-side and test/runtime TLS helpers.
    "pyOpenSSL>=24.0",
    # Journal mark derivation (`solstone/think/link/mark.py`) remains
    # host/shared, not thin access.
    "argon2-cffi",
    # PL tunnel runtime. Native `sol link` owns caller CLI dispatch.
    "websockets>=13.0",
    "Flask[async]",
    "Markdown",
    "mistune",
    "python-frontmatter",
    "packaging",
    "Pillow>=11.0.0",
    "numpy",
    "tokenizers>=0.20",
    "av",
    "openai>=1.2.0",
    "huggingface-hub>=0.24",
    "httpx",
    "h2",
    "jsonschema>=4.26,<5",
    "genai-prices",
    "icalendar",
    "blessed>=1.20.0",
    "tzlocal",
    "python-slugify",
    "rapidfuzz",
    # Audio processing
    "soundfile",
    # Media processing
    "opencv-python-headless",
    # PDF folds into the journal host ("choose journal, get it all"). Referenced
    # via the building-block extra so the per-feature hints stay in sync.
    "solstone[pdf]",
]

# TOMBSTONE. The journal moved out of the root distribution into its own
# packages. `solstone[journal]` and the `solstone-journal-host` shim are retired;
# this extra now pins a build-fails-by-design tombstone so every old spelling
# fails loudly at install time instead of silently thin-installing. Install the
# journal via:
#     pip install solstone-journal          # the journal (CPU)
#     pip install solstone-journal-cuda     # the journal on NVIDIA CUDA
# The pin is STATIC (never rewritten per release)
# and check_extras_consistency.py verify it stays exactly this.
journal = ["solstone-journal-host==0.7.0"]

# TOMBSTONE (see [journal] above). Retired — same loud-failure tombstone pin.
# Install `solstone-journal-cuda` for the NVIDIA CUDA runtime.

[project.urls]
Homepage = "https://github.com/solpbc/solstone-journal"
Repository = "https://github.com/solpbc/solstone-journal"
Documentation = "https://github.com/solpbc/solstone-journal/blob/main/README.md"
"Bug Tracker" = "https://github.com/solpbc/solstone-journal/issues"

[tool.setuptools]
# Raw root launchers are script-file payloads, not console entry points, so
# uv-tool exports the root-owned public commands while dependency-owned core
# scripts stay inside the tool environment.
script-files = [
    "scripts/root-launchers/solstone",
]

# Package data is included wholesale via MANIFEST.in (`graft solstone`) plus the
# include-package-data flag below. We deliberately do NOT hand-maintain per-subdir
# package-data globs: that curated list repeatedly dropped data files added in new
# subdirectories — the installed wheel would silently omit e.g.
# solstone/think/contract/layout.json while source-tree `make ci` stayed green,
# hard-500ing observer ingest. Including every non-.py file under solstone/ is the
# correct default here: the long tail of .json/.md/.html/.schema.json data files
# is intentionally shipped. If a file lives under solstone/ at build time, it
# ships. New data file → no pyproject edit required.
include-package-data = true

[tool.setuptools.packages.find]
include = ["solstone*"]
exclude = ["*.tests", "*.tests.*"]

[tool.uv]
# Some published dependencies must NOT resolve during workspace development.
# Tombstones are build-fails-by-design distributions; the speakers-analyze and
# vad-analyze helpers are real workspace members, but their editable builds need
# ONNX Runtime staging that only the release wheel-build targets produce. Unit
# tests exercise the native adapters with fakes and keep the frozen Python
# oracles under tests/.
# The marker `python_version < '3.12'` contradicts requires-python = ">=3.12", so
# uv drops each override from the active dev environment. [tool.uv] is never
# published, so end-user wheel METADATA still carries the real pins.

[tool.ruff]
target-version = "py312"
exclude = [".venv", "scratch", "logs", "build", "dist"]

[tool.ruff.lint]
select = ["F", "E", "W", "I"]
ignore = ["E501", "E203", "E402"]

[dependency-groups]
dev = [
    "ruff",
    "setuptools",
]
